# needed by: kstars (Ekos drives telescopes, cameras and focusers through INDI).
name = "indi"
version = "2.2.5"
release = 1
summary = "Instrument Neutral Distributed Interface (telescope and camera control)"
license = "LGPL-2.1-or-later"
homepage = "https://indilib.org"
hostdeps = ["cmake", "ninja", "pkgconf"]
builddeps = ["cfitsio-devel", "libnova-devel", "libusb-devel", "zlib-ng-compat-devel", "curl-devel", "gsl-devel", "fftw-devel", "libjpeg-turbo-devel", "libev-devel", "libtheora-devel", "eudev-devel"]
options = ["!check"]

source = [
    { url = "https://github.com/indilib/indi/archive/refs/tags/v2.2.5.tar.gz", sha256 = "938cae0b3bfbd34e73ae797bd4a0e5a64fe21753d2b560d88cafab0c61771628" },
]

setup = '''
# clang 23's -Wunused-but-set-global under indi's -Werror (sharedblob.c): off
# after its -Wall -Werror (an earlier -Wno- in CFLAGS is undone by -Wall)
sed -i 's|SET(COMP_FLAGS "${COMP_FLAGS} -Werror")|SET(COMP_FLAGS "${COMP_FLAGS} -Werror -Wno-unused-but-set-global")|' cmake_modules/CMakeCommon.cmake
grep -q 'Werror -Wno-unused-but-set-global' cmake_modules/CMakeCommon.cmake
# libs/sockets/select.h uses fd_set and struct timeval from <sys/select.h>,
# which glibc's <sys/socket.h> brings in and musl's does not
sed -i 's|^#include <sys/socket.h> // select$|#include <sys/socket.h> // select\n#include <sys/select.h>|' libs/sockets/select.h
grep -q '^#include <sys/select.h>$' libs/sockets/select.h
%cmake \
    -DINDI_BUILD_UNITTESTS=OFF \
    -DUDEVRULES_INSTALL_DIR=/usr/lib/udev/rules.d
'''
build = '''
%cmake_build
'''
install = '''
%cmake_install
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/indi/LICENSE"
'''
