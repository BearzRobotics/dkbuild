# needed by: kstars (Ekos drives telescopes, cameras and focusers through INDI).
name = "indi"
version = "2.2.5"
release = 2
summary = "Instrument Neutral Distributed Interface (telescope and camera control)"
license = "LGPL-2.1-or-later"
homepage = "https://indilib.org"
hostdeps = ["cmake", "ninja", "pkgconf"]
builddeps = ["cfitsio-devel", "libnova-devel", "libusb-devel", "zlib-ng-compat-devel", "curl-devel", "gsl-devel", "fftw-devel", "libjpeg-turbo-devel", "libev-devel", "libtheora-devel", "eudev-devel"]
options = ["!check"]
patches = ["serializedmsg-ssize_t.patch"]

source = [
    { url = "https://github.com/indilib/indi/archive/refs/tags/v2.2.5.tar.gz", sha256 = "938cae0b3bfbd34e73ae797bd4a0e5a64fe21753d2b560d88cafab0c61771628" },
]

setup = '''
# no -Werror: clang 23 warns about more than indi was written against
# (-Wunused-but-set-global in sharedblob.c, -Wsign-compare with musl's types
# in baseclient.cpp)
sed -i 's|SET(COMP_FLAGS "${COMP_FLAGS} -Werror")|SET(COMP_FLAGS "${COMP_FLAGS}")|' cmake_modules/CMakeCommon.cmake
! grep -q 'COMP_FLAGS} -Werror' cmake_modules/CMakeCommon.cmake
# libs/sockets/select.h uses fd_set and struct timeval from <sys/select.h>,
# which glibc's <sys/socket.h> brings in and musl's does not
sed -i 's|^#include <sys/socket.h> // select$|#include <sys/socket.h> // select\n#include <sys/select.h>|' libs/sockets/select.h
grep -q '^#include <sys/select.h>$' libs/sockets/select.h
# libc++ 23 no longer brings in standard headers through others: every file
# gets the ones whose names it uses (errno in indiserver/LocalDvrInfo.cpp, ...);
# the C names, which C and C++ both take, and <algorithm> in C++ only
add() {
    for f in $(grep -rlE "$2" $3 . | xargs -r grep -LE "#include <($1)>"); do
        h=${1%%|*}
        sed -i "0,/^#include/s//#include <$h>\n#include/" "$f"
    done
}
add 'errno.h|cerrno' '\berrno\b' "--include=*.cpp --include=*.c --include=*.h"
add 'string.h|cstring' '\b(memcpy|memset|memcmp|strlen|strcmp|strncmp|strcpy|strerror)\b' "--include=*.cpp --include=*.c --include=*.h"
add 'stdlib.h|cstdlib' '\b(getenv|malloc|free|atoi|strtol|exit|abs)\b' "--include=*.cpp --include=*.c --include=*.h"
add algorithm 'std::(copy|fill|min|max|sort|find|find_if|transform|remove_if|for_each)\b' "--include=*.cpp --include=*.hpp"
# pthread types (myfocuserpro2.h's pthread_mutex_t, ...) come from <pthread.h>,
# which libc++ 23's headers no longer pull in
add pthread.h '\bpthread_(mutex_t|mutex_lock|mutex_unlock|mutex_init|t|create|join|cond_t)\b' "--include=*.cpp --include=*.c --include=*.h"
grep -q '^#include <pthread.h>' drivers/focuser/myfocuserpro2.h
grep -q '^#include <errno.h>' indiserver/LocalDvrInfo.cpp
%cmake \
    -DINDI_BUILD_UNITTESTS=OFF \
    -DUDEVRULES_INSTALL_DIR=/usr/lib/udev/rules.d
'''
build = '''
%cmake_build
'''
install = '''
%cmake_install
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/indi/LICENSE"
'''
