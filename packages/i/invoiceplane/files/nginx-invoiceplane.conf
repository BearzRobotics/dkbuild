# InvoicePlane under nginx with php-fpm (/run/php-fpm.sock, or the pool in
# php-fpm-invoiceplane.conf). Copy to /etc/nginx/http.d/invoiceplane.conf, set
# server_name and TLS, and add nginx's user to the _php group.
server {
    listen 80;
    server_name invoices.example.org;
    root /usr/share/invoiceplane;
    index index.php;
    client_max_body_size 20M;

    location / { try_files $uri $uri/ /index.php$is_args$args; }
    location ~ ^/index\.php(/|$) {
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_pass unix:/run/php-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
    # only index.php runs; the code, configuration, uploads and logs are not served
    location ~ \.php$ { return 404; }
    location ~ ^/(application|vendor|storage|uploads/(archive|customer_files|import|temp)|composer\.|ipconfig) { deny all; }
    location ~ /\. { deny all; }
}
