name = "iwd"
version = "3.12"
release = 3
summary = "Wireless daemon that replaces wpa_supplicant"
license = "LGPL-2.1-or-later"
homepage = "https://iwd.wiki.kernel.org"
patches = ["fix-dbus-stuff.patch", "fix-groups.patch", "resolvconf-default.patch"]
hostdeps = ["pkgconf", "python-docutils", "automake", "libtool"]
builddeps = ["dbus-devel", "dbus", "linux-headers", "readline-devel"]
checkdeps = ["python", "dbus"]
rundeps = ["dbus", "openresolv"]
options = ["!check"]

source = [
    { url = "https://www.kernel.org/pub/linux/network/wireless/iwd-3.12.tar.xz", sha256 = "d89a5e45c7180170e19be828f9e944a768c593758094fc57a358d0e7c4cb1a49" },
]

environment = '''
export CFLAGS="${CFLAGS} -Wno-unknown-warning-option -Wno-duplicate-decl-specifier"
'''
setup = '''
autoreconf -if -W none
%configure \
    --disable-optimization \
    --disable-systemd-service \
    --enable-dbus-policy \
    --enable-wired \
    --enable-pie
'''
build = '''
%make
'''
install = '''
%make_install
install -Dm644 $pkgfiles/iwd "$pkgdir/etc/dinit.d/iwd"
install -Dm644 $pkgfiles/ead "$pkgdir/etc/dinit.d/ead"
'''
