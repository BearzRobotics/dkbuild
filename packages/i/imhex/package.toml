name = "imhex"
version = "1.38.1"
release = 2
summary = "Hex editor for reverse engineers"
license = "GPL-2.0-or-later"
homepage = "https://imhex.werwolv.net"
patches = ["fix-lfs64.patch", "inserter.patch", "no-updater.patch"]
hostdeps = ["cmake", "ninja", "pkgconf"]
builddeps = ["libglvnd-devel", "mesa-devel", "capstone-devel", "curl-devel", "dbus-devel", "file-devel", "fmt-devel", "freetype-devel", "glfw-devel", "libarchive-devel", "libedit-devel", "llvm-devel", "mbedtls-devel", "nlohmann-json", "xz-devel", "yara-devel"]

source = [
    { url = "https://github.com/WerWolv/ImHex/releases/download/v1.38.1/Full.Sources.tar.gz", sha256 = "cd3531066a41dde1f0751e5d3146a936897df35ad5ba1fa49a9f3ace88e6901d" },
    { url = "https://github.com/WerWolv/ImHex-Patterns/archive/refs/tags/ImHex-v1.38.1.tar.gz", sha256 = "3aae4c0970bc1b85bf4dc566bdf31de33c7dce593375645600549643ce6f9841" },
]

setup = '''
# libc++ 23 no longer brings in <cstdlib> through other headers: every file
# using its functions (std::strtoull in libwolv's math evaluator, ...) gets it
for f in $(grep -rlE 'std::(strto[a-z]+|getenv|abort|exit|malloc|calloc|realloc|free|atoi|atol|system|qsort|abs|labs|llabs)\b' --include='*.cpp' --include='*.hpp' --include='*.h' . | xargs -r grep -LE '#include <(cstdlib|stdlib.h)>'); do
    sed -i '0,/^#include/s//#include <cstdlib>\n#include/' "$f"
done
grep -q '^#include <cstdlib>' lib/external/libwolv/libs/math_eval/source/math_eval/math_evaluator.cpp
%cmake \
    -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
    -DIMHEX_BUNDLE_DOTNET=OFF \
    -DIMHEX_DISABLE_STACKTRACE=ON \
    -DIMHEX_ENABLE_UNIT_TESTS=ON \
    -DIMHEX_IGNORE_BAD_CLONE=ON \
    -DIMHEX_OFFLINE_BUILD=ON \
    -DIMHEX_STRICT_WARNINGS=OFF \
    -DIMHEX_STRIP_RELEASE=OFF \
    -DUSE_SYSTEM_CAPSTONE=ON \
    -DUSE_SYSTEM_FMT=ON \
    -DUSE_SYSTEM_LLVM=ON \
    -DUSE_SYSTEM_NLOHMANN_JSON=ON \
    -DUSE_SYSTEM_YARA=ON
'''
build = '''
%cmake_build
'''
install = '''
%cmake_install
'''
