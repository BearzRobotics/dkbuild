# After Chimera Linux cports: main/icu. cports is BSD-2-Clause, Copyright (c) Chimera Linux contributors.
# Unicode and locale support. needed by: tesseract's training tools, and later
# Qt, LibreOffice, Firefox/Thunderbird, Boost... Chimera's patches: the data
# directory, pkg-config Requires, and VTIMEZONE output Thunderbird's calendar
# needs.
name = "icu"
version = "78.3"
release = 1
summary = "Unicode and globalization libraries (ICU)"
license = "ICU"
homepage = "https://icu.unicode.org"
patches = ["build.patch", "pc.patch", "standardize-vtzone-output.patch"]
hostdeps = ["pkgconf", "python"]
options = ["!check"]

source = [
    { url = "https://github.com/unicode-org/icu/releases/download/release-78.3/icu4c-78.3-sources.tgz", sha256 = "3a2e7a47604ba702f345878308e6fefeca612ee895cf4a5f222e7955fabfe0c0" },
]

setup = '''
cd source
%configure \
    --with-data-packaging=archive \
    --enable-static
'''
build = '''
cd source
%make
'''
install = '''
cd source
%make_install
install -Dm644 ../LICENSE "$pkgdir/usr/share/licenses/icu/LICENSE"
'''
