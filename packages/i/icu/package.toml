# Unicode and locale support. needed by: tesseract's training tools, and later
# Qt, LibreOffice, Firefox/Thunderbird, Boost... Chimera's patches: the data
# directory, pkg-config Requires, and VTIMEZONE output Thunderbird's calendar
# needs.
# r2 (2026-11-26): icu-libs depends on icu. The data is a separate file (--with-data-packaging=archive: /usr/share/icu/<version>/icudt*.dat)
# that stays in the main package, and a program that needs only the libraries got icu-libs alone: no data (Firefox 159 crashed at start
# on the dkde-devel image's file set). The two packages depend on each other (icu's tools need the libraries).
name = "icu"
version = "78.3"
release = 3
summary = "Unicode and globalization libraries (ICU)"
license = "ICU"
homepage = "https://icu.unicode.org"
patches = ["build.patch", "pc.patch", "standardize-vtzone-output.patch"]
hostdeps = ["pkgconf", "python"]
options = ["!check"]

source = [
    { url = "https://github.com/unicode-org/icu/releases/download/release-78.3/icu4c-78.3-sources.tgz", sha256 = "3a2e7a47604ba702f345878308e6fefeca612ee895cf4a5f222e7955fabfe0c0" },
]

setup = '''
cd source
%configure \
    --with-data-packaging=archive \
    --enable-static
'''
build = '''
cd source
%make
'''
install = '''
cd source
%make_install
install -Dm644 ../LICENSE "$pkgdir/usr/share/licenses/icu/LICENSE"
'''

# the default -libs, plus the dependency on the data (see r2 above). Declared subpackages are matched before -devel, so this one must not
# list /usr/lib/*.so: it would take the development links.
[subpackages.libs]
summary = "Shared libraries"
paths   = ["/usr/lib/*.so.*"]
depends = ["icu"]
