; An optional php-fpm pool of its own for InvoiceShelf. Copy to
; /etc/php/php-fpm.d/invoiceshelf.conf and point nginx's fastcgi_pass at
; unix:/run/php-fpm-invoiceshelf.sock (php-fpm's default www pool also works).
[invoiceshelf]
user = _php
group = _php
listen = /run/php-fpm-invoiceshelf.sock
listen.owner = _php
listen.group = _php
listen.mode = 0660
pm = ondemand
pm.max_children = 10
pm.process_idle_timeout = 60s
php_admin_value[upload_max_filesize] = 20M
php_admin_value[post_max_size] = 20M
php_admin_value[memory_limit] = 256M
