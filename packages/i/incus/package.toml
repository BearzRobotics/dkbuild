# Incus: a manager for system containers (LXC) and virtual machines (QEMU),
# on one host or a cluster, with ZFS/btrfs/LVM storage and bridge, OVS and OVN
# networks; the closest open match to Proxmox (decided 2026-11-11). incusd is
# the daemon (service `incus`), incus the client (incus-client); incus-agent,
# static, runs inside VMs. Users in group _incus-admin manage it; incus-user
# gives others their own projects.
# Based on Chimera Linux cports (BSD-2-Clause): user/incus. Its gtar patch is
# not used (GNU tar is `tar` here).
name = "incus"
# 7.7.0 (from 6.17.0, 2026-11-27, for its security fixes: the 116 advisories on GitHub that day were all fixed by it).
# A major release: it needs Linux 6.12, LXC 6.0, QEMU 8.2, nftables 1.0 and dnsmasq 2.90 (all met by this tree),
# no longer ships lxd-to-incus, and a 6.x server's database is upgraded for good on first start (back it up first;
# see upstream's release notes).
version = "7.7.0"
release = 1
summary = "System container and virtual machine manager"
license = "Apache-2.0"
homepage = "https://linuxcontainers.org/incus"
archs = ["x86_64", "aarch64"]
hostdeps = ["go", "pkgconf"]
builddeps = ["acl-devel", "cowsql-devel", "libcap-devel", "libseccomp-devel", "libuv-devel", "lxc-devel", "raft-devel", "sqlite-devel", "eudev-devel", "linux-headers"]
rundeps = ["acl", "attr", "dnsmasq", "tar", "nftables", "lego", "qemu", "qemu-system-x86", "lxc", "lxcfs", "rsync", "squashfs-tools", "util-linux", "xz"]
options = ["!check", "godeps"]

source = [
    { url = "https://github.com/lxc/incus/archive/v7.7.0.tar.gz", sha256 = "ef78630d34096d00b225489374191aad577d0b370b202dce3e589d9ff5ed7251" },
]

environment = '''
export CGO_ENABLED=1
'''
build = '''
mkdir -p build
# 7.x embeds translation catalogs (po/embed.go) that the tarball does not carry: made first, as upstream's
# `make catalogs` does; without them the build stops on the empty go:embed pattern
CGO_ENABLED=0 go run ./cmd/generate-catalogs po po/catalogs
# the daemon and tools, against the system's SQLite and cowsql
go build -trimpath -tags libsqlite3 -o build/ ./cmd/...
# tools for developing Incus itself, not installed
rm -f build/generate-*
# the VM agent, static (it runs inside any guest): pure Go, as upstream's
# Makefile builds it (CGO_ENABLED=0; a cgo -static-pie link fails: Go asks for
# a non-PIE link)
CGO_ENABLED=0 go build -trimpath -tags "agent netgo osusergo" -o build/ ./cmd/incus-agent
'''
install = '''
for b in build/*; do install -Dm755 "$b" "$pkgdir/usr/bin/$(basename "$b")"; done
install -Dm755 $pkgfiles/incusd.wrapper "$pkgdir/usr/lib/incusd.wrapper"
install -Dm644 $pkgfiles/incus "$pkgdir/etc/dinit.d/incus"
install -Dm644 $pkgfiles/incus-user "$pkgdir/etc/dinit.d/incus-user"
install -Dm644 $pkgfiles/sysusers.conf "$pkgdir/usr/lib/sysusers.d/incus.conf"
install -Dm644 COPYING "$pkgdir/usr/share/licenses/incus/COPYING"
'''

# the client alone, for managing remote Incus servers
[subpackages.client]
summary = "Incus client"
paths   = ["/usr/bin/incus"]
