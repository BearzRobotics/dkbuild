name = "kdsoap"
version = "2.3.0"
release = 1
summary = "Qt-based SOAP component"
license = "MIT"
homepage = "https://www.kdab.com/development-resources/qt-tools/kd-soap"
hostdeps = ["cmake", "ninja", "qt6-qtbase"]
builddeps = ["qt6-qtbase-devel"]

source = [
    { url = "https://github.com/KDAB/KDSoap/releases/download/kdsoap-2.3.0/kdsoap-2.3.0.tar.gz", sha256 = "d2184951145cb768cc30376a10701be13869a164c1272d09f831ba2d195f02de" },
]

environment = '''
export CFLAGS="${CFLAGS} -DNDEBUG"
export CXXFLAGS="${CXXFLAGS} -DNDEBUG"
'''
setup = '''
%cmake \
    -DKDSoap_QT6=ON \
    -DKDSoap_EXAMPLES=OFF \
    -DKDSoap_TESTS=ON
'''
build = '''
%cmake_build
'''
install = '''
%cmake_install
install -Dm644 LICENSE.txt "$pkgdir/usr/share/licenses/kdsoap/LICENSE.txt"
'''
