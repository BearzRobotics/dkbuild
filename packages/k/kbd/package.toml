name = "kbd"
version = "2.7.1"
release = 3
summary = "Linux keyboard utilities"
license = "GPL-2.0-or-later"
homepage = "http://www.kbd-project.org"
patches = ["bsd_install.patch", "chmod-reference.patch", "fix-euro-symbol-es-keymap.patch", "kbd-2.0.2-backspace-1.patch", "path-dump.patch"]
hostdeps = ["automake", "gettext-devel", "libtool", "pkgconf"]
builddeps = ["linux-pam-devel", "linux-headers"]

source = [
    { url = "https://www.kernel.org/pub/linux/utils/kbd/kbd-2.7.1.tar.xz", sha256 = "f167d899d92b56ccf12f6f49355173f93870a95f15d8aeebf5fdcd28a621aca8" },
]

setup = '''
autoreconf -if -W none
%configure --disable-vlock \
    --disable-tests
'''
build = '''
%make
'''
check = '''
%make check
'''
install = '''
%make_install
install -dm755 "$pkgdir/usr/lib/kbd"
mv "$pkgdir/usr/bin/findkeys" "$pkgdir/usr/lib/kbd/findkeys"
for f in sun amiga atari i386/olpc; do rm -rf "$pkgdir/usr/share/keymaps/$f"; done
'''
