# kubectl: the Kubernetes command-line client. Built from the Kubernetes source
# tarball, which carries its dependencies in vendor/ (so no godeps); the version
# is set the way upstream's build does, through k8s.io/component-base/version.
# Shell completions are generated by the built binary. Nothing here talks to a
# cluster at install time and no configuration is shipped.
name = "kubectl"
version = "1.37.2"
release = 1
summary = "Kubernetes command-line client"
license = "Apache-2.0"
homepage = "https://kubernetes.io"
hostdeps = ["go"]
options = ["!check"]

source = [
    { url = "https://github.com/kubernetes/kubernetes/archive/refs/tags/v1.37.2.tar.gz", sha256 = "6b1a4921ce0249a4607528e2b4f211c6aaeb2f03204bcabefabb3f6742ba67b8" },
]

environment = '''
export GOTOOLCHAIN=local GOPROXY=off GOFLAGS="-mod=vendor -trimpath -buildvcs=false" GOCACHE=/tmp/go-cache GOPATH=/tmp/go CGO_ENABLED=0
'''
build = '''
v=v$version
go build -ldflags "-s -w -X k8s.io/component-base/version.gitVersion=$v -X k8s.io/component-base/version.gitMajor=1 -X k8s.io/component-base/version.gitMinor=37 -X k8s.io/component-base/version.gitTreeState=clean -X k8s.io/component-base/version.buildDate=1970-01-01T00:00:00Z" -o kubectl ./cmd/kubectl
for sh in bash fish zsh; do ./kubectl completion $sh > kubectl.$sh; done
'''
install = '''
install -Dm755 kubectl "$pkgdir/usr/bin/kubectl"
install -Dm644 kubectl.bash "$pkgdir/usr/share/bash-completion/completions/kubectl"
install -Dm644 kubectl.fish "$pkgdir/usr/share/fish/vendor_completions.d/kubectl.fish"
install -Dm644 kubectl.zsh "$pkgdir/usr/share/zsh/site-functions/_kubectl"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/kubectl/LICENSE"
'''
