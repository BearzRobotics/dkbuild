# KeePassXC with every feature (browser integration, SSH agent, YubiKey and
# smart cards, KeeShare, Secret Service), no update check.
name = "keepassxc"
version = "2.8.0"
release = 1
summary = "Password manager (KeePass format)"
license = "GPL-3.0-or-later"
homepage = "https://keepassxc.org"
hostdeps = ["cmake", "ninja", "pkgconf", "qt6-qttools", "asciidoctor"]
builddeps = ["qt6-qtbase-devel", "qt6-qtsvg-devel", "botan-devel", "argon2-devel", "qrencode-devel", "minizip-devel", "readline-devel", "zlib-ng-compat-devel", "libusb-devel", "pcsc-lite-devel", "libxtst-devel", "keyutils-devel"]
options = ["!check"]

source = [
    { url = "https://github.com/keepassxreboot/keepassxc/releases/download/2.8.0/keepassxc-2.8.0-src.tar.xz", sha256 = "4ed4b77d375f021fc04648c257fedfb41dc13c6bd5c4965d8ded31284c9c653c" },
]

setup = '''
%cmake \
    -DWITH_XC_ALL=ON \
    -DWITH_XC_UPDATECHECK=OFF \
    -DWITH_TESTS=OFF \
    -DKEEPASSXC_BUILD_TYPE=Release
'''
build = '''
%cmake_build
'''
install = '''
%cmake_install
install -Dm644 COPYING "$pkgdir/usr/share/licenses/keepassxc/COPYING"
'''
