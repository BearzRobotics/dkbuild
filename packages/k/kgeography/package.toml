# KDE Edu (Gear 26.08.3), for FenrirOS's education set.
name = "kgeography"
version = "26.08.3"
release = 1
summary = "Geography trainer (countries, capitals, flags)"
license = "GPL-2.0-or-later"
homepage = "https://apps.kde.org/kgeography/"
hostdeps = ["cmake", "ninja", "pkgconf", "extra-cmake-modules", "qt6-qttools", "gettext"]
builddeps = ["qt6-qtbase-devel", "kconfigwidgets-devel", "kcoreaddons-devel", "kcrash-devel", "kdoctools-devel", "ki18n-devel", "kiconthemes-devel", "kitemviews-devel", "kwidgetsaddons-devel", "kxmlgui-devel"]
options = ["!check"]

source = [
    { url = "https://download.kde.org/stable/release-service/26.08.3/src/kgeography-26.08.3.tar.xz", sha256 = "5faa0579ef7cb908c202fc732ff66250f111abe8439dea5390639385f8ce85f0" },
]

setup = '''
%cmake \
    -DBUILD_TESTING=OFF
'''
build = '''
%cmake_build
'''
install = '''
%cmake_install
install -dm755 "$pkgdir/usr/share/licenses/kgeography"
if [ -d LICENSES ]; then cp LICENSES/* "$pkgdir/usr/share/licenses/kgeography/"; else cp COPYING* "$pkgdir/usr/share/licenses/kgeography/" 2>/dev/null || true; fi
'''
