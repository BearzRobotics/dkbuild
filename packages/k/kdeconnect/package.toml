rundeps = ["kirigami-addons", "sshfs"]

source = [
    { url = "https://download.kde.org/stable/release-service/26.08.2/src/kdeconnect-kde-26.08.2.tar.xz", sha256 = "efd9d58deea6857f18d0c77c8bc68192839a83e4d4a518fc829a725459a3dba5" },
]

setup = '''
%cmake
'''
build = '''
%cmake_build
'''
install = '''
%cmake_install
# wrong name
mv "$pkgdir/usr/share/zsh/site-functions/_kdeconnect" "$pkgdir/usr/share/zsh/site-functions/_kdeconnect-cli"
# better path
if [ -d "$pkgdir/etc/ufw" ]; then mkdir -p "$pkgdir/usr/lib" && mv "$pkgdir/etc/ufw" "$pkgdir/usr/lib/ufw"; fi
'''
