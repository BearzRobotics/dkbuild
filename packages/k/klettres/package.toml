# KDE Edu (Gear 26.08.3), for FenrirOS's education set.
name = "klettres"
version = "26.08.3"
release = 1
summary = "Learn the alphabet and to read syllables"
license = "GPL-2.0-or-later"
homepage = "https://apps.kde.org/klettres/"
hostdeps = ["cmake", "ninja", "pkgconf", "extra-cmake-modules", "qt6-qttools", "gettext"]
builddeps = ["qt6-qtbase-devel", "qt6-qtsvg-devel", "qt6-qtmultimedia-devel", "kconfigwidgets-devel", "kcoreaddons-devel", "kcrash-devel", "kdoctools-devel", "ki18n-devel", "knewstuff-devel", "kwidgetsaddons-devel", "kxmlgui-devel"]
options = ["!check"]

source = [
    { url = "https://download.kde.org/stable/release-service/26.08.3/src/klettres-26.08.3.tar.xz", sha256 = "c62ad17896e8c6c1b4980dbd39a87537b43bdff261c54fb287ce1d0c74f6f0e8" },
]

setup = '''
%cmake \
    -DBUILD_TESTING=OFF
'''
build = '''
%cmake_build
'''
install = '''
%cmake_install
install -dm755 "$pkgdir/usr/share/licenses/klettres"
if [ -d LICENSES ]; then cp LICENSES/* "$pkgdir/usr/share/licenses/klettres/"; else cp COPYING* "$pkgdir/usr/share/licenses/klettres/" 2>/dev/null || true; fi
'''
