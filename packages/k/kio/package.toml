# r2: moc_predefs.h could not be generated ("clang++: error: no such file or directory: ' --target=x86_64-fenriros-linux-musl'"): the build's CXX is
# "clang++ --target=...", CMake keeps the part after the first space as CMAKE_CXX_COMPILER_ARG1 *with its leading space*, and AUTOMOC's predefs command
# passes it as one argument. ARG1 is given here without the space (a cache value; the same flag, so nothing else changes).
environment = '''
export LDFLAGS="${LDFLAGS} -Wl,-z,stack-size=0x200000"
'''
