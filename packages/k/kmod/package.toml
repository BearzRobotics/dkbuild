name = "kmod"
version = "34.2"
release = 7
summary = "Linux kernel module handling"
license = "GPL-2.0-or-later AND LGPL-2.1-or-later"
homepage = "https://git.kernel.org/pub/scm/utils/kernel/kmod/kmod.git"
patches = ["no-gtkdoc.patch"]
hostdeps = ["bash", "meson", "pkgconf", "scdoc"]
builddeps = ["openssl-devel", "zlib-ng-compat-devel", "zstd-devel"]

source = [
    { url = "https://www.kernel.org/pub/linux/utils/kernel/kmod/kmod-34.2.tar.gz", sha256 = "d60a79fb12a85feab75674ce5b86b2c8bae1714f775f481eae926bd2657b2ffe" },
]

setup = '''
%meson \
    -Dxz=disabled
'''
build = '''
%meson_build
'''
install = '''
%meson_install
install -Dm644 $pkgfiles/depmod-search.conf "$pkgdir/usr/lib/depmod.d/search.conf"
# initramfs-tools
'''
