# Kismet with its capture tools (Wi-Fi, Bluetooth, ...); the Python tools,
# SDR and MQTT parts are off (libraries not in the tree yet).
name = "kismet"
version = "2026.10.R1"
release = 4
summary = "Wireless network detector, sniffer and IDS"
license = "GPL-2.0-or-later"
homepage = "https://www.kismetwireless.net"
hostdeps = ["pkgconf", "protobuf"]
builddeps = ["libpcap-devel", "libnl-devel", "protobuf-c-devel", "protobuf-devel", "sqlite-devel", "pcre2-devel", "libusb-devel", "openssl-devel", "zlib-ng-compat-devel", "libcap-devel", "lm-sensors-devel", "networkmanager-devel"]
options = ["!check", "jobs:6"]

source = [
    { url = "https://www.kismetwireless.net/code/kismet-2026-10-R1.tar.xz", sha256 = "57bc17ed5fbc74a3dcfaece4baefc1c7b3fa6bdb768ada9193fcb48988b9de2e" },
]

setup = '''
# randomized_alias.cc compares device_keys with !=, but trackedelement.h only
# declares < and == (Kismet is built as C++17 here, where != is not rewritten
# from ==, as C++20 does). Add the missing operator!=.
sed -i '/^bool operator ==(const device_key& x, const device_key& y);/a inline bool operator !=(const device_key\& x, const device_key\& y) { return !(x == y); }' trackedelement.h
grep -q 'operator !=(const device_key' trackedelement.h
# --with-openssl=/usr: m4/ax_check_openssl.m4 tests `test x"$SSL_DIRS" == x""`,
# which /bin/sh does not know ("test: x: unexpected operator"); the pkg-config
# branch is then skipped, no OpenSSL flags are set and the link test fails
# ("Failed to find OpenSSL library"). Given a directory, the macro looks for
# include/openssl/ssl.h there and uses -lssl -lcrypto.
# capture_usbwifi.c uses snprintf/fprintf/stderr without <stdio.h> (glibc's
# headers pulled it in; clang 22 makes implicit declarations an error):
# force-include it for C. capture_linux_wifi.c includes <linux/if_ether.h>
# before musl's <netinet/if_ether.h>, and both define struct ethhdr (musl's is
# unguarded): -D__UAPI_DEF_ETHHDR=0 makes the kernel header skip its copy.
export CFLAGS="$CFLAGS -include stdio.h -D__UAPI_DEF_ETHHDR=0"
export CXXFLAGS="$CXXFLAGS -D__UAPI_DEF_ETHHDR=0"
%configure \
    --with-openssl=/usr \
    --sysconfdir=/etc/kismet \
    --disable-python-tools \
    --disable-librtlsdr \
    --disable-mosquitto \
    --disable-libwebsockets \
    --enable-require-pcre2
'''
build = '''
%make
'''
install = '''
%make_install INSTUSR=root INSTGRP=root SUIDGROUP=root
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/kismet/LICENSE"
'''
