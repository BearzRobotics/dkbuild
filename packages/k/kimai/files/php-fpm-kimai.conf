; An optional php-fpm pool of its own for Kimai. Copy to
; /etc/php/php-fpm.d/kimai.conf and point nginx's fastcgi_pass at
; unix:/run/php-fpm-kimai.sock (php-fpm's default www pool also works).
[kimai]
user = _php
group = _php
listen = /run/php-fpm-kimai.sock
listen.owner = _php
listen.group = _php
listen.mode = 0660
pm = ondemand
pm.max_children = 10
pm.process_idle_timeout = 60s
php_admin_value[memory_limit] = 512M
php_admin_value[upload_max_filesize] = 20M
php_admin_value[post_max_size] = 20M
