# Kimai: time tracking for freelancers and teams (timesheets, customers,
# projects, activities, invoices, exports, reports, a JSON API, SAML/LDAP).
# Symfony on PHP with MariaDB (or MySQL), served by nginx and php-fpm.
# Built from source: the 143 Composer packages composer.lock pins are the
# recipe's sources (GitHub archives of the locked commits), and composer.lock
# is pointed at them (files/composer-local.py), so composer installs offline.
# The web front end's compiled CSS/JS is in the release tag (public/build).
# Layout: code in /usr/share/kimai; .env is /etc/kimai/env (until it exists
# Kimai reads the shipped .env.dist); var/ (cache, logs, data, plugins) is
# /var/lib/kimai. Setup: /usr/share/doc/kimai/README.FenrirOS.
# To update: regenerate the sources from the new composer.lock (each
# dist.reference archive's sha256).
# Installed inert (docs/requests.md): no service enabled, no site, no cron
# job, no credentials; the README says how to set it up.
name = "kimai"
version = "2.71.0"
release = 1
summary = "Time tracking for freelancers and teams"
license = "AGPL-3.0-or-later"
homepage = "https://www.kimai.org"
archs = ["x86_64", "aarch64"]
hostdeps = ["php", "composer", "unzip", "python"]
rundeps = ["php", "php-fpm", "nginx"]
options = ["!check", "!strip"]

