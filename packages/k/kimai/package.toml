environment = '''
export COMPOSER_HOME=/tmp/composer COMPOSER_CACHE_DIR=/tmp/composer-cache COMPOSER_DISABLE_NETWORK=1 \
    COMPOSER_NO_INTERACTION=1 COMPOSER_ALLOW_SUPERUSER=1
'''
build = '''
python3 $pkgfiles/composer-local.py composer.lock /build/sources
# symfony/flex only installs Symfony recipes for new packages, from the
# network; turned off (symfony/runtime, which writes vendor/autoload_runtime.php,
# stays on). Changes composer.json's allow-plugins.
composer config --no-plugins allow-plugins.symfony/flex false
# extensions are checked at run time (they are part of the php package)
composer install --no-dev --no-scripts --prefer-dist --optimize-autoloader --classmap-authoritative --ignore-platform-reqs
test -f vendor/autoload_runtime.php
# what composer's skipped auto-scripts would do: the bundles' public files
# (the API documentation's Swagger UI) into public/bundles
APP_ENV=prod APP_SECRET=build php bin/console assets:install public --no-debug
rm -rf var/cache/* var/log/*
'''
install = '''
d="$pkgdir/usr/share/kimai"
mkdir -p "$d"
cp -a bin config migrations public src templates translations vendor var \
    composer.json composer.lock symfony.lock .env.dist "$d/"
# var/ (cache, logs, data, plugins): a skeleton copied to /var/lib/kimai when missing
mv "$d/var" "$d/var.dist"
ln -s /var/lib/kimai "$d/var"
ln -s /etc/kimai/env "$d/.env"
install -Dm644 $pkgfiles/tmpfiles.conf "$pkgdir/usr/lib/tmpfiles.d/kimai.conf"
install -Dm644 $pkgfiles/nginx-kimai.conf "$pkgdir/usr/share/doc/kimai/nginx-kimai.conf"
install -Dm644 $pkgfiles/php-fpm-kimai.conf "$pkgdir/usr/share/doc/kimai/php-fpm-kimai.conf"
install -Dm644 $pkgfiles/README.FenrirOS "$pkgdir/usr/share/doc/kimai/README.FenrirOS"
install -Dm644 CHANGELOG.md "$pkgdir/usr/share/doc/kimai/CHANGELOG.md"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/kimai/LICENSE"
'''
