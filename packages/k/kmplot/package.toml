# KDE Edu (Gear 26.08.3), for FenrirOS's education set.
name = "kmplot"
version = "26.08.3"
release = 1
summary = "Mathematical function plotter"
license = "GPL-2.0-or-later"
homepage = "https://apps.kde.org/kmplot/"
hostdeps = ["cmake", "ninja", "pkgconf", "extra-cmake-modules", "qt6-qttools", "gettext"]
builddeps = ["qt6-qtbase-devel", "qt6-qtsvg-devel", "kcompletion-devel", "kconfig-devel", "kcrash-devel", "kdbusaddons-devel", "kdoctools-devel", "kguiaddons-devel", "ki18n-devel", "kio-devel", "kjobwidgets-devel", "kparts-devel", "ktextwidgets-devel", "kwidgetsaddons-devel"]
options = ["!check"]

source = [
    { url = "https://download.kde.org/stable/release-service/26.08.3/src/kmplot-26.08.3.tar.xz", sha256 = "9d7f16c4fd464e6dd656d328e115f25d5fca77bc54de802df7dea8c9ac1ab5e2" },
]

setup = '''
%cmake \
    -DBUILD_TESTING=OFF
'''
build = '''
%cmake_build
'''
install = '''
%cmake_install
install -dm755 "$pkgdir/usr/share/licenses/kmplot"
if [ -d LICENSES ]; then cp LICENSES/* "$pkgdir/usr/share/licenses/kmplot/"; else cp COPYING* "$pkgdir/usr/share/licenses/kmplot/" 2>/dev/null || true; fi
'''
