# KDE Edu (Gear 26.08.3), for FenrirOS's education set. needed by: parley.
name = "kdeedu-data"
version = "26.08.3"
release = 1
summary = "Shared data for KDE Edu applications (KDE Edu vocabulary files)"
license = "GPL-2.0-or-later"
homepage = "https://invent.kde.org/education/kdeedu-data"
hostdeps = ["cmake", "ninja", "pkgconf", "extra-cmake-modules", "qt6-qttools", "gettext"]
options = ["!check"]

source = [
    { url = "https://download.kde.org/stable/release-service/26.08.3/src/kdeedu-data-26.08.3.tar.xz", sha256 = "c93742be1812f0afd9c26d034d910ebf26e6382dca54cf55dacbb19fe7385075" },
]

setup = '''
%cmake \
    -DBUILD_TESTING=OFF
'''
build = '''
%cmake_build
'''
install = '''
%cmake_install
install -dm755 "$pkgdir/usr/share/licenses/kdeedu-data"
if [ -d LICENSES ]; then cp LICENSES/* "$pkgdir/usr/share/licenses/kdeedu-data/"; else cp COPYING* "$pkgdir/usr/share/licenses/kdeedu-data/" 2>/dev/null || true; fi
'''
