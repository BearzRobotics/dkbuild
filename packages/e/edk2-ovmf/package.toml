# OVMF (x86_64, Secure Boot and TPM 2 capable) for QEMU and libvirt. The source is a
# git snapshot with EDK2's submodules (OpenSSL, Brotli, ...); pinned by its tag
# (the snapshot is reproducible).
name = "edk2-ovmf"
version = "2026.08"
release = 1
summary = "UEFI firmware for virtual machines (OVMF, from EDK2)"
license = "BSD-2-Clause-Patent"
homepage = "https://github.com/tianocore/edk2"
hostdeps = ["acpica", "nasm", "python", "llvm-clang", "llvm-lld", "llvm", "util-linux-devel", "make", "bash"]
options = ["!check"]

source = [
    { url = "snapshot:git https://github.com/tianocore/edk2.git edk2-stable202608", sha256 = "adf33522c1a4d990c760bcebecebd1ec49d12ed3e6023d38117443e4b59bd43e" },
]

setup = '''
# clang 23's -Wattribute-alias (CryptoPkg's memcpy alias has an unsigned int
# size) under edk2's -Werror: off with its other clang warning overrides
# (the file has CRLF line ends: the flag goes before the \r)
sed -i 's/^\(DEFINE CLANGDWARF_WARNING_OVERRIDES   = [^\r]*\)/\1 -Wno-attribute-alias/' BaseTools/Conf/tools_def.template
grep -q '^DEFINE CLANGDWARF_WARNING_OVERRIDES .*-Wno-attribute-alias' BaseTools/Conf/tools_def.template
export PYTHON_COMMAND=python3
# clang 23's -Wunused-but-set-global, under BaseTools' -Werror (Elf32Convert.c)
make -C BaseTools CC=clang CXX=clang++ EXTRA_OPTFLAGS=-Wno-unused-but-set-global -j$jobs
'''
build = '''
export PYTHON_COMMAND=python3 WORKSPACE=$PWD
. ./edksetup.sh
for v in X64; do
    build -a X64 -t CLANGDWARF -b RELEASE -n $jobs -p OvmfPkg/OvmfPkgX64.dsc \
        -D SECURE_BOOT_ENABLE=TRUE -D TPM2_ENABLE=TRUE -D NETWORK_HTTP_BOOT_ENABLE=TRUE -D NETWORK_TLS_ENABLE=TRUE
done
'''
install = '''
d="$pkgdir/usr/share/edk2/x64"
mkdir -p "$d"
fv=Build/OvmfX64/RELEASE_CLANGDWARF/FV
install -m644 $fv/OVMF_CODE.fd $fv/OVMF_VARS.fd $fv/OVMF.fd "$d/"
install -Dm644 License.txt "$pkgdir/usr/share/licenses/edk2-ovmf/License.txt"
'''
