# installs and cbuild env tweaks; dependency names are Chimera's and resolve from stage 0 until they are recipes.
name = "efivar"
version = "39"
release = 3
summary = "Tools and libraries to work with EFI variables"
license = "LGPL-2.1-or-later"
homepage = "https://github.com/rhboot/efivar"
patches = ["fuckoff.patch", "tests.patch"]
hostdeps = ["mandoc", "pkgconf"]
builddeps = ["linux-headers"]

source = [
    { url = "https://github.com/rhboot/efivar/archive/refs/tags/39.tar.gz", sha256 = "c9edd15f2eeeea63232f3e669a48e992c7be9aff57ee22672ac31f5eca1609a6" },
]

environment = '''
export CFLAGS="${CFLAGS} -D_GNU_SOURCE -D_FILE_OFFSET_BITS=64"
'''
build = '''
%make \
    PREFIX=/usr \
    libdir=/usr/lib \
    ERRORS=
'''
check = '''
%make test
'''
install = '''
%make_install \
    STRIP=true \
    PREFIX=/usr \
    libdir=/usr/lib
'''
