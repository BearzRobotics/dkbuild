# Imported from Chimera Linux cports: work/cports/main/elfutils/template.py
# cports is BSD-2-Clause, Copyright (c) Chimera Linux contributors.
# Reviewed by hand: eustack symlink and rename written as shell.
# r3: the whole of elfutils (libdw, libasm, the eu-* tools), with Chimera's musl
#     patches; libelf.a kept. Only libelf was built before.
# r2: static libraries too (in elfutils-static), for fully static programs on musl.
name = "elfutils"
version = "0.193"
release = 3
summary = "Utilities and libraries to handle ELF files and DWARF data"
license = "GPL-3.0-or-later AND (GPL-2.0-or-later OR LGPL-3.0-or-later)"
homepage = "https://sourceware.org/elfutils"
patches = ["fix-aarch64_fregs.patch", "fix-uninitialized.patch", "musl-asm-ptrace-h.patch", "musl-macros.patch", "no-stack-conflict.patch", "stacktrace.patch"]
hostdeps = ["bison", "flex", "pkgconf"]
builddeps = ["sysprof-capture", "argp-standalone", "musl-obstack", "musl-fts", "zlib-ng-compat-devel", "zstd-devel", "xz-devel", "bzip2-devel", "linux-headers"]

source = [
    { url = "https://sourceware.org/elfutils/ftp/0.193/elfutils-0.193.tar.bz2", sha256 = "7857f44b624f4d8d421df851aaae7b1402cfe6bcdd2d8049f15fc07d3dde7635" },
]

# Only libelf, like the DKRescue ISO (the kernel's objtool and a few libraries need
# it): no debuginfod, no command-line tools.

environment = '''
export CFLAGS="$CFLAGS -D_GNU_SOURCE -Wno-unaligned-access"
export LDFLAGS="$LDFLAGS -Wl,-z,stack-size=2097152"
'''
setup = '''
%configure \
    --disable-nls \
    --disable-werror \
    --disable-debuginfod \
    --enable-libdebuginfod=dummy \
    --enable-deterministic-archives \
    --enable-stacktrace \
    --with-zstd \
    --program-prefix=eu-
'''
build = '''
%make
'''
install = '''
%make_install
[ -e "$pkgdir/usr/bin/eu-eustack" ] && mv "$pkgdir/usr/bin/eu-eustack" "$pkgdir/usr/bin/eu-stack"
'''
