# Euro-Office core: the native document engine of the Euro-Office Document
# Server (the AGPL ONLYOFFICE fork): x2t (the converter between OOXML, ODF,
# the legacy binary formats, PDF, EPUB, FB2, HTML, DjVu, XPS, HWP, OFD, ...),
# its libraries (kernel, graphics, PdfFile, DocxRenderer, doctrenderer with
# V8, ...), docbuilder, and the tools allfontsgen, allthemesgen,
# pluginsmanager and x2ttester. Release 9.3.7-1 (the latest stable
# Document Server release; Euro-Office tags all its repositories with it).
#
# Source: snapshot:git of Euro-Office's DocumentServer repository at the tag,
# with its submodules at the commits the tag records (core, sdkjs, web-apps,
# server, fonts, ...): euro-office-documentserver builds the rest from the
# same tarball.
#
# Third-party code: upstream's Common/3dParty/build_3rdparty.py clones and
# builds it at configure time; here it is skipped (THIRD_PARTY_PREPARED) and
#   - ICU, Boost, OpenSSL are the system's (patches/system-libraries.patch),
#   - V8 is euro-office-v8 (8.9.45, built as Euro-Office builds it),
#   - the sources core compiles in (harfbuzz, brotli, gumbo, katana, md4c,
#     socket.io-client-cpp with asio, websocketpp and rapidjson) are further
#     sources here, at the commits build_3rdparty.py pins, laid out and patched
#     in setup exactly as its nc-build.py scripts do (with core's own patches).
# Core also carries copies of freetype, zlib/minizip, libpng, libjpeg,
# openjpeg, jasper, libxml2, cryptopp, agg and others in its tree; its CMake
# files compile them in by file list, and they stay bundled for now
# (wip/euro-office/NOTES.md).
# Not built here: the desktop pieces (BUILD_DESKTOP: CEF, Qt) and the
# WebAssembly builds sdkjs uses (emscripten; sdkjs's checked-in ones are used,
# see euro-office-documentserver); the unit tests (EO_BUILD_TESTS: GoogleTest
# from vcpkg).
#
# Installed in the Document Server's layout, as upstream's packages do
# (/var/www/euro-office/documentserver/server/FileConverter/bin and
# server/tools): its configuration files name these paths. The libraries
# there are private (found through $ORIGIN).
# Not built yet.
name = "euro-office-core"
version = "9.3.7.1"
release = 2
summary = "Euro-Office document conversion engine (x2t) and tools"
license = "AGPL-3.0-only"
homepage = "https://github.com/Euro-Office/core"
archs = ["x86_64", "aarch64"]
hostdeps = ["cmake", "ninja", "python", "pkgconf"]
builddeps = ["euro-office-v8", "boost-devel", "icu-devel", "openssl-devel", "zlib-ng-compat-devel"]
options = ["!check", "jobs:12"]
patches = ["system-libraries.patch"]

