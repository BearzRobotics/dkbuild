setup = '''
# The install directory build_3rdparty.py would fill (each nc-build.py checks
# out into it and patches there; work and install directories are the same
# for these), from the further sources, with the same patches.
t=$PWD/third_party/install
p=$PWD/core/Common/3dParty
mkdir -p $t/html
cp -a ../harfbuzz-894a1f72ee93a1fd8dc1d9218cb3fd8f048be29a $t/harfbuzz
cp -a ../brotli-db24a98aed38a16de78cc05ca15cdd8dc2a0d92d $t/brotli
cp -a ../gumbo-parser-aa91b27b02c0c80c482e24348a457ed7c3c088e0 $t/html/gumbo-parser
cp -a ../katana-parser-be6df458d4540eee375c513958dcb862a391cdd1 $t/html/katana-parser
cp -a ../md4c-481fbfbdf72daab2912380d62bb5f2187d438408 $t/md
cp -a ../socket.io-client-cpp-da779141a7379cc30c870d48295033bc16a23c66 $t/socketio
rmdir $t/socketio/lib/asio $t/socketio/lib/websocketpp $t/socketio/lib/rapidjson 2>/dev/null || true
cp -a ../asio-230c0d2ae035c5ce1292233fcab03cea0d341264 $t/socketio/lib/asio
cp -a ../websocketpp-56123c87598f8b1dd471be83ca841ceae07f95ba $t/socketio/lib/websocketpp
cp -a ../rapidjson-a36110e11874bcf35af854940e0ce910c19a8b49 $t/socketio/lib/rapidjson
# core's own patches to them, as harfbuzz/, html/ and socketio/nc-build.py
# apply them (each patch file in core says what it changes)
patch -d $t/harfbuzz -p1 < $p/harfbuzz/patch/harfbuzz.patch
patch -d $t/html/katana-parser -p1 < $p/html/katana.patch
patch -d $t/html/gumbo-parser -p1 < $p/html/gumbo.patch
s=$p/socketio/patches/proper_patches
patch -d $t/socketio/lib/websocketpp -p1 < $s/websocketpp.patch
for f in sio_client_impl_fail sio_client_impl_open sio_client_impl_close_timeout; do
    patch -d $t/socketio -p1 < $s/$f.patch
done
patch -d $t/socketio/lib/asio -p1 < $s/asio-fix-for-openssl3.patch
# apple/nc-build.py: IWorkFile compiles glm, mdds, librevenge, libodfgen and
# libetonyek from sources in third_party/install/apple (Apple/CMakeLists.txt
# lists their files), with core's three patches
a=$t/apple
mkdir -p $a
cp -a ../glm-33b4a621a697a305bc3a7610d290677b96beb181 $a/glm
cp -a ../mdds-0783158939c6ce4b0b1b89e345ab983ccb0f0ad0 $a/mdds
cp -a ../librevenge-becd044b519ab83893ad6398e3cbb499a7f0aaf4 $a/librevenge
cp -a ../libodfgen-8ef8c171ebe3c5daebdce80ee422cf7bb96aa3bc $a/libodfgen
cp -a ../libetonyek-cb396b4a9453a457469b62a740d8fb933c9442c3 $a/libetonyek
patch -d $a/mdds -p1 < $p/apple/mdds.patch
patch -d $a/librevenge -p1 < $p/apple/librevenge.patch
patch -d $a/libetonyek -p1 < $p/apple/libetonyek.patch
# socketio/nc-build.py: a second copy of the client without TLS, made by
# no_tls.patch
cp -a $t/socketio/src $t/socketio/src_no_tls
patch -d $t/socketio -p1 < $s/no_tls.patch
'''
build = '''
%cmake -S core \
    -DTHIRD_PARTY_PREPARED=ON \
    -DEO_CORE_3RD_PARTY_DIR=$PWD/third_party \
    -DEO_CORE_3RD_PARTY_INSTALL_DIR=$PWD/third_party/install \
    -DPYTHON_BIN=/usr/bin/python3 \
    -DEO_CORE_OUTPUT_DIR=$PWD/out/bin \
    -DEO_CORE_TOOLS_DIR=$PWD/out/tools
%cmake_build
test -x out/bin/x2t
'''
install = '''
d="$pkgdir/var/www/euro-office/documentserver/server"
mkdir -p "$d/FileConverter/bin" "$d/tools"
cp -a out/bin/. "$d/FileConverter/bin/"
cp -a out/tools/. "$d/tools/"
install -Dm644 core/LICENSE.txt "$pkgdir/usr/share/licenses/euro-office-core/LICENSE.txt"
install -Dm644 core/3DPARTY.md "$pkgdir/usr/share/licenses/euro-office-core/3DPARTY.md"
cp -a core/LICENSES "$pkgdir/usr/share/licenses/euro-office-core/LICENSES"
'''
