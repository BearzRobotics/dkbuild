# Electron 42, for Code - OSS 1.138.0 (built for Electron 42.10.0), and the
# first Chromium FenrirOS builds itself (Brave follows). Electron 43 and the
# newest Code - OSS come after this one builds.
# The source is a snapshot (SPEC.md 5.3, src/snapshot-electron.sh): Electron's
# gclient checkout with its pinned Chromium (148.0.7778.280, as its DEPS has
# it), Electron's patches applied, and its node_modules (Electron's own yarn
# release) and third_party/node's (npm ci) installed at fetch time, so the
# build is offline. depot_tools is a 2026 commit, not Alpine's (April 2024):
# that one uses ast.Str, gone in the host's Python 3.14.
# Port of Alpine's testing/electron 42.11.18 (APKBUILD by lauren n. liberda and
# Antoine Martin): patches/ has Alpine's patches as they are, then the copium
# 148.1 ones (codeberg.org/selfisekai/copium) Alpine applies after them. Left
# out: electron_use-system-yarn, electron_fix-yarn412-lockfile and
# electron_pin-keys-4-5-4, which adapt Electron's yarn files to Alpine's system
# yarn before its install; here Electron's own yarn installed them, unchanged.
# System libraries as Alpine's: Chromium's list, and Node's llhttp, histogram,
# c-ares, nghttp2/3, ngtcp2, brotli, zlib (ada stays bundled: it needs
# use_custom_libcxx=false).
# The second source is rollup's WebAssembly build: devtools-frontend's rollup
# has a native module for glibc only.
# Not built yet.
name = "electron"
version = "42.11.18"
release = 1
summary = "Electron cross-platform desktop toolkit"
license = "MIT AND BSD-3-Clause"
homepage = "https://www.electronjs.org"
archs = ["x86_64", "aarch64"]
options = ["!check", "jobs:12"]
patches = [
    "0001-hotfix-ignore-a-new-warning-in-rust-1.89.patch", "compiler.patch",
    "disable-dns_config_service.patch", "disable-failing-tests.patch", "fc-cache-version.patch",
    "fix-ffmpeg-codec-list.patch", "fstatat-32bit.patch", "gdbinit.patch", "generic-sensor-include.patch",
    "headless-shell-no-license.patch", "musl-sandbox.patch", "musl-tid-caching.patch",
    "net-test-no-vpython.patch", "net-test-pyws3-py3.12.patch", "no-execinfo.patch", "no-mallinfo.patch",
    "no-res-ninit-nclose.patch", "no-sandbox-settls.patch", "partalloc-no-tagging-arm64.patch",
    "pvalloc.patch", "temp-failure-retry.patch",
    "electron_icon.patch", "electron_python-jinja-3.10.patch", "electron_webpack-hash.patch",
    "electron_unbundle-node.patch", "electron_system-zlib-headers.patch",
    "electron_do-not-strip-binaries.patch", "electron_shell-file-dialog-drop-glibc.patch",
    "electron_chrome-test-no-depend-test_data-cipd.patch", "electron_do-not-build-environ-linux.patch",
    # copium 148.1
    "cr133-ffmpeg-no-noh264parse.patch", "cr138-node-version-check.patch", "cr140-musl-prctl.patch",
    "cr143-libsync-__BEGIN_DECLS.patch", "cr145-iwyu-dev_t.patch", "cr145-musl-unfortify-SkDescriptor.patch",
    "cr146-sanitize-ignore-for-ubsan-feature.patch", "cr146-swiftshader-unfortify-memset-memcpy.patch",
    "cr146-unfortify-blink-display_item_list.patch", "cr147-is-musl-libcxx.patch",
    "cr147-simdutf-8.0-base-char.patch", "cr148-rust-1.95-bytemuck.patch",
    "cr148-rust-toolchain-var.patch", "cr148-v8-no-san-trap.patch",
]
hostdeps = ["bison", "esbuild", "git", "libarchive", "flex", "gn", "gperf", "hwdata", "ninja", "nodejs", "openjdk21", "perl",
            "pkgconf", "python", "python-jinja2", "python-setuptools", "python-six", "rust", "bindgen", "xcbproto"]
builddeps = ["alsa-lib-devel", "brotli-devel", "crc32c-devel", "hdrhistogram-c-devel", "llhttp-devel", "nghttp3-devel", "ngtcp2-devel", "c-ares-devel", "cairo-devel", "cups-devel", "curl-devel",
             "dav1d-devel", "double-conversion-devel", "eudev-devel", "ffmpeg-devel", "flac-devel",
             "fontconfig-devel", "freetype-devel", "glib-devel", "gtk+3-devel", "harfbuzz-devel",
             "heimdal-devel", "highway-devel", "hunspell-devel", "lcms2-devel", "libaom-devel",
             "libavif-devel", "libcap-devel", "libdrm-devel", "libexif-devel", "libffi-devel",
             "libjpeg-turbo-devel", "libnotify-devel", "libpulse-devel", "libsecret-devel",
             "libusb-devel", "libva-devel", "libwebp-devel", "libxcomposite-devel", "libxcursor-devel",
             "libxinerama-devel", "libxml2-devel", "libxrandr-devel", "libxscrnsaver-devel",
             "libxslt-devel", "linux-headers", "llvm-devel", "mesa-devel", "minizip-devel",
             "nghttp2-devel", "nss-devel", "openh264-devel", "opus-devel", "pciutils-devel",
             "pipewire-devel", "snappy-devel", "speex-devel", "sqlite-devel", "zlib-ng-compat-devel",
             "zstd-devel"]
rundeps = ["gtk+3", "hwdata", "xdg-utils"]

source = [
    { url = "snapshot:electron v42.11.18 148.0.7778.280 1afcf0756e47f3a6ee82d7736b9fcda2d57b268e", sha256 = "3b1bca939722412df06a20ffd2177df729a31c84b82e401ad6f6a3e7f3e50560" },
    { url = "https://registry.npmjs.org/@rollup/wasm-node/-/wasm-node-4.22.4.tgz", sha256 = "ee49bf67bd9bee869405af78162d028e2af0fcfca80497404f56b1b99f272717" },
]

environment = '''
export RUSTC_BOOTSTRAP=1
# Alpine's: less log noise, reproducible, no debug info (symbol_level=0)
export CFLAGS="${CFLAGS/-g/} -O2 -Wno-builtin-macro-redefined -Wno-deprecated-declarations -Wno-shift-count-overflow -Wno-ignored-attributes"
export CXXFLAGS="${CXXFLAGS/-g/} -O2 -Wno-builtin-macro-redefined -Wno-deprecated-declarations -Wno-invalid-constexpr"
export CXXFLAGS="${CXXFLAGS/-D_LIBCPP_HARDENING_MODE=_LIBCPP_HARDENING_MODE_FAST/}"
export CXXFLAGS="${CXXFLAGS/-D_GLIBCXX_ASSERTIONS=1}"
export CPPFLAGS="${CPPFLAGS/-g/} -D__DATE__=  -D__TIME__=  -D__TIMESTAMP__="
case "$arch" in
aarch64)
    export CFLAGS="${CFLAGS/-fstack-clash-protection}"
    export CXXFLAGS="${CXXFLAGS/-fstack-clash-protection}"
    ;;
esac
'''

setup = '''
git init -q .
# system tools where the build expects its downloaded ones
mkdir -p buildtools/linux64 third_party/node/linux/node-linux-x64/bin third_party/jdk/current/bin third_party/gperf/cipd/bin
ln -sf /usr/bin/clang-format buildtools/linux64/clang-format
ln -sf /usr/bin/node third_party/node/linux/node-linux-x64/bin/node
ln -sf /usr/bin/java third_party/jdk/current/bin/java
ln -sf /usr/bin/gperf third_party/gperf/cipd/bin/gperf
# rollup's WebAssembly build (the second source, /build/package) in place of
# its native one
rm -rf third_party/devtools-frontend/src/node_modules/rollup
mkdir third_party/devtools-frontend/src/node_modules/rollup
cp -a ../package/. third_party/devtools-frontend/src/node_modules/rollup/
mkdir -p third_party/devtools-frontend/src/third_party/esbuild third_party/devtools-frontend/src/node_modules
rm -rf third_party/devtools-frontend/src/third_party/esbuild/esbuild third_party/devtools-frontend/src/node_modules/esbuild
ln -s /usr/bin/esbuild third_party/devtools-frontend/src/third_party/esbuild/esbuild
ln -s /usr/lib/node_modules/esbuild third_party/devtools-frontend/src/node_modules/esbuild

# Electron reads its version from git (the snapshot has no VCS data)
(
    cd electron
    git init -q .
    git -c user.email=dkbuild@localhost -c user.name=dkbuild -c commit.gpgsign=false add LICENSE
    git -c user.email=dkbuild@localhost -c user.name=dkbuild -c commit.gpgsign=false commit -q -m init
    git tag "v$version"
    git pack-refs
)

# system libraries (Alpine's set)
sys="brotli crc32c dav1d double-conversion ffmpeg flac fontconfig freetype harfbuzz highway libdrm libjpeg libsecret libusb libwebp libxml libxslt openh264 opus zlib zstd"
for l in $sys jinja2 libjpeg_turbo unrar; do
    find . -type f -path "*third_party/$l/*" \! -path "*third_party/$l/chromium/*" \! -path "*third_party/$l/google/*" \
        \! -path './base/third_party/icu/*' \! -path './third_party/libxml/*' \
        \! -path './third_party/pdfium/third_party/freetype/include/pstables.h' \
        \! -path './third_party/crashpad/crashpad/third_party/zlib/zlib_crashpad.h' \
        \! -regex '.*\.\(gn\|gni\|gyp\|gypi\|isolate\|py\)' -delete
done
# Node's: some from the system, boringssl as openssl, corepack unused
node_sys="llhttp brotli cares corepack histogram nghttp2 nghttp3 ngtcp2 zlib"
for l in $node_sys openssl; do
    find . -type f -path "*third_party/electron_node/deps/$l/*" \
        \! -path "*third_party/electron_node/deps/$l/chromium/*" \! -path "*third_party/electron_node/deps/$l/google/*" \
        \! -regex '.*\.\(gn\|gni\|gyp\|gypi\|isolate\|py\)' -delete
done
# electron_unbundle-node.patch reads this list
echo $node_sys > third_party/electron_node/use_system.txt
rm -rf third_party/electron_node/tools/inspector_protocol/jinja2
touch chrome/test/data/webui/i18n_process_css_test.html
# read the system's usb.ids (hwdata) at run time instead of a bundled copy
sed -i 's|//third_party/usb_ids/usb.ids|/usr/share/hwdata/usb.ids|g' services/device/public/cpp/usb/BUILD.gn
python3 build/linux/unbundle/replace_gn_files.py --system-libraries $sys
python3 third_party/libaddressinput/chromium/tools/update-strings.py
# libvpx's gni regeneration script must not rewrite its README
sed -i 's,^update_readme$,#update_readme,' third_party/libvpx/generate_gni.sh
# allow system libraries in an official build (shim headers)
sed -i 's/OFFICIAL_BUILD/GOOGLE_CHROME_BUILD/' tools/generate_shim_headers/generate_shim_headers.py
# https://crbug.com/893950
sed -i -e 's/\<xmlMalloc\>/malloc/' -e 's/\<xmlFree\>/free/' \
    third_party/blink/renderer/core/xml/*.cc \
    third_party/blink/renderer/core/xml/parser/xml_document_parser.cc \
    third_party/libxml/chromium/*.cc
# the Rust target compiler.patch names (upstream Rust's musl one)
grep -qx x86_64-unknown-linux-musl build/rust/known-target-triples.txt ||
    echo x86_64-unknown-linux-musl >> build/rust/known-target-triples.txt

llvmver=$(clang -dumpversion | cut -d. -f1)
gn gen out/Release --args="
    import(\"//electron/build/args/release.gn\")
    blink_enable_generated_code_formatting=false chrome_pgo_phase=0 v8_builtins_profiling_log_file=\"\"
    clang_base_path=\"/usr\" clang_use_chrome_plugins=false clang_version=\"$llvmver\"
    custom_toolchain=\"//build/toolchain/linux/unbundle:default\"
    host_toolchain=\"//build/toolchain/linux/unbundle:default\"
    disable_fieldtrial_testing_config=true enable_hangout_services_extension=true
    enable_nocompile_tests=false enable_rust=true enable_stripping=false enable_vr=false
    fatal_linker_warnings=false ffmpeg_branding=\"Chrome\"
    icu_use_data_file=false is_cfi=false is_clang=true is_component_ffmpeg=true is_debug=false
    is_musl=true is_official_build=true link_pulseaudio=true node_version_check=false
    proprietary_codecs=true rtc_link_pipewire=true rtc_use_pipewire=true
    rustc_version=\"yes\" rust_bindgen_root=\"/usr\" rust_sysroot_absolute=\"/usr\"
    safe_browsing_use_unrar=false symbol_level=0 treat_warnings_as_errors=false
    use_clang_modules=false use_custom_libcxx=true use_lld=true use_pulseaudio=true
    use_safe_libstdcxx=false use_sysroot=false use_thin_lto=false use_vaapi=true v8_enable_maglev=true
    skia_use_dawn=false use_dawn=false use_system_ada=false use_system_cares=true
    use_system_histogram=true use_system_lcms2=true use_system_libffi=true
    use_system_llhttp=true use_system_nghttp2=true
"
'''
build = '''
export ELECTRON_OUT_DIR="$PWD/out/Release/"
ninja -C out/Release -j $jobs copy_node_headers electron_dist_zip node_gypi_headers node_version_header
'''
install = '''
mkdir -p "$pkgdir/usr/lib/electron" "$pkgdir/usr/bin"
bsdtar -xf out/Release/dist.zip -C "$pkgdir/usr/lib/electron"
chmod u+s "$pkgdir/usr/lib/electron/chrome-sandbox"
install -Dm755 $pkgfiles/electron-launcher.sh "$pkgdir/usr/bin/electron"
install -Dm644 $pkgfiles/default.conf "$pkgdir/etc/electron/default.conf"
# headers for native node modules (Code - OSS builds against them)
mkdir -p "$pkgdir/usr/include/electron/node_headers/include/nan"
cp -r out/Release/gen/node_headers/. "$pkgdir/usr/include/electron/node_headers/"
cp third_party/nan/*.h "$pkgdir/usr/include/electron/node_headers/include/nan/"
ln -s node_headers/include/node "$pkgdir/usr/include/electron/node"
ln -s node_headers/include/nan "$pkgdir/usr/include/electron/nan"
install -Dm644 electron/default_app/icon.png "$pkgdir/usr/share/icons/hicolor/1024x1024/apps/electron.png"
install -Dm644 $pkgfiles/electron.desktop "$pkgdir/usr/share/applications/electron.desktop"
'''

[subpackages.devel]
summary = "Headers for building native Node.js modules against Electron"
paths   = ["/usr/include/electron"]
