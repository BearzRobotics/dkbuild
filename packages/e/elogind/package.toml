# Imported from Chimera Linux cports: work/cports/main/elogind/template.py
# cports is BSD-2-Clause, Copyright (c) Chimera Linux contributors.
# Reviewed by hand. Changed from Chimera: no PAM, polkit or man pages (the
# system has none of them); the service and /run/systemd are written for our
# dinit layout. NOT BUILT YET: needs dbus, eudev, libcap, libseccomp,
# util-linux and meson in the tree (SPEC 9.3 waves 2-5). The systemd compat
# patches are Chimera's and are untested here.
name = "elogind"
version = "255.17"
release = 4
summary = "Standalone version of logind"
license = "GPL-2.0-or-later AND LGPL-2.0-or-later"
homepage = "https://github.com/elogind/elogind"
patches = ["add-skip-inhibitors-flag.patch", "dbus-activation.patch", "getdents.patch", "gshadow.patch", "libxml215.patch", "linger-path.patch", "no-bash.patch", "no-runtime-dir.patch", "ppc64-bad-tuple.patch", "rlim-max.patch", "sleep.patch", "strerror_r.patch", "strerror_r_1.patch", "tests.patch", "turnstile-dbus-session.patch", "xxx-musl-fixes.patch"]
hostdeps = ["gettext", "gperf", "meson", "pkgconf"]
builddeps = ["libcap-devel", "libseccomp-devel", "eudev-devel", "util-linux-devel", "linux-headers"]
rundeps = ["dbus"]

source = [
    { url = "https://github.com/elogind/elogind/archive/v255.17.tar.gz", sha256 = "a9725ae3f73f8d910de84c108bc11bfd4c782bef6a4190b2ec70c5d2f22344db" },
]

environment = '''
export CFLAGS="${CFLAGS} -U_FORTIFY_SOURCE"
'''
setup = '''
%meson \
    --libexecdir=/usr/lib/elogind \
    -Dman=disabled \
    -Dhalt-path=/usr/bin/halt \
    -Dreboot-path=/usr/bin/reboot \
    -Dcgroup-controller=elogind \
    -Ddefault-hierarchy=unified \
    -Ddefault-kill-user-processes=false \
    -Dutmp=false \
    -Dpolkit=false \
    -Dpam=false
'''
build = '''
%meson_build
'''
install = '''
%meson_install
# compat symlinks
mkdir -p "$pkgdir/usr/lib/pkgconfig"
ln -sf libelogind.pc "$pkgdir/usr/lib/pkgconfig/libsystemd.pc"
mkdir -p "$pkgdir/usr/lib/pkgconfig"
ln -sf libelogind.pc "$pkgdir/usr/lib/pkgconfig/libsystemd-logind.pc"
mkdir -p "$pkgdir/usr/include"
ln -sf elogind "$pkgdir/usr/include/systemd"
# extra includes
install -Dm644 src/systemd/sd-id128.h "$pkgdir/usr/include/sd-id128.h"
install -Dm644 src/systemd/_sd-common.h "$pkgdir/usr/include/_sd-common.h"
# service file
install -Dm644 $pkgfiles/elogind "$pkgdir/etc/dinit.d/elogind"
# busctl provided by tangle
rm -rf "$pkgdir/usr/bin/busctl"
rm -rf "$pkgdir/usr/share/man/man1/busctl.1"
rm -rf "$pkgdir/usr/share/bash-completion/completions/busctl"
rm -rf "$pkgdir/usr/share/zsh/site-functions/_busctl"
'''
