# Adapted from Chimera Linux cports: main/evince. cports is BSD-2-Clause, Copyright (c) Chimera Linux contributors.
# evince 48 (GTK 3): PDF, PostScript, DjVu, XPS, comic books (cbz/cbr/cb7/cbt), TIFF.
# 49 and later are the separate "Papers" application, not evince.
# Off, with the reason: dvi (needs kpathsea from TeX Live; texlive-devel is a
# heavy build dependency for a legacy format; enable it once the texlive
# recipe's kpathsea is in use), the Nautilus extension (nautilus is not
# packaged), GTK-Doc (reference manual of the library, not needed).
# fix-suboverflow.patch (cports): page_link_tree_sort returned a - b of two ints,
# a signed overflow; it compares them instead.
name = "evince"
version = "48.4"
release = 1
summary = "GNOME document viewer"
license = "GPL-2.0-or-later"
homepage = "https://wiki.gnome.org/Apps/Evince"
patches = ["fix-suboverflow.patch"]
hostdeps = ["meson", "pkgconf", "adwaita-icon-theme", "desktop-file-utils", "gettext", "glib-devel", "gobject-introspection", "itstool", "perl-xml-parser"]
builddeps = ["dbus-devel", "djvulibre-devel", "glib-devel", "gnome-desktop-devel", "gsettings-desktop-schemas-devel", "gspell-devel", "gst-plugins-base-devel", "gstreamer-devel", "gtk+3-devel", "libarchive-devel", "libgxps-devel", "libhandy-devel", "libsecret-devel", "libspectre-devel", "libtiff-devel", "poppler-devel"]
rundeps = ["adwaita-icon-theme", "gsettings-desktop-schemas"]
options = ["!check"]

source = [
    { url = "https://download.gnome.org/sources/evince/48/evince-48.4.tar.xz", sha256 = "f296c5c662886635d4cd597e8ac0afcde7982be4486533c2b7f095b268be8668" },
]

setup = '''
%meson \
    -Dintrospection=true \
    -Dgtk_doc=false \
    -Duser_doc=true \
    -Dnautilus=false \
    -Dcomics=enabled \
    -Dps=enabled \
    -Dpdf=enabled \
    -Ddjvu=enabled \
    -Dxps=enabled \
    -Dtiff=enabled \
    -Dmultimedia=enabled \
    -Dgspell=enabled \
    -Dkeyring=enabled \
    -Dthumbnail_cache=enabled \
    -Ddvi=disabled \
    -Dsystemduserunitdir=no
'''
build = '''
%meson_build
'''
install = '''
%meson_install
'''
