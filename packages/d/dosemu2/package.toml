# dosemu2: runs DOS programs on Linux (a DOS emulator with its own FreeDOS kernel (fdpp), a
# 64-bit COMMAND.COM (comcom64) and DJGPP-64 programs through dj64dev). Pinned to a commit of
# master (2026-10-25), as upstream's tags lag behind the dj64 work.
# The configure line enables everything it finds; the sound, X11 and SDL plugins come from the
# libraries listed in builddeps. The parallel-port plugin (libieee1284) is not packaged yet, so
# its plugin is left out until it is; the optional searpc plugin is built (libsearpc).
# The 32-bit assembler and compiler it wants for its 16-bit stubs are clang through
# i686-linux-gnu-tools.
# Not enabled by default anywhere; no services. The `dosemu` launcher is installed by upstream.
# UNVERIFIED: the whole chain (i686-linux-gnu-tools, thunk-gen, djstub, dj64dev, fdpp, comcom64)
# is read-not-run; expect a few fix-up rounds. See docs/requests.md (dosemu2 survey).
name = "dosemu2"
version = "2.0_git20261025"
release = 1
summary = "DOS emulator for Linux (with FreeDOS kernel and DJGPP-64 support)"
license = "GPL-2.0-or-later"
homepage = "https://github.com/dosemu2/dosemu2"
archs = ["x86_64"]
hostdeps = ["autoconf", "automake", "libtool", "m4", "pkgconf", "bison", "flex", "nasm", "clang", "thunk-gen", "i686-linux-gnu-tools", "dj64dev", "python", "bash"]
builddeps = ["fdpp", "dj64dev", "comcom64", "libslirp", "libb64", "libsearpc", "fluidsynth", "ladspa-sdk", "slang", "gpm", "alsa-lib", "sdl2-ttf", "readline", "json-c", "libseccomp", "fontconfig", "libx11", "libxext", "libxxf86vm", "libxcursor", "libxkbfile", "libxpm", "libxt", "libsndfile", "linux-headers"]
rundeps = ["fdpp", "comcom64", "dj64dev"]

source = [
    { url = "https://github.com/dosemu2/dosemu2/archive/7e7f3da9596ce8035274843f61dc6c71e9733d3a.tar.gz", sha256 = "5d1302aeb60da2b3fc02aafd47a6fcb439a460362d59e33bb21446ee956b31ae" },
]

setup = '''
./autogen.sh
%configure
'''
build = '''
%make
'''
install = '''
%make_install
'''
