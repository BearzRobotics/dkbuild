name = "doxygen"
version = "1.17.0"
release = 2
summary = "Source code documentation generator tool"
license = "GPL-2.0-only"
homepage = "https://doxygen.nl"
patches = ["test-is-not-git.patch", "xmllint-expected-xml.patch"]
hostdeps = ["cmake", "ninja", "perl", "python", "flex", "bison"]
builddeps = ["sqlite-devel"]
checkdeps = ["libxml2"]

source = [
    { url = "https://doxygen.nl/files/doxygen-1.17.0.src.tar.gz", sha256 = "fa4c3dd78785abc11ccc992bc9c01e7a8c3120fe14b8a8dfd7cefa7014530814" },
]

setup = '''
# Its CMakeLists turns LTO on for Release builds; lld crashes (SIGSEGV) in
# that ThinLTO link of its large generated parsers, every time (2026-11-11)
sed -i 's/set(CMAKE_INTERPROCEDURAL_OPTIMIZATION TRUE)/set(CMAKE_INTERPROCEDURAL_OPTIMIZATION FALSE)/' CMakeLists.txt
grep -q 'CMAKE_INTERPROCEDURAL_OPTIMIZATION TRUE' CMakeLists.txt && exit 1
# spdlog's bundled fmt calls free() without <cstdlib> (Clang 23, libc++)
export CXXFLAGS="$CXXFLAGS -include cstdlib"
%cmake \
    -DCMAKE_BUILD_TYPE=Release \
    -Duse_sys_sqlite3=ON
'''
build = '''
%cmake_build
'''
install = '''
%cmake_install
install -Dm644 doc/doxygen.1 "$pkgdir/usr/share/man/man1/doxygen.1"
'''
