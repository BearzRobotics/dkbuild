# djstub: the stub (djstubify) that makes a dj64 ELF file runnable under DOS and dosemu2;
# Makefile with prefix=/usr, needs only Python and a C compiler.
# r2: builds stub.exe with Smaller C (smlrcc -dosp, the Makefile's own compiler; new recipe smallerc). r1 used %make, whose CC=clang
# replaced smlrcc and failed on DOS headers ("dpmi.h file not found"); plain make keeps the makefile's CC.
# r3: hostdeps nasm: the stub's assembly part (src/stub.asm) is assembled with `nasm -f elf` ("nasm: not found"), the C parts with Smaller C.
name = "djstub"
version = "0.9.2"
release = 3
summary = "DJGPP-64 stub tools (djstubify, djlink, djstrip)"
license = "GPL-3.0-or-later"
homepage = "https://github.com/stsp/djstub"
archs = ["x86_64"]
hostdeps = ["smallerc", "make", "nasm"]
rundeps = ["python"]

source = [
    { url = "https://github.com/stsp/djstub/archive/refs/tags/0.9-2.tar.gz", sha256 = "ab58c8658d3e5a5ca870642b9c01afd7488701e234419cc25faab24e64a85eb5" },
]

build = '''
make prefix=/usr
'''
install = '''
make DESTDIR="$pkgdir" prefix=/usr install
'''
