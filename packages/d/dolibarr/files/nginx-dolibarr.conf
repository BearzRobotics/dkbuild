# Dolibarr under nginx with php-fpm (/run/php-fpm.sock, or the pool in
# php-fpm-dolibarr.conf). Copy to /etc/nginx/http.d/dolibarr.conf, set
# server_name and TLS, and add nginx's user to the _php group.
server {
    listen 80;
    server_name erp.example.org;
    root /usr/share/dolibarr/htdocs;
    index index.php;
    client_max_body_size 50M;

    location / { try_files $uri $uri/ /index.php; }
    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        try_files $fastcgi_script_name =404;
        fastcgi_pass unix:/run/php-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
    location ~ ^/conf/ { deny all; }
    location ~ /\. { deny all; }
}
