# The DKDE desktop: panel, session, setup, and the apps (term, files, settings,
# edit, calc, calendar, clock, color, charmap, parted, snip, tasks, view, pdf).
# Zig dependencies (zig-gobject bindings, zig-wayland, dkterm, pdf-zig, dkman,
# util-unix, toml-zig) are fetched on the host (option `zigdeps`).
#
# Only the programs and data (`zig build install`) are packaged. dkde's
# packaging/build.sh also writes a greetd login screen and PAM files; this
# system logs in on dkconsole and has no PAM, so those are not part of this package.
#
# 0.2.0: archives (libarchive), MTP/PTP, servers, Network, Online accounts; the source tarball
# is named dkde-v0.2.0.tar.gz.
# NOT BUILT YET: needs gtk4, gtk4-layer-shell, wayland, cairo, pango, glib and the
# Zig dependency fetch to have been run (`dkbuild fetch dkde`).
name = "dkde"
version = "0.2.0"
release = 1
summary = "A Wayland desktop shell in Zig on GTK4 and labwc"
license = "MIT"
homepage = "https://github.com/BearzRobotics/dkde"
archs = ["x86_64"]
hostdeps = ["zig", "pkgconf"]
builddeps = ["gtk4-devel", "gtk4-layer-shell-devel", "wayland-devel", "wayland-protocols", "glib-devel", "cairo-devel", "pango-devel", "harfbuzz-devel", "gdk-pixbuf-devel", "graphene-devel", "libarchive-devel", "fontconfig-devel"]
# Optional, not dependencies: gvfs (Files: phones, cameras and servers), gnome-online-accounts
# (Settings: Google calendars) and NetworkManager (Settings > Network; without it, wpa_cli and
# dhcpcd.conf). Install them to turn those features on.
rundeps = ["labwc", "seatd", "dbus", "polkit"]
options = ["zigdeps", "!check"]

source = [
    { url = "https://github.com/BearzRobotics/dkde/releases/download/v0.2.0/dkde-v0.2.0.tar.gz", sha256 = "4b8b380112c3adb22a9477a406ff1f92fb1b5007349c21f44fbeff5514301342" },
]

install = '''
# uucode's generator runs through ../.. from inside zig-pkg/uucode-*, which
# must not be a link into the package store (as in dkconsole): copied instead
for p in zig-pkg/*; do
    [ -L "$p" ] || continue
    t=$(readlink -f "$p"); rm "$p"; cp -a "$t" "$p"
done
%zig_build
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/dkde/LICENSE"
'''
