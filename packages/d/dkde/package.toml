# The DKDE desktop: panel, session, setup, and the apps (term, files, settings,
# edit, calc, calendar, clock, color, charmap, parted, snip, tasks, view, pdf).
# Zig dependencies (zig-gobject bindings, zig-wayland, dkterm, pdf-zig, dkman,
# util-unix, toml-zig) are fetched on the host (option `zigdeps`).
#
# Only the programs and data (`zig build install`) are packaged. dkde's
# packaging/build.sh also writes a greetd login screen and PAM files; this
# system logs in on dkconsole and has no PAM, so those are not part of this package.
#
# 0.3.6_pre20261127 (the user, 2026-11-27: "dkde is latest git ... it will include the tty switching"; 0.3.6 is not
# released yet): commit 48f21b6, from GitHub's archive of it, which has no zig-pkg/ (option `zigdeps`).
# Upstream calls this a pre-release: dkde-compositor is now the default of the session and the login screen (labwc is
# the backup), not tried by upstream on a real boot; if the login screen fails, in /etc/greetd/config.toml:
# command = "env DKDE_GREETER_COMPOSITOR=labwc dkde-greeter-session". A plain `zig build` now builds the compositor and
# window manager too: left out here (their own recipes). Not packaged: dkde-xcomp, the X11 compositing manager
# (src/xcomp). Not built.
# 0.3.5 (2026-11-21): Shut Down and Restart go through loginctl (logind/elogind) when it runs, so no password is asked; without logind nothing changes.
# 0.3.4 (2026-11-20): dkde-calc fixes (finance solves no longer crash, missed roots), calculator answers checked against mpmath/scipy/sympy,
# new Learn courses (Networking, Statistics, Electronics, Finance, Differential Equations) and Formulas groups. New Zig dependencies util-unix 0.4.0 and
# util-core 0.1.0 (libraries, fetched with zigdeps; the packages util-unix/util-core are not run-time dependencies), dkman 0.5.1.
# 0.3.3 (2026-11-18): login screen session picker, dkde-calc Learn and Geometry, dinit fixes (tasks, panel, files); compiled GSettings schemas are made by dkde itself.
# 0.3.2 (2026-11-16): upstream now packages dkde-compositor and dkde-wm from the same tarball: they are the separate recipes
# dkde-compositor and dkde-wm here (this one still builds only the main programs).
# 0.3.1 (2026-11-16): the main build now links libxcb and libxcb-randr (src/x11desktop: the panel, snip and tools on X11); builddeps libxcb-devel.
# dkde-compositor (wlroots) and dkde-wm (XCB) are separate packages in the same tarball (src/compositor, src/xwm): not built here.
# 0.3.0: dkde-snap (Super+Z snap layouts), calculator Show Work, dsolve, taylor, laplace. 0.2.0: archives
# (libarchive), MTP/PTP, servers, Network, Online accounts; the source tarball
# is named dkde-v<version>.tar.gz.
# NOT BUILT YET: needs gtk4, gtk4-layer-shell, wayland, cairo, pango, glib and the
# Zig dependency fetch to have been run (`dkbuild fetch dkde`).
name = "dkde"
version = "0.3.6_pre20261127"
release = 1
summary = "A Wayland desktop shell in Zig on GTK4 and labwc"
license = "MIT"
homepage = "https://github.com/BearzRobotics/dkde"
archs = ["x86_64"]
hostdeps = ["zig", "pkgconf"]
builddeps = ["gtk4-devel", "gtk4-layer-shell-devel", "wayland-devel", "wayland-protocols", "glib-devel", "cairo-devel", "pango-devel", "harfbuzz-devel", "gdk-pixbuf-devel", "graphene-devel", "libarchive-devel", "fontconfig-devel", "libxcb-devel"]
# The desktop treats optional dependencies as runtime ones, so it is fully functional:
# gvfs (Files: phones, cameras, servers, Google Drive), gnome-online-accounts (Settings:
# Online accounts, calendars) and NetworkManager (Settings > Network, the full page; without
# it Settings falls back to wpa_cli and dhcpcd.conf).
rundeps = ["labwc", "seatd", "dbus", "polkit", "gvfs", "gnome-online-accounts", "networkmanager"]
options = ["zigdeps", "!check"]

source = [
    { url = "https://github.com/BearzRobotics/dkde/archive/48f21b64b5bd897240ec4f16500c19bd28d62759.tar.gz", sha256 = "22ddf6011d6cf510caf6a597049d8d270dee546e4318abd535ff066a84f3d875" },
]

install = '''
# uucode's generator runs through ../.. from inside zig-pkg/uucode-*, which
# must not be a link into the package store (as in dkconsole): copied instead
for p in zig-pkg/*; do
    [ -L "$p" ] || continue
    t=$(readlink -f "$p"); rm "$p"; cp -a "$t" "$p"
done
%zig_build -Dcompositor=false -Dwm=false
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/dkde/LICENSE"
'''
