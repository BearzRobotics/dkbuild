# Fast and multi-purpose DNS toolkit allow to run multiple DNS queries of your choice... (BlackArch list, requested 2026-11-16; docs/requests.md). Written from the template of ffuf; not built yet when written (wip/queue): expect first-build fixes.
# Go module, dependencies fetched on the host (godeps). Main package: cmd/dnsx.
name = "dnsx"
version = "1.3.1"
release = 1
summary = "Fast and multi-purpose DNS toolkit allow to run multiple DNS queries of your choice..."
license = "MIT"
homepage = "https://github.com/projectdiscovery/dnsx"
hostdeps = ["go"]
options = ["!check", "godeps"]

source = [
    { url = "https://github.com/projectdiscovery/dnsx/archive/refs/tags/v1.3.1.tar.gz", sha256 = "2c14a27b00e3215e1c0dc07afe9e5e5c3f0a3502852f1d5f497a92b5e6cb63db" },
]

environment = '''
export GOFLAGS="-mod=mod -trimpath -buildvcs=false" GOTOOLCHAIN=local GOPROXY=off
export GOCACHE=/tmp/go-cache GOPATH=/tmp/go CGO_ENABLED=0
'''
build = '''
mkdir -p build
go build -o build/dnsx ./cmd/dnsx
'''
install = '''
install -Dm755 build/dnsx "$pkgdir/usr/bin/dnsx"
install -Dm644 LICENSE.md "$pkgdir/usr/share/licenses/dnsx/LICENSE.md"
'''
