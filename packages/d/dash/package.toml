# Follows the DKRescue post's build of dash 0.5.12.
# /bin/sh on this system (static, so a damaged library never leaves the system without one).
name = "dash"
version = "0.5.12"
release = 1
summary = "POSIX shell (/bin/sh)"
license = "BSD-3-Clause"
homepage = "http://gondor.apana.org.au/~herbert/dash"
options = ["static", "!check"]

source = [
    { url = "http://gondor.apana.org.au/~herbert/dash/files/dash-0.5.12.tar.gz", sha256 = "6a474ac46e8b0b32916c4c60df694c82058d3297d8b385b74508030ca4a8f28a" },
]

setup = '''
%configure --enable-static
'''
build = '''
%make
'''
install = '''
%make_install
ln -sf dash "$pkgdir/usr/bin/sh"
'''
