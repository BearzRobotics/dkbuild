# Imported draft, untested. Dropped from Chimera's recipe: shell completions, service/tmpfiles/sysusers
# installs and cbuild env tweaks; dependency names are Chimera's and resolve from stage 0 until they are recipes.
name = "dbus"
version = "1.16.2"
release = 1
summary = "Message bus system"
license = "GPL-2.0-or-later"
homepage = "https://dbus.freedesktop.org"
patches = ["0001-add-flag-for-dinit-activated-launch.patch", "0002-add-dinit-environment-updating.patch", "launch-helper-grp.patch", "no-issetugid.patch"]
hostdeps = ["gperf", "meson", "pkgconf", "xmlto"]
builddeps = ["dinit-chimera", "libcap-devel", "libexpat-devel", "libx11-devel"]

source = [
    { url = "https://dbus.freedesktop.org/releases/dbus/dbus-1.16.2.tar.xz", sha256 = "0ba2a1a4b16afe7bceb2c07e9ce99a8c2c3508e5dec290dbb643384bd6beb7e2" },
]

setup = '''
%meson \
    -Dasserts=false \
    -Ddbus_user=dbus \
    -Ddoxygen_docs=disabled \
    -Depoll=enabled \
    -Dinotify=enabled \
    -Dselinux=disabled \
    -Dsystem_pid_file=/run/dbus/pid \
    -Dsystem_socket=/run/dbus/system_bus_socket \
    -Dsystemd=disabled \
    -Duser_session=false \
    -Dtraditional_activation=true \
    -Dxml_docs=enabled
'''
build = '''
%meson_build
'''
install = '''
%meson_install
# service file
install -Dm755 $pkgfiles/dbus-session.wrapper "$pkgdir/usr/lib/dbus-session.wrapper"
# x11 support
install -dm755 "$pkgdir/etc/X11/Xsession.d"
install -Dm755 $pkgfiles/01dbus-env "$pkgdir/etc/X11/Xsession.d/01dbus-env"
# sysuser and tmpfiles
'''
