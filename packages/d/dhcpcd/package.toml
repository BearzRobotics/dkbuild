# Imported draft, untested. Dropped from Chimera's recipe: shell completions, service/tmpfiles/sysusers
# installs and cbuild env tweaks; dependency names are Chimera's and resolve from stage 0 until they are recipes.
# r2: depends on openresolv (Chimera's "resolvconf" is a virtual name, which dkbuild has no provider for).
# r3: rebuilt with the empty directories it installs (dkbuild's splitter dropped them).
# r4: dependencies on this tree's packages, not Chimera's names (built against the image's copies before).
name = "dhcpcd"
version = "10.5.2"
release = 5
summary = "RFC2131 compliant DHCP client"
license = "BSD-2-Clause"
homepage = "https://roy.marples.name/projects/dhcpcd"
patches = ["enable-controlgroup.patch"]
hostdeps = ["pkgconf"]
builddeps = ["eudev-devel", "linux-headers"]
rundeps = ["openresolv"]

source = [
    { url = "https://github.com/NetworkConfiguration/dhcpcd/releases/download/v10.5.2/dhcpcd-10.5.2.tar.xz", sha256 = "3e476657fdb6eeb38b277da3a48d0ac0113ecce5858ebdcddff2b629faed52b4" },
]

setup = '''
./configure \
    --prefix=/usr \
    --sbindir=/usr/bin \
    --libexecdir=/usr/lib \
    --sysconfdir=/etc \
    --rundir=/run/dhcpcd \
    --dbdir=/var/lib/dhcpcd \
    --privsepuser=_dhcpcd \
    --enable-privsep \
    --without-libpcap
'''
build = '''
%make
'''
check = '''
%make test
'''
install = '''
%make_install
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/dhcpcd/LICENSE"
'''
