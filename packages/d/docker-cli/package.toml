# docker-cli: the `docker` command (container and image management), talking
# to dockerd (packages/m/moby) or any Docker-API engine (podman's socket).
# Dynamically linked build (upstream's `make dynbinary`), man pages and the
# bash/zsh/fish completions. Its Go dependencies are in the tarball's vendor/;
# the build runs in GOPATH mode the way upstream's scripts expect (the
# repository has a vendor.mod, no go.mod), with the source linked into a
# GOPATH as Chimera does.
# Based on Chimera Linux cports (BSD-2-Clause): main/docker-cli. Its
# bsd-date patch is not needed (GNU date).
name = "docker-cli"
version = "29.9.3"
release = 1
summary = "Docker container and image management command"
license = "Apache-2.0"
homepage = "https://www.docker.com"
hostdeps = ["go", "go-md2man", "bash", "make", "pkgconf"]
rundeps = ["git"]
options = ["!check"]

source = [
    { url = "https://github.com/docker/cli/archive/refs/tags/v29.9.3.tar.gz", sha256 = "23d7472c80bc7483e57655085d687c631b398837bbc92535528c4582fc17e95b" },
]

environment = '''
export GOTOOLCHAIN=local GOPROXY=off GOCACHE=/tmp/go-cache GOPATH=/tmp/go CGO_ENABLED=1
export DISABLE_WARN_OUTSIDE_CONTAINER=1
# the v29.9.3 tag's commit (the scripts ask git otherwise)
export VERSION=$version GITCOMMIT=5457199aa57c45e990c59c89cab5f02b817238d7
export GO_MD2MAN=/usr/bin/go-md2man
'''
setup = '''
mkdir -p .gopath/src/github.com/docker
ln -sfn "$PWD" .gopath/src/github.com/docker/cli
'''
build = '''
cd .gopath/src/github.com/docker/cli
GOPATH="$PWD/../../../.." make dynbinary
make manpages
'''
install = '''
install -Dm755 build/docker "$pkgdir/usr/bin/docker"
install -Dm644 contrib/completion/bash/docker "$pkgdir/usr/share/bash-completion/completions/docker"
install -Dm644 contrib/completion/zsh/_docker "$pkgdir/usr/share/zsh/site-functions/_docker"
install -Dm644 contrib/completion/fish/docker.fish "$pkgdir/usr/share/fish/vendor_completions.d/docker.fish"
for m in man/man1/*.1 man/man5/*.5; do install -Dm644 "$m" "$pkgdir/usr/share/man/$(basename "$(dirname "$m")")/$(basename "$m")"; done
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/docker-cli/LICENSE"
install -Dm644 NOTICE "$pkgdir/usr/share/licenses/docker-cli/NOTICE"
'''
