# dinit's system services: the boot sequence (filesystems, rootfs check,
# modules, udev, rcboot), the login gettys (tty1-6, ttyS0), single-user and
# recovery modes, and services for daemons whose packages do not ship one yet
# (dbus, dhcpcd, seatd, syslogd, udevd, hwclock). Taken from the DKRescue image (dbus
# is new: the system bus for polkit and the desktop); the
# hostname now comes from /etc/hostname. Services an image starts at boot are
# links in /etc/dinit.d/boot.d, made by `dkbuild image` (`services = [...]`).
# sshd and sshd-keys come with openssh.
# r2: rebuilt with the empty directories it installs (dkbuild's splitter dropped them).
# r3: a /run already mounted (by a live initramfs) is kept, not hidden under a new tmpfs.
# r4: rcboot works without D-Bus (machine-id from the kernel), keeps the random
# seed in /var/lib, and a missing /etc/hostname no longer fails it.
# r5: dhcpcd is /usr/bin/dhcpcd.
# r6: rcboot applies sysusers.d and tmpfiles.d at boot (sd-tools), so /run directories exist.
name = "dinit-services"
version = "1"
# r7: the dbus service reports readiness (--print-address writes a line to the pipe once the bus listens). Without it dinit
# counted the bus as started when it was only forked, and elogind, started right after, failed with "Failed to connect to
# system bus: No such file or directory".
# r8: /proc is mounted without hidepid=1, which broke every polkit check (admin prompts, NetworkManager and power actions).
# Any user can now see other users' processes, as on most distributions.
# r9 also: the boot check skips what is mounted or marked noauto, and the early boot mounts nothing twice (/dev was
# mounted again over the kernel's, and once more by `mount -a`). After `mount -a`, dinit checks for its control socket
# again and remakes it if something was mounted over /run. hwclock tries --directisa when the clock's interrupt does
# not arrive.
release = 9
summary = "dinit service definitions and boot scripts for FenrirOS"
license = "MIT"
homepage = "https://github.com/BearzRobotics/dkbuild"
rundeps = ["dinit", "util-linux", "eudev"]
options = ["!check", "!strip"]

install = '''
mkdir -p "$pkgdir/etc/dinit.d/boot.d"
for f in "$pkgfiles"/*; do
    case "$f" in
        *.sh) install -m755 "$f" "$pkgdir/etc/dinit.d/" ;;
        *) install -m644 "$f" "$pkgdir/etc/dinit.d/" ;;
    esac
done
'''
