# The DKDE desktop, FenrirOS's default: dkde (panel, session and apps) on labwc,
# with seat management, D-Bus, polkit, audio (PipeWire with WirePlumber), Mesa
# with Vulkan, fonts and icons, and Xwayland for X11 programs. `dkde-session` starts it.
# r6: brightnessctl (dkde 0.3.1: Settings > Power & lock dims the screen through it; also the brightness slider).
# r5: dkde's optional extras (cups, cups-filters, ocrmypdf, gnome-online-accounts-gtk, bluez, swaylock, qt6ct,
# kvantum, webp-pixbuf-loader, libmtp, chrony) are this package's own; the rest moved to desktop-dkde-core
# (which the rescue image uses).
# r3: greetd (the graphical login, with dkde's greeter) and NetworkManager (the
# network service) are part of the default desktop, so a system with it has both
# installed; images enable the services (dinit services are not enabled by packages).
# RULE (user, 2026-11-15): the optional extras of dkde (a new optional dependency in its README table)
# are added to this list, never to desktop-dkde-core: the rescue disk uses the core and its space is
# kept for its own tools.
name = "desktop-dkde"
version = "1"
release = 6
summary = "DKDE desktop for FenrirOS (the default)"
license = "MIT"
homepage = "https://github.com/BearzRobotics/dkbuild"
options = ["meta"]
rundeps = [
    "desktop-dkde-core",
    # printing (dkde's print dialogs), OCR (the PDF reader and image viewer), online accounts (Settings, calendars)
    "cups", "cups-filters", "ocrmypdf", "gnome-online-accounts-gtk",
    # Bluetooth, screen lock, the Qt theme plugins, WebP images, MTP (phones, cameras), clock sync
    "bluez", "swaylock", "qt6ct", "kvantum", "webp-pixbuf-loader", "libmtp", "chrony",
    # backlight control: the brightness slider and, new in dkde 0.3.1, dimming the screen before it locks
    "brightnessctl",
]
