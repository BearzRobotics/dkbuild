# The Xfce desktop (4.20, on X11): xfwm4, the panel, desktop, Thunar with
# removable media and network places (gvfs, udisks), settings, session and
# power manager, on Xorg with Mesa, D-Bus, elogind, polkit and PipeWire.
# SDDM logs in to it, or `startxfce4` from a console. desktop-xfce-apps and
# desktop-xfce-plugins come with it (Chimera's xfce4, xfce4-apps and
# xfce4-panel-plugins).
name = "desktop-xfce"
version = "4.20"
release = 1
summary = "Xfce desktop"
license = "MIT"
homepage = "https://www.xfce.org"
options = ["meta"]
rundeps = [
    "xfwm4", "xfce4-panel", "xfdesktop", "xfce4-session", "xfce4-settings", "xfce4-appfinder",
    "xfce4-power-manager", "xfce4-notifyd", "xfce4-screenshooter", "thunar", "thunar-volman", "tumbler",
    "gvfs", "udisks", "xserver-xorg", "xserver-xorg-input-libinput", "xinit", "mesa", "dbus", "elogind",
    "polkit", "pipewire", "wireplumber", "xdg-desktop-portal-gtk", "xdg-user-dirs", "adwaita-icon-theme",
    "hicolor-icon-theme", "fonts-dejavu", "sddm",
]

[subpackages.apps]
summary = "Xfce applications"
empty = true
install_if = ["desktop-xfce"]
depends = [
    "catfish", "gigolo", "mousepad", "orage", "pavucontrol", "ristretto", "xfburn", "xfce4-dict",
    "xfce4-mixer", "xfce4-screensaver", "xfce4-taskmanager", "xfce4-terminal", "xfce4-volumed-pulse",
]

[subpackages.plugins]
summary = "Xfce panel plugins"
empty = true
install_if = ["desktop-xfce"]
depends = [
    "xfce4-battery-plugin", "xfce4-calculator-plugin", "xfce4-clipman-plugin", "xfce4-cpufreq-plugin",
    "xfce4-cpugraph-plugin", "xfce4-diskperf-plugin", "xfce4-docklike-plugin", "xfce4-eyes-plugin",
    "xfce4-fsguard-plugin", "xfce4-generic-slider", "xfce4-genmon-plugin", "xfce4-indicator-plugin",
    "xfce4-mailwatch-plugin", "xfce4-netload-plugin", "xfce4-notes-plugin", "xfce4-places-plugin",
    "xfce4-pulseaudio-plugin", "xfce4-sensors-plugin", "xfce4-smartbookmark-plugin",
    "xfce4-stopwatch-plugin", "xfce4-systemload-plugin", "xfce4-time-out-plugin", "xfce4-timer-plugin",
    "xfce4-verve-plugin", "xfce4-wavelan-plugin", "xfce4-weather-plugin", "xfce4-whiskermenu-plugin",
    "xfce4-windowck-plugin", "xfce4-xkb-plugin",
]
