# deckcraft: part of the Craft App Suite (storytold), pure Rust on egui/wgpu. Create and present slide decks
# Crates vendored on the host (cargodeps), git dependencies included (storytold/craft-libs, the
# storytold forks of egui and winit, winprint.rs which is Windows only but in Cargo.lock).
# Optional build input included: craft-fonts at the commit upstream's CI uses (CRAFT_FONTS_DIR,
# embedded in the binary). Both unpack as further sources in /build.
# Windowing (Wayland, X11, xkbcommon) and the GPU (Vulkan, EGL) are opened at run time, so they
# are run-time dependencies, as for alacritty.
# Generated from the wordcraft recipe's pattern; source edits: none. Not built yet when written.
# drop-unused-patches.patch (Cargo.toml and Cargo.lock): the egui fork [patch] entries no member uses
# (egui_demo_lib, egui_inspection, ...) are removed, as cargo vendor leaves those crates out and the
# offline build then failed in cargo ("patch location ... does not contain packages matching
# egui_demo_lib").
name = "deckcraft"
version = "0.18.1"
release = 1
summary = "Create and present slide decks"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/storytold/deckcraft"
hostdeps = ["rust", "pkgconf"]
builddeps = ["libxcb-devel", "libxkbcommon-devel", "wayland-devel", "alsa-lib-devel"]
rundeps = ["libxkbcommon", "mesa", "vulkan-loader", "wayland", "libx11", "libxcb", "shared-mime-info", "hicolor-icon-theme", "alsa-lib"]
options = ["!check", "cargodeps"]
patches = ["drop-unused-patches.patch"]

source = [
    { url = "https://github.com/storytold/deckcraft/archive/refs/tags/v0.18.1.tar.gz", sha256 = "df8827f38677020445a68d5fd5779adfdb74dd72b127c3d06ba7dff60fbfa738" },
    { url = "https://github.com/storytold/craft-fonts/archive/37827adc41fd165f9a9234ac40f94dbad353aa69.tar.gz", sha256 = "64c213260ee643c99edb1300ff047a2a00b270d7efef4aa943fec78641fdfef0" },
]

environment = '''
export CARGO_HOME=/tmp/cargo-home CARGO_NET_OFFLINE=true
export CRAFT_FONTS_DIR=/build/craft-fonts-37827adc41fd165f9a9234ac40f94dbad353aa69
'''
build = '''
test -d "$CRAFT_FONTS_DIR/fonts"
cargo build --release --frozen --offline --locked -j $jobs -p deckcraft -p deckcraft-cli
'''
install = '''
install -Dm755 target/release/deckcraft "$pkgdir/usr/bin/deckcraft"
install -Dm755 target/release/deckcraft-cli "$pkgdir/usr/bin/deckcraft-cli"
id=ai.storyteller.deckcraft
install -Dm644 packaging/linux/$id.desktop "$pkgdir/usr/share/applications/$id.desktop"
install -Dm644 packaging/linux/$id.mime.xml "$pkgdir/usr/share/mime/packages/$id.xml"
mkdir -p "$pkgdir/usr/share/metainfo"
sed -e "s/@VERSION@/$version/g" -e "s/@DATE@/2026-11-12/g" \
    packaging/linux/$id.metainfo.xml.in > "$pkgdir/usr/share/metainfo/$id.metainfo.xml"
mkdir -p "$pkgdir/usr/share/icons"
cp -R assets/app-icon/hicolor "$pkgdir/usr/share/icons/"
install -Dm644 LICENSE-MIT "$pkgdir/usr/share/licenses/deckcraft/LICENSE-MIT"
install -Dm644 LICENSE-APACHE "$pkgdir/usr/share/licenses/deckcraft/LICENSE-APACHE"
install -Dm644 NOTICE "$pkgdir/usr/share/licenses/deckcraft/NOTICE"
install -Dm644 ATTRIBUTION.md "$pkgdir/usr/share/doc/deckcraft/ATTRIBUTION.md"
'''
