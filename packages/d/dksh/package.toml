# Experimental and not yet tested widely; not POSIX-compatible, so it is never /bin/sh
# (that is dash). An optional login shell, registered in /etc/shells.
name = "dksh"
version = "0.0.1"
release = 1
summary = "A small shell written in Zig"
license = "MIT"
homepage = "https://github.com/BearzRobotics/dksh"
hostdeps = ["zig"]
options = ["!check"]  # zig builds static executables itself

source = [
    { url = "https://github.com/BearzRobotics/dksh/releases/download/v0.0.1/dksh-0.0.1.tar.gz", sha256 = "27802ee75f2f6fe53c1f87bd72cbe678aa4bb304562bd8706e8a4f2ff11299ac" },
]

install = '''
%zig_build
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/dksh/LICENSE"
'''
