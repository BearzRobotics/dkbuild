# needed by: base (the text login console that replaces agetty).
# Zig dependencies (dkterm -> libghostty-vt, toml-zig) are fetched on the host by
# `dkbuild fetch` (option `zigdeps`) and built offline with --system zig-pkg.
name = "dkconsole"
version = "0.2.0"
release = 1
summary = "Text console for Linux virtual terminals; replaces agetty"
license = "MIT"
homepage = "https://github.com/BearzRobotics/dkconsole"
archs = ["x86_64"]
hostdeps = ["zig"]
options = ["zigdeps", "!check"]

source = [
    { url = "https://github.com/BearzRobotics/dkconsole/releases/download/v0.2.0/dkconsole-0.2.0.tar.gz", sha256 = "ce9bfd291cd90f590064cc0cabd81bad81e70eed8efdd35360b24afd31d9d866" },
]

install = '''
# a build step runs a generator it compiled (uucode_generate) from inside
# zig-pkg/uucode-*, by a path through ../.. to the cache; zig-pkg's entries are
# links into the shared package store, where ../.. leads elsewhere: the
# packages are copied into the tree instead
for p in zig-pkg/*; do
    [ -L "$p" ] || continue
    t=$(readlink -f "$p"); rm "$p"; cp -a "$t" "$p"
done
%zig_build
# The dinit template service: one instance per VT (dinitctl enable dkconsole@1).
install -Dm644 data/dinit.d/dkconsole@ "$pkgdir/etc/dinit.d/dkconsole@"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/dkconsole/LICENSE"
'''
