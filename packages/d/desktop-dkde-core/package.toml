# The DKDE desktop without its optional extras: printing (cups, cups-filters), OCR (ocrmypdf), online
# accounts (gnome-online-accounts-gtk), Bluetooth (bluez), screen lock (swaylock), the Qt theme plugins (qt6ct,
# kvantum), WebP images, MTP (libmtp) and clock sync (chrony). desktop-dkde is this plus those (dkde's
# optional dependencies are runtime ones on the full desktop); the rescue image (images/rescue.toml)
# installs this one, which a rescue disk can do without them. Here: dkde, labwc, seatd, D-Bus, polkit,
# Mesa, audio, fonts, greetd, NetworkManager, the file system tools of the partition manager and the rest.
# (An image's `unwanted` list cannot do this: it is passed to apk as a conflict, and desktop-dkde
# depends on those packages.)
# RULE (user, 2026-11-15): keep this split when the desktop is updated. What dkde newly needs only for
# optional features goes into desktop-dkde, not here: the full desktop gets all the extras, and the
# rescue disk's space is kept for its tools. New hard requirements of the desktop go here.
# r2 (2026-11-16, user): dkde-compositor and dkde-wm (dkde 0.3.2: DKDE's own Wayland compositor and X11 window manager) are part of
# the core desktop. labwc stays: it is still the session's default compositor until the session setting says otherwise.
# r3 (2026-11-17, user): the images start DKDE's own compositor, not labwc, for every new user: /etc/skel/.config/dkde/session.conf
# says `compositor=dkde-compositor` (dkde-session reads it; the live user and users the installer creates get it from /etc/skel). labwc stays
# installed: dkde-session falls back to it when the named compositor is missing, and a user can set `compositor=labwc` in their own file.
# No longer a pure meta package (it ships that file).
name = "desktop-dkde-core"
version = "1"
release = 4
summary = "DKDE desktop for FenrirOS, without printing, OCR and online accounts"
license = "MIT"
homepage = "https://github.com/BearzRobotics/dkbuild"
options = ["!check", "!strip"]
rundeps = [
    "dkde", "dkde-compositor", "dkde-wm", "labwc", "seatd", "dbus", "polkit", "mesa", "vulkan-loader",
    "pipewire", "wireplumber", "fonts-dejavu", "shared-mime-info", "hicolor-icon-theme", "xwayland",
    "greetd", "networkmanager",
    # dkde's optional dependencies, treated as runtime ones (dkde's README table): sound tools
    # (pactl, paplay), brightness, Wi-Fi radio switch, the icons and the fonts (papirus, Noto and its emoji
    # font stay by decision), and what the partition manager runs to format and check each file system.
    # Optional extras (printing, OCR, online accounts, Bluetooth, screen lock, the Qt theme plugins,
    # WebP images, phones and cameras over MTP, clock sync) are in desktop-dkde, not here.
    "libpulse", "brightnessctl", "wlr-randr",
    "librsvg", "papirus-icon-theme", "fonts-noto", "fonts-noto-emoji-ttf",
    "sudo", "shadow", "openssh", "udisks",
    "parted", "e2fsprogs", "dosfstools", "exfatprogs", "xfsprogs", "btrfs-progs", "ntfs-3g",
    "f2fs-tools", "jfsutils", "reiserfsprogs", "nilfs-utils", "udftools", "fatresize",
    "tmux", "vim", "htop",
    # r4 (user, 2026-11-17): the X11 session (dkde-session --x11 starts dkde-wm under startx) is part of the core desktop: the Xorg
    # server with libinput, startx (xinit) and the X utilities the session scripts use. desktop-dkde lists the same ones.
    "xserver-xorg", "xserver-xorg-input-libinput", "xinit", "xrandr", "xset", "xsetroot", "xrdb", "xmodmap", "xkbcomp",
]

install = '''
install -Dm644 $pkgfiles/session.conf "$pkgdir/etc/skel/.config/dkde/session.conf"
'''
