# .NET 10 (SDK 10.0.114, runtime and ASP.NET Core 10.0.14), built from source
# with upstream's offline "source-only" build, as Fedora and Alpine do.
# The source is a snapshot (src/snapshot-dotnet.sh): the VMR (dotnet/dotnet),
# the previously source-built artifacts with linux-musl-x64 packages
# (prep-source-build.sh --bootstrap-rid), and the seed: Microsoft's own
# linux-musl-x64 SDK, which the build runs on (as Go, Rust and Java start from
# a binary): the version the VMR's global.json pins (tools.dotnet, 10.0.112),
# which matches the previously source-built packages; a newer seed (10.0.114)
# asks for packs they do not have (ILLink.Tasks >= 10.0.14, NU1102).
# The result is a portable linux-musl-x64 SDK in /usr/lib/dotnet.
# Source-build only builds the 1xx SDK feature band.
# Self-hosted (`selfhost`): a build runs on the SDK and the source-built
# packages (dotnet-artifacts, Private.SourceBuilt.Artifacts) of the newest
# dotnet in repo/, as Alpine and Fedora build each .NET with the previous one.
# Only the first build (stage 0, no dotnet in repo/ yet) runs on Microsoft's
# musl SDK and packages from the snapshot, which are linked against GCC's C++
# runtime: its stage0deps bring that (dotnet-bootstrap-gcc-runtime, from
# Alpine). What this recipe builds uses LLVM's libc++.
# r4: lttng-ust-devel (the runtime's CMake configure requires lttng/tracepoint.h on Linux;
# the event-tracing provider is built, not disabled).
# The first `dkbuild fetch dotnet` makes the snapshot and prints its sha256;
# that replaces the zeros below.
name = "dotnet"
version = "10.0.114"
release = 4
summary = ".NET SDK, runtime and ASP.NET Core"
license = "MIT"
homepage = "https://dotnet.microsoft.com"
archs = ["x86_64"]
hostdeps = ["bash", "cmake", "curl", "findutils", "git", "llvm", "llvm-clang", "llvm-lld", "python", "zlib-ng-compat-devel"]
stage0deps = ["dotnet-bootstrap-gcc-runtime"]
builddeps = ["brotli-devel", "heimdal-devel", "icu-devel", "linux-headers", "lttng-ust-devel", "openssl-devel", "zlib-ng-compat-devel"]
rundeps = ["icu", "openssl", "heimdal-libs", "lttng-ust"]
options = ["!check", "!strip", "jobs:12", "selfhost"]

source = [
    { url = "snapshot:dotnet v10.0.114 10.0.112", sha256 = "9b4a5b419f57b92762113325fa69ae1cd780d77d3871aae83ea174a831db20eb" },
]

environment = '''
# the native parts take their own flags
unset CFLAGS CXXFLAGS LDFLAGS CPPFLAGS
export DOTNET_CLI_TELEMETRY_OPTOUT=1 DOTNET_NOLOGO=1 DOTNET_SKIP_FIRST_TIME_EXPERIENCE=1
export HOME=/tmp SHELL=/bin/bash
# stage 0 only: Microsoft's musl SDK and packages need GCC's C++ runtime
if [ -d /usr/lib/dotnet-bootstrap-gcc ]; then export LD_LIBRARY_PATH=/usr/lib/dotnet-bootstrap-gcc; fi
# its archives are unpacked as root in the sandbox, where tar cannot chown
export TAR_OPTIONS=--no-same-owner
'''
setup = '''
# the snapshot's files carry 1970 times (it is packed reproducibly, mtime 0);
# NuGet packs only zip-representable dates (1980 on) and the build turns that
# warning (NU5132) into an error: a fixed later time instead
find . -exec touch -h -d @946684800 {} +
# GSSAPI is Heimdal's here (heimdal-devel; there is no MIT krb5): without the
# HeimdalGssApi option System.Net.Security.Native looks for libgssapi_krb5 and
# stops ("Cannot find libgssapi_krb5"). The option defaults to OFF in the two
# configure.cmake files (the shared native libs, and the static apphost), so
# they default to ON; and the shim that loads the library on demand opens
# Heimdal's soname, libgssapi.so.3, not MIT's libgssapi_krb5.so.2.
sed -i 's/^option(HeimdalGssApi "use heimdal implementation of GssApi" OFF)/option(HeimdalGssApi "use heimdal implementation of GssApi" ON)/' \
    src/runtime/src/native/libs/configure.cmake src/runtime/src/native/corehost/apphost/static/configure.cmake
grep -q 'GssApi" ON' src/runtime/src/native/libs/configure.cmake
grep -q 'GssApi" ON' src/runtime/src/native/corehost/apphost/static/configure.cmake
sed -i 's/"libgssapi_krb5\.so\.2"/"libgssapi.so.3"/' src/runtime/src/native/libs/System.Net.Security.Native/pal_gssapi.c
grep -q 'libgssapi\.so\.3' src/runtime/src/native/libs/System.Net.Security.Native/pal_gssapi.c
'''
build = '''
ulimit -n 4096 || true
# Source Link needs the repository and commit; the snapshot is a tag archive
# with no .git and no release manifest (v10.0.114 is commit 0427b9ab...)
# the previous dotnet's SDK and source-built packages, or (stage 0, none in
# repo/ yet) the snapshot's Microsoft ones
if [ -x /usr/lib/dotnet/dotnet ]; then
    a=$(ls /usr/lib/dotnet-artifacts/Private.SourceBuilt.Artifacts.*.tar.gz)
    mkdir -p /tmp/previously-source-built
    tar -xzf "$a" -C /tmp/previously-source-built --no-same-owner
    seed="--with-sdk /usr/lib/dotnet --with-packages /tmp/previously-source-built"
else
    seed="--with-sdk $PWD/.dotnet-musl"
fi
./build.sh --source-only $seed \
    --source-repository https://github.com/dotnet/dotnet \
    --source-version 0427b9abbead3fa64c6655eb4290c537397131fa -- \
    /p:TargetRid=linux-musl-x64 /p:PortableBuild=true /p:OfficialBuilder=FenrirOS \
    /p:ContinueOnPrebuiltBaselineError=true /p:LogVerbosity=minimal /p:MinimalConsoleLogOutput=true \
    /p:UseSystemLibs=brotli+zlib
'''
install = '''
d="$pkgdir/usr/lib/dotnet"
mkdir -p "$d" "$pkgdir/usr/bin" "$pkgdir/etc/dotnet"
tar -xzf artifacts/assets/Release/dotnet-sdk-*-linux-musl-x64.tar.gz -C "$d" --no-same-owner
ln -s ../lib/dotnet/dotnet "$pkgdir/usr/bin/dotnet"
echo /usr/lib/dotnet > "$pkgdir/etc/dotnet/install_location"
echo /usr/lib/dotnet > "$pkgdir/etc/dotnet/install_location_x64"
# programs find the runtime through this
install -Dm644 /dev/stdin "$pkgdir/etc/profile.d/dotnet.sh" <<'EOF2'
export DOTNET_ROOT=/usr/lib/dotnet DOTNET_CLI_TELEMETRY_OPTOUT=1
EOF2
install -Dm644 LICENSE.TXT "$pkgdir/usr/share/licenses/dotnet/LICENSE.TXT"
# what the next dotnet build starts from (dotnet-artifacts)
install -Dm644 -t "$pkgdir/usr/lib/dotnet-artifacts" artifacts/assets/Release/Private.SourceBuilt.Artifacts.*.tar.gz
'''

[subpackages.artifacts]
summary = "Source-built .NET packages, for building the next .NET from source"
paths   = ["/usr/lib/dotnet-artifacts"]
