name = "distrobox"
version = "1.8.2.5"
release = 1
summary = "Use any Linux distribution inside your terminal"
license = "GPL-3.0-only"
homepage = "https://distrobox.it"
patches = ["rootful-export-pkexec.patch", "rootless-stop-SIGKILL.patch"]
rundeps = ["curl", "podman", "polkit"]

source = [
    { url = "https://github.com/89luca89/distrobox/archive/1.8.2.5.tar.gz", sha256 = "0c3bc4785ee3be3b89f93abb7cc0a9f60e56989e81319af140a4b60403b18f80" },
]

install = '''
./install --prefix $pkgdir/usr
install -Dm644 $pkgfiles/distrobox.conf "$pkgdir/usr/share/distrobox/distrobox.conf"
install -dm755 "$pkgdir/usr/share/doc/distrobox"
install -m644 docs/*.md "$pkgdir/usr/share/doc/distrobox/"
'''
