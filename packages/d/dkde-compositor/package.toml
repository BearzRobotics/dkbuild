# dkde-compositor: DKDE's own Wayland compositor (experimental), in Zig on wlroots 0.20: floating and tiling windows,
# workspaces, configurable shortcuts, layer-shell, taskbar and workspace protocols, output management, screen lock, idle,
# Xwayland and screen capture. A separate Zig package inside the dkde tarball (src/compositor), built against the
# tarball's vendored dependencies (zig-pkg/, offline: --system). With it installed, labwc becomes optional: select it
# with `compositor=dkde-compositor` in ~/.config/dkde/session.conf or DKDE_COMPOSITOR (the session entry
# dkde-compositor.desktop is installed). Same source and version as dkde.
# 0.3.6 (2026-11-27, the user gave the release): the release tarball, which has zig-pkg/. It replaces the pin to commit
# 48f21b6 (0.3.6_pre20261127), made for console switching.
# Built from the tree's top build.zig (-Dapp=compositor). It now needs GLES2 and EGL (libglvnd-devel). Its session entry,
# dkde-compositor.desktop, is gone: dkde's dkde.desktop starts it by default. Not built.
name = "dkde-compositor"
version = "0.3.6"
release = 1
summary = "DKDE's Wayland compositor (experimental)"
license = "MIT"
homepage = "https://github.com/BearzRobotics/dkde"
archs = ["x86_64"]
hostdeps = ["zig", "pkgconf", "wayland"]
builddeps = ["wlroots0.20-devel", "wayland-devel", "wayland-protocols", "libxkbcommon-devel", "pixman-devel", "libinput-devel", "libglvnd-devel"]
rundeps = ["dkde", "seatd"]
options = ["zigdeps", "!check"]

source = [
    { url = "https://github.com/BearzRobotics/dkde/releases/download/v0.3.6/dkde-v0.3.6.tar.gz", sha256 = "2f0e98e882c2f141f719cf25f4b3ede1f3a92f72287f225467df2c142e4aad2f" },
]

install = '''
# uucode's generator runs through ../.. from inside zig-pkg/uucode-*, which
# must not be a link into the package store (as in dkconsole): copied instead
for p in zig-pkg/*; do
    [ -L "$p" ] || continue
    t=$(readlink -f "$p"); rm "$p"; cp -a "$t" "$p"
done
%zig_build -Dapp=compositor -Dwlroots=0.20
# a one-part build also installs the shared settings files, which are the dkde package's
rm "$pkgdir/usr/share/dkde/style.css" "$pkgdir/usr/share/dkde/dkde.toml"
rmdir "$pkgdir/usr/share/dkde"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/dkde-compositor/LICENSE"
'''
