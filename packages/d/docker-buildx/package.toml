# docker-buildx: the Docker CLI plugin for extended builds with BuildKit
# (`docker buildx`, and the default builder behind `docker build`).
# Its Go dependencies are in the tarball's vendor/.
# Based on Chimera Linux cports (BSD-2-Clause): main/docker-cli-buildx.
name = "docker-buildx"
version = "0.39.0"
release = 1
summary = "Docker CLI plugin for extended builds with BuildKit"
license = "Apache-2.0"
homepage = "https://github.com/docker/buildx"
hostdeps = ["go"]
rundeps = ["docker-cli"]
options = ["!check"]

source = [
    { url = "https://github.com/docker/buildx/archive/refs/tags/v0.39.0.tar.gz", sha256 = "45aa68ee053b9bfa3c82f3dc7a2562e118be33e20ac87f572fa6e9f3d9ad67da" },
]

environment = '''
export GOTOOLCHAIN=local GOPROXY=off GOFLAGS=-mod=vendor GOCACHE=/tmp/go-cache GOPATH=/tmp/go CGO_ENABLED=1
'''
build = '''
go build -trimpath -buildmode=pie -o build/docker-buildx \
    -ldflags "-X github.com/docker/buildx/version.Version=v$version -X github.com/docker/buildx/version.Package=github.com/docker/buildx" \
    ./cmd/buildx
'''
install = '''
install -Dm755 build/docker-buildx "$pkgdir/usr/lib/docker/cli-plugins/docker-buildx"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/docker-buildx/LICENSE"
'''
