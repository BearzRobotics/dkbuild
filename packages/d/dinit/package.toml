# Reviewed by hand; dependency names are Chimera's and resolve from stage 0 until they are recipes.
# r2: /usr/sbin/init points at ../bin/dinit (dinit is in /usr/bin; the link said ./dinit).
name = "dinit"
version = "0.22.0"
release = 3
summary = "Service manager and init system"
license = "Apache-2.0"
homepage = "https://davmac.org/projects/dinit"
patches = ["restart-interval.patch"]
builddeps = ["libcap-devel"]

source = [
    { url = "https://github.com/davmac314/dinit/archive/v0.22.0.tar.gz", sha256 = "926d431e1c596a214612a1fc31c66fc0356630c5759edc313fe7153eaf462ffc" },
]

environment = '''
export CXXFLAGS="${CXXFLAGS} -fno-rtti"
'''
setup = '''
./configure \
    --disable-strip \
    --enable-shutdown \
    --platform=Linux \
    --sbindir=/usr/sbin \
    --mandir=/usr/share/man \
    --enable-cgroups
'''
build = '''
make -j$jobs LDFLAGS="$LDFLAGS -static"
'''
check = '''
%make check check-igr
'''
install = '''
%make_install
mkdir -p "$pkgdir/usr/sbin"; ln -sf ../bin/dinit "$pkgdir/usr/sbin/init"
'''
