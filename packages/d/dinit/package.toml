# Imported from Chimera Linux cports: work/cports/main/dinit/template.py
# cports is BSD-2-Clause, Copyright (c) Chimera Linux contributors.
# Reviewed by hand; dependency names are Chimera's and resolve from stage 0 until they are recipes.
# r2: /usr/sbin/init points at ../bin/dinit (dinit is in /usr/bin; the link said ./dinit).
# 0.23.0 (from 0.22.0; the last beta before 1.0): a dependency failing is now always a failure
# of the service that depends on it, and the new `failure-conditions` setting says when a
# process service counts as failed. restart-interval.patch (default restart delay 1 s and 5
# restarts, from Chimera) still applies, with line offsets.
name = "dinit"
version = "0.23.0"
release = 2
summary = "Service manager and init system"
license = "Apache-2.0"
homepage = "https://davmac.org/projects/dinit"
# reset-sigpipe.patch (r2): dinit ignores SIGPIPE and passed that on to every service, so every shell from a getty or a
# login manager had it ignored: pipelines such as `grep x file | head` ended in "grep: write error: Broken pipe".
patches = ["restart-interval.patch", "reset-sigpipe.patch"]
builddeps = ["libcap-devel"]

source = [
    { url = "https://github.com/davmac314/dinit/archive/v0.23.0.tar.gz", sha256 = "911ed52b78ce4950824623d58826b88a839748e18ef837a234d50db6d83972e2" },
]

environment = '''
export CXXFLAGS="${CXXFLAGS} -fno-rtti"
'''
setup = '''
./configure \
    --disable-strip \
    --enable-shutdown \
    --platform=Linux \
    --sbindir=/usr/sbin \
    --mandir=/usr/share/man \
    --enable-cgroups
'''
build = '''
make -j$jobs LDFLAGS="$LDFLAGS -static"
'''
check = '''
%make check check-igr
'''
install = '''
%make_install
mkdir -p "$pkgdir/usr/sbin"; ln -sf ../bin/dinit "$pkgdir/usr/sbin/init"
'''
