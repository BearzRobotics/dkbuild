# Imported from Chimera Linux cports: main/libssh2/template.py
# cports is BSD-2-Clause, Copyright (c) Chimera Linux contributors.
# needed by: curl (sftp:// and scp://).
# r3: static libraries too (in libssh2-static), for fully static programs on musl.
name = "libssh2"
version = "1.11.1"
release = 4
summary = "Library implementing the SSH2 protocol"
license = "BSD-3-Clause"
homepage = "https://www.libssh2.org"
# Security patches from Alpine Linux (aports, master main/libssh2), added 2026-11-27: CVE-2025-15661.patch, libssh-unconst-backport.patch, CVE-2026-55199.patch, CVE-2026-55200.patch, CVE-2026-58050.patch, CVE-2026-58051.patch, CVE-2026-66032.patch, CVE-2026-66033.patch, CVE-2026-66034.patch, CVE-2026-66035.patch
patches = ["CVE-2026-7598.patch", "CVE-2025-15661.patch", "libssh-unconst-backport.patch", "CVE-2026-55199.patch", "CVE-2026-55200.patch", "CVE-2026-58050.patch", "CVE-2026-58051.patch", "CVE-2026-66032.patch", "CVE-2026-66033.patch", "CVE-2026-66034.patch", "CVE-2026-66035.patch"]
hostdeps = ["pkgconf"]
builddeps = ["zlib-ng-compat-devel", "openssl-devel"]
checkdeps = ["bash"]

source = [
    { url = "https://www.libssh2.org/download/libssh2-1.11.1.tar.gz", sha256 = "d9ec76cbe34db98eec3539fe2c899d26b0c837cb3eb466a56b0f109cabf658f7" },
]

setup = '''
%configure \
    --with-libssl-prefix=/usr \
    --disable-docker-tests
'''
build = '''
%make
'''
check = '''
%make check
'''
install = '''
%make_install
install -Dm644 COPYING "$pkgdir/usr/share/licenses/libssh2/COPYING"
'''
