# libnslog: part of the NetSurf project's libraries (needed by netsurf, elinks).
# The NetSurf build system installs a shared and a static library from two
# passes (COMPONENT_TYPE=lib-shared, lib-static); both are installed.
# WARNFLAGS=-w: the libraries build with -Werror, which a newer clang than the
# ones upstream tests turns into failures on harmless warnings.
name = "libnslog"
version = "0.1.3"
release = 1
summary = "Filtered logging library"
license = "MIT"
homepage = "https://www.netsurf-browser.org/projects/nslog/"
hostdeps = ["netsurf-buildsystem", "perl", "pkgconf"]
builddeps = []
options = ["!check"]

source = [
    { url = "https://download.netsurf-browser.org/libs/releases/libnslog-0.1.3-src.tar.gz", sha256 = "fc98dca9d7efa67096470a5d96c023146e25bfdec08c0db74661c7b4db0453d0" },
]

build = '''
for t in lib-shared lib-static; do
    %make PREFIX=/usr WARNFLAGS=-w COMPONENT_TYPE=$t
done
'''
install = '''
for t in lib-shared lib-static; do
    make DESTDIR="$pkgdir" PREFIX=/usr WARNFLAGS=-w COMPONENT_TYPE=$t install
done
install -Dm644 COPYING "$pkgdir/usr/share/licenses/libnslog/COPYING"
'''
