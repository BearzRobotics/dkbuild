# libosinfo: a GObject library over the osinfo database (which OS an ISO is,
# its recommended resources and devices); virt-manager and virt-install use it.
# Based on Chimera Linux cports (BSD-2-Clause): main/libosinfo, with its
# libxml2 2.14 patch.
name = "libosinfo"
version = "1.12.0"
release = 1
summary = "GObject API for managing information about operating systems"
license = "GPL-2.0-or-later AND LGPL-2.1-or-later"
homepage = "https://libosinfo.org"
patches = ["libxml-2.14.patch"]
hostdeps = ["gettext", "glib-devel", "gobject-introspection", "meson", "ninja", "perl", "pkgconf", "vala"]
builddeps = ["glib-devel", "libsoup-devel", "libxml2-devel", "libxslt-devel"]
rundeps = ["hwdata", "osinfo-db"]
options = ["!check"]

source = [
    { url = "https://gitlab.com/libosinfo/libosinfo/-/archive/v1.12.0/libosinfo-v1.12.0.tar.gz", sha256 = "3c52fb542d65d1ec5a10f87126d7513c2bd115eaa2f87fb91b15ba588708fc7b" },
]

setup = '''
%meson \
    -Denable-introspection=enabled \
    -Denable-vala=enabled \
    -Denable-gtk-doc=false
'''
build = '''
%meson_build
'''
install = '''
%meson_install
install -Dm644 COPYING "$pkgdir/usr/share/licenses/libosinfo/COPYING"
'''
