    { url = "https://github.com/jasenhuang/katana-parser/archive/be6df458d4540eee375c513958dcb862a391cdd1.tar.gz", sha256 = "3522aa95456f2faa7f43052c5f38c4d5cff8320f9a69fe6aac33eb1dda7b91b5" },
    { url = "https://github.com/mity/md4c/archive/481fbfbdf72daab2912380d62bb5f2187d438408.tar.gz", sha256 = "07252052c3e3c23efeab44b6d52d093817102b2b500353889d72c241a1b76a79" },
    { url = "https://github.com/socketio/socket.io-client-cpp/archive/da779141a7379cc30c870d48295033bc16a23c66.tar.gz", sha256 = "db27c280f375a5983eed8185485e823262a328f95bc549f70667fccbbeab49b4" },
    { url = "https://github.com/chriskohlhoff/asio/archive/230c0d2ae035c5ce1292233fcab03cea0d341264.tar.gz", sha256 = "09566f5296692d042358bee4211d126cef3d5062a8fa86829d2962ac0e538a34" },
