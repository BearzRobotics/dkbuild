# Libera Suite 0.7.0 (Abilian): a desktop office suite (Libera Words, Tables,
# Slides, Diagrams, and a PDF editor) that runs Euro-Office's editors in a
# GTK + WebKitGTK window through pywebview, with Euro-Office's x2t for
# conversions: no CEF, no Qt. FenrirOS's Euro-Office desktop app, in place of
# Euro-Office's CEF-based Desktop Editors (wip/euro-office/NOTES.md).
#
# Two halves, as upstream ships them:
#   - the host (Python, Apache-2.0): the libera sdist from PyPI, installed
#     with pip on the system Python; its GTK window through python-pywebview,
#     python-gobject and webkitgtk (WebKit2 4.1, GTK 3).
#   - the payload 0.7.1 (AGPL-3.0): upstream publishes it as the libera-core
#     wheels (prebuilt x2t, glibc) and the libera-web wheel (prebuilt
#     editors). Built here from source instead, as Libera's own build does it
#     (build/engine/build.sh, payload.sh, dist.sh in the libera_core sdist):
#     Euro-Office core, sdkjs and web-apps at the commits Libera pins
#     (build/upstream/pins.toml: Euro-Office Desktop Editors 9.3.5-2), with
#     Libera's patch queue (build/upstream/patches: 112 for core, 5 sdkjs,
#     13 web-apps, 2 libxml2; each patch's message says what it changes and
#     why), and libxml2 2.9.14 in place of core's own copy (Libera's 0172).
#
# Why not euro-office-core / -documentserver: Libera pins other revisions
# (9.3.5-2, not 9.3.7-1), needs its patches (the host relies on 0034, the V8
# code cache in a folder it names, and 0190, libera-sign; the rest fix ODF,
# PDF, signatures and hostile documents), and needs the editors built for the
# desktop platform (SDK_PLATFORM=desktop), where the Document Server's are
# built for the server. So it builds its own core and editors, and shares
# what is the same: euro-office-v8 (core 5a33ce6 pins the same V8 8.9.45 and
# GN), the system ICU/Boost/OpenSSL (files/fenriros-system-libraries.patch,
# as euro-office-core), and core's third-party sources at the same commits
# as euro-office-core (brotli is a47d747 at this core).
#
# Left out or changed from upstream's payload:
#   - the "libera" web-apps theme (its artwork is not in Libera's public
#     sources): the editors use Euro-Office's theme; the host's windows,
#     menus and icon are Libera's.
#   - sdkjs's checked-in WebAssembly modules are used, as in
#     euro-office-documentserver.
#   - the update check (once a day, a request to Abilian's CDN, which would
#     tell the user to update with pip or the install script) is off unless
#     config.toml says check_updates = true (a sed in setup).
#   - the host's per-user desktop entry writer is not needed: the desktop
#     entry and icon are installed system-wide here.
# The payload sits in /usr/lib/libera-suite/payload; /usr/bin/libera sets
# LIBERA_PAYLOAD to it (files/libera), the host's own setting for a payload in
# a folder. Fonts: Libera's core set (build/payload/fonts-core.txt) of
# Euro-Office's core-fonts; the host indexes them, and the system's fonts,
# per user at first start (its payload/fonts.py).
# Not built yet.
name = "libera-suite"
version = "0.7.0"
release = 1
summary = "Desktop office suite built on Euro-Office's editors (GTK, WebKitGTK)"
license = "Apache-2.0 AND AGPL-3.0-only AND CC-BY-SA-4.0"
homepage = "https://docs.liberasuite.eu"
archs = ["x86_64", "aarch64"]
hostdeps = ["python", "python-hatchling", "cmake", "ninja", "pkgconf", "nodejs", "git"]
builddeps = ["euro-office-v8", "boost-devel", "icu-devel", "openssl-devel", "zlib-ng-compat-devel"]
rundeps = ["python", "python-pywebview", "python-gobject", "python-typing-extensions", "webkitgtk", "gtk+3"]
options = ["!check", "npmdeps", "jobs:12"]

