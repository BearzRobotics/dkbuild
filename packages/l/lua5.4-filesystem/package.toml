# LuaFileSystem for Lua 5.4: directory listing, attributes, locks, links
# (needed by Prosody). A Lua C module: no library for other programs to
# link, so no -static.
name = "lua5.4-filesystem"
version = "1.9.0"
release = 1
summary = "File system library for Lua 5.4"
license = "MIT"
homepage = "https://github.com/lunarmodules/luafilesystem"
hostdeps = ["pkgconf"]
builddeps = ["lua-devel"]
rundeps = ["lua"]
options = ["!check"]

source = [
    { url = "https://github.com/lunarmodules/luafilesystem/archive/refs/tags/v1_9_0.tar.gz", sha256 = "1142c1876e999b3e28d1c236bf21ffd9b023018e336ac25120fb5373aade1450" },
]

build = '''
# config hard-codes gcc and Lua 5.1; its -W flags are warnings only
make lib CC="$CC" PREFIX=/usr LUA_VERSION=5.4
'''
install = '''
make install PREFIX=/usr LUA_VERSION=5.4 DESTDIR="$pkgdir"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/lua5.4-filesystem/LICENSE"
'''
