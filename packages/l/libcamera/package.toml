# libcamera: the open camera stack (complex cameras: Raspberry Pi, phones,
# laptops' IPU6), with its GStreamer element; PipeWire's camera support uses
# it. From Chimera's main/libcamera (its patches). Its IPA modules are signed
# with a key made at build time, after stripping (a module whose signature
# does not match still works, but runs isolated): so this recipe strips its
# own files and signs the modules, and dkbuild's strip stays off.
name = "libcamera"
version = "0.7.2"
release = 3
summary = "Open source camera stack and framework"
license = "LGPL-2.1-or-later AND GPL-2.0-or-later"
homepage = "https://libcamera.org"
patches = ["00-meson_build.patch", "fix-segfault-in-option-handling.patch", "no-file-test.patch", "no-pisp.patch", "no-virtual.patch", "shut.patch", "yaml-parser-segfault.patch"]
hostdeps = ["meson", "ninja", "pkgconf", "python-jinja2", "python-ply", "python-pyyaml", "openssl"]
builddeps = ["gst-plugins-base-devel", "gstreamer-devel", "libevent-devel", "libyaml-devel", "mesa-devel",
             "openssl-devel", "eudev-devel", "libdrm-devel", "libjpeg-turbo-devel", "libtiff-devel", "elfutils-devel"]
options = ["!check", "!strip"]

source = [
    { url = "https://github.com/libcamera-org/libcamera/archive/refs/tags/v0.7.2.tar.gz", sha256 = "edc431e93c5a4030480a0784300486507662fa0bce910e203a5643861828528f" },
]

setup = '''
# internal/process.h uses pid_t without <sys/types.h> (glibc's C++ headers bring
# it in, musl's do not)
sed -i 's|^#include <string>$|#include <string>\n#include <sys/types.h>|' include/libcamera/internal/process.h
grep -q '^#include <sys/types.h>$' include/libcamera/internal/process.h
%meson -Dtest=false -Dqcam=disabled -Dcam=enabled -Dgstreamer=enabled -Dv4l2=enabled -Dlibdw=enabled
'''
build = '''
%meson_build
'''
install = '''
%meson_install
# strip, then sign the IPA modules as libcamera's build would
find "$pkgdir" -type f \( -name '*.so*' -o -perm -u+x \) | while read -r f; do
    head -c4 "$f" | grep -q 'ELF' && llvm-strip --strip-unneeded "$f" 2>/dev/null || true
done
for f in "$pkgdir"/usr/lib/libcamera/ipa/ipa*.so "$pkgdir"/usr/lib/libcamera/ipa*.so; do
    # a glob that matches nothing stays literal: skip it (an `[ -f ] &&` as the
    # last command made the whole install step exit 1)
    [ -f "$f" ] || continue
    src/ipa/ipa-sign.sh build/src/ipa-priv-key.pem "$f" "$f.sign"
done
'''

[subpackages.gstreamer]
summary = "GStreamer element for libcamera"
paths   = ["/usr/lib/gstreamer-1.0"]
