# libserialport: sigrok's minimal cross-platform serial port library. From
# Alpine's testing/libserialport.
name = "libserialport"
version = "0.1.2"
release = 1
summary = "Minimal C library for serial ports"
license = "LGPL-3.0-only"
homepage = "https://sigrok.org/wiki/Libserialport"
hostdeps = ["autoconf", "automake", "libtool", "pkgconf"]
builddeps = ["linux-headers"]

source = [
    { url = "https://github.com/sigrokproject/libserialport/archive/libserialport-0.1.2/libserialport-0.1.2.tar.gz", sha256 = "cbb1192a09ff31d34e7efdb17a2f50d9d1974461c0b81c29bb449515d78d8950" },
]

setup = '''
./autogen.sh
%configure
'''
build = '''
%make
'''
check = '''
%make check
'''
install = '''
%make_install
'''
