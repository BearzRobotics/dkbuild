]

environment = '''
# libtool links the library with -nostdlib and adds only the gcc runtime it
# knows of, so clang's compiler-rt builtins (__muldc3, ...) are missing
export LIBS="$LIBS $(clang -print-libgcc-file-name)"
'''
setup = '''
autoreconf -if -W none
%configure \
    --without-portaudio \
    --without-portaudiocpp
'''
build = '''
%make
'''
check = '''
%make check
'''
install = '''
%make_install
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/libopenmpt/LICENSE"
'''
