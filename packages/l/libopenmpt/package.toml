name = "libopenmpt"
version = "0.8.9"
release = 1
summary = "Library for rendering tracker music to PCM"
license = "BSD-3-Clause"
homepage = "https://lib.openmpt.org/libopenmpt"
patches = ["fix-pc-ver.patch"]
hostdeps = ["automake", "pkgconf", "libtool"]
builddeps = ["flac-devel", "libogg-devel", "libpulse-devel", "libsndfile-devel", "mpg123-devel", "zlib-ng-compat-devel"]

source = [
