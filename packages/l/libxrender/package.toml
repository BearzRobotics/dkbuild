name = "libxrender"
version = "0.9.12"
release = 2
summary = "X Render library"
license = "MIT"
homepage = "https://xorg.freedesktop.org"
hostdeps = ["automake", "pkgconf", "libtool", "xorg-util-macros-devel"]
builddeps = ["xorgproto-devel", "libx11-devel"]

source = [
    { url = "https://www.x.org/releases/individual/lib/libXrender-0.9.12.tar.gz", sha256 = "0fff64125819c02d1102b6236f3d7d861a07b5216d8eea336c3811d31494ecf7" },
]

setup = '''
autoreconf -if -W none
%configure \
    --enable-malloc0returnsnull
'''
build = '''
%make
'''
check = '''
%make check
'''
install = '''
%make_install
install -Dm644 COPYING "$pkgdir/usr/share/licenses/libxrender/COPYING"
'''
