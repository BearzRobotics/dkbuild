# needed by: dictd. Its build system is mk-configure (bmake), not in the tree;
# the library is small, so it is compiled here directly as its maa/Makefile does.
name = "libmaa"
version = "1.5.1"
release = 1
summary = "Low-level data structures library (dictd's)"
license = "MIT"
homepage = "https://sourceforge.net/projects/dict"
hostdeps = ["gawk"]
options = ["!check"]

source = [
    { url = "https://downloads.sourceforge.net/dict/libmaa-1.5.1.tar.gz", sha256 = "3a30e25f038e99c4715125545516490d991fe3a505825cc832b1a956e31bf669" },
]

environment = '''
# timer.c uses getrusage without <sys/resource.h>, which musl's headers do
# not pull in
export CFLAGS="$CFLAGS -include sys/resource.h"
'''
build = '''
cd maa
awk -f arggram2c < arggram.txt > arggram.c
src="xmalloc.c hash.c set.c stack.c list.c error.c memory.c string.c debug.c flags.c maa.c prime.c bit.c timer.c arg.c pr.c sl.c base64.c base26.c source.c parse-concrete.c text.c log.c"
def="-DMAA_MAJOR=4 -DMAA_MINOR=1 -DMAA_TEENY=0 -DHAVE_SYS_RESOURCE_H=1 -DHAVE_ALLOCA_H=1 -DSIZEOF_LONG=8"
for f in $src; do
    $CC $CFLAGS $def -I. -fPIC -c $f -o ${f%.c}.o
done
$CC $LDFLAGS -shared -Wl,-soname,libmaa.so.4 -o libmaa.so.4.1 *.o
ar rcs libmaa.a *.o
'''
install = '''
cd maa
install -Dm755 libmaa.so.4.1 "$pkgdir/usr/lib/libmaa.so.4.1"
ln -s libmaa.so.4.1 "$pkgdir/usr/lib/libmaa.so.4"
ln -s libmaa.so.4.1 "$pkgdir/usr/lib/libmaa.so"
install -Dm644 libmaa.a "$pkgdir/usr/lib/libmaa.a"
install -Dm644 maa.h "$pkgdir/usr/include/maa.h"
install -Dm644 ../doc/LICENSE "$pkgdir/usr/share/licenses/libmaa/LICENSE"
'''
