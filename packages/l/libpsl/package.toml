name = "libpsl"
version = "0.23.3"
release = 1
summary = "Public Suffix List library"
license = "MIT"
homepage = "https://rockdaboot.github.io/libpsl"
hostdeps = ["meson", "pkgconf"]
builddeps = ["libidn2-devel", "libunistring-devel"]

source = [
