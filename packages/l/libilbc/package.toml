name = "libilbc"
version = "3.0.4"
release = 1
summary = "Internet Low Bitrate Codec (iLBC) library, from WebRTC"
license = "BSD-3-Clause"
homepage = "https://github.com/TimothyGu/libilbc"
# ffmpeg: --enable-libilbc
hostdeps = ["cmake", "ninja", "pkgconf"]
builddeps = ["abseil-cpp-devel"]

source = [
    { url = "https://github.com/TimothyGu/libilbc/archive/v3.0.4/libilbc-3.0.4.tar.gz", sha256 = "c5ec9e3ec53a0a913f81504e202c7bfefbe9c070b7f5599c5e13a6c75d6af913" },
]

# Shared and static libraries both: the static one is a second build, installed first so the shared build's cmake/pkg-config files win. The policy minimum lets CMake 4 configure.
setup = '''
opts="-DCMAKE_POLICY_VERSION_MINIMUM=3.5 "
%cmake $opts -DBUILD_SHARED_LIBS=ON
cmake -B build-static -G Ninja -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_BUILD_TYPE=Release $opts -DBUILD_SHARED_LIBS=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON
'''
build = '''
%cmake_build
cmake --build build-static
'''
install = '''
DESTDIR="$pkgdir" cmake --install build-static
%cmake_install
install -Dm644 COPYING "$pkgdir/usr/share/licenses/libilbc/COPYING"
'''
