# libmd: the BSD message digest functions (MD4/MD5/RIPEMD-160/SHA-1/SHA-2
# with <md5.h>, <sha2.h>, ...), which libbsd needs. Ported from Chimera
# Linux cports (user/libmd; BSD-2-Clause, Copyright (c) Chimera Linux
# contributors), at the newer release 1.3.0. The shipped configure is used
# (cports: its autoreconf is broken).
name = "libmd"
version = "1.3.0"
release = 1
summary = "Message digest functions from BSD systems"
license = "BSD-3-Clause AND BSD-2-Clause AND ISC AND Beerware"
homepage = "https://www.hadrons.org/software/libmd/"
hostdeps = ["pkgconf", "make"]

source = [
    { url = "https://archive.hadrons.org/software/libmd/libmd-1.3.0.tar.xz", sha256 = "fc0f1eb6b6766470326f2c014693809190e67dba84274a6fbae9d4912d066706" },
]

build = '''
%configure
%make
'''
check = '''
%make check
'''
install = '''
%make_install
install -Dm644 COPYING "$pkgdir/usr/share/licenses/libmd/COPYING"
'''
