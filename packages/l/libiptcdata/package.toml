# libiptcdata: read and write IPTC metadata (IIM) in images; rawtherapee uses it.
name = "libiptcdata"
version = "1.0.4"
release = 1
summary = "Library for manipulating IPTC metadata"
license = "LGPL-2.1-or-later"
homepage = "https://libiptcdata.sourceforge.net"
hostdeps = ["pkgconf"]
options = ["!check"]

source = [
    { url = "https://downloads.sourceforge.net/project/libiptcdata/libiptcdata/1.0.4/libiptcdata-1.0.4.tar.gz", sha256 = "79f63b8ce71ee45cefd34efbb66e39a22101443f4060809b8fc29c5eebdcee0e" },
]

setup = '''
%configure --enable-shared --enable-static --disable-gtk-doc
'''
build = '''
%make
'''
install = '''
%make_install
install -Dm644 COPYING "$pkgdir/usr/share/licenses/libiptcdata/COPYING"
'''
