# librest: GNOME's library for RESTful web services (OAuth 1/2 proxies).
# Needed by gnome-online-accounts. libsoup 3; CA certificates from the
# system bundle.
name = "librest"
version = "0.10.2"
release = 1
summary = "GNOME RESTful web services library"
license = "LGPL-2.1-or-later"
homepage = "https://gitlab.gnome.org/GNOME/librest"
patches = ["no-network.patch"]
hostdeps = ["gettext", "glib-devel", "gobject-introspection", "meson", "pkgconf", "vala"]
builddeps = ["glib-devel", "json-glib-devel", "libsoup-devel", "libxml2-devel"]
rundeps = ["ca-certificates"]

source = [
    { url = "https://download.gnome.org/sources/librest/0.10/librest-0.10.2.tar.xz", sha256 = "7b6cb912bb3a22cfa7dcf005925dcb62883024db0c09099486e7d6851185c9b8" },
]

setup = '''
%meson \
    -Dsoup2=false \
    -Dgtk_doc=false \
    -Dexamples=false \
    -Dca_certificates=true \
    -Dca_certificates_path=/etc/ssl/certs/ca-certificates.crt
'''
build = '''
%meson_build
'''
check = '''
meson test -C build --print-errorlogs
'''
install = '''
%meson_install
'''
