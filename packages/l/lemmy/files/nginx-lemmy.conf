# Example only (not installed into /etc): lemmy behind nginx, with lemmy-ui on 1234 and lemmy_server on 8536.
# Replace example.org, add TLS (certbot or your own certificates) and include it from nginx.conf yourself.
server {
    listen 80;
    server_name example.org;

    # lemmy-ui (web front end)
    location / {
        # ActivityPub and API requests go to lemmy_server, browsers to lemmy-ui
        set $proxpass "http://127.0.0.1:1234";
        if ($http_accept ~ "^application/.*$") {
            set $proxpass "http://127.0.0.1:8536";
        }
        if ($request_method = POST) {
            set $proxpass "http://127.0.0.1:8536";
        }
        proxy_pass $proxpass;
        rewrite ^(.+)/+$ $1 permanent;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ ^/(api|pictrs|feeds|nodeinfo|.well-known) {
        proxy_pass http://127.0.0.1:8536;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
