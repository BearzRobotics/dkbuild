hostdeps = ["pkgconf", "python", "automake", "libtool"]
builddeps = ["check-devel", "linux-headers"]
checkdeps = ["bash"]

source = [
    { url = "https://distributions.freedesktop.org/software/libevdev/libevdev-1.13.7.tar.xz", sha256 = "0caf824971108f15bb2ad356433bae198d7d3bf1e82d43f63626e069e060bfa6" },
]

setup = '''
