# After Chimera Linux cports: main/libtiff. cports is BSD-2-Clause, Copyright (c) Chimera Linux contributors.
# needed by: leptonica, openjpeg (and most image programs).
name = "libtiff"
version = "4.7.2"
release = 1
summary = "Library and tools for reading and writing TIFF files"
license = "libtiff"
homepage = "https://libtiff.gitlab.io/libtiff"
hostdeps = ["pkgconf"]
builddeps = ["jbigkit-devel", "libjpeg-turbo-devel", "libwebp-devel", "xz-devel", "zlib-ng-compat-devel", "zstd-devel"]

source = [
    { url = "https://download.osgeo.org/libtiff/tiff-4.7.2.tar.gz", sha256 = "672bd7d10aee4606171afb864f3570b83340f6a33e2c186dc0512f7145ffdf6a" },
]

setup = '''
%configure \
    --enable-cxx \
    --without-x \
    --disable-docs
'''
build = '''
%make
'''
check = '''
make check
'''
install = '''
%make_install
install -Dm644 LICENSE.md "$pkgdir/usr/share/licenses/libtiff/LICENSE.md"
'''
