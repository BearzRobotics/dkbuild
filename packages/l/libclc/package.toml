# The OpenCL C library for clang (bitcode for AMD, NVIDIA and SPIR-V targets):
# Mesa needs it for Intel's Vulkan and GL drivers and for rusticl, its OpenCL.
# Standalone from the llvm-project source, against the installed LLVM and
# clang, with llvm-spirv for the SPIR-V targets. Version locked to `llvm`.
# r2: LLVM 23 builds one target per configure: spirv and spirv64, with the
#     spirv*-mesa3d-.spv names and libclc.pc Mesa reads.
# The 32-bit OpenCL target is spirv32: plain spirv is Vulkan's logical
# SPIR-V in LLVM 23 ("SPIR-V target requires a Vulkan environment").
name = "libclc"
version = "23.1.5"
release = 2
summary = "Open source implementation of the OpenCL C library"
license = "Apache-2.0 WITH LLVM-exception"
homepage = "https://libclc.llvm.org"
hostdeps = ["cmake", "ninja", "python", "llvm", "llvm-clang", "spirv-llvm-translator"]
builddeps = ["llvm-devel"]
options = ["!check", "!strip"]

source = [
    { url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.5/llvm-project-23.1.5.src.tar.xz", sha256 = "fb50b1eac93ddeb3aa8dab4cfe324dff74f4a9c2bdee6160c9e36188f8d06a6e" },
]

setup = '''
# LLVM 23's libclc builds one target per configure (LLVM_DEFAULT_TARGET_TRIPLE).
# Mesa (Rusticl, the Intel compilers) wants the two SPIR-V ones.
for t in spirv32-unknown-unknown spirv64-unknown-unknown; do
    cmake -S libclc -B build-$t -G Ninja -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_INSTALL_LIBDIR=lib \
        -DCMAKE_BUILD_TYPE=Release -DLLVM_DIR=/usr/lib/cmake/llvm -DLLVM_DEFAULT_TARGET_TRIPLE=$t
done
'''
build = '''
for t in spirv32-unknown-unknown spirv64-unknown-unknown; do ninja -C build-$t -j$jobs; done
'''
install = '''
for t in spirv32-unknown-unknown spirv64-unknown-unknown; do DESTDIR=$pkgdir ninja -C build-$t install; done
# The names and the libclc.pc Mesa looks for (libclc before LLVM 23 made them).
d="$pkgdir/usr/share/clc"
ln -s spirv32-unknown-unknown/libclc.spv "$d/spirv-mesa3d-.spv"
ln -s spirv64-unknown-unknown/libclc.spv "$d/spirv64-mesa3d-.spv"
test -e "$d/spirv32-unknown-unknown/libclc.spv" && test -e "$d/spirv64-unknown-unknown/libclc.spv"
mkdir -p "$pkgdir/usr/share/pkgconfig"
cat > "$pkgdir/usr/share/pkgconfig/libclc.pc" <<EOF2
prefix=/usr
libexecdir=/usr/share/clc
includedir=/usr/include

Name: libclc
Description: Library requirements of the OpenCL C programming language
Version: 23.1.5
Cflags: -I\${includedir}
Libs: -L\${libexecdir}
EOF2
install -Dm644 LICENSE.TXT "$pkgdir/usr/share/licenses/libclc/LICENSE.TXT"
'''
