# libmodbus: a library to talk Modbus (RTU over serial, TCP) to PLCs and
# other industrial devices; Zabbix's agent uses it for modbus.get.
name = "libmodbus"
version = "3.2.0"
release = 2
summary = "Modbus protocol library (RTU and TCP)"
license = "LGPL-2.1-or-later"
homepage = "https://libmodbus.org"
hostdeps = ["pkgconf", "make"]
builddeps = ["linux-headers"]

source = [
    { url = "https://github.com/stephane/libmodbus/releases/download/v3.2.0/libmodbus-3.2.0.tar.gz", sha256 = "72239f319b9b8483e3d393c5a60865d734fcff18a8abbb2486e389834a2f6ef1" },
]

build = '''
# modbus-rtu.c uses the TCGETS2/TCSETS2 ioctls with struct termios2. glibc's
# <sys/ioctl.h> brings in the kernel's <asm/ioctls.h> (where they are defined);
# musl's does not, so include it where the code selects termios2.
sed -i 's|^#include "modbus-rtu.h"$|#include "modbus-rtu.h"\n#if defined(HAVE_STRUCT_TERMIOS2)\n#include <asm/ioctls.h>\n#endif|' src/modbus-rtu.c
grep -q '^#include <asm/ioctls.h>$' src/modbus-rtu.c
%configure
%make
'''
check = '''
%make check
'''
install = '''
%make_install
install -Dm644 COPYING.LESSER "$pkgdir/usr/share/licenses/libmodbus/COPYING.LESSER"
'''
