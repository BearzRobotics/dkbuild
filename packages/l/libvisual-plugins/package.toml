name = "libvisual-plugins"
version = "0.4.2"
release = 6
summary = "Plugins for libvisual"
license = "GPL-2.0-or-later"
homepage = "http://libvisual.org"
hostdeps = ["automake", "bison", "gettext-devel", "libtool", "pkgconf"]
builddeps = ["glu-devel", "gstreamer-devel", "gtk+3-devel", "libpulse-devel", "libvisual-devel"]

source = [
    { url = "https://github.com/Libvisual/libvisual/releases/download/libvisual-plugins-0.4.2/libvisual-plugins-0.4.2.tar.bz2", sha256 = "a1dd04eb3d311d68b4f43a5c707df7aba7a98a9cab820c58395a7f5d7d6d0157" },
]

setup = '''
autoreconf -if -W none
%configure \
    --disable-alsa \
    --disable-jack \
    --disable-portaudio \
    --enable-gdkpixbuf-plugin \
    --enable-gstreamer-plugin \
    --enable-opengl \
    --enable-pulseaudio
# po/Makefile: autoreconf -i takes gettext's current po/Makefile.in.in, whose rule
# `Makefile: ... $(top_builddir)/config.status` gets no top_builddir here, so make fails with
# "No rule to make target '/config.status'" (the first build died there, after every plugin
# had compiled). The po directory is one level down: set it.
sed -i '/^top_builddir[[:space:]]*=/d' po/Makefile
sed -i '1i top_builddir = ..' po/Makefile
# r4: the same Makefile.in.in has a dependency list, @POMAKEFILEDEPS@, that this configure.ac never substitutes ("No rule to make target
# '@POMAKEFILEDEPS@'", after all the plugins had compiled): it is empty.
sed -i 's/@POMAKEFILEDEPS@//g' po/Makefile
if grep -q '@POMAKEFILEDEPS@' po/Makefile; then exit 1; fi
# r5: and the gettext version check of that Makefile ("*** error: gettext infrastructure mismatch: using a Makefile.in.in from gettext version 0.19 but the
# autoconf macros are from gettext version 0.24", stamp-po, after every plugin had compiled): this package ships its own po/Makefile.in.in (0.19) that autoreconf
# does not replace, next to the newer macros. The check is for a mismatched gettext toolchain; the po rules themselves work, so it is turned into `true`.
sed -i 's/test "$(GETTEXT_MACRO_VERSION)" = "[^"]*"/true/' po/Makefile
! grep -q 'gettext infrastructure mismatch' po/Makefile || grep -q 'true \\' po/Makefile
grep -q '^top_builddir = \.\.' po/Makefile
'''
build = '''
%make
'''
check = '''
%make check
'''
install = '''
%make_install
'''
