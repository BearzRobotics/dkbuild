# libotr: Off-the-Record messaging library (4.x). Optional dependency of irssi
# (OTR module) and of Pidgin through the separate pidgin-otr plugin.
# Autotools; shared and static libraries both.
name = "libotr"
version = "4.1.1"
release = 2
summary = "Off-the-Record messaging library"
license = "LGPL-2.1-or-later"
homepage = "https://otr.cypherpunks.ca"
hostdeps = ["pkgconf"]
builddeps = ["libgcrypt-devel", "libgpg-error-devel"]
options = ["!check"]

source = [
    { url = "https://otr.cypherpunks.ca/libotr-4.1.1.tar.gz", sha256 = "8b3b182424251067a952fb4e6c7b95a21e644fbb27fbd5f8af2b2ed87ca419f5" },
]

# libotr's configure is from 2016 and is old but its configure.ac is plain
# autoconf; no regeneration needed.
setup = '''
# r2: the regression test client built by `make all` (tests/regression/client/client.c)
# uses socket(), connect(), accept(), socklen_t and PF_UNIX/SOCK_STREAM but includes
# only <sys/un.h>; glibc's <sys/un.h>/<sys/epoll.h> happen to pull in <sys/socket.h>,
# musl's do not, so the compile failed with undeclared identifiers. The header is
# included explicitly.
sed -i 's|^#include <sys/types.h>|#include <sys/types.h>\n#include <sys/socket.h>|' tests/regression/client/client.c
grep -q '^#include <sys/socket.h>' tests/regression/client/client.c
%configure
'''
build = '''
%make
'''
install = '''
%make_install
'''
