# LXQt: LXQt GUI front end for sudo and doas. 2.4 series, like the rest of LXQt here.
name = "lxqt-sudo"
version = "2.4.0"
release = 1
summary = "LXQt GUI front end for sudo and doas"
license = "LGPL-2.1-or-later"
homepage = "https://github.com/lxqt/lxqt-sudo"
hostdeps = ["cmake", "ninja", "pkgconf", "qt6-qttools", "lxqt-build-tools"]
builddeps = ["qt6-qtbase-devel", "qt6-qttools-devel", "liblxqt-devel"]
rundeps = ["sudo"]
options = ["!check"]

source = [
    { url = "https://github.com/lxqt/lxqt-sudo/releases/download/2.4.0/lxqt-sudo-2.4.0.tar.xz", sha256 = "74aaa1663b288144f1398ff29330ce44715a51a8d7210f1672223c6052856eab" },
]

setup = '''
%cmake
'''
build = '''
%cmake_build
'''
install = '''
%cmake_install
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/lxqt-sudo/LICENSE"
'''
