name = "libsasl"
version = "2.1.28"
release = 3
summary = "Cyrus SASL"
license = "BSD-3-Clause-Attribution"
homepage = "https://www.cyrusimap.org/sasl"
patches = ["cyrus-sasl-2.1.28-fix-configure-time-check.patch"]
hostdeps = ["pkgconf", "automake", "libtool"]
options = ["!cross"]

source = [
    { url = "https://github.com/cyrusimap/cyrus-sasl/releases/download/cyrus-sasl-2.1.28/cyrus-sasl-2.1.28.tar.gz", sha256 = "7ccfc6abd01ed67c1a0924b353e526f1b766b21f42d4562ee635a8ebfc5bb38c" },
]

setup = '''
autoreconf -if -W none
%configure \
    --enable-cram \
    --enable-digest \
    --enable-auth-sasldb \
    --enable-plain \
    --enable-anon \
    --enable-login \
    --enable-gssapi \
    --enable-ntlm \
    --with-configdir=/etc/sasl2:/etc/sasl:/usr/lib/sasl2 \
    --disable-otp \
    --disable-srp \
    --disable-srp-setpass \
    --disable-krb4 \
    --with-devrandom=/dev/random \
    --with-dblib=none
'''
build = '''
%make
'''
check = '''
%make check
'''
install = '''
%make_install
# we only want libsasl and plugins
rm -rf "$pkgdir/usr/bin"
rm -rf "$pkgdir/usr/share"
install -Dm644 COPYING "$pkgdir/usr/share/licenses/libsasl/COPYING"
'''
