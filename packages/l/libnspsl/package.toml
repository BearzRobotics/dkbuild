# libnspsl: part of the NetSurf project's libraries (needed by netsurf, elinks).
# The NetSurf build system installs a shared and a static library from two
# passes (COMPONENT_TYPE=lib-shared, lib-static); both are installed.
# WARNFLAGS=-w: the libraries build with -Werror, which a newer clang than the
# ones upstream tests turns into failures on harmless warnings.
# The public suffix list is in the release tarball (public_suffix_list.dat and
# the generated src/psl.inc), so the build needs no network.
name = "libnspsl"
version = "0.1.7"
release = 1
summary = "Public suffix list library"
license = "MIT"
homepage = "https://www.netsurf-browser.org/projects/nspsl/"
hostdeps = ["netsurf-buildsystem", "perl", "pkgconf"]
builddeps = []
options = ["!check"]

source = [
    { url = "https://download.netsurf-browser.org/libs/releases/libnspsl-0.1.7-src.tar.gz", sha256 = "3684cec32f555daed431993e0bf6cbd9374f6c908446237e089f0b61d694ac80" },
]

build = '''
for t in lib-shared lib-static; do
    %make PREFIX=/usr WARNFLAGS=-w COMPONENT_TYPE=$t
done
'''
install = '''
for t in lib-shared lib-static; do
    make DESTDIR="$pkgdir" PREFIX=/usr WARNFLAGS=-w COMPONENT_TYPE=$t install
done
install -Dm644 COPYING "$pkgdir/usr/share/licenses/libnspsl/COPYING"
'''
