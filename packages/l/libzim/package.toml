# cports is BSD-2-Clause, Copyright (c) Chimera Linux contributors.
name = "libzim"
version = "9.8.2"
release = 1
summary = "Reference implementation of the ZIM file format"
license = "GPL-2.0-or-later"
homepage = "https://github.com/openzim/libzim"
hostdeps = ["ninja", "pkgconf"]
builddeps = ["icu-devel", "xapian-core-devel", "xz-devel", "zstd-devel"]
options = ["!check"]

source = [
    { url = "https://github.com/openzim/libzim/archive/refs/tags/9.8.2.tar.gz", sha256 = "38f8e2139a089f00196f288f52f2d0677a6becc218f380b54ca70b6f162398bd" },
]

setup = '''
# libc++ 23 no longer brings in standard headers through others: every file
# (include/zim/error.h is installed) gets the ones whose names it uses
add() {
    for f in $(grep -rlE "$2" include src --include='*.h' --include='*.cpp' | xargs -r grep -L "#include <$1>"); do
        sed -i "0,/^#include/s//#include <$1>\\n#include/" "$f"
    done
}
add exception 'std::(exception_ptr|current_exception|rethrow_exception|make_exception_ptr|terminate)\b'
add cerrno '\berrno\b|\bE[A-Z]{3,}\b'
add algorithm 'std::(copy|fill|min|max|equal|sort|find|find_if|remove|remove_if|reverse|transform|for_each|count|count_if|all_of|any_of|none_of)\b'
add cstdlib 'std::(strto[a-z]+|getenv|abort|exit|malloc|free|abs|atoi)\b'
add cstring 'std::(memcpy|memset|memcmp|memmove|strlen|strcmp|strncmp|strerror)\b'
grep -q '^#include <exception>' include/zim/error.h
grep -q '^#include <exception>' src/writer/creatordata.h
grep -q '^#include <cerrno>' src/writer/binaryfile.cpp
%meson \
    -Ddoc=false \
    -Dexamples=false \
    -Dtests=false \
    -Dwith_xapian=true \
    -Dwerror=false
'''
build = '''
%meson_build
'''
install = '''
%meson_install
install -Dm644 COPYING "$pkgdir/usr/share/licenses/libzim/COPYING"
'''
