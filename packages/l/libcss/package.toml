# libcss: part of the NetSurf project's libraries (needed by netsurf, elinks).
# The NetSurf build system installs a shared and a static library from two
# passes (COMPONENT_TYPE=lib-shared, lib-static); both are installed.
# WARNFLAGS=-w: the libraries build with -Werror, which a newer clang than the
# ones upstream tests turns into failures on harmless warnings.
name = "libcss"
version = "0.9.2"
release = 1
summary = "CSS parser and selection engine"
license = "MIT"
homepage = "https://www.netsurf-browser.org/projects/css/"
hostdeps = ["netsurf-buildsystem", "perl", "pkgconf"]
builddeps = ["libparserutils-devel", "libwapcaplet-devel"]
options = ["!check"]

source = [
    { url = "https://download.netsurf-browser.org/libs/releases/libcss-0.9.2-src.tar.gz", sha256 = "2df215bbec34d51d60c1a04b01b2df4d5d18f510f1f3a7af4b80cddb5671154e" },
]

build = '''
for t in lib-shared lib-static; do
    %make PREFIX=/usr WARNFLAGS=-w COMPONENT_TYPE=$t
done
'''
install = '''
for t in lib-shared lib-static; do
    make DESTDIR="$pkgdir" PREFIX=/usr WARNFLAGS=-w COMPONENT_TYPE=$t install
done
install -Dm644 COPYING "$pkgdir/usr/share/licenses/libcss/COPYING"
'''
