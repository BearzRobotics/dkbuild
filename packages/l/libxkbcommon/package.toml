# Imported from Chimera Linux cports: work/cports/main/libxkbcommon/template.py
# cports is BSD-2-Clause, Copyright (c) Chimera Linux contributors.
# Imported draft, untested: dependency names are Chimera's and resolve from the stage 0 image until they are recipes.
# r2: dependencies on this tree's packages, not Chimera's names (built against the image's copies before).
# r3: static libraries too (in libxkbcommon-static), for fully static programs on musl.
# r5: X11 support (libxkbcommon-x11): Qt's xcb platform plugin and GStreamer's Vulkan on XCB need it.
# r4: libxkbcommon-libs depends on xkeyboard-config: the library reads the keyboard layouts from xkeyboard-config's data; without it labwc found no keymap and crashed.
name = "libxkbcommon"
version = "1.13.2"
release = 5
summary = "Library to handle keyboard descriptions"
license = "MIT"
homepage = "https://xkbcommon.org"
hostdeps = ["bison", "meson", "pkgconf", "wayland", "wayland-protocols"]
builddeps = ["libxcb-devel", "libxml2-devel", "wayland-devel", "wayland-protocols", "xkeyboard-config", "xorgproto"]
rundeps = ["xkeyboard-config"]

source = [
    { url = "https://github.com/xkbcommon/libxkbcommon/archive/xkbcommon-1.13.2.tar.gz", sha256 = "acc4d5f7c3cbba5f9f8d08d8bdbeede84ecede46792f47929aa9321873385528" },
]

setup = '''
%meson \
    -Denable-x11=true \
    -Denable-wayland=true \
    -Denable-xkbregistry=true \
    -Denable-docs=false
'''
build = '''
%meson_build
'''
install = '''
%meson_install
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/libxkbcommon/LICENSE"
'''

# The libraries need data the scan cannot see (SPEC.md 5.6). Only the versioned
# libraries: the development links stay in -devel.
[subpackages.libs]
summary = "Shared libraries"
paths   = ["/usr/lib/*.so.*"]
depends = ["xkeyboard-config"]
