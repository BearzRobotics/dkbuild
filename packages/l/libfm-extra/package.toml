# needed by: menu-cache (libfm-qt's menus). Only libfm's small extra library (--with-extra-only).
name = "libfm-extra"
version = "1.3.2"
release = 1
summary = "Extra library of libfm (for menu-cache)"
license = "LGPL-2.1-or-later"
homepage = "https://github.com/lxde/libfm"
hostdeps = ["pkgconf", "intltool", "gettext"]
builddeps = ["glib-devel"]
options = ["!check"]

source = [
    { url = "https://downloads.sourceforge.net/pcmanfm/libfm-1.3.2.tar.xz", sha256 = "a5042630304cf8e5d8cff9d565c6bd546f228b48c960153ed366a34e87cad1e5" },
]

setup = '''
%configure \
    --with-extra-only \
    --with-gtk=no \
    --disable-static=no
'''
build = '''
%make
'''
install = '''
%make_install
install -Dm644 COPYING "$pkgdir/usr/share/licenses/libfm-extra/COPYING"
'''
