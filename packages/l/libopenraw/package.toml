name = "libopenraw"
version = "0.3.7"
release = 8
summary = "RAW format parsing library"
license = "LGPL-3.0-or-later"
homepage = "https://libopenraw.freedesktop.org"
# Its Rust part (lib/mp4): Chimera's update-crates.patch moves Cargo.lock to
# newer crates (a libc that does not call open64, which musl dropped); they are
# vendored by dkbuild from the patched lock (cargodeps), and the older copies
# the archive vendors in lib/mp4/vendor are removed in setup
patches = ["FILE.patch", "fuck-you-libtool.patch", "no-demo.patch", "update-crates.patch"]
hostdeps = ["autoconf-archive", "automake", "rust", "libtool", "pkgconf"]
builddeps = ["boost-devel", "curl-devel", "gdk-pixbuf-devel", "libjpeg-turbo-devel", "libxml2-devel", "rust"]
options = ["!lto", "cargodeps"]

source = [
    { url = "https://libopenraw.freedesktop.org/download/libopenraw-0.3.7.tar.xz", sha256 = "0ece41951b2cd91e43f6a8a5c6a894bbc8b5923b4e49a82ebb6d8ce62bded68c" },
]

environment = '''
export CARGO_HOME=/tmp/cargo-home CARGO_NET_OFFLINE=true
export RUSTFLAGS="-C target-feature=-crt-static"
# the build expects target/release, not target/<triple>/release
unset CARGO_BUILD_TARGET
'''
setup = '''
# the archive's own vendored crates and their cargo config would take
# precedence over dkbuild's (newer, from the patched lock)
rm -rf lib/mp4/vendor lib/mp4/.cargo
# libc++ 23 no longer brings in standard headers through others: every file
# gets the ones whose names it uses (struct tm in ciff/ciffifd.cpp, ...)
add() {
    for f in $(grep -rlE "$2" lib --include='*.cpp' --include='*.hpp' --include='*.h' | xargs -r grep -LE "#include <($1)>"); do
        h=${1%%|*}
        sed -i "0,/^#include/s//#include <$h>\n#include/" "$f"
    done
}
add 'ctime|time.h' '\bstruct tm\b|\b(mktime|gmtime|localtime|strftime|timegm)\b'
add 'cstring|string.h' '\b(memcpy|memset|memcmp|memmove|strlen|strcmp|strncmp|strcpy)\b'
add algorithm 'std::(copy|fill|min|max|sort|find|find_if|transform|for_each)\b'
grep -q '^#include <ctime>' lib/ciff/ciffifd.cpp
autoreconf -if -W none
%configure
'''
build = '''
%make
'''
check = '''
%make check
'''
install = '''
%make_install
'''
