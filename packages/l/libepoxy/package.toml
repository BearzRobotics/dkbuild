name = "libepoxy"
version = "1.5.10"
release = 6
summary = "Library for handling OpenGL function pointers"
license = "MIT"
homepage = "https://github.com/anholt/libepoxy"
hostdeps = ["meson", "pkgconf", "xorg-util-macros"]
builddeps = ["libx11-devel", "libglvnd-devel"]

source = [
    { url = "https://github.com/anholt/libepoxy/archive/1.5.10.tar.gz", sha256 = "a7ced37f4102b745ac86d6a70a9da399cc139ff168ba6b8002b4d8d43c900c15" },
]

setup = '''
%meson -Dx11=true -Dglx=yes -Degl=yes
'''
build = '''
%meson_build
'''
install = '''
%meson_install
install -Dm644 COPYING "$pkgdir/usr/share/licenses/libepoxy/COPYING"
'''
