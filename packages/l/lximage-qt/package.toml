# LXQt: LXQt image viewer and screenshot tool. 2.4 series, like the rest of LXQt here.
name = "lximage-qt"
version = "2.4.0"
release = 1
summary = "LXQt image viewer and screenshot tool"
license = "GPL-2.0-or-later"
homepage = "https://github.com/lxqt/lximage-qt"
hostdeps = ["cmake", "ninja", "pkgconf", "qt6-qttools", "lxqt-build-tools"]
builddeps = ["qt6-qtbase-devel", "qt6-qttools-devel", "libfm-qt-devel", "libexif-devel", "qt6-qtsvg-devel"]
options = ["!check"]

source = [
    { url = "https://github.com/lxqt/lximage-qt/releases/download/2.4.0/lximage-qt-2.4.0.tar.xz", sha256 = "7ca49039f3246011b80d76037603ac6a7af484574d8e5e2cc5bb7b8534298636" },
]

setup = '''
%cmake
'''
build = '''
%cmake_build
'''
install = '''
%cmake_install
install -Dm644 COPYING "$pkgdir/usr/share/licenses/lximage-qt/COPYING"
'''
