# OpenShot's audio library (JUCE-based audio engine). needed by: libopenshot.
name = "libopenshot-audio"
version = "1.0.2"
release = 1
summary = "Audio library for OpenShot"
license = "GPL-3.0-or-later"
homepage = "https://github.com/OpenShot/libopenshot-audio"
hostdeps = ["cmake", "ninja", "pkgconf", "perl"]
builddeps = ["alsa-lib-devel", "zlib-ng-compat-devel"]
options = ["!check"]

source = [
    { url = "https://github.com/OpenShot/libopenshot-audio/archive/refs/tags/v1.0.2.tar.gz", sha256 = "4ea883b1b0a7d62a2c39e65138997c947996ecd3040a7b439b83f2dbd353d28a" },
]

setup = '''
# musl has no <execinfo.h> (backtrace()): JUCE's stack-trace helper says so
# instead of printing frames
m=JuceLibraryCode/modules/juce_core
perl -0pi -e 's/#if ! \(JUCE_ANDROID \|\| JUCE_WASM\)\n(\s*)#include <execinfo.h>/#if ! (JUCE_ANDROID || JUCE_WASM) \&\& __has_include(<execinfo.h>)\n$1#include <execinfo.h>/' $m/juce_core.cpp
perl -0pi -e 's/   #else\n    void\* stack\[128\];/   #elif ! __has_include(<execinfo.h>)\n    result << "(no stack trace on this system)" << newLine;\n   #else\n    void* stack[128];/' $m/system/juce_SystemStats.cpp
grep -q '__has_include(<execinfo.h>)' $m/juce_core.cpp
grep -q 'no stack trace on this system' $m/system/juce_SystemStats.cpp
# stat64 is glibc's large-file name (musl's stat is 64-bit already and only
# defines stat64 with _LARGEFILE64_SOURCE): JUCE uses it with glibc only
sed -i 's/^   #if JUCE_LINUX || (JUCE_IOS \&\& (! TARGET_OS_MACCATALYST)/   #if (JUCE_LINUX \&\& defined (__GLIBC__)) || (JUCE_IOS \&\& (! TARGET_OS_MACCATALYST)/' $m/native/juce_SharedCode_posix.h
grep -q 'JUCE_LINUX && defined (__GLIBC__)' $m/native/juce_SharedCode_posix.h
%cmake
'''
build = '''
%cmake_build
'''
install = '''
%cmake_install
'''
