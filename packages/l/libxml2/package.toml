name = "libxml2"
version = "2.15.4"
release = 2
summary = "XML parsing library"
license = "MIT"
homepage = "http://www.xmlsoft.org"
patches = ["overflow.patch"]
hostdeps = ["automake", "pkgconf", "slibtool"]
builddeps = ["icu-devel", "readline-devel", "ncurses-devel", "xz-devel", "zlib-ng-compat-devel"]

source = [
    { url = "https://download.gnome.org/sources/libxml2/2.15/libxml2-2.15.4.tar.xz", sha256 = "98087fd181d9070724f3fbc65c7377db03038eb92bd882374daff44940138821" },
]

setup = '''
autoreconf -if -W none
%configure \
    --enable-shared \
    --enable-static \
    --with-history \
    --without-icu \
    --with-legacy \
    --with-threads \
    --without-docs
'''
build = '''
%make
'''
check = '''
%make check
'''
install = '''
%make_install
install -Dm644 Copyright "$pkgdir/usr/share/licenses/libxml2/Copyright"
'''
