name = "libzip"
version = "1.11.4"
release = 2
summary = "C library for manipulating zip archives"
license = "BSD-3-Clause"
homepage = "https://libzip.org"
hostdeps = ["cmake", "ninja", "pkgconf"]
builddeps = ["bzip2-devel", "openssl-devel", "xz-devel", "zlib-ng-compat-devel", "zstd-devel"]
checkdeps = ["nihtest"]

source = [
    { url = "https://libzip.org/download/libzip-1.11.4.tar.gz", sha256 = "82e9f2f2421f9d7c2466bbc3173cd09595a88ea37db0d559a9d0a2dc60dc722e" },
]

setup = '''
%cmake \
    -DBUILD_EXAMPLES=OFF \
    -DENABLE_BZIP2=ON \
    -DENABLE_LZMA=ON \
    -DENABLE_OPENSSL=ON \
    -DENABLE_ZSTD=ON
'''
build = '''
%cmake_build
'''
install = '''
%cmake_install
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/libzip/LICENSE"
'''
