name = "libpng"
version = "1.6.59"
release = 2
summary = "Library for manipulating PNG images"
license = "Libpng"
homepage = "https://www.libpng.org/pub/png/libpng.html"
patches = ["zlib-ng-test.patch"]
hostdeps = ["automake", "pkgconf", "libtool"]
builddeps = ["zlib-ng-compat-devel"]

source = [
    { url = "https://downloads.sourceforge.net/sourceforge/libpng/libpng-1.6.59.tar.xz", sha256 = "d80dd2a38a37f803cb9b6ac7b14bd6e74ddc3b654780a8380bdf93523fdb4389" },
]

setup = '''
autoreconf -if -W none
%configure \
    --disable-riscv-rvv
'''
build = '''
%make
'''
check = '''
%make check
'''
install = '''
%make_install
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/libpng/LICENSE"
'''
