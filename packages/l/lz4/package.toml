# Reviewed by hand: cbuild's init_configure only passed CFLAGS and LDFLAGS to make,
# which the build environment already provides.
name = "lz4"
version = "1.10.0"
release = 3
summary = "LZ4 compression utilities"
license = "BSD-2-Clause AND GPL-2.0-or-later"
homepage = "https://lz4.github.io/lz4"
hostdeps = ["pkgconf"]
options = ["bootstrap"]

source = [
    { url = "https://github.com/lz4/lz4/archive/v1.10.0.tar.gz", sha256 = "537512904744b35e232912055ccf8ec66d768639ff3abe5788d90d792ec5f48b" },
]

build = '''
# PREFIX here too: liblz4.pc is written in this step (it said /usr/local;
# CMake users such as android-tools refuse the missing include path)
%make PREFIX=/usr
'''
check = '''
%make check -j1
'''
install = '''
%make_install \
    STRIP=true \
    PREFIX=/usr
install -Dm644 lib/LICENSE "$pkgdir/usr/share/licenses/lz4/LICENSE"
'''
