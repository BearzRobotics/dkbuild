# LTTng userspace tracing library (liblttng-ust). The .NET runtime's CMake
# build requires its headers on Linux (lttng/tracepoint.h) for the runtime's
# event tracing (the libcoreclrtraceptprovider), so it is built rather than
# switched off in dotnet.
name = "lttng-ust"
version = "2.16.0"
release = 1
summary = "LTTng userspace tracer library"
license = "LGPL-2.1-only AND GPL-2.0-only AND MIT"
homepage = "https://lttng.org"
hostdeps = ["pkgconf", "python"]
builddeps = ["userspace-rcu-devel", "numactl-devel"]
options = ["!check"]

source = [
    { url = "https://lttng.org/files/lttng-ust/lttng-ust-2.16.0.tar.bz2", sha256 = "1e84e02fa1fc1261eb6cf3d14d64006506a29f7c605ac85de02180318c6aa38a" },
]

setup = '''
%configure --enable-numa
'''
build = '''
%make
'''
install = '''
%make_install
'''
