# Lomiri trust store: asks the user for permission to use device features: without the Mir agent. Ubuntu Touch / UBports (Lomiri) component, version 2.0.2. Recipe written after Alpine
# Linux's testing/lomiri-trust-store (MIT-licensed APKBUILD and patches; the software's licence is LGPL-3.0-only).
# Not built (queued, wip/queue): expect first-build fixes.
name = "lomiri-trust-store"
version = "2.0.2"
release = 1
summary = "Lomiri trust store: asks the user for permission to use device features"
license = "LGPL-3.0-only"
homepage = "https://gitlab.com/ubports"
patches = ["10-boost_1.84.patch", "glog.patch", "0001-3rd_party-xdg-CMakeLists.txt-Bump-minimum-version-to.patch"]
hostdeps = ["cmake", "ninja", "pkgconf"]
builddeps = ["boost-devel", "cmake-extras", "dbus-cpp-devel", "glog-devel", "gtest-devel", "libapparmor-devel", "process-cpp-devel", "properties-cpp-devel", "qt5-qtdeclarative-devel"]
options = ["!check"]

source = [
    { url = "https://gitlab.com/ubports/development/core/trust-store/-/archive/2.0.2/trust-store-2.0.2.tar.gz", sha256 = "1d2f221b3e4148277e4d8645b9dd95baff638c7a7dad8af256bb811345cf8495" },
]

setup = '''
%cmake \
    -DTRUST_STORE_MIR_AGENT_ENABLED=OFF \
    -DENABLE_WERROR=OFF
'''
build = '''
%cmake_build
'''
install = '''
%cmake_install
'''
