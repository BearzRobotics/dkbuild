name = "lua5.1"
version = "5.1.5"
release = 1
summary = "Lua scripting language 5.1.x"
license = "MIT"
homepage = "https://lua.org"
patches = ["liblua.so.patch", "skip-ranlib.patch", "use-bmake.patch", "version.patch", "xxx-free-mycflags.patch"]
hostdeps = ["pkgconf"]
builddeps = ["libedit-devel"]
options = ["!check"]

source = [
    { url = "https://www.lua.org/ftp/lua-5.1.5.tar.gz", sha256 = "2640fc56a795f29d28ef15e13c34a47e223960b0240e8cb0a82d9b0738695333" },
]

environment = '''
export CFLAGS="$CFLAGS -fPIC -DLUA_USE_LINUX"
'''
build = '''
make linux CC="$CC" AR="${AR:-llvm-ar}" RANLIB="${RANLIB:-llvm-ranlib}" MYCFLAGS="$CFLAGS" MYLDFLAGS="$LDFLAGS"
'''
install = '''
make install \
    INSTALL_TOP="$pkgdir/usr" \
    TO_BIN="lua5.1 luac5.1" \
    TO_LIB="liblua5.1.a liblua5.1.so.5.1.5" \
    INSTALL_INC="$pkgdir/usr/include/lua5.1" \
    INSTALL_MAN="$pkgdir/usr/share/man/man1"
install -Dm644 $pkgfiles/lua5.1.pc "$pkgdir/usr/lib/pkgconfig/lua5.1.pc"
install -Dm644 doc/readme.html "$pkgdir/usr/share/licenses/lua5.1/readme.html"
mv "$pkgdir/usr/share/man/man1/lua.1" "$pkgdir/usr/share/man/man1/lua5.1.1"
mv "$pkgdir/usr/share/man/man1/luac.1" "$pkgdir/usr/share/man/man1/luac5.1.1"
ln -s liblua5.1.so.5.1.5 "$pkgdir/usr/lib/liblua5.1.so"
ln -s liblua5.1.so.5.1.5 "$pkgdir/usr/lib/liblua5.1.so.5.1"
'''
