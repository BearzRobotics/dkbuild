# libcurl-impersonate (lexiforest's fork of curl-impersonate): curl built so that its TLS and HTTP/2/HTTP/3 handshakes look like
# those of real browsers (Chrome, Firefox, Safari, ...): curl 8.23 with BoringSSL, nghttp2/nghttp3/ngtcp2 (HTTP/2 and HTTP/3), brotli,
# zstd, zlib and c-ares, each pinned and patched by upstream (patches/*.patch). Needed by python-curl-cffi (SearXNG, user-scanner, ...).
# The build is upstream's CMake "superbuild": ExternalProject downloads nine sources. Offline here: the nine archives are sources of this
# recipe (the same URLs and SHA-256 as CMakeLists.txt, which still checks each hash) and one sed makes each `set(X_URL ...)` point at the
# local file; nothing else is changed. The bundled libraries stay bundled: the impersonation depends on these exact versions and patches
# (BoringSSL is what Chrome uses; nghttp2 is pinned to 1.63 because newer releases removed the HTTP/2 priority flag it needs).
# libidn2 (IDN support): upstream builds libidn2 and libunistring itself before CMake (`make prepare-libidn2`); the system ones are used:
# a single static libidn2.a made of the system libidn2.a and libunistring.a is put where CMake expects the prebuilt one
# (build/deps/install). Self-contained static libcurl-impersonate.a and the shared library are both installed (the python module links
# the static one in whole).
# Not built yet when written (wip/queue): expect first-build fixes (BoringSSL and ngtcp2 on musl and clang 23 are the likely places).
name = "libcurl-impersonate"
version = "2.3.1"
release = 1
summary = "curl that impersonates browsers' TLS and HTTP/2 fingerprints (curl-impersonate)"
license = "MIT"
homepage = "https://github.com/lexiforest/curl-impersonate"
hostdeps = ["cmake", "ninja", "pkgconf", "patch", "perl", "git"]
builddeps = ["libidn2-devel", "libidn2-static", "libunistring-devel", "libunistring-static", "linux-headers"]
rundeps = ["ca-certificates"]
options = ["!check", "jobs:8"]

source = [
    { url = "https://github.com/lexiforest/curl-impersonate/archive/refs/tags/v2.3.1.tar.gz", sha256 = "7ba6eb87aefa6fb5c0974945e84783bf55faed0d08c70972e3f2807125264451" },
    { url = "https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz", sha256 = "9a93b2b7dfdac77ceba5a558a580e74667dd6fede4585b91eefb60f03b72df23", unpack = false },
    { url = "https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-1.5.7.tar.gz", sha256 = "eb33e51f49a15e023950cd7825ca74a4a2b43db8354825ac24fc1b7ee09e6fa3", unpack = false },
    { url = "https://github.com/google/brotli/archive/refs/tags/v1.2.1.tar.gz", sha256 = "98d35d11a78dc453aebb7d10c3748f3f73ff78c8267c0dc697b8631f67bf7e8f", unpack = false, name = "brotli-1.2.1.tar.gz" },
    { url = "https://github.com/google/boringssl/archive/156c7b75ae9b8c3b3f847acf264f17594c3859fb.zip", sha256 = "450e169b284697c6eafe523cb7679f4221fbe1a0993f773a566c33b188762844", unpack = false, name = "boringssl-156c7b7.zip" },
    { url = "https://github.com/nghttp2/nghttp2/releases/download/v1.63.0/nghttp2-1.63.0.tar.bz2", sha256 = "607b174554d22a828bc532d1d734fe0f729b5d5ed207f2f12e96a62e83f29c55", unpack = false },
    { url = "https://github.com/ngtcp2/ngtcp2/releases/download/v1.20.0/ngtcp2-1.20.0.tar.bz2", sha256 = "871ec97ad86803cf312901b0c393b0ee70163e25a87c9b2894d1234341ce4e97", unpack = false },
    { url = "https://github.com/ngtcp2/nghttp3/releases/download/v1.15.0/nghttp3-1.15.0.tar.bz2", sha256 = "c6c491a52804814098e446630e6efc459afc0d3da7952ffe6cbdc0b3f99b2b62", unpack = false },
    { url = "https://github.com/c-ares/c-ares/releases/download/v1.34.9/c-ares-1.34.9.tar.gz", sha256 = "9364b70a12eb59a06830fb488d9357f90100dff0d98b23ea3593a183d43e6f2f", unpack = false },
    { url = "https://github.com/curl/curl/archive/curl-8_23_0.tar.gz", sha256 = "d0605d5883124ef5ae64c6d2b307e1417c482b362583b57491fdf37d9a99a792", unpack = false, name = "curl-8_23_0.tar.gz" },
]

setup = '''
# the nine downloads become local files (source edit: sed on CMakeLists.txt; the *_URL_HASH checks stay)
s=/build/sources
sed -i \
  -e "s|^set(ZLIB_URL .*|set(ZLIB_URL \"$s/zlib-1.3.1.tar.gz\")|" \
  -e "s|^set(ZSTD_URL .*|set(ZSTD_URL \"$s/zstd-1.5.7.tar.gz\")|" \
  -e "s|^set(BROTLI_URL .*|set(BROTLI_URL \"$s/brotli-1.2.1.tar.gz\")|" \
  -e "s|^set(BORINGSSL_URL .*|set(BORINGSSL_URL \"$s/boringssl-156c7b7.zip\")|" \
  -e "s|^set(NGHTTP2_URL .*|set(NGHTTP2_URL \"$s/nghttp2-1.63.0.tar.bz2\")|" \
  -e "s|^set(NGTCP2_URL .*|set(NGTCP2_URL \"$s/ngtcp2-1.20.0.tar.bz2\")|" \
  -e "s|^set(NGHTTP3_URL .*|set(NGHTTP3_URL \"$s/nghttp3-1.15.0.tar.bz2\")|" \
  -e "s|^set(CARES_URL .*|set(CARES_URL \"$s/c-ares-1.34.9.tar.gz\")|" \
  -e "s|^set(CURL_URL .*|set(CURL_URL \"$s/curl-8_23_0.tar.gz\")|" CMakeLists.txt
test "$(grep -c '^set([A-Z0-9]*_URL "/build/sources/' CMakeLists.txt)" = 9
# libidn2: one self-contained static archive from the system's two, where CMakeLists.txt looks for the prebuilt one
mkdir -p build/deps/install/lib build/deps/install/include
printf 'create build/deps/install/lib/libidn2.a\naddlib /usr/lib/libidn2.a\naddlib /usr/lib/libunistring.a\nsave\nend\n' | llvm-ar -M
cp /usr/include/idn2.h build/deps/install/include/
test -s build/deps/install/lib/libidn2.a
cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr \
    -DCURL_IMPERSONATE_VERSION=2.3.1 -DSUBJOBS=$jobs -DUSE_LIBIDN2=ON \
    -DCURL_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt -DCURL_CA_PATH=/etc/ssl/certs
'''
build = '''
cmake --build build -j$jobs
'''
install = '''
DESTDIR="$pkgdir" cmake --install build
test -f "$pkgdir/usr/lib/libcurl-impersonate.a"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/libcurl-impersonate/LICENSE"
'''
