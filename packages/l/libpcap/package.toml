name = "libpcap"
version = "1.10.6"
release = 1
summary = "System-independent interface for user-level packet capture"
license = "BSD-3-Clause"
homepage = "https://www.tcpdump.org"
hostdeps = ["automake", "pkgconf", "flex", "libtool"]
builddeps = ["libnl-devel", "libusb-devel", "linux-headers"]
options = ["!check"]

source = [
    { url = "https://www.tcpdump.org/release/libpcap-1.10.6.tar.gz", sha256 = "872dd11337fe1ab02ad9d4fee047c9da244d695c6ddf34e2ebb733efd4ed8aa9" },
]

setup = '''
export CFLAGS="$CFLAGS -I/usr/include/libnl3"
autoreconf -if -W none
%configure \
    --enable-ipv6 \
    --with-libnl \
    --with-pcap=linux \
    --enable-usb
'''
build = '''
%make
'''
install = '''
%make_install
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/libpcap/LICENSE"
# Manual pages in section 3, not 3pcap.
for f in "$pkgdir"/usr/share/man/man3/*.3pcap; do
    [ -e "$f" ] || [ -L "$f" ] || continue
    nf="${f%pcap}"
    if [ -L "$f" ]; then t=$(readlink "$f"); rm -f "$f"; ln -s "${t%pcap}" "$nf"; else mv "$f" "$nf"; fi
done
'''
