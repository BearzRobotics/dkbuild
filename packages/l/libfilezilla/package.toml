# libfilezilla: FileZilla's C++ support library (networking, TLS through
# GnuTLS, crypto through Nettle, events, strings). Upstream's download links
# expire on purpose (trac.filezilla-project.org ticket 13186), so the source
# is Arch Linux's mirror of the identical release tarball.
name = "libfilezilla"
version = "0.58.0"
release = 1
summary = "Small C++ library for networking and platform abstraction"
license = "GPL-2.0-or-later"
homepage = "https://lib.filezilla-project.org"
hostdeps = ["pkgconf", "gettext"]
builddeps = ["gmp-devel", "gnutls-devel", "nettle-devel", "cppunit-devel"]
options = ["!check"]

source = [
    { url = "https://sources.archlinux.org/other/libfilezilla/libfilezilla-0.58.0.tar.xz", sha256 = "276d7a720af53a9767de4882bd992996c5430b0b13be05913bd7a640052d6ece" },
]

setup = '''
%configure
'''
build = '''
%make
'''
check = '''
%make check
'''
install = '''
%make_install
'''
