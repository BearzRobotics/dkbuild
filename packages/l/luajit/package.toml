name = "luajit"
version = "2.1_p20250117"
release = 1
summary = "OpenResty's LuaJIT fork"
license = "MIT"
homepage = "https://github.com/openresty/luajit2"
patches = ["bcsave-ppc64.patch", "grep.patch", "tests-fail.patch", "tests.patch"]
archs = ["aarch64", "x86_64"]
hostdeps = ["pkgconf"]
checkdeps = ["perl", "sqlite-devel", "zlib-ng-compat-devel"]
options = ["!cross"]

source = [
    { url = "https://github.com/openresty/luajit2/archive/refs/tags/v2.1-20250117.tar.gz", sha256 = "68ff3dc2cc97969f7385679da7c9ff96738aa9cc275fa6bab77316eb3340ea8e" },
    { url = "https://github.com/openresty/luajit2-test-suite/archive/a3a5deb5d97d57fb4da567017a621ae73ee7305e.tar.gz", sha256 = "b9862f002768dac55c8ab3d1ea21f3aa06d4075f6d022bb2eff76e82df264ffc" },
]

build = '''
# its makefile does not pass the link flags on by itself
%make \
    PREFIX=/usr \
    CC="$CC" HOST_CC="$CC" \
    TARGET_CFLAGS="$CFLAGS" TARGET_LDFLAGS="$CFLAGS $LDFLAGS" TARGET_SHLDFLAGS="$CFLAGS $LDFLAGS" \
    HOST_CFLAGS="$CFLAGS" HOST_LDFLAGS="$CFLAGS $LDFLAGS" \
    Q= \
    E=@:
'''
check = '''
cd test-suite
make -C .. install PREFIX="$PWD/target"
./run-tests "$PWD/target" "$PWD/target/bin/luajit" clang clang++
'''
install = '''
%make_install \
    STRIP=true \
    PREFIX=/usr
install -Dm644 COPYRIGHT "$pkgdir/usr/share/licenses/luajit/COPYRIGHT"
'''
