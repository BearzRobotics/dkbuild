name = "less"
version = "710"
release = 1
summary = "Pager program similar to more(1)"
license = "custom:less OR GPL-3.0-or-later"
homepage = "https://www.greenwoodsoftware.com/less"
hostdeps = ["automake"]
builddeps = ["ncurses-devel"]
checkdeps = ["perl"]

source = [
    { url = "https://www.greenwoodsoftware.com/less/less-710.tar.gz", sha256 = "d1008fb78dcae1323ddab664bcb352a61f022b1b131bd8018548e021d975ec7a" },
]

setup = '''
autoreconf -if -W none
%configure \
    --with-regex=posix
'''
build = '''
%make
'''
check = '''
%make check
'''
install = '''
%make_install
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/less/LICENSE"
install -Dm755 $pkgfiles/lesspipe.sh "$pkgdir/usr/bin/lesspipe.sh"
install -Dm755 $pkgfiles/zless.sh "$pkgdir/usr/bin/zless"
mkdir -p "$pkgdir/usr/bin"
ln -sf less "$pkgdir/usr/bin/more"
mkdir -p "$pkgdir/usr/share/man/man1"
ln -sf less.1 "$pkgdir/usr/share/man/man1/more.1"
mkdir -p "$pkgdir/usr/bin"
ln -sf zless "$pkgdir/usr/bin/bzless"
mkdir -p "$pkgdir/usr/bin"
ln -sf zless "$pkgdir/usr/bin/xzless"
mkdir -p "$pkgdir/usr/bin"
ln -sf zless "$pkgdir/usr/bin/lzless"
mkdir -p "$pkgdir/usr/bin"
ln -sf zless "$pkgdir/usr/bin/zstdless"
'''
