# Imported from Chimera Linux cports: work/cports/main/less/template.py
# cports is BSD-2-Clause, Copyright (c) Chimera Linux contributors.
# Imported draft, untested: dependency names are Chimera's and resolve from the stage 0 image until they are recipes.
# r2: no more, zless or zstdless: util-linux, gzip and zstd ship them (two packages may not own one file).
# r3: static libraries too (in less-static), for fully static programs on musl.
name = "less"
version = "710"
release = 3
summary = "Pager program similar to more(1)"
license = "custom:less OR GPL-3.0-or-later"
homepage = "https://www.greenwoodsoftware.com/less"
hostdeps = ["automake"]
builddeps = ["ncurses-devel"]
checkdeps = ["perl"]

source = [
    { url = "https://www.greenwoodsoftware.com/less/less-710.tar.gz", sha256 = "d1008fb78dcae1323ddab664bcb352a61f022b1b131bd8018548e021d975ec7a" },
]

setup = '''
autoreconf -if -W none
%configure \
    --with-regex=posix
'''
build = '''
%make
'''
check = '''
%make check
'''
install = '''
%make_install
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/less/LICENSE"
install -Dm755 $pkgfiles/lesspipe.sh "$pkgdir/usr/bin/lesspipe.sh"
# more, zless and zstdless come from util-linux, gzip and zstd; less's viewer for
# every compressed format serves the ones nothing else ships.
install -Dm755 $pkgfiles/zless.sh "$pkgdir/usr/libexec/less/zless"
for z in bzless xzless lzless; do ln -s ../libexec/less/zless "$pkgdir/usr/bin/$z"; done
'''
