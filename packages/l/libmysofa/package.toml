# libmysofa: reads AES SOFA files (head-related transfer functions), for
# PipeWire's spatial audio filter. From Chimera's main/libmysofa (its
# patches). Its tests need CUnit and Node.js: not built.
name = "libmysofa"
version = "1.3.5"
release = 1
summary = "Reader for AES SOFA files (HRTFs)"
license = "BSD-3-Clause"
homepage = "https://github.com/hoene/libmysofa"
patches = ["int.patch", "tests-nodejs.patch"]
hostdeps = ["cmake", "ninja", "pkgconf"]
builddeps = ["zlib-ng-compat-devel"]
options = ["!check"]

source = [
    { url = "https://github.com/hoene/libmysofa/archive/v1.3.5.tar.gz", sha256 = "f29508c335c83d8703f943ffc9ca783ac39aca84e851357f13a55af0f8143137" },
]

setup = '''
%cmake -DBUILD_TESTS=OFF -DBUILD_SHARED_LIBS=ON -DBUILD_STATIC_LIBS=ON
'''
build = '''
%cmake_build
'''
install = '''
%cmake_install
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/libmysofa/LICENSE"
'''
