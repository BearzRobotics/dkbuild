# LedgerSMB behind nginx: static UI files from /usr/share/ledgersmb/UI, the
# rest proxied to Starman (the ledgersmb dinit service, localhost:5762).
# Copy to /etc/nginx/http.d/ledgersmb.conf and set server_name and TLS.
server {
    listen 443 ssl;
    server_name books.example.org;
    ssl_certificate     /etc/ssl/ledgersmb/cert.pem;
    ssl_certificate_key /etc/ssl/ledgersmb/key.pem;
    root /usr/share/ledgersmb/UI;
    gzip off;
    gzip_static on;
    client_max_body_size 5M;
    location ~ \.conf$ { return 404; }
    location ~ /\. { return 404; }
    location / { try_files $uri @strippedprefix @starman; }
    location @strippedprefix { rewrite ^/([a-z0-9A-Z]+)/(.*) /$2 break; }
    location @starman {
        proxy_pass          http://127.0.0.1:5762;
        proxy_read_timeout  300;
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Host $host;
        proxy_set_header    X-Forwarded-Server $host;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }
}
server {
    listen 80;
    server_name books.example.org;
    return 301 https://$host$request_uri;
}
