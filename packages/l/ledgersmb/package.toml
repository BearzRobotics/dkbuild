# LedgerSMB: double-entry accounting and ERP for small and medium businesses
# (general ledger, AR/AP, invoicing, orders, quotations, inventory, payroll
# hooks, fixed assets, reconciliation, multi-currency, multiple companies).
# Perl (PSGI under Starman, with Moose, PGObject, Workflow, Locale::CLDR) on
# PostgreSQL, behind nginx. Upstream's release archive (the Dojo/Vue web UI
# already built in UI/js).
# Its CPAN dependencies (cpanfile's runtime requirements; the starman, edi,
# openoffice and xls features; the recommended Cpanel::JSON::XS,
# Math::BigInt::GMP, Class::C3::XS and Authen::SASL: 254 distributions,
# resolved through MetaCPAN with their own dependencies, less Perl's core and
# what the tree packages) are this recipe's sources, built in dependency order
# (files/cpan-order.txt) into /usr/lib/ledgersmb/perl5, as znuny does.
# Left out: the latex-pdf-ps feature (PDF and PostScript output through
# LaTeX), as the tree has no TeX; the sample configuration's LaTeX formats
# are taken out of /etc/ledgersmb/ledgersmb.yaml.sample (files/ledgersmb.yaml.sed).
# To update: files/resolve-cpan.py <modules> > resolved.json (needs network
# and a host Perl of the same version), then files/cpan-order.py resolved.json
# sources.txt cpan-order.txt.
# Layout: code in /usr/share/ledgersmb, configuration /etc/ledgersmb, a
# dinit service (ledgersmb, Starman on localhost:5762, as the ledgersmb
# user), shipped not enabled. Setup: /usr/share/doc/ledgersmb/README.FenrirOS.
# Installed inert (docs/requests.md): its service is shipped, not enabled;
# no site, no database roles, no credentials; the README says how to set it up.
name = "ledgersmb"
version = "1.13.9"
release = 1
summary = "Double-entry accounting and ERP"
license = "GPL-2.0-or-later"
homepage = "https://ledgersmb.org"
archs = ["x86_64", "aarch64"]
hostdeps = ["perl", "make", "pkgconf"]
builddeps = ["perl", "libxml2-devel", "postgresql-devel", "gmp-devel", "libexpat-devel", "openssl-devel", "zlib-ng-compat-devel",
             "perl-moo", "perl-json", "perl-io-socket-ssl", "perl-net-ssleay", "perl-uri", "perl-template-toolkit",
             "perl-xml-parser", "perl-role-tiny", "perl-sub-quote", "perl-class-method-modifiers", "perl-path-tiny",
             "perl-parse-yapp", "perl-locale-gettext"]
rundeps = ["perl", "perl-moo", "perl-json", "perl-io-socket-ssl", "perl-net-ssleay", "perl-uri", "perl-template-toolkit",
           "perl-xml-parser", "perl-role-tiny", "perl-sub-quote", "perl-class-method-modifiers", "perl-path-tiny",
           "perl-parse-yapp", "perl-locale-gettext", "postgresql", "nginx"]
options = ["!check"]

