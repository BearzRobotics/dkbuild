environment = '''
export PERL_MM_USE_DEFAULT=1 PERL_MM_NONINTERACTIVE=1 ALIEN_INSTALL_TYPE=system NO_NETWORK_TESTING=1
export PERL5LIB=/tmp/lperl/lib/perl5 PATH="/tmp/lperl/bin:$PATH"
'''
build = '''
mkdir -p /tmp/cpan /tmp/lperl
grep -v '^#' $pkgfiles/cpan-order.txt | while read -r t; do
    echo "==> $t"
    rm -rf /tmp/cpan/src && mkdir -p /tmp/cpan/src
    tar -xzf "/build/sources/$t" -C /tmp/cpan/src --no-same-owner
    cd /tmp/cpan/src/*/
    if [ -f Makefile.PL ]; then
        perl Makefile.PL INSTALL_BASE=/tmp/lperl && make -j$jobs && make install
    else
        perl Build.PL --install_base /tmp/lperl && ./Build && ./Build install
    fi
    cd /build
done
test -x /tmp/lperl/bin/starman
'''
install = '''
d="$pkgdir/usr/share/ledgersmb"
mkdir -p "$d"
cp -a bin lib old locale openapi sql templates UI workflows "$d/"
mkdir -p "$pkgdir/usr/lib/ledgersmb"
cp -a /tmp/lperl "$pkgdir/usr/lib/ledgersmb/perl5"
find "$pkgdir/usr/lib/ledgersmb/perl5" \( -name .packlist -o -name perllocal.pod \) -delete
# the sample configuration, less the LaTeX output formats (no TeX in the tree)
sed -f $pkgfiles/ledgersmb.yaml.sed doc/conf/ledgersmb.yaml > ledgersmb.yaml.sample
! grep -q 'Plugin::LaTeX' ledgersmb.yaml.sample
install -Dm644 ledgersmb.yaml.sample "$pkgdir/etc/ledgersmb/ledgersmb.yaml.sample"
install -Dm644 doc/conf/ledgersmb.log.conf.simple "$pkgdir/etc/ledgersmb/ledgersmb.log.conf.sample"
install -Dm755 $pkgfiles/ledgersmb-server.sh "$pkgdir/usr/lib/ledgersmb/ledgersmb-server"
install -Dm755 $pkgfiles/ledgersmb-admin.sh "$pkgdir/usr/bin/ledgersmb-admin"
install -Dm644 $pkgfiles/ledgersmb "$pkgdir/etc/dinit.d/ledgersmb"
install -Dm644 $pkgfiles/sysusers.conf "$pkgdir/usr/lib/sysusers.d/ledgersmb.conf"
install -Dm644 $pkgfiles/tmpfiles.conf "$pkgdir/usr/lib/tmpfiles.d/ledgersmb.conf"
install -Dm644 $pkgfiles/nginx-ledgersmb.conf "$pkgdir/usr/share/doc/ledgersmb/nginx-ledgersmb.conf"
install -Dm644 $pkgfiles/README.FenrirOS "$pkgdir/usr/share/doc/ledgersmb/README.FenrirOS"
install -Dm644 doc/LedgerSMB-manual.pdf "$pkgdir/usr/share/doc/ledgersmb/LedgerSMB-manual.pdf"
install -Dm644 README.md "$pkgdir/usr/share/doc/ledgersmb/README.md"
install -Dm644 Changelog "$pkgdir/usr/share/doc/ledgersmb/Changelog"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/ledgersmb/LICENSE"
install -Dm644 COPYRIGHT "$pkgdir/usr/share/licenses/ledgersmb/COPYRIGHT"
'''
