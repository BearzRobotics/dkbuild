environment = '''
export CXXFLAGS="${CXXFLAGS} -DGLM_ENABLE_EXPERIMENTAL -DU_USING_ICU_NAMESPACE=1"
'''
setup = '''
# The bundled third-party archives are the other sources, copied to /build/sources.
# Only English (US) for now; the other language packs come later.
perl autogen.sh
%configure \
    "--with-vendor=FenrirOS" \
    --with-parallelism=$jobs \
    --with-lang=en-US \
    --with-external-tar=/build/sources \
    --with-help \
    --disable-ccache \
    --disable-fetch-external \
    --disable-odk \
    --disable-online-update \
    --disable-dependency-tracking \
    --disable-qt5 \
    --disable-kf5 \
    --disable-gtk3-kde5 \
    --disable-dconf \
    --disable-epm \
    --disable-lpsolve \
    --disable-coinmp \
    --disable-firebird-sdbc \
    --disable-mariadb-sdbc \
    --disable-postgresql-sdbc \
    --enable-release-build \
    --enable-split-app-modules \
    --enable-python=system \
    --enable-introspection \
    --enable-gtk3 \
    --enable-gtk4 \
    --enable-kf6 \
    --enable-qt6 \
    --enable-build-opensymbol \
    --with-external-dict-dir=/usr/share/hunspell \
    --with-external-hyph-dir=/usr/share/hyphen \
    --with-system-libs \
    --with-system-headers \
    --with-tls=nss \
    --with-myspell-dicts \
    --without-java \
    --without-fonts \
    --without-system-afdko \
    --without-system-box2d \
    --without-system-fast-float \
    --without-system-libcmis \
    --without-system-libeot \
    --without-system-libzmf \
    --without-system-libstaroffice \
    --without-system-dragonbox \
    --without-system-frozen \
    --without-system-libfixmath \
    --without-system-zxcvbn
'''
build = '''
%make
make -C libreofficekit
'''
install = '''
make DESTDIR="$pkgdir/all" PREFIXDIR=/usr distro-pack-install
'''
