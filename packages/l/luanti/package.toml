]

environment = '''
export CFLAGS="${CFLAGS} -DNDEBUG"
export CXXFLAGS="${CXXFLAGS} -DNDEBUG"
'''
setup = '''
%cmake \
    -DBUILD_SERVER=TRUE \
    -DENABLE_LTO=OFF \
    -DENABLE_PROMETHEUS=ON \
    -DENABLE_UPDATE_CHECKER=OFF \
    -DUSE_SDL2=OFF \
    -DUSE_SDL3=ON
