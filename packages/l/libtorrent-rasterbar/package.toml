# Adapted from Chimera Linux cports: main/libtorrent-rasterbar/template.py
# cports is BSD-2-Clause, Copyright (c) Chimera Linux contributors.
# libtorrent-rasterbar (Arvid Norberg's libtorrent): BitTorrent library, used by
# Deluge (and qBittorrent). 2.1.x: the release GitHub marks latest; Chimera is
# still on 2.0.11.
# CMake builds one kind of library per run: the shared one (with the Python
# bindings, in libtorrent-rasterbar-python) first, then a second build tree for
# the static library, installed by hand (only the .a is taken from it).
# Chimera enables the test build; the tests are not run here (they need the
# network and take hours), so build_tests is off. Examples and tools are not
# installed by upstream.
name = "libtorrent-rasterbar"
version = "2.1.2"
release = 1
summary = "C++ BitTorrent library"
license = "BSD-3-Clause"
homepage = "https://libtorrent.org"
hostdeps = ["cmake", "ninja", "pkgconf", "python", "python-setuptools"]
builddeps = ["boost-devel", "linux-headers", "openssl-devel", "python-devel"]
options = ["!check"]

source = [
    { url = "https://github.com/arvidn/libtorrent/releases/download/v2.1.2/libtorrent-rasterbar-2.1.2.tar.gz", sha256 = "3362546d9cd71b9e49ee6cac7d3f1f914ce9cdb217c86b63d5b22cbed0334dbc" },
]

# Chimera's tool_flags: the build is loud with these warnings
environment = '''
export CXXFLAGS="$CXXFLAGS -Wno-unsafe-buffer-usage -Wno-deprecated"
'''
setup = '''
%cmake \
    -DBUILD_SHARED_LIBS=ON \
    -Dpython-bindings=ON \
    -Dpython-egg-info=ON \
    -Dpython-install-system-dir=ON \
    -Dbuild_tests=OFF
cmake -B build-static -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr \
    -DCMAKE_INSTALL_LIBDIR=lib -DBUILD_SHARED_LIBS=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
    -Dpython-bindings=OFF -Dbuild_tests=OFF
'''
build = '''
%cmake_build
cmake --build build-static
'''
install = '''
%cmake_install
install -Dm644 build-static/libtorrent-rasterbar.a "$pkgdir/usr/lib/libtorrent-rasterbar.a"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/libtorrent-rasterbar/LICENSE"
'''

[subpackages.python]
summary = "Python bindings for libtorrent-rasterbar"
paths = ["/usr/lib/python3*"]
depends = ["python"]
