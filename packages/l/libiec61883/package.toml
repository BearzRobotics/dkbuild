# IEC 61883 (audio/video over FireWire) streaming library on libraw1394;
# FFmpeg's --enable-libiec61883. Not imported from cports (Chimera has none).
# autoreconf -fi: the 2010 tarball's libtool and config.sub/config.guess do
# not know this system's musl triple; regenerating takes the current ones.
# needed by: ffmpeg (libiec61883).
name = "libiec61883"
version = "1.2.0"
release = 1
summary = "IEC 61883 (FireWire audio/video) streaming library"
license = "LGPL-2.1-or-later"
homepage = "https://ieee1394.docs.kernel.org"
hostdeps = ["automake", "libtool", "pkgconf"]
builddeps = ["libraw1394-devel"]
options = ["!check"]

source = [
    { url = "https://mirrors.edge.kernel.org/pub/linux/libs/ieee1394/libiec61883-1.2.0.tar.xz", sha256 = "d1e02c7e276fac37313a2f8c1c33d7a9e19282ff16f32e72435428ff5121f09e" },
]

setup = '''
autoreconf -fi -W none
%configure \
    --enable-shared \
    --enable-static
'''
build = '''
%make
'''
install = '''
%make_install
install -Dm644 COPYING "$pkgdir/usr/share/licenses/libiec61883/COPYING"
'''
