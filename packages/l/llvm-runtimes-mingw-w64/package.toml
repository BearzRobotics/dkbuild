# LLVM's libunwind, libc++abi and libc++ for the Windows targets (x86_64,
# i686, aarch64), into each target's /usr/<arch>-w64-mingw32 (libraries, DLLs
# and libc++'s per-target __config_site; the common libc++ headers are the
# system's, llvm-libcxx-devel). Based on Chimera Linux cports (BSD-2-Clause):
# main/llvm-runtimes-mingw-w64.
name = "llvm-runtimes-mingw-w64"
version = "23.1.5"
release = 2
summary = "LLVM libc++ and libunwind for cross-compiling Windows programs"
license = "Apache-2.0 WITH LLVM-exception AND NCSA"
homepage = "https://llvm.org"
hostdeps = ["cmake", "ninja", "python", "llvm", "llvm-devel", "llvm-clang", "llvm-lld", "mingw-w64-headers", "mingw-w64-crt", "mingw-w64-winpthreads", "clang-rt-builtins-mingw-w64"]
rundeps = ["mingw-w64-crt", "mingw-w64-winpthreads", "clang-rt-builtins-mingw-w64", "llvm-libcxx-devel"]
options = ["!check", "!strip", "!lto"]

source = [
    { url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.5/llvm-project-23.1.5.src.tar.xz", sha256 = "fb50b1eac93ddeb3aa8dab4cfe324dff74f4a9c2bdee6160c9e36188f8d06a6e" },
]

environment = '''
unset CC CXX CFLAGS CXXFLAGS CPPFLAGS LDFLAGS
targets="x86_64 i686 aarch64"
'''
setup = '''
for a in $targets; do
    t=$a-w64-mingw32
    cmake -S runtimes -B build-$a -G Ninja \
        -DCMAKE_BUILD_TYPE=Release -DCMAKE_SYSTEM_NAME=Windows -DCMAKE_INSTALL_PREFIX=/usr \
        -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
        -DCMAKE_AR=/usr/bin/llvm-ar -DCMAKE_NM=/usr/bin/llvm-nm -DCMAKE_RANLIB=/usr/bin/llvm-ranlib \
        -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
        -DCMAKE_SYSROOT=/usr/$t -DLLVM_DEFAULT_TARGET_TRIPLE=$t \
        -DCMAKE_ASM_COMPILER_TARGET=$t -DCMAKE_C_COMPILER_TARGET=$t -DCMAKE_CXX_COMPILER_TARGET=$t \
        "-DLLVM_ENABLE_RUNTIMES=libcxx;libcxxabi;libunwind" \
        -DLIBUNWIND_USE_COMPILER_RT=ON -DLIBCXX_USE_COMPILER_RT=ON -DLIBCXXABI_USE_COMPILER_RT=ON \
        -DLIBCXXABI_ENABLE_SHARED=OFF -DLIBCXX_ENABLE_STATIC_ABI_LIBRARY=ON \
        -DLLVM_ENABLE_PER_TARGET_RUNTIME_DIR=ON \
        -DLIBUNWIND_HAS_DL_LIB=OFF -DLIBCXX_HAS_ATOMIC_LIB=OFF -DLIBCXXABI_HAS_C_LIB=OFF
done
'''
build = '''
for a in $targets; do cmake --build build-$a; done
'''
install = '''
for a in $targets; do
    t=$a-w64-mingw32
    DESTDIR="$pkgdir" cmake --install build-$a
    # from the per-target directories into the target's own tree
    mkdir -p "$pkgdir/usr/$t"
    for d in "$pkgdir"/usr/include/$a-w64-*; do [ -d "$d" ] && { mkdir -p "$pkgdir/usr/$t/include"; cp -a "$d"/. "$pkgdir/usr/$t/include/"; rm -rf "$d"; }; done
    for d in "$pkgdir"/usr/lib/$a-w64-*; do [ -d "$d" ] && { mkdir -p "$pkgdir/usr/$t/lib"; cp -a "$d"/. "$pkgdir/usr/$t/lib/"; rm -rf "$d"; }; done
    [ -d "$pkgdir/usr/share/libc++" ] && { mkdir -p "$pkgdir/usr/$t/share"; mv "$pkgdir/usr/share/libc++" "$pkgdir/usr/$t/share/"; }
    [ -d "$pkgdir/usr/bin" ] && { mkdir -p "$pkgdir/usr/$t/bin"; mv "$pkgdir"/usr/bin/* "$pkgdir/usr/$t/bin/"; rmdir "$pkgdir/usr/bin"; }
    ls "$pkgdir/usr/$t/lib/libc++.a" >/dev/null
done
# the common libc++ headers are the system's (llvm-libcxx-devel)
rm -rf "$pkgdir/usr/include" "$pkgdir/usr/lib" "$pkgdir/usr/share/libc++"
install -Dm644 libcxx/LICENSE.TXT "$pkgdir/usr/share/licenses/llvm-runtimes-mingw-w64/LICENSE.TXT"
'''
