# Imported from Chimera Linux cports: main/libwebp/template.py
# cports is BSD-2-Clause, Copyright (c) Chimera Linux contributors.
# needed by: hyprgraphics (WebP wallpapers and images). No GL/GIF/TIFF example tools.
# r2: rebuilt with libraries in /usr/lib (the %cmake macro set no libdir; they went to /usr/lib64).
name = "libwebp"
version = "1.6.0"
release = 2
summary = "WebP image format library"
license = "BSD-3-Clause"
homepage = "https://chromium.googlesource.com/webm/libwebp"
hostdeps = ["cmake", "ninja", "pkgconf"]
builddeps = ["libjpeg-turbo-devel", "libpng-devel"]

source = [
    { url = "http://downloads.webmproject.org/releases/webp/libwebp-1.6.0.tar.gz", sha256 = "e4ab7009bf0629fd11982d4c2aa83964cf244cffba7347ecd39019a9e38c4564" },
]

environment = '''
export CFLAGS="${CFLAGS} -DNDEBUG"
'''
setup = '''
%cmake \
    -DBUILD_SHARED_LIBS=ON \
    -DWEBP_BUILD_VWEBP=OFF \
    -DWEBP_BUILD_GIF2WEBP=OFF \
    -DWEBP_BUILD_IMG2WEBP=OFF \
    -DWEBP_BUILD_ANIM_UTILS=OFF \
    -DWEBP_BUILD_EXTRAS=OFF
'''
build = '''
%cmake_build
'''
install = '''
%cmake_install
install -Dm644 COPYING "$pkgdir/usr/share/licenses/libwebp/COPYING"
install -dm755 "$pkgdir/usr/lib/cmake"
mv "$pkgdir/usr/share/WebP/cmake" "$pkgdir/usr/lib/cmake/WebP"
rmdir "$pkgdir/usr/share/WebP"
'''
