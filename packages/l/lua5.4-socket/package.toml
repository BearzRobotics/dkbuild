# LuaSocket for Lua 5.4: TCP/UDP sockets, MIME and URL/HTTP helper modules
# (needed by Prosody and, through LuaSec, TLS). A Lua C module: there is no
# library for other programs to link, so no -static.
name = "lua5.4-socket"
version = "3.1.0"
release = 1
summary = "Network support for Lua 5.4"
license = "MIT"
homepage = "https://github.com/lunarmodules/luasocket"
hostdeps = ["pkgconf"]
builddeps = ["lua-devel"]
rundeps = ["lua"]
options = ["!check"]

source = [
    { url = "https://github.com/lunarmodules/luasocket/archive/refs/tags/v3.1.0.tar.gz", sha256 = "bf033aeb9e62bcaa8d007df68c119c966418e8c9ef7e4f2d7e96bddeca9cca6e" },
]

build = '''
# its makefile hard-codes gcc; use the build's compiler. Lua's headers are in /usr/include.
make -C src linux PLAT=linux LUAV=5.4 CC_linux="$CC" LD_linux="$CC" LUAINC_linux_base=/usr/include \
    MYCFLAGS="$CFLAGS" MYLDFLAGS="$LDFLAGS"
'''
install = '''
make -C src install-unix PLAT=linux LUAV=5.4 prefix=/usr DESTDIR="$pkgdir"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/lua5.4-socket/LICENSE"
'''
