name     = "linux-headers"
version  = "6.19"
release  = 4
summary  = "Linux kernel API headers for userspace"
license  = "GPL-2.0-only WITH Linux-syscall-note"
homepage = "https://www.kernel.org/"
options  = ["!check", "!strip"]

source = [
    { url = "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.19.tar.xz", sha256 = "303079a8250b8f381f82b03f90463d12ac98d4f6b149b761ea75af1323521357" },
]

build = '''
%kernel_make headers
'''
# headers_install is `rsync -mrl --include='*/' --include='*.h' --exclude='*'`
# of the generated usr/include: the same with find and cp, so linux-headers
# does not need rsync (rsync with ACLs needs acl, which needs linux-headers)
install = '''
cd usr/include
find . -name '*.h' -type f | while read -r h; do
    install -Dm644 "$h" "$pkgdir/usr/include/$h"
done
test -f "$pkgdir/usr/include/linux/types.h" && test -f "$pkgdir/usr/include/asm/unistd.h"
'''

# needed by: musl, and every program that includes <linux/...>.
# The headers are the package, so they stay in the main package instead of a
# -devel split.
[subpackages.devel]
summary = "Unused"
paths   = []
