# libgweather 4: GNOME library for weather information (METAR, met.no),
# used by Evolution and evolution-data-server for weather calendars. Based
# on Chimera's main/libgweather: GObject introspection and Vala bindings,
# the system time-zone database. No gtk-doc reference.
name = "libgweather"
version = "4.6.0"
release = 1
summary = "GNOME Weather information access library"
license = "LGPL-2.1-or-later"
homepage = "https://gitlab.gnome.org/GNOME/libgweather"
hostdeps = ["gettext", "glib-devel", "gobject-introspection", "meson", "pkgconf", "python-gobject-devel", "vala"]
builddeps = ["geocode-glib-devel", "gweather-locations-devel", "json-glib-devel", "libsoup-devel", "libxml2-devel"]
rundeps = ["gweather-locations", "tzdb"]
# The tests look up locations over the network.
options = ["!check"]

source = [
    { url = "https://download.gnome.org/sources/libgweather/4.6/libgweather-4.6.0.tar.xz", sha256 = "7f5d0e8c9685ef2ff46c2f3a57cae48d7bf3540b2d83921f889ef28e6a876788" },
]

setup = '''
%meson \
    -Dgtk_doc=false \
    -Denable_vala=true \
    -Dzoneinfo_dir=/usr/share/zoneinfo
'''
build = '''
%meson_build
'''
install = '''
%meson_install
'''
