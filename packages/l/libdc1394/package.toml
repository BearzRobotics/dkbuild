# IIDC/DCAM FireWire (and USB) camera control library;
# FFmpeg's --enable-libdc1394 (needs libdc1394-2). Not imported from cports.
# autoreconf -fi: the tarball's libtool and config.sub/config.guess do not
# know this system's musl triple; regenerating takes the current ones.
# The Linux backend is the firewire-cdev ("juju") one, over libraw1394; the
# libusb backend is built too. The example programs are built when their
# X11/SDL dependencies are present (configure checks).
# r3: clang (this tree's compiler) rejects a variable-length array inside a struct, which the juju backend
# uses twice for the trailing data of a kernel event ("fields must have a constant size", juju/control.c:286
# and juju/capture.c:324). Source edit (sed in `setup`): the arrays get a fixed upper bound,
# 4096 quads for a response and 2*8192+16 header words for an ISO interrupt (8192 packets per frame is
# far above any camera mode); the kernel never returns more than the buffer it is given, and capture.c
# returns DC1394_FAILURE up front if a frame would need more.
# needed by: ffmpeg (libdc1394).
name = "libdc1394"
version = "2.2.7"
release = 4
summary = "Library for controlling IIDC (DCAM) 1394 cameras"
license = "LGPL-2.1-or-later"
homepage = "https://damien.douxchamps.net/ieee1394/libdc1394"
hostdeps = ["automake", "libtool", "pkgconf"]
# sdl12-compat-devel: provides sdl.m4 (AM_PATH_SDL), which configure.ac calls; without it autoreconf failed with undefined AM_PATH_SDL/AC_DEFINE.
builddeps = ["libraw1394-devel", "libusb-devel", "linux-headers", "sdl12-compat-devel"]
options = ["!check"]

source = [
    { url = "https://downloads.sourceforge.net/project/libdc1394/libdc1394-2/2.2.7/libdc1394-2.2.7.tar.gz", sha256 = "537ceb78dd3cef271a183f4a176191d1cecf85f025520e6bd3758b0e19e6609f" },
]

setup = '''
sed -i 's|__u32 buffer\[cam->max_response_quads\];|__u32 buffer[4096]; /* was max_response_quads: no VLA in a struct under clang */|' dc1394/juju/control.c
sed -i 's|__u32 headers\[craw->packets_per_frame\*2 + 16\]; // HPK 20161209|__u32 headers[2*8192 + 16]; /* was packets_per_frame*2+16: no VLA in a struct under clang */|' dc1394/juju/capture.c
sed -i 's|^    struct {$|    if (craw->packets_per_frame > 8192)\n        return DC1394_FAILURE;\n    struct {|' dc1394/juju/capture.c
test "$(grep -c '4096\]' dc1394/juju/control.c)" = 1
test "$(grep -c '2\*8192 + 16' dc1394/juju/capture.c)" = 1
autoreconf -fi -W none
%configure \
    --enable-shared \
    --enable-static
'''
build = '''
%make
'''
install = '''
%make_install
install -Dm644 COPYING "$pkgdir/usr/share/licenses/libdc1394/COPYING"
'''
