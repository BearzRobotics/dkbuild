name = "libmtp"
version = "1.1.22"
release = 2
summary = "Media Transfer Protocol (MTP) library"
license = "LGPL-2.1-or-later"
homepage = "http://libmtp.sourceforge.net"
hostdeps = ["pkgconf"]
builddeps = ["libgcrypt-devel", "libusb-devel"]
options = ["!cross"]

source = [
    { url = "https://downloads.sourceforge.net/sourceforge/libmtp/libmtp-1.1.22.tar.gz", sha256 = "c3fcf411aea9cb9643590cbc9df99fa5fe30adcac695024442973d76fa5f87bc" },
]

setup = '''
%configure \
    --with-udev=/usr/lib/udev \
    --with-udev-group=plugdev
'''
build = '''
%make
'''
check = '''
%make check
'''
install = '''
%make_install
# the udev rules above give MTP/PTP devices to group plugdev (base-files has it; this
# makes sure, on systems whose /etc/group predates it; sd-tools applies sysusers.d)
install -Dm644 /dev/stdin "$pkgdir/usr/lib/sysusers.d/libmtp.conf" <<'EOF2'
g plugdev 46
EOF2
'''
