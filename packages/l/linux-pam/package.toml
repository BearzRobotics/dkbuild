# Imported from Chimera Linux cports: main/linux-pam/template.py
# cports is BSD-2-Clause, Copyright (c) Chimera Linux contributors.
# needed by: kscreenlocker (KDE's screen locker has no other way to check a
# password), kwallet-pam, sddm, xfce4-screensaver, krdp. A library for the
# programs that need it: login, su, sudo and shadow keep using /etc/shadow
# directly. Its modules check the same /etc/shadow (pam_unix, through the
# setuid unix_chkpwd).
name = "linux-pam"
version = "1.7.2"
release = 2
summary = "Pluggable Authentication Modules for Linux"
license = "BSD-3-Clause"
homepage = "https://github.com/linux-pam/linux-pam"
hostdeps = ["docbook-xsl", "docbook5-xml", "gettext-devel", "libxslt", "libxml2", "meson", "pkgconf", "flex"]
builddeps = ["flex-static", "gettext-devel", "linux-headers"]
rundeps = ["linux-pam-base"]
options = ["!check"]

source = [
    { url = "https://github.com/linux-pam/linux-pam/releases/download/v1.7.2/Linux-PAM-1.7.2.tar.xz", sha256 = "3d86b6383fb5fd9eb9578d2cd47d92801191f4bf3f9bc61419bfefc8aa1e531a" },
]

environment = '''
# The man pages: DocBook 5's schema and the namespaced DocBook XSL from the
# local catalogs, through one catalog file (its configure checks both in it)
mkdir -p /tmp/xml
cat > /tmp/xml/catalog <<'EOF2'
<?xml version="1.0"?>
<catalog xmlns="urn:oasis:names:tc:entity:xmlns:xml:catalog">
  <nextCatalog catalog="/usr/share/xml/docbook/5.0/catalog.xml"/>
  <nextCatalog catalog="/usr/share/xsl/docbook/catalog.xml"/>
</catalog>
EOF2
export XML_CATALOG_FILES=/tmp/xml/catalog
'''
setup = '''
%meson \
    -Ddocdir=/usr/share/doc/pam \
    -Dnis=disabled \
    -Daudit=disabled \
    -Dselinux=disabled \
    -Dvendordir=/usr/share/pam \
    -Dxml-catalog=/tmp/xml/catalog
'''
build = '''
%meson_build
'''
install = '''
%meson_install
install -Dm644 COPYING "$pkgdir/usr/share/licenses/linux-pam/COPYING"
rm -rf "$pkgdir/usr/lib/systemd"
# pam_unix checks passwords through it, as the user (it reads /etc/shadow)
chmod 4755 "$pkgdir"/usr/*bin/unix_chkpwd
'''
