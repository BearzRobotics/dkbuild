# LuaSec for Lua 5.4: TLS/SSL (OpenSSL) streams for LuaSocket, plus an HTTPS
# helper (needed by Prosody). Built with its bundled copy of LuaSocket's
# helper sources (EXTRA = luasocket, upstream's default), so it only needs
# lua5.4-socket's Lua files at run time. A Lua C module: no -static.
name = "lua5.4-sec"
version = "1.3.2"
release = 1
summary = "TLS/SSL for Lua 5.4 sockets"
license = "MIT"
homepage = "https://github.com/lunarmodules/luasec"
hostdeps = ["pkgconf"]
builddeps = ["lua-devel", "openssl-devel", "lua5.4-socket"]
rundeps = ["lua", "lua5.4-socket"]
options = ["!check"]

source = [
    { url = "https://github.com/lunarmodules/luasec/archive/refs/tags/v1.3.2.tar.gz", sha256 = "97293092ba385ab390decb6678bc8cbeffd5899bfbc49eb7ef4aa00f5e31c3d4" },
]

build = '''
make linux CC="$CC" LUAPATH=/usr/share/lua/5.4 LUACPATH=/usr/lib/lua/5.4
'''
install = '''
make install LUAPATH=/usr/share/lua/5.4 LUACPATH=/usr/lib/lua/5.4 DESTDIR="$pkgdir"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/lua5.4-sec/LICENSE"
'''
