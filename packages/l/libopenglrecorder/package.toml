# Library to record OpenGL frames to video (used by SuperTuxKart's recorder).
name = "libopenglrecorder"
version = "0.1.0"
release = 1
summary = "OpenGL recording library"
license = "BSD-3-Clause"
homepage = "https://github.com/Benau/libopenglrecorder"
hostdeps = ["cmake", "ninja", "pkgconf"]
builddeps = ["libjpeg-turbo-devel", "libpulse-devel", "libvorbis-devel", "libvpx-devel", "openh264-devel"]
options = ["!check"]  # no tests upstream

source = [
    { url = "https://github.com/Benau/libopenglrecorder/archive/v0.1.0.tar.gz", sha256 = "a90a99c23f868636f77003a8dc6ffe6c3699fc2759c47df5dbd44ff8b42d2e4f" },
]

setup = '''
# CMAKE_POLICY_VERSION_MINIMUM: the project's cmake_minimum_required is older than cmake 4 accepts
%cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5
'''
build = '''
%cmake_build
'''
install = '''
%cmake_install
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/libopenglrecorder/LICENSE"
'''
