name = "libjpeg-turbo"
version = "3.2.0"
release = 4
summary = "Derivative of libjpeg which uses SIMD instructions"
license = "IJG AND BSD-3-Clause AND Zlib"
homepage = "https://libjpeg-turbo.org"
patches = ["CVE-2026-75466.patch"]
hostdeps = ["cmake", "ninja", "pkgconf", "nasm"]
builddeps = ["linux-headers"]

source = [
    { url = "https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/3.2.0/libjpeg-turbo-3.2.0.tar.gz", sha256 = "6f30092cef9fb839779646608f4ee14ae3cbac989c47fa05e841b0841f09878e" },
]

setup = '''
%cmake \
    -DWITH_JPEG8=1 \
    -DCMAKE_INSTALL_LIBDIR=/usr/lib \
    -DENABLE_STATIC=FALSE
'''
build = '''
%cmake_build
'''
install = '''
%cmake_install
install -Dm644 LICENSE.md "$pkgdir/usr/share/licenses/libjpeg-turbo/LICENSE.md"
install -Dm644 src/jpegint.h "$pkgdir/usr/include/jpegint.h"
install -Dm644 src/transupp.h "$pkgdir/usr/include/transupp.h"
rm -rf "$pkgdir/usr/share/doc"
rm -rf "$pkgdir/usr/bin/tjbench"
'''
