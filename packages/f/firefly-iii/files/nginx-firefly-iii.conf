# Firefly III under nginx with php-fpm (/run/php-fpm.sock, or the pool in
# php-fpm-firefly-iii.conf): only public/ is served. Copy to
# /etc/nginx/http.d/firefly-iii.conf, set server_name and TLS, and add
# nginx's user to the _php group.
server {
    listen 80;
    server_name money.example.org;
    root /usr/share/firefly-iii/public;
    index index.php;
    client_max_body_size 20M;
    fastcgi_param HTTP_PROXY "";
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ ^/index\.php(/|$) {
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_pass unix:/run/php-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known) { deny all; }
}
