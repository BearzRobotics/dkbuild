# Farstream: audio/video conferencing framework on GStreamer 1.0 (RTP, ICE
# through libnice, codecs). Needed by Pidgin's voice and video support
# (--enable-vv). Autotools; shared and static libraries (%configure),
# introspection on. Optional UPnP IGD support (gupnp-igd) is picked up when
# gupnp-igd is installed (not a dependency here).
name = "farstream"
version = "0.2.9"
release = 1
summary = "Audio/video conferencing framework for GStreamer"
license = "LGPL-2.1-or-later"
homepage = "https://www.freedesktop.org/wiki/Software/Farstream/"
hostdeps = ["gobject-introspection", "pkgconf"]
builddeps = ["glib-devel", "gobject-introspection-devel", "gst-plugins-base-devel", "gstreamer-devel", "libnice-devel"]
rundeps = ["gst-plugins-bad", "gst-plugins-good", "libnice"]
options = ["!check"]

source = [
    { url = "https://freedesktop.org/software/farstream/releases/farstream/farstream-0.2.9.tar.gz", sha256 = "cb7d112433cf7c2e37a8ec918fb24f0ea5cb293cfa1002488e431de26482f47b" },
]

setup = '''
%configure \
    --enable-introspection=yes \
    --disable-gtk-doc
'''
build = '''
%make
'''
install = '''
%make_install
'''
