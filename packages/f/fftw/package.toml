name = "fftw"
version = "3.3.10"
release = 1
summary = "Library for computing the discrete Fourier transform"
license = "GPL-2.0-or-later"
homepage = "http://www.fftw.org"
hostdeps = ["pkgconf", "automake", "libtool"]
builddeps = ["openmp-devel"]
options = ["!check"]

source = [
    { url = "http://www.fftw.org/fftw-3.3.10.tar.gz", sha256 = "56c932549852cddcfafdab3820b0200c7742675be92179e59e6215b340e26467" },
]
setup = '''
autoreconf -if
# Three builds: double (the default), long double and float, each in its own
# directory; OpenMP and threads in all, SSE where the precision allows.
for f in double long-double float; do
    case $f in
        double) extra="--enable-sse2 --enable-avx --enable-avx2" ;;
        long-double) extra="--enable-long-double" ;;
        float) extra="--enable-float --enable-sse --enable-avx --enable-avx2" ;;
    esac
    mkdir -p build-$f
    ( cd build-$f && ../configure --prefix=/usr --sysconfdir=/etc --localstatedir=/var \
        --enable-shared --enable-static --enable-threads --enable-openmp $extra )
done
'''
build = '''
for f in double long-double float; do make -C build-$f -j$jobs; done
'''
install = '''
for f in double long-double float; do make -C build-$f DESTDIR="$pkgdir" install; done
install -Dm644 COPYING "$pkgdir/usr/share/licenses/fftw/COPYING"
'''
