# FreeScout under nginx with php-fpm (/run/php-fpm.sock). Copy to
# /etc/nginx/http.d/freescout.conf, set server_name and TLS, and add nginx's
# user to the _php group.
server {
    listen 80;
    server_name support.example.org;
    root /usr/share/freescout/public;
    index index.php;
    client_max_body_size 20M;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
    location ~* ^/storage/attachment/ { expires 1M; access_log off; try_files $uri $uri/ /index.php?$query_string; }
    location ~* ^/(?:css|js)/.*\.(?:css|js)$ { expires 2d; access_log off; add_header Cache-Control "public, must-revalidate"; }
    location ~ /\. { deny all; }
}
