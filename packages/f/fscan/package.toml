# A Security Auditing Tool. (BlackArch list, requested 2026-11-16; docs/requests.md). Written from the template of ffuf; not built yet when written (wip/queue): expect first-build fixes.
# Go module, dependencies fetched on the host (godeps). Main package: ..
name = "fscan"
version = "2.2.2"
release = 1
summary = "A Security Auditing Tool."
license = "MIT"
homepage = "https://github.com/shadow1ng/fscan"
hostdeps = ["go"]
options = ["!check", "godeps"]

source = [
    { url = "https://github.com/shadow1ng/fscan/archive/refs/tags/v2.2.2.tar.gz", sha256 = "4ad616dc215ceb683113ec6d3b96480d13e3321495e0f9657c1bb42aa6d62556" },
]

environment = '''
export GOFLAGS="-mod=mod -trimpath -buildvcs=false" GOTOOLCHAIN=local GOPROXY=off
export GOCACHE=/tmp/go-cache GOPATH=/tmp/go CGO_ENABLED=0
'''
build = '''
mkdir -p build
go build -o build/fscan .
'''
install = '''
install -Dm755 build/fscan "$pkgdir/usr/bin/fscan"
install -Dm644 LICENSE.txt "$pkgdir/usr/share/licenses/fscan/LICENSE.txt"
'''
