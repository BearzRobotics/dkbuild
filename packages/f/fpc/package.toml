# Free Pascal 3.2.4: the compiler (fpc, ppcx64), the run-time library, every
# package unit (fcl-*, rtl-*, the database, network, graphics and GUI
# bindings that need no external library at build time), and the utilities
# (fpcmake, fpcmkcfg, fpdoc, h2pas, ppudump, ...). Not Lazarus (separate
# project: needs the LCL widgetsets and fpc-src; not written).
# Bootstrapping: the first build (stage 0) runs on Alpine's FPC 3.2.2
# (fpc-bootstrap, stage0deps; its units are found through a ~/.fpc.cfg made
# with its fpcmkcfg), every later one on the previous fpc package (selfhost,
# its /etc/fpc.cfg). `make all` builds the compiler once with that compiler,
# then the compiler again with itself, the RTL and the packages.
# FPC emits assembler and calls the external `as` and `ld`: binutils is a
# runtime dependency (GNU as; ld is the system's). Our binutils installs as
# g<tool> (gas), so there is no `as`: the build puts an `as` link to gas in
# PATH, and the package ships one in /usr/lib/fpc/<version>/bin, which the
# installed fpc.cfg names with -FD (the compiler's directory for its
# assembler and linker; ld is still found in PATH).
# Source: the tag release_3_2_4 archive of the project's GitLab (the release
# tarball on the download server refuses downloads); the archive's checksum is
# pinned, but GitLab does not promise a stable archive format.
# The installed /etc/fpc.cfg is made with fpcmkcfg (basepath
# /usr/lib/fpc/$fpcversion), as `samplecfg` would on the user's machine.
# Not done: the documentation (needs TeX), the test suite.
# r4: rescan: needs so:libc.so, not the loader's path (BC-09).
name = "fpc"
version = "3.2.4"
release = 4
summary = "Free Pascal compiler"
license = "GPL-2.0-or-later WITH Linking-exception"
homepage = "https://www.freepascal.org"
archs = ["x86_64"]
hostdeps = ["make", "binutils"]
builddeps = ["linux-headers"]
stage0deps = ["fpc-bootstrap"]
rundeps = ["binutils"]
# links the dynamic linker by its path, which no package provides as a library name; musl is always there
noscan = ["usr/lib/libpas2jslib.so"]
options = ["!check", "!lto", "!strip", "selfhost"]

source = [
    { url = "https://gitlab.com/freepascal.org/fpc/source/-/archive/release_3_2_4/source-release_3_2_4.tar.gz", sha256 = "d740b5ee5ea8afad263e88f9db27885ab9c228f1f02829695f4c2f9ee866b2b0" },
]

environment = '''
export HOME=/tmp
mkdir -p /tmp/fpcbin
ln -sf /usr/bin/gas /tmp/fpcbin/as
# FPC links with `ld --format elf64-x86-64`, which lld (the system's ld) does not accept: GNU ld instead
ln -sf /usr/bin/ld.bfd /tmp/fpcbin/ld
# r2: the makefile finds libgcc with `gcc -print-libgcc-file-name` ("Could not find libgcc", "gcc: not found"); the C compiler here is clang,
# which answers the same option, so a `gcc` link to it is in PATH for the build.
ln -sf /usr/bin/clang /tmp/fpcbin/gcc
export PATH=/tmp/fpcbin:$PATH
unset CFLAGS CXXFLAGS LDFLAGS CPPFLAGS
# the Pascal compiler that builds this one: the previous package's, or (stage 0) Alpine's
if [ -x /usr/bin/ppcx64 ] && [ ! -d /usr/lib/fpc-bootstrap ]; then
    export PP=/usr/bin/ppcx64
else
    s=/usr/lib/fpc-bootstrap/usr
    export PP=$s/lib/fpc/3.2.2/ppcx64
    export FPCDIR=$s/lib/fpc/3.2.2
    # the seed's configuration: its unit directories
    $s/bin/fpcmkcfg -d basepath=$FPCDIR -o /tmp/.fpc.cfg
fi
'''
build = '''
# r3: -FL: the dynamic linker the programs FPC builds ask for. The compiler's default is glibc's (/lib64/ld-linux-x86-64.so.2), so the first program this
# build runs after compiling it (fpmake) was "No such file or directory" (exit 127: the file is there, its interpreter is not) right after "Linking fpmake";
# musl's is /lib/ld-musl-<arch>.so.1. Also in the installed fpc.cfg, for every program FPC builds on this system.
ldso=/lib/ld-musl-$(uname -m).so.1
make all PP="$PP" OPT="-O2 -FL$ldso" -j1
'''
install = '''
make install PP="$PP" PREFIX=/usr INSTALL_PREFIX="$pkgdir/usr"
v=$version
ln -sf ../lib/fpc/$v/ppcx64 "$pkgdir/usr/bin/ppcx64"
# /etc/fpc.cfg: the unit and library paths of this version
mkdir -p "$pkgdir/etc"
"$pkgdir/usr/bin/fpcmkcfg" -d basepath='/usr/lib/fpc/$fpcversion' -o "$pkgdir/etc/fpc.cfg"
# GNU as is gas here and GNU ld is ld.bfd (lld rejects the --format option FPC passes): -FD names the
# directory holding `as` and `ld` links to them
mkdir -p "$pkgdir/usr/lib/fpc/$v/bin"
ln -s ../../../../bin/gas "$pkgdir/usr/lib/fpc/$v/bin/as"
ln -s ../../../../bin/ld.bfd "$pkgdir/usr/lib/fpc/$v/bin/ld"
printf '%s\n' '# the assembler (gas, as `as`)' '-FD/usr/lib/fpc/$fpcversion/bin' >> "$pkgdir/etc/fpc.cfg"
printf '%s\n' '# the dynamic linker (musl)' "-FL/lib/ld-musl-$(uname -m).so.1" >> "$pkgdir/etc/fpc.cfg"
test -x "$pkgdir/usr/lib/fpc/$v/ppcx64"
test -f "$pkgdir/etc/fpc.cfg"
install -Dm644 compiler/COPYING.txt "$pkgdir/usr/share/licenses/fpc/COPYING.txt"
'''
