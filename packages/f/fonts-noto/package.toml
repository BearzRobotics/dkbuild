name = "fonts-noto"
version = "2026.10.01"
release = 2
summary = "Google Noto fonts"
license = "OFL-1.1"
homepage = "https://github.com/notofonts/notofonts.github.io"

source = [
    { url = "https://github.com/notofonts/notofonts.github.io/archive/refs/tags/noto-monthly-release-2026.10.01.zip", sha256 = "2862862d5c4b52aeb5c6f2244b96eb3e3063a5aec8bd58ae03122a7e40f1ade3" },
]

install = '''
install -Dm644 -t "$pkgdir/usr/share/fontconfig/conf.avail" $pkgfiles/*.conf
install -Dm644 -t "$pkgdir/usr/share/fonts/noto" fonts/Noto*/hinted/ttf/*.ttf
install -Dm644 -t "$pkgdir/usr/share/fonts/noto" fonts/Noto*/unhinted/otf/*.otf
install -Dm644 fonts/LICENSE "$pkgdir/usr/share/licenses/fonts-noto/LICENSE"
'''
