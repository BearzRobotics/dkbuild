# fortune and its cookies (the offensive set left out), unstr, strfile.
name = "fortune-mod"
version = "3.26.0"
release = 2
summary = "The fortune cookie program, with its cookie files"
license = "BSD-4-Clause-UC"
homepage = "https://github.com/shlomif/fortune-mod"
hostdeps = ["libxslt", "docbook-xsl", "perl-path-tiny", "cmake", "ninja", "pkgconf", "rinutils", "perl"]
builddeps = ["recode-devel"]
options = ["!check"]

source = [
    { url = "https://github.com/shlomif/fortune-mod/releases/download/fortune-mod-3.26.0/fortune-mod-3.26.0.tar.xz", sha256 = "ac4d1486cac9b999049107136b94106fe98a4aeac00ec635b144c43764bffe4c" },
]

setup = '''
# the man pages are made with `docmake manpages X.docbook5.xml` (CPAN's
# App::Docmake, which runs xsltproc with DocBook's manpages stylesheet): the
# same, as a small script
mkdir -p /tmp/docmake-bin
cat > /tmp/docmake-bin/docmake <<'EOS'
#!/bin/sh
[ "$1" = manpages ] || { echo "docmake: only manpages is supported" >&2; exit 1; }
exec xsltproc --nonet /usr/share/xsl/docbook/manpages/docbook.xsl "$2"
EOS
chmod +x /tmp/docmake-bin/docmake
%cmake \
    -DCOOKIEDIR=/usr/share/fortunes \
    -DLOCALDIR=/usr/local/share/fortunes \
    -DNO_OFFENSIVE=ON
'''
build = '''
export PATH=/tmp/docmake-bin:$PATH
%cmake_build
'''
install = '''
%cmake_install
install -Dm644 COPYING.txt "$pkgdir/usr/share/licenses/fortune-mod/COPYING.txt"
'''
