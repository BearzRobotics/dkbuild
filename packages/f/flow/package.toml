# Flow Control: a programmer's text editor in Zig (terminal UI on libvaxis, tree-sitter
# syntax highlighting, LSP, vim and emacs-style key sets; the binary is `flow`). The
# source is a pinned commit of master (5514cb7, 2026-11-14), not the v0.7.2 tag: the tag's
# manifest asks for Zig 0.15.2 and its dependency pins (zigwin32's old-style build.zig.zon,
# thespian's asio hash) do not fetch with the tree's Zig 0.17.1, while master declares
# minimum_zig_version 0.17.0 and does. Move to the next release tag once one targets 0.17.
# Its Zig dependencies (syntax, flags, dizzy, thespian,
# themes, fuzzig, vaxis, zeit, ...) are fetched on the host (option `zigdeps`) and built
# offline with --system zig-pkg. libfuzzer_kit (a lazy dependency of dizzy, only for its
# -Denable-fuzzing step) is removed from zig-pkg before the build: Zig compiles the build.zig
# of every package it finds there, and that one uses addCSourceFile, which Zig 0.17 removed. Terminal build only: no -Dgui (the standalone GUI window).
name = "flow"
version = "0.7.2_git20261114"
release = 3
summary = "Programmer's text editor in Zig"
license = "MIT"
homepage = "https://github.com/neurocyte/flow"
archs = ["x86_64"]
hostdeps = ["zig"]
options = ["zigdeps", "!check"]

source = [
    { url = "https://github.com/neurocyte/flow/archive/5514cb7d5db600a2b8b2bf33f2d27a1b203bb31c.tar.gz", sha256 = "7f5b0e431740b88f9982336ee492327b256ede149cc628fb4a146fa7af5ab994" },
    { url = "https://download.savannah.gnu.org/releases/freetype/freetype-2.14.3.tar.gz", sha256 = "e61b31ab26358b946e767ed7eb7f4bb2e507da1cfefeb7a8861ace7fd5c899a1", unpack = false },
]

install = '''
rm -rf zig-pkg/libfuzzer_kit-*
# r3: freetype is a lazy dependency (build.zig.zon: the embedded colour-emoji font is rasterised with it, `embed-emoji`, on by default) that the host's
# `zig build --fetch=all` did not bring into zig-pkg, so the offline build stopped with "lazy dependency package not found: zig-pkg/N-V-__8AAJo-LAHF...".
# The same tarball as the one the .zon names (the package is the tarball without its top directory), put where Zig looks.
mkdir -p zig-pkg/N-V-__8AAJo-LAHFNfa0p0oMQqmwlBEAZMOeo03azXgrKLTT
tar -xzf /build/sources/freetype-2.14.3.tar.gz -C zig-pkg/N-V-__8AAJo-LAHFNfa0p0oMQqmwlBEAZMOeo03azXgrKLTT --strip-components=1 --no-same-owner
test -f zig-pkg/N-V-__8AAJo-LAHFNfa0p0oMQqmwlBEAZMOeo03azXgrKLTT/include/freetype/freetype.h
# (r4: the one-element lists are written {"true"}, as zig fmt writes them: the lint step runs `zig fmt --check build.zig`.)
# build.zig asks git (describe, show, rev-parse, diff) for the version text and panics in a release
# build when git fails: the source here is a tarball, not a checkout. The same answers, fixed: the
# pinned commit as the version, its date, no branch, no local changes. (Source edit: sed.)
# The dependency nightwatch asks git for the same in its build.zig (describe and diff): its copy in zig-pkg
# is a link into the package store, which is read-only, so it is copied first and the same sed runs on it.
# r4: all of zig-pkg's links are copied, not only nightwatch: a build step runs a generator it compiled
# (uucode_generate) from inside zig-pkg/uucode-*, by a path through ../.. to the cache, and ../.. from
# the store is elsewhere (FileNotFound; dkconsole has the same loop).
for p in zig-pkg/*; do
    [ -L "$p" ] || continue
    t=$(readlink -f "$p"); rm "$p"; cp -a "$t" "$p"; chmod -R u+w "$p"
done
sed -i \
  -e 's|{ "git", "describe", "--always", "--tags" }|{ "echo", "0.7.2-5514cb7" }|' \
  -e 's|{ "git", "show", "-s", "--format=%ci", "HEAD" }|{ "echo", "2026-11-14" }|' \
  -e 's|{ "git", "rev-parse", "--abbrev-ref", "HEAD" }|{"true"}|' \
  -e 's|{ "git", "diff", "--stat", "--patch", "HEAD" }|{"true"}|' build.zig zig-pkg/nightwatch-*/build.zig
test "$(grep -c '"git", "describe", "--always", "--tags" }' build.zig zig-pkg/nightwatch-*/build.zig | grep -vc ':0$')" = 0
# r5: with -Dtarget=<linux> build.zig always builds a second program, flow-gui (the GUI window renderer), for x86_64-linux-GNU, which links
# glibc, X11, Wayland and GL as dynamic system libraries ("unable to find dynamic system library x11 ... searched paths: none"): the one
# failing step of 1304, while the terminal editor `flow` (musl) built. This recipe is the terminal build, so that gui entry of the target list
# is dropped (source edit: sed; the line is unique)
sed -i '/\.abi = \.gnu }, \.gui },/d' build.zig
! grep -q '\.abi = \.gnu }, \.gui }' build.zig
# not %zig_build: it passes -Dcpu=, which this build.zig refuses ("invalid option: cpu"; its target is the one option, -Dtarget).
# The explicit target is the baseline x86-64 CPU (a native default would tune the binary to the build machine).
DESTDIR="$pkgdir" zig build --release=safe --prefix /usr -Dtarget=x86_64-linux-musl --system zig-pkg -j$jobs
install -Dm644 help.md "$pkgdir/usr/share/doc/flow/help.md"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/flow/LICENSE"
'''
