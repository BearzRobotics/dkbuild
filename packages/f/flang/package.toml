# flang, LLVM's Fortran compiler (flang; its runtime is flang-rt). Standalone
# from the llvm-project source against the installed LLVM, MLIR and Clang;
# version locked to `llvm`. For scientific and numerical code (LAPACK, SciPy,
# R) without GCC.
name = "flang"
version = "23.1.5"
release = 1
summary = "LLVM Fortran compiler"
license = "Apache-2.0 WITH LLVM-exception"
homepage = "https://flang.llvm.org"
hostdeps = ["cmake", "ninja", "python", "llvm", "llvm-clang", "mlir"]
builddeps = ["llvm-devel", "llvm-libcxx-devel", "mlir-devel", "zlib-ng-compat-devel", "zstd-devel"]
rundeps = ["flang-rt", "llvm-clang"]
options = ["!check", "jobs:10"]

source = [
    { url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.5/llvm-project-23.1.5.src.tar.xz", sha256 = "fb50b1eac93ddeb3aa8dab4cfe324dff74f4a9c2bdee6160c9e36188f8d06a6e" },
]

setup = '''
cmake -S flang -B build -G Ninja -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_BUILD_TYPE=Release -DLLVM_DIR=/usr/lib/cmake/llvm \
    -DMLIR_DIR=/usr/lib/cmake/mlir -DClang_DIR=/usr/lib/cmake/clang \
    -DLLVM_TABLEGEN_EXE=/usr/bin/llvm-tblgen -DMLIR_TABLEGEN_EXE=/usr/bin/mlir-tblgen \
    -DFLANG_INCLUDE_TESTS=OFF -DFLANG_INCLUDE_DOCS=OFF
'''
build = '''
nice -n 10 ninja -C build -j$jobs
'''
install = '''
DESTDIR=$pkgdir ninja -C build install
install -Dm644 LICENSE.TXT "$pkgdir/usr/share/licenses/flang/LICENSE.TXT"
'''
