name = "findutils"
version = "4.10.0"
release = 2
summary = "GNU find utilities"
license = "GPL-3.0-or-later"
homepage = "http://www.gnu.org/software/findutils"
patches = ["tests.patch"]
hostdeps = ["automake", "gettext-devel", "texinfo"]
checkdeps = ["musl-bsd-headers"]

source = [
    { url = "https://ftp.gnu.org/gnu/findutils/findutils-4.10.0.tar.xz", sha256 = "1387e0b67ff247d2abde998f90dfbf70c1491391a59ddfecb8ae698789f0a4f5" },
]

setup = '''
autoreconf -if -W none
%configure \
    --program-prefix=g
'''
build = '''
%make
'''
check = '''
%make check
'''
install = '''
%make_install
# we don't want this
rm -rf "$pkgdir/usr/bin/glocate"
rm -rf "$pkgdir/usr/bin/gupdatedb"
rm -rf "$pkgdir/usr/libexec"
rm -rf "$pkgdir/usr/share/man/man1/glocate.1"
rm -rf "$pkgdir/usr/share/man/man1/gupdatedb.1"
rm -rf "$pkgdir/usr/share/man/man5"
'''
