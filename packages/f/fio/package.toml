# fio: flexible I/O tester. From Chimera's main/fio, with this tree's names.
# Libraries: libaio, libnuma and zlib are linked (fio's configure finds them);
# the other optional back ends (rdma, pmem, gfapi, libnbd, libzbc) have no
# library in this tree.
# Source edit: patches/falloc.patch adds #include <linux/falloc.h> to
# oslib/linux-blkzoned.c: musl's <fcntl.h> lacks FALLOC_FL_ZERO_RANGE, which
# the zoned-block code uses.
# ./configure gets --disable-native: it stops fio adding -march=native, so the
# binary runs on any CPU of the architecture.
name = "fio"
version = "3.43"
release = 1
summary = "Flexible I/O tester"
license = "GPL-2.0-only"
homepage = "https://github.com/axboe/fio"
patches = ["falloc.patch"]
hostdeps = ["pkgconf"]
builddeps = ["libaio-devel", "linux-headers", "numactl-devel", "zlib-ng-compat-devel"]

source = [
    { url = "https://github.com/axboe/fio/archive/refs/tags/fio-3.43.tar.gz", sha256 = "efa49b3f36eda9adf29294f27a87d7e457747d676cd0f73996d6365357832cfe" },
]

setup = '''
./configure \
    --disable-native \
    --prefix=/usr
'''
build = '''
%make
'''
check = '''
%make test
'''
install = '''
%make_install \
    mandir=/usr/share/man
install -Dm644 COPYING "$pkgdir/usr/share/licenses/fio/COPYING"
'''
