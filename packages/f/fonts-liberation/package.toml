name = "fonts-liberation"
version = "2.1.5"
release = 5
summary = "Liberation family of fonts"
license = "OFL-1.1"
homepage = "https://github.com/liberationfonts/liberation-fonts"
patches = ["0001-add-otf-generation.patch"]
hostdeps = ["fontforge-cli", "python-fonttools"]
rundeps = ["mkfontscale"]
options = ["!check"]

source = [
    { url = "https://github.com/liberationfonts/liberation-fonts/archive/2.1.5.tar.gz", sha256 = "9a823ccb33c8a8a865e84b982bcdc44d03ba4914adb91e6000df035dc0e55936" },
]

build = '''
make versionupdate
%make \
    PREFIX=/usr
'''
install = '''
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/fonts-liberation/LICENSE"
install -d "$pkgdir/usr/share/fonts/liberation" "$pkgdir/usr/share/fontconfig/conf.avail"
install -m644 liberation-fonts-otf-*/*.otf liberation-fonts-ttf-*/*.ttf "$pkgdir/usr/share/fonts/liberation/" 2>/dev/null || install -m644 */*.ttf "$pkgdir/usr/share/fonts/liberation/"
for f in $pkgfiles/*.conf; do install -m644 "$f" "$pkgdir/usr/share/fontconfig/conf.avail/"; done
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/fonts-liberation/LICENSE"
'''
