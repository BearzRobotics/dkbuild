# Imported from Chimera Linux cports: main/firmware-linux/template.py
# cports is BSD-2-Clause, Copyright (c) Chimera Linux contributors.
# Firmware for the kernel, split as Chimera splits it: one package per vendor or
# device family (firmware-linux-amdgpu, -iwlwifi, ...), so a system gets only
# what it needs. Each is pulled in automatically (install_if) when its group is
# installed: firmware-linux-gpu, -network, -audio, -storage, -misc, -soc; and
# firmware-linux-meta brings in every group. The table of 127 packages
# and their paths is generated from Chimera's. Files are zstd-compressed (the
# kernel reads .zst firmware) and not deduplicated (that needs rdfind).
name = "firmware-linux"
version = "20261019"
release = 1
summary = "Binary firmware blobs for the Linux kernel"
license = "custom:linux-firmware"
homepage = "https://www.kernel.org"
hostdeps = ["zstd", "python"]
options = ["!check", "!strip"]

source = [
    { url = "https://gitlab.com/kernel-firmware/linux-firmware/-/archive/20261019.tar.gz", sha256 = "abf515553e6525c0314398e40d329c9b199ae614c17cb97b02536db3ca6be07a" },
]

install = '''
fw="$pkgdir/usr/lib/firmware"
mkdir -p "$fw"
ZSTD_CLEVEL=9 ZSTD_NBTHREADS=4 ./copy-firmware.sh --zstd -v "$fw"
install -Dm644 WHENCE "$pkgdir/usr/share/licenses/firmware-linux/WHENCE"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/firmware-linux/LICENSE"
for lc in LICENSES/LICEN*; do [ -f "$lc" ] && install -Dm644 "$lc" "$pkgdir/usr/share/licenses/firmware-linux/${lc##*/}"; done
# as Chimera: deprecated, never-mainline and other-architecture firmware
for x in av7110 cis dabusb dsp56k imx mwlwifi ositech r128 sb16 sxg ti-keystone \
         'r8a779x_usb3_v1.dlmem*' 'r8a779x_usb3_v2.dlmem*' 'r8a779x_usb3_v3.dlmem*' \
         'ti/vpdma-1b8.bin*' 'usbdux_firmware.bin*' 'usbduxfast_firmware.bin*' 'usbduxsigma_firmware.bin*'; do
    rm -rf "$fw"/$x
done
# NVIDIA GSP-only directories are links to an older one; make them directories
# with a gsp link inside, so each belongs to one package (as Chimera does).
for f in "$fw"/nvidia/ad* "$fw"/nvidia/gb*; do
    [ -L "$f" ] || continue
    bp=$(readlink "$f"); rm "$f"; mkdir -m755 "$f"; ln -s "../$bp/gsp" "$f/gsp"
done
'''

