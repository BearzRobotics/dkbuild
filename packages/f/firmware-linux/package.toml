paths = ["/usr/lib/firmware/ti_*.fw*"]
install_if = ["firmware-linux-misc"]

[subpackages.ti-tas]
summary = "Firmware for Texas Instruments amplifiers"
paths = ["/usr/lib/firmware/INT88*", "/usr/lib/firmware/TAS2*", "/usr/lib/firmware/TIAS2*", "/usr/lib/firmware/TXNW*", "/usr/lib/firmware/tas25*", "/usr/lib/firmware/ti/audio/tas*", "/usr/lib/firmware/ti/pcm6240", "/usr/lib/firmware/*-*-0x*.bin*"]
install_if = ["firmware-linux-audio"]

[subpackages.tigon]
summary = "Firmware for Tigon I/II/III Ethernet"
paths = ["/usr/lib/firmware/tigon"]
install_if = ["firmware-linux-network"]

[subpackages.tsse]
summary = "Firmware for Mont-TSSE crypto algorithm accelerator"
paths = ["/usr/lib/firmware/tsse_firmware.bin*"]
install_if = ["firmware-linux-misc"]

[subpackages.typhoon]
summary = "Firmware for 3Com Typhoon Ethernet"
paths = ["/usr/lib/firmware/3com"]
install_if = ["firmware-linux-network"]

[subpackages.ueagle-atm]
summary = "Firmware for Eagle USB modems"
paths = ["/usr/lib/firmware/ueagle-atm"]
install_if = ["firmware-linux-network"]

[subpackages.vntwusb]
summary = "Firmware for Via VNT6656 USB WLAN"
paths = ["/usr/lib/firmware/vntwusb.fw*"]
install_if = ["firmware-linux-network"]

[subpackages.vsc85xx]
summary = "Firmware for Microchip VSX85xx Ethernet PHYs"
paths = ["/usr/lib/firmware/microchip/mscc_vsc85*.bin*"]
install_if = ["firmware-linux-network"]

[subpackages.vxge]
summary = "Firmware for Exar X3100 10Gb Ethernet"
paths = ["/usr/lib/firmware/vxge"]
install_if = ["firmware-linux-network"]

[subpackages.wave521c]
summary = "Firmware for WAVE521C encoder IP"
paths = ["/usr/lib/firmware/cnm/wave521c*"]
install_if = ["firmware-linux-misc"]

[subpackages.wave633c]
summary = "Firmware for WAVE633C codec IP"
paths = ["/usr/lib/firmware/cnm/wave633c*"]
install_if = ["firmware-linux-misc"]

[subpackages.whiteheat]
summary = "Firmware for WhiteHEAT USB-Serial"
paths = ["/usr/lib/firmware/whiteheat*"]
install_if = ["firmware-linux-misc"]

[subpackages.wil6210]
summary = "Firmware for Qualcomm wil6210 60GHz WLAN"
paths = ["/usr/lib/firmware/wil6210*"]
install_if = ["firmware-linux-network"]

[subpackages.wfx]
summary = "Firmware for Silicon Laboratories WFx WLAN"
paths = ["/usr/lib/firmware/wfx"]
install_if = ["firmware-linux-network"]

[subpackages.yamaha]
summary = "Firmware for Yamaha audio drivers"
paths = ["/usr/lib/firmware/yamaha"]
install_if = ["firmware-linux-audio"]
