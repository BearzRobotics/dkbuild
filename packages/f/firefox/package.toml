name = "firefox"
version = "161.0"
release = 1
summary = "Mozilla Firefox web browser"
license = "GPL-3.0-only AND LGPL-2.1-only AND LGPL-3.0-only AND MPL-2.0"
homepage = "https://www.mozilla.org/firefox"
patches = ["atoi.patch", "clang-ias.patch", "clang-memory-throw-gcc.patch", "depflags.patch", "enable-elfhack-relr.patch", "fix-fortify-system-wrappers.patch", "fix-rust-target.patch", "fix-webrtc-pid_t.patch", "google-sucks.patch", "lfs64.patch", "libcxx18.patch", "loong0001-Enable-WebRTC-for-loongarch64.patch", "loong0003-Define-HWCAP_LOONGARCH_LSX_and_LASX.patch", "loong0004-Fix-ycbcr-chromium_types-warning.patch", "musl-prctl.patch", "no-ccache-stats.patch", "ppc64-webrtc.patch", "riscv64-no-llama-simd.patch", "riscv64-reduce-debug.patch", "sandbox-sched_setscheduler.patch", "sqlite-ppc.patch", "use-gtar.patch", "wasip1.patch", "wasm2c-various-archs.patch", "x11lol.patch", "x86_64-Fix-stack-alignment-in-breakpad_getcontext.S.patch", "xptcall-integrated-as.patch"]
hostdeps = ["automake", "rust", "cbindgen", "llvm-devel", "llvm-clang", "llvm-lld", "dbus", "gettext", "tar", "libtool", "nasm", "nodejs", "pkgconf", "python", "zip", "unzip"]
builddeps = ["alsa-lib-devel", "dbus-devel", "ffmpeg-devel", "freetype-devel", "glib-devel", "gtk+3-devel", "icu-devel", "libevent-devel", "libffi-devel", "libjpeg-turbo-devel", "libnotify-devel", "libogg-devel", "libpng-devel", "libpulse-devel", "libtheora-devel", "libvorbis-devel", "libvpx-devel", "libwebp-devel", "libxcomposite-devel", "libxscrnsaver-devel", "libxt-devel", "mesa-devel", "nspr-devel", "nss-devel", "pipewire-devel", "pixman-devel", "zlib-ng-compat-devel"]
rundeps = ["ffmpeg", "openh264", "speechd"]
options = ["jobs:12", "!cross", "!check"]

source = [
    { url = "https://ftp.mozilla.org/pub/firefox/releases/161.0/source/firefox-161.0.source.tar.xz", sha256 = "c649de11e4dc6266bc905ce4b33eb8672a1947c2e210ec53dce285cb86296a5a" },
]
environment = '''
# Firefox's libraries are in /usr/lib/firefox, which is not on the loader's search path, and libxul.so needs libmozsandbox.so from there.
# Firefox loads its libraries by full path first, and on musl that evidently does not satisfy it: 159.0 stopped with "Couldn't load XPCOM"
# (2026-11-26). So every binary gets the directory as its run path. Tested by adding it to 159.0's binaries with patchelf.
export LDFLAGS="$LDFLAGS -Wl,-rpath,/usr/lib/firefox"
export MOZBUILD_STATE_PATH="$PWD/.mozbuild" MOZ_MAKE_FLAGS="-j$jobs" AS="$CC"
export CARGO_HOME=/tmp/cargo-home CARGO_NET_OFFLINE=true
export RUST_TARGET=x86_64-unknown-linux-musl RUSTFLAGS="-C target-feature=-crt-static"
# r2/r3: the Rust build scripts (bindgen's, for gecko-profiler, ohttp, ...) are linked static on musl, and then bindgen cannot dlopen
# libclang ("Dynamic loading not supported"). Mozilla gives host edges none of RUSTFLAGS (rust_commands.py: only the target ones), and
# its `extra_rustflags` variable had no effect here (the build scripts were still static-pie). So every rustc call goes through a
# wrapper that adds -crt-static (cargo runs RUSTC_WRAPPER in front of rustc; Mozilla passes the environment's through).
export RUSTC_WRAPPER=/tmp/rustc-dynamic
# r10: build scripts that compile C++ (webrender's glsl-to-cxx, through the `cc` crate) link `-lstdc++` by default; this system has libc++.
export CXXSTDLIB=c++
export MACH_BUILD_PYTHON_NATIVE_PACKAGE_SOURCE=system MOZ_NOSPAM=1
'''
setup = '''
# 161.0: no bindgen patch any more. 159.0 needed files/bindgen-template-union.patch (bindgen's PR 3536) on the vendored bindgen 0.73.1,
# which panicked ("Not an item: ItemId(N)") on libc++ 23's std::aligned_union; the bindgen vendored in 161.0, still numbered 0.73.1,
# already has both changes, so the patch no longer applied (the `bindgen` package keeps its own copy of the fix).
printf '#!/bin/sh\nexec "$@" -C target-feature=-crt-static\n' > /tmp/rustc-dynamic; chmod 755 /tmp/rustc-dynamic
# Chimera's breakpad header (musl has no stab.h).
cp $pkgfiles/stab.h toolkit/crashreporter/google-breakpad/src/
# No WASI toolchain yet: the RLBox-sandboxed libraries (graphite, ogg, expat,
# woff2, ...) are built in, not sandboxed in WebAssembly. No JACK (PipeWire's
# JACK library is not built yet).
./mach configure --enable-application=browser --prefix=/usr --libdir=/usr/lib \
    --host=$target --target=$target \
    --disable-bootstrap \
    --disable-install-strip --disable-strip \
    --enable-linker=lld --enable-optimize --enable-release \
    --with-system-ffi --with-system-icu --with-system-jpeg --with-system-libevent \
    --with-system-libvpx --with-system-nspr --with-system-nss --with-system-pixman \
    --with-system-webp --with-system-zlib --without-system-png \
    --enable-audio-backends=pulseaudio --enable-pulseaudio --disable-alsa --disable-jack \
    --enable-dbus --enable-default-toolkit=cairo-gtk3-wayland --enable-necko-wifi \
    --disable-jemalloc --disable-profiling --disable-tests --disable-updater \
    --without-wasm-sandboxed-libraries \
    --allow-addon-sideload --enable-official-branding \
    --with-distribution-id=org.fenriros
'''
build = '''
./mach build --priority normal
'''
install = '''
DESTDIR="$pkgdir" ./mach install
install -Dm644 $pkgfiles/vendor.js "$pkgdir/usr/lib/firefox/browser/defaults/preferences/vendor.js"
install -Dm644 $pkgfiles/distribution.ini "$pkgdir/usr/lib/firefox/distribution/distribution.ini"
install -Dm644 $pkgfiles/firefox.desktop "$pkgdir/usr/share/applications/firefox.desktop"
for sz in 16 22 24 32 48 128 256; do
    install -Dm644 browser/branding/official/default$sz.png "$pkgdir/usr/share/icons/hicolor/${sz}x$sz/apps/firefox.png"
done
rm -f "$pkgdir/usr/lib/firefox/firefox-bin"
ln -s firefox "$pkgdir/usr/lib/firefox/firefox-bin"
'''
