source = [
    { url = "https://ftp.mozilla.org/pub/firefox/releases/159.0/source/firefox-159.0.source.tar.xz", sha256 = "3d98df785894057fce60603e845828e758a5411ad79aaaaff2b8230597f500d9" },
    { url = "https://static.crates.io/crates/bindgen/bindgen-0.73.2.crate", sha256 = "787ef8ef523575546b106a58213d6e6b06198a05c2f757258c68a74273670cfa", unpack = false },
]
environment = '''
export MOZBUILD_STATE_PATH="$PWD/.mozbuild" MOZ_MAKE_FLAGS="-j$jobs" AS="$CC"
export CARGO_HOME=/tmp/cargo-home CARGO_NET_OFFLINE=true
export RUST_TARGET=x86_64-unknown-linux-musl RUSTFLAGS="-C target-feature=-crt-static"
# r2/r3: the Rust build scripts (bindgen's, for gecko-profiler, ohttp, ...) are linked static on musl, and then bindgen cannot dlopen
# libclang ("Dynamic loading not supported"). Mozilla gives host edges none of RUSTFLAGS (rust_commands.py: only the target ones), and
# its `extra_rustflags` variable had no effect here (the build scripts were still static-pie). So every rustc call goes through a
# wrapper that adds -crt-static (cargo runs RUSTC_WRAPPER in front of rustc; Mozilla passes the environment's through).
export RUSTC_WRAPPER=/tmp/rustc-dynamic
export MACH_BUILD_PYTHON_NATIVE_PACKAGE_SOURCE=system MOZ_NOSPAM=1
'''
setup = '''
# r4: the vendored bindgen 0.73.1 panics on this tree's LLVM 23 headers ("Not an item: ItemId(43962)" in Type::layout while generating the
# gecko-profiler bindings; found by running its build script by hand). 0.73.2 is the release that fixes bitfield and alignment layout regressions
# of 0.72/0.73. Source edit: third_party/rust/bindgen is replaced by the 0.73.2 crate (same dependencies), Cargo.lock names that version and its
# checksum, and the vendored directory's .cargo-checksum.json holds the package checksum (an empty file list: cargo checks only that).
rm -rf third_party/rust/bindgen
mkdir third_party/rust/bindgen
tar -xzf /build/sources/bindgen-0.73.2.crate -C third_party/rust/bindgen --strip-components=1 --no-same-owner
printf '{"files":{},"package":"787ef8ef523575546b106a58213d6e6b06198a05c2f757258c68a74273670cfa"}' > third_party/rust/bindgen/.cargo-checksum.json
python3 - <<'PY'
import re
s = open("Cargo.lock").read()
m = re.search(r'name = "bindgen"\nversion = "0\.73\.1"\nsource = "[^"]*"\nchecksum = "([0-9a-f]{64})"', s)
assert m, "bindgen 0.73.1 entry not found in Cargo.lock"
blk = m.group(0)
s = s.replace(blk, blk.replace('version = "0.73.1"', 'version = "0.73.2"').replace(m.group(1), "787ef8ef523575546b106a58213d6e6b06198a05c2f757258c68a74273670cfa"))
s = s.replace('"bindgen 0.73.1"', '"bindgen 0.73.2"')
open("Cargo.lock", "w").write(s)
PY
grep -n 'bindgen 0.73' Cargo.lock | head -3
printf '#!/bin/sh\nexec "$@" -C target-feature=-crt-static\n' > /tmp/rustc-dynamic; chmod 755 /tmp/rustc-dynamic
# Chimera's breakpad header (musl has no stab.h).
cp $pkgfiles/stab.h toolkit/crashreporter/google-breakpad/src/
# No WASI toolchain yet: the RLBox-sandboxed libraries (graphite, ogg, expat,
# woff2, ...) are built in, not sandboxed in WebAssembly. No JACK (PipeWire's
# JACK library is not built yet).
./mach configure --enable-application=browser --prefix=/usr --libdir=/usr/lib \
    --host=$target --target=$target \
    --disable-bootstrap \
    --disable-install-strip --disable-strip \
    --enable-linker=lld --enable-optimize --enable-release \
    --disable-hardening \
    --with-system-ffi --with-system-icu --with-system-jpeg --with-system-libevent \
    --with-system-libvpx --with-system-nspr --with-system-nss --with-system-pixman \
    --with-system-webp --with-system-zlib --without-system-png \
    --enable-audio-backends=pulseaudio --enable-pulseaudio --disable-alsa --disable-jack \
    --enable-dbus --enable-default-toolkit=cairo-gtk3-wayland --enable-necko-wifi \
    --disable-jemalloc --disable-profiling --disable-tests --disable-updater \
    --without-wasm-sandboxed-libraries \
    --allow-addon-sideload --enable-official-branding \
    --with-distribution-id=org.fenriros
'''
build = '''
./mach build --priority normal
'''
install = '''
DESTDIR="$pkgdir" ./mach install
install -Dm644 $pkgfiles/vendor.js "$pkgdir/usr/lib/firefox/browser/defaults/preferences/vendor.js"
install -Dm644 $pkgfiles/distribution.ini "$pkgdir/usr/lib/firefox/distribution/distribution.ini"
install -Dm644 $pkgfiles/firefox.desktop "$pkgdir/usr/share/applications/firefox.desktop"
for sz in 16 22 24 32 48 128 256; do
    install -Dm644 browser/branding/official/default$sz.png "$pkgdir/usr/share/icons/hicolor/${sz}x$sz/apps/firefox.png"
done
rm -f "$pkgdir/usr/lib/firefox/firefox-bin"
ln -s firefox "$pkgdir/usr/lib/firefox/firefox-bin"
'''
