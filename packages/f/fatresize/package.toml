# Written for this tree (cports has no fatresize). Untested.
# Needed by dkde-parted: fatresize (grow and shrink FAT32). Built on libparted from the parted package.
# Upstream is ya-mouse/fatresize (the Debian/Fedora source); its tarball ships a generated configure.
name = "fatresize"
version = "1.1.0"
release = 1
summary = "Resize FAT filesystems using libparted"
license = "GPL-3.0-or-later"
homepage = "https://github.com/ya-mouse/fatresize"
hostdeps = ["pkgconf"]
builddeps = ["linux-headers", "parted-devel", "util-linux-devel"]
options = ["!check"]

source = [
    { url = "https://github.com/ya-mouse/fatresize/archive/refs/tags/v1.1.0.tar.gz", sha256 = "9232bc354b6c49a9e695e071bfd2d62ec79cdf4bc84928fcf1967fa39b75c33e" },
]

setup = '''
%configure
'''
build = '''
%make
'''
install = '''
%make_install
'''
