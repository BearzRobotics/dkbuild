# After Chimera Linux cports: main/flac. cports is BSD-2-Clause, Copyright (c) Chimera Linux contributors.
# needed by: libsndfile, sox_ng.
name = "flac"
version = "1.5.0"
release = 1
summary = "Free Lossless Audio Codec"
license = "BSD-3-Clause AND GPL-2.0-or-later"
homepage = "https://xiph.org/flac"
hostdeps = ["pkgconf", "nasm"]
builddeps = ["libogg-devel"]
options = ["!check"]

source = [
    { url = "https://downloads.xiph.org/releases/flac/flac-1.5.0.tar.xz", sha256 = "f2c1c76592a82ffff8413ba3c4a1299b6c7ab06c734dee03fd88630485c2b920" },
]

setup = '''
%configure \
    --disable-rpath \
    --disable-doxygen-docs \
    --disable-thorough-tests
'''
build = '''
%make
'''
install = '''
%make_install
install -Dm644 COPYING.Xiph "$pkgdir/usr/share/licenses/flac/COPYING.Xiph"
'''
