# BookStack: a wiki for documentation organised as shelves, books, chapters
# and pages (WYSIWYG and Markdown editors, diagrams.net drawings, revisions,
# search, roles, LDAP/SAML/OIDC, exports to PDF/HTML). Laravel on PHP with
# MariaDB or MySQL, served by nginx and php-fpm.
# Built from source: the 113 Composer packages composer.lock pins are the
# recipe's sources (archives of the locked commits; ssddanbrown/htmldiff from
# Codeberg, named by its locked reference), and composer.lock is pointed at
# them (files/composer-local.py), so composer installs offline. The compiled
# CSS/JS is in the release tag (public/dist). Development now happens on
# Codeberg (codeberg.org/bookstack/bookstack); the GitHub tag is the same commit.
# Layout: code in /usr/share/bookstack; .env is /etc/bookstack/env;
# storage/, bootstrap/cache, public/uploads and themes/ in /var/lib/bookstack.
# Scheduled tasks from an example cron job (installed by the user).
# Setup: /usr/share/doc/bookstack/README.FenrirOS.
# To update: regenerate the sources from the new composer.lock (each
# dist.reference archive's sha256).
# Installed inert (docs/requests.md): no service enabled, no site, no cron
# job, no credentials; the README says how to set it up.
name = "bookstack"
version = "26.09.3"
release = 1
summary = "Wiki for organising and storing documentation"
license = "MIT"
homepage = "https://www.bookstackapp.com"
archs = ["x86_64", "aarch64"]
hostdeps = ["php", "composer", "unzip", "python"]
rundeps = ["php", "php-fpm", "nginx"]
options = ["!check", "!strip"]

