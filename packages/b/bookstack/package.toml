environment = '''
export COMPOSER_HOME=/tmp/composer COMPOSER_CACHE_DIR=/tmp/composer-cache COMPOSER_DISABLE_NETWORK=1 \
    COMPOSER_NO_INTERACTION=1 COMPOSER_ALLOW_SUPERUSER=1
'''
build = '''
python3 $pkgfiles/composer-local.py composer.lock /build/sources
# extensions are checked at run time (they are part of the php package); the
# scripts (artisan cache clearing, package discovery) run on the first request
composer install --no-dev --no-scripts --prefer-dist --optimize-autoloader --ignore-platform-reqs
test -f vendor/autoload.php
'''
install = '''
d="$pkgdir/usr/share/bookstack"
mkdir -p "$d"
cp -a app artisan bootstrap database lang public resources routes storage themes vendor version \
    composer.json composer.lock .env.example .env.example.complete "$d/"
# the writable directories: skeletons copied to /var/lib/bookstack when missing
mv "$d/storage" "$d/storage.dist"
mv "$d/public/uploads" "$d/public-uploads.dist"
mv "$d/themes" "$d/themes.dist"
rm -rf "$d/bootstrap/cache"
ln -s /var/lib/bookstack/storage "$d/storage"
ln -s /var/lib/bookstack/public-uploads "$d/public/uploads"
ln -s /var/lib/bookstack/themes "$d/themes"
ln -s /var/lib/bookstack/bootstrap-cache "$d/bootstrap/cache"
ln -s /etc/bookstack/env "$d/.env"
install -Dm644 $pkgfiles/tmpfiles.conf "$pkgdir/usr/lib/tmpfiles.d/bookstack.conf"
install -Dm644 $pkgfiles/bookstack.cron "$pkgdir/usr/share/doc/bookstack/bookstack.cron"
install -Dm644 $pkgfiles/nginx-bookstack.conf "$pkgdir/usr/share/doc/bookstack/nginx-bookstack.conf"
install -Dm644 $pkgfiles/php-fpm-bookstack.conf "$pkgdir/usr/share/doc/bookstack/php-fpm-bookstack.conf"
install -Dm644 $pkgfiles/README.FenrirOS "$pkgdir/usr/share/doc/bookstack/README.FenrirOS"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/bookstack/LICENSE"
'''
