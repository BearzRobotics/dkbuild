name = "boost"
version = "1.91.0"
release = 4
summary = "Free peer-reviewed portable C++ source libraries"
license = "BSL-1.0"
homepage = "https://boost.org"
patches = ["0001-revert-cease-dependence-on-range.patch", "708353cdeb6006757e7c6971283efb53f718ae25.patch", "boost-1.57.0-python-abi_letters.patch", "boost-1.57.0-python-libpython_dep.patch", "fix-x86-build.patch", "install-strip-destdir.patch", "loongarch-clang-context.patch", "python-3.11.patch", "safe-numeric-no-example.patch", "skip-toolset-test.patch", "toolset-default-clang.patch"]
hostdeps = ["pkgconf", "python"]
builddeps = ["bzip2-devel", "icu-devel", "linux-headers", "python-devel", "xz-devel", "zlib-ng-compat-devel", "zstd-devel"]

options = ["!check"]

source = [
    { url = "https://archives.boost.io/release/1.91.0/source/boost_1_91_0.tar.gz", sha256 = "5734305f40a76c30f951c9abd409a45a2a19fb546efe4162119250bbe4d3a463" },
]
build = '''
b2() {
    ./b2 -j$jobs --user-config="$PWD/user-config.jam" --prefix="$pkgdir/usr" release \
        python="$pyver" architecture=x86 address-model=64 abi=sysv toolset=clang \
        cxxflags="$CXXFLAGS" linkflags="$LDFLAGS" threading=multi debug-symbols=off \
        runtime-link=shared link=shared,static --layout=system "$@"
}
pyver=$(python3 -c 'import sys; print("%d.%d" % sys.version_info[:2])')
B2_DONT_EMBED_MANIFEST=1 ./bootstrap.sh --prefix="$pkgdir/usr" --with-python=/usr/bin/python3 --with-python-root=/usr
cat > user-config.jam <<JAM
using clang : : $CXX : <cxxflags>"$CXXFLAGS" <linkflags>"$LDFLAGS" <warnings-as-errors>"off" ;
using python : $pyver : /usr/bin/python3 : /usr/include/python$pyver : /usr/lib/python$pyver ;
JAM
b2
'''
install = '''
b2() {
    ./b2 -j$jobs --user-config="$PWD/user-config.jam" --prefix="$pkgdir/usr" release \
        python="$pyver" architecture=x86 address-model=64 abi=sysv toolset=clang \
        cxxflags="$CXXFLAGS" linkflags="$LDFLAGS" threading=multi debug-symbols=off \
        runtime-link=shared link=shared,static --layout=system "$@"
}
pyver=$(python3 -c 'import sys; print("%d.%d" % sys.version_info[:2])')
install -Dm755 tools/build/src/engine/b2 "$pkgdir/usr/bin/b2"
b2 install
mkdir -p "$pkgdir/usr/share/b2"
cp -r tools/build/. "$pkgdir/usr/share/b2/"
find "$pkgdir/usr/share/b2" -name '*.orig' -delete
rm -f "$pkgdir/usr/share/b2/src/engine/b2"
mkdir -p "$pkgdir/etc"
printf '# System-wide configuration file for Boost.Build.\nusing clang ;\n' > "$pkgdir/etc/site-config.jam"
install -Dm644 LICENSE_1_0.txt "$pkgdir/usr/share/licenses/boost/LICENSE_1_0.txt"
'''

[subpackages.build]
summary = "Boost.Build framework"
paths   = ["/usr/bin/b2", "/etc/site-config.jam", "/usr/share/b2"]
depends = ["boost"]
