# btrbk: backup tool for btrfs subvolumes (snapshots, send/receive, over ssh).
# From Chimera's main/btrbk, updated to 0.32.7. Chimera's two patches are not
# carried: fix_illegal_time_format.patch rewrote doc/Makefile's `date -d` into
# a BSD `date -j` call and fix_readlink_flags.patch forced readlink -f; both
# work around non-GNU userlands, while this tree's base is GNU coreutils (which
# is in hostdeps and rundeps so that date/readlink are the GNU ones).
# Man pages are generated by asciidoctor. The systemd units are removed
# (this tree uses dinit and no timer is enabled by a package).
name = "btrbk"
version = "0.32.7"
release = 1
summary = "Backup tool for btrfs subvolumes"
license = "GPL-3.0-or-later"
homepage = "https://digint.ch/btrbk"
hostdeps = ["asciidoctor", "coreutils"]
rundeps = ["perl", "btrfs-progs", "openssh", "mbuffer", "coreutils"]
options = ["!check"]

source = [
    { url = "https://digint.ch/download/btrbk/releases/btrbk-0.32.7.tar.xz", sha256 = "7f53cf55a007570c9de5a1c4f946ca7372fad5e057c8b1c9d7afc2176cc32cd3" },
]

build = '''
%make \
    PREFIX=/usr
'''
install = '''
%make_install \
    PREFIX=/usr
rm -rf "$pkgdir/usr/lib/systemd"
install -Dm644 COPYING "$pkgdir/usr/share/licenses/btrbk/COPYING"
'''
