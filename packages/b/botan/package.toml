name = "botan"
version = "3.11.1"
release = 2
summary = "Crypto and TLS for C++"
license = "BSD-2-Clause"
homepage = "https://botan.randombit.net"
hostdeps = ["pkgconf", "python"]
builddeps = ["boost-devel", "bzip2-devel", "sqlite-devel", "xz-devel", "zlib-ng-compat-devel"]

source = [
    { url = "https://botan.randombit.net/releases/Botan-3.11.1.tar.xz", sha256 = "c1cd7152519f4188591fa4f6ddeb116bc1004491f5f3c58aa99b00582eb8a137" },
]

setup = '''
# libc++ 23 no longer brings in <algorithm> through other headers; botan's
# headers (secmem.h, buffer_stuffer.h and others, some installed) use
# std::copy, std::fill and the like without it, and std::terminate without
# <exception>: every file that does gets the header
add() {
    for h in $(grep -rlE "$2" src --include='*.h' --include='*.cpp' | xargs -r grep -L "#include <$1>"); do
        sed -i "0,/^#include/s//#include <$1>\\n#include/" "$h"
    done
}
add algorithm 'std::(copy|fill|min|max|equal|sort|find|reverse|rotate|transform|all_of|any_of|none_of|ranges::)\b'
add exception 'std::(terminate|exception_ptr|current_exception|rethrow_exception|uncaught_exceptions)\b'
grep -q '^#include <algorithm>' src/lib/base/secmem.h
grep -q '^#include <algorithm>' src/lib/utils/buffer_stuffer.h
grep -q '^#include <exception>' src/lib/utils/mem_pool/mem_pool.cpp
# its configure is a Python script
./configure.py \
    --prefix=/usr \
    --with-boost \
    --with-bzip2 \
    --with-lzma \
    --with-os-feature=getrandom \
    --with-sqlite3 \
    --with-zlib
'''
build = '''
%make
'''
check = '''
%make check
'''
install = '''
%make_install
install -Dm644 license.txt "$pkgdir/usr/share/licenses/botan/license.txt"
'''
