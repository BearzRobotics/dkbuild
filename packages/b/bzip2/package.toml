name = "bzip2"
version = "1.0.8"
release = 4
summary = "Freely available, patent free, high-quality data compressor"
license = "custom:bzip2"
homepage = "https://sourceware.org/bzip2"
patches = ["make.patch"]
hostdeps = ["pkgconf"]
options = ["bootstrap"]

source = [
    { url = "https://sourceware.org/pub/bzip2/bzip2-1.0.8.tar.gz", sha256 = "ab5a03176ee106d3f0fa90e381da478ddae405918153cca248e682cd0c4a2269" },
]

environment = '''
export CFLAGS="${CFLAGS} -fPIC"
'''
build = '''
# The shared build first: it produces the bzip2-shared program and libbz2.so.
make -j$jobs -f Makefile-libbz2_so CC="$CC" CFLAGS="$CFLAGS" LDFLAGS="$LDFLAGS"
make -j$jobs CC="$CC" AR=llvm-ar RANLIB=llvm-ranlib CFLAGS="$CFLAGS" LDFLAGS="$LDFLAGS" bzip2recover libbz2.a
'''
check = '''
make CC="$CC" check
'''
install = '''
cp bzip2-shared bzip2
install -Dm755 bzip2 "$pkgdir/usr/bin/bzip2"
install -Dm755 bzip2recover "$pkgdir/usr/bin/bzip2recover"
mkdir -p "$pkgdir/usr/bin"
ln -sf bzip2 "$pkgdir/usr/bin/bunzip2"
mkdir -p "$pkgdir/usr/bin"
ln -sf bzip2 "$pkgdir/usr/bin/bzcat"
install -Dm755 bzmore "$pkgdir/usr/bin/bzmore"
install -Dm755 libbz2.so.1.0.8 "$pkgdir/usr/lib/libbz2.so.1.0.8"
mkdir -p "$pkgdir/usr/lib"
ln -sf libbz2.so.1.0.8 "$pkgdir/usr/lib/libbz2.so"
mkdir -p "$pkgdir/usr/lib"
ln -sf libbz2.so.1.0.8 "$pkgdir/usr/lib/libbz2.so.1"
mkdir -p "$pkgdir/usr/lib"
ln -sf libbz2.so.1.0.8 "$pkgdir/usr/lib/libbz2.so.1.0"
install -Dm644 libbz2.a "$pkgdir/usr/lib/libbz2.a"
install -Dm644 bzlib.h "$pkgdir/usr/include/bzlib.h"
install -Dm644 $pkgfiles/bzip2.pc "$pkgdir/usr/lib/pkgconfig/bzip2.pc"
install -Dm644 bzip2.1 "$pkgdir/usr/share/man/man1/bzip2.1"
mkdir -p "$pkgdir/usr/share/man/man1"
ln -sf bzip2.1 "$pkgdir/usr/share/man/man1/bunzip2.1"
mkdir -p "$pkgdir/usr/share/man/man1"
ln -sf bzip2.1 "$pkgdir/usr/share/man/man1/bzcat.1"
mkdir -p "$pkgdir/usr/share/man/man1"
ln -sf bzip2.1 "$pkgdir/usr/share/man/man1/bzip2recover.1"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/bzip2/LICENSE"
'''
