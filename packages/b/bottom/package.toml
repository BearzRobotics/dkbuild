# bottom (btm): process and system monitor. Default features: battery,
# NVIDIA GPUs (NVML, opened at run time when present) and ZFS ARC stats.
# The man page and shell completions are generated by build.rs when
# BTM_GENERATE is set (the release tarballs of them are the same output).
# Crates vendored on the host.
name = "bottom"
version = "0.15.0"
release = 1
summary = "Process and system monitor (btm)"
license = "MIT"
homepage = "https://github.com/ClementTsang/bottom"
hostdeps = ["rust"]
options = ["!check", "cargodeps"]

source = [
    { url = "https://github.com/ClementTsang/bottom/archive/refs/tags/0.15.0.tar.gz", sha256 = "9b38fd551ef9e67bb8dc09a658e7c9594913fc5c43154f264d5b776416ad1c4d" },
]

environment = '''
export CARGO_HOME=/tmp/cargo-home CARGO_NET_OFFLINE=true
export BTM_GENERATE=1
'''
build = '''
cargo build --release --frozen --offline --locked -j $jobs
'''
install = '''
install -Dm755 target/release/btm "$pkgdir/usr/bin/btm"
g=target/tmp/bottom
install -Dm644 $g/manpage/btm.1 "$pkgdir/usr/share/man/man1/btm.1"
install -Dm644 $g/completion/btm.bash "$pkgdir/usr/share/bash-completion/completions/btm"
install -Dm644 $g/completion/_btm "$pkgdir/usr/share/zsh/site-functions/_btm"
install -Dm644 $g/completion/btm.fish "$pkgdir/usr/share/fish/vendor_completions.d/btm.fish"
install -Dm644 desktop/bottom.desktop "$pkgdir/usr/share/applications/bottom.desktop"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/bottom/LICENSE"
'''
