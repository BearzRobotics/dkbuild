# GNU binutils, beside LLVM's. LLVM provides the usual names (ld is ld.lld, ar
# is llvm-ar, ...), so these install as g<tool> (gas, gobjdump, ...) with
# ld.bfd under its own name: what GRUB links its firmware images with
# (clang -fuse-ld=bfd), and what anything wanting GNU's tools can call.
name = "binutils"
version = "2.45.1"
release = 1
summary = "GNU binutils (as g<tool>, and ld.bfd)"
license = "GPL-3.0-or-later"
homepage = "https://www.gnu.org/software/binutils"
hostdeps = ["flex-static", "bison", "flex", "texinfo"]
builddeps = ["zlib-ng-compat-devel", "zstd-devel"]
options = ["!check", "!lto"]

source = [
    { url = "https://ftp.gnu.org/gnu/binutils/binutils-2.45.1.tar.xz", sha256 = "5fe101e6fe9d18fdec95962d81ed670fdee5f37e3f48f0bef87bddf862513aa5" },
]

setup = '''
./configure --prefix=/usr --libdir=/usr/lib --mandir=/usr/share/man --infodir=/usr/share/info \
    --program-prefix=g --enable-targets=all --enable-64-bit-bfd --enable-deterministic-archives \
    --enable-plugins --disable-shared --disable-gold --disable-gprofng --disable-nls --disable-werror \
    --disable-gdb --disable-gdbserver --disable-sim --without-debuginfod --with-system-zlib --with-zstd
'''
build = '''
%make
'''
install = '''
%make_install
ln -s gld.bfd "$pkgdir/usr/bin/ld.bfd"
# not a library package; info pages under their own name
rm -rf "$pkgdir/usr/lib" "$pkgdir/usr/include" "$pkgdir/usr/x86_64-pc-linux-musl"
install -Dm644 COPYING3 "$pkgdir/usr/share/licenses/binutils/COPYING3"
'''
