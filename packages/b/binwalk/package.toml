hostdeps = ["rust", "pkgconf"]
builddeps = ["bzip2-devel", "fontconfig-devel", "xz-devel", "zlib-ng-compat-devel"]

options = ["!check", "cargodeps"]

source = [
    { url = "https://github.com/ReFirmLabs/binwalk/archive/refs/tags/v3.1.0.tar.gz", sha256 = "06f595719417b70a592580258ed980237892eadc198e02363201abe6ca59e49a" },
]

environment = '''
export CARGO_HOME=/tmp/cargo-home CARGO_NET_OFFLINE=true
'''
build = '''
cargo build --release --frozen --offline -j $jobs
'''
install = '''
install -Dm755 target/release/binwalk "$pkgdir/usr/bin/binwalk"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/binwalk/LICENSE"
'''
