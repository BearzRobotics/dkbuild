name = "bibletime"
version = "3.2.0"
release = 1
summary = "Bible study program (SWORD, Qt)"
license = "GPL-2.0-only"
homepage = "https://bibletime.info"
hostdeps = ["cmake", "ninja", "pkgconf", "qt6-qttools"]
builddeps = ["qt6-qtbase-devel", "qt6-qtdeclarative-devel", "qt6-qtsvg-devel", "qt6-qtspeech-devel", "sword-devel", "clucene-devel", "boost-devel"]
# !lto: lld crashes (segmentation fault) in the thin-LTO link of the executable, as it did for neovim and others
options = ["!check", "!lto"]

source = [
    { url = "https://github.com/bibletime/bibletime/archive/refs/tags/v3.2.0.tar.gz", sha256 = "0918ce1572d6a56392b19fb46e04512a79fdf4492d5731e2a942eb8fe426ef48" },
]

setup = '''
# cmake/BTApplication.cmake turns link-time optimisation on itself (set_target_properties INTERPROCEDURAL_OPTIMIZATION
# TRUE), whatever the recipe's !lto says: the link still had -flto=thin and crashed. (Source edit: sed.)
grep -q 'INTERPROCEDURAL_OPTIMIZATION TRUE' cmake/BTApplication.cmake
sed -i 's/INTERPROCEDURAL_OPTIMIZATION TRUE/INTERPROCEDURAL_OPTIMIZATION FALSE/' cmake/BTApplication.cmake
%cmake \
    -DBUILD_HANDBOOK_HTML=OFF \
    -DBUILD_HANDBOOK_PDF=OFF \
    -DBUILD_HOWTO_HTML=OFF \
    -DBUILD_HOWTO_PDF=OFF
'''
build = '''
%cmake_build
'''
install = '''
%cmake_install
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/bibletime/LICENSE"
'''
