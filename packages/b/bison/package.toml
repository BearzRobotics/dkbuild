# Reviewed by hand: cports passed --with-libtextstyle-prefix at its own destdir; pointed at nothing so bison never links libtextstyle.
# r3: static libraries too (in bison-static), for fully static programs on musl.
name = "bison"
version = "3.8.2"
release = 3
summary = "GNU yacc(1) replacement"
license = "GPL-3.0-or-later"
homepage = "http://www.gnu.org/software/bison"
hostdeps = ["automake", "gettext-devel", "m4", "perl", "texinfo"]
builddeps = ["gettext-devel"]
checkdeps = ["flex", "autoconf"]
rundeps = ["m4"]

source = [
    { url = "https://ftp.gnu.org/gnu/bison/bison-3.8.2.tar.xz", sha256 = "9bba0214ccf7f1079c5d59210045227bcf619519840ebfa80cd3849cff5a5bf2" },
]

setup = '''
autoreconf -if -W none
%configure \
    --disable-yacc \
    --with-libtextstyle-prefix=/nonexistent
'''
build = '''
%make
'''
check = '''
%make check -j1
'''
install = '''
%make_install
'''
