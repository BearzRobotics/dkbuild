# Bibata Modern Ice cursor theme (the ML4W autostart sets it with hyprctl setcursor). The
# prebuilt release tarball is used: building the cursors from source needs clickgen and
# its image toolchain (a Python and Cairo stack) for a theme that is only images.
name = "bibata-cursor-theme"
version = "2.0.7"
release = 1
summary = "Bibata Modern Ice cursor theme"
license = "GPL-3.0-only"
homepage = "https://github.com/ful1e5/Bibata_Cursor"
options = ["!check"]

source = [
    { url = "https://github.com/ful1e5/Bibata_Cursor/releases/download/v2.0.7/Bibata-Modern-Ice.tar.xz", sha256 = "a68cae60c4dc706350e194ebc91c5fe48bc7bc9d59e119555834a2a7ee5078ef" },
]

install = '''
mkdir -p "$pkgdir/usr/share/icons"
cp -a ../Bibata-Modern-Ice "$pkgdir/usr/share/icons/" 2>/dev/null || cp -a Bibata-Modern-Ice "$pkgdir/usr/share/icons/"
'''
