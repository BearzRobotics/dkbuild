# GNU binutils for RISC-V bare metal (riscv64-unknown-elf): riscv64-unknown-elf-as, -ld, -objcopy, ...
# Part of the riscv64-unknown-elf cross suite (binutils, gcc, C library), as Arch packages them.
name = "binutils-riscv64-unknown-elf"
version = "2.45.1"
release = 1
summary = "GNU binutils for RISC-V bare metal"
license = "GPL-3.0-or-later"
homepage = "https://www.gnu.org/software/binutils"
hostdeps = ["flex-static", "bison", "flex", "texinfo"]
builddeps = ["zlib-ng-compat-devel"]
options = ["!check", "!lto"]

source = [
    { url = "https://ftp.gnu.org/gnu/binutils/binutils-2.45.1.tar.xz", sha256 = "5fe101e6fe9d18fdec95962d81ed670fdee5f37e3f48f0bef87bddf862513aa5" },
]

setup = '''
./configure --target=riscv64-unknown-elf --with-sysroot=/usr/riscv64-unknown-elf --prefix=/usr --libdir=/usr/lib \
    --mandir=/usr/share/man --infodir=/usr/share/info \
    --without-debuginfod --with-system-zlib --with-pic \
    --disable-install-libbfd --disable-multilib --disable-werror --disable-shared \
    --disable-gold --disable-nls --disable-gdb --disable-gdbserver --disable-sim \
    --enable-deterministic-archives --enable-64-bit-bfd --enable-plugins
'''
build = '''
%make
'''
install = '''
%make_install
# the tools in /usr/riscv64-unknown-elf/bin are hard links to /usr/bin/riscv64-unknown-elf-*: make them links
for f in "$pkgdir"/usr/riscv64-unknown-elf/bin/*; do
    b=${f##*/}
    rm -f "$pkgdir/usr/bin/riscv64-unknown-elf-$b"
    ln -s ../riscv64-unknown-elf/bin/$b "$pkgdir/usr/bin/riscv64-unknown-elf-$b"
done
rm -f "$pkgdir/usr/riscv64-unknown-elf/bin/ld"; ln -s ld.bfd "$pkgdir/usr/riscv64-unknown-elf/bin/ld"
# not needed, and binutils proper owns the info pages
rm -rf "$pkgdir/usr/lib" "$pkgdir/usr/share/info"
install -Dm644 COPYING3 "$pkgdir/usr/share/licenses/binutils-riscv64-unknown-elf/COPYING3"
'''
