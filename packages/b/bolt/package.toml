name = "bolt"
version = "0.9.11"
release = 1
summary = "Thunderbolt device manager"
license = "LGPL-2.1-or-later"
homepage = "https://gitlab.freedesktop.org/bolt/bolt"
patches = ["dbus-activation.patch"]
hostdeps = ["asciidoc", "bash", "glib-devel", "libxml2", "meson", "pkgconf"]
builddeps = ["glib-devel", "polkit-devel", "eudev-devel"]
checkdeps = ["dbus"]
rundeps = ["dbus"]

source = [
    { url = "https://gitlab.freedesktop.org/bolt/bolt/-/archive/0.9.11/bolt-0.9.11.tar.gz", sha256 = "cde4fc6d4a188e37d088cf59a5b2d174ac4b03d57bf9d084d711ba92105c33c0" },
]

setup = '''
%meson \
    -Dman=true \
    -Dsystemd=false
'''
build = '''
%meson_build
'''
install = '''
%meson_install
install -Dm644 $pkgfiles/boltd "$pkgdir/etc/dinit.d/boltd"
'''
