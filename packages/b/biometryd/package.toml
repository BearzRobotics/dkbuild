hostdeps = ["cmake", "ninja", "pkgconf"]
builddeps = ["cmake-extras", "dbus-cpp-devel", "elfutils-devel", "gtest-devel", "libapparmor-devel", "nlohmann-json", "process-cpp-devel", "qt5-qtbase-devel", "qt5-qtdeclarative-devel"]
options = ["!check"]

source = [
    { url = "https://gitlab.com/ubports/development/core/biometryd/-/archive/0.4.1/biometryd-0.4.1.tar.gz", sha256 = "e0ff6a5ed63517592679520e8f30f94cff9d6b07b2acbf9ad94c01d4008df70c" },
]

setup = '''
%cmake \
    -DUSE_SYSTEMD=OFF \
