# cports is BSD-2-Clause, Copyright (c) Chimera Linux contributors.
name = "buildah"
version = "1.45.0"
release = 3
summary = "OCI image building tool"
license = "Apache-2.0"
homepage = "https://buildah.io"
patches = ["basename.patch"]
hostdeps = ["go", "pkgconf"]
builddeps = ["btrfs-progs-devel", "gpgme-devel", "libseccomp-devel", "linux-headers", "lvm2-devel", "sqlite-devel"]
rundeps = ["cni-plugins", "containers-common", "crun", "slirp4netns"]
options = ["!check", "godeps"]

source = [
    { url = "https://github.com/podman-container-tools/buildah/archive/refs/tags/v1.45.0.tar.gz", sha256 = "d2bc03332c9f6ad5fcc210c68ad3190fe11d358214c88fb12a233f5045d5eddd" },
]

environment = '''
export GOFLAGS="-mod=mod -trimpath -buildvcs=false" GOTOOLCHAIN=local GOPROXY=off
export GOCACHE=/tmp/go-cache GOPATH=/tmp/go CGO_ENABLED=1
'''
build = '''
mkdir -p build
go build -tags "libsqlite3 seccomp" -o build/ ./cmd/...
'''
install = '''
install -dm755 "$pkgdir/usr/bin"
install -m755 build/* "$pkgdir/usr/bin/"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/buildah/LICENSE"
'''
