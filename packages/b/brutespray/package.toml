# Brute-Forcing from Nmap output - Automatically attempts default creds on found services. (BlackArch list, requested 2026-11-16; docs/requests.md). Written from the template of ffuf; not built yet when written (wip/queue): expect first-build fixes.
# Go module, dependencies fetched on the host (godeps). Main package: ..
name = "brutespray"
version = "2.7.8"
release = 1
summary = "Brute-Forcing from Nmap output - Automatically attempts default creds on found services."
license = "MIT"
homepage = "https://github.com/x90skysn3k/brutespray"
hostdeps = ["go"]
options = ["!check", "godeps"]

source = [
    { url = "https://github.com/x90skysn3k/brutespray/archive/refs/tags/v2.7.8.tar.gz", sha256 = "aa65a26d3ee3822df467eaefeda953f708fc9fa58fcc6704e6ab41307580af46" },
]

environment = '''
export GOFLAGS="-mod=mod -trimpath -buildvcs=false" GOTOOLCHAIN=local GOPROXY=off
export GOCACHE=/tmp/go-cache GOPATH=/tmp/go CGO_ENABLED=0
'''
build = '''
mkdir -p build
go build -o build/brutespray .
'''
install = '''
install -Dm755 build/brutespray "$pkgdir/usr/bin/brutespray"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/brutespray/LICENSE"
'''
