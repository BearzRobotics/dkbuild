# needed by: hyprland.
name = "hyprcursor"
version = "0.1.13"
release = 2
summary = "The hyprland cursor format, library and utilities"
license = "BSD-3-Clause"
homepage = "https://github.com/hyprwm/hyprcursor"
hostdeps = ["cmake", "ninja", "pkgconf"]
builddeps = ["hyprlang-devel", "libzip-devel", "cairo-devel", "librsvg-devel", "tomlplusplus-devel"]
options = ["!check"]

source = [
    { url = "https://github.com/hyprwm/hyprcursor/archive/refs/tags/v0.1.13.tar.gz", sha256 = "82af8b2ce27242ffdd6baebaa71b3f6c8665dc25c52bfcfccc16912622896af8" },
]

setup = '''
%cmake \
    -DBUILD_TESTING=OFF
'''
build = '''
%cmake_build
'''
install = '''
%cmake_install
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/hyprcursor/LICENSE"
'''
