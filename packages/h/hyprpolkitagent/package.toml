# hyprpolkitagent: the polkit agent. Installs to /usr/libexec; its D-Bus activation file (share/dbus-1/services) is kept without the systemd unit, so the dotfiles start it from the session script. The systemd unit is removed.
name = "hyprpolkitagent"
version = "0.2.0"
release = 1
summary = "Polkit authentication agent for Hyprland"
license = "BSD-3-Clause"
homepage = "https://github.com/hyprwm/hyprpolkitagent"
archs = ["x86_64", "aarch64"]
hostdeps = ["cmake", "ninja", "pkgconf", "hyprwayland-scanner-devel"]
builddeps = ["hyprutils-devel", "hyprlang-devel", "hyprtoolkit-devel", "hyprgraphics-devel", "pixman-devel", "libdrm-devel", "sdbus-cpp-devel", "polkit-devel"]
options = ["!check"]

source = [
    { url = "https://github.com/hyprwm/hyprpolkitagent/archive/refs/tags/v0.2.0.tar.gz", sha256 = "dcb1147e28efe03f308513f9dad69ab54e3cb9eca38795c4498d968b4f5ec602" },
]

setup = '''
%cmake -DBUILD_TESTING=OFF
'''
build = '''
%cmake_build
'''
install = '''
%cmake_install
rm -rf "$pkgdir/usr/lib/systemd"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/hyprpolkitagent/LICENSE"
'''
