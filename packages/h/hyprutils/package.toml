# needed by: hyprlang, hyprgraphics, aquamarine, hyprland.
name = "hyprutils"
version = "0.14.4"
release = 1
summary = "Small C++ library of utilities used across the Hypr* ecosystem"
license = "BSD-3-Clause"
homepage = "https://github.com/hyprwm/hyprutils"
hostdeps = ["cmake", "ninja", "pkgconf"]
builddeps = ["pixman-devel"]
options = ["!check"]

source = [
    { url = "https://github.com/hyprwm/hyprutils/archive/refs/tags/v0.14.4.tar.gz", sha256 = "f8097938eee51ef82db73ff884f5b0780c251ef1a3c3ea28da0c19d2408013db" },
]

setup = '''
%cmake \
    -DBUILD_TESTING=OFF
'''
build = '''
%cmake_build
'''
install = '''
%cmake_install
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/hyprutils/LICENSE"
'''
