# needed by: hyprlang, hyprgraphics, aquamarine, hyprland.
name = "hyprutils"
version = "0.14.3"
release = 1
summary = "Small C++ library of utilities used across the Hypr* ecosystem"
license = "BSD-3-Clause"
homepage = "https://github.com/hyprwm/hyprutils"
hostdeps = ["cmake", "ninja", "pkgconf"]
builddeps = ["pixman-devel"]
options = ["!check"]

source = [
    { url = "https://github.com/hyprwm/hyprutils/archive/refs/tags/v0.14.3.tar.gz", sha256 = "87bbfc9549ed96316b0d592c16d01f58729b23a2999a5293b73eec620b40c5f5" },
]

setup = '''
%cmake \
    -DBUILD_TESTING=OFF
'''
build = '''
%cmake_build
'''
install = '''
%cmake_install
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/hyprutils/LICENSE"
'''
