# htop: interactive process viewer. As Chimera's main/htop: with
# capabilities (it can run setuid-less with cap_sys_ptrace), delay
# accounting (libnl) and hardware sensors (lm-sensors). libnl and libsensors
# are opened at run time (dlopen), hence the rundeps.
name = "htop"
version = "3.5.3"
release = 1
summary = "Interactive process viewer"
license = "GPL-2.0-only"
homepage = "https://htop.dev"
patches = ["scheduler.patch"]
hostdeps = ["pkgconf"]
builddeps = ["libcap-devel", "libnl-devel", "linux-headers", "lm-sensors-devel", "ncurses-devel"]
rundeps = ["libnl-libs", "lm-sensors-libs"]

source = [
    { url = "https://github.com/htop-dev/htop/releases/download/3.5.3/htop-3.5.3.tar.xz", sha256 = "a8b164386494cb85bb255a415a3f5f80afe7a0c4491da5d113b3a0f951087e65" },
]

setup = '''
%configure \
    --enable-capabilities \
    --enable-delayacct \
    --enable-sensors \
    --enable-unicode
'''
build = '''
%make
'''
check = '''
%make check
'''
install = '''
%make_install
# The 128px icon goes into the icon theme instead of the legacy pixmaps dir.
install -Dm644 "$pkgdir/usr/share/pixmaps/htop.png" "$pkgdir/usr/share/icons/hicolor/128x128/apps/htop.png"
rm -r "$pkgdir/usr/share/pixmaps"
'''
