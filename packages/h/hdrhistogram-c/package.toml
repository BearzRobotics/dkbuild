# HdrHistogram_c: High Dynamic Range histograms in C. Electron's Node uses the
# system one (use_system_histogram). Programs and tests are not built.
name = "hdrhistogram-c"
version = "0.11.8"
release = 1
summary = "High Dynamic Range histogram library in C"
license = "CC0-1.0 OR BSD-2-Clause"
homepage = "https://github.com/HdrHistogram/HdrHistogram_c"
hostdeps = ["cmake", "ninja", "pkgconf"]
builddeps = ["zlib-ng-compat-devel"]
options = ["!check"]

source = [
    { url = "https://github.com/HdrHistogram/HdrHistogram_c/archive/refs/tags/0.11.8.tar.gz", sha256 = "bb95351a6a8b242dc9be1f28562761a84d4cf0a874ffc90a9b630770a6468e94" },
]

setup = '''
%cmake -DHDR_HISTOGRAM_BUILD_PROGRAMS=OFF -DHDR_HISTOGRAM_BUILD_SHARED=ON -DHDR_HISTOGRAM_BUILD_STATIC=ON
'''
build = '''
%cmake_build
'''
install = '''
%cmake_install
install -Dm644 LICENSE.txt "$pkgdir/usr/share/licenses/hdrhistogram-c/LICENSE.txt"
install -Dm644 COPYING.txt "$pkgdir/usr/share/licenses/hdrhistogram-c/COPYING.txt"
'''
