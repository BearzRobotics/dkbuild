name = "hashcat"
version = "7.1.2"
release = 2
summary = "Password recovery tool"
license = "MIT"
homepage = "https://hashcat.net/hashcat"
patches = ["aarch64-autodetection.patch", "cargo-offline.patch", "fix-modules-path.patch", "ldflags.patch", "no_gcc.patch", "ppc.patch"]
hostdeps = ["rust", "sed"]
builddeps = ["linux-headers", "minizip-devel", "opencl-headers", "python-devel", "rust", "xxhash-devel", "zlib-ng-compat-devel"]
options = ["!check", "!cross", "cargodeps"]

source = [
    { url = "https://hashcat.net/files/hashcat-7.1.2.tar.gz", sha256 = "9546a6326d747530b44fcc079babad40304a87f32d3c9080016d58b39cfc8b96" },
]

environment = '''
export CARGO_HOME=/tmp/cargo-home CARGO_NET_OFFLINE=true
# system OpenCL headers, xxhash and zlib; MAINTAINER_MODE keeps -march=native out
export PREFIX=/usr SED=sed USE_SYSTEM_OPENCL=1 USE_SYSTEM_XXHASH=1 USE_SYSTEM_ZLIB=1 MAINTAINER_MODE=1
'''
build = '''
%make
'''
install = '''
%make_install \
    STRIP=true \
    PREFIX=/usr
install -Dm644 docs/license.txt "$pkgdir/usr/share/licenses/hashcat/license.txt"
'''
