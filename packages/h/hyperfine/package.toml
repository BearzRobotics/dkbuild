# hyperfine: command-line benchmarking tool (runs a command many times, reports mean/min/max,
# warmup runs, parameter scans, exports to JSON/CSV/markdown). Crates vendored on the host.
# The shell completions are written by the build script (SHELL_COMPLETIONS_DIR), the man page is doc/hyperfine.1.
name = "hyperfine"
version = "2.0.0"
release = 1
summary = "Command-line benchmarking tool"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/sharkdp/hyperfine"
hostdeps = ["rust"]
options = ["!check", "cargodeps"]

source = [
    { url = "https://github.com/sharkdp/hyperfine/archive/refs/tags/v2.0.0.tar.gz", sha256 = "f4b71df3c78e4cf752ca6fb6ebc4b025f7ea6a5ca5c48fea75f8a1fdb4c7d721" },
]

environment = '''
export CARGO_HOME=/tmp/cargo-home CARGO_NET_OFFLINE=true
export SHELL_COMPLETIONS_DIR=/tmp/completions
'''
build = '''
mkdir -p /tmp/completions
cargo build --release --frozen --offline -j $jobs
'''
install = '''
install -Dm755 target/release/hyperfine "$pkgdir/usr/bin/hyperfine"
install -Dm644 doc/hyperfine.1 "$pkgdir/usr/share/man/man1/hyperfine.1"
install -Dm644 /tmp/completions/hyperfine.bash "$pkgdir/usr/share/bash-completion/completions/hyperfine"
install -Dm644 /tmp/completions/_hyperfine "$pkgdir/usr/share/zsh/site-functions/_hyperfine"
install -Dm644 /tmp/completions/hyperfine.fish "$pkgdir/usr/share/fish/vendor_completions.d/hyperfine.fish"
install -Dm644 LICENSE-MIT "$pkgdir/usr/share/licenses/hyperfine/LICENSE-MIT"
install -Dm644 LICENSE-APACHE "$pkgdir/usr/share/licenses/hyperfine/LICENSE-APACHE"
'''
