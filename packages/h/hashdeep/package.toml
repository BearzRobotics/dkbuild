# Cross-platform tools to message digests for any number of files. (BlackArch list, requested 2026-11-16; docs/requests.md). Generated from the sources' build files (autotools); the build dependencies are guessed from the #includes. Not built yet when written (wip/queue): expect first-build fixes.
name = "hashdeep"
version = "4.4"
release = 3
summary = "Cross-platform tools to message digests for any number of files."
license = "GPL-2.0-or-later"
homepage = "https://github.com/jessek/hashdeep"
hostdeps = ["make", "pkgconf", "autoconf", "automake", "libtool"]
builddeps = ["linux-headers"]
options = ["!check"]

source = [
    { url = "https://github.com/jessek/hashdeep/archive/refs/tags/v4.4.tar.gz", sha256 = "ad78d42142f9a74fe8ec0c61bc78d6588a528cbb9aede9440f50b6ff477f3a7f" },
]

# new release: xml.h writes "...%"PRIu64 without a space between the string and the macro, which C++11 and later read as a user-defined literal suffix
# ("invalid suffix on literal"): built as C++03, the standard the code was written for.
environment = '''
export CXXFLAGS="$CXXFLAGS -std=gnu++03"
'''
# r+1: hash.cpp compares a pointer with 0 using > ("ordered comparison between pointer and zero", an error in C++ since clang 15's DR handling): != 0. Source edit: sed.
setup = '''
sed -i 's/->base>0/->base!=0/g' src/*.cpp
autoreconf -fi
%configure
'''
build = '''
%make
'''
install = '''
%make_install
install -Dm644 COPYING "$pkgdir/usr/share/licenses/hashdeep/COPYING"
'''
