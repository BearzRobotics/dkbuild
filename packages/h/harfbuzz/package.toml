# r2: static libraries too (in harfbuzz-static), for fully static programs on musl.
name = "harfbuzz"
version = "14.5.0"
release = 3
summary = "Text shaping engine"
license = "MIT"
homepage = "https://harfbuzz.github.io"
hostdeps = ["freetype-bootstrap", "glib-devel", "gobject-introspection", "help2man", "meson", "pkgconf"]
builddeps = ["cairo-devel", "freetype-bootstrap", "graphite2-devel", "icu-devel"]
options = ["!cross"]

source = [
    { url = "https://github.com/harfbuzz/harfbuzz/releases/download/14.5.0/harfbuzz-14.5.0.tar.xz", sha256 = "b7132e148358a45185c9feafd049dbaf243649d3c44414b3534d9c95d18592b9" },
]

setup = '''
%meson \
    -Db_ndebug=true \
    -Dcairo=disabled \
    -Dcpp_std=c++17 \
    -Ddocs=disabled \
    -Dfreetype=enabled \
    -Dglib=enabled \
    -Dgraphite2=disabled \
    -Dicu=disabled \
    -Dintrospection=disabled
'''
build = '''
%meson_build
'''
install = '''
%meson_install
install -Dm644 COPYING "$pkgdir/usr/share/licenses/harfbuzz/COPYING"
'''
