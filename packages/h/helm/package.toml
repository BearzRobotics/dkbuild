# helm: the Kubernetes package manager (Helm 4). Go modules from the shared
# module cache (godeps). Static, CGO off, as upstream's release builds. Shell
# completions are generated by the built binary.
name = "helm"
version = "4.3.2"
release = 1
summary = "Kubernetes package manager"
license = "Apache-2.0"
homepage = "https://helm.sh"
hostdeps = ["go"]
options = ["!check", "godeps"]

source = [
    { url = "https://github.com/helm/helm/archive/refs/tags/v4.3.2.tar.gz", sha256 = "7d848fa8880cca40f9548e46255d38e3e25259847fe81775c5a09af0c3dda2e1" },
]

environment = '''
export GOTOOLCHAIN=local GOFLAGS="-mod=mod -trimpath -buildvcs=false" GOCACHE=/tmp/go-cache GOPATH=/tmp/go CGO_ENABLED=0
'''
build = '''
go build -ldflags "-s -w -X helm.sh/helm/v4/internal/version.version=v$version -X helm.sh/helm/v4/internal/version.gitTreeState=clean" -o helm ./cmd/helm
for sh in bash fish zsh; do ./helm completion $sh > helm.$sh; done
'''
install = '''
install -Dm755 helm "$pkgdir/usr/bin/helm"
install -Dm644 helm.bash "$pkgdir/usr/share/bash-completion/completions/helm"
install -Dm644 helm.fish "$pkgdir/usr/share/fish/vendor_completions.d/helm.fish"
install -Dm644 helm.zsh "$pkgdir/usr/share/zsh/site-functions/_helm"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/helm/LICENSE"
'''
