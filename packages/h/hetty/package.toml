# HTTP toolkit for security research. Aims to become an open source alternative to... (BlackArch list, requested 2026-11-16; docs/requests.md). Written from the template of ffuf; not built yet when written (wip/queue): expect first-build fixes.
# Go module, dependencies fetched on the host (godeps). Main package: cmd/hetty.
name = "hetty"
version = "0.7.0"
release = 1
summary = "HTTP toolkit for security research. Aims to become an open source alternative to..."
license = "MIT"
homepage = "https://github.com/dstotijn/hetty"
hostdeps = ["go"]
options = ["!check", "godeps"]

source = [
    { url = "https://github.com/dstotijn/hetty/archive/refs/tags/v0.7.0.tar.gz", sha256 = "24dc2bd011579f121e08b58862e991b5d0881c95704ac493a3bccbb4a785e41c" },
]

environment = '''
export GOFLAGS="-mod=mod -trimpath -buildvcs=false" GOTOOLCHAIN=local GOPROXY=off
export GOCACHE=/tmp/go-cache GOPATH=/tmp/go CGO_ENABLED=0
'''
build = '''
mkdir -p build
go build -o build/hetty ./cmd/hetty
'''
install = '''
install -Dm755 build/hetty "$pkgdir/usr/bin/hetty"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/hetty/LICENSE"
'''
