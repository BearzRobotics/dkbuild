# HTTP toolkit for security research. Aims to become an open source alternative to... (BlackArch list, requested 2026-11-16; docs/requests.md). Written from the template of ffuf; not built yet when written (wip/queue): expect first-build fixes.
# Go module, dependencies fetched on the host (godeps). Main package: cmd/hetty.
name = "hetty"
version = "0.7.0"
release = 1
summary = "HTTP toolkit for security research. Aims to become an open source alternative to..."
license = "MIT"
homepage = "https://github.com/dstotijn/hetty"
# r2: the admin web UI (Next.js 12, embedded by cmd/hetty: `go:embed admin`; the Makefile's build-admin
# runs `yarn export` and moves dist to cmd/hetty/admin) is built from source with its npm packages from
# the store (npmdeps). Upstream locks it with yarn.lock (v1); files/package-lock.json is
# `npm install --package-lock-only --ignore-scripts --legacy-peer-deps` run in admin/ on the host
# (npm seeds the versions from yarn.lock; legacy peer deps because react-split-pane wants React 16).
hostdeps = ["go", "nodejs", "gcc"]
options = ["!check", "godeps", "npmdeps"]

source = [
    { url = "https://github.com/dstotijn/hetty/archive/refs/tags/v0.7.0.tar.gz", sha256 = "24dc2bd011579f121e08b58862e991b5d0881c95704ac493a3bccbb4a785e41c" },
]

environment = '''
export GOFLAGS="-mod=mod -trimpath -buildvcs=false" GOTOOLCHAIN=local GOPROXY=off
export GOCACHE=/tmp/go-cache GOPATH=/tmp/go CGO_ENABLED=0
export HOME=/tmp/home npm_config_cache=/tmp/npm-cache npm_config_offline=true \
    npm_config_audit=false npm_config_fund=false npm_config_update_notifier=false NEXT_TELEMETRY_DISABLED=1
# Next.js 12's prebuilt SWC binary for musl needs libgcc_s.so.1 ("Error loading shared library libgcc_s.so.1"), which this system only has in the gcc
# package's directory: the dynamic loader is pointed there for the admin build, as for the Euro-Office web-apps build
export LD_LIBRARY_PATH=/usr/lib/gcc15/lib
'''
setup = '''
cd admin
cp /dkbuild/files/package-lock.json package-lock.json
node /dkbuild/npm-offline.js /tmp/npm-cache package-lock.json
npm ci --ignore-scripts --legacy-peer-deps
'''
build = '''
( cd admin && NEXT_PUBLIC_VERSION=$version npm run export )
mv admin/dist cmd/hetty/admin
mkdir -p build
go build -o build/hetty ./cmd/hetty
'''
install = '''
install -Dm755 build/hetty "$pkgdir/usr/bin/hetty"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/hetty/LICENSE"
'''
