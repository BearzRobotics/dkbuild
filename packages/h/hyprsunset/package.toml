# hyprsunset: colour-temperature daemon. The systemd user unit is removed.
name = "hyprsunset"
version = "0.4.0"
release = 1
summary = "Hyprland's blue-light filter"
license = "BSD-3-Clause"
homepage = "https://github.com/hyprwm/hyprsunset"
archs = ["x86_64", "aarch64"]
hostdeps = ["cmake", "ninja", "pkgconf", "hyprwayland-scanner-devel"]
builddeps = ["hyprutils-devel", "hyprlang-devel", "hyprland-protocols-devel", "wayland-devel", "wayland-protocols"]
options = ["!check"]

source = [
    { url = "https://github.com/hyprwm/hyprsunset/archive/refs/tags/v0.4.0.tar.gz", sha256 = "5980e65ec650010e36c52e5f5acc0df9fd2d20051c63b89305bdc13276f237a6" },
]

setup = '''
%cmake -DBUILD_TESTING=OFF
'''
build = '''
%cmake_build
'''
install = '''
%cmake_install
rm -rf "$pkgdir/usr/lib/systemd"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/hyprsunset/LICENSE"
'''
