# A fast and multi-purpose HTTP toolkit allow to run multiple probers using... (BlackArch list, requested 2026-11-16; docs/requests.md). Written from the template of ffuf; not built yet when written (wip/queue): expect first-build fixes.
# Go module, dependencies fetched on the host (godeps). Main package: cmd/httpx.
name = "httpx"
version = "1.12.0"
release = 1
summary = "A fast and multi-purpose HTTP toolkit allow to run multiple probers using..."
license = "MIT"
homepage = "https://github.com/projectdiscovery/httpx"
hostdeps = ["go"]
options = ["!check", "godeps"]

source = [
    { url = "https://github.com/projectdiscovery/httpx/archive/refs/tags/v1.12.0.tar.gz", sha256 = "b29319c085537047bff8acf72c6cd4ecf17585ede97f4afdde2304431c74e64e" },
]

environment = '''
export GOFLAGS="-mod=mod -trimpath -buildvcs=false" GOTOOLCHAIN=local GOPROXY=off
export GOCACHE=/tmp/go-cache GOPATH=/tmp/go CGO_ENABLED=0
'''
build = '''
mkdir -p build
go build -o build/httpx ./cmd/httpx
'''
install = '''
install -Dm755 build/httpx "$pkgdir/usr/bin/httpx"
install -Dm644 LICENSE.md "$pkgdir/usr/share/licenses/httpx/LICENSE.md"
'''
