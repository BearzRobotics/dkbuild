# AVS2 (AVS2, IEEE 1857.4) video encoder; FFmpeg's --enable-libxavs2 (FFmpeg then
# becomes GPL). Hand-written configure (x264-style): --enable-shared and
# --enable-static build both. Not imported from cports (Chimera has no xavs2).
# - AR/RANLIB are exported because the configure only looks for gcc-ar and falls
#   back to "ar"; it appends " rc " to AR itself.
# - --enable-pic: the static library is PIC too (usable inside shared objects).
# - Assembly (nasm) is on; OpenCL stays at the configure default (off: it has no --enable switch).
# needed by: ffmpeg (libxavs2).
name = "xavs2"
version = "1.4"
release = 3
summary = "AVS2 video encoder"
license = "GPL-2.0-or-later"
homepage = "https://github.com/pkuvcl/xavs2"
hostdeps = ["bash", "nasm", "pkgconf"]
options = ["!check", "!lto"]

source = [
    { url = "https://github.com/pkuvcl/xavs2/archive/refs/tags/1.4.tar.gz", sha256 = "1e6d731cd64cb2a8940a0a3fd24f9c2ac3bb39357d802432a47bc20bad52c6ce" },
]

# --extra-cflags: encoder.c passes void *(*)(xavs2_t *) to xavs2_threadpool_run's
# void *(*)(void *) parameter; clang 16+ makes that an error, and the cast is
# ABI-safe on all supported targets (pointer argument), so the diagnostic is
# turned back into a warning.
# Likewise the AVX2 intrinsics code (vec/intrinsic_*_avx2.c) passes int64_t *
# (long on x86_64 Linux) to intrinsics that take long long *: the same size and
# representation, and clang 21+ makes the mismatch an error (r2 failed on it).
setup = '''
export AR="${AR:-llvm-ar}" RANLIB="${RANLIB:-llvm-ranlib}"
cd build/linux
%configure \
    --enable-shared \
    --enable-static \
    --enable-pic \
    --extra-cflags="-Wno-incompatible-function-pointer-types -Wno-incompatible-pointer-types"
'''
# %make passes AR=llvm-ar on the command line, overriding the Makefile's configure-set
# AR="llvm-ar rc " (archive step ran "llvm-arlibxavs2.a ..."); the later AR here wins.
build = '''
cd build/linux
%make AR="llvm-ar rc "
'''
install = '''
cd build/linux
%make_install
cd ../..
install -Dm644 COPYING "$pkgdir/usr/share/licenses/xavs2/COPYING"
'''
