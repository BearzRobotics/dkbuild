# AVS2 (AVS2, IEEE 1857.4) video encoder; FFmpeg's --enable-libxavs2 (FFmpeg then
# becomes GPL). Hand-written configure (x264-style): --enable-shared and
# --enable-static build both. Not imported from cports (Chimera has no xavs2).
# - AR/RANLIB are exported because the configure only looks for gcc-ar and falls
#   back to "ar"; it appends " rc " to AR itself.
# - --enable-pic: the static library is PIC too (usable inside shared objects).
# - Assembly (nasm) is on; OpenCL stays at the configure default (off: it has no --enable switch).
# needed by: ffmpeg (libxavs2).
name = "xavs2"
version = "1.4"
release = 1
summary = "AVS2 video encoder"
license = "GPL-2.0-or-later"
homepage = "https://github.com/pkuvcl/xavs2"
hostdeps = ["bash", "nasm", "pkgconf"]
options = ["!check", "!lto"]

source = [
    { url = "https://github.com/pkuvcl/xavs2/archive/refs/tags/1.4.tar.gz", sha256 = "1e6d731cd64cb2a8940a0a3fd24f9c2ac3bb39357d802432a47bc20bad52c6ce" },
]

setup = '''
export AR="${AR:-llvm-ar}" RANLIB="${RANLIB:-llvm-ranlib}"
cd build/linux
%configure \
    --enable-shared \
    --enable-static \
    --enable-pic
'''
build = '''
cd build/linux
%make
'''
install = '''
cd build/linux
%make_install
cd ../..
install -Dm644 COPYING "$pkgdir/usr/share/licenses/xavs2/COPYING"
'''
