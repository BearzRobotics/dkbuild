setup = '''
cd source
# One library with 8-, 10- and 12-bit encoders: the 10- and 12-bit ones are
# built static and linked into the main (8-bit) one, as Chimera does.
cmake -G Ninja -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_BUILD_TYPE=Release -B build-12 -DENABLE_CLI=OFF -DENABLE_SHARED=OFF -DEXPORT_C_API=OFF -DHIGH_BIT_DEPTH=ON -DMAIN12=ON
cmake -G Ninja -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_BUILD_TYPE=Release -B build-10 -DENABLE_CLI=OFF -DENABLE_SHARED=OFF -DEXPORT_C_API=OFF -DHIGH_BIT_DEPTH=ON -DMAIN12=OFF
cmake -G Ninja -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_BUILD_TYPE=Release -B build "-DEXTRA_LIB=x265_main10.a;x265_main12.a" -DEXTRA_LINK_FLAGS=-L. -DLINKED_10BIT=TRUE -DLINKED_12BIT=TRUE
'''
build = '''
cd source
cmake --build build-12
cmake --build build-10
ln -sf ../build-12/libx265.a build/libx265_main12.a
ln -sf ../build-10/libx265.a build/libx265_main10.a
cmake --build build
'''
install = '''
