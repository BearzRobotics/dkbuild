# Imported draft, untested. Dropped from Chimera's recipe: shell completions, service/tmpfiles/sysusers
# installs and cbuild env tweaks; dependency names are Chimera's and resolve from stage 0 until they are recipes.
# r2: dependencies on this tree's packages, not Chimera's names (built against the image's copies before).
# r3: static libraries too (in xfsprogs-static), for fully static programs on musl.
name = "xfsprogs"
version = "7.3.0"
release = 1
summary = "XFS file system utilities"
license = "LGPL-2.1-or-later"
homepage = "http://xfs.org/index.php/Main_Page"
patches = ["no-bash-and-chown.patch"]
hostdeps = ["gettext", "util-linux-devel", "pkgconf"]
builddeps = ["attr-devel", "gettext-devel", "inih-devel", "libedit-devel", "linux-headers", "lvm2-devel", "userspace-rcu-devel", "util-linux-devel"]
options = ["!check"]

source = [
    { url = "https://www.kernel.org/pub/linux/utils/fs/xfs/xfsprogs/xfsprogs-7.3.0.tar.xz", sha256 = "310c11e9e1d336064921cc123de5c84a331d5abe3c3b82aeadb89a191d34b449" },
]

environment = '''
export CFLAGS="${CFLAGS} -DOVERRIDE_SYSTEM_STATX"
'''
setup = '''
%configure \
    --enable-editline=no \
    --enable-lib64=no
'''
build = '''
%make
'''
install = '''
%make_install \
    -j1 \
    install-dev
rm -rf "$pkgdir/usr/share/doc"
# prevents udisks automount
rm -rf "$pkgdir/usr/lib/udev/rules.d/64-xfs.rules"
'''
