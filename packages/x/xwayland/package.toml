name = "xwayland"
# Runs xkbcomp for keymaps (rundep), with the layouts from xkeyboard-config.
version = "24.1.14"
release = 1
summary = "Xwayland X server"
license = "MIT"
homepage = "https://xorg.freedesktop.org"
patches = ["allow-overflow-on-glamor_composite_clipped_region.patch", "no-sighandler-segv-etc.patch"]
hostdeps = ["meson", "pkgconf", "wayland"]
builddeps = ["dbus-devel", "font-util-devel", "libei-devel", "libepoxy-devel", "libtirpc-devel", "libxcb-devel", "libxcvt-devel", "libxfont2-devel", "libxkbfile-devel", "libxshmfence-devel", "mesa-devel", "nettle-devel", "pixman-devel", "wayland-devel", "wayland-protocols", "xorgproto", "xtrans"]
rundeps = ["xserver-xorg-protocol", "xkbcomp", "xkeyboard-config"]
options = ["!check"]

source = [
    { url = "https://gitlab.freedesktop.org/xorg/xserver/-/archive/xwayland-24.1.14/xserver-xwayland-24.1.14.tar.gz", sha256 = "3dd28ecde16a240e7d621539585b6dd11429a582699ba328a68f5a307056b68d" },
]

setup = '''
%meson \
    -Dipv6=true \
    -Dxcsecurity=true \
    -Ddri3=true \
    -Dglamor=true \
    -Dxvfb=false \
    -Dxdmcp=false \
    -Dxwayland_ei=socket \
    -Dxkb_dir=/usr/share/X11/xkb \
    -Dxkb_output_dir=/var/lib/xkb
'''
build = '''
%meson_build
'''
install = '''
%meson_install
install -Dm644 COPYING "$pkgdir/usr/share/licenses/xwayland/COPYING"
rm -rf "$pkgdir/usr/share/man/man1/Xserver.1"
# provided by xserver-xorg-protocol
rm -rf "$pkgdir/usr/lib/xorg/protocol.txt"
'''
