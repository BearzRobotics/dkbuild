# r4: /usr/bin/xmlto finds the DocBook catalogs itself (no network), and
#     depends on docbook-xml for validation.
name = "xmlto"
version = "0.0.29"
release = 4
summary = "Tool to help transform XML documents into other formats"
license = "GPL-2.0-or-later"
homepage = "https://pagure.io/xmlto"
hostdeps = ["docbook-xsl", "automake", "bash", "docbook-xsl-nons", "flex", "libtool", "libxslt"]
rundeps = ["bash", "libxslt", "docbook-xsl-nons", "docbook-xml"]

source = [
    { url = "https://deb.debian.org/debian/pool/main/x/xmlto/xmlto_0.0.29.orig.tar.bz2", sha256 = "6000d8e8f0f9040426c4f85d7ad86789bc88d4aeaef585c4d4110adb0b214f21" },
]

environment = '''
# The DocBook stylesheets are local (docbook-xsl-nons maps the sourceforge URL), not fetched from the web.
export XML_CATALOG_FILES=/usr/share/xsl-nons/docbook/catalog.xml
'''
setup = '''
autoreconf -if -W none
%configure
'''
build = '''
%make
'''
check = '''
%make check
'''
install = '''
%make_install
# Without XML_CATALOG_FILES (and with no /etc/xml/catalog, as in build roots),
# libxml2 would fetch the DocBook DTDs and stylesheets from the web: default it
# to the catalogs installed here.
f="$pkgdir/usr/bin/xmlto"
{
    head -n1 "$f"
    cat <<'EOF2'
if [ -z "${XML_CATALOG_FILES:-}" ]; then
    for c in /etc/xml/catalog /usr/share/xml/docbook/*/catalog* /usr/share/xsl-nons/docbook/catalog.xml; do
        [ -f "$c" ] && XML_CATALOG_FILES="${XML_CATALOG_FILES:+$XML_CATALOG_FILES }$c"
    done
    export XML_CATALOG_FILES
fi
EOF2
    tail -n +2 "$f"
} > "$f.new"
mv "$f.new" "$f"
chmod 755 "$f"
grep -q XML_CATALOG_FILES "$pkgdir/usr/bin/xmlto"
'''
