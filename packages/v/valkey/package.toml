# Valkey: the BSD-licensed continuation of Redis (key-value store). Installs
# redis-server, redis-cli, ... as links too, so Redis clients and scripts work.
# Built with TLS and musl's malloc (as Alpine does). The service runs it as
# _valkey with /etc/valkey/valkey.conf; data in /var/lib/valkey.
name = "valkey"
version = "9.1.3"
release = 1
summary = "Key-value data store, a Redis fork (also provides redis-*)"
license = "BSD-3-Clause"
homepage = "https://valkey.io"
hostdeps = ["pkgconf"]
builddeps = ["openssl-devel", "linux-headers"]
options = ["!check"]

source = [
    { url = "https://github.com/valkey-io/valkey/archive/refs/tags/9.1.3.tar.gz", sha256 = "184e34ed2d9b51879b682b5b15205e2b9d677c60280e3cb453be8f520d04e293" },
]

build = '''
%make BUILD_TLS=yes MALLOC=libc USE_SYSTEMD=no
'''
install = '''
%make install PREFIX="$pkgdir/usr" BUILD_TLS=yes MALLOC=libc USE_SYSTEMD=no
sed -e 's|^dir \./|dir /var/lib/valkey|' -e 's|^# *unixsocket .*|unixsocket /run/valkey/valkey.sock|' \
    valkey.conf > valkey.conf.fenrir
install -Dm640 valkey.conf.fenrir "$pkgdir/etc/valkey/valkey.conf"
install -Dm640 sentinel.conf "$pkgdir/etc/valkey/sentinel.conf"
install -Dm644 $pkgfiles/valkey "$pkgdir/etc/dinit.d/valkey"
install -Dm644 $pkgfiles/sysusers.conf "$pkgdir/usr/lib/sysusers.d/valkey.conf"
install -Dm644 $pkgfiles/tmpfiles.conf "$pkgdir/usr/lib/tmpfiles.d/valkey.conf"
install -Dm644 COPYING "$pkgdir/usr/share/licenses/valkey/COPYING"
'''
