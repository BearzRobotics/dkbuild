build = '''
%make
'''
# r3: the tests failed 797 of 1433, all with "Unknown option --target=x86_64-fenriros-linux-musl": build-aux/testrunner.sh
# passes the compiler as `--cc $CC`, unquoted, and our CC is "clang --target=...", which splits in two, so valac gets
# a stray --target= argument. A one-word wrapper script as CC for the tests fixes that (found 2026-11-18).
check = '''
printf '#!/bin/sh
exec %s "$@"
' "$CC" > /tmp/vala-cc
chmod +x /tmp/vala-cc
%make check CC=/tmp/vala-cc
'''
