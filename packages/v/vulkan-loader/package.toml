# Imported from Chimera Linux cports: main/vulkan-loader/template.py
# cports is BSD-2-Clause, Copyright (c) Chimera Linux contributors.
# needed by: llama.cpp and ollama (GPU), anything using Vulkan.
# Wayland only: no XCB or Xlib surface support (the image has no X11).
# r2: rebuilt with libraries in /usr/lib (the %cmake macro set no libdir; they went to /usr/lib64).
# 2026-11-11: Vulkan surfaces on X11 (XCB, Xlib) too.
name = "vulkan-loader"
version = "1.4.365"
release = 3
summary = "Vulkan Installable Client Driver (ICD) loader"
license = "Apache-2.0"
homepage = "https://www.khronos.org/vulkan"
hostdeps = ["cmake", "ninja", "pkgconf", "python"]
builddeps = ["libxkbcommon-devel", "vulkan-headers-devel", "wayland-devel", "libxcb-devel", "libx11-devel", "libxrandr-devel"]
options = ["!check"]

source = [
    { url = "https://github.com/KhronosGroup/Vulkan-Loader/archive/v1.4.365.tar.gz", sha256 = "df0358f57c1936e4abd262a7327ba1f80ffb424dbbdcbcb01bb9288511f31eef" },
]

setup = '''
%cmake \
    -DBUILD_TESTS=OFF \
    -DBUILD_WSI_XCB_SUPPORT=ON \
    -DBUILD_WSI_XLIB_SUPPORT=ON
'''
build = '''
%cmake_build
'''
install = '''
%cmake_install
'''
