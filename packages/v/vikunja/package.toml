# Vikunja: a self-hosted to-do list and project management app (lists,
# kanban, gantt, tables; CalDAV). Go API server with the web interface
# (Vue, built with vite) embedded in the binary as upstream builds it (its
# magefile's `build`, done directly: no mage, no git). Go modules from the
# store (godeps); the front end's pnpm packages from the store (npmdeps,
# pnpm-lock.yaml through dkbuild's local registry). The Electron desktop app
# (desktop/) is not built.
# Paid features (admin panel, time tracking, audit logs, user invites) are
# AGPL code in the same tree (pkg/license) and are built in, inactive until
# the administrator sets license.key; without a key Vikunja runs in community
# mode and never contacts vikunja.io (README.FenrirOS).
# Installed inert (docs/requests.md): the dinit service shipped, not enabled;
# no config (an example, registration off, in /usr/share/doc/vikunja), no
# database, no account; no web server site (an nginx example).
# Setup: /usr/share/doc/vikunja/README.FenrirOS.
name = "vikunja"
version = "2.8.0"
release = 4
summary = "Self-hosted to-do list and project management"
license = "AGPL-3.0-or-later"
homepage = "https://vikunja.io"
archs = ["x86_64", "aarch64"]
hostdeps = ["go", "nodejs", "pnpm", "llvm-libunwind"]
options = ["!check", "!strip", "godeps", "npmdeps"]

source = [
    { url = "https://github.com/go-vikunja/vikunja/archive/refs/tags/v2.8.0.tar.gz", sha256 = "c7bfb1c4d4f577b3cbad62e2e77abb85802709fdeff7f1d366b90badc5fc7f94" },
]

environment = '''
export HOME=/tmp/home CGO_ENABLED=1
# package.json asks for pnpm 12 (packageManager); the system pnpm (11) must not
# try to download that version (it stopped: "Refusing to run pnpm@12.16.1: its
# npm registry signature could not be verified"). pnpm 11 has the setting
# pmOnFail for this; "ignore" skips the version switch (also in .npmrc, in
# case the environment variable is not read as a pnpm setting).
export npm_config_manage_package_manager_versions=false npm_config_package_manager_strict=false \
    npm_config_pm_on_fail=ignore
# The musl builds of the Rust-based npm addons the frontend build loads (lightningcss, rolldown,
# tailwind's oxide, rollup...) link libgcc_s.so.1, which this system does not have: LLVM's
# libunwind has the same _Unwind_* functions. node's loader hides the dlopen error behind
# "Cannot find module '../lightningcss.linux-x64-musl.node'" (authelia r1). A private link for
# this build only, as in listmonk.
mkdir -p /tmp/gccshim
ln -sf /usr/lib/libunwind.so.1 /tmp/gccshim/libgcc_s.so.1
export LD_LIBRARY_PATH="/tmp/gccshim${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
'''
setup = '''
cd frontend
# pnpm switches to the version package.json's packageManager field names (12.16.1)
# and refuses to run offline (signature check); the settings above did not stop
# that. The field is removed, so the system pnpm runs as it is.
sed -i '/^  "packageManager": /d' package.json
! grep -q '"packageManager"' package.json
echo 'pm-on-fail=ignore' >> .npmrc
# pnpm 11 verifies the lockfile against its supply-chain policies (release age,
# trust downgrade) by fetching each package's registry metadata; dkbuild's
# local registry only serves the stored tarballs and answers 404 for the
# metadata (@akryum/tinypool), so the check failed. The lockfile is already
# pinned by integrity hashes; the policies are switched off.
printf '%s\n' 'minimum-release-age=0' 'trust-policy=off' >> .npmrc
export npm_config_minimum_release_age=0 npm_config_trust_policy=off \
    pnpm_config_minimum_release_age=0 pnpm_config_trust_policy=off
# --config.trustLockfile=true: pnpm 11 re-checks every lockfile entry against its supply-chain
# policies (minimumReleaseAge, trustPolicy) and for that asks the registry for each package's
# metadata; the offline registry (npmdeps) serves tarballs only and answers metadata with 404
# (ERR_PNPM_FETCH_404 on 7zip-bin). The lockfile is the recipe's own pinned input.
pnpm install --frozen-lockfile --config.trustLockfile=true
'''
build = '''
( cd frontend && pnpm run build )
test -f frontend/dist/index.html
# as magefile.go's Build.Build: tag osusergo, version in pkg/version
go build -trimpath -tags osusergo -o vikunja \
    -ldflags "-X code.vikunja.io/api/pkg/version.Version=v$version -X main.Tags=osusergo"
'''
install = '''
install -Dm755 vikunja "$pkgdir/usr/bin/vikunja"
install -Dm644 $pkgfiles/vikunja "$pkgdir/etc/dinit.d/vikunja"
install -Dm644 $pkgfiles/sysusers.conf "$pkgdir/usr/lib/sysusers.d/vikunja.conf"
install -Dm644 $pkgfiles/tmpfiles.conf "$pkgdir/usr/lib/tmpfiles.d/vikunja.conf"
install -Dm644 $pkgfiles/config.yml.example "$pkgdir/usr/share/doc/vikunja/config.yml.example"
install -Dm644 $pkgfiles/nginx-vikunja.conf "$pkgdir/usr/share/doc/vikunja/nginx-vikunja.conf"
install -Dm644 $pkgfiles/README.FenrirOS "$pkgdir/usr/share/doc/vikunja/README.FenrirOS"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/vikunja/LICENSE"
'''
