]

environment = '''
export CFLAGS="${CFLAGS} -DNDEBUG"
export CXXFLAGS="${CXXFLAGS} -DNDEBUG -D_LIBCPP_HARDENING_MODE=_LIBCPP_HARDENING_MODE_NONE -Wno-deprecated-declarations -Wno-deprecated-copy"
export CCACHE_SLOPPINESS=time_macros,include_file_mtime
'''
setup = '''
%cmake \
    -DPORT=GTK \
    -DCMAKE_SKIP_RPATH=ON \
    -DUSE_GTK4=OFF \
    -DUSE_LD_LLD=ON \
    -DUSE_LIBBACKTRACE=OFF \
    -DUSE_SOUP2=OFF \
    -DUSE_WOFF2=ON \
    -DUSE_FLITE=OFF \
    -DUSE_SPIEL=ON \
    -DUSE_MIMALLOC=OFF \
    -DENABLE_BUBBLEWRAP_SANDBOX=ON \
    -DENABLE_DOCUMENTATION=OFF \
    -DENABLE_INTROSPECTION=ON \
    -DENABLE_JOURNALD_LOG=OFF \
    -DENABLE_MINIBROWSER=ON \
    -DENABLE_SAMPLING_PROFILER=OFF \
    -DENABLE_WAYLAND_TARGET=ON \
    -DENABLE_X11_TARGET=ON
'''
build = '''
%cmake_build
'''
install = '''
%cmake_install
install -Dm644 Source/WebCore/LICENSE-APPLE "$pkgdir/usr/share/licenses/webkitgtk/LICENSE-APPLE"
install -Dm644 Source/WebCore/LICENSE-LGPL-2.1 "$pkgdir/usr/share/licenses/webkitgtk/LICENSE-LGPL-2.1"
install -Dm644 Source/WebCore/LICENSE-LGPL-2 "$pkgdir/usr/share/licenses/webkitgtk/LICENSE-LGPL-2"
'''
