name = "wireshark"
version = "4.7.4"
release = 1
summary = "Network protocol analyzer"
license = "GPL-2.0-or-later"
homepage = "https://www.wireshark.org"
patches = ["dumpcap-group.patch", "no-ads.patch", "precision-loss.patch", "signed-overflow.patch"]
hostdeps = ["asciidoctor", "cmake", "doxygen", "flex", "gettext-devel", "libcap", "ninja", "perl", "pkgconf", "qt6-qtbase", "qt6-qttools"]
builddeps = ["c-ares-devel", "glib-devel", "gnutls-devel", "heimdal-devel", "libcap-devel", "libgcrypt-devel", "libnl-devel", "libpcap-devel", "libssh-devel", "libxml2-devel", "lua-devel", "lz4-devel", "minizip-ng-devel", "nghttp2-devel", "nghttp3-devel", "opus-devel", "pcre2-devel", "portaudio-devel", "qt6-qt5compat-devel", "qt6-qtbase-devel", "qt6-qtmultimedia-devel", "qt6-qtsvg-devel", "qt6-qttools-devel", "sbc-devel", "snappy-devel", "spandsp-devel", "speexdsp-devel", "zlib-ng-compat-devel", "zstd-devel"]
checkdeps = ["python-pytest"]

# groupadd and useradd (shadow) and the files they edit (base-files) must be there before pre-install runs
rundeps = ["libcap", "base-files", "shadow"]
source = [
    { url = "https://www.wireshark.org/download/src/all-versions/wireshark-4.7.4.tar.xz", sha256 = "f3a2f5bcca31dd2f8fe92444441402a6d27861b3a4023b68cb42c0563daaf186" },
]

setup = '''
%cmake \
    -DENABLE_GNUTLS=ON \
    -DENABLE_LUA=ON \
    -DENABLE_DEBUG=OFF \
    -DENABLE_WERROR=OFF
'''
build = '''
%cmake_build
'''
check = '''
# extcaps can't work in our container
# pytest.ini asks for pytest-xdist (-nauto), which is not packaged: the tests run one at a time ("unrecognized
# arguments: -nauto"). (Edit of a generated file: sed.)
sed -i 's/ *-nauto//' build/pytest.ini
pytest -k "not TestExtcaps" build
'''
install = '''
%cmake_install
'''
