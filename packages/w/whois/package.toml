name = "whois"
version = "5.6.6"
release = 1
summary = "Intelligent WHOIS Client"
license = "GPL-2.0-or-later"
homepage = "https://salsa.debian.org/md/whois"
patches = ["mkpasswd.patch"]
hostdeps = ["gettext", "perl", "pkgconf"]
builddeps = ["libidn2-devel"]
options = ["!check"]

source = [
    { url = "https://salsa.debian.org/md/whois/-/archive/v5.6.6/whois-v5.6.6.tar.gz", sha256 = "e3d1940ab3e238ae7f3671e0f1fad8860ccd4f153c2db3b70eacd3db733467fa" },
]

environment = '''
export CFLAGS="${CFLAGS} -DHAVE_GETOPT_LONG -DHAVE_GETADDRINFO -DHAVE_SHA_CRYPT"
'''
build = '''
%make \
    PREFIX=/usr \
    CONFIG_FILE=/etc/whois.conf \
    HAVE_ICONV=1
'''
install = '''
%make_install \
    INSTALL_ROOT="$pkgdir" \
    STRIP=true \
    PREFIX=/usr \
    install-mkpasswd
'''
