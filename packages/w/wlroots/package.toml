name = "wlroots"
version = "0.20.2"
release = 3
summary = "Modular Wayland compositor library 0.20.x"
license = "MIT"
homepage = "https://gitlab.freedesktop.org/wlroots/wlroots"
patches = ["sover.patch"]
hostdeps = ["glslang", "meson", "pkgconf"]
builddeps = ["hwdata-devel", "lcms2-devel", "libdisplay-info-devel", "libdrm-devel", "libinput-devel", "seatd-devel", "libxcb-devel", "libxkbcommon-devel", "linux-headers", "mesa-devel", "pixman-devel", "eudev-devel", "vulkan-headers", "vulkan-loader-devel", "wayland-devel", "wayland-protocols"]

source = [
    { url = "https://gitlab.freedesktop.org/wlroots/wlroots/-/releases/0.20.2/downloads/wlroots-0.20.2.tar.gz", sha256 = "80c567d2ed4efb2cfa6b077f22c7a710d9c78ba4e185a75e8694001114af0733" },
]

setup = '''
%meson \
    -Dxwayland=disabled \
    -Dbackends=drm,libinput \
    -Drenderers=gles2 \
    -Dallocators=gbm \
    -Dsession=enabled \
    -Dcolor-management=disabled \
    -Dexamples=false
'''
build = '''
%meson_build
'''
install = '''
%meson_install
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/wlroots0.20/LICENSE"
'''
