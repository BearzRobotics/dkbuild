# WordCraft: word processor of the Craft App Suite (storytold), pure Rust on egui/wgpu:
# .docx, .odt, .rtf, .html, .md, .tex import and export, PDF export. Two programs: the
# desktop app `wordcraft` and `wordcraft-cli` (convert, inspect, run scripts).
# Crates vendored on the host (cargodeps), git dependencies included: storytold/craft-libs,
# the storytold forks of egui and winit, and winprint.rs (Windows only, but in Cargo.lock).
# Optional build inputs, both included (not disabled): craft-i18n at the commit in
# craft-i18n.rev (the interface translations and the spelling and hyphenation data,
# CRAFT_I18N_DIR) and craft-fonts at the commit upstream's CI and release builds use
# (CRAFT_FONTS_DIR, fonts embedded in the binary). Both unpack as further sources in /build.
# Windowing (Wayland, X11, xkbcommon) and the GPU (Vulkan, EGL) are opened at run time, as
# for alacritty: they are run-time dependencies, not link-time ones.
# Source edits: none. Not built yet when written.
# drop-unused-patches.patch (Cargo.toml and Cargo.lock): the egui fork [patch] entries no member uses
# (egui_demo_lib, egui_inspection, ...) are removed, as cargo vendor leaves those crates out and the
# offline build then failed in cargo ("patch location ... does not contain packages matching
# egui_demo_lib").
name = "wordcraft"
version = "0.18.1"
release = 1
summary = "Word processor of the Craft App Suite (docx, odt, rtf, PDF export)"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/storytold/wordcraft"
hostdeps = ["rust", "pkgconf", "cmake"]
builddeps = ["fontconfig-devel", "freetype-devel", "libxcb-devel", "libxkbcommon-devel", "wayland-devel"]
rundeps = ["libxkbcommon", "mesa", "vulkan-loader", "wayland", "libx11", "libxcb", "fontconfig", "shared-mime-info", "hicolor-icon-theme"]
options = ["!check", "cargodeps"]
patches = ["drop-unused-patches.patch"]

source = [
    { url = "https://github.com/storytold/wordcraft/archive/refs/tags/v0.18.1.tar.gz", sha256 = "55e6e6ca0e988a7ba320bef506e3910d2e2e5c1d1599a79571e144947438ab92" },
    { url = "https://github.com/storytold/craft-i18n/archive/1e515422afdda2f317af430c1f9d68a5f83935b4.tar.gz", sha256 = "f80b9e41011f55963cb3cdb06f0e613996b0593a8f6236cd7d09a52f8b10a2e6" },
    { url = "https://github.com/storytold/craft-fonts/archive/b076417b5880bd4154bd22f00695b1d28c6bea83.tar.gz", sha256 = "35eadfeb7e4217a933f24b73a3d190b90fed81e6c933266f092c161746c0a9eb" },
]

environment = '''
export CARGO_HOME=/tmp/cargo-home CARGO_NET_OFFLINE=true
export CRAFT_I18N_DIR=/build/craft-i18n-1e515422afdda2f317af430c1f9d68a5f83935b4
export CRAFT_FONTS_DIR=/build/craft-fonts-b076417b5880bd4154bd22f00695b1d28c6bea83
export WORDCRAFT_BUILD_SHA=079f478bd85df7bcc567e3bafa7d7219096f9c3c WORDCRAFT_BUILD_DATE=2026-11-12
'''
build = '''
test -d "$CRAFT_I18N_DIR/language-data"
test -d "$CRAFT_FONTS_DIR/fonts"
cargo build --release --frozen --offline --locked -j $jobs -p wordcraft -p wordcraft-cli
'''
install = '''
install -Dm755 target/release/wordcraft "$pkgdir/usr/bin/wordcraft"
install -Dm755 target/release/wordcraft-cli "$pkgdir/usr/bin/wordcraft-cli"
id=ai.storyteller.wordcraft
install -Dm644 packaging/linux/$id.desktop "$pkgdir/usr/share/applications/$id.desktop"
install -Dm644 packaging/linux/$id.mime.xml "$pkgdir/usr/share/mime/packages/$id.xml"
mkdir -p "$pkgdir/usr/share/metainfo"
sed -e "s/@VERSION@/$version/g" -e "s/@DATE@/$WORDCRAFT_BUILD_DATE/g" \
    packaging/linux/$id.metainfo.xml.in > "$pkgdir/usr/share/metainfo/$id.metainfo.xml"
mkdir -p "$pkgdir/usr/share/icons"
cp -R assets/app-icon/hicolor "$pkgdir/usr/share/icons/"
install -Dm644 LICENSE-MIT "$pkgdir/usr/share/licenses/wordcraft/LICENSE-MIT"
install -Dm644 LICENSE-APACHE "$pkgdir/usr/share/licenses/wordcraft/LICENSE-APACHE"
install -Dm644 NOTICE "$pkgdir/usr/share/licenses/wordcraft/NOTICE"
install -Dm644 ATTRIBUTION.md "$pkgdir/usr/share/doc/wordcraft/ATTRIBUTION.md"
'''
