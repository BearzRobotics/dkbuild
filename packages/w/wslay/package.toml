name = "wslay"
version = "1.1.1"
release = 1
summary = "WebSocket library in C (event-driven, no I/O of its own)"
license = "MIT"
homepage = "https://tatsuhiro-t.github.io/wslay/"
hostdeps = ["pkgconf"]
# The unit tests need CUnit.
options = ["!check"]

source = [
    { url = "https://github.com/tatsuhiro-t/wslay/releases/download/release-1.1.1/wslay-1.1.1.tar.xz", sha256 = "166cfa9e3971f868470057ed924ae1b53f428db061b361b9a17c0508719d2cb5" },
]

setup = '''
%configure \
    --enable-static
'''
build = '''
%make
'''
install = '''
%make_install
install -Dm644 COPYING "$pkgdir/usr/share/licenses/wslay/COPYING"
'''
