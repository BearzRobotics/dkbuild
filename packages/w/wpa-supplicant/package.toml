# cports is BSD-2-Clause, Copyright (c) Chimera Linux contributors.
name = "wpa-supplicant"
version = "2.12"
release = 1
summary = "WPA/WPA2/IEEE 802.1X Supplicant"
license = "BSD-3-Clause"
homepage = "http://w1.fi/wpa_supplicant"
patches = ["001-dbus-policy.patch", "002-dbus-syslog.patch", "003-allow-tlsv1.patch", "004-disable-eapol-werror.patch", "005-nl80211-add-extra-ies-only-if-allowed-by-driver.patch", "008-allow-legacy-renegotiation.patch", "defaults.patch", "wpa_supplicant-Revert-Mark-authorization-completed-on-driver-indica.patch"]
hostdeps = ["pkgconf"]
builddeps = ["dbus-devel", "libedit-devel", "libnl-devel", "linux-headers", "openssl-devel", "pcsc-lite-devel"]
options = ["!check"]

source = [
    { url = "http://w1.fi/releases/wpa_supplicant-2.12.tar.gz", sha256 = "08e23937e16d0155e55cab2b51f51fbe10d80a1aa91c4e15442645059b737ef6" },
]

setup = '''
cp $pkgfiles/config wpa_supplicant/.config
'''
build = '''
cd wpa_supplicant
%make V=1
'''
install = '''
cd wpa_supplicant
install -dm755 "$pkgdir/usr/bin"
%make_install STRIP=true PREFIX=/usr
install -dm755 "$pkgdir/usr/share/dbus-1/system-services"
install -m644 dbus/*.service "$pkgdir/usr/share/dbus-1/system-services/"
install -Dm644 dbus/dbus-wpa_supplicant.conf "$pkgdir/usr/share/dbus-1/system.d/wpa_supplicant.conf"
install -Dm640 $pkgfiles/wpa_supplicant.conf "$pkgdir/etc/wpa_supplicant/wpa_supplicant.conf"
for m in doc/docbook/*.5 doc/docbook/*.8; do
    case "${m##*/}" in wpa_gui.*|wpa_priv.*|eapol_test.*) continue ;; esac
    install -Dm644 "$m" "$pkgdir/usr/share/man/man${m##*.}/${m##*/}"
done
install -Dm644 README "$pkgdir/usr/share/licenses/wpa-supplicant/README"
'''
