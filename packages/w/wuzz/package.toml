# Interactive cli tool for HTTP inspection. (BlackArch list, requested 2026-11-16; docs/requests.md). Written from the template of ffuf; not built yet when written (wip/queue): expect first-build fixes.
# Go module, dependencies fetched on the host (godeps). Main package: ..
name = "wuzz"
version = "0.5.0"
release = 1
summary = "Interactive cli tool for HTTP inspection."
license = "AGPL-3.0"
homepage = "https://github.com/asciimoo/wuzz"
hostdeps = ["go"]
options = ["!check", "godeps"]

source = [
    { url = "https://github.com/asciimoo/wuzz/archive/refs/tags/v0.5.0.tar.gz", sha256 = "721ea7343698e9f3c69e09eab86b9b1fef828057655f7cebc1de728c2f75151e" },
]

environment = '''
export GOFLAGS="-mod=mod -trimpath -buildvcs=false" GOTOOLCHAIN=local GOPROXY=off
export GOCACHE=/tmp/go-cache GOPATH=/tmp/go CGO_ENABLED=0
'''
build = '''
mkdir -p build
go build -o build/wuzz .
'''
install = '''
install -Dm755 build/wuzz "$pkgdir/usr/bin/wuzz"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/wuzz/LICENSE"
'''
