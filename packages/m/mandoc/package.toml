name = "mandoc"
version = "1.14.6"
release = 8
summary = "UNIX manpage compiler toolset"
license = "ISC"
homepage = "https://mandoc.bsd.lv"
patches = ["cross.patch", "manpath-default.patch", "never-cat.patch", "no-reset-gzip.patch", "outdated-warn-disable.patch", "signed-overflow.patch"]
builddeps = ["zlib-ng-compat-devel"]
checkdeps = ["perl"]
rundeps = ["less"]

source = [
    { url = "https://mandoc.bsd.lv/snapshots/mandoc-1.14.6.tar.gz", sha256 = "8bf0d570f01e70a6e124884088870cbed7537f36328d512909eb10cd53179d9c" },
]

setup = '''
cat > configure.local <<EOF
PREFIX=/usr
SBINDIR=/usr/bin
MANDIR=/usr/share/man
OSNAME="FenrirOS"
CFLAGS="$CFLAGS"
LDFLAGS="$LDFLAGS"
CC="$CC"
LN="ln -sf"
HAVE_REWB_BSD=0
UTF8_LOCALE=C.UTF-8
BINM_PAGER=less
MANPATH_DEFAULT="/usr/local/share/man:/usr/share/man"
MANPATH_BASE="/usr/share/man"
EOF
./configure
'''
build = '''
%make
'''
check = '''
%make regress
'''
install = '''
%make_install
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/mandoc/LICENSE"
'''
