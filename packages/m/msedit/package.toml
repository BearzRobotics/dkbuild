# Microsoft Edit: a simple modal-less terminal text editor.
# From main at b7f8322 (2026-11-02), after 2.0.0: syntax highlighting for many
# more languages. A git snapshot, pinned by commit.
# Crates vendored on the host (`cargodeps`). Plain stable build: upstream's
# smaller release profile (.cargo/release.toml) rebuilds std (build-std), which
# needs the std sources and their crates offline. Installed as upstream's
# installer does: /usr/bin/msedit, with `edit` linked to it.
name = "msedit"
version = "2.0.0_git20261102"
release = 1
summary = "Microsoft Edit, a simple terminal text editor"
license = "MIT"
homepage = "https://github.com/microsoft/edit"
hostdeps = ["rust"]
options = ["!check", "cargodeps"]

source = [
    { url = "snapshot:git https://github.com/microsoft/edit.git b7f83220868373945945e2218e852c24cbb4dcf0", sha256 = "dfad1fe875fc98a5ad600a26c52ffc8f20ab36652c7646792b8a4a8b8c97e69d" },
]

environment = '''
export CARGO_HOME=/tmp/cargo-home CARGO_NET_OFFLINE=true
'''
build = '''
cargo build --release --frozen --offline -p edit -j $jobs
'''
install = '''
install -Dm755 target/release/edit "$pkgdir/usr/bin/msedit"
ln -s msedit "$pkgdir/usr/bin/edit"
install -Dm644 assets/manpage/edit.1 "$pkgdir/usr/share/man/man1/edit.1"
install -Dm644 assets/com.microsoft.edit.desktop "$pkgdir/usr/share/applications/com.microsoft.edit.desktop"
install -Dm644 assets/edit.svg "$pkgdir/usr/share/icons/hicolor/scalable/apps/edit.svg"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/msedit/LICENSE"
'''
