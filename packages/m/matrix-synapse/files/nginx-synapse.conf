# Example only (not installed into /etc): Synapse behind nginx for a server name served at matrix.example.org.
# Replace the names, add TLS. Clients use 443; federation uses 8448 or the .well-known/matrix/server delegation.
server {
    listen 80;
    server_name matrix.example.org;

    location ~ ^(/_matrix|/_synapse/client) {
        proxy_pass http://127.0.0.1:8008;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        client_max_body_size 50M;
        proxy_http_version 1.1;
    }
}
