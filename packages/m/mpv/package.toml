name = "mpv"
version = "0.41.0"
release = 3
summary = "Video player based on mplayer2"
license = "GPL-2.0-or-later"
homepage = "https://mpv.io"
patches = ["caca.patch"]
hostdeps = ["meson", "pkgconf", "python-docutils", "wayland"]
builddeps = ["ffmpeg-devel", "harfbuzz-devel", "lcms2-devel", "libarchive-devel", "libass-devel", "libbluray-devel", "libcaca-devel", "libcdio-paranoia-devel", "libdisplay-info-devel", "libdrm-devel", "libdvdnav-devel", "libglvnd-devel", "libplacebo-devel", "libsixel-devel", "libva-devel", "libvdpau-devel", "libx11-devel", "libxfixes-devel", "libxinerama-devel", "libxkbcommon-devel", "libxpresent-devel", "libxrandr-devel", "libxscrnsaver-devel", "libxv-devel", "linux-headers", "lua5.1-devel", "mesa-devel", "pipewire-devel", "rubberband-devel", "uchardet-devel", "util-linux-devel", "vapoursynth-devel", "vulkan-headers", "vulkan-loader-devel", "wayland-devel", "wayland-protocols", "zimg-devel"]
rundeps = ["hicolor-icon-theme"]

source = [
    { url = "https://github.com/mpv-player/mpv/archive/v0.41.0.tar.gz", sha256 = "ee21092a5ee427353392360929dc64645c54479aefdb5babc5cfbb5fad626209" },
]

environment = '''
export LDFLAGS="${LDFLAGS} -Wl,-z,stack-size=0x100000"
'''
setup = '''
%meson \
    -Dlibmpv=true \
    -Dbuild-date=false \
    -Dtests=true \
    -Dcaca=enabled \
    -Dcdda=enabled \
    -Dcplugins=enabled \
    -Ddrm=enabled \
    -Degl=enabled \
    -Ddvbin=enabled \
    -Ddvdnav=enabled \
    -Dgl=enabled \
    -Djack=enabled \
    -Dlcms2=enabled \
    -Dlibarchive=enabled \
    -Dlibbluray=enabled \
    -Dmanpage-build=enabled \
    -Dpipewire=enabled \
    -Drubberband=enabled \
    -Dsixel=enabled \
    -Duchardet=enabled \
    -Dvapoursynth=enabled \
    -Dvaapi=enabled \
    -Dvdpau=enabled \
    -Dvulkan=enabled \
    -Dwayland=enabled \
    -Dx11=enabled \
    -Dxv=enabled \
    -Dzimg=enabled \
    -Dzlib=enabled \
    -Djavascript=disabled \
    -Dalsa=disabled \
    -Dopenal=disabled \
    -Dopensles=disabled \
    -Doss-audio=disabled \
    -Dpulse=disabled \
    -Dsdl2-audio=disabled \
    -Dsdl2-gamepad=disabled \
    -Dsdl2-video=disabled \
    -Dx11-clipboard=disabled \
    -Dlua=lua5.1
'''
build = '''
%meson_build
'''
install = '''
%meson_install
'''
