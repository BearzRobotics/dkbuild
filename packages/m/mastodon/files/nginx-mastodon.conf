# Example only (not installed into /etc): Mastodon behind nginx. Replace example.org, add TLS (required).
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}
upstream backend   { server 127.0.0.1:3000 fail_timeout=0; }
upstream streaming { server 127.0.0.1:4000 fail_timeout=0; }
server {
  listen 80;
  server_name example.org;
  root /opt/mastodon/public;
  location / { try_files $uri @proxy; }
  location ~ ^/(assets|packs|sw\.js|sw\.js\.map|emoji|avatars|headers|system/(?:media_attachments|accounts)|static|sounds) {
    add_header Cache-Control "public, max-age=2419200, must-revalidate";
    try_files $uri =404;
  }
  location ^~ /api/v1/streaming {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Proxy "";
    proxy_pass http://streaming;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
  location @proxy {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Proxy "";
    proxy_pass http://backend;
    proxy_buffering on;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
  client_max_body_size 99m;
}
