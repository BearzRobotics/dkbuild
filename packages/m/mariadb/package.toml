# MariaDB with its usual engines (InnoDB, Aria, MyRocks off, Spider); create the
# database with `mariadb-install-db --user=_mysql`, then enable the service.
name = "mariadb"
version = "13.0.2"
release = 1
summary = "MariaDB database server and client"
license = "GPL-2.0-only"
homepage = "https://mariadb.org"
hostdeps = ["cmake", "ninja", "pkgconf", "bison", "perl"]
builddeps = ["ncurses-devel", "openssl-devel", "zlib-ng-compat-devel", "libxml2-devel", "pcre2-devel", "lz4-devel", "zstd-devel", "xz-devel", "bzip2-devel", "snappy-devel", "liburing-devel", "curl-devel", "linux-headers", "heimdal-devel", "libedit-devel", "jemalloc-devel", "cracklib-devel", "fmt-devel", "linux-pam-devel"]
options = ["!check", "jobs:12"]

source = [
    { url = "https://archive.mariadb.org/mariadb-13.0.2/source/mariadb-13.0.2.tar.gz", sha256 = "8ee8d955530faedcea344535de85495afb5b98128bbf660e56893e93e21ee8f7" },
]

setup = '''
# wsrep-lib's gtid.hpp uses ssize_t without <sys/types.h> (glibc's C++ headers
# bring it in, musl's do not)
sed -i 's|^#include <iosfwd>$|#include <sys/types.h>\n#include <iosfwd>|' wsrep-lib/include/wsrep/gtid.hpp
grep -q '^#include <sys/types.h>$' wsrep-lib/include/wsrep/gtid.hpp
# and, with libc++ 23, standard headers it used to get through others
for f in wsrep-lib/include/wsrep/buffer.hpp wsrep-lib/src/id.cpp; do
    sed -i '0,/^#include/s//#include <iterator>\n#include/' "$f"
done
for f in wsrep-lib/include/wsrep/buffer.hpp wsrep-lib/include/wsrep/client_state.hpp; do
    sed -i '0,/^#include/s//#include <algorithm>\n#include/' "$f"
done
grep -q '^#include <iterator>' wsrep-lib/include/wsrep/buffer.hpp
# musl's <langinfo.h> defines ERA as a macro, and DuckDB (storage/duckdb) has
# an enum member ERA, with langinfo.h in the same unity build: undefined there
h=storage/duckdb/third_parties/duckdb/src/include/duckdb/common/enums/date_part_specifier.hpp
sed -i 's|^#include "duckdb/common/constants.hpp"$|#include "duckdb/common/constants.hpp"\n#ifdef ERA\n#undef ERA\n#endif|' $h
grep -q '^#undef ERA$' $h
%cmake \
    -DBUILD_CONFIG=mysql_release \
    -DINSTALL_LAYOUT=RPM \
    -DINSTALL_SYSCONFDIR=/etc \
    -DINSTALL_SYSCONF2DIR=/etc/my.cnf.d \
    -DINSTALL_UNIX_ADDRDIR=/run/mysqld/mysqld.sock \
    -DWITH_SYSTEMD=no \
    -DWITH_UNIT_TESTS=OFF \
    -DWITH_EMBEDDED_SERVER=ON \
    -DWITH_SSL=system \
    -DWITH_ZLIB=system \
    -DWITH_PCRE=system \
    -DWITH_LIBFMT=system \
    -DWITH_JEMALLOC=yes \
    -DPLUGIN_TOKUDB=NO \
    -DPLUGIN_MROONGA=NO \
    -DPLUGIN_ROCKSDB=NO \
    -DPLUGIN_OQGRAPH=NO \
    -DPLUGIN_CONNECT=NO \
    -DPLUGIN_SPIDER=YES
'''
build = '''
%cmake_build
'''
install = '''
%cmake_install
install -Dm644 $pkgfiles/mariadb "$pkgdir/etc/dinit.d/mariadb"
install -Dm644 $pkgfiles/sysusers.conf "$pkgdir/usr/lib/sysusers.d/mariadb.conf"
install -Dm644 $pkgfiles/tmpfiles.conf "$pkgdir/usr/lib/tmpfiles.d/mariadb.conf"
rm -rf "$pkgdir/usr/share/mysql-test" "$pkgdir/usr/mysql-test"
install -Dm644 COPYING "$pkgdir/usr/share/licenses/mariadb/COPYING"
'''
