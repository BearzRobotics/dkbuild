# Imported from Chimera Linux cports: work/cports/main/mesa/template.py
# cports is BSD-2-Clause, Copyright (c) Chimera Linux contributors.
# Driver set, flags and the LLVM 23 patch are the DKRescue desktop post's (no Intel iris yet).
# r3: Vulkan drivers for llama.cpp and ollama: radv (AMD) and lavapipe (swrast,
# any CPU). Intel anv needs libclc and SPIRV-LLVM-Translator, not built yet.
# Imported draft, untested. Dropped from Chimera's recipe: shell completions, service/tmpfiles/sysusers
# installs and cbuild env tweaks; dependency names are Chimera's and resolve from stage 0 until they are recipes.
# No X11 build dependencies (-Dplatforms=wayland, -Dglx=disabled).
# r4: dependencies on this tree's packages, not Chimera's names (built against the image's copies before).
name = "mesa"
version = "26.2.5"
release = 4
summary = "Mesa 3D Graphics Library"
license = "MIT"
homepage = "https://www.mesa3d.org"
patches = ["mesa-26.2.5-llvm23-1.patch"]
hostdeps = ["bison", "cbindgen", "flex", "glslang", "meson", "pkgconf", "python-mako", "python-ply", "python-pycparser", "python-pyyaml", "wayland", "wayland-protocols"]
builddeps = ["clang-devel", "elfutils-devel", "libarchive-devel", "libdrm-devel", "libexpat-devel", "libffi-devel", "libxml2-devel", "llvm-devel", "lua-devel", "ncurses-devel", "wayland-devel", "wayland-protocols", "zlib-ng-compat-devel", "zstd-devel", "vulkan-headers-devel"]
rundeps = []
options = ["!cross", "!lto"]

source = [
    { url = "https://archive.mesa3d.org/mesa-26.2.5.tar.xz", sha256 = "794b3d1729075dae7ebd47c7283b7ca0cdb5dec668f7f11cc0a5d82f6138a0a5" },
]

setup = '''
%meson \
    -Dplatforms=wayland \
    -Dgallium-drivers=llvmpipe,radeonsi,r600,nouveau,virgl,svga \
    -Dvulkan-drivers=amd,swrast \
    -Dglx=disabled \
    -Dglvnd=disabled \
    -Degl=enabled \
    -Dgbm=enabled \
    -Dgles1=disabled \
    -Dgles2=enabled \
    -Dllvm=enabled \
    -Dshared-llvm=enabled \
    -Dcpp_rtti=false \
    -Dgallium-va=disabled \
    -Dgallium-rusticl=false \
    -Dvideo-codecs= \
    -Dvalgrind=disabled \
    -Dlibunwind=disabled \
    -Dlmsensors=disabled \
    -Dzstd=enabled \
    -Dbuild-tests=false
'''
build = '''
%meson_build
'''
install = '''
%meson_install
install -Dm644 docs/license.rst "$pkgdir/usr/share/licenses/mesa/license.rst"
'''
