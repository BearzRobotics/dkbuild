setup = '''
mkdir -p subprojects/packagecache
cp /build/sources/*.tar.gz subprojects/packagecache/
export CARGO_HOME=/tmp/cargo-home
%meson \
    --wrap-mode=nodownload \
    -Db_ndebug=true \
    -Dplatforms=x11,wayland \
    -Dgallium-drivers=llvmpipe,softpipe,radeonsi,r300,r600,nouveau,iris,crocus,i915,virgl,svga,zink \
    -Dvulkan-drivers=amd,intel,intel_hasvk,nouveau,swrast,virtio \
    -Dglx=dri \
    -Dglvnd=enabled \
    -Degl=enabled \
    -Dgbm=enabled \
    -Dgles1=enabled \
    -Dgles2=enabled \
    -Dllvm=enabled \
    -Dshared-llvm=enabled \
    -Dgallium-rusticl=true \
    -Dgallium-va=enabled \
    -Dvideo-codecs=all \
    -Dlmsensors=enabled \
    -Dvalgrind=disabled \
    -Dlibunwind=disabled \
    -Dzstd=enabled \
    -Dbackend_max_links=4 \
    -Dbuild-tests=false
'''
build = '''
%meson_build
'''
install = '''
%meson_install
install -Dm644 docs/license.rst "$pkgdir/usr/share/licenses/mesa/license.rst"
'''
