# cports is BSD-2-Clause, Copyright (c) Chimera Linux contributors.
# Driver set, flags and the LLVM 23 patch are the DKRescue desktop post's (no Intel iris yet).
# r3: Vulkan drivers for llama.cpp and ollama: radv (AMD) and lavapipe (swrast,
# any CPU). Intel anv needs libclc and SPIRV-LLVM-Translator, not built yet.
# Imported draft, untested. Dropped from Chimera's recipe: shell completions, service/tmpfiles/sysusers
# installs and cbuild env tweaks; dependency names are Chimera's and resolve from stage 0 until they are recipes.
# No X11 build dependencies (-Dplatforms=wayland, -Dglx=disabled).
# r4: dependencies on this tree's packages, not Chimera's names (built against the image's copies before).
# r5: static libraries too (in mesa-static), for fully static programs on musl.
# r6: X11 and Wayland, GLX through glvnd, VA-API (all codecs), Intel (iris, crocus,
#     i915, anv, hasvk), NVIDIA NVK, zink, Rusticl (OpenCL), lm-sensors. The Rust
#     crates meson's wraps would download are sources, copied to its packagecache.
name = "mesa"
version = "26.2.5"
release = 6
summary = "Mesa 3D Graphics Library"
license = "MIT"
homepage = "https://www.mesa3d.org"
patches = ["mesa-26.2.5-llvm23-1.patch"]
hostdeps = ["bindgen", "bison", "cbindgen", "flex", "glslang", "meson", "pkgconf", "python-mako", "python-ply", "python-pycparser", "python-pyyaml", "rust", "wayland", "wayland-protocols"]
builddeps = ["llvm-devel", "elfutils-devel", "libarchive-devel", "libclc", "libdrm-devel", "libexpat-devel", "libffi-devel", "libglvnd-devel", "libva-devel", "libx11-devel", "libxcb-devel", "libxdamage-devel", "libxext-devel", "libxfixes-devel", "libxml2-devel", "libxrandr-devel", "libxshmfence-devel", "libxv-devel", "libxxf86vm-devel", "lm-sensors-devel", "lua-devel", "ncurses-devel", "spirv-llvm-translator-devel", "spirv-tools-devel", "vulkan-headers-devel", "wayland-devel", "wayland-protocols", "zlib-ng-compat-devel", "zstd-devel"]
rundeps = []
options = ["!cross", "!lto"]

