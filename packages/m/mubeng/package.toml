# An incredibly fast proxy checker & IP rotator with ease. (BlackArch list, requested 2026-11-16; docs/requests.md). Written from the template of ffuf; not built yet when written (wip/queue): expect first-build fixes.
# Go module, dependencies fetched on the host (godeps). Main package: ..
name = "mubeng"
version = "0.23.0"
release = 1
summary = "An incredibly fast proxy checker & IP rotator with ease."
license = "Apache-2.0"
homepage = "https://github.com/kitabisa/mubeng"
hostdeps = ["go"]
options = ["!check", "godeps"]

source = [
    { url = "https://github.com/kitabisa/mubeng/archive/refs/tags/v0.23.0.tar.gz", sha256 = "57a4e10f25ec5e70fafc97cb21a13ffffdc63d3b8004055318ea0ecd1ab63507" },
]

environment = '''
export GOFLAGS="-mod=mod -trimpath -buildvcs=false" GOTOOLCHAIN=local GOPROXY=off
export GOCACHE=/tmp/go-cache GOPATH=/tmp/go CGO_ENABLED=0
'''
build = '''
mkdir -p build
go build -o build/mubeng .
'''
install = '''
install -Dm755 build/mubeng "$pkgdir/usr/bin/mubeng"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/mubeng/LICENSE"
'''
