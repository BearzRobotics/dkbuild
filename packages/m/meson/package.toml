# The Meson build system (pure Python), from this tree rather than the base
# image's: 69 recipes build with it. Uses the tree's ninja.
name = "meson"
version = "1.12.1"
release = 1
summary = "Meson build system"
license = "Apache-2.0"
homepage = "https://mesonbuild.com"
hostdeps = ["python", "python-setuptools"]
rundeps = ["python", "ninja"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/f9/c9/8c9983f4f3d9c4e22fd76bcf8cd053e4472aefae45fd044669b6daa34b53/meson-1.12.1.tar.gz", sha256 = "ab0a6ca09f8ef70c564c8241fb5a23957886a0b53fb58412b5e07eaf07dba743" },
]

install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 data/shell-completions/bash/meson "$pkgdir/usr/share/bash-completion/completions/meson"
install -Dm644 data/shell-completions/zsh/_meson "$pkgdir/usr/share/zsh/site-functions/_meson"
install -Dm644 man/meson.1 "$pkgdir/usr/share/man/man1/meson.1"
install -Dm644 COPYING "$pkgdir/usr/share/licenses/meson/COPYING"
'''
