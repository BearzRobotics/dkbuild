# FenrirOS: a prebuilt musl JDK 17 (Chimera's) as the seed for building openjdk17, as
# Go and Rust start from a binary; it is only a build dependency.
name = "openjdk17-bootstrap"
version = "17.0.7_p5"
release = 1
summary = "Prebuilt OpenJDK 17 to build OpenJDK 17 with"
license = "GPL-2.0-only WITH Classpath-exception-2.0"
homepage = "https://openjdk.org"
archs = ["x86_64"]
hostdeps = []
options = ["!check"]

source = [
    { url = "https://repo.chimera-linux.org/distfiles/openjdk-bootstrap-17.0.7_p5-x86_64.tar.xz", sha256 = "b0053f81d28e640ad96488d5b19d753a307643b7f7df0a5801cd0353eeb985bb" },
]

install = '''
install -dm755 "$pkgdir/usr/lib/jvm/java-17-openjdk"
cp -a . "$pkgdir/usr/lib/jvm/java-17-openjdk/"
'''
