# Example nginx site for OpenProject (copy into your nginx configuration and
# adapt; add TLS before using it beyond localhost). Static files come from
# /opt/openproject/public, the rest goes to Puma on 127.0.0.1:8080.

upstream openproject {
    server 127.0.0.1:8080;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    server_tokens off;

    root /opt/openproject/public;
    client_max_body_size 256M;

    location /assets/ {
        expires max;
        try_files $uri @openproject;
    }

    # collaborative editing (the openproject-hocuspocus service, optional)
    location /hocuspocus {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 86400;
        proxy_pass http://127.0.0.1:1234/;
    }

    location / {
        try_files $uri @openproject;
    }

    location @openproject {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_read_timeout 300;
        proxy_pass http://openproject;
    }
}
