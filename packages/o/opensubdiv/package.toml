name = "opensubdiv"
version = "3.7.0"
release = 1
summary = "Surface subdivision library"
license = "Apache-2.0"
homepage = "https://graphics.pixar.com/opensubdiv/docs/intro.html"
hostdeps = ["cmake", "ninja"]
builddeps = ["glfw-devel", "openmp-devel", "libxcursor-devel", "libxi-devel", "libxinerama-devel", "libxrandr-devel", "libxxf86vm-devel", "mesa-devel", "ocl-icd-devel", "onetbb-devel", "zlib-ng-compat-devel"]

source = [
    { url = "https://github.com/PixarAnimationStudios/OpenSubdiv/archive/refs/tags/v3_7_0.tar.gz", sha256 = "f843eb49daf20264007d807cbc64516a1fed9cdb1149aaf84ff47691d97491f9" },
]

environment = '''
# std::abs without <cstdlib> (libc++ 23 no longer pulls it in)
export CXXFLAGS="$CXXFLAGS -include cstdlib"
export LDFLAGS="${LDFLAGS} -lomp"
'''
setup = '''
%cmake \
    -DNO_CLEW=ON \
    -DNO_CUDA=ON \
    -DNO_DOC=ON \
    -DNO_EXAMPLES=ON \
    -DNO_GLTESTS=ON \
    -DNO_PTEX=ON \
    -DNO_TUTORIALS=ON
'''
build = '''
%cmake_build
'''
install = '''
%cmake_install
'''
