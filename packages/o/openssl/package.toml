# Follows the DKRescue post's build of openssl 3.6.1; the importer's draft of
# Chimera's recipe was not used.
name = "openssl"
version = "3.6.1"
release = 7
summary = "TLS and cryptography library"
license = "Apache-2.0"
homepage = "https://www.openssl.org"
builddeps = ["zlib-ng-compat-devel"]
options = ["bootstrap", "!check"]

source = [
    { url = "https://github.com/openssl/openssl/releases/download/openssl-3.6.1/openssl-3.6.1.tar.gz", sha256 = "b1bfedcd5b289ff22aee87c9d600f515767ebf45f77168cb6d64f231f518a82e" },
]

setup = '''
CC=clang ./config --prefix=/usr --openssldir=/etc/ssl --libdir=lib shared zlib-dynamic
'''
build = '''
make -j$jobs
'''
install = '''
sed -i '/INSTALL_LIBS/s/libcrypto.a libssl.a//' Makefile
make DESTDIR=$pkgdir MANSUFFIX=ssl install
'''
