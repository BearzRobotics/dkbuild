# Follows the DKRescue post's build of openssl 3.6.1; the importer's draft of
# Chimera's recipe was not used.
# r11: the static libraries too (openssl-static), as every library ships them;
# r10 and earlier removed them from the install (no reason recorded).
name = "openssl"
# The 3.5 series is the long-term one (supported to 2030-04-08). The tree moved down to it from 3.6 on 2026-11-25, when
# openssl-library.org no longer listed 3.6 as supported. 3.6 added 23 functions to libcrypto and removed none; of the
# 261 built packages that link OpenSSL only osslsigncode used one (it is rebuilt with the rest). Installed 3.6 systems
# do not move down by a plain `apk upgrade` (`apk upgrade --available`). Next: a 4.x long-term release (upstream plans
# one each April of an odd year). upstream.toml keeps the update check on 3.5.
version = "3.5.9"
release = 2
# Security patches from Alpine Linux (aports, master main/openssl), added 2026-11-27: CVE-2026-107496.patch, CVE-2026-88822.patch, CVE-2026-88823.patch, CVE-2026-95691.patch, CVE-2026-95692.patch
patches = ["CVE-2026-107496.patch", "CVE-2026-88822.patch", "CVE-2026-88823.patch", "CVE-2026-95691.patch", "CVE-2026-95692.patch"]
summary = "TLS and cryptography library"
license = "Apache-2.0"
homepage = "https://www.openssl.org"
builddeps = ["zlib-ng-compat-devel"]
options = ["bootstrap", "!check"]

source = [
    { url = "https://github.com/openssl/openssl/releases/download/openssl-3.5.9/openssl-3.5.9.tar.gz", sha256 = "603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a" },
]

setup = '''
CC=clang ./config --prefix=/usr --openssldir=/etc/ssl --libdir=lib shared zlib-dynamic
'''
build = '''
make -j$jobs
'''
install = '''
make DESTDIR=$pkgdir MANSUFFIX=ssl install
'''
