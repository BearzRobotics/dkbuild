# After Chimera Linux cports: main/opus. cports is BSD-2-Clause, Copyright (c) Chimera Linux contributors.
# needed by: opusfile, libsndfile, sox_ng.
name = "opus"
version = "1.6.1"
release = 1
summary = "Opus audio codec"
license = "BSD-3-Clause"
homepage = "https://opus-codec.org"
hostdeps = ["meson", "pkgconf"]

source = [
    { url = "https://downloads.xiph.org/releases/opus/opus-1.6.1.tar.gz", sha256 = "6ffcb593207be92584df15b32466ed64bbec99109f007c82205f0194572411a1" },
]

setup = '''
%meson \
    -Dcustom-modes=true \
    -Ddeep-plc=enabled \
    -Ddred=enabled \
    -Dosce=enabled \
    -Dfloat-approx=true \
    -Ddocs=disabled \
    -Dtests=enabled
'''
build = '''
%meson_build
'''
check = '''
meson test -C build
'''
install = '''
%meson_install
install -Dm644 COPYING "$pkgdir/usr/share/licenses/opus/COPYING"
'''
