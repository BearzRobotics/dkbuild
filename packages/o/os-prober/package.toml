# needed by: grub (grub-mkconfig lists other installed systems).
name = "os-prober"
version = "1.83"
release = 1
summary = "Finds other operating systems for boot menus"
license = "GPL-2.0-or-later"
homepage = "https://salsa.debian.org/installer-team/os-prober"
options = ["!check"]

source = [
    { url = "https://deb.debian.org/debian/pool/main/o/os-prober/os-prober_1.83.tar.xz", sha256 = "8c82d5084c2b6f8935f6633612f18d16d04a0deffd6b99c264985fb7204140a6" },
]

build = '''
%make newns
'''
install = '''
install -Dm755 os-prober "$pkgdir/usr/bin/os-prober"
install -Dm755 linux-boot-prober "$pkgdir/usr/bin/linux-boot-prober"
install -Dm755 newns "$pkgdir/usr/lib/os-prober/newns"
install -Dm644 common.sh "$pkgdir/usr/share/os-prober/common.sh"
for d in os-probes os-probes/mounted os-probes/init linux-boot-probes linux-boot-probes/mounted; do
    install -dm755 "$pkgdir/usr/lib/$d"
    for f in $d/common/*; do [ -f "$f" ] && install -m755 "$f" "$pkgdir/usr/lib/$d/"; done
    for f in $d/x86/*; do [ -f "$f" ] && install -m755 "$f" "$pkgdir/usr/lib/$d/"; done
done
install -Dm644 debian/copyright "$pkgdir/usr/share/licenses/os-prober/copyright"
'''
