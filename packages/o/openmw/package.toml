# OpenMW: open-source engine reimplementation for The Elder Scrolls III:
# Morrowind (GPL-3.0), with the OpenMW-CS content editor. It needs the user's
# own copy of Morrowind's data files (not included, proprietary).
# Bullet 3.17 and recastnavigation are fetched by OpenMW's CMake with
# FetchContent; here they are the 2nd and 3rd source and copied to
# build/extern/fetched/ where the CMake file looks first (offline build).
# (OPENMW_USE_SYSTEM_BULLET=OFF because OpenMW needs a Bullet built with its
# own double-precision/flags configuration.)
# Paths are sanitised: global config and data in /usr/share, icon in the hicolor tree.
name = "openmw"
version = "0.51.0"
release = 1
summary = "Open implementation of Morrowind's engine"
license = "GPL-3.0-or-later"
homepage = "https://openmw.org"
hostdeps = ["cmake", "ninja", "pkgconf", "qt6-qtbase", "qt6-qttools"]
builddeps = ["boost-devel", "ffmpeg-devel", "libxt-devel", "luajit-devel", "lz4-devel", "mygui-devel", "openal-soft-devel", "openscenegraph-devel", "qt6-qtbase-devel", "qt6-qtsvg-devel", "qt6-qttools-devel", "sdl2-compat-devel", "unshield-devel", "yaml-cpp-devel", "mesa-devel", "libx11-devel", "zlib-ng-compat-devel", "bzip2-devel"]
options = ["jobs:12", "!check"]  # the unit tests are off (BUILD_UNITTESTS defaults to OFF)

source = [
    { url = "https://gitlab.com/OpenMW/openmw/-/archive/openmw-0.51.0/openmw-openmw-0.51.0.tar.gz", sha256 = "7a65e63a5687ff0d51f319ebd529a9e93770fed3cc5408201de4588d1140f144" },
    { url = "https://github.com/recastnavigation/recastnavigation/archive/c393777d26d2ff6519ac23612abf8af42678c9dd.zip", sha256 = "7d7fc38c9a52dbda0ba1dab70d1ed59da1178ab1c4fa209cdb7cc2dcfce8e4ea" },
    { url = "https://github.com/bulletphysics/bullet3/archive/refs/tags/3.17.tar.gz", sha256 = "baa642c906576d4d98d041d0acb80d85dd6eff6e3c16a009b1abf1ccd2bc0a61" },
]

setup = '''
mkdir -p build/extern/fetched
cp -a ../recastnavigation-c393777d26d2ff6519ac23612abf8af42678c9dd build/extern/fetched/recastnavigation
cp -a ../bullet3-3.17 build/extern/fetched/bullet
%cmake \
    -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
    -DBUILD_OPENCS=ON \
    -DGLOBAL_CONFIG_PATH=/usr/share \
    -DGLOBAL_DATA_PATH=/usr/share \
    -DICONDIR=/usr/share/icons/hicolor/256x256/apps \
    -DOPENMW_USE_SYSTEM_BULLET=OFF \
    -DOPENMW_LTO_BUILD=ON
'''
build = '''
%cmake_build
'''
install = '''
%cmake_install
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/openmw/LICENSE"
'''

[subpackages.cs]
summary = "OpenMW-CS content editor"
paths = ["/usr/bin/openmw-cs", "/usr/share/applications/org.openmw.cs.desktop", "/usr/share/icons/hicolor/256x256/apps/openmw-cs.png", "/usr/share/openmw/defaults-cs.bin"]

[subpackages.esmtool]
summary = "Tool for inspecting and extracting Morrowind ESM files"
paths = ["/usr/bin/esmtool"]

[subpackages.bsatool]
summary = "Tool for inspecting Bethesda BSA archives"
paths = ["/usr/bin/bsatool"]
