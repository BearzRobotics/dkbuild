name = "openh264"
version = "2.6.0"
release = 2
summary = "H.264 codec implementation"
license = "BSD-2-Clause"
homepage = "https://github.com/cisco/openh264"
patches = ["no-install-rebuild.patch"]
hostdeps = ["nasm", "pkgconf"]

source = [
    { url = "https://github.com/cisco/openh264/archive/v2.6.0.tar.gz", sha256 = "558544ad358283a7ab2930d69a9ceddf913f4a51ee9bf1bfb9e377322af81a69" },
    { url = "https://github.com/mozilla/gmp-api/archive/refs/tags/Firefox135.tar.gz", sha256 = "939be3596292ff445bf3cd5454a03041f68258444f7fff023a0bac17b238b40f" },
]

build = '''
# the library only: the Firefox media plugin (plugin) needs Mozilla's
# gmp-api headers, which its build downloads
%make \
    BUILDTYPE=Release \
    CFLAGS_OPT= \
    ENABLEPIC=Yes \
    HAVE_AVX2=No \
    libraries
'''
check = '''
%make test
'''
install = '''
%make_install \
    STRIP=true \
    PREFIX=/usr
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/openh264/LICENSE"
# grab the main pkgver lib
# symlinks; ensure the soname is right
# manifest file
# profile and other stuff
install -Dm644 $pkgfiles/prefs.js "$pkgdir/usr/lib/firefox/defaults/pref/gmpopenh264.js"
p=usr/lib/nsbrowser/plugins/gmp-gmpopenh264/system-installed
v=$(ls "$pkgdir"/usr/lib/libopenh264.so.*.*.* | head -n1); v=${v##*libopenh264.so.}
install -Dm755 libgmpopenh264.so.$v "$pkgdir/$p/libgmpopenh264.so.$v"
ln -s libgmpopenh264.so.$v "$pkgdir/$p/libgmpopenh264.so.8"
ln -s libgmpopenh264.so.8 "$pkgdir/$p/libgmpopenh264.so"
install -Dm644 $pkgfiles/gmpopenh264.info "$pkgdir/$p/gmpopenh264.info"
install -Dm644 $pkgfiles/profile.conf "$pkgdir/etc/profile.d/firefox-openh264.sh"
install -Dm644 $pkgfiles/prefs.js "$pkgdir/usr/lib/firefox/defaults/pref/gmpopenh264.js"
'''
