# After Chimera Linux cports: main/opusfile. cports is BSD-2-Clause, Copyright (c) Chimera Linux contributors.
# needed by: sox_ng (reading .opus files).
name = "opusfile"
version = "0.12"
release = 1
summary = "Library for opening, seeking and decoding .opus files"
license = "BSD-3-Clause"
homepage = "https://opus-codec.org"
hostdeps = ["automake", "libtool", "pkgconf"]
builddeps = ["libogg-devel", "opus-devel", "openssl-devel"]

source = [
    { url = "https://downloads.xiph.org/releases/opus/opusfile-0.12.tar.gz", sha256 = "118d8601c12dd6a44f52423e68ca9083cc9f2bfe72da7a8c1acb22a80ae3550b" },
]

setup = '''
%configure --disable-doc
'''
build = '''
%make
'''
check = '''
make check
'''
install = '''
%make_install
install -Dm644 COPYING "$pkgdir/usr/share/licenses/opusfile/COPYING"
'''
