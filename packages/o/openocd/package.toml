# Debugs and flashes ARM, RISC-V and other chips over JTAG/SWD (ST-Link, CMSIS-DAP,
# FTDI, Raspberry Pi GPIO, ...). With its udev rules for the adapters.
#
# A snapshot of its main branch (snapshot:git, pinned by commit): 0.12.0 (2023,
# the last release) only knows libgpiod's 1.x API, and the tree has libgpiod
# 2; the main branch has the 2.x API. It uses the system's Jim Tcl (jimtcl).
name = "openocd"
version = "0.12.0_git20261110"
release = 2
summary = "On-chip debugger and programmer (JTAG/SWD)"
license = "GPL-2.0-or-later"
homepage = "https://openocd.org"
hostdeps = ["autoconf", "automake", "libtool", "pkgconf", "texinfo", "bash"]
builddeps = ["jimtcl-devel", "hidapi-devel", "libftdi1-devel", "libgpiod-devel", "libusb-devel", "capstone-devel", "linux-headers"]
options = ["!check"]

source = [
    { url = "snapshot:git https://github.com/openocd-org/openocd.git 4900bcdfc82848e9cfa7f895b39aca6b9ca4b911", sha256 = "222deedc257daf1d4a9d9bbd873393e92aa0c4afa656dd95785f2347e2832322" },
]

setup = '''
# a git snapshot: configure is generated (its ./bootstrap would also run git)
autoreconf -fi
# its configure is bash (`==` in test)
export CONFIG_SHELL=/bin/bash
bash %configure \
    --disable-werror \
    --enable-sysfsgpio \
    --enable-linuxgpiod \
    --enable-remote-bitbang \
    --enable-cmsis-dap \
    --enable-ftdi \
    --enable-stlink \
    --enable-jlink=no
'''
build = '''
# not %make: CC on the command line reaches jimtcl's sub-make, where it
# overrides its CC += -I. (configure has the compiler already)
make -j$jobs
'''
install = '''
%make_install
install -Dm644 contrib/60-openocd.rules "$pkgdir/usr/lib/udev/rules.d/60-openocd.rules"
install -Dm644 COPYING "$pkgdir/usr/share/licenses/openocd/COPYING"
'''
