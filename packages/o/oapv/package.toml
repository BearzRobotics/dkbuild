# OpenAPV (Advanced Professional Video, ACES/Academy Software Foundation);
# FFmpeg's --enable-liboapv. Its CMake builds the shared and the static
# library in one tree (OAPV_BUILD_SHARED_LIB/OAPV_BUILD_STATIC_LIB, both ON).
# ENABLE_TESTS=OFF: the tests need test vectors that are not in the tarball.
# Not imported from cports (Chimera has no oapv).
# needed by: ffmpeg (liboapv).
name = "oapv"
version = "1.1.3.0"
release = 1
summary = "OpenAPV Advanced Professional Video codec"
license = "BSD-3-Clause"
homepage = "https://github.com/AcademySoftwareFoundation/openapv"
hostdeps = ["cmake", "ninja", "pkgconf"]
options = ["!check"]

source = [
    { url = "https://github.com/AcademySoftwareFoundation/openapv/archive/refs/tags/v1.1.3.0.tar.gz", sha256 = "38f841ce44e80c40b682a5323b4f3ebc6e339b6071965bc1c705a17d46ab2fc8" },
]

setup = '''
%cmake \
    -DOAPV_BUILD_SHARED_LIB=ON \
    -DOAPV_BUILD_STATIC_LIB=ON \
    -DOAPV_BUILD_APPS=ON \
    -DENABLE_TESTS=OFF
'''
build = '''
%cmake_build
'''
install = '''
%cmake_install
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/oapv/LICENSE"
'''
