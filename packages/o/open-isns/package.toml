# open-isns: iSNS (Internet Storage Name Service) library, client tools and
# server. Written for open-iscsi, whose iscsid/iscsiadm use libisns for iSNS
# target discovery. Shared and static libisns. With message authentication
# (security, OpenSSL's libcrypto).
# Left out: SLP registration (-Dslp): it needs OpenSLP, unmaintained since 2012
# (last release 2.0.0) and the subject of the SLP reflection/amplification
# CVE-2023-29552; not packaged.
# Inert: isnsd ships with a dinit service that is not enabled, no keys
# (isnssetup makes them), no systemd units. README.FenrirOS says how to set it up.
name = "open-isns"
version = "0.103"
release = 2
summary = "iSNS server, client tools and library"
license = "LGPL-2.1-or-later"
homepage = "https://github.com/open-iscsi/open-isns"
hostdeps = ["meson", "ninja", "pkgconf"]
builddeps = ["openssl-devel"]
checkdeps = ["python"]
# The tests start isnsd and talk to it over sockets, and sign with keys
# generated by openssl at run time.
options = ["!check"]

source = [
    { url = "https://github.com/open-iscsi/open-isns/archive/refs/tags/v0.103.tar.gz", sha256 = "47499f3ce87a832840884dcf3eedbec8c039f472fe921a5378e3b206a3fc1a32" },
]

setup = '''
# meson's default libdir here is lib64: libraries go in /usr/lib
%meson --libdir=lib -Dsecurity=enabled -Dslp=disabled -Drundir=/run
'''
build = '''
%meson_build
'''
install = '''
%meson_install
rm -rf "$pkgdir/usr/lib/systemd"
install -Dm644 $pkgfiles/isnsd "$pkgdir/etc/dinit.d/isnsd"
install -Dm644 $pkgfiles/tmpfiles.conf "$pkgdir/usr/lib/tmpfiles.d/open-isns.conf"
install -Dm644 $pkgfiles/README.FenrirOS "$pkgdir/usr/share/doc/open-isns/README.FenrirOS"
'''
