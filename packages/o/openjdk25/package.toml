# FenrirOS: the JDK in /usr/lib/jvm/java-25-openjdk; java-common makes it the system's
# Java through /usr/lib/jvm/default (java-select). One package with the JDK (Chimera splits jre-headless/jre/jdk/jmods/demos).
# The JDK's own CA truststore is kept (no system Java keystore is generated yet).
# Imported from Chimera Linux cports: /tmp/claude-1000/-stuff-git-dkbuild/d8b7a1e7-c48c-4fe9-b3a3-e71798cac65d/scratchpad/cports-full/main/openjdk25/template.py
# cports is BSD-2-Clause, Copyright (c) Chimera Linux contributors.
# DRAFT, made by `dkbuild import-cbuild`: review every "TODO(cbuild)" and the
# dependency names (they are Chimera's) before building.
name = "openjdk25"
version = "25.0.5.0.3_p1"
release = 1
summary = "OpenJDK 25 (Java development kit and runtime)"
license = "GPL-2.0-only WITH Classpath-exception-2.0"
homepage = "https://openjdk.org"
patches = ["JDK-8218814_Wformat-security.patch", "JDK-8299245_disable-tests.patch", "ppc64le.patch", "riscv64.patch"]
archs = ["x86_64", "aarch64"]
hostdeps = ["autoconf", "automake", "bash", "file", "libtool", "linux-headers", "openjdk25-bootstrap", "openssl", "pkgconf", "zip", "unzip", "zlib-ng-compat-devel"]
builddeps = ["alsa-lib-devel", "cups-devel", "fontconfig-devel", "freetype-devel", "giflib-devel", "lcms2-devel", "libjpeg-turbo-devel", "libxrandr-devel", "libxrender-devel", "libxt-devel", "libxtst-devel", "linux-headers"]
rundeps = ["java-common"]
options = ["!check", "jobs:12"]

source = [
    { url = "https://github.com/openjdk/jdk25u/archive/jdk-25.0.5.0.3+1.tar.gz", sha256 = "957a4712571f8000851e5331a1b1510fe814771e05492b32ac828e5f55e6b4a6" },
]
environment = '''
export LD_LIBRARY_PATH=/usr/lib/jvm/java-25-openjdk/lib:/usr/lib/jvm/java-25-openjdk/lib/server
'''
setup = '''
# Built by the seed JDK (openjdk25-bootstrap, a prebuilt musl JDK), which is
# installed where this one goes; the seed is only ever a build dependency.
# no javac server (a background compile daemon reached over a socket, which
# the build sandbox does not allow): javac runs per batch instead.
# OpenJDK's configure wants CC to be a bare program name: the --target (and
# any --sysroot) the profile puts in CC go into the extra flags instead
tflags=${CC#clang }
CC=clang CXX=clang++ bash ./configure \
    --prefix=/usr/lib/jvm/java-25-openjdk \
    --with-boot-jdk=/usr/lib/jvm/java-25-openjdk \
    --with-jobs=$jobs \
    --with-extra-cflags="$tflags $CFLAGS" \
    --with-extra-cxxflags="$tflags $CXXFLAGS" \
    --with-extra-ldflags="$tflags $LDFLAGS" \
    --disable-warnings-as-errors \
    --disable-javac-server \
    --disable-precompiled-headers \
    --enable-dtrace=no \
    --with-jvm-variants=server \
    --with-zlib=system \
    --with-libjpeg=system \
    --with-libpng=system \
    --with-giflib=system \
    --with-lcms=system \
    --with-jtreg=no \
    --with-debug-level=release \
    --with-native-debug-symbols=none \
    --with-toolchain-type=clang \
    --with-version-pre= \
    --with-version-build=1 \
    --with-version-opt=fenriros-r$release \
    --with-vendor-name=FenrirOS \
    --with-vendor-url=https://github.com/BearzRobotics/dkbuild \
    --with-vendor-bug-url=https://github.com/BearzRobotics/dkbuild/issues \
    --with-vendor-vm-bug-url=https://github.com/BearzRobotics/dkbuild/issues
'''
build = '''
make JOBS=$jobs jdk-image
'''
install = '''
d="$pkgdir/usr/lib/jvm/java-25-openjdk"
mkdir -p "$d"
cp -a build/*/images/jdk/. "$d/"
install -m644 ASSEMBLY_EXCEPTION LICENSE README.md "$d/"
# The JDK keeps its own CA truststore (lib/security/cacerts).
'''

