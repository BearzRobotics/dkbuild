# osTicket under nginx with php-fpm (/run/php-fpm.sock). Copy to
# /etc/nginx/http.d/osticket.conf, set server_name and TLS, and add nginx's
# user to the _php group so it can reach the socket.
server {
    listen 80;
    server_name helpdesk.example.org;
    root /usr/share/osticket;
    index index.php;
    client_max_body_size 32M;

    location ~ ^/(include|setup/inc)/ { deny all; }
    location ~ ^/api/(?:tickets|tasks).*$ { try_files $uri $uri/ /api/http.php?$query_string; }
    location ~ ^/scp/ajax.php/.*$ { try_files $uri $uri/ /scp/ajax.php?$query_string; }
    location ~ ^/ajax.php/.*$ { try_files $uri $uri/ /ajax.php?$query_string; }
    location / { try_files $uri $uri/ index.php; }
    location ~ \.php(/|$) {
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        try_files $fastcgi_script_name =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_pass unix:/run/php-fpm.sock;
    }
}
