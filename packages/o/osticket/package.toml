# osTicket: web help desk (tickets from email, the web portal and the API;
# departments, queues, SLAs). PHP with MariaDB, served by nginx and php-fpm.
# Upstream's release archive (its PHP libraries, laminas-mail and mPDF, are
# in it as PHP source). Layout: code in /usr/share/osticket, configuration in
# /etc/osticket, logs in /var/log/osticket; scheduled tasks from an
# example cron job (installed by the user). Setup: /usr/share/doc/osticket/README.FenrirOS.
# Installed inert (docs/requests.md): no service enabled, no site, no cron
# job, no credentials; the README says how to set it up.
name = "osticket"
version = "1.18.4"
release = 1
summary = "Web-based help desk ticketing system"
license = "GPL-2.0-only"
homepage = "https://osticket.com"
archs = ["x86_64", "aarch64"]
rundeps = ["php", "php-fpm", "nginx"]
options = ["!check", "!strip"]

source = [
    { url = "https://github.com/osTicket/osTicket/releases/download/v1.18.4/osTicket-v1.18.4.zip", sha256 = "a4187df5f52dd41625e6b61b322245853542e12b5969a45f0a6d81f7ab8151a7" },
]

install = '''
d="$pkgdir/usr/share/osticket"
mkdir -p "$d"
cp -a /build/upload/. "$d/"
install -Dm640 "$d/include/ost-sampleconfig.php" "$pkgdir/etc/osticket/ost-config.php"
ln -s /etc/osticket/ost-config.php "$d/include/ost-config.php"
install -Dm644 /build/scripts/rcron.php "$pkgdir/usr/share/doc/osticket/scripts/rcron.php"
install -Dm644 $pkgfiles/osticket.cron "$pkgdir/usr/share/doc/osticket/osticket.cron"
install -Dm644 $pkgfiles/tmpfiles.conf "$pkgdir/usr/lib/tmpfiles.d/osticket.conf"
install -Dm644 $pkgfiles/nginx-osticket.conf "$pkgdir/usr/share/doc/osticket/nginx-osticket.conf"
install -Dm644 $pkgfiles/README.FenrirOS "$pkgdir/usr/share/doc/osticket/README.FenrirOS"
'''
