name = "openldap"
version = "2.6.13"
release = 2
summary = "FOSS implementation of the Lightweight Directory Access Protocol"
license = "OLDAP-2.8"
homepage = "https://www.openldap.org"
hostdeps = ["automake", "libtool", "mandoc", "pkgconf"]
builddeps = ["libevent-devel", "libsasl-devel", "libsodium-devel", "libtool-devel", "openssl-devel"]

source = [
    { url = "https://www.openldap.org/software/download/OpenLDAP/openldap-release/openldap-2.6.13.tgz", sha256 = "d693b49517a42efb85a1a364a310aed16a53d428d1b46c0d31ef3fba78fcb656" },
