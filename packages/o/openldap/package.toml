setup = '''
autoreconf -if -W none
%configure \
    --disable-debug \
    --disable-slapd \
    --disable-sql \
    --disable-static \
    --disable-versioning \
    --disable-wt \
    --enable-backends=mod \
    --enable-crypt \
    --enable-dynamic \
    --enable-modules \
    --enable-overlays=mod \
    --enable-rlookups \
    --enable-spasswd \
    --enable-syslog \
    --with-cyrus-sasl \
    --with-tls=openssl
'''
build = '''
%make
'''
check = '''
%make check
'''
install = '''
%make_install
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/openldap/LICENSE"
