# OpenShot: video editor (Python with PyQt6, on libopenshot).
name = "openshot"
version = "4.1.1"
release = 1
summary = "Video editor"
license = "GPL-3.0-or-later"
homepage = "https://www.openshot.org"
hostdeps = ["python", "python-setuptools"]
builddeps = ["python-devel"]
rundeps = ["libopenshot", "python", "python-pyqt6", "qt6-qtscxml", "qt6-qtsvg", "python-requests", "python-defusedxml", "ffmpeg"]
options = ["!check"]

source = [
    { url = "https://github.com/OpenShot/openshot-qt/archive/refs/tags/v4.1.1.tar.gz", sha256 = "d444b2ad74c19f1c2f1360c705d06cc984dae4f658f6c81e7a4373a5fb2db542" },
]

install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
'''
