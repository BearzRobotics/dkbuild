# Flask from PyPI.
name = "python-flask"
version = "3.1.3"
release = 1
summary = "A simple framework for building complex web applications."
license = "BSD-3-Clause"
homepage = "https://pypi.org/project/Flask/"
hostdeps = ["python", "python-flit-core"]
rundeps = ["python", "python-blinker", "python-click", "python-itsdangerous", "python-jinja2", "python-markupsafe", "python-werkzeug"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/26/00/35d85dcce6c57fdc871f3867d465d780f302a175ea360f62533f12b27e2b/flask-3.1.3.tar.gz", sha256 = "0ef0e52b8a9cd932855379197dd8f94047b359ca0a78695144304cb45f87c9eb" },
]

environment = '''
export SETUPTOOLS_SCM_PRETEND_VERSION=$version
'''
install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE.txt "$pkgdir/usr/share/licenses/python-flask/LICENSE.txt"
'''
