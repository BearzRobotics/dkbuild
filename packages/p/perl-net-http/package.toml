# Net-HTTP 6.24 from CPAN: Low-level HTTP connection (client).
# Packaged for Proxmox VE (a dependency of Proxmox VE's Perl stack). Its tests are not run (!check): several need
# test-only CPAN modules or the network.
name = "perl-net-http"
version = "6.24"
release = 1
summary = "Low-level HTTP connection (client)"
license = "Artistic-1.0-Perl OR GPL-1.0-or-later"
homepage = "https://metacpan.org/dist/Net-HTTP"
hostdeps = ["perl"]
builddeps = ["perl", "perl-uri"]
rundeps = ["perl-uri"]
options = ["!check"]

source = [
    { url = "https://cpan.metacpan.org/authors/id/O/OA/OALDERS/Net-HTTP-6.24.tar.gz", sha256 = "290ed9a97b05c7935b048e6d2a356035871fca98ad72c01c5961726adf85c83c" },
]

build = '''
perl Makefile.PL INSTALLDIRS=vendor
make
'''
install = '''
make DESTDIR="$pkgdir" install
find "$pkgdir" \( -name perllocal.pod -o -name .packlist \) -delete
'''
