# iniconfig: a small and simple INI-file parser module (pytest needs it). Built from the sdist offline with
# pip (--no-build-isolation); the sdist carries PKG-INFO, so the VCS-version plugins find the version.
name = "python-iniconfig"
version = "2.3.1"
release = 1
summary = "Simple INI-file parser"
license = "MIT"
homepage = "https://github.com/pytest-dev/iniconfig"
hostdeps = ["python", "python-hatchling", "python-hatch-vcs", "python-setuptools-scm"]
rundeps = ["python"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/01/e1/2069291243c926a2ff1cd706c7f3eeb9b62144bf60f77c9fb9ff2fb26bd3/iniconfig-2.3.1.tar.gz", sha256 = "67f4b9c50da0dedf52af349e7749a80a9057a5031199791b906c3bb3ae878960" },
]

install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
for f in LICENSE LICENSE.txt LICENSE.md COPYING; do
    [ -f "$f" ] && install -Dm644 "$f" "$pkgdir/usr/share/licenses/python-iniconfig/${f##*/}"
done
true
'''
