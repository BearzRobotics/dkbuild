# Queue and data directories (postfix creates the queue's subdirectories
# itself, "postfix check"/"postfix start").
d /var/spool/postfix 0755 root root -
d /var/lib/postfix 0700 _postfix _postfix -
# apk installs the submission programs without their group: they are setgid
# _postdrop, as postfix-files asks (packages cannot carry a group that only
# exists once sysusers has run).
z /usr/sbin/postdrop 2755 root _postdrop -
z /usr/sbin/postqueue 2755 root _postdrop -
z /usr/sbin/postlog 2755 root _postdrop -
