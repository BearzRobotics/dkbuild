# gunicorn from PyPI, added for ahmia-site (requested 2026-11-17). Not built yet (wip/queue).
name = "python-gunicorn"
version = "27.0.1"
release = 1
summary = "WSGI HTTP server for UNIX"
license = "MIT"
homepage = "https://gunicorn.org"
hostdeps = ["python", "python-setuptools", "python-wheel"]
rundeps = ["python", "python-packaging"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/0e/fc/7fd4bbebc1d17394a5c98f0ef565da3341dbb664748d1bebedefead356ee/gunicorn-27.0.1.tar.gz", sha256 = "b1514965361c8b7e8107a80aa2a92636878df1ccfac6dd204a676426e04d9e3e" },
]

install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-gunicorn/LICENSE"
'''
