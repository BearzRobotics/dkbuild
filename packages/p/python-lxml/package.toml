# XML and HTML with libxml2 and libxslt. needed by: python-pikepdf.
name = "python-lxml"
version = "6.1.3"
release = 1
summary = "lxml for Python"
license = "BSD-3-Clause"
homepage = "https://pypi.org/project/lxml"
hostdeps = ["python", "python-setuptools", "python-cython", "pkgconf"]
builddeps = ["python-devel", "libxml2-devel", "libxslt-devel"]
rundeps = ["python"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/23/ad/28ecd7cb894d172f3c9c80a075eeeb2017ac62e3632cee05a5f9493547eb/lxml-6.1.3.tar.gz", sha256 = "45222d94ddd511536f3b2f7d9deae3b2339b4ce0f075f1ca25703b07cad9dd21" },
]

install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
'''
