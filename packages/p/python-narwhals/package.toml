# narwhals from PyPI.
# Source is the pure-Python wheel: the sdist builds with uv_build (Rust), which the tree
# does not have; the wheel holds the same Python files.
name = "python-narwhals"
version = "2.28.0"
release = 1
summary = "Extremely lightweight compatibility layer between dataframe libraries"
license = "MIT"
homepage = "https://github.com/narwhals-dev/narwhals"
hostdeps = ["python"]
rundeps = ["python"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/67/43/e11d75a7fb635c6f63dd6e176cb3e050ec2fee35f2f2267b332a6ad351ec/narwhals-2.28.0.tar.gz", sha256 = "2d9860c80d6610820826e94c6e42ce4b1d92d89cdd479586e652a8d211dab345" },
]

install = '''
python3 -m pip install --no-deps --no-index --no-compile --root "$pkgdir" --prefix /usr /build/sources/narwhals-2.28.0.tar.gz
install -Dm644 LICENSE.md "$pkgdir/usr/share/licenses/python-narwhals/LICENSE.md"
'''
