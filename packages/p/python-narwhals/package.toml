# narwhals from PyPI.
# Installed from the pure-Python wheel: the sdist builds with uv_build (Rust), which the tree
# does not have; the wheel holds the same Python files. The sdist is still a source (first,
# unpacked) for the licence file; the wheel is a second source copied to /build/sources
# (the earlier install named the sdist there, which is unpacked, never copied: no such file).
name = "python-narwhals"
version = "2.28.0"
release = 2
summary = "Extremely lightweight compatibility layer between dataframe libraries"
license = "MIT"
homepage = "https://github.com/narwhals-dev/narwhals"
hostdeps = ["python"]
rundeps = ["python"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/67/43/e11d75a7fb635c6f63dd6e176cb3e050ec2fee35f2f2267b332a6ad351ec/narwhals-2.28.0.tar.gz", sha256 = "2d9860c80d6610820826e94c6e42ce4b1d92d89cdd479586e652a8d211dab345" },
    { url = "https://files.pythonhosted.org/packages/cf/82/8ef9c7e0f50493307a49c09cfa7f00c5a778b6d1921f7b2dabe1d3a5809e/narwhals-2.28.0-py3-none-any.whl", sha256 = "1f69d6385ec30e2fa6e1fdeb37c562ecabd0f713f6f3e3b58a668c5c9df9567f", unpack = false },
]

install = '''
python3 -m pip install --no-deps --no-index --no-compile --root "$pkgdir" --prefix /usr /build/sources/narwhals-2.28.0-py3-none-any.whl
install -Dm644 LICENSE.md "$pkgdir/usr/share/licenses/python-narwhals/LICENSE.md"
'''
