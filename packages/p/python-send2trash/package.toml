# Send2Trash from PyPI.
name = "python-send2trash"
version = "2.2.0"
release = 1
summary = "Send file to trash natively under Mac OS X, Windows and Linux"
license = "BSD-3-Clause"
homepage = "https://github.com/arsenetar/send2trash"
hostdeps = ["python", "python-setuptools"]
rundeps = ["python"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/aa/9c/41c11853a5fb67b4639993a628182d326ffe4327eb28a125d202fb49950f/send2trash-2.2.0.tar.gz", sha256 = "e0ac412073f7984288908d9d8b8d13c82be69a615bb513d948fa2f053447970a" },
]

install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-send2trash/LICENSE"
'''
