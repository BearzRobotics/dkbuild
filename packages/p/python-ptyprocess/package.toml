# ptyprocess from PyPI.
name = "python-ptyprocess"
version = "0.7.0"
release = 1
summary = "Run a subprocess in a pseudo terminal"
license = "custom"
homepage = "https://github.com/pexpect/ptyprocess"
hostdeps = ["python", "python-flit-core"]
rundeps = ["python"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/20/e5/16ff212c1e452235a90aeb09066144d0c5a6a8c0834397e03f5224495c4e/ptyprocess-0.7.0.tar.gz", sha256 = "5c5d0a3b48ceee0b48485e0c26037c0acd7d29765ca3fbb5cb3831d347423220" },
]

environment = '''
export SETUPTOOLS_SCM_PRETEND_VERSION=$version
'''
install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-ptyprocess/LICENSE"
'''
