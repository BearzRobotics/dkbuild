# python-dateutil from PyPI.
name = "python-dateutil"
version = "4.0.0"
release = 1
summary = "Extensions to the standard Python datetime module"
license = "BSD-3-Clause"
homepage = "https://github.com/dateutil/dateutil"
hostdeps = ["python", "python-hatchling", "python-hatch-vcs", "python-hatch-fancy-pypi-readme"]
rundeps = ["python", "python-tzdata"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/18/39/b3927f3616f6223832f9b760e4208e8a7c7e1dea2b4d9ad7d32a5d214c3a/python_dateutil-4.0.0.tar.gz", sha256 = "d7295ff14fdc0f92f662100bfb6c551d160ca090f2939f1ec5b9794265c03f06" },
]

environment = '''
export SETUPTOOLS_SCM_PRETEND_VERSION=$version
'''
install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-dateutil/LICENSE"
'''
