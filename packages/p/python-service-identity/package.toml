# service-identity: service identity verification for TLS (twisted's tls extra).
# Built from the sdist offline with pip (--no-build-isolation): the build
# backend comes from hostdeps.
name = "python-service-identity"
version = "26.1.0"
release = 1
summary = "Service identity verification for pyOpenSSL and cryptography"
license = "MIT"
homepage = "https://pypi.org/project/service_identity/"
hostdeps = ["python", "python-hatchling", "python-hatch-vcs", "python-hatch-fancy-pypi-readme"]
rundeps = ["python", "python-attrs", "python-cryptography", "python-idna", "python-pyasn1", "python-pyasn1-modules"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/61/87/ad52e2c582c0f0e7f0a1b86950494c38d67422dc0f5ed9044a5fb9569a49/service_identity-26.1.0.tar.gz", sha256 = "6358c52882c96e66ac4a55eb3a72c7dd4a70763f8cc6fa4e70abde2656f4bf3b" },
]

install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
for f in LICENSE LICENSE.txt LICENSE.md LICENSE.rst COPYING LICENSES/*; do
    [ -f "$f" ] && install -Dm644 "$f" "$pkgdir/usr/share/licenses/python-service-identity/${f##*/}"
done
true
'''
