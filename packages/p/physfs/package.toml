# PhysicsFS: library to access archives (zip, 7z, ...) as a virtual file system.
name = "physfs"
version = "3.2.0"
release = 1
summary = "Library to provide abstract access to various archives"
license = "Zlib"
homepage = "https://icculus.org/physfs/"
hostdeps = ["cmake", "ninja", "pkgconf"]
builddeps = ["zlib-ng-compat-devel"]
options = ["!check"]  # upstream has no test suite

source = [
    { url = "https://github.com/icculus/physfs/archive/refs/tags/release-3.2.0.tar.gz", sha256 = "1991500eaeb8d5325e3a8361847ff3bf8e03ec89252b7915e1f25b3f8ab5d560" },
]

setup = '''
%cmake -DPHYSFS_BUILD_STATIC=ON -DPHYSFS_BUILD_SHARED=ON -DPHYSFS_BUILD_TEST=OFF
'''
build = '''
%cmake_build
'''
install = '''
%cmake_install
install -Dm644 LICENSE.txt "$pkgdir/usr/share/licenses/physfs/LICENSE.txt"
'''
