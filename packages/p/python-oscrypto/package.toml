# oscrypto from git: the 1.3.0 release cannot parse OpenSSL 3's version (NetExec
# pins git for that).
name = "python-oscrypto"
version = "1.3.0_git20260717"
release = 1
summary = "TLS and cryptography wrappers over the OS's libraries"
license = "MIT"
homepage = "https://github.com/wbond/oscrypto"
hostdeps = ["python", "python-setuptools"]
rundeps = ["python", "python-asn1crypto", "openssl"]
options = ["!check"]

source = [
    { url = "https://github.com/wbond/oscrypto/archive/76bfdcb7285d856c44f8d0fbafe0ecca1c6d2f8b.tar.gz", sha256 = "b7813b07db7100ef7b75e8e2206d815387882e0af406df16eb783c618b75e814" },
]

environment = '''
export SETUPTOOLS_SCM_PRETEND_VERSION=$version
'''
install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-oscrypto/LICENSE"
'''
