# webassets from PyPI.
name = "python-webassets"
version = "3.0.0"
release = 1
summary = "Media asset management for Python, with glue code for various web frameworks"
license = "BSD"
homepage = "http://github.com/miracle2k/webassets/"
hostdeps = ["python", "python-setuptools"]
rundeps = ["python", "python-pyyaml", "python-zope-dottedname"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/71/48/49c092aa2fab2f30ee82183422f6f82c0c924e8aa99324e9645472cf5562/webassets-3.0.0.tar.gz", sha256 = "0520e5fd6fbcc012f486fefc61b966474da8fc1b35b0569a9ec2cb0782f1607a" },
]

environment = '''
export SETUPTOOLS_SCM_PRETEND_VERSION=$version
'''
install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-webassets/LICENSE"
'''
