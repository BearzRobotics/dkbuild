# wsproto from PyPI, added for OnionShare (requested 2026-11-17). Not built yet (wip/queue).
name = "python-wsproto"
version = "1.3.2"
release = 1
summary = "WebSockets state-machine based protocol implementation"
license = "MIT"
homepage = "https://github.com/python-hyper/wsproto"
hostdeps = ["python", "python-setuptools", "python-wheel"]
rundeps = ["python", "python-h11"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/c7/79/12135bdf8b9c9367b8701c2c19a14c913c120b882d50b014ca0d38083c2c/wsproto-1.3.2.tar.gz", sha256 = "b86885dcf294e15204919950f666e06ffc6c7c114ca900b060d6e16293528294" },
]

install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-wsproto/$(basename LICENSE)"
'''
