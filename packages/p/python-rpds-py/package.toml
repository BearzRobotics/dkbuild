# rpds-py from PyPI: Rust bindings, built like python-pydantic-core. Crates vendored on the host
# (`cargodeps`); `maturin build` makes the wheel offline and pip installs it. Linked dynamically
# against musl (-crt-static off) so Python can load it.
name = "python-rpds-py"
version = "2026.9.1"
release = 1
summary = "Python bindings to Rust's persistent data structures (rpds)"
license = "MIT"
homepage = "https://github.com/crate-py/rpds"
hostdeps = ["python", "rust", "maturin"]
builddeps = ["python-devel"]
rundeps = ["python"]
options = ["!check", "cargodeps"]

source = [
    { url = "https://files.pythonhosted.org/packages/42/68/3bd46b8a5e01d3c2ebdf9c5e9497912e3fe0cde02bac21a7130ca866e403/rpds_py-2026.9.1.tar.gz", sha256 = "4793ef7f78268b124b73fa933440f01d258bbae01de9fa53e9080c9ab0425a12" },
]

environment = '''
export CARGO_HOME=/tmp/cargo-home CARGO_NET_OFFLINE=true
export RUSTFLAGS="-C target-feature=-crt-static"
'''
build = '''
maturin build --release --frozen --offline -i python3 --compatibility linux --out dist -j $jobs
'''
install = '''
python3 -m pip install --no-deps --no-index --no-compile --root "$pkgdir" --prefix /usr dist/*.whl
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-rpds-py/LICENSE"
'''
