# C foreign function interface. needed by: python-cryptography.
name = "python-cffi"
version = "2.1.1"
release = 1
summary = "cffi for Python"
license = "MIT-0"
homepage = "https://pypi.org/project/cffi"
hostdeps = ["python", "python-setuptools", "pkgconf"]
builddeps = ["python-devel", "libffi-devel"]
rundeps = ["python", "python-pycparser"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/9e/ef/008a1939e372c06329a3fce4279c02f328488f3526744906eeec3da7ad5f/cffi-2.1.1.tar.gz", sha256 = "dd31f52ea1086513bb9df30f8fcee9b8918323ae067a3d5b78bc826a000712be" },
]

install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
'''
