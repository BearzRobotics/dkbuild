# ipython-pygments-lexers from PyPI.
name = "python-ipython-pygments-lexers"
version = "1.1.1"
release = 1
summary = "Defines a variety of Pygments lexers for highlighting IPython code."
license = "custom"
homepage = "https://pypi.org/project/ipython-pygments-lexers/"
hostdeps = ["python", "python-flit-core"]
rundeps = ["python", "python-pygments"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/ef/4c/5dd1d8af08107f88c7f741ead7a40854b8ac24ddf9ae850afbcf698aa552/ipython_pygments_lexers-1.1.1.tar.gz", sha256 = "09c0138009e56b6854f9535736f4171d855c8c08a563a0dcd8022f78355c7e81" },
]

environment = '''
export SETUPTOOLS_SCM_PRETEND_VERSION=$version
'''
install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-ipython-pygments-lexers/LICENSE"
'''
