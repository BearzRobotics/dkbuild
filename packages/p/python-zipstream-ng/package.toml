# zipstream-ng from PyPI.
name = "python-zipstream-ng"
version = "1.9.3"
release = 1
summary = "A modern and easy to use streamable zip file generator"
license = "LGPL-3.0-only"
homepage = "https://pypi.org/project/zipstream-ng/"
hostdeps = ["python", "python-hatchling"]
rundeps = ["python"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/f3/e0/76e5a674b0f6a6b7f90af9b87a92fbe1f2b97da447fb09078bcba6f6a28e/zipstream_ng-1.9.3.tar.gz", sha256 = "6cebd055025699c0af594c76a9452cdf13f4be67ee005b6907f0d3c9c6f44ced" },
]

environment = '''
export SETUPTOOLS_SCM_PRETEND_VERSION=$version
'''
install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-zipstream-ng/LICENSE"
'''
