options = ["!check"]

source = [
    { url = "https://github.com/lxqt/pcmanfm-qt/releases/download/2.4.0/pcmanfm-qt-2.4.0.tar.xz", sha256 = "53fb1acf5a818300487ceffabc5b768034fa4dee956b9d1bc0019bb456b48daf" },
]

setup = '''
%cmake
'''
build = '''
%cmake_build
'''
