# traitlets from PyPI.
name = "python-traitlets"
version = "5.16.1"
release = 1
summary = "Traitlets Python configuration system"
license = "BSD 3-Clause License"
homepage = "https://github.com/ipython/traitlets"
hostdeps = ["python", "python-hatchling"]
rundeps = ["python"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/2c/2e/a7fbfe268c8a3b32546930c0297c101d65a4a14c304ad5790a9f478f0e4e/traitlets-5.16.1.tar.gz", sha256 = "ed900c2b631aa3a112811139fa97b8d2c3bad5e989656bba4b7e52c7852c18c1" },
]

environment = '''
export SETUPTOOLS_SCM_PRETEND_VERSION=$version
'''
install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-traitlets/LICENSE"
'''
