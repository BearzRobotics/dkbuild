# SQLAlchemy from PyPI.
name = "python-sqlalchemy"
version = "2.1.9"
release = 1
summary = "Database Abstraction Library"
license = "MIT"
homepage = "https://www.sqlalchemy.org"
hostdeps = ["python", "python-setuptools", "python-cython"]
rundeps = ["python", "python-typing-extensions"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/3f/69/b87a540f6888ebc1f63a6e6138e8dc0827331a9be7c5eb15e3bd40a76281/sqlalchemy-2.1.9.tar.gz", sha256 = "d700a8b2edfb26282a470333d6bc4a454c4acda4d201a3bea7b72fa76c217d28" },
]

environment = '''
export SETUPTOOLS_SCM_PRETEND_VERSION=$version
'''
install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-sqlalchemy/LICENSE"
'''
