# jmespath from PyPI, added for ahmia-crawler (requested 2026-11-17). Not built yet (wip/queue).
name = "python-jmespath"
version = "1.1.0"
release = 1
summary = "JSON Matching Expressions"
license = "MIT"
homepage = "https://github.com/jmespath/jmespath.py"
hostdeps = ["python", "python-setuptools", "python-wheel"]
rundeps = ["python"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/d3/59/322338183ecda247fb5d1763a6cbe46eff7222eaeebafd9fa65d4bf5cb11/jmespath-1.1.0.tar.gz", sha256 = "472c87d80f36026ae83c6ddd0f1d05d4e510134ed462851fd5f754c8c3cbb88d" },
]

install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-jmespath/LICENSE"
'''
