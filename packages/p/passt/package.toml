name = "passt"
version = "2026.10.02"
release = 1
summary = "User-mode network translation layer between Layer 2 and 4"
license = "BSD-3-Clause AND GPL-2.0-or-later"
homepage = "https://passt.top/passt/about"
patches = ["bullshit-cflags.patch", "cp-d.patch"]
builddeps = ["linux-headers"]
options = ["!check"]

source = [
    { url = "https://passt.top/passt/snapshot/passt-2026_10_02.cba3570.tar.zst", sha256 = "e56b9695239eae3675ba461a4d70bdf3840599f82e5cefe0f1a1fe185f1f128d" },
]

environment = '''
export CFLAGS="${CFLAGS} -fno-strict-aliasing -std=c23"
'''
setup = '''
# no getconf here (musl has none): the page size its Makefile asks for, 4 KiB
# (the x86_64 page and the usual aarch64 one; a 16K/64K-page aarch64 kernel
# would want its own)
sed -i 's/\$(shell getconf PAGE_SIZE)/4096/' Makefile
grep -q -- '-DPAGE_SIZE=4096' Makefile
'''
build = '''
%make
'''
install = '''
%make_install \
    STRIP=true \
    PREFIX=/usr \
    prefix=/usr
install -Dm644 LICENSES/BSD-3-Clause.txt "$pkgdir/usr/share/licenses/passt/BSD-3-Clause.txt"
'''
