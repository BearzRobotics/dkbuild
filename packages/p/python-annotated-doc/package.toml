# annotated-doc from PyPI.
name = "python-annotated-doc"
version = "0.0.7"
release = 1
summary = "Document parameters, class attributes, return types and variables inline, with Annotated"
license = "MIT"
homepage = "https://github.com/fastapi/annotated-doc"
hostdeps = ["python", "python-pdm-backend"]
rundeps = ["python"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/0b/7d/bdbf3062e5dae31da8b3de1e3269110beb93d268df4a7f6d22b167c6cee0/annotated_doc-0.0.7.tar.gz", sha256 = "0a30ef8f5322a4173720ae6712dc9a5e58f5a19868f3f167b4b5778db066c2b5" },
]

install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-annotated-doc/LICENSE"
'''
