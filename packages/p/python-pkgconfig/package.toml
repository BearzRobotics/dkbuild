# Python interface to pkg-config. needed by: python-uharfbuzz (finds the system HarfBuzz).
name = "python-pkgconfig"
version = "1.6.0"
release = 1
summary = "pkgconfig for Python"
license = "MIT"
homepage = "https://pypi.org/project/pkgconfig"
hostdeps = ["python", "python-poetry-core"]
builddeps = ["python-devel"]
rundeps = ["python"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/52/fd/0adde075cd3bfecd557bc7d757e00e231d34d8a6edb4c8d1642759254c21/pkgconfig-1.6.0.tar.gz", sha256 = "4a5a6631ce937fafac457104a40d558785a658bbdca5c49b6295bc3fd651907f" },
]

install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
'''
