# MIME-Base32 1.303 from CPAN: Base32 encoder and decoder.
# Packaged for Proxmox VE (pve-common: TOTP). Its tests are not run (!check): several need
# test-only CPAN modules or the network.
name = "perl-mime-base32"
version = "1.303"
release = 1
summary = "Base32 encoder and decoder"
license = "Artistic-1.0-Perl OR GPL-1.0-or-later"
homepage = "https://metacpan.org/dist/MIME-Base32"
hostdeps = ["perl"]
builddeps = ["perl"]
options = ["!check"]

source = [
    { url = "https://cpan.metacpan.org/authors/id/R/RE/REHSACK/MIME-Base32-1.303.tar.gz", sha256 = "ab21fa99130e33a0aff6cdb596f647e5e565d207d634ba2ef06bdbef50424e99" },
]

build = '''
perl Makefile.PL INSTALLDIRS=vendor
make
'''
install = '''
make DESTDIR="$pkgdir" install
find "$pkgdir" \( -name perllocal.pod -o -name .packlist \) -delete
'''
