# Term-ReadLine-Gnu 1.47 from CPAN: Perl extension for the GNU Readline/History Library.
# Packaged for Proxmox VE (pve-common: the CLI's interactive input). Its tests are not run (!check): several need
# test-only CPAN modules or the network.
name = "perl-term-readline-gnu"
version = "1.47"
release = 1
summary = "Perl extension for the GNU Readline/History Library"
license = "Artistic-1.0-Perl OR GPL-1.0-or-later"
homepage = "https://metacpan.org/dist/Term-ReadLine-Gnu"
hostdeps = ["perl"]
builddeps = ["perl", "readline-devel", "ncurses-devel"]
options = ["!check"]

source = [
    { url = "https://cpan.metacpan.org/authors/id/H/HA/HAYASHI/Term-ReadLine-Gnu-1.47.tar.gz", sha256 = "3b07ac8a9b494c50aa87a40dccab3f879b92eb9527ac0f2ded5d4743d166b649" },
]

build = '''
perl Makefile.PL INSTALLDIRS=vendor
make
'''
install = '''
make DESTDIR="$pkgdir" install
find "$pkgdir" \( -name perllocal.pod -o -name .packlist \) -delete
'''
