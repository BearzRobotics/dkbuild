# jupyter-events from PyPI.
name = "python-jupyter-events"
version = "0.12.1"
release = 1
summary = "Jupyter Event System library"
license = "BSD-3-Clause"
homepage = "http://jupyter.org"
hostdeps = ["python", "python-hatchling"]
rundeps = ["python", "python-jsonschema", "python-packaging", "python-json-logger", "python-pyyaml", "python-referencing", "python-rfc3339-validator", "python-rfc3986-validator", "python-traitlets"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/18/f8/475c4241b2b75af0deaae453ed003c6c851766dbc44d332d8baf245dc931/jupyter_events-0.12.1.tar.gz", sha256 = "faff25f77218335752f35f23c5fe6e4a392a7bd99a5939ccb9b8fbf594636cf3" },
]

install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-jupyter-events/LICENSE"
'''
