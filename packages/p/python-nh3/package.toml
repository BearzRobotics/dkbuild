# HTML sanitiser (Ammonia, Rust): PyPI sdist nh3 0.3.7 (build backend maturin); crates from cargodeps. Part of the AI/search stack in the queue.
# Not built (queued, wip/queue): expect first-build fixes (build requirements: maturin>=1.0,<2.0).
name = "python-nh3"
version = "0.3.8"
release = 1
summary = "HTML sanitiser (Ammonia, Rust)"
license = "MIT"
homepage = "https://pypi.org/project/nh3"
hostdeps = ["python", "maturin", "rust"]
builddeps = ["python-devel"]
rundeps = ["python"]
options = ["!check", "cargodeps"]

source = [
    { url = "https://files.pythonhosted.org/packages/45/45/2e8cb0c4dcb3ce1e8a66469d8367199a3db20555dfbad862c3c3187cf402/nh3-0.3.8.tar.gz", sha256 = "5c5a315abc2e9d5d78ce1ba6b592a1ef8cbc7e535dfb1e641966768e87870fe3" },
]

environment = '''
export CARGO_HOME=/tmp/cargo-home CARGO_NET_OFFLINE=true
'''
build = '''
maturin build --release --frozen --offline -i python3 --compatibility linux --out dist -j $jobs
'''
install = '''
python3 -m pip install --no-deps --no-index --no-compile --root "$pkgdir" --prefix /usr dist/*.whl
'''
