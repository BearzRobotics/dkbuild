# Pure-Python HPACK header encoding (PyPI hpack), written 2026-11-22 for the communication-client batch (gajim etc.). Not built yet.
name = "python-hpack"
version = "4.2.0"
release = 1
summary = "Pure-Python HPACK header encoding"
license = "MIT"
homepage = "https://github.com/python-hyper/hpack"
hostdeps = ["python", "python-setuptools"]
rundeps = ["python"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/26/5b/fcabf6028144a8723726318b07a32c2f3314acdff6265743cf08a344b18e/hpack-4.2.0.tar.gz", sha256 = "0895cfa3b5531fc65fe439c05eb65144f123bf7a394fcaa56aa423548d8e45c0" },
]

install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-hpack/LICENSE"
'''
