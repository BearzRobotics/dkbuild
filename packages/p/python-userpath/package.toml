# userpath: cross-platform tool for adding locations to the user PATH (pipx needs it for
# `pipx ensurepath`). From PyPI.
name = "python-userpath"
version = "1.9.2"
release = 1
summary = "Cross-platform tool for adding locations to the user PATH"
license = "MIT"
homepage = "https://github.com/ofek/userpath"
hostdeps = ["python", "python-hatchling", "python-hatch-vcs"]
rundeps = ["python", "python-click"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/d5/b7/30753098208505d7ff9be5b3a32112fb8a4cb3ddfccbbb7ba9973f2e29ff/userpath-1.9.2.tar.gz", sha256 = "6c52288dab069257cc831846d15d48133522455d4677ee69a9781f11dbefd815" },
]

environment = '''
export SETUPTOOLS_SCM_PRETEND_VERSION=$version
'''
install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE.txt "$pkgdir/usr/share/licenses/python-userpath/LICENSE.txt"
'''
