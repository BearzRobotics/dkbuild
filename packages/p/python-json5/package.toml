name = "python-json5"
version = "0.17.3"
release = 1
summary = "A Python implementation of the JSON5 data format."
license = "Apache-2.0"
homepage = "https://pypi.org/project/json5"
hostdeps = ["python", "python-setuptools"]
rundeps = ["python"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/16/1f/58a4d7ee466f81bc3c7337036380fc6d49de3afb7855d74f8121b1e89b32/json5-0.17.3.tar.gz", sha256 = "8d0278ad34ebaa9c3af76d9519274811830224a2d1cd5af156dbd067f461b8a4" },
]

install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-json5/LICENSE"
'''
