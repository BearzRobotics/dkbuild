# contourpy from PyPI (meson-python, pybind11 C++ extension).
name = "python-contourpy"
version = "1.4.0"
release = 1
summary = "Python library for calculating contours of 2D quadrilateral grids"
license = "BSD-3-Clause"
homepage = "https://github.com/contourpy/contourpy"
hostdeps = ["python", "python-meson-python", "python-pybind11", "python-numpy", "meson", "ninja", "pkgconf"]
builddeps = ["python-devel", "python-numpy"]
rundeps = ["python", "python-numpy"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/83/5a/a55177dd22553a277388e8a1b3220e92de91bacb28356cdc73caa240121d/contourpy-1.4.0.tar.gz", sha256 = "20156f5a1ac4f8ce02656e39a61e82164a3d359796dc8026f75b062783d500e1" },
]

install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-contourpy/LICENSE"
'''
