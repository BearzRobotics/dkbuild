# OctoPrint-FirmwareCheck from PyPI.
name = "python-octoprint-firmwarecheck"
version = "2025.7.23"
release = 1
summary = "Checks for unsafe or broken printer firmwares"
license = "AGPL-3.0-or-later"
homepage = "https://github.com/OctoPrint/OctoPrint-FirmwareCheck"
hostdeps = ["python", "python-setuptools"]
rundeps = ["python"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/49/c2/b1590616df87fc0006407363253ebd6d3c0409ba0e27f6da77dbd88a3bc6/octoprint_firmwarecheck-2025.7.23.tar.gz", sha256 = "a85611dc729f88245305e68e1da2d2f332aace1ccfc9521d004ae44ef1325c3f" },
]

environment = '''
export SETUPTOOLS_SCM_PRETEND_VERSION=$version
'''
install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-octoprint-firmwarecheck/LICENSE"
'''
