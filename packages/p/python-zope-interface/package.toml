# zope.interface: interfaces for Python (needed by twisted); has a C optimisation module.
# Built from the sdist offline with pip (--no-build-isolation): the build
# backend comes from hostdeps.
name = "python-zope-interface"
version = "8.7"
release = 1
summary = "Interfaces for Python"
license = "ZPL-2.1"
homepage = "https://pypi.org/project/zope.interface/"
hostdeps = ["python", "python-setuptools", "python-wheel"]
builddeps = ["python-devel"]
rundeps = ["python"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/de/ff/a1f0021a26033da0df223fd05a7455d6d2881b67daf2c6dc897b4fe0a427/zope_interface-8.7.tar.gz", sha256 = "0b47b62e8d0d99b24bcdd32f4f2120425e5019c3bee2ad69a0e1d75737487a96" },
]

install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
for f in LICENSE LICENSE.txt LICENSE.md LICENSE.rst COPYING LICENSES/*; do
    [ -f "$f" ] && install -Dm644 "$f" "$pkgdir/usr/share/licenses/python-zope-interface/${f##*/}"
done
true
'''
