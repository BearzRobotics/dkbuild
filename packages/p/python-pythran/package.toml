# pythran from PyPI: Python-to-C++ compiler, a build dependency of scipy. Bundles xsimd.
name = "python-pythran"
version = "0.19.0"
release = 1
summary = "Ahead of Time compiler for numeric kernels"
license = "BSD-3-Clause"
homepage = "https://github.com/serge-sans-paille/pythran"
hostdeps = ["python", "python-setuptools"]
rundeps = ["python", "python-numpy", "python-ply", "python-gast", "python-beniget", "python-setuptools"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/bb/a3/03098a8a5d2c9f801c227cf941d85976934f5f47307ef3d819734370acdc/pythran-0.19.0.tar.gz", sha256 = "18a096daa8b4bbe3ace06ce5d7325be5ff57aec4cf67b91834cf1b757b3e5392" },
]

install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-pythran/LICENSE"
'''
