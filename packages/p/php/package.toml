# cports is BSD-2-Clause, Copyright (c) Chimera Linux contributors.
# FenrirOS packages one PHP, as `php`: unsuffixed names and directories
# (/etc/php, /usr/lib/php, php-fpm), every extension built shared and enabled
# in /etc/php/conf.d (remove an .ini to turn one off). r2: MySQL/MariaDB
# (mysqli, pdo_mysql; mysqlnd built in, so no .ini load order matters) and
# PostgreSQL (pgsql, pdo_pgsql), for Passbolt and other web apps.
# 8.4 (2026-11-12): InvoiceShelf and SolidInvoice need it; every web app in
# the tree runs on it (GLPI 12 stops before 8.5, Dolibarr warns on 8.5).
# Firefly III needs 8.5: that is the versioned php8.5 package beside this one.
# Chimera's fix-clobbered-registers and fix-curl patches are upstream in 8.4.
name = "php"
version = "8.4.27"
release = 2
summary = "HTML-embedded scripting language"
license = "PHP-3.01"
homepage = "https://www.php.net"
patches = ["fix-pear-shebang.patch", "fix_oom_tests.patch", "install-pear.patch", "testarg.patch"]
hostdeps = ["automake", "bison", "libtool", "pkgconf"]
builddeps = ["argon2-devel", "curl-devel", "freetype-devel", "gettext-devel", "gmp-devel", "icu-devel", "libedit-devel", "libffi-devel", "libgd-devel", "libjpeg-turbo-devel", "libsodium-devel", "libxml2-devel", "libxslt-devel", "libzip-devel", "oniguruma-devel", "openldap-devel", "openssl-devel", "pcre2-devel", "postgresql-devel", "sqlite-devel", "unixodbc-devel", "zlib-ng-compat-devel"]
checkdeps = ["procps"]
rundeps = []
options = ["!check"]

source = [
    { url = "https://www.php.net/distributions/php-8.4.27.tar.gz", sha256 = "5bafed9994c1a49796b25b5f61c22c9183bfe046b6acc7b363842d03c77f972f" },
]

setup = '''
%configure \
    --datadir=/usr/share/php \
    --datarootdir=/usr/share/php \
    --includedir=/usr/include/php \
    --libdir=/usr/lib/php \
    --sysconfdir=/etc/php \
    --with-config-file-path=/etc/php \
    --with-config-file-scan-dir=/etc/php/conf.d \
    --program-prefix= \
    --with-layout=GNU \
    --enable-fpm \
    --with-fpm-group=_php \
    --with-fpm-user=_php \
    --disable-all \
    --enable-bcmath=shared \
    --enable-calendar=shared \
    --enable-ctype=shared \
    --enable-dom=shared \
    --enable-exif=shared \
    --enable-fileinfo=shared \
    --enable-filter=shared \
    --enable-ftp=shared \
    --enable-gd=shared \
    --enable-intl=shared \
    --enable-mbstring=shared \
    --enable-opcache=shared \
    --enable-pcntl=shared \
    --enable-pdo=shared \
    --enable-phar=shared \
    --enable-posix=shared \
    --enable-session=shared \
    --enable-shmop=shared \
    --enable-simplexml=shared \
    --enable-soap=shared \
    --enable-sockets=shared \
    --enable-sysvmsg=shared \
    --enable-sysvsem=shared \
    --enable-sysvshm=shared \
    --enable-tokenizer=shared \
    --enable-xml=shared \
    --enable-xmlreader=shared \
    --enable-xmlwriter=shared \
    --with-bz2=shared \
    --with-curl=shared \
    --with-external-gd \
    --with-external-pcre \
    --with-ffi=shared \
    --with-gettext=shared \
    --with-gmp=shared \
    --with-iconv=shared \
    --with-ldap-sasl \
    --with-ldap=shared \
    --with-libedit=shared \
    --with-libxml \
    --with-mhash \
    --with-openssl=shared \
    --with-password-argon2 \
    --enable-mysqlnd \
    --with-mysqli=shared \
    --with-pdo-mysql=shared \
    --with-pdo-pgsql=shared \
    --with-pgsql=shared \
    --with-pdo-sqlite=shared \
    --with-pear \
    --with-sodium=shared \
    --with-sqlite3=shared \
    --with-unixODBC=shared \
    --with-xsl=shared \
    --with-zip=shared \
    --with-zlib=shared
'''
build = '''
%make \
    LIBTOOL=/usr/bin/libtool
'''
check = '''
%make test LIBTOOL=/usr/bin/libtool
'''
install = '''
%make_install INSTALL_ROOT="$pkgdir" LIBTOOL=/usr/bin/libtool
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/php/LICENSE"
install -Dm644 README.md "$pkgdir/usr/share/doc/php/README.md"
install -Dm644 $pkgfiles/php-fpm "$pkgdir/etc/dinit.d/php-fpm"
install -Dm644 $pkgfiles/sysusers.conf "$pkgdir/usr/lib/sysusers.d/php.conf"
mv "$pkgdir/etc/php/php-fpm.conf.default" "$pkgdir/etc/php/php-fpm.conf"
install -Dm644 $pkgfiles/www.conf "$pkgdir/etc/php/php-fpm.d/www.conf"
rm -f "$pkgdir"/etc/php/php-fpm.d/*.default
install -Dm644 php.ini-production "$pkgdir/etc/php/php.ini"
# every shared extension enabled through its own .ini
mkdir -p "$pkgdir/etc/php/conf.d"
for f in "$pkgdir"/usr/lib/php/20240924/*.so; do
    e=$(basename "$f" .so)
    if [ "$e" = opcache ]; then echo "zend_extension=$e.so"; else echo "extension=$e.so"; fi > "$pkgdir/etc/php/conf.d/$e.ini"
done
ls "$pkgdir"/etc/php/conf.d/*.ini >/dev/null
# PEAR's install leaves its own state behind
rm -rf "$pkgdir"/.channels "$pkgdir"/.depdb "$pkgdir"/.depdblock "$pkgdir"/.filemap "$pkgdir"/.lock "$pkgdir"/.registry \
    "$pkgdir"/usr/share/php/pear/.channels "$pkgdir"/usr/share/php/pear/.filemap \
    "$pkgdir"/usr/share/php/pear/.lock "$pkgdir"/usr/share/php/pear/.registry "$pkgdir"/usr/share/php/pear/test
'''

[subpackages.fpm]
summary = "FastCGI process manager"
depends = ["php"]
paths   = ["/usr/bin/php-fpm", "/usr/share/man/man8/php-fpm.8", "/etc/php/php-fpm.conf", "/etc/php/php-fpm.d", "/etc/dinit.d/php-fpm", "/usr/lib/sysusers.d/php.conf", "/usr/share/php/fpm"]

[subpackages.cgi]
summary = "CGI binary"
depends = ["php"]
paths   = ["/usr/bin/php-cgi", "/usr/share/man/man1/php-cgi.1"]

[subpackages.pear]
summary = "PHP Extension and Application Repository"
depends = ["php"]
paths   = ["/usr/bin/pear", "/usr/bin/peardev", "/usr/bin/pecl", "/usr/share/php/pear", "/etc/php/pear.conf"]
