# Snapshot of https://github.com/VadymMakohon/eBook at commit ef8307bf, packaged to preserve the collection.
# MIT covers the repository; each book stays under its own authors' terms.
name = "programming-ebooks"
version = "20250202"
release = 1
summary = "Curated collection of programming eBooks"
license = "MIT"
homepage = "https://github.com/VadymMakohon/eBook"
options = ["!check"]

source = [
    { url = "https://github.com/VadymMakohon/eBook/archive/ef8307bfccbb5b3a8d2481351a50743f3e0b636e.tar.gz", sha256 = "fd5c85cc1a152e0e3a5be790ff0d00d09c5a8a8a48f036bc8983837a770aa729" },
]

# The whole tree is shipped as it is (nothing split or renamed; file names
# contain spaces).
install = '''
d="$pkgdir/usr/share/programming-ebooks"
install -dm755 "$d"
cp -a . "$d/"
rm -rf "$d/.github"
install -Dm644 LICENSE.md "$pkgdir/usr/share/licenses/programming-ebooks/LICENSE.md"
'''
