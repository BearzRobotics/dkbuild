# Python binding for the xxHash library (xxhash from PyPI), added as a calibre dependency.
name = "python-xxhash"
version = "4.1.0"
release = 1
summary = "Python binding for the xxHash library"
license = "BSD-2-Clause"
homepage = "https://github.com/ifduyue/python-xxhash"
hostdeps = ["python", "python-setuptools", "python-wheel"]
builddeps = ["python-devel"]
rundeps = ["python"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/c9/b5/3d11d3830ace56d67ea83136c24385c3b07da5a9bc62b73b0b94ac096da3/xxhash-4.1.0.tar.gz", sha256 = "c9b288e4c1f5dae54417bc8a05e6f6daf505783d916b4783f4dd2f2e7d5db486" },
]

environment = '''
export SETUPTOOLS_SCM_PRETEND_VERSION=$version
'''
install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-xxhash/LICENSE"
'''
