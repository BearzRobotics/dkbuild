# cssselect2 for Python (KiCad's SVG and PDF plotting uses CairoSVG). From Alpine's
# py3-cssselect2.
name = "python-cssselect2"
version = "0.9.0"
release = 1
summary = "CSS selectors for Python ElementTree"
license = "BSD-3-Clause"
homepage = "https://github.com/Kozea/cssselect2"
hostdeps = ["python", "python-flit-core"]
rundeps = ["python-tinycss2", "python-webencodings"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/source/c/cssselect2/cssselect2-0.9.0.tar.gz", sha256 = "759aa22c216326356f65e62e791d66160a0f9c91d1424e8d8adc5e74dddfc6fb" },
]

install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-cssselect2/LICENSE"
'''
