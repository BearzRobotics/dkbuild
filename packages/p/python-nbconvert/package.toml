# nbconvert from PyPI.
name = "python-nbconvert"
version = "7.17.2"
release = 1
summary = "Convert Jupyter Notebooks (.ipynb files) to other formats."
license = "BSD-3-Clause"
homepage = "https://jupyter.org"
hostdeps = ["python", "python-hatchling"]
rundeps = ["python", "python-beautifulsoup4", "python-bleach", "python-defusedxml", "python-jinja2", "python-jupyter-core", "python-jupyterlab-pygments", "python-markupsafe", "python-mistune", "python-nbclient", "python-nbformat", "python-packaging", "python-pandocfilters", "python-pygments", "python-traitlets"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/53/6a/252c7620305a9661205aed7a2a4b3592f5207bfca56ad11b7dea2c5ec2f6/nbconvert-7.17.2.tar.gz", sha256 = "344a218e8595117ce37396ed025d994f146d076226ebac59255a2fa085ab24d8" },
]

install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-nbconvert/LICENSE"
'''
