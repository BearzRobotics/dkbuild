# beangulp: the framework for importing bank statements into Beancount
# (Beancount 3's successor of beancount.ingest). Needed by Fava.
name = "python-beangulp"
version = "0.2.0"
release = 1
summary = "Importers framework for Beancount"
license = "GPL-2.0-only"
homepage = "https://github.com/beancount/beangulp"
hostdeps = ["python", "python-setuptools"]
rundeps = ["python", "python-beancount", "python-beautifulsoup4", "python-chardet", "python-click", "python-lxml", "python-magic"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/39/e6/5b3307d3035439f60da4372395edec8261852a083278fdbf3a96df0e6395/beangulp-0.2.0.tar.gz", sha256 = "5c908c45c62c07c4efadd0b03d3cdd145ad3b5e2bab5f5f277e0093a5891241a" },
]

install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-beangulp/LICENSE"
'''
