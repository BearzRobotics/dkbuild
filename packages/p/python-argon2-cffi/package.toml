# argon2-cffi from PyPI.
name = "python-argon2-cffi"
version = "25.1.0"
release = 1
summary = "Argon2 for Python"
license = "MIT"
homepage = "https://pypi.org/project/argon2-cffi/"
hostdeps = ["python", "python-hatchling", "python-hatch-vcs", "python-hatch-fancy-pypi-readme"]
rundeps = ["python", "python-argon2-cffi-bindings"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/0e/89/ce5af8a7d472a67cc819d5d998aa8c82c5d860608c4db9f46f1162d7dab9/argon2_cffi-25.1.0.tar.gz", sha256 = "694ae5cc8a42f4c4e2bf2ca0e64e51e23a040c6a517a85074683d3959e1346c1" },
]

environment = '''
export SETUPTOOLS_SCM_PRETEND_VERSION=$version
'''
install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-argon2-cffi/LICENSE"
'''
