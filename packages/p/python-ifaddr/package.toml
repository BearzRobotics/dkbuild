# ifaddr from PyPI.
name = "python-ifaddr"
version = "0.2.0"
release = 1
summary = "Cross-platform network interface and IP address enumeration library"
license = "MIT"
homepage = "https://github.com/pydron/ifaddr"
hostdeps = ["python", "python-setuptools"]
rundeps = ["python"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/e8/ac/fb4c578f4a3256561548cd825646680edcadb9440f3f68add95ade1eb791/ifaddr-0.2.0.tar.gz", sha256 = "cc0cbfcaabf765d44595825fb96a99bb12c79716b73b44330ea38ee2b0c4aed4" },
]

environment = '''
export SETUPTOOLS_SCM_PRETEND_VERSION=$version
'''
install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE.txt "$pkgdir/usr/share/licenses/python-ifaddr/LICENSE.txt"
'''
