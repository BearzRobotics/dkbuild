# Useful decorators and context managers (PyPI jaraco.context), written 2026-11-22 for the communication-client batch (gajim etc.). Not built yet.
name = "python-jaraco-context"
version = "6.1.2"
release = 1
summary = "Useful decorators and context managers"
license = "MIT"
homepage = "https://github.com/jaraco/jaraco.context"
hostdeps = ["python", "python-setuptools", "python-setuptools-scm"]
rundeps = ["python"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/af/50/4763cd07e722bb6285316d390a164bc7e479db9d90daa769f22578f698b4/jaraco_context-6.1.2.tar.gz", sha256 = "f1a6c9d391e661cc5b8d39861ff077a7dc24dc23833ccee564b234b81c82dfe3" },
]

environment = '''
export SETUPTOOLS_SCM_PRETEND_VERSION=$version
'''
install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-jaraco-context/LICENSE"
'''
