# needed by: dkde (hard requirement: its polkit agent talks to polkitd), and
# anything that asks for privileged actions through D-Bus.
#
# Written from Chimera's recipe (polkit 128), changed for this system:
#  - authfw=pam (r5, 2026-11-15: the system adopts PAM all the way); the polkit-1 service is
#    files/polkit-1.pam, installed to /usr/lib/pam.d (it uses the system-auth stack).
#  - session tracking through elogind (r6, 2026-11-21; was ConsoleKit, which needs a daemon nobody runs):
#    polkit asks libelogind which session the caller is in, so "allow_active" rules match the user on
#    the console. That is what lets elogind's `loginctl poweroff`/`reboot` (dkde 0.3.5's Shut Down and
#    Restart) run without a password. With no elogind running (images on seatd) polkit finds no
#    session, as it did before; administrator password authentication is unaffected.
#  - Chimera's turnstile.patch is dropped: it tracks sessions through turnstile.
#  - the polkitd user comes from scripts/pre-install, not sysusers.
# NOT BUILT YET: needs dbus, glib and duktape in the tree.
# r2: rebuilt with the empty directories it installs (dkbuild's splitter dropped them).
# r3: dependencies on this tree's packages, not Chimera's names (built against the image's copies before).
# r4: static libraries too (in polkit-static), for fully static programs on musl.
name = "polkit"
version = "128"
release = 6
summary = "Toolkit for defining and handling authorizations"
license = "GPL-2.0-or-later"
homepage = "https://www.freedesktop.org/wiki/Software/polkit"
patches = ["dbus-activation.patch", "disable-sd-pidfd.patch", "readiness.patch"]
hostdeps = ["gettext", "meson", "perl", "pkgconf"]
builddeps = ["duktape-devel", "elogind-devel", "glib-devel", "libexpat-devel", "linux-pam-devel"]
rundeps = ["dbus", "linux-pam", "linux-pam-base"]
options = ["!check", "!cross"]

source = [
    { url = "https://github.com/polkit-org/polkit/archive/refs/tags/128.tar.gz", sha256 = "6edb06bf1448e49e428f9597a97af6a05d62146dd0b58f86eeaebcee3f5ecfaa" },
]

setup = '''
%meson \
    -Dsession_tracking=elogind \
    -Dsystemdsystemunitdir= \
    -Dpolkitd_user=polkitd \
    -Dauthfw=pam \
    -Dos_type=lfs \
    -Dman=false \
    -Dintrospection=false \
    -Dtests=false \
    -Dgtk_doc=false
'''
build = '''
%meson_build
'''
install = '''
%meson_install
rm -rf "$pkgdir/usr/lib/sysusers.d" "$pkgdir/usr/lib/tmpfiles.d" "$pkgdir/usr/lib/systemd"
install -Dm644 $pkgfiles/polkitd "$pkgdir/etc/dinit.d/polkitd"
install -Dm644 $pkgfiles/polkit-1.pam "$pkgdir/usr/lib/pam.d/polkit-1"
'''
