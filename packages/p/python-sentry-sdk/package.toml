# sentry-sdk from PyPI.
name = "python-sentry-sdk"
version = "2.74.0"
release = 1
summary = "Python client for Sentry (https://sentry.io)"
license = "MIT"
homepage = "https://github.com/getsentry/sentry-python"
hostdeps = ["python", "python-setuptools"]
rundeps = ["python", "python-urllib3", "python-certifi"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/8e/7f/1b16ab4aee53cc5db976bac12e6df5d562aae3880965200cef812e7121d9/sentry_sdk-2.74.0.tar.gz", sha256 = "dd91d75aacaef636006b579ac3ddb2fdbc9dce35f00f4b353b6b1b110c6b256a" },
]

environment = '''
export SETUPTOOLS_SCM_PRETEND_VERSION=$version
'''
install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-sentry-sdk/LICENSE"
'''
