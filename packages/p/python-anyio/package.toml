# needed by: httpx.
# Built from the sdist offline with pip (--no-build-isolation): the build
# backend comes from hostdeps. setuptools, packaging and flit-core are the
# image's until they are recipes.
name = "python-anyio"
version = "4.16.0"
release = 1
summary = "High-level concurrency and networking framework on top of asyncio or Trio"
license = "MIT"
homepage = "https://pypi.org/project/anyio"
hostdeps = ["python", "python-setuptools", "python-setuptools-scm"]
rundeps = ["python", "python-idna"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/a1/98/7e457a3b014976887a050561955c0b76e1e7e2d6e27b78ecef2ef80518f2/anyio-4.16.0.tar.gz", sha256 = "59bb03251907983d1603d27c3087ddb1e93299ea2163adcdba37899a4fb12ffb" },
]

install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
for f in LICENSE LICENSE.txt LICENSE.md LICENSE.rst COPYING LICENSES/*; do
    [ -f "$f" ] && install -Dm644 "$f" "$pkgdir/usr/share/licenses/python-anyio/${f##*/}"
done
true
'''
