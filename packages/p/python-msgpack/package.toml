# MessagePack serializer for Python (msgpack from PyPI), added as a calibre dependency.
name = "python-msgpack"
version = "1.2.4"
release = 1
summary = "MessagePack serializer for Python"
license = "Apache-2.0"
homepage = "https://msgpack.org"
hostdeps = ["python", "python-setuptools", "python-wheel"]
builddeps = ["python-devel"]
rundeps = ["python"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/cc/52/1ec7ead2c7528bf3d1db73e886fa4df10f9e6f0eb7854a448b7090cfcef7/msgpack-1.2.4.tar.gz", sha256 = "475c44e12f2a5de766a8448783f149c9b33f3f49b88953c6cd739a77d93c732c" },
]

environment = '''
export SETUPTOOLS_SCM_PRETEND_VERSION=$version
'''
install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 COPYING "$pkgdir/usr/share/licenses/python-msgpack/COPYING"
'''
