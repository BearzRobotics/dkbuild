# AnyEvent-HTTP 2.25 from CPAN: simple but non-blocking HTTP/HTTPS client.
# Packaged for Proxmox VE (pve-http-server). Its tests are not run (!check): several need
# test-only CPAN modules or the network.
name = "perl-anyevent-http"
version = "2.25"
release = 1
summary = "simple but non-blocking HTTP/HTTPS client"
license = "Artistic-1.0-Perl OR GPL-1.0-or-later"
homepage = "https://metacpan.org/dist/AnyEvent-HTTP"
hostdeps = ["perl"]
builddeps = ["perl", "perl-anyevent", "perl-common-sense"]
rundeps = ["perl-anyevent", "perl-common-sense"]
options = ["!check"]

source = [
    { url = "https://cpan.metacpan.org/authors/id/M/ML/MLEHMANN/AnyEvent-HTTP-2.25.tar.gz", sha256 = "5cfa53416124176f6f4cd32b00ea8ca79a2d5df51258683989cd04fe86e25013" },
]

build = '''
perl Makefile.PL INSTALLDIRS=vendor
make
'''
install = '''
make DESTDIR="$pkgdir" install
find "$pkgdir" \( -name perllocal.pod -o -name .packlist \) -delete
'''
