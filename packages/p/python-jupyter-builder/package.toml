# jupyter-builder from PyPI.
name = "python-jupyter-builder"
version = "1.3.0"
release = 1
summary = "JupyterLab build tools"
license = "Apache-2.0 AND BSD-2-Clause AND BSD-3-Clause AND ISC AND MIT"
homepage = "https://jupyter.org"
hostdeps = ["python", "python-hatchling", "python-hatch-nodejs-version"]
rundeps = ["python", "python-jupyter-core", "python-traitlets"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/96/a4/9c21aace0287bcc19000e7b73088bfeb60a4536daeef49f51902344c25a5/jupyter_builder-1.3.0.tar.gz", sha256 = "dc0a3cdc27be674f29de2b4aecfdd55190fffa65199846bbdf4ceaf31a56b7d1" },
]

install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-jupyter-builder/LICENSE"
'''
