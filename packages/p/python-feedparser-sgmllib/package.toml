# feedparser-sgmllib from PyPI.
name = "python-feedparser-sgmllib"
version = "2.1.0"
release = 1
summary = "sgmllib from Python 2.7. For feedparser use only."
license = "PSF-2.0"
homepage = "https://pypi.org/project/feedparser-sgmllib/"
hostdeps = ["python", "python-poetry-core"]
rundeps = ["python"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/da/df/38596299216e5c22d60ed7f97902bb2bc72cfb95f732400f4fa976fd2e62/feedparser_sgmllib-2.1.0.tar.gz", sha256 = "61facf2918c4389b5b00714f76c5e03431ffcd94cd1f51d657edd6cd7c396579" },
]

environment = '''
export SETUPTOOLS_SCM_PRETEND_VERSION=$version
'''
install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-feedparser-sgmllib/LICENSE"
'''
