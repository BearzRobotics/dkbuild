# Crypt-OpenSSL-RSA 0.41 from CPAN: RSA encoding and decoding, using the openSSL libraries.
# Packaged for Proxmox VE (pve-common: API tickets). Its tests are not run (!check): several need
# test-only CPAN modules or the network.
name = "perl-crypt-openssl-rsa"
version = "0.41"
release = 1
summary = "RSA encoding and decoding, using the openSSL libraries"
license = "Artistic-1.0-Perl OR GPL-1.0-or-later"
homepage = "https://metacpan.org/dist/Crypt-OpenSSL-RSA"
hostdeps = ["perl", "perl-crypt-openssl-guess"]
builddeps = ["perl", "openssl-devel", "perl-crypt-openssl-bignum", "perl-crypt-openssl-random"]
rundeps = ["perl-crypt-openssl-bignum", "perl-crypt-openssl-random"]
options = ["!check"]

source = [
    { url = "https://cpan.metacpan.org/authors/id/T/TI/TIMLEGGE/Crypt-OpenSSL-RSA-0.41.tar.gz", sha256 = "82fa839897b88e9c245b6265f3be26d3bc879cae4c7a8151fad4a307c3366822" },
]

build = '''
perl Makefile.PL INSTALLDIRS=vendor
make
'''
install = '''
make DESTDIR="$pkgdir" install
find "$pkgdir" \( -name perllocal.pod -o -name .packlist \) -delete
'''
