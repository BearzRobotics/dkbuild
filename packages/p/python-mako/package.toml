# Mako templates. needed by: gobject-introspection (its scanner), mesa.
name = "python-mako"
version = "1.4.3"
release = 1
summary = "Mako templates for Python"
license = "MIT"
homepage = "https://www.makotemplates.org"
hostdeps = ["python", "python-setuptools"]
builddeps = ["python-devel"]
rundeps = ["python", "python-markupsafe"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/5a/09/e07c4b5579a79f4b16f8d4f29f6c54514ac787c4ad506b8c4f28a0e6b0bf/mako-1.4.3.tar.gz", sha256 = "cd6537fe88d5fec315c55c2f8529bc4ce7a9a352ad7db3eeaa6a66e2dd4ec37a" },
]

install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
'''
