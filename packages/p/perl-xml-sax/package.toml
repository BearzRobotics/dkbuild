# XML-SAX 1.02 from CPAN: Simple API for XML.
# Packaged for Proxmox VE (a dependency of Proxmox VE's Perl stack). Its tests are not run (!check): several need
# test-only CPAN modules or the network.
name = "perl-xml-sax"
version = "1.02"
release = 2
summary = "Simple API for XML"
license = "Artistic-1.0-Perl OR GPL-1.0-or-later"
homepage = "https://metacpan.org/dist/XML-SAX"
hostdeps = ["perl"]
builddeps = ["perl", "perl-xml-namespacesupport", "perl-xml-sax-base"]
rundeps = ["perl-xml-namespacesupport", "perl-xml-sax-base"]
options = ["!check"]

source = [
    { url = "https://cpan.metacpan.org/authors/id/G/GR/GRANTM/XML-SAX-1.02.tar.gz", sha256 = "4506c387043aa6a77b455f00f57409f3720aa7e553495ab2535263b4ed1ea12a" },
]

build = '''
perl Makefile.PL INSTALLDIRS=vendor
make
'''
# Makefile.PL's install target also runs `perl -MXML::SAX -e add_parser(...)`, which needs XML::SAX
# installed in the real perl library; under DESTDIR it is not there yet ("Can't locate XML/SAX.pm").
# So install with pure_install and register the PurePerl parser (write ParserDetails.ini) ourselves,
# with PERL5LIB pointing at the staged copy.
install = '''
make DESTDIR="$pkgdir" pure_install
PERL5LIB="$pkgdir/usr/lib/perl5/5.40/vendor_perl" perl -MXML::SAX -e 'XML::SAX->add_parser(q(XML::SAX::PurePerl))->save_parsers()'
test -f "$pkgdir/usr/lib/perl5/5.40/vendor_perl/XML/SAX/ParserDetails.ini"
find "$pkgdir" \( -name perllocal.pod -o -name .packlist \) -delete
'''
