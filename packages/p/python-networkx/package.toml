# networkx from PyPI.
name = "python-networkx"
version = "3.7"
release = 1
summary = "Python package for creating and manipulating graphs and networks"
license = "BSD-3-Clause"
homepage = "https://networkx.org/"
hostdeps = ["python", "python-setuptools"]
rundeps = ["python"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/dc/76/3af777226b63a5e64a6b36b1ec5855c14e2b94a37096d4760e595fc43511/networkx-3.7.tar.gz", sha256 = "fd77a511bd90f39f3d016351345b52cf5319b813bdca01de3f755d3cca62e96a" },
]

environment = '''
export SETUPTOOLS_SCM_PRETEND_VERSION=$version
'''
install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE.txt "$pkgdir/usr/share/licenses/python-networkx/LICENSE.txt"
'''
