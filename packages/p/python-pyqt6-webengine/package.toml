# After Chimera Linux cports: main/python-pyqt6-webengine. cports is BSD-2-Clause, Copyright (c) Chimera Linux contributors.
# PyQt6-WebEngine: Python bindings for QtWebEngine (QtWebEngineCore,
# QtWebEngineWidgets, QtWebEngineQuick), a calibre dependency (its viewer,
# editor preview and conversion renderer). Same sip-build flow as python-pyqt6.
name = "python-pyqt6-webengine"
version = "6.140.1"
release = 1
summary = "Python bindings for Qt6 WebEngine"
license = "GPL-3.0-only"
homepage = "https://www.riverbankcomputing.com/software/pyqt"
hostdeps = ["pkgconf", "python", "python-pyqt-builder", "python-pyqt6", "python-setuptools", "python-sip"]
builddeps = ["python-devel", "python-pyqt6", "qt6-qtbase-devel", "qt6-qtwebchannel-devel", "qt6-qtwebengine-devel"]
rundeps = ["python-pyqt6", "python-pyqt6-sip"]
options = ["!cross", "!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/9b/e3/f527f46fdbdaac9c3e4947e7426552f16ad0a1f53b1417176198b296c72c/pyqt6_webengine-6.140.1.tar.gz", sha256 = "7e8b228d2f35806b50135b8fdc7572f3deea09263d2fe878d2fcae8c47c30f72" },
]

setup = '''
sip-build --confirm-license --no-make --qmake /usr/bin/qmake6 --verbose
'''
# sip-build writes its Makefiles into build/: build and install run there.
build = '''
cd build
%make
'''
install = '''
cd build
# qmake-made Makefiles install under INSTALL_ROOT.
make INSTALL_ROOT="$pkgdir" install \
    STRIP=true \
    PREFIX=/usr
'''
