# platformdirs from PyPI.
name = "python-platformdirs"
version = "4.14.8"
release = 1
summary = "A small Python package for determining appropriate platform-specific dirs, e.g. a `user data dir`."
license = "MIT"
homepage = "https://github.com/tox-dev/platformdirs"
hostdeps = ["python", "python-hatchling", "python-hatch-fancy-pypi-readme", "python-hatch-vcs"]
rundeps = ["python"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/71/18/0b0d99f5bf164f04a7a9534c3dbdbe4d5fd2b382667685ad40c192c4d3d1/platformdirs-4.14.8.tar.gz", sha256 = "96893d686e84e9e6f358a9ea41a8de544df66dbf2ba6cda250e7dc73acf85b9b" },
]

environment = '''
export SETUPTOOLS_SCM_PRETEND_VERSION=$version
'''
install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-platformdirs/LICENSE"
'''
