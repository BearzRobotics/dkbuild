# Cython: C extensions from Python-like code. needed by: python-lxml, python-uharfbuzz.
name = "python-cython"
version = "3.3.1"
release = 1
summary = "cython for Python"
license = "Apache-2.0"
homepage = "https://pypi.org/project/cython"
hostdeps = ["python", "python-setuptools"]
builddeps = ["python-devel"]
rundeps = ["python"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/99/ca/18e324972e5cac914816fdd7bb03e19a455b90039c277a538f7781b50c85/cython-3.3.1.tar.gz", sha256 = "e0e45989e821bef6aa9ae15c7d583ab5e055f7406c4b3624e49e06d24e90375a" },
]

install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
'''
