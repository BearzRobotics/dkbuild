# Cython: C extensions from Python-like code. needed by: python-lxml, python-uharfbuzz.
name = "python-cython"
version = "3.3.2"
release = 1
summary = "cython for Python"
license = "Apache-2.0"
homepage = "https://pypi.org/project/cython"
hostdeps = ["python", "python-setuptools"]
builddeps = ["python-devel"]
rundeps = ["python"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/98/de/dff7f5fcfd06a947b16bbd66568e3e8f291cd9a17c35fd04b43b5a7ad3bf/cython-3.3.2.tar.gz", sha256 = "e789d9fd939b74fb8c572fc2b689e3b14bd141ba95243693a546064c8179a1d3" },
]

install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
'''
