# hyperlink: immutable URLs (needed by twisted).
# Built from the sdist offline with pip (--no-build-isolation): the build
# backend comes from hostdeps.
name = "python-hyperlink"
version = "21.0.0"
release = 1
summary = "Immutable URL library"
license = "MIT"
homepage = "https://pypi.org/project/hyperlink/"
hostdeps = ["python", "python-wheel"]
rundeps = ["python", "python-idna"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/3a/51/1947bd81d75af87e3bb9e34593a4cf118115a8feb451ce7a69044ef1412e/hyperlink-21.0.0.tar.gz", sha256 = "427af957daa58bc909471c6c40f74c5450fa123dd093fc53efd2e91d2705a56b" },
]

install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
for f in LICENSE LICENSE.txt LICENSE.md LICENSE.rst COPYING LICENSES/*; do
    [ -f "$f" ] && install -Dm644 "$f" "$pkgdir/usr/share/licenses/python-hyperlink/${f##*/}"
done
true
'''
