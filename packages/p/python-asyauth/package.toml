# asyauth from PyPI.
name = "python-asyauth"
version = "0.0.26"
release = 1
summary = "Unified authentication library"
license = "custom"
homepage = "https://github.com/skelsec/asyauth"
hostdeps = ["python", "python-setuptools"]
rundeps = ["python", "python-asn1crypto", "python-asysocks", "python-minikerberos", "python-unicrypto"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/c2/19/7135d40e2b6402e56fb07ee2ccad9ef1e7de799c7a1da0f8961925699b3f/asyauth-0.0.26.tar.gz", sha256 = "4c0df27e9ba1a69cd59e37551181698ba77f503e4ecd9966b0a508f4c472f4d2" },
]

environment = '''
export SETUPTOOLS_SCM_PRETEND_VERSION=$version
'''
install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-asyauth/LICENSE"
'''
