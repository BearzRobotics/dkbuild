# Clone 0.51 from CPAN: recursively copy Perl datatypes.
# Packaged for Proxmox VE (pve-common). Its tests are not run (!check): several need
# test-only CPAN modules or the network.
name = "perl-clone"
version = "0.51"
release = 1
summary = "recursively copy Perl datatypes"
license = "Artistic-1.0-Perl OR GPL-1.0-or-later"
homepage = "https://metacpan.org/dist/Clone"
hostdeps = ["perl"]
builddeps = ["perl"]
options = ["!check"]

source = [
    { url = "https://cpan.metacpan.org/authors/id/A/AT/ATOOMIC/Clone-0.51.tar.gz", sha256 = "f17f66fec97dacca67ac9585701d2d079cfc80539fe6e8160c201c4e55f67507" },
]

build = '''
perl Makefile.PL INSTALLDIRS=vendor
make
'''
install = '''
make DESTDIR="$pkgdir" install
find "$pkgdir" \( -name perllocal.pod -o -name .packlist \) -delete
'''
