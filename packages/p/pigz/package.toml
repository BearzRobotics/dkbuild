# pigz: parallel gzip (and unpigz). Docker uses unpigz to unpack image
# layers when it is installed. Based on Chimera Linux cports (BSD-2-Clause):
# main/pigz.
name = "pigz"
version = "2.8"
release = 1
summary = "Parallel implementation of gzip"
license = "Zlib"
homepage = "https://zlib.net/pigz/"
hostdeps = ["make"]
builddeps = ["zlib-ng-compat-devel"]

source = [
    { url = "https://zlib.net/pigz/pigz-2.8.tar.gz", sha256 = "eb872b4f0e1f0ebe59c9f7bd8c506c4204893ba6a8492de31df416f0d5170fd0" },
]

build = '''
%make CFLAGS="$CFLAGS" LDFLAGS="$LDFLAGS"
'''
check = '''
%make test
'''
install = '''
install -Dm755 pigz "$pkgdir/usr/bin/pigz"
ln -s pigz "$pkgdir/usr/bin/unpigz"
install -Dm644 pigz.1 "$pkgdir/usr/share/man/man1/pigz.1"
ln -s pigz.1 "$pkgdir/usr/share/man/man1/unpigz.1"
'''
