# cports is BSD-2-Clause, Copyright (c) Chimera Linux contributors.
# FenrirOS packages one PostgreSQL, as `postgresql`, in the usual places
# (/usr/bin, /usr/share/postgresql, /etc/postgresql), with every contrib module.
# The cluster lives in /var/lib/postgresql (owned by _postgres): create it with
#   su -s /bin/sh _postgres -c 'initdb -D /var/lib/postgresql'
# then enable the postgresql service.
name = "postgresql"
version = "16.15"
release = 3
summary = "Sophisticated object-relational database system"
license = "PostgreSQL"
homepage = "https://www.postgresql.org"
patches = ["disable-html-docs.patch", "dont-use-locale-a-on-musl.patch", "initdb-no-pg_ctl.patch", "per-version-dirs.patch", "perl-rpath.patch", "remove-libecpg_compat.patch"]
hostdeps = ["pkgconf"]
builddeps = ["e2fsprogs-devel", "icu-devel", "libxml2-devel", "linux-headers", "lz4-devel", "openssl-devel", "perl", "python-devel", "readline-devel", "tcl-devel", "zlib-ng-compat-devel", "zstd-devel"]
rundeps = ["tzdb"]
options = ["!check"]

source = [
    { url = "https://ftp.postgresql.org/pub/source/v16.15/postgresql-16.15.tar.bz2", sha256 = "c1575341fa7bd40f5274ea465b34390f4dc64cdd0770af327005caaeb9f6b7ed" },
]

setup = '''
%configure \
    --datadir=/usr/share/postgresql \
    --includedir=/usr/include/postgresql \
    --sysconfdir=/etc/postgresql \
    --disable-rpath \
    --with-libxml \
    --with-lz4 \
    --with-perl \
    --with-python \
    --with-ssl=openssl \
    --with-tcl \
    --with-uuid=e2fs \
    --with-zstd \
    --with-system-tzdata=/usr/share/zoneinfo
'''

build = '''
# the programs, libraries and contrib modules (the man pages come prebuilt)
%make world-bin
'''
install = '''
%make install-world-bin DESTDIR="$pkgdir"
install -Dm644 $pkgfiles/pltcl_create_tables.sql "$pkgdir/usr/share/postgresql/pltcl_create_tables.sql"
for c in 1 3 7; do
    install -dm755 "$pkgdir/usr/share/man/man$c"
    install -m644 doc/src/sgml/man$c/*.$c "$pkgdir/usr/share/man/man$c/"
done
install -Dm644 $pkgfiles/postgresql "$pkgdir/etc/dinit.d/postgresql"
install -Dm644 $pkgfiles/sysusers.conf "$pkgdir/usr/lib/sysusers.d/postgresql.conf"
install -Dm644 $pkgfiles/tmpfiles.conf "$pkgdir/usr/lib/tmpfiles.d/postgresql.conf"
install -Dm644 COPYRIGHT "$pkgdir/usr/share/licenses/postgresql/COPYRIGHT"
'''

# "libs", the name dkbuild installs with -devel and the programs (libpq.so is a
# link to it); as client-libs, a -lpq build found only libpq.a
[subpackages.libs]
summary = "Client library (libpq)"
paths   = ["/usr/lib/libpq.so.*"]

[subpackages.ecpg-libs]
summary = "Embedded SQL C libraries"
paths   = ["/usr/lib/libecpg.so.*", "/usr/lib/libecpg_compat.so.*", "/usr/lib/libpgtypes.so.*"]

[subpackages.pltcl]
summary = "PL/Tcl"
depends = ["postgresql"]
paths   = ["/usr/lib/postgresql/pltcl.so", "/usr/share/postgresql/extension/pltcl*", "/usr/share/postgresql/pltcl_create_tables.sql"]

[subpackages.plperl]
summary = "PL/Perl"
depends = ["postgresql"]
paths   = ["/usr/lib/postgresql/plperl.so", "/usr/share/postgresql/extension/plperl*"]

[subpackages.plpython]
summary = "PL/Python"
depends = ["postgresql"]
paths   = ["/usr/lib/postgresql/plpython3.so", "/usr/share/postgresql/extension/plpython3*"]
