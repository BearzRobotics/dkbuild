# deprecation from PyPI.
name = "python-deprecation"
version = "2.1.0"
release = 1
summary = "A library to handle automated deprecations"
license = "Apache-2.0"
homepage = "http://deprecation.readthedocs.io/"
hostdeps = ["python", "python-setuptools"]
rundeps = ["python"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/5a/d3/8ae2869247df154b64c1884d7346d412fed0c49df84db635aab2d1c40e62/deprecation-2.1.0.tar.gz", sha256 = "72b3bde64e5d778694b0cf68178aed03d15e15477116add3fb773e581f9518ff" },
]

install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-deprecation/LICENSE"
'''
