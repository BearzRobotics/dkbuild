# CSS Cascading Style Sheets parser (calibre's fork of cssutils) (css-parser from PyPI), added as a calibre dependency.
name = "python-css-parser"
version = "1.1.2"
release = 1
summary = "CSS Cascading Style Sheets parser (calibre's fork of cssutils)"
license = "LGPL-3.0-or-later"
homepage = "https://github.com/ebook-utils/css-parser"
hostdeps = ["python", "python-setuptools", "python-wheel", "python-setuptools-scm"]
rundeps = ["python"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/26/ae/ba6d0189afe37a0888db6ce548080d553e48b226b40f4bd690b4708bea2a/css_parser-1.1.2.tar.gz", sha256 = "51410c9969c111287a2009f9486a1208725194b27d77ba9c3224a0f1ca20d2f5" },
]

environment = '''
export SETUPTOOLS_SCM_PRETEND_VERSION=$version
'''
install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 COPYING.LESSER "$pkgdir/usr/share/licenses/python-css-parser/COPYING.LESSER"
'''
