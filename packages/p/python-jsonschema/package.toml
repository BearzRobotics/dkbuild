# jsonschema from PyPI.
name = "python-jsonschema"
version = "4.26.0"
release = 1
summary = "An implementation of JSON Schema validation for Python"
license = "MIT"
homepage = "https://github.com/python-jsonschema/jsonschema"
hostdeps = ["python", "python-hatchling", "python-hatch-vcs", "python-hatch-fancy-pypi-readme"]
rundeps = ["python", "python-attrs", "python-jsonschema-specifications", "python-referencing", "python-rpds-py"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/b3/fc/e067678238fa451312d4c62bf6e6cf5ec56375422aee02f9cb5f909b3047/jsonschema-4.26.0.tar.gz", sha256 = "0c26707e2efad8aa1bfc5b7ce170f3fccc2e4918ff85989ba9ffa9facb2be326" },
]

environment = '''
export SETUPTOOLS_SCM_PRETEND_VERSION=$version
'''
install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 COPYING "$pkgdir/usr/share/licenses/python-jsonschema/COPYING"
'''
