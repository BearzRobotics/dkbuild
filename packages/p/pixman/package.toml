# Imported draft, untested: dependency names are Chimera's and resolve from the stage 0 image until they are recipes.
# r2: static libraries too (in pixman-static), for fully static programs on musl.
name = "pixman"
version = "0.46.4"
release = 2
summary = "Library of low-level pixel manipulation routines"
license = "MIT"
homepage = "https://pixman.org"
hostdeps = ["meson", "pkgconf", "perl"]
builddeps = ["linux-headers", "libpng-devel"]

source = [
    { url = "https://www.cairographics.org/releases/pixman-0.46.4.tar.gz", sha256 = "d09c44ebc3bd5bee7021c79f922fe8fb2fb57f7320f55e97ff9914d2346a591c" },
]

environment = '''
export LDFLAGS="${LDFLAGS} -Wl,-z,stack-size=2097152"
'''
setup = '''
%meson \
    -Dgnu-inline-asm=enabled \
    -Dlibpng=enabled \
    -Dgtk=disabled \
    -Dopenmp=disabled
'''
build = '''
%meson_build
'''
install = '''
%meson_install
install -Dm644 COPYING "$pkgdir/usr/share/licenses/pixman/COPYING"
'''
