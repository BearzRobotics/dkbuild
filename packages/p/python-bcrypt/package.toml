# bcrypt from PyPI.
name = "python-bcrypt"
version = "5.0.0"
release = 1
summary = "Modern password hashing for your software and your servers"
license = "Apache-2.0"
homepage = "https://pypi.org/project/bcrypt/"
hostdeps = ["python", "python-setuptools", "python-setuptools-rust", "rust"]
rundeps = ["python"]
options = ["!check", "cargodeps"]

source = [
    { url = "https://files.pythonhosted.org/packages/d4/36/3329e2518d70ad8e2e5817d5a4cac6bba05a47767ec416c7d020a965f408/bcrypt-5.0.0.tar.gz", sha256 = "f748f7c2d6fd375cc93d3fba7ef4a9e3a092421b8dbf34d8d4dc06be9492dfdd" },
]

environment = '''
export SETUPTOOLS_SCM_PRETEND_VERSION=$version
export CARGO_HOME=/tmp/cargo-home CARGO_NET_OFFLINE=true
'''
install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-bcrypt/LICENSE"
'''
