# Markdown in Python. needed by: gobject-introspection (its doc tool).
name = "python-markdown"
version = "3.11.4"
release = 1
summary = "Python implementation of Markdown"
license = "BSD-3-Clause"
homepage = "https://python-markdown.github.io"
hostdeps = ["python", "python-setuptools"]
builddeps = ["python-devel"]
rundeps = ["python"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/1c/ff/8644daa33bfdf552c9cfec8d1fc2c690f57a347808f62c406ac6557329c2/markdown-3.11.4.tar.gz", sha256 = "c911a757f33d64a2578bed2d20c57e007b2aedd8a67bceabd593b31143d54ead" },
]

install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
'''
