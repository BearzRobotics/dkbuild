# cloudpickle from PyPI. Installed from its pure-Python wheel: the sdist's pyproject.toml uses
# the [tool.flit.metadata] table, which flit_core 4 (the tree's) no longer reads, and flit_core 3
# is not packaged. The sdist is still the first source (unpacked) for the licence file.
name = "python-cloudpickle"
version = "3.1.3"
release = 1
summary = "Pickler class to extend the standard pickle.Pickler functionality"
license = "BSD-3-Clause"
homepage = "https://github.com/cloudpipe/cloudpickle"
hostdeps = ["python"]
rundeps = ["python"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/59/df/0bf7ef6c2534c140bb4c3d787e1557542e50a96b393659efaa4f39f9a45a/cloudpickle-3.1.3.tar.gz", sha256 = "cbe9fde14429a5db009ea05ce94e5182cf998c97b96918d50c10f73f9c2f4f33" },
    { url = "https://files.pythonhosted.org/packages/a4/42/3b121b42b114919ffc6195a81c1c7065a465f62f46477fbdb87a07699e51/cloudpickle-3.1.3-py3-none-any.whl", sha256 = "1654f4f18e416447210a63c5c25a135d65a292156aa5fa519dfa4baf7726dddb", unpack = false },
]

install = '''
python3 -m pip install --no-deps --no-index --no-compile \
    --root "$pkgdir" --prefix /usr /build/sources/cloudpickle-3.1.3-py3-none-any.whl
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-cloudpickle/LICENSE"
'''
