# Proxmox VE access control (Debian: libpve-access-control): users, groups,
# roles, ACLs, API tokens, realms (PAM, PVE, LDAP, AD, OpenID) and TFA; pveum.
# Pinned to the "bump version to 9.2.0" commit (Proxmox repositories have no tags).
# Left out: the pveum man page and shell completions. Both are generated by
# loading the whole PVE stack at build time (pve-cluster's IPCC, pve-rs, ...),
# and pve-cluster in turn build-depends on this package; the man page also
# needs pve-docs' generator (pve-docs ships the man page). See wip/proxmox/NOTES.md.
# FenrirOS: the PAM service proxmox-ve-auth (files/proxmox-ve-auth) the PAM
# realm authenticates with.
name = "pve-access-control"
version = "9.2.0"
release = 1
summary = "Proxmox VE access control framework"
license = "AGPL-3.0-or-later"
homepage = "https://git.proxmox.com/?p=pve-access-control.git"
hostdeps = ["perl", "make"]
rundeps = ["perl", "pve-common", "pve-cluster", "pve-rs", "perl-authen-pam", "perl-crypt-openssl-random",
           "perl-crypt-openssl-rsa", "perl-json", "perl-json-xs", "perl-mime-base32", "perl-ldap",
           "perl-net-ssleay", "perl-uri", "perl-uuid", "linux-pam", "linux-pam-base"]
options = ["!check"]

source = [
    { url = "snapshot:git https://git.proxmox.com/git/pve-access-control.git e34d4c17fde6b873349a2d50038aebb2476bd72f", sha256 = "acca59aa2d07bd2dc622c27e44248415b07901032901bc28218ec9ebbbd9e777" },
]

install = '''
vendorlib=$(perl -MConfig -e 'print $Config{vendorlib}')
make -C src/PVE install DESTDIR="$pkgdir" PERLDIR="$vendorlib"
install -Dm755 src/pveum "$pkgdir/usr/sbin/pveum"
install -Dm755 src/oathkeygen "$pkgdir/usr/bin/oathkeygen"
install -Dm644 $pkgfiles/proxmox-ve-auth "$pkgdir/usr/lib/pam.d/proxmox-ve-auth"
install -Dm644 debian/copyright "$pkgdir/usr/share/licenses/pve-access-control/copyright"
'''
