# POSIX-strptime 0.13 from CPAN: Perl extension to the POSIX date parsing strptime(3) function.
# Packaged for Proxmox VE (pve-storage). Its tests are not run (!check): several need
# test-only CPAN modules or the network.
name = "perl-posix-strptime"
version = "0.13"
release = 1
summary = "Perl extension to the POSIX date parsing strptime(3) function"
license = "Artistic-1.0-Perl OR GPL-1.0-or-later"
homepage = "https://metacpan.org/dist/POSIX-strptime"
hostdeps = ["perl"]
builddeps = ["perl"]
options = ["!check"]

source = [
    { url = "https://cpan.metacpan.org/authors/id/G/GO/GOZER/POSIX-strptime-0.13.tar.gz", sha256 = "a818109829e35a4ac79677d68063865f40c87c99ca7f3a20890177a8f8e5c277" },
]

build = '''
perl Makefile.PL INSTALLDIRS=vendor
make
'''
install = '''
make DESTDIR="$pkgdir" install
find "$pkgdir" \( -name perllocal.pod -o -name .packlist \) -delete
'''
