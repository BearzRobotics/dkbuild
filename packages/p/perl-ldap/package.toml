# perl-ldap 0.68 from CPAN: LDAP client library.
# Packaged for Proxmox VE (pve-access-control: LDAP/AD realms). Its tests are not run (!check): several need
# test-only CPAN modules or the network.
name = "perl-ldap"
version = "0.68"
release = 1
summary = "LDAP client library"
license = "Artistic-1.0-Perl OR GPL-1.0-or-later"
homepage = "https://metacpan.org/dist/perl-ldap"
hostdeps = ["perl"]
builddeps = ["perl", "perl-convert-asn1"]
rundeps = ["perl-convert-asn1"]
options = ["!check"]

source = [
    { url = "https://cpan.metacpan.org/authors/id/M/MA/MARSCHAP/perl-ldap-0.68.tar.gz", sha256 = "e2f389fe3e7a9e4b61488692919ad723b98f3b479b5288f610daa8c27995b351" },
]

build = '''
perl Makefile.PL INSTALLDIRS=vendor
make
'''
install = '''
make DESTDIR="$pkgdir" install
find "$pkgdir" \( -name perllocal.pod -o -name .packlist \) -delete
'''
