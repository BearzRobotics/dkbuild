# needed by: freecad. PySide6 and shiboken6 from one source (pyside-setup).
name = "pyside6"
version = "6.12.0"
release = 1
summary = "Qt for Python (PySide6, with shiboken6)"
license = "LGPL-3.0-only OR GPL-2.0-only OR GPL-3.0-only"
homepage = "https://www.qt.io/qt-for-python"
hostdeps = ["cmake", "ninja", "pkgconf", "python", "python-setuptools", "llvm", "llvm-clang"]
builddeps = ["qt6-qtbase-devel", "qt6-qtdeclarative-devel", "qt6-qtsvg-devel", "qt6-qt5compat-devel", "llvm-devel", "python-devel", "libxml2-devel", "libxslt-devel", "qt6-qttools-devel", "qt6-qtmultimedia-devel", "qt6-qtwebengine-devel", "qt6-qtcharts-devel", "qt6-qtwebsockets-devel", "qt6-qtwebchannel-devel", "qt6-qtpositioning-devel", "qt6-qtserialport-devel", "qt6-qtsensors-devel", "qt6-qtshadertools-devel", "qt6-qtquick3d-devel", "qt6-qtdatavis3d-devel", "qt6-qtscxml-devel", "qt6-qtwayland-devel"]
options = ["!check", "jobs:12"]

source = [
    { url = "https://download.qt.io/official_releases/QtForPython/pyside6/PySide6-6.12.0-src/pyside-setup-everywhere-src-6.12.0.tar.xz", sha256 = "099c1a597cf33c1b000e11cf68a0b82d216fb802bf81726efc720394f10c7751" },
]

setup = '''
%cmake \
    -DBUILD_TESTS=OFF \
    -DFORCE_LIMITED_API=no \
    -DNO_QT_TOOLS=yes
'''
build = '''
%cmake_build
'''
install = '''
%cmake_install
install -dm755 "$pkgdir/usr/share/licenses/pyside6"
cp LICENSES/* "$pkgdir/usr/share/licenses/pyside6/"
'''

[subpackages.shiboken6]
summary = "Shiboken6: the binding generator and its module"
paths   = ["/usr/bin/shiboken6*", "/usr/lib/libshiboken6*", "/usr/lib/python*/site-packages/shiboken6*"]
