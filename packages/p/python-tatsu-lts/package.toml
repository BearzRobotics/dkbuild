# TatSu-LTS: a maintained branch of the TatSu PEG parser generator with a
# stable API; beanquery's parser is generated with it.
name = "python-tatsu-lts"
version = "5.16.0"
release = 1
summary = "PEG/Packrat parser generator (long-term-support line)"
license = "BSD-4-Clause"
homepage = "https://github.com/dnicolodi/TatSu-LTS"
hostdeps = ["python", "python-hatchling"]
rundeps = ["python"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/d3/81/9ab714191017d23a0e73921e7d869890e5bf6a5eca89dee57d2b76c6c536/tatsu_lts-5.16.0.tar.gz", sha256 = "40ad376b4ed4e139a8d00d00bd6659d44c3b7546933fb3314132f776bfa1f44f" },
]

install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-tatsu-lts/LICENSE"
'''
