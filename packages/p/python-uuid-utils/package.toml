# Fast UUID functions for Python (Rust): PyPI sdist uuid-utils 0.19.0 (build backend maturin); crates from cargodeps. Part of the AI/search stack in the queue.
# Not built (queued, wip/queue): expect first-build fixes (build requirements: maturin>=1,<2).
name = "python-uuid-utils"
version = "0.19.0"
release = 1
summary = "Fast UUID functions for Python (Rust)"
license = "BSD-3-Clause"
homepage = "https://pypi.org/project/uuid-utils"
hostdeps = ["python", "maturin", "rust"]
builddeps = ["python-devel"]
rundeps = ["python"]
options = ["!check", "cargodeps"]

source = [
    { url = "https://files.pythonhosted.org/packages/f1/0f/cd9b3e495e514441e9af3a42c5c63436aee620f61412cafcce67e259228b/uuid_utils-0.19.0.tar.gz", sha256 = "4b2996bb9d12da9b62f6f4c64a066b26926fa75dbe47b4f8e309e24e187abf1d" },
]

environment = '''
export CARGO_HOME=/tmp/cargo-home CARGO_NET_OFFLINE=true
'''
build = '''
maturin build --release --frozen --offline -i python3 --compatibility linux --out dist -j $jobs
'''
install = '''
python3 -m pip install --no-deps --no-index --no-compile --root "$pkgdir" --prefix /usr dist/*.whl
'''
