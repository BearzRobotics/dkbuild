# beautifulsoup4 from PyPI.
name = "python-beautifulsoup4"
version = "4.15.0"
release = 1
summary = "Screen-scraping library"
license = "MIT License"
homepage = "https://www.crummy.com/software/BeautifulSoup/bs4/"
hostdeps = ["python", "python-hatchling"]
rundeps = ["python", "python-soupsieve", "python-typing-extensions"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/43/65/318323f98dbee45d42dff61d8f047181bc6f2268a9068cfad035a46be5af/beautifulsoup4-4.15.0.tar.gz", sha256 = "288e3ca7d54b06f2ac191970bc275c1939cb46d450b255bf6718b04aa37ab4f7" },
]

environment = '''
export SETUPTOOLS_SCM_PRETEND_VERSION=$version
'''
install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-beautifulsoup4/LICENSE"
'''
