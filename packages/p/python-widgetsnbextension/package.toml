# widgetsnbextension from PyPI.
name = "python-widgetsnbextension"
version = "4.0.16"
release = 1
summary = "Jupyter interactive widgets for Jupyter Notebook"
license = "BSD-3-Clause"
homepage = "http://jupyter.org"
hostdeps = ["python", "python-jupyter-packaging", "python-setuptools"]
rundeps = ["python"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/bf/60/bc7a980fc78837d6ef8f5940cca4cadc433364503a4c4d42e2a7a0de3231/widgetsnbextension-4.0.16.tar.gz", sha256 = "adeea0ae78f0856ee4945f413299801b82a0a01416303301f39a704282a37b73" },
]

install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-widgetsnbextension/LICENSE"
'''
