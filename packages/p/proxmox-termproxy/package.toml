# proxmox-termproxy (Debian: proxmox-termproxy): runs a terminal command
# (login shell, qm terminal, pct enter, ...) and relays its I/O over a
# websocket ticket-checked connection for the web UI's xterm.js console.
# Rust; from the pve-xtermjs repository, pinned to the "xterm.js: bump version
# to 6.0.0-3" commit (termproxy itself is unchanged since "termproxy: bump
# version to 2.1.0"; no tags). Its Proxmox crate (proxmox-io) comes from
# git.proxmox.com (patch 0001) and is pinned by files/Cargo.lock.
name = "proxmox-termproxy"
version = "2.1.0"
release = 1
summary = "Terminal proxy for the Proxmox web consoles"
license = "AGPL-3.0-or-later"
homepage = "https://git.proxmox.com/?p=pve-xtermjs.git"
patches = ["0001-proxmox-crates-from-git.patch"]
hostdeps = ["rust"]
options = ["!check", "cargodeps", "cargolock=termproxy"]

source = [
    { url = "snapshot:git https://git.proxmox.com/git/pve-xtermjs.git 83a17e9c32aa2e6a795b26f5412ca7256e115e1c", sha256 = "2c43d270f008c8996f9ad5922f60cf326f75795f3abecc679744f2ad5380a824" },
]

build = '''
cd termproxy
cargo build --release --offline
'''
install = '''
install -Dm755 termproxy/target/release/proxmox-termproxy "$pkgdir/usr/libexec/proxmox/proxmox-termproxy"
install -d "$pkgdir/usr/bin"
ln -s ../libexec/proxmox/proxmox-termproxy "$pkgdir/usr/bin/termproxy"
install -Dm644 termproxy/debian/copyright "$pkgdir/usr/share/licenses/proxmox-termproxy/copyright"
'''
