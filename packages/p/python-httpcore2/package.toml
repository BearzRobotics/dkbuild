# A minimal low-level HTTP client (httpcore fork by Pydantic) (PyPI httpcore2), a Gajim 2.x dependency. Written 2026-11-22; not built yet.
# The build backend wants the uv-dynamic-versioning hatch plugin (git-derived
# versions), which is not packaged and pointless for an sdist: the install step
# rewrites pyproject.toml to a static version (and, for httpx2, static
# dependencies, which upstream computes in the same plugin hook).
name = "python-httpcore2"
version = "2.16.2"
release = 1
summary = "A minimal low-level HTTP client (httpcore fork by Pydantic)"
license = "BSD-3-Clause"
homepage = "https://github.com/pydantic/httpcore2"
hostdeps = ["python", "python-hatchling", "python-hatch-fancy-pypi-readme"]
rundeps = ["python", "python-truststore", "python-h11", "python-anyio", "python-h2", "python-socksio"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/92/9d/df40b41f7db0370f82019820709244e7b660c52aa3da3c9e5c4e8141f6e6/httpcore2-2.16.2.tar.gz", sha256 = "6c519d0f7b44f7269fa9bbb4d2763db395a4a2370f046d8e8e0a4b38227815d2" },
]

install = '''
python3 -I - "$version" <<'PYEOF'
import re, sys
v = sys.argv[1]
s = open("pyproject.toml").read()
s = re.sub(r"\[tool\.hatch\.version\]\nsource = \"uv-dynamic-versioning\"\n", "", s)
s = s.replace('dynamic = ["readme", "version"]', 'dynamic = ["readme"]\nversion = "%s"' % v)
s = s.replace('dynamic = ["readme", "version", "dependencies"]', 'dynamic = ["readme"]\nversion = "%s"\ndependencies = ["truststore>=0.10", "h11>=0.16"]' % v)
s = re.sub(r"\[tool\.hatch\.metadata\.hooks\.uv-dynamic-versioning\]\ndependencies = \[.*?\n\]\n", "", s, flags=re.S)
open("pyproject.toml", "w").write(s)
PYEOF
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE.md "$pkgdir/usr/share/licenses/python-httpcore2/LICENSE.md"
'''
