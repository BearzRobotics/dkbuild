# websocket-client from PyPI.
name = "python-websocket-client"
version = "1.9.2"
release = 1
summary = "WebSocket client for Python with low level API options"
license = "Apache-2.0"
homepage = "https://github.com/websocket-client/websocket-client"
hostdeps = ["python", "python-setuptools"]
rundeps = ["python"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/d8/cb/a5abcc2891249f393827c650c6296660ce40374ac22d99ab9aea41f9d2a2/websocket_client-1.9.2.tar.gz", sha256 = "0fcb57545848be86992e128218fd96dd87a6769ffdb1a968dff79632b85604d0" },
]

environment = '''
export SETUPTOOLS_SCM_PRETEND_VERSION=$version
'''
install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-websocket-client/LICENSE"
'''
