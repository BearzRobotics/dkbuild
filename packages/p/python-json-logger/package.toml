# python-json-logger from PyPI.
name = "python-json-logger"
version = "4.2.0"
release = 1
summary = "JSON Log Formatter for the Python Logging Package"
license = "BSD-2-Clause"
homepage = "https://nhairs.github.io/python-json-logger"
hostdeps = ["python", "python-setuptools"]
rundeps = ["python"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/21/25/5473e46b179f8e8b4ad3aeeb36773d1701b7770eaf5e5bc2025c7303b598/python_json_logger-4.2.0.tar.gz", sha256 = "e371ebe22ec01e289850102091a2b1f6fc9e655c7f1f5f29073936756c290afa" },
]

install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-json-logger/LICENSE"
'''
