# attrs from PyPI.
name = "python-attrs"
version = "26.1.0"
release = 1
summary = "Classes Without Boilerplate"
license = "MIT"
homepage = "https://pypi.org/project/attrs"
hostdeps = ["python", "python-hatchling", "python-hatch-vcs", "python-hatch-fancy-pypi-readme"]
rundeps = ["python"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/9a/8e/82a0fe20a541c03148528be8cac2408564a6c9a0cc7e9171802bc1d26985/attrs-26.1.0.tar.gz", sha256 = "d03ceb89cb322a8fd706d4fb91940737b6642aa36998fe130a9bc96c985eff32" },
]

environment = '''
export SETUPTOOLS_SCM_PRETEND_VERSION=$version
'''
install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-attrs/LICENSE"
'''
