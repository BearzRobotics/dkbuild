# PySocks from PyPI.
name = "python-pysocks"
version = "1.7.1"
release = 1
summary = "A Python SOCKS client module. See https://github.com/Anorov/PySocks for more information."
license = "BSD"
homepage = "https://github.com/Anorov/PySocks"
hostdeps = ["python", "python-setuptools"]
rundeps = ["python"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/bd/11/293dd436aea955d45fc4e8a35b6ae7270f5b8e00b53cf6c024c83b657a11/PySocks-1.7.1.tar.gz", sha256 = "3f8804571ebe159c380ac6de37643bb4685970655d3bba243530d6558b799aa0" },
]

environment = '''
export SETUPTOOLS_SCM_PRETEND_VERSION=$version
'''
install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-pysocks/LICENSE"
'''
