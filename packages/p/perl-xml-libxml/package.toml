# XML-LibXML 2.0213 from CPAN: Interface to Gnome libxml2 xml parsing and DOM library.
# Packaged for Proxmox VE (pve-storage, qemu-server). Its tests are not run (!check): several need
# test-only CPAN modules or the network.
name = "perl-xml-libxml"
version = "2.0213"
release = 1
summary = "Interface to Gnome libxml2 xml parsing and DOM library"
license = "Artistic-1.0-Perl OR GPL-1.0-or-later"
homepage = "https://metacpan.org/dist/XML-LibXML"
hostdeps = ["perl", "pkgconf", "perl-alien-build", "perl-alien-libxml2"]
builddeps = ["perl", "libxml2-devel", "perl-xml-namespacesupport", "perl-xml-sax", "perl-xml-sax-base"]
rundeps = ["perl-xml-namespacesupport", "perl-xml-sax", "perl-xml-sax-base"]
options = ["!check"]
environment = '''
export ALIEN_INSTALL_TYPE=system
'''

source = [
    { url = "https://cpan.metacpan.org/authors/id/T/TO/TODDR/XML-LibXML-2.0213.tar.gz", sha256 = "2af21c5d61ac34ea26a5fabf15ba5a5841e648f7189db3e33b6f28b5489802ab" },
]

build = '''
perl Makefile.PL INSTALLDIRS=vendor
make
'''
install = '''
make DESTDIR="$pkgdir" install
find "$pkgdir" \( -name perllocal.pod -o -name .packlist \) -delete
'''
