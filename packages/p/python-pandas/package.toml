# pandas from PyPI (meson-python; Cython). Optional runtime accelerators and I/O engines
# (numexpr, bottleneck, pyarrow, lxml, openpyxl, sqlalchemy, ...) are separate packages.
name = "python-pandas"
version = "3.1.1"
release = 1
summary = "Powerful data structures for data analysis, time series, and statistics"
license = "BSD-3-Clause"
homepage = "https://pypi.org/project/pandas"
hostdeps = ["python", "python-meson-python", "python-cython", "python-versioneer", "python-numpy", "meson", "ninja", "pkgconf"]
builddeps = ["python-devel", "python-numpy"]
rundeps = ["python", "python-numpy", "python-dateutil", "python-tzdata"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/17/ca/24c6bc92aca3d366146358e47f1d374c0e1a50763ef226fc71eff20a63fb/pandas-3.1.1.tar.gz", sha256 = "05fed3e3b7c99b226f160e29d7d6cb7ef39638c758cbfe42b3f24ba34f04b859" },
]

install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-pandas/LICENSE"
'''
