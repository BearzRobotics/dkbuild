# jupyterlab from PyPI.
name = "python-jupyterlab"
version = "4.6.6"
release = 1
summary = "JupyterLab computational environment"
license = "BSD-3-Clause"
homepage = "https://jupyter.org"
hostdeps = ["python", "python-hatchling", "python-hatch-jupyter-builder"]
rundeps = ["python", "python-async-lru", "python-httpx", "python-ipykernel", "python-jinja2", "python-jupyter-builder", "python-jupyter-core", "python-jupyter-lsp", "python-jupyter-server", "python-jupyterlab-server", "python-notebook-shim", "python-packaging", "python-tornado", "python-traitlets"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/51/43/490a500e421a46900c8afb0c912c1bf3c9977c85831a3815e2c2139309a9/jupyterlab-4.6.6.tar.gz", sha256 = "5f6fbb409158167aeefb5781d6f0b228e24b493cb6e6f1320fb5bc8897acc223" },
]

environment = '''
# The sdist carries the built web UI (static/ or labextension/); the hatch-jupyter-builder
# hook would run npm (jlpm) otherwise, which needs the network, so it is skipped.
export SKIP_JUPYTER_BUILDER=1
'''
install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-jupyterlab/LICENSE"
'''
