# joblib from PyPI.
name = "python-joblib"
version = "1.6.0"
release = 1
summary = "Lightweight pipelining with Python functions"
license = "BSD-3-Clause"
homepage = "https://joblib.readthedocs.io"
hostdeps = ["python", "python-setuptools"]
rundeps = ["python", "python-cloudpickle"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/d5/1d/537ab090f302b838943a1b56497dd53059b9a9b46a074936470173a2e207/joblib-1.6.0.tar.gz", sha256 = "2ccc96785b12046c08fd6d55839c12857831b54a3c1673ffadd2f04bfc4eda03" },
]

install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE.txt "$pkgdir/usr/share/licenses/python-joblib/LICENSE.txt"
'''
