# stack-data from PyPI.
name = "python-stack-data"
version = "0.6.3"
release = 1
summary = "Extract data from python stack frames and tracebacks for informative displays"
license = "MIT"
homepage = "http://github.com/alexmojaki/stack_data"
hostdeps = ["python", "python-setuptools"]
rundeps = ["python", "python-executing", "python-asttokens", "python-pure-eval"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/28/e3/55dcc2cfbc3ca9c29519eb6884dd1415ecb53b0e934862d3559ddcb7e20b/stack_data-0.6.3.tar.gz", sha256 = "836a778de4fec4dcd1dcd89ed8abff8a221f58308462e1c4aa2a3cf30148f0b9" },
]

environment = '''
export SETUPTOOLS_SCM_PRETEND_VERSION=$version
'''
install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE.txt "$pkgdir/usr/share/licenses/python-stack-data/LICENSE.txt"
'''
