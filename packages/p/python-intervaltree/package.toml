# intervaltree from PyPI.
name = "python-intervaltree"
version = "3.2.1"
release = 1
summary = "Editable interval tree data structure for Python 2 and 3"
license = "Apache-2.0"
homepage = "https://github.com/chaimleib/intervaltree"
hostdeps = ["python", "python-hatchling"]
rundeps = ["python", "python-sortedcontainers"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/53/c3/b2afa612aa0373f3e6bb190e6de35f293b307d1537f109e3e25dbfcdf212/intervaltree-3.2.1.tar.gz", sha256 = "f3f7e8baeb7dd75b9f7a6d33cf3ec10025984a8e66e3016d537e52130c73cfe2" },
]

environment = '''
export SETUPTOOLS_SCM_PRETEND_VERSION=$version
'''
setup = '''
# a fixed version instead of uv-dynamic-versioning: its build requirement and
# both of its tool sections go, the version is written in
sed -i -e 's/, "uv-dynamic-versioning"\]/]/' \
    -e '/^\[tool\.uv-dynamic-versioning\]/,/^$/d' \
    -e '/^\[tool\.hatch\.version\]/,/^$/d' \
    -e "s/^dynamic = \\[[\"']version[\"']\\]/version = \"$version\"/" pyproject.toml
grep -q '^requires = \["hatchling"\]' pyproject.toml
grep -q "^version = \"$version\"" pyproject.toml
! grep -q 'uv-dynamic-versioning' pyproject.toml
'''
install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE.txt "$pkgdir/usr/share/licenses/python-intervaltree/LICENSE.txt"
'''
