# mpmath from PyPI.
name = "python-mpmath"
version = "1.4.1"
release = 1
summary = "Python library for arbitrary-precision floating-point arithmetic"
license = "BSD-3-Clause"
homepage = "https://mpmath.org/"
hostdeps = ["python", "python-setuptools", "python-setuptools-scm"]
rundeps = ["python"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/c5/b0/6de8e78014ff1842a90cc9a56da6ccfb598a5390ed0257fcdb7d9680c18b/mpmath-1.4.1.tar.gz", sha256 = "efd6d1b75f09d69524a67609949812668b28e81ecbfe0ab449ced8c13e92642e" },
]

environment = '''
export SETUPTOOLS_SCM_PRETEND_VERSION=$version
'''
install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-mpmath/LICENSE"
'''
