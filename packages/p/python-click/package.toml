# needed by: python-rich-click.
name = "python-click"
version = "8.3.1"
release = 1
summary = "Composable command line interfaces for Python"
license = "BSD-3-Clause"
homepage = "https://palletsprojects.com/p/click"
hostdeps = ["python", "python-flit-core"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/source/c/click/click-8.3.1.tar.gz", sha256 = "12ff4785d337a1bb490bb7e9c2b1ee5da3112e94a8622f26a6c77f5d2fc6842a" },
]

install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE.txt "$pkgdir/usr/share/licenses/python-click/LICENSE.txt"
'''
