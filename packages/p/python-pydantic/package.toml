# needed by: ollama (Python client).
# Built from the sdist offline with pip (--no-build-isolation): the build
# backend comes from hostdeps. setuptools, packaging and flit-core are the
# image's until they are recipes.
name = "python-pydantic"
version = "2.14.3"
release = 1
summary = "Data validation using Python type hints"
license = "MIT"
homepage = "https://github.com/pydantic/pydantic"
hostdeps = ["python", "python-hatchling", "python-hatch-fancy-pypi-readme"]
rundeps = ["python", "python-annotated-types", "python-pydantic-core", "python-typing-extensions", "python-typing-inspection"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/b4/fc/1203d011145c98ddce3cd2f505bb54375ef8d43223053df6bfcf3c746f46/pydantic-2.14.3.tar.gz", sha256 = "1054f237f4d4733e5a30e1e2333bd33a2004ab9ab1510bd053a9a31bb48e232d" },
]

install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
for f in LICENSE LICENSE.txt LICENSE.md LICENSE.rst COPYING LICENSES/*; do
    [ -f "$f" ] && install -Dm644 "$f" "$pkgdir/usr/share/licenses/python-pydantic/${f##*/}"
done
true
'''
