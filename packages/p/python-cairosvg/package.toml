# cairosvg for Python (KiCad's SVG and PDF plotting uses CairoSVG). From Alpine's
# py3-cairosvg.
name = "python-cairosvg"
version = "2.9.1"
release = 1
summary = "SVG converter based on Cairo"
license = "LGPL-3.0-or-later"
homepage = "https://cairosvg.org"
hostdeps = ["python", "python-setuptools"]
rundeps = ["python-cairocffi", "python-cssselect2", "python-defusedxml", "python-pillow", "python-tinycss2"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/source/C/CairoSVG/cairosvg-2.9.1.tar.gz", sha256 = "861bc28ad97ce4f537d50eb3d6ee97a7afcccec9c61ac25c4e7d073fe409aec7" },
]

install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-cairosvg/LICENSE"
'''
