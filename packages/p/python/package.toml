# Follows the DKRescue post's build of python 3.14.3; the importer's draft of
# Chimera's recipe was not used.
name = "python"
version = "3.14.3"
release = 8
summary = "Python programming language"
license = "Python-2.0.1"
homepage = "https://www.python.org"
builddeps = ["libffi-devel", "libexpat-devel", "openssl-devel", "sqlite-devel", "ncurses-devel", "readline-devel", "zlib-ng-compat-devel", "bzip2-devel", "xz-devel"]
options = ["bootstrap", "!check"]

source = [
    { url = "https://www.python.org/ftp/python/3.14.3/Python-3.14.3.tar.xz", sha256 = "a97d5549e9ad81fe17159ed02c68774ad5d266c72f8d9a0b5a9c371fe85d902b" },
]

setup = '''
%configure --enable-shared --with-system-expat
'''
build = '''
%make
'''
install = '''
%make_install
'''
