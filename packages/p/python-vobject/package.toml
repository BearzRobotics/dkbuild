# vobject from PyPI.
name = "python-vobject"
version = "0.9.9"
release = 1
summary = "Python module for parsing and generating iCalendar and vCard files"
license = "Apache-2.0"
homepage = "https://py-vobject.github.io/"
hostdeps = ["python", "python-setuptools"]
rundeps = ["python", "python-dateutil", "python-pytz", "python-six"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/d0/8a/15c34b3d27c43fc81a467d0f66577afc5542326804c42f30557e31c3259e/vobject-0.9.9.tar.gz", sha256 = "ac44e5d7e2079d84c1d52c50a615b9bec4b1ba958608c4c7fe40cbf33247b38e" },
]

install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE-2.0.txt "$pkgdir/usr/share/licenses/python-vobject/LICENSE-2.0.txt"
'''
