# minikerberos from PyPI.
name = "python-minikerberos"
version = "0.4.13"
release = 1
summary = "Kerberos manipulation library in pure Python"
license = "custom"
homepage = "https://github.com/skelsec/minikerberos"
hostdeps = ["python", "python-setuptools"]
rundeps = ["python", "python-asn1crypto", "python-oscrypto", "python-asysocks", "python-unicrypto", "python-tqdm", "python-six"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/ef/83/ce83b623a55e91eedd0b3d4d6a98a48730a8982b366d3e970f066208e0fd/minikerberos-0.4.13.tar.gz", sha256 = "05b9a6b8a7aaad8c3655dcff4d9f731ea2ef1faeee279c5a39787183a0f3e97f" },
]

environment = '''
export SETUPTOOLS_SCM_PRETEND_VERSION=$version
'''
install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-minikerberos/LICENSE"
'''
