# referencing from PyPI.
name = "python-referencing"
version = "0.37.0"
release = 1
summary = "JSON Referencing + Python"
license = "MIT"
homepage = "https://github.com/python-jsonschema/referencing"
hostdeps = ["python", "python-hatchling", "python-hatch-vcs"]
rundeps = ["python", "python-attrs", "python-rpds-py"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/22/f5/df4e9027acead3ecc63e50fe1e36aca1523e1719559c499951bb4b53188f/referencing-0.37.0.tar.gz", sha256 = "44aefc3142c5b842538163acb373e24cce6632bd54bdb01b21ad5863489f50d8" },
]

environment = '''
export SETUPTOOLS_SCM_PRETEND_VERSION=$version
'''
install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 COPYING "$pkgdir/usr/share/licenses/python-referencing/COPYING"
'''
