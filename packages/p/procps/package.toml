name = "procps"
version = "4.0.7"
release = 1
summary = "Utilities for monitoring your system and its processes"
license = "GPL-2.0-or-later AND LGPL-2.1-or-later"
homepage = "https://gitlab.com/procps-ng/procps"
hostdeps = ["automake", "gettext-devel", "libtool", "pkgconf"]
builddeps = ["ncurses-devel"]
options = ["!check"]

source = [
    { url = "https://downloads.sourceforge.net/sourceforge/procps-ng/Production/procps-ng-4.0.7.tar.xz", sha256 = "9d2021f47a4501c667862c9942a92d1953694b21d11bcd1702e83eb594e3d67d" },
]

setup = '''
%configure --disable-static --disable-kill --enable-watch8bit
'''
# dash's echo prints "-e"; procps's generated sources need bash's.
build = '''
make -j$jobs SHELL=/usr/bin/bash CC="$CC"
'''
install = '''
make SHELL=/usr/bin/bash DESTDIR=$pkgdir install
install -Dm644 $pkgfiles/sysctl.conf "$pkgdir/etc/sysctl.conf"
'''
