# bleach from PyPI.
name = "python-bleach"
version = "6.4.0"
release = 1
summary = "An easy safelist-based HTML-sanitizing tool."
license = "Apache-2.0"
homepage = "https://github.com/mozilla/bleach"
hostdeps = ["python", "python-setuptools"]
rundeps = ["python", "python-webencodings"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/48/3c/e12ac860709702bd5ebeb9b56a4fe334f1001246ee1b8f2b7ee28912df7d/bleach-6.4.0.tar.gz", sha256 = "4202482733d85cedd04e59fcb2f89f4e4c7c385a78d3c3c23c30446843a37452" },
]

install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-bleach/LICENSE"
'''
