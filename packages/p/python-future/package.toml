# future from PyPI.
name = "python-future"
version = "1.0.0"
release = 1
summary = "Clean single-source support for Python 3 and 2"
license = "MIT"
homepage = "https://python-future.org"
hostdeps = ["python", "python-setuptools"]
rundeps = ["python"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/a7/b2/4140c69c6a66432916b26158687e821ba631a4c9273c474343badf84d3ba/future-1.0.0.tar.gz", sha256 = "bd2968309307861edae1458a4f8a4f3598c03be43b97521076aebf5d94c07b05" },
]

environment = '''
export SETUPTOOLS_SCM_PRETEND_VERSION=$version
'''
install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE.txt "$pkgdir/usr/share/licenses/python-future/LICENSE.txt"
'''
