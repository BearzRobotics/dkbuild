# IO-HTML 1.004 from CPAN: Open an HTML file with automatic charset detection.
# Packaged for Proxmox VE (a dependency of Proxmox VE's Perl stack). Its tests are not run (!check): several need
# test-only CPAN modules or the network.
name = "perl-io-html"
version = "1.004"
release = 1
summary = "Open an HTML file with automatic charset detection"
license = "Artistic-1.0-Perl OR GPL-1.0-or-later"
homepage = "https://metacpan.org/dist/IO-HTML"
hostdeps = ["perl"]
builddeps = ["perl"]
options = ["!check"]

source = [
    { url = "https://cpan.metacpan.org/authors/id/C/CJ/CJM/IO-HTML-1.004.tar.gz", sha256 = "c87b2df59463bbf2c39596773dfb5c03bde0f7e1051af339f963f58c1cbd8bf5" },
]

build = '''
perl Makefile.PL INSTALLDIRS=vendor
make
'''
install = '''
make DESTDIR="$pkgdir" install
find "$pkgdir" \( -name perllocal.pod -o -name .packlist \) -delete
'''
