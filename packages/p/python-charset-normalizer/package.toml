# Character encoding detection (pure Python build). needed by: python-pdfminer-six.
name = "python-charset-normalizer"
version = "3.5.2"
release = 1
summary = "charset-normalizer for Python"
license = "MIT"
homepage = "https://pypi.org/project/charset-normalizer"
hostdeps = ["python", "python-setuptools"]
builddeps = ["python-devel"]
rundeps = ["python"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/33/1c/f41d4e74c28ab327ff3acd36053f7ea506c55872d7a90b0fa71aa3ab0c89/charset_normalizer-3.5.2.tar.gz", sha256 = "39de2a259fc954455c57274dc94c79d5842774e1247a016aff30bc0efed0f4ef" },
]

install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
'''
