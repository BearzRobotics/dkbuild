# Character encoding detection (pure Python build). needed by: python-pdfminer-six.
name = "python-charset-normalizer"
version = "3.5.3"
release = 1
summary = "charset-normalizer for Python"
license = "MIT"
homepage = "https://pypi.org/project/charset-normalizer"
hostdeps = ["python", "python-setuptools"]
builddeps = ["python-devel"]
rundeps = ["python"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/c2/c3/cae6d3bdefd96a941ffc247c714ac4babc488a69012e11c058f6c17c6c47/charset_normalizer-3.5.3.tar.gz", sha256 = "a250888753faa289e2997962fbb17c4960cbdb58575533ca6fceee68c224bdff" },
]

install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
'''
