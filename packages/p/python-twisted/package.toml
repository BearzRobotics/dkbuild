# Twisted: event-driven networking engine (needed by deluge). Pure Python since 24.x. Its tls extra (idna, pyOpenSSL, service-identity) is a runtime dependency here; not built: the conch/http2/websocket/serial extras, whose libraries (bcrypt, h2, priority, wsproto) are not all in the tree.
# Built from the sdist offline with pip (--no-build-isolation): the build
# backend comes from hostdeps.
name = "python-twisted"
version = "26.10.0"
release = 1
summary = "Event-driven networking engine"
license = "MIT"
homepage = "https://pypi.org/project/twisted/"
hostdeps = ["python", "python-hatchling", "python-hatch-fancy-pypi-readme", "python-incremental"]
rundeps = ["python", "python-attrs", "python-automat", "python-constantly", "python-hyperlink", "python-incremental", "python-typing-extensions", "python-zope-interface", "python-idna", "python-openssl", "python-service-identity"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/fe/31/a5f99ae7f1550914b0702b8f78118d95a79da20525d26fbc1b2ab42bc8ae/twisted-26.10.0.tar.gz", sha256 = "5f0355403e507fc23ceea85e9dbb4bc59335aabde41dd324e8b8cea180dd38de" },
]

install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
for f in LICENSE LICENSE.txt LICENSE.md LICENSE.rst COPYING LICENSES/*; do
    [ -f "$f" ] && install -Dm644 "$f" "$pkgdir/usr/share/licenses/python-twisted/${f##*/}"
done
true
'''
