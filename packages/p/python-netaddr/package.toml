# netaddr from PyPI.
name = "python-netaddr"
version = "1.3.0"
release = 1
summary = "A network address manipulation library for Python"
license = "BSD License"
homepage = "https://pypi.org/project/netaddr/"
hostdeps = ["python", "python-setuptools"]
rundeps = ["python"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/54/90/188b2a69654f27b221fba92fda7217778208532c962509e959a9cee5229d/netaddr-1.3.0.tar.gz", sha256 = "5c3c3d9895b551b763779ba7db7a03487dc1f8e3b385af819af341ae9ef6e48a" },
]

environment = '''
export SETUPTOOLS_SCM_PRETEND_VERSION=$version
'''
install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE.rst "$pkgdir/usr/share/licenses/python-netaddr/LICENSE.rst"
'''
