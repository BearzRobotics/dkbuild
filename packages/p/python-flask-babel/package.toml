# flask-babel from PyPI.
name = "python-flask-babel"
version = "4.0.0"
release = 1
summary = "Adds i18n/l10n support for Flask applications."
license = "BSD-3-Clause"
homepage = "https://github.com/python-babel/flask-babel"
hostdeps = ["python", "python-poetry-core"]
rundeps = ["python", "python-pytz", "python-flask", "python-babel", "python-jinja2"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/58/1a/4c65e3b90bda699a637bfb7fb96818b0a9bbff7636ea91aade67f6020a31/flask_babel-4.0.0.tar.gz", sha256 = "dbeab4027a3f4a87678a11686496e98e1492eb793cbdd77ab50f4e9a2602a593" },
]

environment = '''
export SETUPTOOLS_SCM_PRETEND_VERSION=$version
'''
install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-flask-babel/LICENSE"
'''
