install = '''
d="$pkgdir/usr/share/phet"
mkdir -p "$d"
for f in /build/sources/*_all.html; do
    n=$(basename "$f" _all.html)
    install -m644 "$f" "$d/$n.html"
done
test $(ls "$d" | wc -l) -eq 127
install -m644 $pkgfiles/index.html "$d/index.html"
install -Dm644 $pkgfiles/phet-simulations.desktop "$pkgdir/usr/share/applications/phet-simulations.desktop"
install -Dm755 $pkgfiles/phet-simulations "$pkgdir/usr/bin/phet-simulations"
install -Dm644 $pkgfiles/LICENSE "$pkgdir/usr/share/licenses/phet-simulations/LICENSE"
'''
