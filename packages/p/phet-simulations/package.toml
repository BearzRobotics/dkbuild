# PhET Interactive Simulations (University of Colorado Boulder): the 127
# HTML5 simulations, each one self-contained file with every language in it
# (<sim>_all.html; the language follows the browser's, or ?locale=), pinned by
# version from PhET's metadata service (2026-11-11). They run offline in any
# browser: an index page in /usr/share/phet and a menu entry that opens it.
# Simulations: CC-BY-4.0 (PhET's terms; their code is MIT/GPL-3.0, built into
# each file). No build: the files are installed as they are.
# To update: the list and versions come from
# https://phet.colorado.edu/services/metadata/1.3/simulations?format=json&type=html&summary
