# File-Slurp 9999.32 from CPAN: Simple and Efficient Reading/Writing/Modifying of Complete Files.
# Packaged for Proxmox VE (Locale::PO (proxmox-i18n's build)). Its tests are not run (!check): several need
# test-only CPAN modules or the network.
name = "perl-file-slurp"
version = "9999.32"
release = 1
summary = "Simple and Efficient Reading/Writing/Modifying of Complete Files"
license = "Artistic-1.0-Perl OR GPL-1.0-or-later"
homepage = "https://metacpan.org/dist/File-Slurp"
hostdeps = ["perl"]
builddeps = ["perl"]
options = ["!check"]

source = [
    { url = "https://cpan.metacpan.org/authors/id/C/CA/CAPOEIRAB/File-Slurp-9999.32.tar.gz", sha256 = "4c3c21992a9d42be3a79dd74a3c83d27d38057269d65509a2f555ea0fb2bc5b0" },
]

build = '''
perl Makefile.PL INSTALLDIRS=vendor
make
'''
install = '''
make DESTDIR="$pkgdir" install
find "$pkgdir" \( -name perllocal.pod -o -name .packlist \) -delete
'''
