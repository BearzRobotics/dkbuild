# Socket6 0.29 from CPAN: IPv6 related part of the C socket.h defines and structure manipulators.
# Packaged for Proxmox VE (a dependency of Proxmox VE's Perl stack). Its tests are not run (!check): several need
# test-only CPAN modules or the network.
name = "perl-socket6"
version = "0.29"
release = 1
summary = "IPv6 related part of the C socket.h defines and structure manipulators"
license = "BSD-3-Clause"
homepage = "https://metacpan.org/dist/Socket6"
hostdeps = ["perl"]
builddeps = ["perl"]
options = ["!check"]

source = [
    { url = "https://cpan.metacpan.org/authors/id/U/UM/UMEMOTO/Socket6-0.29.tar.gz", sha256 = "468915fa3a04dcf6574fc957eff495915e24569434970c91ee8e4e1459fc9114" },
]

build = '''
perl Makefile.PL INSTALLDIRS=vendor
make
'''
install = '''
make DESTDIR="$pkgdir" install
find "$pkgdir" \( -name perllocal.pod -o -name .packlist \) -delete
'''
