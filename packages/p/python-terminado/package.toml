# terminado from PyPI.
name = "python-terminado"
version = "0.18.1"
release = 1
summary = "Tornado websocket backend for the Xterm.js Javascript terminal emulator library."
license = "BSD-2-Clause"
homepage = "https://github.com/jupyter/terminado"
hostdeps = ["python", "python-hatchling"]
rundeps = ["python", "python-ptyprocess", "python-tornado"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/8a/11/965c6fd8e5cc254f1fe142d547387da17a8ebfd75a3455f637c663fb38a0/terminado-0.18.1.tar.gz", sha256 = "de09f2c4b85de4765f7714688fff57d3e75bad1f909b589fde880460c753fd2e" },
]

install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-terminado/LICENSE"
'''
