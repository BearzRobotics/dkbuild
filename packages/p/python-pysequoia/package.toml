# pysequoia: Python bindings for Sequoia PGP (Rust, pure-Rust crypto backend), a Gajim 2.x
# dependency (OpenPGP). Written 2026-11-22, not built yet. Same recipe shape as
# python-watchfiles: crates vendored on the host (cargodeps), `maturin build` makes the
# wheel offline, linked dynamically against musl so Python can load it.
name = "python-pysequoia"
version = "0.1.36"
release = 1
summary = "Python bindings for the Sequoia OpenPGP library"
license = "Apache-2.0"
homepage = "https://github.com/wiktor-k/pysequoia"
hostdeps = ["python", "rust", "maturin"]
builddeps = ["python-devel"]
rundeps = ["python"]
options = ["!check", "cargodeps"]

source = [
    { url = "https://files.pythonhosted.org/packages/d7/68/0b4d4cd3a139ae8895cf88ed3f891447a5e4af09e8aad18585dce6764d58/pysequoia-0.1.36.tar.gz", sha256 = "3e3f8d1e003cec0bf7b437d69f659c3d4ae784ac28b059580ef87fb56e8009d9" },
]

environment = '''
export CARGO_HOME=/tmp/cargo-home CARGO_NET_OFFLINE=true
export RUSTFLAGS="-C target-feature=-crt-static"
'''
build = '''
maturin build --release --frozen --offline -i python3 --compatibility linux --out dist -j $jobs
'''
install = '''
python3 -m pip install --no-deps --no-index --no-compile --root "$pkgdir" --prefix /usr dist/*.whl
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-pysequoia/LICENSE"
'''
