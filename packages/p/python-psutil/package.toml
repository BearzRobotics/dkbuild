# psutil from PyPI.
name = "python-psutil"
version = "7.2.2"
release = 1
summary = "Cross-platform lib for process and system monitoring."
license = "BSD-3-Clause"
homepage = "https://github.com/giampaolo/psutil"
hostdeps = ["python", "python-setuptools"]
builddeps = ["linux-headers"]
rundeps = ["python"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/aa/c6/d1ddf4abb55e93cebc4f2ed8b5d6dbad109ecb8d63748dd2b20ab5e57ebe/psutil-7.2.2.tar.gz", sha256 = "0746f5f8d406af344fd547f1c8daa5f5c33dbc293bb8d6a16d80b4bb88f59372" },
]

environment = '''
export SETUPTOOLS_SCM_PRETEND_VERSION=$version
'''
install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-psutil/LICENSE"
'''
