# terminaltables from PyPI.
name = "python-terminaltables"
version = "3.1.10"
release = 1
summary = "Generate simple tables in terminals from a nested list of strings."
license = "MIT"
homepage = "https://github.com/matthewdeanmartin/terminaltables"
hostdeps = ["python", "python-poetry-core"]
rundeps = ["python"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/f5/fc/0b73d782f5ab7feba8d007573a3773c58255f223c5940a7b7085f02153c3/terminaltables-3.1.10.tar.gz", sha256 = "ba6eca5cb5ba02bba4c9f4f985af80c54ec3dccf94cfcd190154386255e47543" },
]

environment = '''
export SETUPTOOLS_SCM_PRETEND_VERSION=$version
'''
setup = '''
# its backend is the full Poetry; poetry-core builds it the same
sed -i 's/poetry.masonry.api/poetry.core.masonry.api/; s/"poetry[^"]*"/"poetry-core"/' pyproject.toml
'''
install = '''
# its build backend is full Poetry's (poetry.masonry.api); poetry-core's reads
# the same [tool.poetry] table
# (the file has CRLF line ends, kept as they are)
python3 - <<'PY'
p = "pyproject.toml"
s = open(p, newline="").read()
s = s.replace('"poetry>=0.12"', '"poetry-core"').replace('"poetry.masonry.api"', '"poetry.core.masonry.api"')
open(p, "w", newline="").write(s)
if '"poetry.core.masonry.api"' not in s:
    raise SystemExit("pyproject.toml: build backend not changed")
PY
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-terminaltables/LICENSE"
'''
