name = "plutovg"
version = "1.3.3"
release = 1
summary = "Tiny 2D vector graphics library in C"
license = "MIT"
homepage = "https://github.com/sammycage/plutovg"
hostdeps = ["cmake", "ninja", "pkgconf"]
options = ["!check"]

source = [
    { url = "https://github.com/sammycage/plutovg/archive/refs/tags/v1.3.3.tar.gz", sha256 = "2b0d17a6e016f47b86f9c00e2cb82600041b1ea1f7d2a00c2d46ae542cbfed3c" },
]

setup = '''
%cmake \
    -DBUILD_SHARED_LIBS=ON \
    -DPLUTOVG_BUILD_EXAMPLES=OFF
cmake -B build-static -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr \
    -DCMAKE_INSTALL_LIBDIR=lib -DBUILD_SHARED_LIBS=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
    -DPLUTOVG_BUILD_EXAMPLES=OFF
'''
build = '''
%cmake_build
cmake --build build-static
'''
install = '''
%cmake_install
install -Dm644 "$(find build-static -name libplutovg.a | head -n 1)" "$pkgdir/usr/lib/libplutovg.a"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/plutovg/LICENSE"
'''
