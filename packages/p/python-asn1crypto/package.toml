# asn1crypto from PyPI.
name = "python-asn1crypto"
version = "1.5.1"
release = 1
summary = "Fast ASN.1 parser and serializer with definitions for private keys, public keys, certificates, CRL, "
license = "MIT"
homepage = "https://github.com/wbond/asn1crypto"
hostdeps = ["python", "python-setuptools"]
rundeps = ["python"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/de/cf/d547feed25b5244fcb9392e288ff9fdc3280b10260362fc45d37a798a6ee/asn1crypto-1.5.1.tar.gz", sha256 = "13ae38502be632115abf8a24cbe5f4da52e3b5231990aff31123c805306ccb9c" },
]

environment = '''
export SETUPTOOLS_SCM_PRETEND_VERSION=$version
'''
install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-asn1crypto/LICENSE"
'''
