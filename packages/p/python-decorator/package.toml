# decorator from PyPI.
name = "python-decorator"
version = "5.3.2"
release = 1
summary = "Decorators for Humans"
license = "BSD-2-Clause"
homepage = "https://pypi.org/project/decorator/"
hostdeps = ["python", "python-setuptools"]
rundeps = ["python"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/4e/a2/dc08c667e7e51cb035ffab38ae98d7d0f249092591130db4f67dc26b0021/decorator-5.3.2.tar.gz", sha256 = "d9883f1b8259e3bfc42565d0bc6fdc760012008552aa449f75efd2d48319b82b" },
]

environment = '''
export SETUPTOOLS_SCM_PRETEND_VERSION=$version
'''
install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE.txt "$pkgdir/usr/share/licenses/python-decorator/LICENSE.txt"
'''
