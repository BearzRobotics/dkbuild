# C++/Python bindings. needed by: python-pikepdf.
name = "python-nanobind"
version = "3.1.0"
release = 1
summary = "nanobind for Python"
license = "MIT"
homepage = "https://pypi.org/project/nanobind"
hostdeps = ["python", "python-scikit-build-core", "cmake", "ninja"]
builddeps = ["python-devel"]
rundeps = ["python"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/c7/1f/e28fae715401e8f57400e72aeaff4fde12046d31828164f34f61f0816da8/nanobind-3.1.0.tar.gz", sha256 = "6661e3dc1434d78781ccf7913442d90361dab395c3424efadb63bbb6ddea7ea3" },
]

install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
'''
