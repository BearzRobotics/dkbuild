# After Chimera Linux cports: main/poppler. cports is BSD-2-Clause, Copyright (c) Chimera Linux contributors.
# Poppler, the PDF rendering library: poppler-glib (GLib/Cairo), poppler-cpp,
# and the pdftops/pdftotext/pdfinfo/... tools. needed by: libcupsfilters,
# libppd (and the PDF readers to come, dkde's among them).
# Not built yet: the Qt 6 binding (with Qt 6, poppler r2), signature
# verification (needs NSS or gpgme), Boost's faster Splash backend, and
# GObject introspection; none of them is in the tree yet.
name = "poppler"
version = "26.08.0"
release = 1
summary = "PDF rendering library"
license = "GPL-2.0-only OR GPL-3.0-only"
homepage = "https://poppler.freedesktop.org"
patches = ["cmake-none-cflags.patch"]
hostdeps = ["cmake", "ninja", "pkgconf", "glib-devel"]
builddeps = ["cairo-devel", "curl-devel", "fontconfig-devel", "freetype-devel", "glib-devel", "lcms2-devel", "libjpeg-turbo-devel", "libpng-devel", "libtiff-devel", "openjpeg-devel", "zlib-ng-compat-devel"]
rundeps = ["poppler-data"]
options = ["!check"]

source = [
    { url = "https://poppler.freedesktop.org/poppler-26.08.0.tar.xz", sha256 = "dc906e68cea698109706ac6aa3d2c9d4512fcfcac42d90b8afcda486d1b9abd0" },
]

setup = '''
%cmake \
    -DENABLE_UNSTABLE_API_ABI_HEADERS=ON \
    -DENABLE_CPP=ON \
    -DENABLE_GLIB=ON \
    -DENABLE_UTILS=ON \
    -DENABLE_LIBCURL=ON \
    -DENABLE_LCMS=ON \
    -DENABLE_LIBOPENJPEG=openjpeg2 \
    -DENABLE_LIBTIFF=ON \
    -DENABLE_BOOST=OFF \
    -DENABLE_NSS3=OFF \
    -DENABLE_GPGME=OFF \
    -DENABLE_QT5=OFF \
    -DENABLE_QT6=OFF \
    -DENABLE_GOBJECT_INTROSPECTION=OFF \
    -DBUILD_GTK_TESTS=OFF \
    -DBUILD_QT6_TESTS=OFF \
    -DBUILD_CPP_TESTS=OFF \
    -DBUILD_MANUAL_TESTS=OFF
'''
build = '''
%cmake_build
'''
install = '''
%cmake_install
'''
