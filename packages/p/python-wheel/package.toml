# wheel from PyPI.
name = "python-wheel"
version = "0.48.0"
release = 1
summary = "Command line tool for manipulating wheel files"
license = "MIT"
homepage = "https://github.com/pypa/wheel"
hostdeps = ["python", "python-flit-core"]
rundeps = ["python", "python-packaging"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/d0/20/50ed6bdf27dec98b568a8ae25dc599f35baa3d9709f9e83fd1edb56b9a90/wheel-0.48.0.tar.gz", sha256 = "94800765601e9171bf5d58d066e640662842bcedcbab982b2c90787a2c987322" },
]

install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE.txt "$pkgdir/usr/share/licenses/python-wheel/LICENSE.txt"
'''
