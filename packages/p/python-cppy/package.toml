# cppy from PyPI.
name = "python-cppy"
version = "1.3.1"
release = 1
summary = "cppy"
license = "BSD-3-Clause"
homepage = "https://pypi.org/project/cppy"
hostdeps = ["python", "python-setuptools", "python-setuptools-scm"]
rundeps = ["python", "python-setuptools"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/45/ed/b35645a1b285bce356f30cc0fe77a042375c385660ccd61e0cdc4c1f7c44/cppy-1.3.1.tar.gz", sha256 = "55b5307c11874f242ea135396f398cb67a5bbde4fab3e3c3294ea5fce43a6d68" },
]

environment = '''
export SETUPTOOLS_SCM_PRETEND_VERSION=$version
'''
install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-cppy/LICENSE"
'''
