# msgspec: fast serialization and schema validation (a C extension). Needed
# by Fava.
name = "python-msgspec"
version = "0.22.0"
release = 1
summary = "Fast serialization and validation for JSON, MessagePack, YAML, TOML"
license = "BSD-3-Clause"
homepage = "https://jcristharif.com/msgspec/"
hostdeps = ["python", "python-setuptools", "python-setuptools-scm"]
builddeps = ["python-devel"]
rundeps = ["python"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/d0/e6/6dcf9306ff3c5e486578f3bf29ed11dfbdbbc2a8bf0caf7e07d392887fda/msgspec-0.22.0.tar.gz", sha256 = "0a13624a4969159fe35d8c2a3d377b2b61bbd8585e327440d5e52725affcce38" },
]

environment = '''
export SETUPTOOLS_SCM_PRETEND_VERSION=$version
'''
install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-msgspec/LICENSE"
'''
