# Unicode bidirectional algorithm (Rust): PyPI sdist python-bidi 0.6.12 (build backend maturin); crates from cargodeps. Part of the AI/search stack in the queue.
# Not built (queued, wip/queue): expect first-build fixes (build requirements: maturin>=1,<2).
name = "python-bidi"
version = "0.6.12"
release = 1
summary = "Unicode bidirectional algorithm (Rust)"
license = "MIT"
homepage = "https://pypi.org/project/python-bidi"
hostdeps = ["python", "maturin", "rust"]
builddeps = ["python-devel"]
rundeps = ["python"]
options = ["!check", "cargodeps"]

source = [
    { url = "https://files.pythonhosted.org/packages/3d/9d/b7ede7e25102f9e52c6cd5ffcd660eea659c2584001df84a352c76f62d74/python_bidi-0.6.12.tar.gz", sha256 = "bef41af9bfd16fc6cfc31d8b72a87023b52b5ebd468d9ff2f331a6843b2dad82" },
]

environment = '''
export CARGO_HOME=/tmp/cargo-home CARGO_NET_OFFLINE=true
'''
build = '''
maturin build --release --frozen --offline -i python3 --compatibility linux --out dist -j $jobs
'''
install = '''
python3 -m pip install --no-deps --no-index --no-compile --root "$pkgdir" --prefix /usr dist/*.whl
'''
