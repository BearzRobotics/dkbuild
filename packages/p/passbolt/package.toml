environment = '''
export COMPOSER_HOME=/tmp/composer COMPOSER_CACHE_DIR=/tmp/composer-cache COMPOSER_DISABLE_NETWORK=1 \
    COMPOSER_NO_INTERACTION=1 COMPOSER_ALLOW_SUPERUSER=1
'''
build = '''
python3 $pkgfiles/composer-local.py composer.lock /build/sources
# extensions are checked at run time (php-gnupg and the rest are rundeps)
composer install --no-dev --no-scripts --prefer-dist --optimize-autoloader --ignore-platform-reqs
test -f vendor/autoload.php
'''
install = '''
d="$pkgdir/usr/share/passbolt"
mkdir -p "$d" "$pkgdir/etc"
cp -a bin config index.php plugins resources src templates vendor webroot composer.json composer.lock "$d/"
# config in /etc, state and logs in /var
mv "$d/config" "$pkgdir/etc/passbolt"
ln -s /etc/passbolt "$d/config"
ln -s /var/lib/passbolt/tmp "$d/tmp"
ln -s /var/log/passbolt "$d/logs"
install -Dm644 $pkgfiles/tmpfiles.conf "$pkgdir/usr/lib/tmpfiles.d/passbolt.conf"
install -Dm644 $pkgfiles/passbolt.cron "$pkgdir/usr/share/doc/passbolt/passbolt.cron"
install -Dm644 $pkgfiles/nginx-passbolt.conf "$pkgdir/usr/share/doc/passbolt/nginx-passbolt.conf"
install -Dm644 $pkgfiles/README.FenrirOS "$pkgdir/usr/share/doc/passbolt/README.FenrirOS"
install -Dm644 LICENSE.txt "$pkgdir/usr/share/licenses/passbolt/LICENSE.txt"
'''
