# Passbolt CE: the open-source password manager for teams (server side; the
# browser extensions come from the browser stores). CakePHP on PHP 8 with
# MariaDB or PostgreSQL, GnuPG through php-gnupg, served by nginx and php-fpm.
# Built from source: the 104 Composer packages composer.lock pins are the
# recipe's sources (GitHub archives of the locked commits), and composer.lock
# is pointed at them (files/composer-local.py), so composer installs offline.
# The web UI's compiled JavaScript is in the source (webroot/js, from
# passbolt-styleguide).
# Layout as Passbolt's Debian package: code in /usr/share/passbolt, config in
# /etc/passbolt, state in /var/lib/passbolt, logs in /var/log/passbolt; the
# email queue runs from an example cron job (installed by the user).
# Setup: /usr/share/doc/passbolt/README.FenrirOS.
# To update: regenerate the sources from the new composer.lock (each
# dist.reference archive's sha256).
# Installed inert (docs/requests.md): no service enabled, no site, no cron
# job, no credentials; the README says how to set it up.
name = "passbolt"
version = "5.17.0"
release = 1
summary = "Open-source password manager for teams (server)"
license = "AGPL-3.0-only"
homepage = "https://www.passbolt.com"
archs = ["x86_64", "aarch64"]
hostdeps = ["php", "composer", "unzip", "python"]
rundeps = ["php", "php-fpm", "php-gnupg", "gnupg", "nginx", "composer"]
options = ["!check", "!strip"]

