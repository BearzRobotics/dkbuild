# Passbolt under nginx with php-fpm (/run/php-fpm.sock). Copy to
# /etc/nginx/http.d/passbolt.conf, set server_name and the certificate, and
# add nginx's user to the _php group so it can reach the socket.
server {
    listen 443 ssl;
    server_name passbolt.example.org;
    ssl_certificate     /etc/ssl/passbolt/cert.pem;
    ssl_certificate_key /etc/ssl/passbolt/key.pem;

    root /usr/share/passbolt/webroot;
    index index.php;
    client_body_buffer_size 100K;
    client_header_buffer_size 1k;
    client_max_body_size 5M;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass unix:/run/php-fpm.sock;
        fastcgi_index index.php;
        fastcgi_intercept_errors on;
        fastcgi_split_path_info ^(.+\.php)(.+)$;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SERVER_NAME $http_host;
        fastcgi_param PHP_VALUE "upload_max_filesize=5M\npost_max_size=5M";
    }
}
server {
    listen 80;
    server_name passbolt.example.org;
    return 301 https://$host$request_uri;
}
