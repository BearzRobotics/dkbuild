# PyNaCl from PyPI.
name = "python-pynacl"
version = "1.6.2"
release = 1
summary = "Python binding to the Networking and Cryptography (NaCl) library"
license = "Apache-2.0"
homepage = "https://github.com/pyca/pynacl"
hostdeps = ["python", "python-setuptools", "python-cffi"]
builddeps = ["libsodium-devel"]
rundeps = ["python", "python-cffi"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/d9/9a/4019b524b03a13438637b11538c82781a5eda427394380381af8f04f467a/pynacl-1.6.2.tar.gz", sha256 = "018494d6d696ae03c7e656e5e74cdfd8ea1326962cc401bcf018f1ed8436811c" },
]

environment = '''
export SETUPTOOLS_SCM_PRETEND_VERSION=$version
export SODIUM_INSTALL=system
'''
install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-pynacl/LICENSE"
'''
