# File-ReadBackwards 1.06 from CPAN: Read a file backwards by lines..
# Packaged for Proxmox VE (pve-manager: task logs). Its tests are not run (!check): several need
# test-only CPAN modules or the network.
name = "perl-file-readbackwards"
version = "1.06"
release = 1
summary = "Read a file backwards by lines."
license = "Artistic-1.0-Perl OR GPL-1.0-or-later"
homepage = "https://metacpan.org/dist/File-ReadBackwards"
hostdeps = ["perl"]
builddeps = ["perl"]
options = ["!check"]

source = [
    { url = "https://cpan.metacpan.org/authors/id/P/PL/PLICEASE/File-ReadBackwards-1.06.tar.gz", sha256 = "32b2a0549389aaf88875ef03d7ebbfff2d5979eca85b7c812f6b4bb10d102f62" },
]

build = '''
perl Makefile.PL INSTALLDIRS=vendor
make
'''
install = '''
make DESTDIR="$pkgdir" install
find "$pkgdir" \( -name perllocal.pod -o -name .packlist \) -delete
'''
