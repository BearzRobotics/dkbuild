# asgiref from PyPI, added for ahmia-site (requested 2026-11-17). Not built yet (wip/queue).
name = "python-asgiref"
version = "3.13.0"
release = 1
summary = "ASGI specs, helper code, and adapters"
license = "BSD-3-Clause"
homepage = "https://github.com/django/asgiref"
hostdeps = ["python", "python-setuptools", "python-wheel"]
rundeps = ["python"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/6b/90/f5fce14e95fccf53b58e8e2c47cd84d40d105d64073ae1ac75166db150e0/asgiref-3.13.0.tar.gz", sha256 = "034cc8cbf72d00553b4be256703ac545120b4e50af13b49dec99da899aeeecb4" },
]

install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-asgiref/LICENSE"
'''
