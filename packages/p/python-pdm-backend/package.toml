# pdm-backend from PyPI.
name = "python-pdm-backend"
version = "2.5.0"
release = 1
summary = "The build backend used by PDM that supports latest packaging standards"
license = "MIT"
homepage = "https://github.com/pdm-project/pdm-backend"
hostdeps = ["python"]
rundeps = ["python"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/fc/d5/a82f533ed51f91a2183faf67a1fcb3b759615ffeca95d05b3e7648bf84bf/pdm_backend-2.5.0.tar.gz", sha256 = "7953b994563d3151755e3364b9d0cfe817ed0eaecdf27c8f777f412d26bcd98a" },
]

install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-pdm-backend/LICENSE"
'''
