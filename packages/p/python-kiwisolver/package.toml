# kiwisolver from PyPI (C++ extension, built with cppy's setuptools helper).
name = "python-kiwisolver"
version = "1.5.1"
release = 1
summary = "A fast implementation of the Cassowary constraint solver"
license = "BSD-3-Clause"
homepage = "https://pypi.org/project/kiwisolver"
hostdeps = ["python", "python-setuptools", "python-setuptools-scm", "python-cppy"]
builddeps = ["python-devel"]
rundeps = ["python"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/ba/07/bd78e6a8fae171ea041ef5bba3ed21a003522fa088834b069b1909981f30/kiwisolver-1.5.1.tar.gz", sha256 = "f1303ef2eec81262a4b708c3e858afe58d7c75ad91c1c05266eda7673369859a" },
]

environment = '''
export SETUPTOOLS_SCM_PRETEND_VERSION=$version
'''
install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-kiwisolver/LICENSE"
'''
