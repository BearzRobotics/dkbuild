# needed by: the build backend of httpx, httpcore, pydantic, ollama and others.
# Built from the sdist offline with pip (--no-build-isolation): the build
# backend comes from hostdeps. setuptools, packaging and flit-core are the
# image's until they are recipes.
name = "python-hatchling"
version = "1.33.0"
release = 1
summary = "Modern, extensible Python build backend"
license = "MIT"
homepage = "https://hatch.pypa.io/latest/"
hostdeps = ["python", "python-packaging", "python-pathspec", "python-pluggy", "python-tomlkit", "python-trove-classifiers"]
rundeps = ["python", "python-packaging", "python-pathspec", "python-pluggy", "python-tomlkit", "python-trove-classifiers"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/7a/f1/e47b937226ae3b093bbd0132eb0b7ee5bfad12c2b5324afd10ae49946b05/hatchling-1.33.0.tar.gz", sha256 = "4c422bd4d554fcff5de5b73e9596f85e41e9f97f7e553d8f7595ecb31a627bef" },
]

install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
for f in LICENSE LICENSE.txt LICENSE.md LICENSE.rst COPYING LICENSES/*; do
    [ -f "$f" ] && install -Dm644 "$f" "$pkgdir/usr/share/licenses/python-hatchling/${f##*/}"
done
true
'''
