# Python library for working with RDF (graphs, SPARQL, serialisations): needed to build zeitgeist (its configure imports rdflib to generate the ontology code),
# for the Lomiri app launcher. Not built (queued, wip/queue): expect first-build fixes.
name = "python-rdflib"
version = "7.6.0"
release = 1
summary = "Python library for working with RDF (graphs, SPARQL, serialisations)"
license = "BSD-3-Clause"
homepage = "https://pypi.org/project/rdflib"
hostdeps = ["python", "python-poetry-core"]
builddeps = []
rundeps = ["python", "python-isodate", "python-pyparsing", "python-html5lib"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/98/f5/18bb77b7af9526add0c727a3b2048959847dc5fb030913e2918bf384fec3/rdflib-7.6.0.tar.gz", sha256 = "6c831288d5e4a5a7ece85d0ccde9877d512a3d0f02d7c06455d00d6d0ea379df" },
]

install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
'''
