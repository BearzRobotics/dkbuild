# pyasn1 from PyPI.
name = "python-pyasn1"
version = "0.6.5"
release = 1
summary = "Pure-Python implementation of ASN.1 types and DER/BER/CER codecs (X.208)"
license = "BSD-2-Clause"
homepage = "https://github.com/pyasn1/pyasn1"
hostdeps = ["python", "python-setuptools"]
rundeps = ["python"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/88/7e/3c0da41061a2021cac7cd524fd57092adbe5b515e8bf9005702e366802e2/pyasn1-0.6.5.tar.gz", sha256 = "6b11616a6bcf3a40e635f082bb232fa57b5e0dd7f517bd7ddd69ec3794508a47" },
]

environment = '''
export SETUPTOOLS_SCM_PRETEND_VERSION=$version
'''
install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE.rst "$pkgdir/usr/share/licenses/python-pyasn1/LICENSE.rst"
'''
