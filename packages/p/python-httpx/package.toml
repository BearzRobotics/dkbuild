# needed by: ollama (Python client).
# Built from the sdist offline with pip (--no-build-isolation): the build
# backend comes from hostdeps. setuptools, packaging and flit-core are the
# image's until they are recipes.
name = "python-httpx"
version = "0.28.1"
release = 1
summary = "The next generation HTTP client."
license = "BSD-3-Clause"
homepage = "https://github.com/encode/httpx"
hostdeps = ["python", "python-hatchling", "python-hatch-fancy-pypi-readme"]
rundeps = ["python", "python-anyio", "python-certifi", "python-httpcore", "python-idna"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/b1/df/48c586a5fe32a0f01324ee087459e112ebb7224f646c0b5023f5e79e9956/httpx-0.28.1.tar.gz", sha256 = "75e98c5f16b0f35b567856f597f06ff2270a374470a5c2392242528e3e3e42fc" },
]

install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
for f in LICENSE LICENSE.txt LICENSE.md LICENSE.rst COPYING LICENSES/*; do
    [ -f "$f" ] && install -Dm644 "$f" "$pkgdir/usr/share/licenses/python-httpx/${f##*/}"
done
true
'''
