# argon2-cffi-bindings from PyPI.
name = "python-argon2-cffi-bindings"
version = "26.1.0"
release = 1
summary = "Low-level CFFI bindings for Argon2"
license = "MIT"
homepage = "https://pypi.org/project/argon2-cffi-bindings/"
hostdeps = ["python", "python-scikit-build-core", "cmake", "ninja", "python-setuptools-scm"]
rundeps = ["python", "python-cffi"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/0b/43/bb8b6e8708d49a5ab36781333af092d9f483b198a2710d01281204640055/argon2_cffi_bindings-26.1.0.tar.gz", sha256 = "63505c71542a44b68b1e38060450fb006404170da375feb31af153e7f9c6205d" },
]

environment = '''
export SETUPTOOLS_SCM_PRETEND_VERSION=$version
'''
install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-argon2-cffi-bindings/LICENSE"
'''
