# dploot from PyPI.
name = "python-dploot"
version = "4.1.3"
release = 1
summary = "DPAPI looting remotely in Python"
license = "MIT"
homepage = "https://pypi.org/project/dploot/"
hostdeps = ["python", "python-poetry-core"]
rundeps = ["python", "python-cryptography", "python-impacket", "python-lxml", "python-pyasn1", "python-pypsrp", "python-questionary"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/b7/e8/941cf46b691b6d29c36e65ab00c32c74808fb88e010fb84e40fab8a655de/dploot-4.1.3.tar.gz", sha256 = "fd2688df7db50600e76d71fa3f4c14ec94ef264b2ea5d4fb1a8e4c55d092a662" },
]

environment = '''
export SETUPTOOLS_SCM_PRETEND_VERSION=$version
'''
install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-dploot/LICENSE"
'''
