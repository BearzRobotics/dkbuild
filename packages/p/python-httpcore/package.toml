# needed by: httpx.
# Built from the sdist offline with pip (--no-build-isolation): the build
# backend comes from hostdeps. setuptools, packaging and flit-core are the
# image's until they are recipes.
name = "python-httpcore"
version = "1.0.9"
release = 1
summary = "A minimal low-level HTTP client."
license = "BSD-3-Clause"
homepage = "https://www.encode.io/httpcore/"
hostdeps = ["python", "python-hatchling", "python-hatch-fancy-pypi-readme"]
rundeps = ["python", "python-certifi", "python-h11"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/06/94/82699a10bca87a5556c9c59b5963f2d039dbd239f25bc2a63907a05a14cb/httpcore-1.0.9.tar.gz", sha256 = "6e34463af53fd2ab5d807f399a9b45ea31c3dfa2276f15a2c3f00afff6e176e8" },
]

install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
for f in LICENSE LICENSE.txt LICENSE.md LICENSE.rst COPYING LICENSES/*; do
    [ -f "$f" ] && install -Dm644 "$f" "$pkgdir/usr/share/licenses/python-httpcore/${f##*/}"
done
true
'''
