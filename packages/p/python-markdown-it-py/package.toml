# Markdown parser. needed by: python-rich.
name = "python-markdown-it-py"
version = "4.2.0"
release = 1
summary = "markdown-it-py for Python"
license = "MIT"
homepage = "https://pypi.org/project/markdown-it-py"
hostdeps = ["python", "python-flit-core"]
builddeps = ["python-devel"]
rundeps = ["python", "python-mdurl"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/06/ff/7841249c247aa650a76b9ee4bbaeae59370dc8bfd2f6c01f3630c35eb134/markdown_it_py-4.2.0.tar.gz", sha256 = "04a21681d6fbb623de53f6f364d352309d4094dd4194040a10fd51833e418d49" },
]

install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
'''
