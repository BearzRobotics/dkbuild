# needed by: ollama (Python client).
# Built from the sdist offline with pip (--no-build-isolation): the build
# backend comes from hostdeps. setuptools, packaging and flit-core are the
# image's until they are recipes.
name = "python-hatch-vcs"
version = "0.5.0"
release = 1
summary = "Hatch plugin for versioning with your preferred VCS"
license = "MIT"
homepage = "https://github.com/ofek/hatch-vcs"
hostdeps = ["python", "python-hatchling", "python-setuptools-scm"]
rundeps = ["python", "python-hatchling", "python-setuptools-scm"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/6b/b0/4cc743d38adbee9d57d786fa496ed1daadb17e48589b6da8fa55717a0746/hatch_vcs-0.5.0.tar.gz", sha256 = "0395fa126940340215090c344a2bf4e2a77bcbe7daab16f41b37b98c95809ff9" },
]

install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
for f in LICENSE LICENSE.txt LICENSE.md LICENSE.rst COPYING LICENSES/*; do
    [ -f "$f" ] && install -Dm644 "$f" "$pkgdir/usr/share/licenses/python-hatch-vcs/${f##*/}"
done
true
'''
