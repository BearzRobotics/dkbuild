# Python binding of libselinux (the `selinux` module): built from the libselinux source (the C library is the libselinux package, built without bindings). SELinux userspace 3.11 (https://github.com/SELinuxProject/selinux). Not built (queued, wip/queue): expect first-build fixes.
name = "python-selinux"
version = "3.11"
release = 2
summary = "Python binding of libselinux (the `selinux` module)"
license = "LicenseRef-Public-Domain"
homepage = "https://github.com/SELinuxProject/selinux"
hostdeps = ["make", "pkgconf", "swig", "python", "python-setuptools"]
builddeps = ["libselinux-devel", "libsepol-devel", "musl-fts-devel", "pcre2-devel", "python-devel"]
rundeps = ["python", "libselinux"]
options = ["!check"]

source = [
    { url = "https://github.com/SELinuxProject/selinux/releases/download/3.11/libselinux-3.11.tar.gz", sha256 = "73d419c6e20e874adaa4019372cbd097eecf4d276e13f27ec5e67d35c0bd203c" },
]

# r2: libselinux's top-level Makefile chooses PCRE2 and exports PCRE_MODULE, PCRE_CFLAGS and PCRE_LDLIBS to src/; these steps run make in src/ directly,
# so src/ fell back to <pcre.h> ("'pcre.h' file not found"). The same values, for PCRE2, are passed on each command line.
environment = '''
pcre_cflags="-DUSE_PCRE2 -DPCRE2_CODE_UNIT_WIDTH=8 $(pkg-config --cflags libpcre2-8)"
pcre_ldlibs="$(pkg-config --libs libpcre2-8)"
'''
setup = '''
true
'''
build = '''
make -C src PYTHON=python3 FTS_LDLIBS="-lfts" PCRE_MODULE=libpcre2-8 PCRE_CFLAGS="$pcre_cflags" PCRE_LDLIBS="$pcre_ldlibs" SHLIBDIR=/usr/lib swigify
make -C src PYTHON=python3 FTS_LDLIBS="-lfts" PCRE_MODULE=libpcre2-8 PCRE_CFLAGS="$pcre_cflags" PCRE_LDLIBS="$pcre_ldlibs" SHLIBDIR=/usr/lib pywrap
'''
install = '''
make -C src PYTHON=python3 FTS_LDLIBS="-lfts" PCRE_MODULE=libpcre2-8 PCRE_CFLAGS="$pcre_cflags" PCRE_LDLIBS="$pcre_ldlibs" SHLIBDIR=/usr/lib DESTDIR="$pkgdir" install-pywrap
'''
