# wcwidth from PyPI.
name = "python-wcwidth"
version = "0.9.5"
release = 1
summary = "Measures the displayed width of unicode strings in a terminal"
license = "custom"
homepage = "https://github.com/jquast/wcwidth"
hostdeps = ["python", "python-setuptools"]
rundeps = ["python"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/8e/da/d59374b2c893ae70a41fdb064637ccef218f25df8c67e5431a96708235d9/wcwidth-0.9.5.tar.gz", sha256 = "713534e2ecb16e0fc39f19e0a5dda997da76d010953e9e8f803e7971f8accd80" },
]

environment = '''
export SETUPTOOLS_SCM_PRETEND_VERSION=$version
'''
install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-wcwidth/LICENSE"
'''
