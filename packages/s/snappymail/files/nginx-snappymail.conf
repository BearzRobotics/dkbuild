# SnappyMail under nginx with php-fpm (/run/php-fpm.sock). Its data is in
# /var/lib/snappymail, outside the served tree. Copy to
# /etc/nginx/http.d/snappymail.conf, set server_name and TLS, and add nginx's
# user to the _php group.
server {
    listen 80;
    server_name webmail.example.org;
    root /usr/share/snappymail;
    index index.php;
    client_max_body_size 25m;
    location ^~ /snappymail/v/ {
        location ~ /static/ { try_files $uri =404; }
        deny all;
    }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ /index.php$is_args$args; }
    location ~ ^/index\.php$ {
        fastcgi_pass unix:/run/php-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
