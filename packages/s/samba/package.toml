# From Chimera Linux cports (main/samba; BSD-2-Clause, Copyright (c) Chimera
# Linux contributors), patches included.
#
# needed by: gvfs-smb and dkde's file manager (libsmbclient, in samba-libs and
# samba-devel), and anyone who wants `smbclient` (samba-client). The server
# (smbd, nmbd, winbindd) stays in the main package, so installing the client
# side doesn't bring it in.
#
# Built without PAM (the system has none) and without the AD domain controller,
# as Chimera does. Uses the system's Heimdal, talloc, tevent and tdb; ldb is
# part of Samba now and comes from here.
# r5: rewritten (the import lost the waf configure), split client/libs/python.
name = "samba"
version = "4.23.3"
release = 5
summary = "SMB/CIFS file, print, and login server for Unix"
license = "GPL-3.0-or-later"
homepage = "https://www.samba.org"
patches = ["0001-usershare.patch", "0002-ctdb-syslog.patch", "0003-ctdb_etcd_lock-path.patch", "0004-silence-waf-uselib.patch", "0005-msg-sock-run-samba.patch", "0009-getpwent_r.patch", "0010-missing-headers.patch", "0012-musl-uintptr.patch", "0013-paths.patch", "0014-python-so.patch", "0015-samba-bgqd-signal.patch", "unistd.patch"]
hostdeps = ["bison", "docbook-xsl-nons", "flex", "gettext-devel", "heimdal", "libtasn1", "libxslt", "perl", "perl-parse-yapp", "pkgconf", "python", "rpcsvc-proto", "tdb-python", "tevent-python", "talloc-python"]
builddeps = ["acl-devel", "attr-devel", "avahi-devel", "cmocka-devel", "cups-devel", "dbus-devel", "e2fsprogs-devel", "fuse-devel", "gettext-devel", "glib-devel", "gnutls-devel", "gpgme-devel", "heimdal-devel", "icu-devel", "jansson-devel", "libarchive-devel", "libedit-devel", "libtirpc-devel", "lmdb-devel", "musl-bsd-headers", "ncurses-devel", "ngtcp2-devel", "openldap-devel", "popt-devel", "python-devel", "talloc-devel", "tdb-devel", "tevent-devel", "zlib-ng-compat-devel"]
rundeps = ["tdb-progs"]
options = ["!cross", "!check"]

source = [
    { url = "https://download.samba.org/pub/samba/stable/samba-4.23.3.tar.gz", sha256 = "06cdbb27a6956978b045455fe0696d998ffbac8d24ba24de87a4ef8200813320" },
]

environment = '''
export CFLAGS="${CFLAGS} -D_BSD_SOURCE"
# waf, not its wrapper makefile
export PYTHONHASHSEED=1 WAF_MAKE=1
'''
setup = '''
./buildtools/bin/waf configure \
    --prefix=/usr \
    --libdir=/usr/lib \
    --enable-fhs \
    --sbindir=/usr/sbin \
    --localstatedir=/var \
    --sysconfdir=/etc \
    --with-piddir=/run/samba \
    --with-sockets-dir=/run/samba \
    --with-privatelibdir=/usr/lib \
    --with-lockdir=/run/lock/samba \
    --with-modulesdir=/usr/lib/samba \
    --with-statedir=/var/lib/samba \
    --with-cachedir=/var/cache/samba \
    --with-privatedir=/var/lib/samba/private \
    --with-smbpasswd-file=/etc/samba/smbpasswd \
    --with-socketpath=/run/ctdb/ctdbd.socket \
    --with-logdir=/var/log/ctdb \
    --enable-avahi \
    --enable-spotlight \
    --disable-rpath \
    --disable-rpath-install \
    --disable-fault-handling \
    --without-systemd \
    --bundled-libraries=libquic,NONE \
    --with-system-heimdalkrb5 \
    --with-cluster-support \
    --with-automount \
    --with-winbind \
    --with-syslog \
    --with-quota \
    --without-pam \
    --without-ad-dc \
    --with-shared-modules=idmap_ad,idmap_rid,idmap_adex,idmap_hash,idmap_ldap,idmap_tdb2,vfs_nfs4acl_xattr
'''
build = '''
./buildtools/bin/waf build -j$jobs
'''
install = '''
./buildtools/bin/waf install --destdir="$pkgdir"
install -Dm644 examples/smb.conf.default "$pkgdir/etc/samba/smb.conf"
rm -f "$pkgdir/usr/share/man/man7/traffic_learner.7" "$pkgdir/usr/share/man/man7/traffic_replay.7"
# smbspool is also the CUPS backend for SMB printers
install -dm755 "$pkgdir/usr/lib/cups/backend"
ln -sf ../../../bin/smbspool "$pkgdir/usr/lib/cups/backend/smb"
install -dm755 "$pkgdir/var/log/samba" "$pkgdir/var/cache/samba" "$pkgdir/var/lib/samba"
install -dm700 "$pkgdir/var/lib/samba/private"
'''

# The client programs: smbclient, smbget, smbtree, rpcclient, smbspool, ...
[subpackages.client]
summary = "SMB client programs"
paths   = ["/usr/bin/cifsdd", "/usr/bin/mdsearch", "/usr/bin/rpcclient", "/usr/bin/smbcacls", "/usr/bin/smbclient", "/usr/bin/smbcquotas", "/usr/bin/smbget", "/usr/bin/smbspool", "/usr/bin/smbtar", "/usr/bin/smbtree", "/usr/bin/wspsearch", "/usr/lib/cups/backend/smb", "/usr/lib/samba/smbspool_krb5_wrapper"]

[subpackages.python]
summary = "Python bindings"
depends = ["python"]
paths   = ["/usr/lib/python*"]

# Listed before libs, which takes all of /usr/lib.
[subpackages.devel]
summary = "Headers and development files"
paths   = ["/usr/include", "/usr/lib/*.so", "/usr/lib/pkgconfig", "/usr/lib/cmake"]

# libsmbclient, libwbclient, the private libraries they load and Samba's
# modules: everything a client program needs, without the server.
[subpackages.libs]
summary = "Shared libraries (libsmbclient, libwbclient) and modules"
paths   = ["/usr/lib"]
