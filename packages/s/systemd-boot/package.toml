# Imported from Chimera Linux cports: main/systemd-boot/template.py
# cports is BSD-2-Clause, Copyright (c) Chimera Linux contributors.
# The UEFI boot manager, built from systemd's source with everything but the
# bootloader turned off, as Chimera does; no systemd as init. `bootctl install`
# puts it on the EFI system partition. gen-systemd-boot (ours, small: Chimera's
# needs its base-kernel tools) writes the boot entries, with the ESP mounted at
# /boot; the linux package runs it after each kernel install or upgrade.
# Changed from Chimera: no TPM2, no ukify, no man pages; no-getent.patch skips two
# meson checks that only print warnings and need getent, which musl does not ship.
# The other patches are Chimera's systemd-on-musl series (their udev/patches,
# shared with their systemd-boot; much of it from OpenEmbedded).
name = "systemd-boot"
version = "256.11"
release = 1
summary = "UEFI boot manager"
license = "LGPL-2.1-or-later"
homepage = "https://github.com/systemd/systemd"
archs = ["x86_64"]
patches = ["0001-src-boot-efi-meson.build-ensure-VERSION_TAG-exists-i.patch", "0004-missing_type.h-add-comparison_fn_t.patch", "0005-add-fallback-parse_printf_format-implementation.patch", "0006-don-t-fail-if-GLOB_BRACE-and-GLOB_ALTDIRFUNC-is-not-.patch", "0007-add-missing-FTW_-macros-for-musl.patch", "0008-Use-uintmax_t-for-handling-rlim_t.patch", "0009-don-t-pass-AT_SYMLINK_NOFOLLOW-flag-to-faccessat.patch", "0010-Define-glibc-compatible-basename-for-non-glibc-syste.patch", "0011-Do-not-disable-buffering-when-writing-to-oom_score_a.patch", "0012-distinguish-XSI-compliant-strerror_r-from-GNU-specif.patch", "0013-avoid-redefinition-of-prctl_mm_map-structure.patch", "0014-do-not-disable-buffer-in-writing-files.patch", "0015-Handle-__cpu_mask-usage.patch", "0016-Handle-missing-gshadow.patch", "0017-missing_syscall.h-Define-MIPS-ABI-defines-for-musl.patch", "0018-pass-correct-parameters-to-getdents64.patch", "0019-Adjust-for-musl-headers.patch", "0020-test-bus-error-strerror-is-assumed-to-be-GNU-specifi.patch", "0021-errno-util-Make-STRERROR-portable-for-musl.patch", "0022-sd-event-Make-malloc_trim-conditional-on-glibc.patch", "0023-shared-Do-not-use-malloc_info-on-musl.patch", "0024-avoid-missing-LOCK_EX-declaration.patch", "0025-include-signal.h-to-avoid-the-undeclared-error.patch", "0026-undef-stdin-for-references-using-stdin-as-a-struct-m.patch", "0027-adjust-header-inclusion-order-to-avoid-redeclaration.patch", "0028-build-path.c-avoid-boot-time-segfault-for-musl.patch", "uinput.patch", "ukify-zstd-001.patch", "ukify-zstd-002.patch", "ukify.patch", "xxx-chimera-hacks.patch", "xxx-udev-dynbuf.patch", "no-getent.patch"]
hostdeps = ["bash", "gperf", "meson", "perl", "pkgconf", "python-jinja2", "python-pyelftools"]
builddeps = ["acl-devel", "kmod-devel", "libcap-devel", "linux-headers", "openssl-devel", "util-linux-devel"]
rundeps = ["util-linux"]
options = ["!check"]

source = [
    { url = "https://github.com/systemd/systemd/archive/refs/tags/v256.11.tar.gz", sha256 = "5038424744b2ed8c1d7ecc75b00eeffe68528f9789411da60f199d65762d9ba5" },
]

setup = '''
%meson \
    -Dmode=release -Dtime-epoch=0 \
    -Dacl=disabled -Dadm-group=false -Danalyze=false -Dapparmor=disabled -Daudit=disabled \
    -Dbacklight=false -Dbinfmt=false -Dbootloader=enabled -Dbpf-framework=disabled -Dbzip2=disabled \
    -Dcoredump=false -Ddbus=disabled -Defi=true -Delfutils=disabled -Denvironment-d=false \
    -Dfdisk=disabled -Dgcrypt=disabled -Dglib=disabled -Dgshadow=false -Dgnutls=disabled \
    -Dhibernate=false -Dhostnamed=false -Didn=false -Dima=false -Dinitrd=false -Dfirstboot=false \
    -Dkernel-install=false -Dldconfig=false -Dlibcryptsetup=disabled -Dlibcurl=disabled \
    -Dlibfido2=disabled -Dlibidn=disabled -Dlibidn2=disabled -Dlibiptc=disabled -Dlocaled=false \
    -Dlogind=false -Dlz4=disabled -Dmachined=false -Dmicrohttpd=disabled -Dnetworkd=false \
    -Dnscd=false -Dnss-myhostname=false -Dnss-resolve=disabled -Dnss-systemd=false -Doomd=false \
    -Dopenssl=enabled -Dp11kit=disabled -Dpam=disabled -Dpcre2=disabled -Dpolkit=disabled \
    -Dportabled=false -Dpstore=false -Dpwquality=disabled -Drandomseed=false -Dresolve=false \
    -Drfkill=false -Dseccomp=disabled -Dselinux=disabled -Dsmack=false -Dsysext=false \
    -Dsysusers=false -Dtimedated=false -Dtimesyncd=false -Dtmpfiles=false -Dtpm=false \
    -Dtpm2=disabled -Dqrencode=disabled -Dquotacheck=false -Duserdb=false -Dukify=disabled \
    -Dutmp=false -Dvconsole=false -Dwheel-group=false -Dxdg-autostart=false -Dxkbcommon=disabled \
    -Dxz=disabled -Dzlib=disabled -Dzstd=disabled -Dhwdb=false -Dman=disabled \
    -Dstandalone-binaries=true -Dstatic-libudev=false -Dtests=false \
    -Dlink-boot-shared=false -Dlink-journalctl-shared=false -Dlink-networkd-shared=false \
    -Dlink-systemctl-shared=false -Dlink-timesyncd-shared=false -Dlink-udev-shared=false \
    -Dsplit-bin=false -Dsysvinit-path= -Drpmmacrosdir=no -Dpamconfdir=no \
    -Dsbat-distro=fenriros -Dsbat-distro-summary=FenrirOS -Dsbat-distro-pkgname=systemd-boot \
    -Dsbat-distro-url=https://github.com/BearzRobotics/dkbuild -Dsbat-distro-version=256.11-r1
'''
build = '''
%meson_build
'''
install = '''
%meson_install
d="$pkgdir"
# only bootctl, the EFI binaries and stubs, bless-boot: drop the rest of systemd
rm -rf "$d"/etc/systemd "$d"/etc/udev "$d"/usr/bin/udevadm "$d"/usr/include "$d"/usr/lib/libsystemd.* \
       "$d"/usr/lib/libudev.* "$d"/usr/lib/pkgconfig "$d"/usr/lib/udev "$d"/usr/share/bash-completion/completions/udevadm \
       "$d"/usr/share/dbus-1 "$d"/usr/share/pkgconfig "$d"/usr/share/polkit-1 "$d"/usr/share/zsh/site-functions/_udevadm
for f in "$d"/usr/lib/systemd/*; do
    [ "${f##*/}" = boot ] || rm -rf "$f"
done
install -Dm755 build/systemd-bless-boot "$d/usr/lib/systemd-bless-boot"
install -Dm755 "$pkgfiles/gen-systemd-boot" "$d/usr/bin/gen-systemd-boot"
'''
