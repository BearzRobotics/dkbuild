# Imported from Chimera Linux cports: work/cports/main/shared-mime-info/template.py
# cports is BSD-2-Clause, Copyright (c) Chimera Linux contributors.
# Imported draft, untested: dependency names are Chimera's and resolve from the stage 0 image until they are recipes.
# r5: dependencies on this tree's packages, not Chimera's names (built against the image's copies before).
# r6: static libraries too (in shared-mime-info-static), for fully static programs on musl.
# r8 (2026-11-26): the file type database (/usr/share/mime/mime.cache) was never made: the build leaves it out (-Dupdate-mimedb=false) and nothing made it at
# install. Without it GTK cannot tell what an SVG is, and Firefox 161 aborted on the desktop loading an SVG icon.
name = "shared-mime-info"
version = "2.4"
release = 8
# scripts/post-install and scripts/trigger (the trigger watches these directories)
triggers = ["/usr/share/mime/packages"]
summary = "Core database of common types"
license = "GPL-2.0-or-later"
homepage = "https://freedesktop.org/wiki/Software/shared-mime-info"
hostdeps = ["meson", "pkgconf", "gettext", "xmlto", "libxml2", "docbook-xml", "docbook-xsl-nons"]
builddeps = ["glib-devel", "libxml2-devel"]

source = [
    { url = "https://gitlab.freedesktop.org/xdg/shared-mime-info/-/archive/2.4/shared-mime-info-2.4.tar.gz", sha256 = "531291d0387eb94e16e775d7e73788d06d2b2fdd8cd2ac6b6b15287593b6a2de" },
]

setup = '''
%meson \
    -Dupdate-mimedb=false
'''
build = '''
%meson_build
'''
install = '''
%meson_install
'''
