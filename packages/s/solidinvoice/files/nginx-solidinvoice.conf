# SolidInvoice under nginx with php-fpm (/run/php-fpm.sock, or the pool in
# php-fpm-solidinvoice.conf): only public/ is served. Copy to
# /etc/nginx/http.d/solidinvoice.conf, set server_name and TLS, and add
# nginx's user to the _php group.
server {
    listen 80;
    server_name invoices.example.org;
    root /usr/share/solidinvoice/public;
    location / { try_files $uri /index.php$is_args$args; }
    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }
    location ~ \.php$ { return 404; }
}
