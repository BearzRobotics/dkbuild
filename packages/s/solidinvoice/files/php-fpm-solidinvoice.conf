; An optional php-fpm pool of its own for SolidInvoice. Copy to
; /etc/php/php-fpm.d/solidinvoice.conf and point nginx's fastcgi_pass at
; unix:/run/php-fpm-solidinvoice.sock (php-fpm's default www pool also works).
[solidinvoice]
user = _php
group = _php
listen = /run/php-fpm-solidinvoice.sock
listen.owner = _php
listen.group = _php
listen.mode = 0660
pm = ondemand
pm.max_children = 10
pm.process_idle_timeout = 60s
php_admin_value[memory_limit] = 256M
