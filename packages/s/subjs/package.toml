# Fetches javascript file from a list of URLS or subdomains. (BlackArch list, requested 2026-11-16; docs/requests.md). Written from the template of ffuf; not built yet when written (wip/queue): expect first-build fixes.
# Go module, dependencies fetched on the host (godeps). Main package: ..
name = "subjs"
version = "1.0.1"
release = 1
summary = "Fetches javascript file from a list of URLS or subdomains."
license = "MIT"
homepage = "https://github.com/lc/subjs"
hostdeps = ["go"]
options = ["!check", "godeps"]

source = [
    { url = "https://github.com/lc/subjs/archive/refs/tags/v1.0.1.tar.gz", sha256 = "a1772a7cc9a46befd4465616041ff52b3375033f0ec13c48212b776fea37aa24" },
]

environment = '''
export GOFLAGS="-mod=mod -trimpath -buildvcs=false" GOTOOLCHAIN=local GOPROXY=off
export GOCACHE=/tmp/go-cache GOPATH=/tmp/go CGO_ENABLED=0
'''
build = '''
mkdir -p build
go build -o build/subjs .
'''
install = '''
install -Dm755 build/subjs "$pkgdir/usr/bin/subjs"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/subjs/LICENSE"
'''
