# SpliX: Samsung, Xerox, Dell and Lexmark lasers that speak SPL (QPDL), with
# JBIG compression for the models that need it.
name = "splix"
version = "2.0.2"
release = 1
summary = "Driver for SPL (Samsung) printers"
license = "GPL-2.0-only"
homepage = "https://github.com/OpenPrinting/splix"
hostdeps = ["pkgconf"]
builddeps = ["cups-devel", "jbigkit-devel"]
rundeps = ["cups"]
options = ["!check"]

source = [
    { url = "https://github.com/OpenPrinting/splix/archive/refs/tags/2.0.2.tar.gz", sha256 = "182af811aad4d610de0094a83e69037c67c45fa5fdd5ca1b4e93d34dbfd4fa89" },
]

build = '''
make CC="$CC" CXX="$CXX" OPTIM_CFLAGS="$CFLAGS" OPTIM_CXXFLAGS="$CXXFLAGS" LDFLAGS="$LDFLAGS" DISABLE_JBIG=0 -j$jobs
'''
install = '''
make DESTDIR="$pkgdir" DISABLE_JBIG=0 install
install -Dm644 COPYING "$pkgdir/usr/share/licenses/splix/COPYING"
'''
