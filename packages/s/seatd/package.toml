# r2: static libraries too (in seatd-static), for fully static programs on musl.
name      = "seatd"
version   = "0.9.1"
release   = 2
summary   = "Seat management daemon and library"
license   = "MIT"
homepage  = "https://sr.ht/~kennylevinsen/seatd/"
hostdeps  = ["meson", "ninja", "pkgconf"]
builddeps = ["linux-headers"]
options   = ["!check"]

source = [
    { url = "https://git.sr.ht/~kennylevinsen/seatd/archive/0.9.1.tar.gz", sha256 = "819979c922a0be258aed133d93920bce6a3d3565a60588d6d372ce9db2712cd3" },
]

build = '''
%meson -Dlibseat-builtin=enabled -Dserver=enabled -Dexamples=disabled -Dman-pages=disabled
%meson_build
'''
install = '''
%meson_install
'''
