# r2: static libraries too (in seatd-static), for fully static programs on musl.
# r3: libseat also has the elogind backend (it tries seatd first, then logind, then the built-in one), so a
# session on elogind needs no seatd daemon.
name      = "seatd"
version   = "0.9.3"
release   = 1
summary   = "Seat management daemon and library"
license   = "MIT"
homepage  = "https://sr.ht/~kennylevinsen/seatd/"
hostdeps  = ["meson", "ninja", "pkgconf"]
builddeps = ["elogind-devel", "linux-headers"]
options   = ["!check"]

source = [
    { url = "https://git.sr.ht/~kennylevinsen/seatd/archive/0.9.3.tar.gz", sha256 = "302564d54d8e28191fadfd734f2675ecb0c9e0615a58011b89ef15dfa4dbaa96" },
]

build = '''
%meson -Dlibseat-builtin=enabled -Dlibseat-logind=elogind -Dserver=enabled -Dexamples=disabled -Dman-pages=disabled
%meson_build
'''
install = '''
%meson_install
'''
