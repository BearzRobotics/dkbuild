# needed by: bibletime, xiphos. Modules (Bibles, commentaries) are installed by the
# applications from CrossWire's repositories.
name = "sword"
version = "1.9.0"
release = 1
summary = "CrossWire SWORD Bible library and modules engine"
license = "GPL-2.0-only"
homepage = "https://crosswire.org/sword/"
hostdeps = ["cmake", "ninja", "pkgconf"]
builddeps = ["clucene-devel", "curl-devel", "icu-devel", "zlib-ng-compat-devel", "bzip2-devel", "xz-devel"]
options = ["!check"]

source = [
    { url = "https://crosswire.org/ftpmirror/pub/sword/source/v1.9/sword-1.9.0.tar.gz", sha256 = "42409cf3de2faf1108523e2c5ac0745d21f9ed2a5c78ed878ee9dcc303426b8a" },
]

setup = '''
%cmake \
    -DLIBSWORD_LIBRARY_TYPE=Both \
    -DSWORD_BUILD_UTILS=Yes \
    -DSWORD_BUILD_EXAMPLES=No \
    -DSWORD_BUILD_TESTS=No \
    -DSYSCONF_INSTALL_DIR=/etc
'''
build = '''
%cmake_build
'''
install = '''
%cmake_install
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/sword/LICENSE"
'''
