# soundcraft: part of the Craft App Suite (storytold), pure Rust on egui/wgpu. Record, edit and mix audio and MIDI
# Crates vendored on the host (cargodeps), git dependencies included (storytold/craft-libs, the
# storytold forks of egui and winit, winprint.rs which is Windows only but in Cargo.lock).
# Optional build input included: craft-fonts at the commit upstream's CI uses (CRAFT_FONTS_DIR,
# embedded in the binary) -- not used by this app. Both unpack as further sources in /build.
# Windowing (Wayland, X11, xkbcommon) and the GPU (Vulkan, EGL) are opened at run time, so they
# are run-time dependencies, as for alacritty.
# Generated from the wordcraft recipe's pattern; source edits: none. Not built yet when written.
name = "soundcraft"
version = "0.20.1"
release = 1
summary = "Record, edit and mix audio and MIDI"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/storytold/soundcraft"
hostdeps = ["rust", "pkgconf", "llvm-clang"]
builddeps = ["libxcb-devel", "libxkbcommon-devel", "wayland-devel", "alsa-lib-devel"]
rundeps = ["libxkbcommon", "mesa", "vulkan-loader", "wayland", "libx11", "libxcb", "shared-mime-info", "hicolor-icon-theme", "alsa-lib"]
options = ["!check", "cargodeps"]

source = [
    { url = "https://github.com/storytold/soundcraft/archive/refs/tags/v0.20.1.tar.gz", sha256 = "f0ebdb92df0e25806ec7e4678e054e88f49dd4f2e0084d251dbac2c147ec4393" },
]

environment = '''
export CARGO_HOME=/tmp/cargo-home CARGO_NET_OFFLINE=true
'''
build = '''
cargo build --release --frozen --offline --locked -j $jobs -p soundcraft -p soundcraft-cli
'''
install = '''
install -Dm755 target/release/soundcraft "$pkgdir/usr/bin/soundcraft"
install -Dm755 target/release/soundcraft-cli "$pkgdir/usr/bin/soundcraft-cli"
id=ai.storyteller.soundcraft
install -Dm644 packaging/linux/$id.desktop "$pkgdir/usr/share/applications/$id.desktop"
install -Dm644 packaging/linux/$id.mime.xml "$pkgdir/usr/share/mime/packages/$id.xml"
mkdir -p "$pkgdir/usr/share/metainfo"
sed -e "s/@VERSION@/$version/g" -e "s/@DATE@/2026-11-12/g" \
    packaging/linux/$id.metainfo.xml.in > "$pkgdir/usr/share/metainfo/$id.metainfo.xml"
mkdir -p "$pkgdir/usr/share/icons"
cp -R assets/app-icon/hicolor "$pkgdir/usr/share/icons/"
install -Dm644 LICENSE-MIT "$pkgdir/usr/share/licenses/soundcraft/LICENSE-MIT"
install -Dm644 LICENSE-APACHE "$pkgdir/usr/share/licenses/soundcraft/LICENSE-APACHE"
install -Dm644 NOTICE "$pkgdir/usr/share/licenses/soundcraft/NOTICE"
install -Dm644 ATTRIBUTION.md "$pkgdir/usr/share/doc/soundcraft/ATTRIBUTION.md"
'''
