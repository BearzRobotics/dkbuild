# ShellCheck: static analysis for sh/bash scripts (the shellcheck program and
# its manual page). Written in Haskell, built with the system GHC.
# Its Hackage dependencies (aeson and what it needs, Diff, fgl, QuickCheck,
# regex-tdfa) are pinned sources, the versions Alpine's shellcheck 0.11.0
# freezes for GHC 9.14.1 (aports community/shellcheck/cabal.config), less the
# test suite's (tasty, optparse-applicative, prettyprinter, ansi-terminal,
# colour); each at its newest Hackage revision (the revised .cabal is copied
# over the tarball's, as cabal-install does). They are built one after another
# with Cabal's Setup (the Cabal library GHC ships), into a package database in
# /tmp: no cabal-install, no index, no network. Static Haskell libraries only
# (GHC links them into the program); nothing of them is shipped.
# The ShellCheck library itself is not shipped either: nothing in the tree
# uses it, so only the program is installed.
# striptests (upstream's script for packagers, as Alpine and Arch run it)
# removes the unit tests from the sources and QuickCheck from ShellCheck's own
# dependencies: a smaller program. aeson still needs QuickCheck, so it stays.
# Manual page: upstream makes it from shellcheck.1.md with pandoc, which the
# tree does not have (it is a large Haskell program itself); go-md2man makes
# it instead (it reads the same pandoc title block).
name = "shellcheck"
version = "0.11.0"
release = 1
summary = "Static analysis tool for shell scripts"
license = "GPL-3.0-or-later"
homepage = "https://www.shellcheck.net"
archs = ["x86_64"]
hostdeps = ["ghc", "go-md2man", "bash"]
builddeps = ["gmp-devel", "libffi-devel", "numactl-devel"]

