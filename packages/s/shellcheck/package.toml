# ShellCheck: static analysis for sh/bash scripts (the shellcheck program and
# its manual page). Written in Haskell, built with the system GHC.
# Its Hackage dependencies (aeson and what it needs, Diff, fgl, QuickCheck,
# regex-tdfa) come from the hackagedeps store: files/hackage.lock, made by
# `dkbuild hackage-lock` from files/hackage-pins.txt (the versions Alpine's
# shellcheck 0.11.0 freezes for GHC 9.14.1, aports
# community/shellcheck/cabal.config, less the test suite's: tasty,
# optparse-applicative, prettyprinter, ansi-terminal, colour), each at its
# newest Hackage revision (the revised .cabal is copied over the tarball's, as
# cabal-install does). They are built one after another with Cabal's Setup
# (the Cabal library GHC ships), into a package database in /tmp: no
# cabal-install, no index, no network. Static Haskell libraries only (GHC
# links them into the program); nothing of them is shipped.
# The ShellCheck library itself is not shipped either: nothing in the tree
# uses it, so only the program is installed.
# striptests (upstream's script for packagers, as Alpine and Arch run it)
# removes the unit tests from the sources and QuickCheck from ShellCheck's own
# dependencies: a smaller program. aeson still needs QuickCheck, so it stays.
# Manual page: made from shellcheck.1.md with pandoc, as upstream's manpage
# script does (pandoc is a hostdep only; it does not need shellcheck).
name = "shellcheck"
version = "0.11.0"
release = 2
summary = "Static analysis tool for shell scripts"
license = "GPL-3.0-or-later"
homepage = "https://www.shellcheck.net"
archs = ["x86_64"]
hostdeps = ["ghc", "pandoc", "bash"]
builddeps = ["gmp-devel", "libffi-devel", "numactl-devel"]
options = ["hackagedeps"]

source = [
    { url = "https://github.com/koalaman/shellcheck/archive/v0.11.0.tar.gz", sha256 = "8b07554f92e4fbfc33f1539a1f475f21c6503ceae8f806efcc518b1f529f7102" },
]

environment = '''
export HOME=/tmp LANG=C.UTF-8
hs=/tmp/hsdeps
db=$hs/package.db
# files/hackage-pins.txt in build order (each after what it needs)
hsdeps="base-orphans-0.9.4 hashable-1.5.1.0 OneTuple-0.4.3 splitmix-0.1.3.2 random-1.3.1
    QuickCheck-2.16.0.0 character-ps-0.1 data-fix-0.3.4 dlist-1.0 indexed-traversable-0.1.5
    primitive-0.9.1.0 integer-conversion-0.1.1 integer-logarithms-1.0.5 th-compat-0.1.7
    network-uri-2.6.4.2 scientific-0.3.8.1 tagged-0.8.10 unordered-containers-0.2.21
    vector-stream-0.1.0.1 vector-0.13.2.0 indexed-traversable-instances-0.1.2.1 assoc-1.1.1
    distributive-0.6.3 comonad-5.0.10 th-abstraction-0.7.2.0 transformers-compat-0.8 bifunctors-5.6.3
    StateVar-1.2.2 contravariant-1.5.6 semigroupoids-6.0.2 these-1.2.1 semialign-1.4 strict-0.5.1
    time-compat-1.9.9 text-iso8601-0.1.1.1 text-short-0.1.6.1 uuid-types-1.0.6.1 witherable-0.5
    aeson-2.2.5.0 Diff-1.0.2 fgl-5.8.3.1 regex-base-0.94.0.3 regex-tdfa-1.3.2.5"
# Cabal's Setup, configured against GHC's global database and ours only
hsconf="--package-db=clear --package-db=global --package-db=$db --disable-shared
    --disable-library-profiling --disable-tests --disable-benchmarks
    --disable-executable-stripping --ghc-options=-j$jobs"
'''
setup = '''
# drop the unit tests (upstream's packaging script, see the header); it edits
# ShellCheck.cabal and every .hs file of this source
bash ./striptests
mkdir -p $hs/src $hs/setup-obj
ghc-pkg init $db
printf 'import Distribution.Simple\nmain = defaultMain\n' > $hs/Setup.hs
ghc --make -package-env=- -O0 -outputdir $hs/setup-obj -o $hs/setup $hs/Setup.hs
'''
build = '''
for p in $hsdeps; do
    n=${p%-*}
    tar -xzf "$DKBUILD_HACKAGE/$p.tar.gz" -C $hs/src
    # the newest Hackage revision of its .cabal (hackage.lock), if any
    if [ -e "$DKBUILD_HACKAGE/$p.cabal" ]; then cp "$DKBUILD_HACKAGE/$p.cabal" $hs/src/$p/$n.cabal; fi
    (cd $hs/src/$p && $hs/setup configure $hsconf --prefix=$hs/inst && \
        $hs/setup build -j$jobs && $hs/setup install)
done
$hs/setup configure $hsconf --prefix=/usr
$hs/setup build -j$jobs
# upstream's manpage script
pandoc -s -f markdown-smart -t man shellcheck.1.md -o shellcheck.1
'''
check = '''
sc=./dist/build/shellcheck/shellcheck
$sc --version
# an unquoted $1 is SC2086: shellcheck must fail on it, and pass the fix
printf '#!/bin/sh\necho $1\n' > /tmp/t.sh
if $sc /tmp/t.sh; then exit 1; fi
printf '#!/bin/sh\necho "$1"\n' > /tmp/t.sh
$sc /tmp/t.sh
'''
install = '''
install -Dm755 dist/build/shellcheck/shellcheck "$pkgdir/usr/bin/shellcheck"
install -Dm644 shellcheck.1 "$pkgdir/usr/share/man/man1/shellcheck.1"
install -Dm644 README.md "$pkgdir/usr/share/doc/shellcheck/README.md"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/shellcheck/LICENSE"
'''
