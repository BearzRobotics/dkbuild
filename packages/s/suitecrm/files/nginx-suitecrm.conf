# SuiteCRM 8 under nginx with php-fpm (/run/php-fpm.sock, or the pool in
# php-fpm-suitecrm.conf): public/ is the web root. Copy to
# /etc/nginx/http.d/suitecrm.conf, set server_name and TLS, and add nginx's
# user to the _php group.
server {
    listen 80;
    server_name crm.example.org;
    root /opt/suitecrm/public;
    index index.php;
    client_max_body_size 50M;

    location / { try_files $uri /index.php$is_args$args; }
    # the SuiteCRM 7 application and its entry points
    location ~ ^/legacy/.*\.php(/|$) {
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        try_files $fastcgi_script_name =404;
        fastcgi_pass unix:/run/php-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
    location ~ ^/(index|install)\.php(/|$) {
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_pass unix:/run/php-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }
    location ~ \.php$ { return 404; }
    # SuiteCRM 7's data, caches, uploads and logs are not served directly
    location ~ ^/legacy/(cache/(?!themes|jsLanguage|include/javascript)|upload|custom/blowfish|data|log_file|.*\.log$|config.*\.php|vendor|lib|include/.*\.(ini|tpl)$) { deny all; }
    location ~ /\. { deny all; }
}
