# After Chimera/Alpine serf. Needed by subversion (http(s):// repositories).
name = "serf"
version = "1.3.10"
release = 1
summary = "High-performance asynchronous HTTP client library"
license = "Apache-2.0"
homepage = "https://serf.apache.org"
hostdeps = ["pkgconf", "scons"]
builddeps = ["apr-devel", "apr-util-devel", "openssl-devel", "zlib-ng-compat-devel"]
# The test suite starts local HTTP servers and needs the ports.
options = ["!check"]

source = [
    { url = "https://archive.apache.org/dist/serf/serf-1.3.10.tar.bz2", sha256 = "be81ef08baa2516ecda76a77adf7def7bc3227eeb578b9a33b45f7b41dc064e6" },
]

build = '''
# scons does not read the environment: hand it the compiler and flags.
scons CC="${CC:-cc}" CFLAGS="$CFLAGS" LINKFLAGS="$LDFLAGS" PREFIX=/usr
'''
# scons builds libserf-1.so and libserf-1.a and installs both, plus serf.h and serf-1.pc.
install = '''
scons install --install-sandbox="$pkgdir"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/serf/LICENSE"
'''
