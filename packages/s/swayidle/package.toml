# elogind provides the logind D-Bus interface swayidle listens to (sleep and
# lock signals) through libelogind's sd-bus; the tree has no systemd.
name = "swayidle"
version = "1.9.1"
release = 1
summary = "Idle management daemon for Wayland"
license = "MIT"
homepage = "https://github.com/swaywm/swayidle"
hostdeps = ["meson", "pkgconf", "scdoc", "wayland-protocols"]
builddeps = ["elogind-devel", "wayland-devel", "wayland-protocols"]
options = ["!check"]

source = [
    { url = "https://github.com/swaywm/swayidle/releases/download/v1.9.1/swayidle-1.9.1.tar.gz", sha256 = "6e1655ecba30db14de3df1652ef9dd1db72784946fa65cb222404a87ac825d57" },
]

setup = '''
%meson \
    -Dlogind=enabled \
    -Dlogind-provider=elogind \
    -Dman-pages=enabled \
    -Dbash-completions=true \
    -Dfish-completions=true \
    -Dzsh-completions=true
'''
build = '''
%meson_build
'''
install = '''
%meson_install
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/swayidle/LICENSE"
'''
