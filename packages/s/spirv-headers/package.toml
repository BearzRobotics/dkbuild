# Imported from Chimera Linux cports: main/spirv-headers/template.py
# cports is BSD-2-Clause, Copyright (c) Chimera Linux contributors.
# needed by: spirv-tools, glslang, shaderc, mesa.
# r2: headers and .pc files stay in spirv-headers (what most recipes depend on);
#     spirv-headers-devel is empty and depends on it, for the recipes that name -devel.
name = "spirv-headers"
version = "1.4.363.0"
release = 2
summary = "Machine-readable files for the SPIR-V Registry"
license = "custom:spirv-headers"
homepage = "https://github.com/KhronosGroup/SPIRV-Headers"
hostdeps = ["cmake", "ninja", "pkgconf"]
options = ["!check"]

source = [
    { url = "https://github.com/KhronosGroup/SPIRV-Headers/archive/refs/tags/vulkan-sdk-1.4.363.0.tar.gz", sha256 = "5b3a0d099f5c7649e29c0938476c462e71d66ad89a0bde42fa1ba3eb476956c9" },
]

setup = '''
%cmake
'''
build = '''
%cmake_build
'''
install = '''
%cmake_install
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/spirv-headers/LICENSE"
'''

[subpackages.devel]
summary = "Development files (all in spirv-headers)"
paths   = []
empty   = true
depends = ["spirv-headers"]
