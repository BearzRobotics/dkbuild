# SoX, the Swiss army knife of audio: sox_ng, the maintained continuation
# (SoX itself has had no release since 2015). Installed as sox_ng and, with
# --enable-replace, as sox/soxi/play/rec too.
# FFmpeg and AMR (opencore-amr, found by configure) are on. Not built: LADSPA, FFTW and SpeexDSP;
# sox_ng's own copies of libgsm and LPC-10 are used.
name = "sox-ng"
version = "14.8.1"
release = 3
summary = "Sound processing tool (SoX)"
license = "GPL-2.0-or-later AND LGPL-2.1-or-later"
homepage = "https://codeberg.org/sox_ng/sox_ng"
provides = ["sox"]
hostdeps = ["pkgconf"]
builddeps = ["alsa-lib-devel", "ffmpeg-devel", "file-devel", "opencore-amr-devel", "flac-devel", "lame-devel", "libid3tag-devel", "libmad-devel", "libogg-devel", "libpng-devel", "libpulse-devel", "libsndfile-devel", "libvorbis-devel", "opus-devel", "opusfile-devel", "twolame-devel", "wavpack-devel", "zlib-ng-compat-devel"]
options = ["!check"]

source = [
    { url = "https://codeberg.org/sox_ng/sox_ng/releases/download/sox_ng-14.8.1/sox_ng-14.8.1.tar.gz", sha256 = "1dedd9ad574abc576bbda06743867fb778accf98a1eacde1a42913acbf072448" },
]

setup = '''
%configure \
    --enable-replace \
    --with-distro=FenrirOS \
    --without-ladspa \
    --with-ffmpeg
'''
build = '''
%make
'''
install = '''
%make_install
install -Dm644 COPYING "$pkgdir/usr/share/licenses/sox-ng/COPYING"
'''
