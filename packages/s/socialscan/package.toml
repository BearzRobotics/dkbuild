# Check email address and username availability on online platforms. (BlackArch list, requested 2026-11-16; docs/requests.md). Python application installed with pip from the source tarball, its dependencies are packages of the tree. Generated from pyproject/setup.py (setuptools.build_meta:__legacy__); not built yet when written (wip/queue): expect first-build fixes.
name = "socialscan"
version = "2.0.1"
release = 1
summary = "Check email address and username availability on online platforms."
license = "MPL-2.0"
homepage = "https://github.com/iojw/socialscan"
# dataclasses is in the standard library since Python 3.7; the PyPI backport (0.8) only installs on 3.6 and
# would shadow it, so python-dataclasses is gone and this does not depend on it.
hostdeps = ["python", "python-setuptools", "python-wheel"]
rundeps = ["python"]
options = ["!check"]

source = [
    { url = "https://github.com/iojw/socialscan/archive/refs/tags/v2.0.1.tar.gz", sha256 = "72d0c551df09b0a234cce611d94fe23eb8fc67c96c662b0344f41133092f4502" },
]

environment = '''
export SETUPTOOLS_SCM_PRETEND_VERSION=2.0.1 PDM_BUILD_SCM_VERSION=2.0.1
'''
install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/socialscan/LICENSE"
'''
