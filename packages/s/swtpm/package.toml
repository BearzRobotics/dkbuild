name = "swtpm"
version = "0.10.2"
release = 1
summary = "TPM emulator with socket, character device, and Linux CUSE interface"
license = "BSD-3-Clause"
homepage = "https://github.com/stefanberger/swtpm"
patches = ["failing-tests.patch", "fix-tests.patch", "no-expect.patch", "tss-user.patch"]
hostdeps = ["automake", "bash", "gawk", "gnutls", "libtool", "pkgconf", "socat", "iproute2"]
builddeps = ["gnutls-devel", "json-glib-devel", "libseccomp-devel", "libtasn1-devel", "libtpms-devel", "linux-headers", "openssl-devel"]
checkdeps = ["iproute2"]
rundeps = ["gnutls", "sd-tools"]

source = [
    { url = "https://github.com/stefanberger/swtpm/archive/refs/tags/v0.10.2.tar.gz", sha256 = "f61cf6f1e9bbcb4cefb30b70cafaf1c4df54c6961e65cfa63830e8ad0e220134" },
]

setup = '''
autoreconf -if -W none
%configure \
    --with-gnutls \
    --with-tss-user=tss \
    --with-tss-group=tss
'''
build = '''
%make
'''
check = '''
%make check
'''
install = '''
%make_install
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/swtpm/LICENSE"
rm -rf "$pkgdir/usr/lib/installed-tests"
# the tss user and its directory (sd-tools applies both)
install -Dm644 $pkgfiles/sysusers.conf "$pkgdir/usr/lib/sysusers.d/swtpm.conf"
install -Dm644 $pkgfiles/tmpfiles.conf "$pkgdir/usr/lib/tmpfiles.d/swtpm.conf"
'''
