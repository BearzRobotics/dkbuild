# step-cli (binary `step`): smallstep's command line for certificates, keys,
# JWTs/JWKs, TOTP, SSH certificates and the client of step-ca. Go, its modules
# from the store (godeps). Built with cgo (YubiKey/PIV through pcsc-lite;
# PKCS#11 by dlopen), the same as step-ca. Version/build time as in
# upstream's goreleaser config (fixed build time). Shell completion files from
# autocomplete/. Nothing to configure and no service: not a server.
name = "step-cli"
version = "0.31.0"
release = 1
summary = "Smallstep command line for certificates, keys and step-ca"
license = "Apache-2.0"
homepage = "https://smallstep.com/cli/"
hostdeps = ["go", "pkgconf"]
builddeps = ["pcsc-lite-devel"]
options = ["!check", "godeps"]

source = [
    { url = "https://github.com/smallstep/cli/archive/refs/tags/v0.31.0.tar.gz", sha256 = "cc79207697f733eade1017a2be0da067362bf3bc0c05a6c68eeb7bbd288713d3" },
]

environment = '''
export GOTOOLCHAIN=local GOFLAGS="-mod=mod -trimpath -buildvcs=false" GOCACHE=/tmp/go-cache GOPATH=/tmp/go CGO_ENABLED=1
'''
build = '''
go build -ldflags "-w -X main.Version=$version -X main.BuildTime=1970-01-01T00:00:00Z" -o step ./cmd/step
'''
install = '''
install -Dm755 step "$pkgdir/usr/bin/step"
install -Dm644 autocomplete/bash_autocomplete "$pkgdir/usr/share/bash-completion/completions/step"
install -Dm644 autocomplete/zsh_autocomplete "$pkgdir/usr/share/zsh/site-functions/_step"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/step-cli/LICENSE"
'''
