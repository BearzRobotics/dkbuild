# Imported from Chimera Linux cports: main/shadow/template.py
# cports is BSD-2-Clause, Copyright (c) Chimera Linux contributors.
# login, su, passwd, useradd and friends (util-linux is built without login
# and su, which come from here). With PAM (r6, 2026-11-15: the system adopts PAM all the way,
# SELinux's pam_selinux and the shell lock screens need it): login, su, passwd and the account
# tools authenticate through linux-pam; the stacks are in files/pam.d (installed to /usr/lib/pam.d,
# included from linux-pam-base's system-auth and system-login). The root-only account tools
# (useradd, groupadd ...) accept root with pam_rootok and nobody else. login.defs is
# upstream's; Chimera's login.defs patch is still left out. Patches are Chimera's (default shell
# /bin/sh, no mail spool, two fixes).
# r7: default.useradd names group 999, base-files' `users` (GROUP=100 does not exist here and useradd warned).
# r2: no sulogin: util-linux's is the system one.
# r3: rebuilt with the empty directories it installs (dkbuild's splitter dropped them).
# r4: static libraries too (in shadow-static), for fully static programs on musl.
name = "shadow"
version = "4.17.2"
release = 8
summary = "Shadow password file utilities"
license = "BSD-3-Clause"
homepage = "https://github.com/shadow-maint/shadow"
patches = ["defaults.patch", "xstrdup.patch", "usermod-move-home-errmsg.patch"]
builddeps = ["acl-devel", "attr-devel", "linux-headers", "linux-pam-devel"]
rundeps = ["base-files", "linux-pam", "linux-pam-base"]
options = ["!check"]

source = [
    { url = "https://github.com/shadow-maint/shadow/releases/download/4.17.2/shadow-4.17.2.tar.xz", sha256 = "a21cf0d34bffc4314cede01cff258689174fab30ca494ae8f45784d3d56c9849" },
]

environment = '''
# setuid programs here (SPEC.md 5.4: the profile has no hardening flags yet): a stack protector, and relocations
# resolved and made read-only before main runs
export CFLAGS="${CFLAGS} -fstack-protector-strong" CXXFLAGS="${CXXFLAGS} -fstack-protector-strong"
export LDFLAGS="${LDFLAGS} -Wl,-z,relro,-z,now"
'''
setup = '''
%configure \
    --enable-shared \
    --enable-lastlog \
    --with-libpam \
    --with-acl \
    --with-attr \
    --without-libbsd \
    --without-selinux \
    --without-nscd \
    --disable-nls \
    --enable-subordinate-ids \
    --disable-account-tools-setuid
'''
build = '''
%make
'''
install = '''
%make_install
# shadow installs some programs and libraries under /bin, /sbin and /lib
# whatever configure says (Chimera's template notes it too): into /usr.
for d in bin sbin lib; do
    [ -d "$pkgdir/$d" ] || continue
    mkdir -p "$pkgdir/usr/$d"
    cp -a "$pkgdir/$d/." "$pkgdir/usr/$d/"
    rm -rf "$pkgdir/$d"
done
install -Dm644 $pkgfiles/default.useradd "$pkgdir/etc/default/useradd"
for f in chage chfn chsh expiry gpasswd newgidmap newuidmap newgrp passwd sg su; do
    [ -e "$pkgdir/usr/bin/$f" ] && chmod 4755 "$pkgdir/usr/bin/$f"
done
# upstream's own /etc/pam.d files are replaced by ours, in the vendor directory
rm -rf "$pkgdir/etc/pam.d"
for f in "$pkgfiles"/pam.d/*; do
    install -Dm644 "$f" "$pkgdir/usr/lib/pam.d/$(basename "$f")"
done
# many packages' accounts name /usr/bin/nologin as their shell (their sysusers.d and scripts)
mkdir -p "$pkgdir/usr/bin"
ln -s ../sbin/nologin "$pkgdir/usr/bin/nologin"
install -Dm644 $pkgfiles/LICENSE "$pkgdir/usr/share/licenses/shadow/LICENSE"
'''
