# SDL2_Pango: Pango text rendering for SDL2 (right-to-left and complex
# scripts). needed by: tuxpaint.
name = "sdl2-pango"
version = "2.1.5"
release = 1
summary = "Pango text rendering for SDL2"
license = "LGPL-2.1-or-later"
homepage = "https://github.com/markuskimius/SDL2_Pango"
hostdeps = ["pkgconf", "automake", "libtool"]
builddeps = ["sdl2-compat-devel", "pango-devel", "fontconfig-devel", "freetype-devel"]
options = ["!check"]

source = [
    { url = "https://github.com/markuskimius/SDL2_Pango/archive/refs/tags/v2.1.5.tar.gz", sha256 = "3b3fe6008445feb1fca61b17b9d950d688e49dcca60dbbf8667c0f980ddfc563" },
]

setup = '''
autoreconf -fi
%configure
'''
build = '''
%make
'''
install = '''
%make_install
install -Dm644 COPYING "$pkgdir/usr/share/licenses/sdl2-pango/COPYING"
'''
