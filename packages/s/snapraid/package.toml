# snapraid: backup program for disk arrays; parity-based protection of
# files on separate disks (C). Built from the release tarball
# (snapraid-<version>.tar.gz from the GitHub release), which ships the generated
# configure that the repository archive lacks. No optional libraries exist;
# hardware-specific code (SSE/AVX RAID) is chosen at run time. The example
# configuration is installed as documentation only (no /etc/snapraid.conf).
name = "snapraid"
version = "15.1"
release = 1
summary = "Backup program for disk arrays with parity"
license = "GPL-3.0-or-later"
homepage = "https://www.snapraid.it"
options = ["!check"]

source = [
    { url = "https://github.com/amadvance/snapraid/releases/download/v15.1/snapraid-15.1.tar.gz", sha256 = "fb2d6a9cf9c8ea30c6962f4a48764dc9012fe61d6e23f40a8d959dadea02278b" },
]

setup = '''
%configure
'''
build = '''
%make
'''
install = '''
%make_install
install -Dm644 snapraid.conf.example "$pkgdir/usr/share/doc/snapraid/snapraid.conf.example"
install -Dm644 COPYING "$pkgdir/usr/share/licenses/snapraid/COPYING"
'''
