# LLVM IR <-> SPIR-V (llvm-spirv, libLLVMSPIRVLib): needed by libclc's SPIR-V
# targets, and by Mesa for Intel's drivers (intel_clc) and rusticl (OpenCL).
# The release matching LLVM 23. SPIRV-Headers come from the spirv-headers
# package (the build would otherwise clone them with git).
name = "spirv-llvm-translator"
version = "23.1.3"
release = 1
summary = "Bi-directional translator between SPIR-V and LLVM IR"
license = "Apache-2.0 WITH LLVM-exception"
homepage = "https://github.com/KhronosGroup/SPIRV-LLVM-Translator"
hostdeps = ["cmake", "ninja", "pkgconf", "llvm"]
builddeps = ["llvm-devel", "spirv-headers-devel", "spirv-tools-devel"]
options = ["!check"]

source = [
    { url = "https://github.com/KhronosGroup/SPIRV-LLVM-Translator/archive/refs/tags/v23.1.3.tar.gz", sha256 = "9ed57de3f31c575c836bef8f05ce5dfa98a8d80e64d948a02aac83c2e124f842" },
]

setup = '''
cmake -B build -G Ninja -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_BUILD_TYPE=Release \
    -DLLVM_DIR=/usr/lib/cmake/llvm -DLLVM_EXTERNAL_SPIRV_HEADERS_SOURCE_DIR=/usr \
    -DLLVM_SPIRV_INCLUDE_TESTS=OFF -DBUILD_SHARED_LIBS=ON
'''
build = '''
ninja -C build -j$jobs
'''
install = '''
DESTDIR=$pkgdir ninja -C build install
install -Dm644 LICENSE.TXT "$pkgdir/usr/share/licenses/spirv-llvm-translator/LICENSE.TXT"
'''
