# SOGo behind nginx (sogod listens on 127.0.0.1:20000, see
# /etc/dinit.d/sogo). Copy to /etc/nginx/http.d/sogo.conf and set
# server_name and TLS (the x-webobjects-* headers tell SOGo the public URL;
# use port 443 and https once TLS is set up).
server {
    listen 80;
    server_name groupware.example.org;
    client_max_body_size 50m;

    location = / { return 301 /SOGo/; }

    location ^~ /SOGo {
        proxy_pass http://127.0.0.1:20000;
        proxy_redirect http://127.0.0.1:20000 default;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header x-webobjects-server-protocol HTTP/1.0;
        proxy_set_header x-webobjects-remote-host $remote_addr;
        proxy_set_header x-webobjects-server-name $server_name;
        proxy_set_header x-webobjects-server-url $scheme://$host;
        proxy_set_header x-webobjects-server-port $server_port;
        proxy_connect_timeout 90;
        proxy_send_timeout 90;
        proxy_read_timeout 90;
        proxy_buffer_size 64k;
        proxy_buffers 8 64k;
        proxy_busy_buffers_size 64k;
        break;
    }

    location /SOGo.woa/WebServerResources/ {
        alias /usr/lib/GNUstep/SOGo/WebServerResources/;
        allow all;
    }
    location /SOGo/WebServerResources/ {
        alias /usr/lib/GNUstep/SOGo/WebServerResources/;
        allow all;
    }
    location ^~ /SOGo/Microsoft-Server-ActiveSync {
        proxy_pass http://127.0.0.1:20000/SOGo/Microsoft-Server-ActiveSync;
        proxy_set_header Host $host;
        proxy_read_timeout 3600;
    }
    location = /.well-known/caldav { return 301 /SOGo/dav; }
    location = /.well-known/carddav { return 301 /SOGo/dav; }
}
