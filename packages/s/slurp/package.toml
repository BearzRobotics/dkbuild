# slurp: select a region on a Wayland screen (used with grim).
name = "slurp"
version = "1.5.0"
release = 1
summary = "Region selector for Wayland"
license = "MIT"
homepage = "https://github.com/emersion/slurp"
archs = ["x86_64", "aarch64"]
hostdeps = ["meson", "pkgconf", "scdoc"]
builddeps = ["wayland-devel", "wayland-protocols", "cairo-devel", "libxkbcommon-devel"]
options = ["!check"]

source = [
    { url = "https://github.com/emersion/slurp/archive/refs/tags/v1.5.0.tar.gz", sha256 = "0fa880d4a93e1c795e3b5929fbea47546df0955bea34fc2f7ffeb1751678f663" },
]

setup = '''
%meson
'''
build = '''
%meson_build
'''
install = '''
%meson_install
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/slurp/LICENSE"
'''
