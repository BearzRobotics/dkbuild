# From Debian's sdl-mixer1.2 1.2.12-19: its sources and its patches (applied in setup).
# needed by: t4k-common, tuxmath, tuxtype.
# MP3 through libmad (smpeg 0.4, its other choice, is not in the tree); MOD through the bundled MikMod.
name = "sdl-mixer"
version = "1.2.12"
release = 1
summary = "Audio mixer library for SDL 1.2"
license = "Zlib"
homepage = "https://www.libsdl.org/projects/SDL_mixer/release-1.2.html"
hostdeps = ["pkgconf", "autoconf", "automake", "libtool", "gettext-devel"]
builddeps = ["sdl12-compat-devel", "libvorbis-devel", "libogg-devel", "flac-devel", "fluidsynth-devel", "libmad-devel"]
options = ["!check"]

source = [
    { url = "https://deb.debian.org/debian/pool/main/s/sdl-mixer1.2/sdl-mixer1.2_1.2.12.orig.tar.gz", sha256 = "1644308279a975799049e4826af2cfc787cad2abb11aa14562e402521f86992a" },
    { url = "https://deb.debian.org/debian/pool/main/s/sdl-mixer1.2/sdl-mixer1.2_1.2.12-19.debian.tar.xz", sha256 = "c353e3d45e6c16817acfe8a64a4d251a81bca7458e45ad4d79136357f35e3481" },
]

setup = '''
# Debian's patches (debian.tar.xz unpacks beside the source, in ../debian)
while read -r p opt || [ -n "$p" ]; do
    case "$p" in ''|'#'*) continue ;; esac
    patch ${opt:--p1} < ../debian/patches/$p
done < ../debian/patches/series
autoreconf -fi
%configure \
    --enable-music-mp3-mad-gpl \
    --disable-music-mp3 \
    --disable-music-ogg-shared \
    --disable-music-flac-shared \
    --disable-music-fluidsynth-shared \
    --disable-music-mod-shared
'''
build = '''
%make
'''
install = '''
%make_install
install -Dm644 COPYING "$pkgdir/usr/share/licenses/sdl-mixer/COPYING"
'''
