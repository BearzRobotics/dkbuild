# SCons: Python-based build tool (roc-toolkit builds with it).
name = "scons"
version = "4.11.1"
release = 1
summary = "Software construction tool in Python"
license = "MIT"
homepage = "https://scons.org"
hostdeps = ["python", "python-setuptools"]
rundeps = ["python"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/source/s/scons/scons-4.11.1.tar.gz", sha256 = "4210d1a80a62e986029208117991b6347ccaaaab37b67463a3ff31ee065dc487" },
]

install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/scons/LICENSE"
'''
