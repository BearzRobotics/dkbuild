name = "sfml"
version = "3.1.0"
release = 1
summary = "C++ multimedia library"
license = "Zlib"
homepage = "https://www.sfml-dev.org"
hostdeps = ["cmake", "ninja", "pkgconf"]
builddeps = ["flac-devel", "freetype-devel", "libogg-devel", "libssh2-devel", "libvorbis-devel", "libx11-devel", "libxcursor-devel", "libxi-devel", "libxrandr-devel", "mbedtls-devel", "mesa-devel", "harfbuzz-devel", "libxrender-devel", "linux-headers"]

source = [
    { url = "https://github.com/SFML/SFML/archive/refs/tags/3.1.0.tar.gz", sha256 = "91209a112c2bd0bc6f4ce0d5f3e413cfb48b57c0de59f5507dc81f71b1ad7a5c" },
    { url = "https://github.com/Tehreer/SheenBidi/archive/refs/tags/v3.0.0.tar.gz", sha256 = "86c56014034739ba39a24c23eb00323b0bf6f737354f665786015fca842af786" },
]

setup = '''
cmake -DSHEENBIDI_DIR=/build/SheenBidi-3.0.0 -P tools/sheenbidi/PatchSheenBidi.cmake
%cmake \
    -DBUILD_SHARED_LIBS=YES \
    -DSFML_INSTALL_PKGCONFIG_FILES=YES \
    -DSFML_USE_SYSTEM_DEPS=ON \
    -DSFML_BUILD_TEST_SUITE=OFF \
    -DFETCHCONTENT_FULLY_DISCONNECTED=ON \
    -DFETCHCONTENT_SOURCE_DIR_SHEENBIDI=/build/SheenBidi-3.0.0
'''
build = '''
%cmake_build
'''
install = '''
%cmake_install
'''
