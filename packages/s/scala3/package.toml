# Scala 3.10.1 compiler distribution (scalac, scaladoc, scala = the
# scala-cli based runner and REPL), installed from the scala3 release
# tarball: platform-independent JVM jars (the compiler is Scala, bootstrapped
# from its own earlier releases through sbt and Maven Central; the tree has
# no sbt), so the release is taken as published, as Kotlin. Nothing is
# patched. `scala` (scala-cli) downloads dependencies at run time when a
# user's program asks for them; the package itself needs no network.
# The tarball carries no licence file (Apache-2.0, see the jars' META-INF).
name = "scala3"
version = "3.10.1"
release = 1
summary = "Scala 3 compiler and tools"
license = "Apache-2.0"
homepage = "https://www.scala-lang.org"
rundeps = ["openjdk25", "bash"]
options = ["!check", "!strip"]

source = [
    { url = "https://github.com/scala/scala3/releases/download/3.10.1/scala3-3.10.1.tar.gz", sha256 = "02bffb7cb800138fc78f54a42fa802feac50918d2202f58d4cd781abf6e953c9" },
]

install = '''
home=/usr/share/scala3
d="$pkgdir$home"
rm -f bin/*.bat libexec/*.bat
install -dm755 "$d" "$pkgdir/usr/bin"
cp -r bin lib libexec maven2 VERSION "$d/"
# the scripts resolve their symlinks to find PROG_HOME
for t in scala scalac scaladoc; do ln -s $home/bin/$t "$pkgdir/usr/bin/$t"; done
'''
