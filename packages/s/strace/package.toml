name = "strace"
version = "7.3"
release = 1
summary = "System call tracer"
license = "LGPL-2.1-or-later"
homepage = "https://strace.io"
patches = ["lfs64.patch"]
hostdeps = ["automake", "libtool"]
builddeps = ["elfutils-devel", "linux-headers"]

source = [
    { url = "https://github.com/strace/strace/releases/download/v7.3/strace-7.3.tar.xz", sha256 = "529634c40910895a9a1f3c5c1e65da2ca9ed72fb158dfc4bcc89efdf05e39b72" },
]

setup = '''
autoreconf -if -W none
%configure \
    --with-libdw \
    --enable-stacktrace \
    --disable-mpers \
    --disable-gcc-Werror
'''
build = '''
%make
'''
check = '''
%make check "TESTS=bpf.gen epoll_pwait.gen getcpu.gen open.gen read-write.gen readlink.gen seccomp-filter.gen mmap ioctl caps"
'''
install = '''
%make_install
'''
