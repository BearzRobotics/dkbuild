name = "strace"
version = "6.17"
release = 1
summary = "System call tracer"
license = "LGPL-2.1-or-later"
homepage = "https://strace.io"
patches = ["configure-gen.patch", "lfs64.patch"]
hostdeps = ["automake", "libtool"]
builddeps = ["elfutils-devel", "linux-headers"]

source = [
    { url = "https://github.com/strace/strace/releases/download/v6.17/strace-6.17.tar.xz", sha256 = "0a7c7bedc7efc076f3242a0310af2ae63c292a36dd4236f079e88a93e98cb9c0" },
]

setup = '''
autoreconf -if -W none
%configure \
    --with-libdw \
    --enable-stacktrace \
    --disable-mpers \
    --disable-gcc-Werror
'''
build = '''
%make
'''
check = '''
%make check "TESTS=bpf.gen epoll_pwait.gen getcpu.gen open.gen read-write.gen readlink.gen seccomp-filter.gen mmap ioctl caps"
'''
install = '''
%make_install
'''
