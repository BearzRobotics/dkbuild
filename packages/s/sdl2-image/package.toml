name = "sdl2-image"
version = "2.8.12"
release = 1
summary = "SDL image loading library"
license = "Zlib"
homepage = "https://libsdl.org/projects/SDL_image"
hostdeps = ["cmake", "ninja", "pkgconf"]
builddeps = ["libavif-devel", "libjxl-devel", "libpng-devel", "libtiff-devel", "libwebp-devel", "sdl2-compat-devel"]
options = ["!check"]

source = [
    { url = "https://libsdl.org/projects/SDL_image/release/SDL2_image-2.8.12.tar.gz", sha256 = "393f5efb50536ec13ca4f4affb69cc9966d3c3f969e6c5e701faddf9f9785381" },
]

setup = '''
%cmake \
    -DSDL2IMAGE_AVIF=ON \
    -DSDL2IMAGE_AVIF_SHARED=OFF \
    -DSDL2IMAGE_JPG=ON \
    -DSDL2IMAGE_JPG_SHARED=OFF \
    -DSDL2IMAGE_JXL=ON \
    -DSDL2IMAGE_JXL_SHARED=OFF \
    -DSDL2IMAGE_PNG=ON \
    -DSDL2IMAGE_PNG_SHARED=OFF \
    -DSDL2IMAGE_SAMPLES=OFF \
    -DSDL2IMAGE_TIF=ON \
    -DSDL2IMAGE_TIF_SHARED=OFF \
    -DSDL2IMAGE_WEBP=ON \
    -DSDL2IMAGE_WEBP_SHARED=OFF \
    -DSDL2IMAGE_BACKEND_STB=OFF
'''
build = '''
%cmake_build
'''
install = '''
%cmake_install
install -Dm644 LICENSE.txt "$pkgdir/usr/share/licenses/sdl2_image/LICENSE.txt"
