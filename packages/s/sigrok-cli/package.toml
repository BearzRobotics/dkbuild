# sigrok-cli: command-line frontend for sigrok. From Alpine's testing/sigrok-cli.
name = "sigrok-cli"
version = "0.7.2"
release = 1
summary = "Command-line frontend for sigrok"
license = "GPL-3.0-or-later"
homepage = "https://sigrok.org/wiki/Sigrok-cli"
hostdeps = ["autoconf", "automake", "libtool", "pkgconf"]
builddeps = ["glib-devel", "libsigrok-devel", "libsigrokdecode-devel", "libserialport-devel"]

source = [
    { url = "https://sigrok.org/download/source/sigrok-cli/sigrok-cli-0.7.2.tar.gz", sha256 = "71d0443f36897bf565732dec206830dbea0f2789b6601cf10536b286d1140ab8" },
]

setup = '''
autoreconf -fi
%configure
'''
build = '''
%make
'''
install = '''
%make_install
'''
