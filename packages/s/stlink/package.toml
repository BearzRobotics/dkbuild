# Flashes and debugs STM32 boards through ST-Link adapters.
name = "stlink"
version = "1.9.0"
release = 1
summary = "STM32 ST-Link programmer tools (st-flash, st-info, st-util)"
license = "BSD-3-Clause"
homepage = "https://github.com/stlink-org/stlink"
hostdeps = ["cmake", "ninja", "pkgconf"]
builddeps = ["libusb-devel"]
options = ["!check"]

source = [
    { url = "https://github.com/stlink-org/stlink/archive/refs/tags/v1.9.0.tar.gz", sha256 = "10d6c3bff3d5a7f6aefd00e096339822cafc65acf32e43c842369e346d2e5069" },
]

setup = '''
%cmake \
    -DSTLINK_UDEV_RULES_DIR=/usr/lib/udev/rules.d \
    -DSTLINK_MODPROBED_DIR=/usr/lib/modprobe.d
'''
build = '''
%cmake_build
'''
install = '''
%cmake_install
install -Dm644 LICENSE.md "$pkgdir/usr/share/licenses/stlink/LICENSE.md"
'''
