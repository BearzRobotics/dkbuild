name = "nss"
version = "3.132"
release = 1
summary = "Mozilla Network Security Services"
license = "MPL-2.0"
homepage = "https://developer.mozilla.org/en-US/docs/Mozilla/Projects/NSS"
patches = ["clang-ias.patch", "native-nsinstall-cflags.patch", "ppc64_disable_broken_stuff.patch", "respect-ldflags.patch", "tests-objdir.patch"]
hostdeps = ["pkgconf", "perl"]
builddeps = ["linux-headers", "nspr-devel", "sqlite-devel", "zlib-ng-compat-devel"]
checkdeps = ["bash"]

options = ["!check"]

source = [
    { url = "https://ftp.mozilla.org/pub/security/nss/releases/NSS_3_132_RTM/src/nss-3.132.tar.gz", sha256 = "ee9cf4837ba801141a804321c4462ad8f452ff4314275c6d5108a6b05af227ff" },
]
environment = '''
export LIBRUNPATH=''
export BUILD_OPT=1
export NSS_USE_SYSTEM_SQLITE=1
export NSS_ENABLE_WERROR=0
export NSS_ENABLE_ECC=1
export NSS_DISABLE_GTESTS=1
export USE_64=1
export CFLAGS="$CFLAGS -DNS_PTR_GT_32"
'''
build = '''
XCFLAGS="$CFLAGS" make -C nss -j1 USE_64=1 OS_TEST=x86_64 CC="$CC" CCC="$CXX" \
    NATIVE_CC="$CC" NATIVE_FLAGS="$CFLAGS" NATIVE_LDFLAGS="$LDFLAGS"
'''
install = '''
install -m755 $pkgfiles/install.sh ./install.sh
DESTDIR="$pkgdir" NSS_VERSION="$version" ./install.sh
'''
