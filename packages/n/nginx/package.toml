name = "nginx"
version = "1.30.6"
release = 2
summary = "Advanced load balancer, web server, and reverse proxy"
license = "BSD-2-Clause"
homepage = "https://nginx.org"
hostdeps = ["libgd-devel", "libxml2-devel", "libxslt-devel", "linux-headers", "openssl-devel", "pcre2-devel", "perl", "zlib-ng-compat-devel"]
checkdeps = ["ca-certificates", "ffmpeg", "libgd", "perl-io-socket-ssl", "perl-net-ssleay"]
options = ["!cross"]

source = [
    { url = "https://nginx.org/download/nginx-1.30.6.tar.gz", sha256 = "3cf46f5ed7504d460125866b7bea99fb357f31d887e2e63b35503310e9b8b6c8" },
    { url = "https://github.com/nginx/nginx-tests/archive/4d1de3f357.tar.gz", sha256 = "e6008f0883a98eb30d84b2ab5d69c19aed2dea8a2eb368402a526e1d3fd16636" },
]

setup = '''
./configure \
    --prefix=/var/lib/nginx \
    --user=_nginx \
    --group=_nginx \
    --with-file-aio \
    --conf-path=/etc/nginx/nginx.conf \
    --error-log-path=/var/log/nginx/error.log \
    --http-log-path=/var/log/nginx/access.log \
    --lock-path=/run/nginx/nginx.lock \
    --modules-path=/usr/lib/nginx/modules \
    --pid-path=/run/nginx/nginx.pid \
    --sbin-path=/usr/bin/nginx \
    --http-client-body-temp-path=/var/lib/nginx/tmp/client_body_temp \
    --http-fastcgi-temp-path=/var/lib/nginx/tmp/fastcgi_temp \
    --http-proxy-temp-path=/var/lib/nginx/tmp/proxy_temp \
    --http-scgi-temp-path=/var/lib/nginx/tmp/scgi_temp \
    --http-uwsgi-temp-path=/var/lib/nginx/tmp/uwsgi_temp \
    --with-compat \
    --with-http_addition_module \
    --with-http_auth_request_module \
    --with-http_dav_module \
    --with-http_flv_module \
    --with-http_gunzip_module \
    --with-http_gzip_static_module \
    --with-http_image_filter_module=dynamic \
    --with-http_mp4_module \
    --with-http_perl_module=dynamic \
    --with-http_random_index_module \
    --with-http_realip_module \
    --with-http_secure_link_module \
    --with-http_slice_module \
    --with-http_ssl_module \
    --with-http_stub_status_module \
    --with-http_sub_module \
    --with-http_v2_module \
    --with-http_v3_module \
    --with-http_xslt_module=dynamic \
    --with-mail=dynamic \
    --with-mail_ssl_module \
    --with-pcre \
    --with-pcre-jit \
    --with-perl_modules_path=/usr/lib/perl5/vendor_perl \
    --with-stream=dynamic \
    --with-stream_realip_module \
    --with-stream_ssl_module \
    --with-stream_ssl_preread_module \
    --with-threads \
    --without-mail_imap_module \
    --without-mail_pop3_module \
    --without-mail_smtp_module
'''
build = '''
%make
'''
install = '''
%make_install
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/nginx/LICENSE"
install -Dm644 README.md "$pkgdir/usr/share/doc/nginx/README.md"
install -Dm644 man/nginx.8 "$pkgdir/usr/share/man/man8/nginx.8"
install -Dm644 $pkgfiles/nginx "$pkgdir/etc/dinit.d/nginx"
# better default configs, mostly adapted from alpine
rm -rf "$pkgdir/etc/nginx/nginx.conf"
install -Dm644 $pkgfiles/nginx.conf "$pkgdir/etc/nginx/nginx.conf"
install -Dm644 $pkgfiles/default.conf "$pkgdir/etc/nginx/http.d/default.conf"
install -Dm644 $pkgfiles/stream.conf "$pkgdir/etc/nginx/conf.d/stream.conf"
# remove old charset maps
rm -rf "$pkgdir"/etc/nginx/koi-*
rm -rf "$pkgdir/etc/nginx/win-utf"
# these interfere with tmpfiles ownership and are not used anyway
rm -rf "$pkgdir/var/lib/nginx/html"
# these are unnecessary with apk backups
rm -rf "$pkgdir"/etc/nginx/*.default
# Each dynamic module gets its loader in /etc/nginx/modules (Chimera does this per module package).
mkdir -p "$pkgdir/etc/nginx/modules"
for so in "$pkgdir"/usr/lib/nginx/modules/*.so; do
    [ -e "$so" ] || continue
    m=$(basename "$so" .so); m=${m#ngx_}; m=${m%_module}
    printf 'load_module "modules/%s";\n' "$(basename "$so")" > "$pkgdir/etc/nginx/modules/000_$m.conf"
done
'''
