name = "netavark"
version = "2.1.0"
release = 2
summary = "Container network stack"
license = "Apache-2.0"
homepage = "https://github.com/containers/netavark"
hostdeps = ["rust", "go-md2man", "protobuf", "make"]
builddeps = ["linux-headers"]

options = ["!check", "cargodeps"]

source = [
    { url = "https://github.com/containers/netavark/archive/v2.1.0.tar.gz", sha256 = "96677048168ddd1abe313e4c2e17f1cace72b60ee1bac8ca12a4bd7dfcadfbbb" },
]

environment = '''
export CARGO_HOME=/tmp/cargo-home CARGO_NET_OFFLINE=true
'''
build = '''
cargo build --release --frozen --offline -j $jobs
make -C docs docs
'''
install = '''
make -C docs install PREFIX=/usr DESTDIR="$pkgdir"
install -Dm755 target/release/netavark "$pkgdir/usr/lib/podman/netavark"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/netavark/LICENSE"
'''
