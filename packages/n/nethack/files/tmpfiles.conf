# setgid, so that anyone can play and save while only the game writes the score files
z /usr/lib/nethack/nethack 2755 root games -
d /var/games/nethack 0775 root games -
f /var/games/nethack/record 0664 root games -
f /var/games/nethack/logfile 0664 root games -
f /var/games/nethack/xlogfile 0664 root games -
d /var/games/nethack/save 0775 root games -
