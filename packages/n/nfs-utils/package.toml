# cports is BSD-2-Clause, Copyright (c) Chimera Linux contributors.
name = "nfs-utils"
version = "2.8.2"
release = 4
summary = "Utilities for managing NFS"
license = "GPL-2.0-or-later"
homepage = "https://linux-nfs.org"
patches = ["0011-fix-heimdal-build.patch", "musl-getservbyport.patch"]
hostdeps = ["automake", "libtool", "pkgconf", "rpcsvc-proto"]
builddeps = ["heimdal-devel", "heimdal-static", "keyutils-devel", "libcap-devel", "libedit-devel", "libevent-devel", "libnl-devel", "libtirpc-devel", "libxml2-devel", "linux-headers", "lvm2-devel", "rpcbind", "sqlite-devel", "util-linux-devel"]
rundeps = ["python", "rpcbind"]
options = ["!check"]

source = [
    { url = "https://cdn.kernel.org/pub/linux/utils/nfs-utils/2.8.2/nfs-utils-2.8.2.tar.gz", sha256 = "c9d99d0c797035570fee0dc153773ad27fded677069068ced3b76be4dcb64915" },
]

environment = '''
export CFLAGS="${CFLAGS} -Wno-format-nonliteral -Wno-strict-prototypes"
'''
setup = '''
autoreconf -if -W none
%configure \
    --disable-sbin-override \
    --disable-static \
    --enable-junction \
    --enable-libmount-mount \
    --enable-nfsdcltrack \
    --enable-svcgss
'''
build = '''
%make
'''
install = '''
%make_install
# helpers the services run
for n in nfs-server proc-fs-nfsd rpc_pipefs; do install -Dm755 $pkgfiles/dinit-$n "$pkgdir/usr/lib/dinit-$n"; done
# services
for s in blkmapd fsidd nfs-proc-nfsd nfs-rpc_pipefs nfs-server nfsdcld rpc.gssd rpc.idmapd rpc.mountd rpc.svcgssd rpc.statd; do
    install -Dm644 $pkgfiles/$s "$pkgdir/etc/dinit.d/$s"
done
install -Dm644 $pkgfiles/tmpfiles.conf "$pkgdir/usr/lib/tmpfiles.d/nfs-utils.conf"
# managed by tmpfiles
rm -rf "$pkgdir/var/lib/nfs"
install -Dm644 $pkgfiles/idmapd.conf "$pkgdir/etc/idmapd.conf"
install -Dm644 nfs.conf "$pkgdir/etc/nfs.conf"
'''

[subpackages.server]
summary = "NFS server components"
depends = ["nfs-utils"]
paths   = [
    "/usr/bin/nfsdcld",
    "/usr/bin/rpc.mountd",
    "/usr/bin/fsidd",
    "/usr/bin/rpc.nfsd",
    "/usr/bin/blkmapd",
    "/usr/bin/nfsdclddb",
    "/usr/bin/nfsdctl",
    "/usr/bin/rpc.svcgssd",
    "/usr/bin/nfsdclnts",
    "/usr/bin/nfsref",
    "/usr/bin/nfsdcltrack",
    "/usr/bin/exportfs",
    "/etc/dinit.d/fsidd",
    "/etc/dinit.d/blkmapd",
    "/etc/dinit.d/nfs-server",
    "/etc/dinit.d/nfsdcld",
    "/etc/dinit.d/rpc.mountd",
    "/etc/dinit.d/rpc.svcgssd",
    "/usr/lib/dinit-nfs-server",
    "/usr/lib/dinit-proc-fs-nfsd",
    "/usr/share/man/man5/exports.5",
    "/usr/share/man/man8/nfsdcld.8",
    "/usr/share/man/man8/*mountd.8",
    "/usr/share/man/man8/*nfsd.8",
    "/usr/share/man/man8/blkmapd.8",
    "/usr/share/man/man8/nfsdclddb.8",
    "/usr/share/man/man8/nfsdctl.8",
    "/usr/share/man/man8/*svcgssd.8",
    "/usr/share/man/man8/nfsdclnts.8",
    "/usr/share/man/man8/nfsref.8",
    "/usr/share/man/man8/nfsdcltrack.8",
    "/usr/share/man/man8/exportfs.8",
]
