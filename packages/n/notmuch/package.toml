# notmuch: fast, tag-based mail indexing and search (Xapian), with the
# libnotmuch library NeoMutt and aerc use. Based on Chimera's main/notmuch:
# GMime 3, Xapian, talloc; man pages (Sphinx) and bash/zsh completions.
# Static library: the build makes lib/libnotmuch.a (for its own statically
# linked "notmuch" program) without the util and parse-time-string objects
# the shared library also contains; the install step merges the three
# archives into a complete libnotmuch.a.
# Left out: the Emacs mode (no Emacs in the tree), and the Python/Ruby
# bindings (Chimera does not ship them either; they can be split out later).
name = "notmuch"
version = "0.40"
release = 1
summary = "Fast, global-search, tag-based email system"
license = "GPL-3.0-or-later"
homepage = "https://notmuchmail.org"
patches = ["san.patch"]
hostdeps = ["bash-completion", "pkgconf", "python", "python-sphinx"]
builddeps = ["gmime-devel", "linux-headers", "talloc-devel", "xapian-core-devel", "zlib-ng-compat-devel"]
# The test suite hangs (Chimera: after a failing test of -v), and needs gdb,
# gnupg and a terminal emulator.
options = ["!check"]

source = [
    { url = "https://notmuchmail.org/releases/notmuch-0.40.tar.xz", sha256 = "4b4314bbf1c2029fdf793637e6c7bb15c1b1730d22be9aa04803c98c5bbc446f" },
]

setup = '''
# notmuch's configure is hand-written (not autoconf): no --build/--host.
./configure \
    --prefix=/usr \
    --sysconfdir=/etc \
    --localstatedir=/var \
    --without-emacs \
    --without-ruby \
    --without-api-docs
'''
build = '''
%make
'''
install = '''
%make_install
printf 'create libnotmuch-full.a\naddlib lib/libnotmuch.a\naddlib util/libnotmuch_util.a\naddlib parse-time-string/libparse-time-string.a\nsave\nend\n' | llvm-ar -M
install -Dm644 libnotmuch-full.a "$pkgdir/usr/lib/libnotmuch.a"
'''
