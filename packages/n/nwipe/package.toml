# Follows the DKRescue post's build of nwipe 0.43.1.
# r2: dependencies on this tree's packages, not Chimera's names (built against the image's copies before).
# r3: static libraries too (in nwipe-static), for fully static programs on musl.
name = "nwipe"
version = "0.43.1"
release = 3
summary = "Secure disk eraser"
license = "GPL-2.0-only"
homepage = "https://github.com/martijnvanbrummelen/nwipe"
builddeps = ["ncurses-devel", "parted-devel", "libconfig-devel"]
options = ["!check"]

source = [
    { url = "https://github.com/martijnvanbrummelen/nwipe/archive/refs/tags/v0.43.1.tar.gz", sha256 = "134169dc2b0e11c1d3d6ea9c3d03b2dd0a69151cfb612e39ab17a81fd64eb02f" },
]

setup = '''
./autogen.sh
%configure
'''
build = '''
%make
'''
install = '''
%make_install
'''
