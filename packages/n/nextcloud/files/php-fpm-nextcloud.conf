; An optional php-fpm pool of its own for Nextcloud, with the PHP settings it
; asks for. Copy to /etc/php/php-fpm.d/nextcloud.conf and point nginx's
; upstream at unix:/run/php-fpm-nextcloud.sock.
[nextcloud]
user = _php
group = _php
listen = /run/php-fpm-nextcloud.sock
listen.owner = _php
listen.group = _php
listen.mode = 0660
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
; Nextcloud reads PATH (for previews, external tools) and the time zone
clear_env = no
env[PATH] = /usr/local/bin:/usr/bin:/bin
php_admin_value[memory_limit] = 512M
php_admin_value[upload_max_filesize] = 16G
php_admin_value[post_max_size] = 16G
php_admin_value[max_execution_time] = 3600
php_admin_value[max_input_time] = 3600
php_admin_value[output_buffering] = 0
php_admin_value[opcache.interned_strings_buffer] = 32
php_admin_value[opcache.memory_consumption] = 256
php_admin_value[opcache.revalidate_freq] = 60
