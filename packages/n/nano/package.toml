# libmagic (file-devel) lets nano pick a syntax by file type; --enable-utf8
# needs the wide-character ncurses (ncurses-devel here is that build).
name = "nano"
version = "9.3"
release = 1
summary = "GNU nano text editor"
license = "GPL-3.0-or-later"
homepage = "https://www.nano-editor.org"
hostdeps = ["pkgconf"]
builddeps = ["ncurses-devel", "file-devel", "linux-headers"]

source = [
    { url = "https://ftp.gnu.org/gnu/nano/nano-9.3.tar.xz", sha256 = "a9affc52c9596ee0682bcdd4ceb3c0b235eb221d83d733dfd9b0dff45897cb0d" },
]

setup = '''
%configure \
    --enable-utf8 \
    --enable-libmagic
'''
build = '''
%make
'''
check = '''
%make check
'''
install = '''
%make_install
install -Dm644 syntax/nanorc.nanorc "$pkgdir/usr/share/examples/nano/nanorc.nanorc"
'''
