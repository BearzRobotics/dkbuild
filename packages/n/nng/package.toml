# NNG (nanomsg-next-gen): messaging library; KiCad's IPC API uses it. From
# Alpine's community/nng, with its patch (a CMake-generated nng.pc). The static
# library is a second build.
name = "nng"
version = "1.12.4"
release = 1
summary = "Lightweight messaging library (nanomsg-next-gen)"
license = "MIT"
homepage = "https://nng.nanomsg.org"
patches = ["0001-cmake-generate-pkg-config-file-nng.pc-using-CMake.patch"]
hostdeps = ["cmake", "ninja"]
builddeps = ["mbedtls-devel"]

source = [
    { url = "https://github.com/nanomsg/nng/archive/refs/tags/v1.12.4.tar.gz", sha256 = "93b177727ec5ea38af5c88ab297f732ef71ddc4700d2407c4f9c999b3a7310a0" },
]

setup = '''
%cmake -DBUILD_SHARED_LIBS=ON -DNNG_TESTS=ON -DNNG_ENABLE_TLS=ON
cmake -B build-static -G Ninja -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_BUILD_TYPE=Release \
    -DBUILD_SHARED_LIBS=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DNNG_TESTS=OFF -DNNG_ENABLE_TLS=ON
'''
build = '''
%cmake_build
cmake --build build-static
'''
check = '''
ctest --test-dir build --output-on-failure
'''
install = '''
DESTDIR="$pkgdir" cmake --install build-static
%cmake_install
install -Dm644 LICENSE.txt "$pkgdir/usr/share/licenses/nng/LICENSE.txt"
'''
