name = "nftables"
version = "1.1.7"
release = 3
summary = "Netfilter nftables userspace tools"
license = "GPL-2.0-only AND GPL-2.0-or-later"
homepage = "http://netfilter.org/projects/nftables"
hostdeps = ["automake", "bash", "flex", "libtool", "pkgconf"]
builddeps = ["gmp-devel", "jansson-devel", "libedit-devel", "libmnl-devel", "libnftnl-devel", "linux-headers"]
options = ["!check"]

source = [
    { url = "http://netfilter.org/projects/nftables/files/nftables-1.1.7.tar.xz", sha256 = "a6fbf060d8d4fff001517a2b94f356bb4366bfbf0ba366366f9d27cc38caa58f" },
]

setup = '''
autoreconf -if -W none
%configure \
    --with-cli=editline \
    --with-json
'''
build = '''
%make
'''
install = '''
%make_install
install -Dm755 $pkgfiles/nftables-start "$pkgdir/usr/lib/nftables-start"
install -Dm644 $pkgfiles/nftables "$pkgdir/etc/dinit.d/nftables"
'''
