name = "nspr"
version = "4.40"
release = 1
summary = "NetScape Portable Runtime"
license = "MPL-2.0"
homepage = "https://www.mozilla.org/projects/nspr"
patches = ["lfs64.patch", "ppc64-default-stack-size.patch"]
