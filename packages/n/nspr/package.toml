environment = '''
export CFLAGS="${CFLAGS} -D_PR_POLL_AVAILABLE -D_PR_HAVE_OFF64_T -D_PR_INET6 -D_PR_HAVE_INET_NTOP -D_PR_HAVE_GETHOSTBYNAME2 -D_PR_HAVE_GETADDRINFO -D_PR_INET6_PROBE"
'''
setup = '''
cd nspr
%configure \
    --enable-optimize \
    --enable-debug \
    --enable-ipv6
'''
