# 4.41 (2026-11-26): upstream's _linux.h now selects _PR_HAVE_LARGE_OFF_T on a C library that is not glibc (musl: off_t is 64-bit,
# so the plain open, mmap, stat and lseek). The recipe forced -D_PR_HAVE_OFF64_T, which wins over it and makes unix.c use open64,
# mmap64, stat64 ... that musl does not declare. The flag is gone, and with it lfs64.patch, which only changed that branch's types.
name = "nspr"
version = "4.41"
release = 1
summary = "NetScape Portable Runtime"
license = "MPL-2.0"
homepage = "https://www.mozilla.org/projects/nspr"
patches = ["ppc64-default-stack-size.patch"]
hostdeps = ["pkgconf"]
builddeps = ["zlib-ng-compat-devel"]
options = ["!cross", "!check"]

source = [
    { url = "https://ftp.mozilla.org/pub/nspr/releases/v4.41/src/nspr-4.41.tar.gz", sha256 = "c562b8ddfe93704b7dc077be013f01448fdc6c124b1821c0f10471a71cb2e9e6" },
]

environment = '''
export CFLAGS="${CFLAGS} -D_PR_POLL_AVAILABLE -D_PR_INET6 -D_PR_HAVE_INET_NTOP -D_PR_HAVE_GETHOSTBYNAME2 -D_PR_HAVE_GETADDRINFO -D_PR_INET6_PROBE"
'''
setup = '''
cd nspr
# --enable-64bit on 64-bit machines: without it NSPR is configured as 32-bit
# x86 and leaves out the x86_64 atomics NSS links against
case "$arch" in x86_64|aarch64|riscv64) b64=--enable-64bit ;; *) b64= ;; esac
%configure $b64 \
    --enable-optimize \
    --enable-debug \
    --enable-ipv6
'''
build = '''
cd nspr
%make
'''
install = '''
cd nspr
%make_install
rm -rf "$pkgdir/usr/bin"
rm -rf "$pkgdir/usr/include/nspr/md"
'''
