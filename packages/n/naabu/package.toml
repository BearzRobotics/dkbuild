# A fast port scanner written in go with focus on reliability and simplicity. (BlackArch list, requested 2026-11-16; docs/requests.md). Written from the template of ffuf; not built yet when written (wip/queue): expect first-build fixes.
# Go module, dependencies fetched on the host (godeps). Main package: cmd/naabu. CGO is on (libpcap or SQLite in go.mod).
name = "naabu"
version = "2.7.0"
release = 1
summary = "A fast port scanner written in go with focus on reliability and simplicity."
license = "MIT"
homepage = "https://github.com/projectdiscovery/naabu"
hostdeps = ["go", "clang"]
builddeps = ["libpcap-devel"]
options = ["!check", "godeps"]

source = [
    { url = "https://github.com/projectdiscovery/naabu/archive/refs/tags/v2.7.0.tar.gz", sha256 = "6eee1b4b4c9b4b5eb19f175c2ac67e04babc6290f937b9c72fca0b1183e3fe47" },
]

environment = '''
export GOFLAGS="-mod=mod -trimpath -buildvcs=false" GOTOOLCHAIN=local GOPROXY=off
export GOCACHE=/tmp/go-cache GOPATH=/tmp/go CGO_ENABLED=1
'''
build = '''
mkdir -p build
go build -o build/naabu ./cmd/naabu
'''
install = '''
install -Dm755 build/naabu "$pkgdir/usr/bin/naabu"
install -Dm644 LICENSE.md "$pkgdir/usr/share/licenses/naabu/LICENSE.md"
'''
