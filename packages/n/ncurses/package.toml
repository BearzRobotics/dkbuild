# Follows the DKRescue post's build of ncurses 6.5; the importer's draft of
# Chimera's recipe was not used.
# No C++ binding (libncurses++): it linked without libc++ and failed here, and nothing
# on the ISO uses it. DKRescue builds a non-wide library; this adds --enable-widec because every consumer that matters
# (readline, vim, python curses) links ncursesw.
name = "ncurses"
version = "6.5"
release = 2
summary = "Terminal handling library"
license = "MIT"
homepage = "https://invisible-island.net/ncurses"
options = ["bootstrap", "!check"]

source = [
    { url = "https://ftp.gnu.org/gnu/ncurses/ncurses-6.5.tar.gz", sha256 = "136d91bc269a9a5785e5f9e980bc76ab57428f604ce3e5a5a90cebc767971cc6" },
]

setup = '''
# configure prefers mawk when it finds one; the system awk instead
sed -i s/mawk// configure
./configure --prefix=/usr --mandir=/usr/share/man --with-shared --with-normal \
    --without-debug --without-cxx-binding --without-ada --enable-pc-files \
    --enable-widec --with-pkg-config-libdir=/usr/lib/pkgconfig AWK=gawk
'''
build = '''
%make
'''
install = '''
%make_install
# Programs that look for -lncurses, -lcurses or -ltinfo get the wide library.
for lib in ncurses form panel menu; do
    echo "INPUT(-l${lib}w)" > "$pkgdir/usr/lib/lib$lib.so"
done
printf 'INPUT(-lncursesw)\n' > "$pkgdir/usr/lib/libcurses.so"
printf 'INPUT(-lncursesw)\n' > "$pkgdir/usr/lib/libtinfo.so"
ln -sf ncursesw.pc "$pkgdir/usr/lib/pkgconfig/ncurses.pc"
'''
