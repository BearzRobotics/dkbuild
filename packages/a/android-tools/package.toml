# cports is BSD-2-Clause, Copyright (c) Chimera Linux contributors.
name = "android-tools"
version = "37.0.0_p1"
release = 1
summary = "Android platform tools, such as adb and fastboot"
license = "Apache-2.0 AND ISC AND GPL-2.0-only AND MIT"
homepage = "https://github.com/nmeum/android-tools"
archs = ["x86_64", "aarch64", "riscv64"]
hostdeps = ["rust", "cmake", "corrosion", "ninja", "pkgconf", "protobuf"]
builddeps = ["brotli-devel", "fmt-devel", "gtest-devel", "libusb-devel", "linux-headers", "lz4-devel", "pcre2-devel", "protobuf-devel", "rust", "zstd-devel"]
rundeps = ["android-udev-rules", "python"]

source = [
    { url = "https://github.com/nmeum/android-tools/releases/download/37.0.0p1/android-tools-37.0.0p1.tar.xz", sha256 = "2c6de1abe16b211c7d9f59276217e14fd9e0e18b20e331d3c84358f5dffd576e" },
]

environment = '''
export CXXFLAGS="${CXXFLAGS} -D_LARGEFILE64_SOURCE"
'''
setup = '''
# libc++ 23: fdevent.h uses std::vector without <vector>
sed -i 's|^#include <variant>$|#include <variant>\n#include <vector>|' vendor/adb/fdevent/fdevent.h
grep -q '^#include <vector>$' vendor/adb/fdevent/fdevent.h
# mDNS discovery (adb's wireless-debugging pairing) is off for now: it is a
# Rust crate with no Cargo.lock in the release, so its crates cannot be
# pinned and vendored for the offline build (Chimera runs `cargo vendor` with
# the network). Needs a lockfile dkbuild can vendor from (wip/README.md).
%cmake \
    -DANDROID_TOOLS_ADB_ENABLE_MDNS=OFF
'''
build = '''
%cmake_build
'''
install = '''
%cmake_install
install -Dm644 vendor/boringssl/LICENSE "$pkgdir/usr/share/licenses/android-tools/boringssl.LICENSE"
install -Dm644 vendor/boringssl/third_party/fiat/LICENSE "$pkgdir/usr/share/licenses/android-tools/fiat.LICENSE"
'''
