# artcraft-launcher: part of the Craft App Suite (storytold), pure Rust on egui/wgpu. Install, update and launch the Craft App Suite
# Crates vendored on the host (cargodeps), git dependencies included (storytold/craft-libs, the
# storytold forks of egui and winit, winprint.rs which is Windows only but in Cargo.lock).
# Optional build input included: craft-fonts at the commit upstream's CI uses (CRAFT_FONTS_DIR,
# embedded in the binary) -- not used by this app. Both unpack as further sources in /build.
# Windowing (Wayland, X11, xkbcommon) and the GPU (Vulkan, EGL) are opened at run time, so they
# are run-time dependencies, as for alacritty.
# Generated from the wordcraft recipe's pattern; source edits: none. Not built yet when written.
# drop-unused-patches.patch (Cargo.toml and Cargo.lock): the egui fork [patch] entries no member uses
# (egui_demo_lib, egui_inspection, ...) are removed, as cargo vendor leaves those crates out and the
# offline build then failed in cargo ("patch location ... does not contain packages matching
# egui_demo_lib").
name = "artcraft-launcher"
version = "0.19.2"
release = 1
summary = "Install, update and launch the Craft App Suite"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/storytold/craft-launcher"
hostdeps = ["rust", "pkgconf"]
builddeps = ["libxcb-devel", "libxkbcommon-devel", "wayland-devel", "gtk+3-devel"]
rundeps = ["libxkbcommon", "mesa", "vulkan-loader", "wayland", "libx11", "libxcb", "shared-mime-info", "hicolor-icon-theme", "gtk+3", "libayatana-appindicator"]
options = ["!check", "cargodeps"]
patches = ["drop-unused-patches.patch"]

source = [
    { url = "https://github.com/storytold/craft-launcher/archive/refs/tags/v0.19.2.tar.gz", sha256 = "8eba378121d0f8805a113995fd915a95f9a7f58dfd71a74236c4df869e1cd919" },
]

environment = '''
export CARGO_HOME=/tmp/cargo-home CARGO_NET_OFFLINE=true
'''
build = '''
cargo build --release --frozen --offline --locked -j $jobs -p artcraft-launcher
'''
install = '''
install -Dm755 target/release/artcraft-launcher "$pkgdir/usr/bin/artcraft-launcher"
id=ai.storyteller.artcraft-launcher
install -Dm644 packaging/linux/$id.desktop "$pkgdir/usr/share/applications/$id.desktop"
mkdir -p "$pkgdir/usr/share/metainfo"
sed -e "s/@VERSION@/$version/g" -e "s/@DATE@/2026-11-12/g" \
    packaging/linux/$id.metainfo.xml.in > "$pkgdir/usr/share/metainfo/$id.metainfo.xml"
mkdir -p "$pkgdir/usr/share/icons"
cp -R assets/app-icon/hicolor "$pkgdir/usr/share/icons/"
install -Dm644 LICENSE-MIT "$pkgdir/usr/share/licenses/artcraft-launcher/LICENSE-MIT"
install -Dm644 LICENSE-APACHE "$pkgdir/usr/share/licenses/artcraft-launcher/LICENSE-APACHE"
install -Dm644 NOTICE "$pkgdir/usr/share/licenses/artcraft-launcher/NOTICE"
install -Dm644 ATTRIBUTION.md "$pkgdir/usr/share/doc/artcraft-launcher/ATTRIBUTION.md"
'''
