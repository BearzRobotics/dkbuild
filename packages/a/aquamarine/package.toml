# needed by: hyprland (its rendering and input backend).
name = "aquamarine"
version = "0.16.0"
release = 1
summary = "Very light linux rendering backend library (DRM/KMS, libinput, Wayland)"
license = "BSD-3-Clause"
homepage = "https://github.com/hyprwm/aquamarine"
hostdeps = ["cmake", "ninja", "pkgconf", "hyprwayland-scanner"]
builddeps = ["hyprutils-devel", "seatd-devel", "libinput-devel", "wayland-devel", "wayland-protocols", "hwdata", "libdisplay-info-devel", "libdrm-devel", "mesa-devel", "eudev-devel", "pixman-devel"]
options = ["!check"]

source = [
    { url = "https://github.com/hyprwm/aquamarine/archive/refs/tags/v0.16.0.tar.gz", sha256 = "42339c3096c9de6582c0d71bc86b7e63334a3faf6a2b917d385ad093caf66c3c" },
]

setup = '''
%cmake \
    -DBUILD_TESTING=OFF
'''
build = '''
%cmake_build
'''
install = '''
%cmake_install
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/aquamarine/LICENSE"
'''
