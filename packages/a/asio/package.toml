# Asio: header-only C++ library for asynchronous networking and I/O
# (BSL-1.0), standalone (not Boost.Asio); used by Widelands.
name = "asio"
version = "1.39.0"
release = 1
summary = "Cross-platform C++ library for network and low-level I/O programming"
license = "BSL-1.0"
homepage = "https://think-async.com/Asio"
hostdeps = ["autoconf", "automake", "libtool"]
options = ["!check"]  # the test suite is heavy and needs the network loopback

source = [
    { url = "https://github.com/chriskohlhoff/asio/archive/refs/tags/asio-1-39-0.tar.gz", sha256 = "cc27087fad4b6d85c6b8e4c896c57144b417cfc5a5eab9e204565f51adaec1de" },
]

setup = '''
cd asio
./autogen.sh
%configure
'''
build = '''
cd asio
%make
'''
install = '''
cd asio
%make_install
install -Dm644 LICENSE_1_0.txt "$pkgdir/usr/share/licenses/asio/LICENSE_1_0.txt"
'''
