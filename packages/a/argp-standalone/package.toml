name = "argp-standalone"
version = "1.5.0"
release = 2
summary = "Standalone argp implementation"
license = "LGPL-2.1-or-later"
homepage = "https://github.com/argp-standalone/argp-standalone"
hostdeps = ["automake"]
options = ["!lto"]

source = [
    { url = "https://github.com/argp-standalone/argp-standalone/archive/refs/tags/1.5.0.tar.gz", sha256 = "c29eae929dfebd575c38174f2c8c315766092cec99a8f987569d0cad3c6d64f6" },
]

environment = '''
export CFLAGS="${CFLAGS} -fPIC"
'''
setup = '''
autoreconf -if -W none
%configure
'''
build = '''
%make
'''
check = '''
%make check
'''
install = '''
install -Dm644 libargp.a "$pkgdir/usr/lib/libargp.a"
install -Dm644 argp.h "$pkgdir/usr/include/argp.h"
'''
