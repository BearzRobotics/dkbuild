# r2: dependencies on this tree's packages, not Chimera's names (built against the image's copies before).
# r3: static libraries too (in apk-tools-static), for fully static programs on musl.
name = "apk-tools"
version = "3.0.11"
release = 1
summary = "Alpine package manager"
license = "GPL-2.0-only"
homepage = "http://git.alpinelinux.org/cgit/apk-tools"
hostdeps = ["lua", "lua5.4-zlib", "meson", "pkgconf", "scdoc"]
builddeps = ["openssl-devel", "zlib-ng-compat-devel"]
options = ["bootstrap"]

source = [
    { url = "https://gitlab.alpinelinux.org/alpine/apk-tools/-/archive/v3.0.11/apk-tools-v3.0.11.tar.gz", sha256 = "6098fed5888a392bf5337a728a78ce1707a28cf9ec2650f078e29f21e9bc926f" },
]

setup = '''
%meson \
    -Dlua=disabled \
    -Dlua_version=5.4 \
    -Dpython=disabled
'''
build = '''
%meson_build
'''
install = '''
%meson_install
install -Dm644 $pkgfiles/config "$pkgdir/usr/lib/apk/config"
'''
