# Imported from Chimera Linux cports: user/alacritty/template.py
# cports is BSD-2-Clause, Copyright (c) Chimera Linux contributors.
# Default features (Wayland and X11; both open their libraries at run time:
# libwayland-client, libxkbcommon, libxcb, EGL). Man pages are made from the
# scdoc sources in extra/man. Terminfo is not installed: ncurses ships the
# alacritty and alacritty-direct entries, and upstream's extra/alacritty.info
# would collide with them.
name = "alacritty"
version = "0.17.0"
release = 1
summary = "Cross-platform, GPU-accelerated terminal emulator"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/alacritty/alacritty"
hostdeps = ["rust", "pkgconf", "scdoc", "python", "cmake"]
builddeps = ["fontconfig-devel", "freetype-devel", "libxcb-devel", "libxkbcommon-devel", "wayland-devel"]
rundeps = ["libxkbcommon", "mesa"]
options = ["!check", "cargodeps"]

source = [
    { url = "https://github.com/alacritty/alacritty/archive/refs/tags/v0.17.0.tar.gz", sha256 = "38d6527d346cda5c6049332a1f3338a89ea66cd7981b54d4c3ce801b392496f8" },
]

environment = '''
export CARGO_HOME=/tmp/cargo-home CARGO_NET_OFFLINE=true
'''
build = '''
cargo build --release --frozen --offline -p alacritty -j $jobs
for m in alacritty.1 alacritty-msg.1 alacritty.5 alacritty-bindings.5 alacritty-escapes.7; do
    scdoc < extra/man/$m.scd > extra/man/$m
done
'''
install = '''
install -Dm755 target/release/alacritty "$pkgdir/usr/bin/alacritty"
for m in alacritty.1 alacritty-msg.1; do install -Dm644 extra/man/$m "$pkgdir/usr/share/man/man1/$m"; done
for m in alacritty.5 alacritty-bindings.5; do install -Dm644 extra/man/$m "$pkgdir/usr/share/man/man5/$m"; done
install -Dm644 extra/man/alacritty-escapes.7 "$pkgdir/usr/share/man/man7/alacritty-escapes.7"
install -Dm644 extra/completions/alacritty.bash "$pkgdir/usr/share/bash-completion/completions/alacritty"
install -Dm644 extra/completions/alacritty.fish "$pkgdir/usr/share/fish/vendor_completions.d/alacritty.fish"
install -Dm644 extra/completions/_alacritty "$pkgdir/usr/share/zsh/site-functions/_alacritty"
install -Dm644 extra/linux/Alacritty.desktop "$pkgdir/usr/share/applications/Alacritty.desktop"
install -Dm644 extra/linux/org.alacritty.Alacritty.appdata.xml "$pkgdir/usr/share/metainfo/org.alacritty.Alacritty.appdata.xml"
install -Dm644 extra/logo/alacritty-term.svg "$pkgdir/usr/share/icons/hicolor/scalable/apps/Alacritty.svg"
install -Dm644 LICENSE-MIT "$pkgdir/usr/share/licenses/alacritty/LICENSE-MIT"
install -Dm644 LICENSE-APACHE "$pkgdir/usr/share/licenses/alacritty/LICENSE-APACHE"
'''
