# cports is BSD-2-Clause, Copyright (c) Chimera Linux contributors.
name = "assimp"
version = "6.0.6"
release = 1
summary = "Open asset importing library"
license = "BSD-3-Clause"
homepage = "https://www.assimp.org"
hostdeps = ["cmake", "ninja", "pkgconf"]
builddeps = ["minizip-devel", "zlib-ng-compat-devel"]

source = [
    { url = "https://github.com/assimp/assimp/archive/refs/tags/v6.0.6.tar.gz", sha256 = "5f7ed412b76575621df0525a762b31da5874afff352b3a890c6308db4ac7204c" },
]

environment = '''
# poly2tri's shapes.h uses std::ostream without <ostream> (libc++ 23)
export CXXFLAGS="$CXXFLAGS -include ostream"
'''
setup = '''
%cmake \
    -DASSIMP_BUILD_ASSIMP_TOOLS=ON \
    -DASSIMP_BUILD_TESTS=ON \
    -DASSIMP_IGNORE_GIT_HASH=ON \
    -DASSIMP_WARNINGS_AS_ERRORS=OFF
'''
build = '''
%cmake_build
'''
check = '''
build/bin/unit
'''
install = '''
%cmake_install
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/assimp/LICENSE"
'''
