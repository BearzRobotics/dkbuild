# Changed from Chimera: no X11 (the system is Wayland-only, and the image has no
# libX11), no introspection (gobject-introspection is not built yet), no docs.
# r2: static libraries too (in at-spi2-core-static), for fully static programs on musl.
# 2026-11-11: GObject introspection on (gspell, libpeas, PyGObject apps need
# the .gir files), and its X11 bridge (Xfce and other X11 desktops).
name = "at-spi2-core"
version = "2.62.1"
release = 3
summary = "Assistive Technology Service Provider Interface"
license = "GPL-2.0-or-later"
homepage = "https://gitlab.gnome.org/GNOME/at-spi2-core"
hostdeps = ["gettext", "glib-devel", "meson", "pkgconf", "gobject-introspection"]
builddeps = ["dbus-devel", "glib-devel", "libxml2-devel", "libx11-devel", "libxtst-devel", "libxi-devel"]
rundeps = ["dbus"]
options = ["!check"]

source = [
    { url = "https://download.gnome.org/sources/at-spi2-core/2.62/at-spi2-core-2.62.1.tar.xz", sha256 = "cca6b6a86e4389d89b370288761ce2385ddeceb10c4412da78689bc30c88af2d" },
]

setup = '''
%meson \
    -Duse_systemd=false \
    -Dgtk2_atk_adaptor=false \
    -Dx11=enabled \
    -Dintrospection=enabled \
    -Ddocs=false
'''
build = '''
%meson_build
'''
install = '''
%meson_install
'''
