# GNUstep base: the Foundation library (OpenStep/Cocoa Foundation: strings,
# collections, run loops, networking, property lists, XML, distributed
# objects) on libobjc2, and its tools (defaults, plmerge, gdomap, ...).
# Built with: libffi (NSInvocation), libxml2 and libxslt (NSXMLDocument),
# GnuTLS (TLS streams), ICU (locale, NSRegularExpression), Avahi
# (NSNetServices), GMP (NSDecimal), and musl's iconv.
# Left out, with reasons:
# - libdispatch and NSURLSession (which needs it): Apple's
#   swift-corelibs-libdispatch ships its own blocks runtime (Block.h,
#   libBlocksRuntime), which collides with libobjc2's embedded one; packaging
#   it to use libobjc2's is a separate piece of work (nothing here needs
#   NSURLSession: SOGo uses SOPE's HTTP client).
# - BFD stack traces (--enable-bfd): off by default upstream (GPL libbfd).
# gdomap (the distributed-objects name server) is installed as a plain
# program: not setuid, no service.
# Static library too: a second, shared=no pass over Source/ after the shared
# build (gnustep-make builds one kind per pass).
name = "gnustep-base"
version = "1.31.1"
release = 5
summary = "GNUstep Foundation library"
license = "LGPL-2.1-or-later AND GPL-3.0-or-later"
homepage = "https://gnustep.github.io"
hostdeps = ["gnustep-make", "make", "pkgconf"]
builddeps = ["libobjc2-devel", "libffi-devel", "libxml2-devel", "libxslt-devel", "gnutls-devel", "icu-devel", "avahi-devel", "gmp-devel", "zlib-ng-compat-devel"]
rundeps = ["gnustep-make"]
options = ["!check"]

source = [
    { url = "https://github.com/gnustep/libs-base/releases/download/base-1_31_1/gnustep-base-1.31.1.tar.gz", sha256 = "e7546f1c978a7c75b676953a360194a61e921cb45a4804497b4f346a460545cd" },
]

environment = '''
. /usr/share/GNUstep/Makefiles/GNUstep.sh
export GNUSTEP_INSTALLATION_DOMAIN=SYSTEM
'''
setup = '''
# r4: Source/GSFormat.m copies its va_list with __va_copy under `#ifdef __va_copy`, and falls back to `ap_save = ap`, which does not
# compile where va_list is an array type (x86-64: "array type 'va_list' is not assignable", line 891): clang's <stdarg.h> on musl does
# not define the GCC-era __va_copy. Source edit: the compiler's own builtin, in both places.
# r5: Headers/Foundation/NSBackgroundActivityScheduler.h declares its block instance variable as `BLOCK_SCOPE GSScheduledBlock _block;`, BLOCK_SCOPE being
# `__block`, which this clang rejects on an Objective-C ivar ("'__block' is not allowed on an Objective-C instance variable"); the qualifier means nothing
# there (it only matters for locals a block captures). Dropped from that one declaration. (Source edit: sed.)
sed -i 's/^  BLOCK_SCOPE GSScheduledBlock _block;/  GSScheduledBlock _block;/' Headers/Foundation/NSBackgroundActivityScheduler.h
! grep -q 'BLOCK_SCOPE GSScheduledBlock _block' Headers/Foundation/NSBackgroundActivityScheduler.h
sed -i -e 's/^#ifdef __va_copy$/#if 1/' -e 's/__va_copy (/__builtin_va_copy (/' Source/GSFormat.m
if grep -q '__va_copy' Source/GSFormat.m; then exit 1; fi
# configure's -fconstant-string-class test (config/config.constant-string-class.m)
# assigns @"..." (an NSString *) to a FooConstantString * and returns a
# const char * const as char *: warnings in older clang, errors in clang 23
# (incompatible pointer types), so the test "fails" and configure aborts with
# "compiler does not appear to implement -fconstant-string-class". Demote them
# to warnings (the library's own code is Objective-C that relies on the same
# loose pointer conversions).
export CFLAGS="$CFLAGS -Wno-error=incompatible-pointer-types -Wno-error=incompatible-pointer-types-discards-qualifiers"
# r3: configure's "iconv support" test runs iconv_open("UTF-8//TRANSLIT","ASCII") and
# aborts with "Missing support for character conversion functionality" when it fails.
# musl's iconv (fuzzycmp in src/locale/iconv.c) does not accept a "//TRANSLIT" suffix
# on a charset name, so it always fails here, though musl converts everything the
# library needs. The test is changed to ask for plain "UTF-8" (and to compare with
# (iconv_t)-1, the correct type, not a bare int). Only the library's lossy-conversion
# mode in Source/Additions/Unicode.m asks for //TRANSLIT at run time; there musl
# reports the error and the code falls back, as on any system without it.
sed -i 's|iconv_open("UTF-8//TRANSLIT","ASCII") == -1|iconv_open("UTF-8","ASCII") == (iconv_t)-1|' configure
! grep -q 'UTF-8//TRANSLIT' configure
%configure \
    --with-config-file=/etc/GNUstep/GNUstep.conf \
    --with-installation-domain=SYSTEM \
    --with-zeroconf-api=avahi \
    --disable-libdispatch \
    --disable-nsurlsession
'''
build = '''
%make messages=yes
'''
check = '''
%make check
'''
install = '''
%make_install
# the static library: Source/ again, linked as an archive
%make -C Source shared=no messages=yes
%make -C Source shared=no DESTDIR=$pkgdir install
test -f "$pkgdir/usr/lib/libgnustep-base.a"
install -Dm644 COPYING.LIB "$pkgdir/usr/share/licenses/gnustep-base/COPYING.LIB"
install -Dm644 COPYING "$pkgdir/usr/share/licenses/gnustep-base/COPYING"
'''
