name = "gtk+3"
version = "3.24.43"
release = 7
summary = "Gimp Toolkit version 3"
license = "LGPL-2.1-or-later"
homepage = "https://gtk.org"
patches = ["geometry.patch"]
hostdeps = ["docbook-xsl-nons", "gettext-devel", "glib-devel", "gobject-introspection", "libxslt-progs", "meson", "perl", "pkgconf", "wayland-progs"]
builddeps = ["at-spi2-core-devel", "colord-devel", "cups-devel", "gdk-pixbuf-devel", "iso-codes", "libcloudproviders-devel", "libepoxy-devel", "libxcomposite-devel", "libxcursor-devel", "libxdamage-devel", "libxext-devel", "libxi-devel", "libxinerama-devel", "libxkbcommon-devel", "libxrandr-devel", "mesa-devel", "pango-devel", "tinysparql-devel", "wayland-devel", "wayland-protocols"]
checkdeps = ["adwaita-icon-theme", "dbus", "fonts-dejavu-otf", "librsvg", "xwayland-run"]
rundeps = ["adwaita-icon-theme", "glycin-loaders", "gobject-introspection-freedesktop", "gtk+3-update-icon-cache", "shared-mime-info"]
options = ["!cross", "!check"]

source = [
    { url = "https://download.gnome.org/sources/gtk+/3.24/gtk+-3.24.43.tar.xz", sha256 = "7e04f0648515034b806b74ae5d774d87cffb1a2a96c468cb5be476d51bf2f3c7" },
]

setup = '''
%meson \
    -Dbroadway_backend=true \
    -Dcloudproviders=true \
    -Dcolord=yes \
    -Dgtk_doc=false \
    -Dintrospection=true \
    -Dman=true \
    -Dprint_backends=cups,file \
    -Dtests=false \
    -Dtracker3=true \
    -Dwayland_backend=true \
    -Dx11_backend=true
'''
build = '''
%meson_build
'''
install = '''
%meson_install
'''
