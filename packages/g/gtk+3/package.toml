# Imported from Chimera Linux cports: work/cports/main/gtk+3/template.py
# cports is BSD-2-Clause, Copyright (c) Chimera Linux contributors.
# Imported draft: dependency names are Chimera's and resolve from the stage 0 image until they are recipes.
# Like gtk4 (the DKRescue desktop post): Wayland only. No X11, broadway, CUPS,
# colord, Tracker, cloudproviders, introspection or man pages: none of them is
# in the image or the tree.
# r8: dependencies on this tree's packages, not Chimera's names (built against the image's copies before).
# r9: static libraries too (in gtk+3-static), for fully static programs on musl.
# 2026-11-11: the X11 backend (Xfce is an X11 desktop), introspection, CUPS
# printing, colord and Broadway, now that the tree has them; cloudproviders
# and Tracker are not in the tree.
name = "gtk+3"
version = "3.24.43"
release = 11
summary = "Gimp Toolkit version 3"
license = "LGPL-2.1-or-later"
homepage = "https://gtk.org"
patches = ["geometry.patch"]
hostdeps = ["gettext-devel", "glib-devel", "meson", "perl", "pkgconf", "wayland", "gobject-introspection"]
builddeps = ["at-spi2-core-devel", "gdk-pixbuf-devel", "libepoxy-devel", "libxkbcommon-devel", "mesa-devel", "pango-devel", "wayland-devel", "wayland-protocols", "libx11-devel", "libxext-devel", "libxi-devel", "libxrandr-devel", "libxcursor-devel", "libxdamage-devel", "libxfixes-devel", "libxcomposite-devel", "libxinerama-devel", "cups-devel", "colord-devel", "fribidi-devel", "cairo-devel", "iso-codes"]
checkdeps = ["adwaita-icon-theme", "dbus", "fonts-dejavu-otf", "librsvg", "xwayland-run"]
rundeps = ["adwaita-icon-theme", "shared-mime-info"]
options = ["!cross", "!check"]

source = [
    { url = "https://download.gnome.org/sources/gtk+/3.24/gtk+-3.24.43.tar.xz", sha256 = "7e04f0648515034b806b74ae5d774d87cffb1a2a96c468cb5be476d51bf2f3c7" },
]

setup = '''
%meson \
    -Dbroadway_backend=true \
    -Dcloudproviders=false \
    -Dcolord=yes \
    -Dgtk_doc=false \
    -Dintrospection=true \
    -Dman=false \
    -Dprint_backends=file,cups \
    -Dtests=false \
    -Dexamples=false \
    -Ddemos=false \
    -Dtracker3=false \
    -Dwayland_backend=true \
    -Dx11_backend=true
'''
build = '''
%meson_build
'''
install = '''
%meson_install
'''
