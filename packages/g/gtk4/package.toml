# Imported from Chimera Linux cports: work/cports/main/gtk4/template.py
# cports is BSD-2-Clause, Copyright (c) Chimera Linux contributors.
# GTK flags follow the DKRescue desktop post (Wayland only, GLES via epoxy/Mesa).
# Imported draft, untested: dependency names are Chimera's and resolve from the stage 0 image until they are recipes.
# r2: dependencies on this tree's packages, not Chimera's names (built against the image's copies before).
# r3: static libraries too (in gtk4-static), for fully static programs on musl.
name = "gtk4"
version = "4.24.1"
release = 3
summary = "Gimp Toolkit version 4"
license = "LGPL-2.1-or-later"
homepage = "https://gtk.org"
patches = ["int.patch", "no-gsk-test.patch", "test-timeouts.patch", "tests-nodeparser-ref.patch"]
hostdeps = ["gettext-devel", "glib-devel", "meson", "perl", "pkgconf", "python-docutils", "shaderc", "wayland", "wayland-protocols"]
builddeps = ["at-spi2-core-devel", "gdk-pixbuf-devel", "graphene-devel", "libepoxy-devel", "libxcursor-devel", "libxkbcommon-devel", "mesa-devel", "pango-devel", "sysprof-capture", "vulkan-headers", "vulkan-loader-devel", "wayland-devel", "wayland-protocols"]
checkdeps = ["adwaita-icon-theme", "bash", "dbus", "fonts-cantarell-otf", "fonts-dejavu", "fonts-noto", "python-gobject", "xwayland-run"]
rundeps = ["adwaita-icon-theme", "shared-mime-info"]
options = ["!cross", "!check", "!lto"]

source = [
    { url = "https://download.gnome.org/sources/gtk/4.24/gtk-4.24.1.tar.xz", sha256 = "e98abe720e16129c8c0f50761dee0a2e9ae2478055e31018f6cf977fcf6513e9" },
]

setup = '''
%meson \
    -Dx11-backend=false \
    -Dwayland-backend=true \
    -Dbroadway-backend=false \
    -Dmedia-gstreamer=disabled \
    -Dprint-cups=disabled \
    -Dvulkan=disabled \
    -Dintrospection=disabled \
    -Ddocumentation=false \
    -Dman-pages=false \
    -Dbuild-demos=false \
    -Dbuild-examples=false \
    -Dbuild-tests=false \
    -Dbuild-testsuite=false
'''
build = '''
%meson_build
'''
install = '''
%meson_install
# we don't really need it (provided by gtk3)
# note: there are no changes in this since gtk3 aside from warning cleanups anyway
rm -rf "$pkgdir/usr/bin/gtk4-update-icon-cache"
rm -rf "$pkgdir/usr/share/man/man1/gtk4-update-icon-cache.1"
'''
