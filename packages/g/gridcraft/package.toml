# gridcraft: part of the Craft App Suite (storytold), pure Rust on egui/wgpu. Calculate, analyse and chart data in workbooks
# Crates vendored on the host (cargodeps), git dependencies included (storytold/craft-libs, the
# storytold forks of egui and winit, winprint.rs which is Windows only but in Cargo.lock).
# Optional build input included: craft-fonts at the commit upstream's CI uses (CRAFT_FONTS_DIR,
# embedded in the binary). Both unpack as further sources in /build.
# Windowing (Wayland, X11, xkbcommon) and the GPU (Vulkan, EGL) are opened at run time, so they
# are run-time dependencies, as for alacritty.
# Generated from the wordcraft recipe's pattern; source edits: none. Not built yet when written.
# drop-unused-patches.patch (Cargo.toml and Cargo.lock): the egui fork [patch] entries no member uses
# (egui_demo_lib, egui_inspection, ...) are removed, as cargo vendor leaves those crates out and the
# offline build then failed in cargo ("patch location ... does not contain packages matching
# egui_demo_lib").
name = "gridcraft"
version = "0.19.1"
release = 1
summary = "Calculate, analyse and chart data in workbooks"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/storytold/gridcraft"
hostdeps = ["rust", "pkgconf", "cmake"]
builddeps = ["libxcb-devel", "libxkbcommon-devel", "wayland-devel"]
rundeps = ["libxkbcommon", "mesa", "vulkan-loader", "wayland", "libx11", "libxcb", "shared-mime-info", "hicolor-icon-theme"]
options = ["!check", "cargodeps"]
patches = ["drop-unused-patches.patch"]

source = [
    { url = "https://github.com/storytold/gridcraft/archive/refs/tags/v0.19.1.tar.gz", sha256 = "4adb7b981de97f31c61e5be67ac7b2bcd84e2559647b5c8c39561bbcce199c5e" },
    { url = "https://github.com/storytold/craft-fonts/archive/b076417b5880bd4154bd22f00695b1d28c6bea83.tar.gz", sha256 = "35eadfeb7e4217a933f24b73a3d190b90fed81e6c933266f092c161746c0a9eb" },
]

environment = '''
export CARGO_HOME=/tmp/cargo-home CARGO_NET_OFFLINE=true
export CRAFT_FONTS_DIR=/build/craft-fonts-b076417b5880bd4154bd22f00695b1d28c6bea83
'''
build = '''
test -d "$CRAFT_FONTS_DIR/fonts"
cargo build --release --frozen --offline --locked -j $jobs -p gridcraft -p gridcraft-cli
'''
install = '''
install -Dm755 target/release/gridcraft "$pkgdir/usr/bin/gridcraft"
install -Dm755 target/release/gridcraft-cli "$pkgdir/usr/bin/gridcraft-cli"
id=ai.storyteller.gridcraft
install -Dm644 packaging/linux/$id.desktop "$pkgdir/usr/share/applications/$id.desktop"
install -Dm644 packaging/linux/$id.mime.xml "$pkgdir/usr/share/mime/packages/$id.xml"
mkdir -p "$pkgdir/usr/share/metainfo"
sed -e "s/@VERSION@/$version/g" -e "s/@DATE@/2026-11-12/g" \
    packaging/linux/$id.metainfo.xml.in > "$pkgdir/usr/share/metainfo/$id.metainfo.xml"
mkdir -p "$pkgdir/usr/share/icons"
cp -R assets/app-icon/hicolor "$pkgdir/usr/share/icons/"
install -Dm644 LICENSE-MIT "$pkgdir/usr/share/licenses/gridcraft/LICENSE-MIT"
install -Dm644 LICENSE-APACHE "$pkgdir/usr/share/licenses/gridcraft/LICENSE-APACHE"
install -Dm644 NOTICE "$pkgdir/usr/share/licenses/gridcraft/NOTICE"
install -Dm644 ATTRIBUTION.md "$pkgdir/usr/share/doc/gridcraft/ATTRIBUTION.md"
'''
