    -Dwith-examples=false \
    -Dwith-sd-bus-provider=tangle \
    -Dwith-privileged-group=_gamemode
'''
build = '''
%meson_build
'''
install = '''
%meson_install
install -Dm644 LICENSE.txt "$pkgdir/usr/share/licenses/gamemode/LICENSE.txt"
'''
