name = "git"
version = "2.56.0"
release = 1
summary = "Fast, distributed version control system"
license = "GPL-2.0-only"
homepage = "https://git-scm.com"
patches = ["t4201-tr-workaround.patch", "t4301-gsed.patch", "t5303-gsed.patch"]
hostdeps = ["asciidoctor", "docbook-xsl", "gettext", "perl", "pkgconf", "tk", "xmlto"]
builddeps = ["curl-devel", "libexpat-devel", "libsecret-devel", "linux-headers", "pcre2-devel", "tk-devel"]
checkdeps = ["gnupg", "sed"]
rundeps = ["ca-certificates"]

source = [
    { url = "https://www.kernel.org/pub/software/scm/git/git-2.56.0.tar.xz", sha256 = "26c56c296b38c0695b26fa95f475f1d01704d2d38e73465ca30b0b2f5dc789d3" },
]

setup = '''
cat > config.mak <<CONFIG
prefix = /usr
gitexecdir = /usr/lib/git-core
CC = $CC
AR = ${AR:-llvm-ar}
TAR = tar
CFLAGS = $CFLAGS
LDFLAGS = $LDFLAGS
USE_LIBPCRE2 = Yes
USE_ASCIIDOCTOR = Yes
NO_INSTALL_HARDLINKS = Yes
ICONV_OMITS_BOM = Yes
NO_REGEX = Yes
NO_RUST = Yes
INSTALLDIRS = vendor
INSTALL_SYMLINKS = 1
perllibdir = /usr/share/perl5/vendor_perl
PYTHON_PATH = /usr/bin/python3
HOST_CPU = $arch
CONFIG
'''
build = '''
make -j$jobs
make -j$jobs -C Documentation man
make -j$jobs -C contrib/contacts all
make -j$jobs -C contrib/diff-highlight all
make -j$jobs -C contrib/subtree all man
make -j$jobs -C contrib/credential/libsecret all
'''
install = '''
make DESTDIR="$pkgdir" install install-doc
make -C contrib/contacts DESTDIR="$pkgdir" install
make -C contrib/subtree DESTDIR="$pkgdir" install install-man
install -Dm755 contrib/credential/libsecret/git-credential-libsecret "$pkgdir/usr/lib/git-core/git-credential-libsecret"
# No CVS support (git-cvsserver and friends need Perl's DBI).
rm -f "$pkgdir/usr/bin/git-cvsserver" "$pkgdir"/usr/lib/git-core/git-cvs* "$pkgdir"/usr/share/man/man1/git-cvs*.1 "$pkgdir/usr/share/man/man7/gitcvs-migration.7"
install -Dm644 contrib/completion/git-prompt.sh "$pkgdir/usr/share/git/git-prompt.sh"
install -Dm755 contrib/diff-highlight/diff-highlight "$pkgdir/usr/bin/diff-highlight"
install -Dm644 contrib/diff-highlight/README "$pkgdir/usr/share/doc/git/diff-highlight"
install -Dm755 contrib/git-jump/git-jump "$pkgdir/usr/lib/git-core/git-jump"
install -Dm644 contrib/git-jump/README "$pkgdir/usr/share/doc/git/git-jump"
rm -f "$pkgdir/usr/lib/git-core/git-citool"
ln -s git-gui "$pkgdir/usr/lib/git-core/git-citool"
install -Dm644 COPYING "$pkgdir/usr/share/licenses/git/COPYING"
'''

[subpackages.gitk]
summary = "Git repository browser"
paths   = ["/usr/bin/gitk", "/usr/share/gitk", "/usr/share/man/man1/gitk.1"]
depends = ["git", "tk"]

[subpackages.gui]
summary = "Git GUI tool"
paths   = ["/usr/lib/git-core/git-gui", "/usr/lib/git-core/git-gui--askpass", "/usr/lib/git-core/git-citool", "/usr/share/git-gui", "/usr/share/man/man1/git-gui.1", "/usr/share/man/man1/git-citool.1"]
depends = ["git", "tk"]
