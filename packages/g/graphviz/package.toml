name = "graphviz"
version = "13.1.2"
release = 1
summary = "Graph visualization software"
license = "EPL-1.0"
homepage = "https://graphviz.org"
hostdeps = ["automake", "bison", "flex", "libtool", "libtool-devel", "perl", "pkgconf", "python"]
builddeps = ["cairo-devel", "fontconfig-devel", "freetype-devel", "gdk-pixbuf-devel", "libexpat-devel", "libgd-devel", "libjpeg-turbo-devel", "libpng-devel", "libwebp-devel", "pango-devel", "zlib-ng-compat-devel"]
