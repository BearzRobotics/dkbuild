rundeps = ["fonts-liberation"]
options = ["!check"]

source = [
    { url = "https://gitlab.com/graphviz/graphviz/-/archive/13.1.2/graphviz-13.1.2.tar.gz", sha256 = "0e79b8402e8ea13f05c0fc0e30604f1d0731cd3f60f85850cedac7e0ee420ef8" },
]

setup = '''
./autogen.sh
%configure \
    --disable-lefty
'''
build = '''
export HOSTCC="$CC"
# the bison grammars first, one at a time: each rule makes both foo.c and
# foo.h, and parallel make ran it twice at once into the same file (grammar.c
# came out with NUL bytes)
make -C lib/cgraph grammar.c
make -C lib/common htmlparse.c
make -C lib/expr exparse.c
make -C cmd/tools gmlparse.c
%make
'''
install = '''
%make_install \
    -j1
install -Dm644 epl-v10.txt "$pkgdir/usr/share/licenses/graphviz/epl-v10.txt"
# useless
rm -f "$pkgdir/usr/bin/dot_builtins"
'''
