setup = '''
mkdir -p dependencies/flatRepo && cp "/build/sources/java-sarif-2.1-modified.jar" dependencies/flatRepo/
mkdir -p dependencies/flatRepo && cp "/build/sources/AXMLPrinter2.jar" dependencies/flatRepo/
mkdir -p dependencies/GhidraServer && cp "/build/sources/yajsw-stable-13.18.zip" dependencies/GhidraServer/
