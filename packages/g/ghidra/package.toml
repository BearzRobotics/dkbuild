mkdir -p dependencies/PyGhidra && cp "/build/sources/setuptools-80.9.0-py3-none-any.whl" dependencies/PyGhidra/
mkdir -p dependencies/Debugger-rmi-trace && cp "/build/sources/wheel-0.45.1-py3-none-any.whl" dependencies/Debugger-rmi-trace/
mkdir -p dependencies/PyGhidra && cp "/build/sources/wheel-0.45.1-py3-none-any.whl" dependencies/PyGhidra/
mkdir -p dependencies/PyGhidra && cp "/build/sources/packaging-25.0-py3-none-any.whl" dependencies/PyGhidra/
mkdir -p dependencies/PyGhidra && cp "/build/sources/typing_extensions-4.16.0-py3-none-any.whl" dependencies/PyGhidra/
mkdir -p dependencies/PyGhidra && cp "/build/sources/jpype1-1.5.2.tar.gz" dependencies/PyGhidra/
'''
build = '''
gradle -I gradle/support/fetchDependencies.gradle -Doffline=true -DnoEclipse=true
gradle -DnoEclipse=true buildGhidra -x ip
'''
install = '''
d="$pkgdir/usr/lib/ghidra"
mkdir -p "$d" "$pkgdir/usr/bin"
unzip -q build/dist/ghidra_*_DEV_*.zip -d build/unpacked
cp -r build/unpacked/ghidra_*/. "$d/"
ln -s ../lib/ghidra/ghidraRun "$pkgdir/usr/bin/ghidra"
ln -s ../lib/ghidra/support/analyzeHeadless "$pkgdir/usr/bin/ghidra-analyzeHeadless"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/ghidra/LICENSE"
'''
