mkdir -p dependencies/Debugger-rmi-trace && cp "/build/sources/protobuf-6.31.0-py3-none-any.whl" dependencies/Debugger-rmi-trace/
mkdir -p dependencies/Debugger-rmi-trace && cp "/build/sources/psutil-5.9.8.tar.gz" dependencies/Debugger-rmi-trace/
