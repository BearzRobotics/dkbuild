# Pinpoints exposed API keys on GitHub. A batch-catching, pattern-matching,... (BlackArch list, requested 2026-11-16; docs/requests.md). Written from the template of ffuf; not built yet when written (wip/queue): expect first-build fixes.
# Go module, dependencies fetched on the host (godeps). Main package: ..
name = "git-hound"
version = "3.2"
release = 1
summary = "Pinpoints exposed API keys on GitHub. A batch-catching, pattern-matching,..."
license = "MIT"
homepage = "https://github.com/tillson/git-hound"
hostdeps = ["go"]
options = ["!check", "godeps"]

source = [
    { url = "https://github.com/tillson/git-hound/archive/refs/tags/v3.2.tar.gz", sha256 = "be883cd265a2cc049c9ed8c7bbf29dccf89789173b19b237618d9c9613ee9127" },
]

environment = '''
export GOFLAGS="-mod=mod -trimpath -buildvcs=false" GOTOOLCHAIN=local GOPROXY=off
export GOCACHE=/tmp/go-cache GOPATH=/tmp/go CGO_ENABLED=0
'''
build = '''
mkdir -p build
go build -o build/git-hound .
'''
install = '''
install -Dm755 build/git-hound "$pkgdir/usr/bin/git-hound"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/git-hound/LICENSE"
'''
