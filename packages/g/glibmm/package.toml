name = "glibmm"
version = "2.90.0"
release = 1
summary = "C++ bindings for GLib"
license = "LGPL-2.1-or-later"
homepage = "https://www.gtkmm.org"
hostdeps = ["meson", "pkgconf", "glib-devel", "perl"]
builddeps = ["glib-devel", "libsigc++-devel"]
options = ["!check"]

source = [
    { url = "https://download.gnome.org/sources/glibmm/2.90/glibmm-2.90.0.tar.xz", sha256 = "e2efa45643f16b9fea2d6299f2f403d672eaeacddf0ff7f8094e1af9b0f5980b" },
]

setup = '''
%meson \
    -Dmaintainer-mode=false \
    -Dbuild-documentation=false \
    -Dbuild-examples=false
'''
build = '''
%meson_build
'''
install = '''
%meson_install
'''
