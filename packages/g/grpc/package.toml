# gRPC (C++ library, the code generator plugins and grpc_cpp_plugin). Proton Bridge's Qt
# front end (bridge-gui) talks to the Go core over gRPC and needs gRPC and protobuf at build
# time. 1.84.3 is the release whose MODULE.bazel pins protobuf 35.1, the version in this
# tree. Everything it can take from the system comes from the system (abseil, c-ares,
# protobuf, re2, OpenSSL, zlib): no bundled third_party copies and no network.
# UNVERIFIED: first build.
# r2: the pinned proto submodules (third_party/grpc-proto ... opentelemetry) as extra sources: CMake stopped with "file COPY cannot find
# third_party/grpc-proto/grpc/reflection/v1alpha/reflection.proto" (the tag archive has no submodule contents).
name = "grpc"
version = "1.84.3"
release = 2
summary = "RPC framework (C++ library and code generator plugins)"
license = "Apache-2.0"
homepage = "https://grpc.io"
archs = ["x86_64", "aarch64"]
hostdeps = ["cmake", "ninja", "pkgconf", "protobuf"]
builddeps = ["abseil-cpp-devel", "c-ares-devel", "protobuf-devel", "re2-devel", "openssl-devel", "zlib-ng-compat-devel"]

source = [
    { url = "https://github.com/grpc/grpc/archive/refs/tags/v1.84.3.tar.gz", sha256 = "c75a91397231e4e7cc3e6b98d9e169db0636c1c854489c5e6a11b0494e8c554d" },
    { url = "https://github.com/grpc/grpc-proto/archive/ec30f589e2519d595688b9a42f88a91bdd6b733f.tar.gz", sha256 = "5e9b520b22afbd53a662cc29017064be253c1dfa6df8958738594e7fec6ade33" },
    { url = "https://github.com/envoyproxy/data-plane-api/archive/6ef568cf4a67362849911d1d2a546fd9f35db2ff.tar.gz", sha256 = "ed5e6c319f8ebcdf24a9491f866a599bb9a3c193b859a94ad13bd31f85b46855" },
    { url = "https://github.com/cncf/xds/archive/ee656c7534f5d7dc23d44dd611689568f72017a6.tar.gz", sha256 = "49535f3c3370004309da50194c09bbfc528d4702424dd46e7d56a278a3dfc15d" },
    { url = "https://github.com/googleapis/googleapis/archive/2193a2bfcecb92b92aad7a4d81baa428cafd7dfd.tar.gz", sha256 = "3de3a199400eea7a766091aeb96c4b84c86266ad1f933f9933bbb7c359e727fe" },
    { url = "https://github.com/envoyproxy/protoc-gen-validate/archive/7b06248484ceeaa947e93ca2747eccf336a88ecc.tar.gz", sha256 = "4549d83e759ca553d49688e2ab5c07654f01035387feb6cac8892536a016901b" },
    { url = "https://github.com/census-instrumentation/opencensus-proto/archive/4aa53e15cbf1a47bc9087e6cfdca214c1eea4e89.tar.gz", sha256 = "27b7982d3ab3a0a66e09d997bbb373e1c83a48abad6da09bbc866428f443a727" },
    { url = "https://github.com/google/cel-spec/archive/9f069b3ee58b02d6f6736c5ebd6587075c1a1b22.tar.gz", sha256 = "d6cb6b4ed272500d16546c672a65a7452b241462a200dda3f62a7de413883344" },
    { url = "https://github.com/open-telemetry/opentelemetry-proto/archive/60fa8754d890b5c55949a8c68dcfd7ab5c2395df.tar.gz", sha256 = "97a9f8c705fc7423881d209ac1dab926121b420ee88e3f066874dbf8123e33f7" },
]

setup = '''
# the git submodules of the tag archive are empty: the protocol sources the build compiles (grpc-proto, the xDS and Envoy APIs,
# googleapis, ...) are the extra sources, at the commits the tag pins, copied to where CMake looks. (Not the libraries: abseil,
# c-ares, protobuf, re2, OpenSSL and zlib are system packages.)
mkdir -p third_party/grpc-proto && cp -a /build/grpc-proto-ec30f589e2519d595688b9a42f88a91bdd6b733f/. third_party/grpc-proto/
mkdir -p third_party/envoy-api && cp -a /build/data-plane-api-6ef568cf4a67362849911d1d2a546fd9f35db2ff/. third_party/envoy-api/
mkdir -p third_party/xds && cp -a /build/xds-ee656c7534f5d7dc23d44dd611689568f72017a6/. third_party/xds/
mkdir -p third_party/googleapis && cp -a /build/googleapis-2193a2bfcecb92b92aad7a4d81baa428cafd7dfd/. third_party/googleapis/
mkdir -p third_party/protoc-gen-validate && cp -a /build/protoc-gen-validate-7b06248484ceeaa947e93ca2747eccf336a88ecc/. third_party/protoc-gen-validate/
mkdir -p third_party/opencensus-proto && cp -a /build/opencensus-proto-4aa53e15cbf1a47bc9087e6cfdca214c1eea4e89/. third_party/opencensus-proto/
mkdir -p third_party/cel-spec && cp -a /build/cel-spec-9f069b3ee58b02d6f6736c5ebd6587075c1a1b22/. third_party/cel-spec/
mkdir -p third_party/opentelemetry && cp -a /build/opentelemetry-proto-60fa8754d890b5c55949a8c68dcfd7ab5c2395df/. third_party/opentelemetry/
%cmake \
    -DBUILD_SHARED_LIBS=ON \
    -DCMAKE_CXX_STANDARD=17 \
    -DgRPC_INSTALL=ON \
    -DgRPC_BUILD_TESTS=OFF \
    -DgRPC_ABSL_PROVIDER=package \
    -DgRPC_CARES_PROVIDER=package \
    -DgRPC_PROTOBUF_PROVIDER=package \
    -DgRPC_RE2_PROVIDER=package \
    -DgRPC_SSL_PROVIDER=package \
    -DgRPC_ZLIB_PROVIDER=package \
    -DgRPC_DOWNLOAD_ARCHIVES=OFF
'''
build = '''
%cmake_build
'''
install = '''
%cmake_install
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/grpc/LICENSE"
'''
