# r2: dependencies on this tree's packages, not Chimera's names (built against the image's copies before).
# r3: static libraries too (in gawk-static), for fully static programs on musl.
name = "gawk"
version = "5.3.2"
release = 3
summary = "GNU awk utility"
license = "GPL-3.0-or-later"
homepage = "http://www.gnu.org/software/gawk"
patches = ["musl.patch"]
hostdeps = ["automake", "gettext-devel", "libtool"]
builddeps = ["readline-devel"]

source = [
    { url = "https://ftp.gnu.org/gnu/gawk/gawk-5.3.2.tar.xz", sha256 = "f8c3486509de705192138b00ef2c00bbbdd0e84c30d5c07d23fc73a9dc4cc9cc" },
]

setup = '''
autoreconf -if -W none
%configure \
    --with-readline \
    --disable-pma
'''
build = '''
%make
'''
check = '''
%make check
'''
install = '''
%make_install
# hardlinks + we don't want to conflict with awk
rm -rf "$pkgdir/usr/bin/awk"
rm -rf "$pkgdir/usr/bin/gawk"
mkdir -p "$pkgdir/usr/bin"
ln -sf gawk-5.3.2 "$pkgdir/usr/bin/gawk"
'''
