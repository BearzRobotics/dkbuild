environment = '''
export HOME=/tmp LANG=C.UTF-8 LC_ALL=C.UTF-8
# the GHC that builds GHC: the previous package's, or (stage 0) Alpine's
if [ -x /usr/bin/ghc ] && [ ! -d /usr/lib/ghc-bootstrap ]; then
    bootghc=/usr/bin/ghc
else
    bootghc=/usr/lib/ghc-bootstrap/usr/bin/ghc
fi
# GHC takes its platform from the boot GHC: "x86_64-alpine-linux" (also for a ghc package built from Alpine's), with no
# libc in the name. ghc-toolchain normalises that to x86_64-alpine-linux-gnu and passes it to clang as --target=, so
# every program was linked for glibc's /lib64/ld-linux-x86-64.so.2, which does not exist here: running one fails with
# "execvp: does not exist" (hsc2hs helpers in r2-r4; stage1/bin/haddock and bindist ghc-pkg in r5-r7, shown by r7's
# diagnostics). Removing the argument (r2-r5) did not catch every way it is passed, so the compiler is run through
# wrappers that add this system's triple as the last --target=, which is the one clang uses. In both bootstrap cases.
mkdir -p /tmp/cc-bin
for w in cc:clang c++:clang++ clang:clang clang++:clang++; do
    printf '#!/bin/sh\nexec /usr/bin/%s "$@" --target=%s\n' "${w##*:}" "$target" > "/tmp/cc-bin/${w%:*}"
    chmod 755 "/tmp/cc-bin/${w%:*}"
done
# r6: the r5 build got as far as stage 1 and died in `ld.lld' failed in phase `Merge
# objects' (Exit code: -11): lld was killed by SIGSEGV merging ghc-prim's objects (-r).
# The log does not show the command and the small merge test configure runs passed, so
# ld and ld.lld are a wrapper that, if lld is killed by a signal, prints the arguments
# to the log and runs it once more with --threads=1 (a threading crash would pass).
cat > /tmp/cc-bin/ld.lld <<'WRAP'
#!/bin/sh
/usr/bin/ld.lld "$@"
r=$?
if [ $r -gt 128 ]; then
echo "ld.lld killed by signal $((r - 128)); arguments: $*" >&2
/usr/bin/ld.lld --threads=1 "$@"
r=$?
fi
exit $r
WRAP
chmod 755 /tmp/cc-bin/ld.lld
ln -sf ld.lld /tmp/cc-bin/ld
for t in ar nm ranlib objdump; do ln -sf /usr/bin/llvm-$t /tmp/cc-bin/$t; done
export PATH="/tmp/cc-bin:$PATH"
# GHC takes its C toolchain from these and records it in its settings; the
# distribution's default flags are not for it (GHC passes its own)
export CC=clang CXX=clang++ LD=ld.lld AR=llvm-ar NM=llvm-nm RANLIB=llvm-ranlib OBJDUMP=llvm-objdump
unset CFLAGS CXXFLAGS CPPFLAGS LDFLAGS
ghc_configure() {
    ./configure --prefix=/usr --with-system-libffi --enable-numa --disable-ld-override \
        CC=clang CXX=clang++ LD=ld.lld AR=llvm-ar NM=llvm-nm RANLIB=llvm-ranlib "$@"
}
hadrian="hadrian/bootstrap/_build/bin/hadrian -j$jobs --flavour=release"
'''
setup = '''
# bootstrap.py's sources tarball (plan-bootstrap.json, each Hackage tarball
# and its .cabal revision), put together from the pinned sources
mkdir -p /tmp/hadrian-src
cp $pkgfiles/plan-bootstrap-9_14_1.json /tmp/hadrian-src/plan-bootstrap.json
python3 -I -c '
import json, shutil, sys
for d in json.load(open(sys.argv[1]))["dependencies"]:
    if d["source"] == "hackage":
        for f in (d["package"] + "-" + d["version"] + ".tar.gz", d["package"] + ".cabal"):
            shutil.copy("/build/sources/" + f, "/tmp/hadrian-src/" + f)
' /tmp/hadrian-src/plan-bootstrap.json
tar -czf /tmp/hadrian-sources.tar.gz -C /tmp/hadrian-src .
'''
build = '''
(cd hadrian/bootstrap && python3 bootstrap.py -w $bootghc -s /tmp/hadrian-sources.tar.gz)
ghc_configure GHC=$bootghc
# r5 compiled and linked everything (ld.lld crashed five times in the merge-objects step, each
# recovered by the single-threaded retry in /tmp/cc-bin/ld.lld) and then stopped at the very end
# with "_build/stage1/bin/haddock: createProcess: execvp: does not exist" after running that haddock
# many times: lld deletes its output when it crashes, so a relink that crashed leaves the file
# missing until the retry writes it again, and a parallel (-j) haddock run can hit that gap.
# Hadrian resumes from its build state: one more run finishes what was left, and if the failure
# is not a one-off the second log shows it again, from the start of the failing target.
$hadrian || { echo "hadrian failed: resuming once" >&2; $hadrian; }
# the programs must ask for musl's loader (see the wrappers above)
llvm-readelf -l _build/stage1/bin/ghc | grep 'interpreter: /lib/ld-musl-'
'''
install = '''
# Hadrian's install has no DESTDIR: install the binary distribution it makes
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/ghc/LICENSE"
# r6: the build step finished (the resume above worked), and the same haddock gap came back here: binary-dist-dir relinks haddock, an lld crash
# deletes its output until the single-threaded retry writes it again, and a parallel run hit the gap ("_build/stage1/bin/haddock: createProcess:
# execvp: does not exist"). The same one resume.
$hadrian binary-dist-dir || { echo "hadrian binary-dist-dir failed: resuming once" >&2; $hadrian binary-dist-dir; } || {
    # r8: diagnostics for "execvp: does not exist" (r1 to r7 never found the cause: stage1/bin/haddock, then bindist/.../bin/ghc-pkg): which of the
    # programs exist, what they are, and the interpreter (PT_INTERP) each ELF asks for, which execve reports as ENOENT when the file is missing
    echo "=== ghc binary-dist-dir diagnostics ===" >&2
    ls -la _build/bindist/ghc-*/bin _build/stage1/bin 2>&1 | head -60 >&2
    for f in _build/bindist/ghc-*/bin/* _build/stage1/bin/*; do
        echo "-- $f: $(ls -lL "$f" 2>&1 | cut -c1-80)" >&2
        llvm-readelf -l "$f" 2>/dev/null | grep -i "interpreter" >&2 || true
    done
    ls -la /lib/ld-musl* /usr/lib/ld-musl* 2>&1 >&2 || true
    echo "=== end diagnostics ===" >&2
    exit 1
}
cd _build/bindist/ghc-$version-*
ghc_configure
make DESTDIR="$pkgdir" install
test -x "$pkgdir/usr/bin/ghc"
# The installed compiler passes the flags in its settings file to clang: the same glibc --target= (see the wrappers
# above) would make every program it links unrunnable, and the build's wrapper directory must not be recorded.
# (Edit of a generated file: sed.)
settings=$(find "$pkgdir/usr/lib" -path '*/ghc-*/lib/settings' -type f)
test -n "$settings"
sed -i -e "s/--target=x86_64-[a-z]*-linux[a-z-]*/--target=$target/g" -e 's|/tmp/cc-bin/|/usr/bin/|g' $settings
! grep -rn -e '/tmp/cc-bin' -e 'linux-gnu' $settings
grep -n -e '--target' $settings || true
'''
