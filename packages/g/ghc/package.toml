# GHC 9.14.1, the Glasgow Haskell Compiler (ghc, ghci, ghc-pkg, runghc,
# haddock, hsc2hs, hpc, hp2ps), built from its source release with Hadrian
# (flavour "release": the vanilla static libraries, the shared ones and the
# profiling ones of every boot library, as upstream's bindists ship them).
# ShellCheck is built with it. 9.14.1 is the newest stable GHC (10.0 is in
# alpha) and the one Alpine has a musl build of to start from.
# Toolchain: GHC's native code generator; clang is its C compiler, assembler
# and linker driver (linking with lld, clang's default), LLVM's ar, nm and
# ranlib. The LLVM backend (-fllvm) is not used: GHC 9.14 supports LLVM up to
# 20, the tree has 23 (configure finds no llc/opt and -fllvm stays
# unavailable). Haskell packages with C++ code link libc++ through GHC's
# system-cxx-std-lib package (configure detects it); the boot libraries have
# none (Hadrian builds text without simdutf, as upstream's bindists).
# Libraries: system GMP (bignum), system libffi, libnuma (--enable-numa: the
# RTS's NUMA support). Left out: DWARF stack unwinding (--enable-dwarf-unwind)
# would link libdw (elfutils) into every program GHC builds; it is off by
# default upstream and in Alpine, Debian and Arch.
# Documentation: Haddock for the libraries and the HTML user guide and ghc(1)
# (Sphinx); no PDFs (no LaTeX in the tree).
# Static libraries (rule 2): GHC's .a libraries are what it links Haskell
# programs with by default, so they stay in the main package, in
# /usr/lib/ghc-9.14.1/lib/... next to the .so ones (not /usr/lib/*.a).
# Bootstrapping: GHC is written in Haskell. The first build (stage 0) runs on
# Alpine's GHC 9.14.1 (ghc-bootstrap, stage0deps); every later one on the
# previous ghc package (selfhost), as Alpine's own does. Either way Hadrian
# builds stage 1 with the boot compiler and stage 2 (what is installed) with
# stage 1. Hadrian itself is built with GHC's hadrian/bootstrap/bootstrap.py
# (Setup.hs builds, no cabal-install) from pinned Hackage sources: the plan
# (files/plan-bootstrap-9_14_1.json) is the one Alpine generated for a 9.14.1
# boot compiler (GHC 9.14.1's own source has plans only for 9.10 and 9.12);
# its packages and .cabal revisions are the sources below, each checked by
# sha256 here and again by bootstrap.py against the plan. A new boot
# compiler version (after an upgrade, the previous ghc) needs its own plan.
# Patches: Alpine's Sphinx 9.1 fix; its other patches are for cross builds
# and the test suite, which is not run (!check: it takes hours and needs the
# separate testsuite tarball).
name = "ghc"
version = "9.14.1"
release = 4
summary = "Glasgow Haskell Compiler"
license = "BSD-3-Clause"
homepage = "https://www.haskell.org/ghc/"
archs = ["x86_64"]
patches = ["users-guide-sphinx-9.1.patch"]
hostdeps = ["python", "python-sphinx", "findutils"]
builddeps = ["gmp-devel", "libffi-devel", "ncurses-devel", "numactl-devel", "llvm-libcxx-devel", "linux-headers"]
stage0deps = ["ghc-bootstrap"]
# what ghc runs to compile and link a Haskell program: clang and lld, the C
# headers, and the development links of the libraries the RTS and the boot
# libraries link (gmp, libffi, libnuma)
rundeps = ["llvm-clang", "llvm-lld", "musl-devel", "gmp-devel", "libffi-devel", "numactl-devel"]
options = ["!check", "!lto", "selfhost", "jobs:12"]

