environment = '''
export HOME=/tmp LANG=C.UTF-8 LC_ALL=C.UTF-8
# the GHC that builds GHC: the previous package's, or (stage 0) Alpine's
if [ -x /usr/bin/ghc ] && [ ! -d /usr/lib/ghc-bootstrap ]; then
    bootghc=/usr/bin/ghc
else
    bootghc=/usr/lib/ghc-bootstrap/usr/bin/ghc
    # Alpine's GHC calls its C toolchain cc, c++, ld, ar and ranlib (its
    # settings file): clang and LLVM's tools under those names
    mkdir -p /tmp/cc-bin
    # cc and c++ are wrappers, not plain links (r2, r3): configure's ghc-toolchain
    # describes the build-platform (stage 0) toolchain from the boot GHC's platform and
    # so gives its C compiler --target=x86_64-unknown-linux (hadrian's hsc2hs
    # calls) or --target=x86_64-alpine-linux-gnu (configure's checks), which clang reads as
    # GNU/glibc: hsc2hs then links its helper programs (..._hsc_make) with a glibc dynamic
    # loader that does not exist here, and running one fails with "posix_spawnp: does not
    # exist" (r2 mapped only the first triple to a musl one and still failed). This
    # system's clang already targets musl by default, so the wrappers drop every
    # --target= argument (stage 0 only; the installed GHC's own target is configured as musl).
    # r4: hsc2hs does not pass its flags on the command line but in a response file
    # (cc @file, utils/hsc2hs Common.hs rawSystemL), so r2's and r3's argument filters
    # never saw the --target= (--cflag=/--lflag= give one per line): the wrappers also
    # filter the lines of an @file argument (copied to a temporary file, cleaned up after).
    for w in cc:clang c++:clang++; do
        cat > /tmp/cc-bin/${w%%:*} <<'WRAP'
#!/bin/sh
tmps=
for a; do
    shift
    case $a in
    --target=*) ;;
    @*) f=${a#@}
        if grep -q '^--target=' "$f" 2>/dev/null; then
            t=$(mktemp /tmp/ccrsp.XXXXXX)
            grep -v '^--target=' "$f" > "$t"
            tmps="$tmps $t"
            set -- "$@" "@$t"
        else
            set -- "$@" "$a"
        fi ;;
    *) set -- "$@" "$a" ;;
    esac
done
/usr/bin/@CLANG@ "$@"
r=$?
[ -z "$tmps" ] || rm -f $tmps
exit $r
WRAP
        sed -i "s|@CLANG@|${w##*:}|" /tmp/cc-bin/${w%%:*}
        chmod 755 /tmp/cc-bin/${w%%:*}
    done
    ln -sf /usr/bin/ld.lld /tmp/cc-bin/ld
    for t in ar nm ranlib objdump; do ln -sf /usr/bin/llvm-$t /tmp/cc-bin/$t; done
    export PATH="/tmp/cc-bin:$PATH"
fi
# GHC takes its C toolchain from these and records it in its settings; the
# distribution's default flags are not for it (GHC passes its own)
export CC=clang CXX=clang++ LD=ld.lld AR=llvm-ar NM=llvm-nm RANLIB=llvm-ranlib OBJDUMP=llvm-objdump
unset CFLAGS CXXFLAGS CPPFLAGS LDFLAGS
ghc_configure() {
    ./configure --prefix=/usr --with-system-libffi --enable-numa --disable-ld-override \
        CC=clang CXX=clang++ LD=ld.lld AR=llvm-ar NM=llvm-nm RANLIB=llvm-ranlib "$@"
}
hadrian="hadrian/bootstrap/_build/bin/hadrian -j$jobs --flavour=release --docs=no-sphinx-pdfs"
'''
setup = '''
# bootstrap.py's sources tarball (plan-bootstrap.json, each Hackage tarball
# and its .cabal revision), put together from the pinned sources
mkdir -p /tmp/hadrian-src
cp $pkgfiles/plan-bootstrap-9_14_1.json /tmp/hadrian-src/plan-bootstrap.json
python3 -I -c '
import json, shutil, sys
for d in json.load(open(sys.argv[1]))["dependencies"]:
    if d["source"] == "hackage":
        for f in (d["package"] + "-" + d["version"] + ".tar.gz", d["package"] + ".cabal"):
            shutil.copy("/build/sources/" + f, "/tmp/hadrian-src/" + f)
' /tmp/hadrian-src/plan-bootstrap.json
tar -czf /tmp/hadrian-sources.tar.gz -C /tmp/hadrian-src .
'''
build = '''
(cd hadrian/bootstrap && python3 bootstrap.py -w $bootghc -s /tmp/hadrian-sources.tar.gz)
ghc_configure GHC=$bootghc
$hadrian
'''
install = '''
# Hadrian's install has no DESTDIR: install the binary distribution it makes
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/ghc/LICENSE"
$hadrian binary-dist-dir
cd _build/bindist/ghc-$version-*
ghc_configure
make DESTDIR="$pkgdir" install
test -x "$pkgdir/usr/bin/ghc"
'''
