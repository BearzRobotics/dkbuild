# gnome-desktop: GNOME's shared desktop library: thumbnail factory (with the
# bubblewrap/seccomp sandboxed thumbnailers), wall clock, XKB layout info,
# background drawing, the GTK 4 libgnome-desktop-4 / libgnome-bg-4 /
# libgnome-rr-4 and the legacy GTK 3 libgnome-desktop-3 (Evolution uses
# that one for attachment thumbnails), the QR code widget (libgnome-qr, with
# the qrcodegen copy the release tarball carries in subprojects/), introspection, udev, desktop help documents. Based on Chimera's
# main/gnome-desktop. systemd integration off (no systemd in FenrirOS); no
# gtk-doc reference.
name = "gnome-desktop"
version = "51.0"
release = 1
summary = "GNOME desktop management utilities"
license = "GPL-2.0-or-later AND LGPL-2.1-or-later"
homepage = "https://gitlab.gnome.org/GNOME/gnome-desktop"
patches = ["fix-ub.patch"]
hostdeps = ["docbook-xml", "gettext", "glib-devel", "gobject-introspection", "itstool", "meson", "pkgconf"]
builddeps = ["eudev-devel", "fontconfig-devel", "gdk-pixbuf-devel", "glib-devel", "gsettings-desktop-schemas-devel",
             "gtk+3-devel", "gtk4-devel", "iso-codes", "libseccomp-devel", "libxkbcommon-devel",
             "xkeyboard-config"]
rundeps = ["bubblewrap", "gsettings-desktop-schemas", "iso-codes", "xkeyboard-config"]
# The tests need a graphical session.
options = ["!check"]

source = [
    { url = "https://download.gnome.org/sources/gnome-desktop/51/gnome-desktop-51.0.tar.xz", sha256 = "9ebeb9f1769d3c310caeadd921ab34c8f264b92937740518b3bc859a579a6912" },
]

setup = '''
%meson \
    -Dudev=enabled \
    -Dsystemd=disabled \
    -Dqr=enabled \
    -Dbuild_gtk4=true \
    -Dlegacy_library=true \
    -Ddesktop_docs=true \
    -Dgtk_doc=false \
    -Dinstalled_tests=false
'''
build = '''
%meson_build
'''
install = '''
%meson_install
'''
