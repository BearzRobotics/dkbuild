# Granite 7: elementary's GTK 4 widget library (Vala). SwayNotificationCenter 0.12 links it.
# Introspection and Vala bindings on, docs off.
name = "granite"
version = "7.8.1"
release = 1
summary = "elementary OS GTK 4 widget library"
license = "LGPL-3.0-or-later"
homepage = "https://github.com/elementary/granite"
archs = ["x86_64", "aarch64"]
hostdeps = ["meson", "pkgconf", "vala", "gobject-introspection", "glib-devel", "gettext", "sassc"]
builddeps = ["gtk4-devel", "libgee-devel", "glib-devel", "gobject-introspection-devel", "libadwaita-devel"]
options = ["!check"]

source = [
    { url = "https://github.com/elementary/granite/archive/refs/tags/7.8.1.tar.gz", sha256 = "bc8e7946ca091fdeeeebeb64db4e95d33a3ffb879048137f8d8a41ecd76caa3f" },
]

setup = '''
# -Ddemo=false: granite-demo (a sample application, not the library) needs libshumate, which is not packaged
%meson -Ddocumentation=false -Dintrospection=true -Ddemo=false
'''
build = '''
%meson_build
'''
install = '''
%meson_install
'''
