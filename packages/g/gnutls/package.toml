# FenrirOS: no TPM (tpm2-tss, trousers) or DANE (unbound) support; not in the tree.
# Imported from Chimera Linux cports: /tmp/claude-1000/-stuff-git-dkbuild/d8b7a1e7-c48c-4fe9-b3a3-e71798cac65d/scratchpad/cports-full/main/gnutls/template.py
