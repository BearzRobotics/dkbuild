name = "gobuster"
version = "3.8.2"
release = 1
summary = "Directory/DNS/vhost brute-forcer"
license = "Apache-2.0"
homepage = "https://github.com/OJ/gobuster"
hostdeps = ["go"]
options = ["!check", "godeps"]

source = [
    { url = "https://github.com/OJ/gobuster/archive/refs/tags/v3.8.2.tar.gz", sha256 = "6919232eafbd0c4bbc9664d7f434b6a8d82133aa09f1400341ef6985ceff208a" },
]

environment = '''
export GOFLAGS="-mod=mod -trimpath -buildvcs=false" GOTOOLCHAIN=local GOPROXY=off
export GOCACHE=/tmp/go-cache GOPATH=/tmp/go CGO_ENABLED=0
'''
build = '''
mkdir -p build
go build -o build/ .
'''
install = '''
install -Dm755 build/gobuster "$pkgdir/usr/bin/gobuster"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/gobuster/LICENSE"
'''
