# gpm: mouse support on the Linux console (select and paste in text mode,
# mouse in console programs such as Vim, Midnight Commander and Emacs).
# Service `gpm` (dinit), off unless enabled; libgpm for programs that use it.
name = "gpm"
version = "1.20.7"
release = 4
summary = "Mouse server for the console"
license = "GPL-2.0-or-later"
homepage = "https://www.nico.schottelius.org/software/gpm"
patches = ["001-error-format.patch", "002-fix-highly-illegal-return-of-in-as-char.patch", "003-fix-signedness-issue.patch", "004-install-shared-libs-with-+x-perms.patch", "005-install-unversioned-solibrary.patch", "006-musl-fixes.patch", "007-constify-format-strings.patch", "008-gpm-include-sysmacros.patch", "009-gcc-10.patch", "010-includes.patch"]
hostdeps = ["automake", "bison", "flex", "libtool", "texinfo"]
builddeps = ["flex-static", "linux-headers", "ncurses-devel"]
rundeps = ["procps"]
options = ["!check"]

source = [
    { url = "https://www.nico.schottelius.org/software/gpm/archives/gpm-1.20.7.tar.gz", sha256 = "c7e4661c24e05ae13547176b649bac8e3a0db2575f7dd57559f9e0b509f90f49" },
]

setup = '''
./autogen.sh
%configure
'''
build = '''
%make
'''
install = '''
%make_install
mkdir -p "$pkgdir/usr/lib"
ln -sf libgpm.so.2.1.0 "$pkgdir/usr/lib/libgpm.so"
install -Dm644 $pkgfiles/gpm.sh "$pkgdir/usr/lib/profile.d/gpm.sh"
install -Dm644 $pkgfiles/gpm "$pkgdir/etc/dinit.d/gpm"
install -Dm644 COPYING "$pkgdir/usr/share/licenses/gpm/COPYING"
'''
