# A single-binary file server for pentesters and sysadmins with HTTP/S, WebDAV, SFTP,... (BlackArch list, requested 2026-11-16; docs/requests.md). Written from the template of ffuf; not built yet when written (wip/queue): expect first-build fixes.
# Go module, dependencies fetched on the host (godeps). Main package: ..
name = "goshs"
version = "2.1.8"
release = 1
summary = "A single-binary file server for pentesters and sysadmins with HTTP/S, WebDAV, SFTP,..."
license = "MIT"
homepage = "https://github.com/goshs-labs/goshs"
hostdeps = ["go"]
options = ["!check", "godeps"]

source = [
    { url = "https://github.com/goshs-labs/goshs/archive/refs/tags/v2.1.8.tar.gz", sha256 = "3d1e4ab15d7b6f5fba7d1e793fbb803dc085f6cc66d3c39d9f8a818ae4d55346" },
]

environment = '''
export GOFLAGS="-mod=mod -trimpath -buildvcs=false" GOTOOLCHAIN=local GOPROXY=off
export GOCACHE=/tmp/go-cache GOPATH=/tmp/go CGO_ENABLED=0
'''
build = '''
mkdir -p build
go build -o build/goshs .
'''
install = '''
install -Dm755 build/goshs "$pkgdir/usr/bin/goshs"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/goshs/LICENSE"
'''
