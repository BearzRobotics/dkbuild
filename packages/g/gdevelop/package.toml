# GDevelop: open-source, no-code 2D/3D game engine and editor (Florian Rival
# and contributors), the desktop editor on the system Electron (5.6.287 is
# built for Electron 32; FenrirOS has 42).
# Built from source throughout, including its core: GDevelop.js (the C++
# GDCore/GDJS compiled to WebAssembly as libGD.js) with the system Emscripten,
# where upstream's build downloads a CI-built copy. GDevelop pins Emscripten
# 3.1.21; this uses 6.0.3 (the one for LLVM 23); if that fails, a pinned
# 3.1.21 toolchain is the fallback.
# npm packages from the npm store (`npmdeps`, 8 lockfiles). Three come from
# GitHub repositories (webidl-tools, webidl2, @lingui/react), which npm would
# clone: they are sources here, and package.json points at their directories
# (npm install --offline then rewrites those lockfile entries). The three
# bundled third-party editors (Piskel, jfxr, Yarn) are the zips GDevelop
# attaches to its releases, as its import script downloads them.
# The IDE (newIDE/app, Create React App) is built into electron-app/app/www,
# as upstream's app-build.js does; electron-builder packaging is skipped
# (it downloads an Electron), the app directory runs on /usr/lib/electron.
# DRAFT, not built: needs electron and emscripten.
name = "gdevelop"
version = "5.6.287"
release = 2
summary = "Open-source game engine and editor, no-code and with JavaScript"
license = "MIT"
homepage = "https://gdevelop.io"
archs = ["x86_64", "aarch64"]
hostdeps = ["nodejs", "python", "cmake", "emscripten", "binaryen", "unzip"]
rundeps = ["electron"]
options = ["!check", "!strip", "npmdeps"]

source = [
    { url = "https://github.com/4ian/GDevelop/archive/refs/tags/v5.6.287.tar.gz", sha256 = "65b5c9a9665d196315c37ce5fc0d8a60be17e305749f4ee78dd941431f87cfb7" },
    { url = "https://github.com/4ian/webidl-tools/archive/348f9c03afc9d8f278efccdd74543e265a41fd11.tar.gz", sha256 = "bf3730c4c2b32be33fb0fecd391046b32b625aac1d9d2c5942161a4f3936e8e8" },
    { url = "https://github.com/markandrus/webidl2.js/archive/e470735423d73fbbc20d472d9e0174592b80a463.tar.gz", sha256 = "777fcd90acfbb524545bd66154affdc25caa8e8558902f5272f058d91f335633" },
    { url = "https://github.com/4ian/lingui-react/archive/dc6b1e013470d952cf85f96cc4affdd28e29634a.tar.gz", sha256 = "51b8d49ae63e0188d387a12df400115083e541017f8e6881381a77dca45b96cf" },
    { url = "https://github.com/4ian/GDevelop/releases/download/v5.5.228/piskel-editor.zip", sha256 = "4347acf89421756a68f472cb3bfce0d50e7dfb617cf8857fd93f435eb4725cda", unpack = false },
    { url = "https://github.com/4ian/GDevelop/releases/download/v5.0.0-beta55/jfxr-editor.zip", sha256 = "8f7624c58ed173185378699136347a38faea144152661864f13fa26bd8325670", unpack = false },
    { url = "https://github.com/4ian/GDevelop/releases/download/v5.0.134/yarn-editor.zip", sha256 = "cd11e7056062f3f71fdd4a4e94fa0c6aecdd753dbab5602174269ddc88dae6d9", unpack = false },
]

environment = '''
export HOME=/tmp/home npm_config_cache=/tmp/npm-cache npm_config_offline=true \
    npm_config_audit=false npm_config_fund=false npm_config_update_notifier=false
export ELECTRON_SKIP_BINARY_DOWNLOAD=1 PATH="$PATH:/usr/lib/emscripten" EM_CACHE=/tmp/emcache
export NODE_OPTIONS=--max-old-space-size=8192 GENERATE_SOURCEMAP=false CI=false
'''
setup = '''
top=$PWD
wt=/build/webidl-tools-348f9c03afc9d8f278efccdd74543e265a41fd11
w2=/build/webidl2.js-e470735423d73fbbc20d472d9e0174592b80a463
lr=/build/lingui-react-dc6b1e013470d952cf85f96cc4affdd28e29634a
# the GitHub dependencies as local directories
python3 $pkgfiles/local-git-deps.py $wt/package.json webidl2=file:$w2
python3 $pkgfiles/local-git-deps.py GDevelop.js/package.json webidl-tools=file:$wt
python3 $pkgfiles/local-git-deps.py newIDE/app/package.json @lingui/react=file:$lr
locks=$(find . -name package-lock.json -not -path '*/node_modules/*')
node /dkbuild/npm-offline.js /tmp/npm-cache $locks
# GDevelop.js/update-bindings.js looks for Emscripten's WebIDL binder in an
# emsdk checkout ($EMSDK/upstream/emscripten/tools/) and runs it with a bare
# "python". The system Emscripten is /usr/lib/emscripten (the binder is in its
# tools/), and python is python3; without this the grunt build stops with
# "EMSDK env. variable is not set / Can't find undefined/upstream/...".
sed -i -e "s|process.env.EMSDK + '/upstream/emscripten/tools/webidl_binder.py'|'/usr/lib/emscripten/tools/webidl_binder.py'|" \
    -e "s|'python \"' + webIdlBinderPath|'python3 \"' + webIdlBinderPath|" \
    -e "s|^if (!process.env.EMSDK) {|if (false) {|" GDevelop.js/update-bindings.js
grep -q "/usr/lib/emscripten/tools/webidl_binder.py" GDevelop.js/update-bindings.js
grep -q "python3 " GDevelop.js/update-bindings.js
# GDJS, the game engine runtime (TypeScript, built by the IDE's import step)
(cd GDJS && npm ci --ignore-scripts)
(cd GDevelop.js && npm install --offline --ignore-scripts --install-links)
# --legacy-peer-deps: with its lockfile entry gone, npm re-resolves the local
# @lingui/react, whose peer React (^15 || ^16) the app's "react": "$react"
# override meets with React 18 only as "react@undefined" (ERESOLVE)
(cd newIDE/app && npm install --offline --ignore-scripts --install-links --legacy-peer-deps && npx patch-package)
(cd newIDE/electron-app && npm ci --ignore-scripts)
(cd newIDE/electron-app/app && npm ci --ignore-scripts)
# the bundled editors, where import-zipped-editor.js would download them
for e in piskel jfxr yarn; do
    mkdir -p newIDE/app/public/external/$e
    unzip -q -o /build/sources/$e-editor.zip -d newIDE/app/public/external/$e
done
'''
build = '''
# 1. libGD.js: GDCore and GDJS compiled to WebAssembly (grunt: emcmake cmake,
#    emmake make, then a copy into newIDE)
(cd GDevelop.js && sed -i "s/'-j 8'/'-j $jobs'/" Gruntfile.js && npx grunt build)
test -f Binaries/embuild/GDevelop.js/libGD.js
# 2. the IDE: import-resources without the downloads (the editors are in
#    place: their checksum check skips the download), then the React build
cd newIDE/app/scripts
node make-version-metadata.js
node import-zipped-editor.js piskel 5.5.228 b161dc74582e428a6d210cd1b74f052ca4aab301d0d522e0be87bdb4962d0fb7
node import-zipped-editor.js jfxr 5.0.0-beta55 8ac12b557c2ddba958c6f0d3e0c5df8cf3369a65262dcb90cf5c8a7a7d20bdf6
node import-zipped-editor.js yarn 5.0.134 ba8558cad00ec9b18cf3c6fd8647f8c1478ca67c894bca94a152a3740af209cc
node build-theme-resources.js
node make-service-worker.js
node import-libGD.js
node import-GDJS-Runtime.js
node import-monaco-editor.js
node import-zipped-external-libs.js
cd ..
npx react-app-rewired build
node scripts/check-build-output.js
# 3. the Electron app: the IDE in app/www (app-build.js without electron-builder)
cd ../electron-app
node scripts/import-zipped-electron-extension.js ReactDeveloperTools app/extensions/ || true
node scripts/copy-electron-remote-to-app-resources.js
rm -rf app/www && mkdir -p app/www && cp -r ../app/build/. app/www/
'''
install = '''
mkdir -p "$pkgdir/usr/lib"
cp -a newIDE/electron-app/app "$pkgdir/usr/lib/gdevelop"
install -Dm755 $pkgfiles/gdevelop "$pkgdir/usr/bin/gdevelop"
install -Dm644 $pkgfiles/gdevelop.desktop "$pkgdir/usr/share/applications/gdevelop.desktop"
install -Dm644 newIDE/app/public/android-chrome-512x512.png "$pkgdir/usr/share/icons/hicolor/512x512/apps/gdevelop.png"
install -Dm644 LICENSE.md "$pkgdir/usr/share/licenses/gdevelop/LICENSE.md"
'''
