name = "gptfdisk"
version = "1.0.10"
release = 2
summary = "Fdisk-like partitioning tool for GPT disks"
license = "GPL-2.0-or-later"
homepage = "https://sourceforge.net/projects/gptfdisk"
patches = ["fix_test.patch", "ncurses.patch"]
builddeps = ["linux-headers", "ncurses-devel", "popt-devel", "util-linux-uuid-devel"]

source = [
    { url = "https://downloads.sourceforge.net/sourceforge/gptfdisk/1.0.10/gptfdisk-1.0.10.tar.gz", sha256 = "2abed61bc6d2b9ec498973c0440b8b804b7a72d7144069b5a9209b2ad693a282" },
]

build = '''
%make \
    PREFIX=/usr
'''
check = '''
sh gdisk_test.sh
'''
install = '''
install -Dm755 cgdisk "$pkgdir/usr/bin/cgdisk"
install -Dm755 fixparts "$pkgdir/usr/bin/fixparts"
install -Dm755 gdisk "$pkgdir/usr/bin/gdisk"
install -Dm755 sgdisk "$pkgdir/usr/bin/sgdisk"
'''
