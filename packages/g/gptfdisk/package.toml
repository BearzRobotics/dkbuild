name = "gptfdisk"
version = "1.0.10"
release = 4
summary = "Fdisk-like partitioning tool for GPT disks"
license = "GPL-2.0-or-later"
homepage = "https://sourceforge.net/projects/gptfdisk"
builddeps = ["linux-headers", "ncurses-devel", "popt-devel", "util-linux-devel"]

source = [
    { url = "https://downloads.sourceforge.net/sourceforge/gptfdisk/1.0.10/gptfdisk-1.0.10.tar.gz", sha256 = "2abed61bc6d2b9ec498973c0440b8b804b7a72d7144069b5a9209b2ad693a282" },
]

setup = '''
# ncurses' wide headers are in /usr/include here, not ncursesw/
sed -i 's|ncursesw/||' gptcurses.cc
'''
build = '''
make -j$jobs CXX="$CXX" CC="$CC"
'''
check = '''
sh gdisk_test.sh
'''
install = '''
for m in gdisk sgdisk cgdisk fixparts; do install -Dm644 $m.8 "$pkgdir/usr/share/man/man8/$m.8"; done
install -Dm755 cgdisk "$pkgdir/usr/sbin/cgdisk"
install -Dm755 fixparts "$pkgdir/usr/sbin/fixparts"
install -Dm755 gdisk "$pkgdir/usr/sbin/gdisk"
install -Dm755 sgdisk "$pkgdir/usr/sbin/sgdisk"
'''
