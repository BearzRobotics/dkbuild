# Imported from Chimera Linux cports: work/cports/main/glib/template.py
# cports is BSD-2-Clause, Copyright (c) Chimera Linux contributors.
# Imported draft, untested. Dropped from Chimera's recipe: shell completions, service/tmpfiles/sysusers
# installs and cbuild env tweaks; dependency names are Chimera's and resolve from stage 0 until they are recipes.
# r3: dependencies on this tree's packages, not Chimera's names (built against the image's copies before).
# r4: static libraries too (in glib-static), for fully static programs on musl.
# r5: introspection data (GLib, GObject, Gio typelibs), with the tree's gobject-introspection.
# r6 (2026-11-26): gschemas.compiled and the GIO module cache were never made at install: no GSettings schema could be found.
name = "glib"
version = "2.90.2"
release = 1
# scripts/post-install and scripts/trigger (the trigger watches these directories)
triggers = ["/usr/share/glib-2.0/schemas", "/usr/lib/gio/modules"]
summary = "GLib library of C routines"
license = "LGPL-2.1-or-later"
homepage = "https://wiki.gnome.org/Projects/GLib"
patches = ["29fb84735c9c1ce0c3b72d3fc21bdf9744e37f64.patch", "alwaysbash.patch", "deprecated-no-warn.patch", "girepository-no-pytests.patch", "no-desktop-file-utils.patch"]
hostdeps = ["gettext", "gobject-introspection", "gobject-introspection-devel", "meson", "pkgconf", "python-docutils", "python-packaging"]
builddeps = ["dbus-devel", "elfutils-devel", "freetype-bootstrap", "glib-bootstrap", "libffi-devel", "pcre2-devel", "sysprof-capture", "util-linux-devel", "zlib-ng-compat-devel"]
checkdeps = ["dbus", "python-pytest"]

source = [
    { url = "https://download.gnome.org/sources/glib/2.90/glib-2.90.2.tar.xz", sha256 = "edf473b4f5ee70a31d2410622ee605dc4a2c8c46dbc0ec53c9abbaf3960232fd" },
]

setup = '''
%meson \
    -Ddocumentation=false \
    -Dintrospection=enabled \
    -Dman-pages=disabled \
    -Dselinux=disabled \
    -Dsysprof=disabled
'''
build = '''
%meson_build
'''
install = '''
%meson_install
install -Dm644 COPYING "$pkgdir/usr/share/licenses/glib/COPYING"
'''
