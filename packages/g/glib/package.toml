# r3: dependencies on this tree's packages, not Chimera's names (built against the image's copies before).
name = "glib"
version = "2.90.1"
release = 3
summary = "GLib library of C routines"
license = "LGPL-2.1-or-later"
homepage = "https://wiki.gnome.org/Projects/GLib"
patches = ["29fb84735c9c1ce0c3b72d3fc21bdf9744e37f64.patch", "alwaysbash.patch", "deprecated-no-warn.patch", "girepository-no-pytests.patch", "no-desktop-file-utils.patch"]
hostdeps = ["gettext", "gobject-introspection", "meson", "pkgconf", "python-docutils", "python-packaging"]
builddeps = ["dbus-devel", "elfutils-devel", "freetype-bootstrap", "glib-bootstrap", "libffi-devel", "pcre2-devel", "sysprof-capture", "util-linux-devel", "zlib-ng-compat-devel"]
checkdeps = ["dbus", "python-pytest"]

source = [
    { url = "https://download.gnome.org/sources/glib/2.90/glib-2.90.1.tar.xz", sha256 = "93c941aa17d5eb1d53fe838365f29a8b4e539c222a256d974ec8f30fc413e396" },
]

setup = '''
%meson \
    -Ddocumentation=false \
    -Dintrospection=disabled \
    -Dman-pages=disabled \
    -Dselinux=disabled \
    -Dsysprof=disabled
'''
build = '''
%meson_build
'''
install = '''
%meson_install
install -Dm644 COPYING "$pkgdir/usr/share/licenses/glib/COPYING"
'''
