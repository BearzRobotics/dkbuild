# cports is BSD-2-Clause, Copyright (c) Chimera Linux contributors.
name = "go-md2man"
version = "2.0.7"
release = 13
summary = "Markdown to manpage converter"
license = "MIT"
homepage = "https://github.com/cpuguy83/go-md2man"
hostdeps = ["go"]

options = ["!check", "godeps"]

source = [
    { url = "https://github.com/cpuguy83/go-md2man/archive/v2.0.7.tar.gz", sha256 = "ca3a5b57e2c01759f5a00ad2a578d034c5370fae9aa7a6c3af5648b2fc802a92" },
]

environment = '''
export GOFLAGS="-mod=mod -trimpath -buildvcs=false" GOTOOLCHAIN=local GOPROXY=off
export GOCACHE=/tmp/go-cache GOPATH=/tmp/go CGO_ENABLED=0
'''
build = '''
mkdir -p build
go build -o build/ .
./build/go-md2man -in go-md2man.1.md -out go-md2man.1
'''
install = '''
install -Dm755 build/go-md2man "$pkgdir/usr/bin/go-md2man"
install -Dm644 LICENSE.md "$pkgdir/usr/share/licenses/go-md2man/LICENSE.md"
install -Dm644 go-md2man.1 "$pkgdir/usr/share/man/man1/go-md2man.1"
'''
