# GCC's stage 0 seed: Alpine Linux's prebuilt GCC 15.2 for musl (3.23) with
# C, C++, Ada (GNAT) and D (GDC), unpacked in a private directory,
# /usr/lib/gcc-bootstrap. GCC's Ada and D front ends are written in Ada and D,
# so the first build of gcc needs an existing GNAT and GDC; only that first
# build uses this (gcc's stage0deps), every later one is built by the
# previous gcc (selfhost), as with dotnet. Nothing else finds these files.
# Licence: GPL-3.0+ with the GCC Runtime Library Exception; shipping the
# binaries would mean shipping GCC's source with them, so this stays off the
# repository ISO and on the build machine (as dotnet-bootstrap-gcc-runtime).
name = "gcc-bootstrap"
version = "15.2.0"
release = 1
summary = "Prebuilt GCC with Ada and D (Alpine's), to bootstrap gcc once"
license = "GPL-3.0-or-later WITH GCC-exception-3.1"
homepage = "https://gcc.gnu.org"
archs = ["x86_64"]
options = ["!strip", "!check", "!repo-iso"]

