install = '''
d="$pkgdir/usr/lib/gcc-bootstrap"
mkdir -p "$d"
# an Alpine package is gzipped tar streams one after another
for a in /build/sources/*.apk; do
    tar -xzf "$a" -C "$d" --exclude='.PKGINFO' --exclude='.SIGN.*' --exclude='.pre-*' --exclude='.post-*' 2>/dev/null || \
        tar -xzf "$a" -C "$d"
done
rm -f "$d"/.PKGINFO "$d"/.SIGN.* "$d"/.pre-* "$d"/.post-*
test -x "$d/usr/bin/gcc" && test -x "$d/usr/bin/gnatmake" && test -x "$d/usr/bin/gdc"
install -Dm644 /dev/stdin "$pkgdir/usr/share/licenses/gcc-bootstrap/README" <<EOF2
Alpine Linux 3.23's GCC 15.2.0 packages, unchanged: GPL-3.0-or-later with the
GCC Runtime Library Exception 3.1 (libraries). Source: https://gcc.gnu.org and
https://gitlab.alpinelinux.org/alpine/aports/-/tree/3.23-stable/main/gcc
EOF2
'''
