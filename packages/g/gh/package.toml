# cports is BSD-2-Clause, Copyright (c) Chimera Linux contributors.
# Named gh, the command (Chimera: github-cli). Go modules are vendored on the
# host (`godeps`) and the build runs offline with -mod=mod. Man pages and
# bash/zsh/fish completions are generated by the binary just built.
name = "gh"
version = "2.103.3"
release = 2
summary = "GitHub CLI tool"
license = "MIT"
homepage = "https://cli.github.com"
hostdeps = ["go"]
options = ["!check", "godeps"]

source = [
    { url = "https://github.com/cli/cli/archive/refs/tags/v2.103.3.tar.gz", sha256 = "bb148138a3a2fe023e57c78042fe3b42fc09171c0e8fff4cf983b227b7a2eade" },
]

environment = '''
export GOFLAGS="-mod=mod -trimpath -buildvcs=false" GOTOOLCHAIN=local GOPROXY=off
export GOCACHE=/tmp/go-cache GOPATH=/tmp/go CGO_ENABLED=1
'''
build = '''
mkdir -p build
go build -o build/ -ldflags "-X github.com/cli/cli/v2/internal/build.Version=v2.103.3" ./cmd/gh ./cmd/gen-docs
./build/gen-docs --man-page --doc-path man
for sh in bash fish zsh; do ./build/gh completion -s=$sh > gh.$sh; done
'''
install = '''
install -Dm755 build/gh "$pkgdir/usr/bin/gh"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/gh/LICENSE"
install -d "$pkgdir/usr/share/man/man1"
install -m644 man/*.1 "$pkgdir/usr/share/man/man1/"
install -Dm644 gh.bash "$pkgdir/usr/share/bash-completion/completions/gh"
install -Dm644 gh.fish "$pkgdir/usr/share/fish/vendor_completions.d/gh.fish"
install -Dm644 gh.zsh "$pkgdir/usr/share/zsh/site-functions/_gh"
'''
