# GLPI: IT asset management and service desk (inventory of hardware and
# software, licences, tickets, problems, changes, knowledge base). PHP with
# MariaDB, served by nginx and php-fpm. Upstream's release archive (PHP
# libraries in vendor/ as source, and its built web assets). Packaged as GLPI
# documents for distributions: inc/downstream.php puts configuration in
# /etc/glpi, data in /var/lib/glpi, logs in /var/log/glpi. Automatic actions
# from an example cron job (installed by the user). Setup: /usr/share/doc/glpi/README.FenrirOS.
# Installed inert (docs/requests.md): no service enabled, no site, no cron
# job, no credentials; the README says how to set it up.
name = "glpi"
version = "12.0.1"
release = 1
summary = "IT asset management and service desk"
license = "GPL-3.0-or-later"
homepage = "https://glpi-project.org"
archs = ["x86_64", "aarch64"]
rundeps = ["php", "php-fpm", "nginx"]
options = ["!check", "!strip"]

source = [
    { url = "https://github.com/glpi-project/glpi/releases/download/12.0.1/glpi-12.0.1.tgz", sha256 = "bf89a1be40ea76e4e7a6a5cea8fd24c9d822fab83e4e90519ff0c8d062f13291" },
]

install = '''
d="$pkgdir/usr/share/glpi"
mkdir -p "$d"
cp -a . "$d/"
# the data directory skeleton, copied to /var/lib/glpi (tmpfiles) when missing
mv "$d/files" "$d/files.dist"
rm -rf "$d/config"
install -Dm644 $pkgfiles/downstream.php "$d/inc/downstream.php"
install -Dm644 $pkgfiles/glpi.cron "$pkgdir/usr/share/doc/glpi/glpi.cron"
install -Dm644 $pkgfiles/tmpfiles.conf "$pkgdir/usr/lib/tmpfiles.d/glpi.conf"
install -Dm644 $pkgfiles/nginx-glpi.conf "$pkgdir/usr/share/doc/glpi/nginx-glpi.conf"
install -Dm644 $pkgfiles/README.FenrirOS "$pkgdir/usr/share/doc/glpi/README.FenrirOS"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/glpi/LICENSE"
'''
