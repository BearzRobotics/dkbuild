# GLPI under nginx with php-fpm (/run/php-fpm.sock): only public/ is served.
# Copy to /etc/nginx/http.d/glpi.conf, set server_name and TLS, and add
# nginx's user to the _php group.
server {
    listen 80;
    server_name glpi.example.org;
    root /usr/share/glpi/public;
    location / { try_files $uri /index.php$is_args$args; }
    location ~ ^/index\.php$ {
        fastcgi_pass unix:/run/php-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
