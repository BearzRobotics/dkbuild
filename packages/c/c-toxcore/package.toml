# c-toxcore 0.2.25: Tox peer-to-peer messaging/AV core library (toxcore, toxav, toxencryptsave) and
# tox-bootstrapd. Written 2026-11-22, not built. Dependency of qTox.
# !check/-DUNITTEST=OFF: the test binaries open network ports and need gtest's death tests; not run in the sandbox.
# The bootstrap daemon is installed but no service is shipped or enabled (inert).
name = "c-toxcore"
version = "0.2.25"
release = 1
summary = "Tox core library"
license = "GPL-3.0-or-later"
homepage = "https://tox.chat"
hostdeps = ["cmake", "ninja", "pkgconf"]
builddeps = ["libconfig-devel", "libsodium-devel", "libvpx-devel", "opus-devel"]
options = ["!check"]

source = [
    { url = "https://github.com/TokTok/c-toxcore/releases/download/v0.2.25/c-toxcore-0.2.25.tar.gz", sha256 = "0f350d34243be4e987b92a76e63a8ab0a5203746f134a4296b873f86f213f460" },
    # the third_party/cmp git submodule (TokTok/cmp, MessagePack in C), empty in the release archive, at the commit the tag pins
    { url = "https://github.com/TokTok/cmp/archive/52bfcfa17d2eb4322da2037ad625f5575129cece.tar.gz", sha256 = "4abfd641dd5ccba04b6e0ced04a79755fa70709290b3ba15dbd4b4a2de345ed0" },
]

# the cmp submodule's directory is empty in the archive ("Cannot find source file: third_party/cmp/cmp.c"): the archive above takes its place
setup = '''
rm -rf third_party/cmp
cp -a ../cmp-52bfcfa17d2eb4322da2037ad625f5575129cece third_party/cmp
test -f third_party/cmp/cmp.c
%cmake \
    -DUNITTEST=OFF \
    -DAUTOTEST=OFF \
    -DBUILD_TOXAV=ON \
    -DMUST_BUILD_TOXAV=ON \
    -DDHT_BOOTSTRAP=ON \
    -DBOOTSTRAP_DAEMON=ON \
    -DENABLE_STATIC=ON \
    -DENABLE_SHARED=ON
'''
build = '''
%cmake_build
'''
install = '''
%cmake_install
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/c-toxcore/LICENSE"
'''
