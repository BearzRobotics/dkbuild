# Take a list of domains, crawl urls and scan for endpoints, secrets, api keys, file... (BlackArch list, requested 2026-11-16; docs/requests.md). Written from the template of ffuf; not built yet when written (wip/queue): expect first-build fixes.
# Go module, dependencies fetched on the host (godeps). Main package: cmd/cariddi.
name = "cariddi"
version = "1.4.6"
release = 1
summary = "Take a list of domains, crawl urls and scan for endpoints, secrets, api keys, file..."
license = "GPL-3.0"
homepage = "https://github.com/edoardottt/cariddi"
hostdeps = ["go"]
options = ["!check", "godeps"]

source = [
    { url = "https://github.com/edoardottt/cariddi/archive/refs/tags/v1.4.6.tar.gz", sha256 = "9a33ebf9324c3f7f28c72161c80c994eaa3ca495c487eefed39a2e6861d65674" },
]

environment = '''
export GOFLAGS="-mod=mod -trimpath -buildvcs=false" GOTOOLCHAIN=local GOPROXY=off
export GOCACHE=/tmp/go-cache GOPATH=/tmp/go CGO_ENABLED=0
'''
build = '''
mkdir -p build
go build -o build/cariddi ./cmd/cariddi
'''
install = '''
install -Dm755 build/cariddi "$pkgdir/usr/bin/cariddi"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/cariddi/LICENSE"
'''
