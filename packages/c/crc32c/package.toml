# Google's CRC32C (Castagnoli) with SSE4.2/ARM CRC32 paths. Chromium uses the
# system one (use_system crc32c). CMake builds one library type per tree, so
# the static library comes from a second build; tests and benchmarks need
# git submodules the archive does not have.
name = "crc32c"
version = "1.1.2"
release = 1
summary = "CRC32C (Castagnoli) checksum library"
license = "BSD-3-Clause"
homepage = "https://github.com/google/crc32c"
hostdeps = ["cmake", "ninja"]
options = ["!check"]

source = [
    { url = "https://github.com/google/crc32c/archive/refs/tags/1.1.2.tar.gz", sha256 = "ac07840513072b7fcebda6e821068aa04889018f24e10e46181068fb214d7e56" },
]

setup = '''
opts="-DCRC32C_BUILD_TESTS=OFF -DCRC32C_BUILD_BENCHMARKS=OFF -DCRC32C_USE_GLOG=OFF"
%cmake $opts -DBUILD_SHARED_LIBS=ON
cmake -B build-static -G Ninja -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_BUILD_TYPE=Release $opts -DBUILD_SHARED_LIBS=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON
'''
build = '''
%cmake_build
cmake --build build-static
'''
install = '''
DESTDIR="$pkgdir" cmake --install build-static
%cmake_install
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/crc32c/LICENSE"
'''
