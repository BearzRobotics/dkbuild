# A powerful ‘first-response’ capability to quickly identify threats within Windows... (BlackArch list, requested 2026-11-16; docs/requests.md). Written from the template of bashrs; not built yet when written (wip/queue): expect first-build fixes.
# Rust crate (binaries: chainsaw), crates vendored on the host (cargodeps).
name = "chainsaw"
version = "2.18.0"
release = 1
summary = "A powerful ‘first-response’ capability to quickly identify threats within Windows..."
license = "GPL-3.0"
homepage = "https://github.com/countercept/chainsaw"
hostdeps = ["rust", "pkgconf"]
options = ["!check", "cargodeps"]

source = [
    { url = "https://github.com/countercept/chainsaw/archive/refs/tags/v2.18.0.tar.gz", sha256 = "2f30875fac34ca8482ddf3de888949f94a5983cda35e4ee81abe78e19175c87e" },
]

environment = '''
export CARGO_HOME=/tmp/cargo-home CARGO_NET_OFFLINE=true
'''
build = '''
cargo build --release --frozen --offline --locked -j $jobs
'''
install = '''
install -Dm755 target/release/chainsaw "$pkgdir/usr/bin/chainsaw"
install -Dm644 LICENCE "$pkgdir/usr/share/licenses/chainsaw/LICENCE"
'''
