# cowsql: an embeddable, replicated SQLite (Incus's database, standalone or
# clustered). Based on Chimera Linux cports (BSD-2-Clause), with its patch.
name = "cowsql"
version = "1.15.9"
release = 1
summary = "Embeddable, replicated and fault tolerant SQL engine"
license = "LGPL-3.0-only"
options = ["!check"]
homepage = "https://github.com/cowsql/cowsql"
patches = ["sign-warning-error.patch"]
hostdeps = ["automake", "pkgconf", "libtool", "autoconf"]
builddeps = ["libuv-devel", "raft-devel", "sqlite-devel"]

source = [
    { url = "https://github.com/cowsql/cowsql/archive/v1.15.9.tar.gz", sha256 = "257aee775f68fd145bfae012dc394fdf62c2f97f0360b0bcf6bd1f66bc58ca04" },
]

setup = '''
autoreconf -if -W none
%configure
'''
build = '''
%make
'''
install = '''
%make_install
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/cowsql/LICENSE"
'''
