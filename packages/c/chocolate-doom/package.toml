# Chocolate Doom: Doom (and Heretic, Hexen, Strife) source port that
# reproduces the vanilla DOS behaviour exactly (GPL-2.0). Needs a game WAD:
# freedoom is the free one.
name = "chocolate-doom"
version = "3.1.1"
release = 1
summary = "Doom source port that is faithful to the DOS original"
license = "GPL-2.0-or-later"
homepage = "https://www.chocolate-doom.org"
hostdeps = ["automake", "autoconf", "pkgconf", "python"]
builddeps = ["libpng-devel", "libsamplerate-devel", "sdl2-compat-devel", "sdl2-mixer-devel", "sdl2-net-devel", "fluidsynth-devel"]
rundeps = ["freedoom"]
options = ["!check"]  # no test suite

source = [
    { url = "https://github.com/chocolate-doom/chocolate-doom/archive/chocolate-doom-3.1.1.tar.gz", sha256 = "1edcc41254bdc194beb0d33e267fae306556c4d24110a1d3d3f865717f25da23" },
]

setup = '''
autoreconf -if -W none
%configure
'''
build = '''
%make
'''
install = '''
%make_install
install -Dm644 COPYING.md "$pkgdir/usr/share/licenses/chocolate-doom/COPYING.md"
'''
