# CLI11: header-only C++ command-line parser (quickshell's launcher uses it). Tests off.
name = "cli11"
version = "2.7.2"
release = 1
summary = "Command-line parser for C++11 and later (header-only)"
license = "BSD-3-Clause"
homepage = "https://github.com/CLIUtils/CLI11"
archs = ["x86_64", "aarch64"]
hostdeps = ["cmake", "ninja"]
options = ["!check"]

source = [
    { url = "https://github.com/CLIUtils/CLI11/archive/refs/tags/v2.7.2.tar.gz", sha256 = "46eef3101da70852ec7af026e09d485ccee81813331c8c6052d39344443b83da" },
]

setup = '''
%cmake -DCLI11_BUILD_TESTS=OFF -DCLI11_BUILD_EXAMPLES=OFF -DCLI11_BUILD_DOCS=OFF
'''
build = '''
%cmake_build
'''
install = '''
%cmake_install
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/cli11/LICENSE"
'''
