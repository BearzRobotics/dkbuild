# Community edition nuclei templates. (BlackArch list, requested 2026-11-16; docs/requests.md). Written from the template of ffuf; not built yet when written (wip/queue): expect first-build fixes.
# Go module, dependencies fetched on the host (godeps). Main package: ..
name = "cent"
version = "2.2.0"
release = 1
summary = "Community edition nuclei templates."
license = "Apache-2.0"
homepage = "https://github.com/xm1k3/cent"
hostdeps = ["go"]
options = ["!check", "godeps"]

source = [
    { url = "https://github.com/xm1k3/cent/archive/refs/tags/v2.2.0.tar.gz", sha256 = "a8fe788dbb4c56fa763d891e62150fa8541c4ca8215f148a5f70891100f97a0f" },
]

environment = '''
export GOFLAGS="-mod=mod -trimpath -buildvcs=false" GOTOOLCHAIN=local GOPROXY=off
export GOCACHE=/tmp/go-cache GOPATH=/tmp/go CGO_ENABLED=0
'''
build = '''
mkdir -p build
go build -o build/cent .
'''
install = '''
install -Dm755 build/cent "$pkgdir/usr/bin/cent"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/cent/LICENSE"
'''
