# Chibi-Scheme 0.12, a small R7RS Scheme (libchibi-scheme.so and .a, the headers
# in -devel, chibi-scheme, chibi-ffi, chibi-doc, snow-chibi, and the standard
# libraries with the dynamically loaded native modules). Plain Makefile, no
# configure: PREFIX=/usr. Everything the Makefile builds is built (the optional
# native modules link only libc; no libraries are needed).
# libchibi-scheme.a is not in `all`; it is built explicitly. The Makefile's install
# step, when no DESTDIR is given, dumps `.img` start-up images; with the staged
# DESTDIR it does not, so they are not made (they only speed up start-up).
# The test suite (test-r7rs and the libraries) is run.
name = "chibi-scheme"
version = "0.12"
release = 1
summary = "Small embeddable R7RS Scheme implementation"
license = "BSD-3-Clause"
homepage = "https://github.com/ashinn/chibi-scheme"
hostdeps = ["make"]
options = ["!lto"]

source = [
    { url = "https://github.com/ashinn/chibi-scheme/archive/refs/tags/0.12.tar.gz", sha256 = "b70a1147bc70a0f90df3fb6081bc99808237fd17a9accf9ee7a2cc20d95a4df0" },
]

build = '''
%make PREFIX=/usr all libchibi-scheme.a
'''
check = '''
%make PREFIX=/usr test
'''
install = '''
%make_install PREFIX=/usr
install -Dm644 COPYING "$pkgdir/usr/share/licenses/chibi-scheme/COPYING"
'''
