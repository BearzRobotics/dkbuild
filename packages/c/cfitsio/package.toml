# needed by: kstars, stellarsolver, indi.
name = "cfitsio"
version = "4.7.0"
release = 1
summary = "Library for FITS astronomical data files"
license = "custom:cfitsio"
homepage = "https://heasarc.gsfc.nasa.gov/fitsio/"
hostdeps = ["cmake", "ninja", "pkgconf"]
builddeps = ["zlib-ng-compat-devel", "curl-devel", "bzip2-devel"]
options = ["!check"]

source = [
    { url = "https://heasarc.gsfc.nasa.gov/FTP/software/fitsio/c/cfitsio-4.7.0.tar.gz", sha256 = "ce573bbea8e75b429f8c3d3e86498741ba3dc9628a1530d2f65268397ad059e8" },
]

setup = '''
%cmake \
    -DUSE_CURL=ON \
    -DUSE_BZIP2=ON \
    -DTESTS=OFF
'''
build = '''
%cmake_build
'''
install = '''
%cmake_install
install -Dm644 licenses/License.txt "$pkgdir/usr/share/licenses/cfitsio/License.txt"
'''
