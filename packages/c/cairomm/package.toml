# needed by: pangomm, gtkmm. Its tests need boost, which is not in the tree yet.
name = "cairomm"
version = "1.19.1"
release = 2
summary = "C++ bindings for the Cairo graphics library"
license = "LGPL-2.1-or-later"
homepage = "https://www.cairographics.org/cairomm"
hostdeps = ["meson", "pkgconf"]
builddeps = ["cairo-devel", "libsigc++-devel"]
options = ["!check"]

source = [
    { url = "https://cairographics.org/releases/cairomm-1.19.1.tar.xz", sha256 = "06881a0167d84962c74db318427c5be663d30b8ea5c60740a9dc36a9c1961b54" },
]

setup = '''
%meson \
    -Dbuild-documentation=false \
    -Dbuild-examples=false \
    -Dbuild-tests=false
'''
build = '''
%meson_build
'''
install = '''
%meson_install
'''
