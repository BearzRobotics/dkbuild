# A fast tool to scan CRLF vulnerability written in Go. (BlackArch list, requested 2026-11-16; docs/requests.md). Written from the template of ffuf; not built yet when written (wip/queue): expect first-build fixes.
# Go module, dependencies fetched on the host (godeps). Main package: cmd/crlfuzz.
name = "crlfuzz"
version = "1.4.1"
release = 1
summary = "A fast tool to scan CRLF vulnerability written in Go."
license = "MIT"
homepage = "https://github.com/dwisiswant0/crlfuzz"
hostdeps = ["go"]
options = ["!check", "godeps"]

source = [
    { url = "https://github.com/dwisiswant0/crlfuzz/archive/refs/tags/v1.4.1.tar.gz", sha256 = "7ef3ea3890b501aab1507e2fd53cc6390cebafc6dbce5efca1faf03b967db8a3" },
]

environment = '''
export GOFLAGS="-mod=mod -trimpath -buildvcs=false" GOTOOLCHAIN=local GOPROXY=off
export GOCACHE=/tmp/go-cache GOPATH=/tmp/go CGO_ENABLED=0
'''
build = '''
mkdir -p build
go build -o build/crlfuzz ./cmd/crlfuzz
'''
install = '''
install -Dm755 build/crlfuzz "$pkgdir/usr/bin/crlfuzz"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/crlfuzz/LICENSE"
'''
