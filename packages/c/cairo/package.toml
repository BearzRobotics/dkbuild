# Wayland-only: no X11 dependencies, and the xlib/xcb backends off.
# r3: static libraries too (in cairo-static), for fully static programs on musl.
name = "cairo"
version = "1.18.6"
release = 3
summary = "Vector graphics library with cross-device output support"
license = "LGPL-2.1-or-later OR MPL-1.1"
homepage = "https://cairographics.org"
patches = ["musl-stacksize.patch"]
hostdeps = ["meson", "pkgconf"]
builddeps = ["fontconfig-devel", "freetype-bootstrap", "glib-bootstrap", "libpng-devel", "lzo-devel", "pixman-devel", "zlib-ng-compat-devel"]
checkdeps = ["ghostscript", "poppler-devel", "librsvg-devel"]
options = ["!check"]

source = [
    { url = "https://cairographics.org/releases/cairo-1.18.6.tar.xz", sha256 = "1c767308174337a74694da0f3ec069c271452163a1ef4540964c50c301f157d4" },
]

setup = '''
%meson \
    -Dtee=enabled \
    -Dxlib=disabled \
    -Dxcb=disabled \
    -Dspectre=disabled \
    -Dtests=disabled
'''
build = '''
%meson_build
'''
install = '''
%meson_install
'''
