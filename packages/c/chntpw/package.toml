# needed by: rescue-tools. Offline Windows tools: reset or unlock local
# accounts (chntpw, sampasswd, samunlock), edit the registry (reged), list
# users and groups (samusrgrp). Upstream (2014, unmaintained) with Debian's
# patches, the second source: ported from OpenSSL to libgcrypt and hardened.
name = "chntpw"
version = "140201"
release = 1
summary = "Offline Windows password reset and registry editor"
license = "GPL-2.0-only AND LGPL-2.1-only"
homepage = "https://pogostick.net/~pnh/ntpasswd/"
hostdeps = ["pkgconf"]
builddeps = ["libgcrypt-devel", "libgpg-error-devel"]
options = ["!check"]

source = [
    { url = "https://deb.debian.org/debian/pool/main/c/chntpw/chntpw_140201.orig.tar.xz", sha256 = "56849d366043a6335449cd83c6cd3cb31c041300ae17d388728b4c2a16d1f4ed" },
    { url = "https://deb.debian.org/debian/pool/main/c/chntpw/chntpw_140201-1.3.debian.tar.xz", sha256 = "ee91998513f4073f364f8b1fb8ebd2f1e9f8400dde591fa99f10e853e5e09ebe" },
]

setup = '''
for p in $(grep -v '^#' /build/debian/patches/series); do
    patch -p1 -i "/build/debian/patches/$p"
done
'''
build = '''
make CC="$CC" CFLAGS="$CFLAGS -DUSELIBGCRYPT -I. $(pkg-config --cflags libgcrypt)" LIBS="$LDFLAGS $(pkg-config --libs libgcrypt)"
'''
install = '''
for b in chntpw cpnt reged samusrgrp sampasswd samunlock; do
    install -Dm755 $b "$pkgdir/usr/bin/$b"
done
install -Dm644 LGPL.txt "$pkgdir/usr/share/licenses/chntpw/LGPL.txt"
install -Dm644 GPL.txt "$pkgdir/usr/share/licenses/chntpw/GPL.txt"
'''
