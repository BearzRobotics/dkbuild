# cabal-install 3.18.2.0: the `cabal` command, Haskell's package build tool
# (newest release; it supports GHC 9.14). Recipes of Haskell programs use it
# as a hostdep, offline, against their hackagedeps store.
# Bootstrapped without cabal: its Hackage dependencies (files/hackage.lock,
# from files/bootstrap-plan.txt: upstream's bootstrap plan for GHC 9.12.4
# with GHC 9.14.1's boot packages, see that file) are built one after another
# with Cabal's Setup (the Cabal library GHC ships) into a package database in
# /tmp, each with the flags upstream's plan gives it, then cabal-install
# itself. This is what upstream's bootstrap/bootstrap.py does, without its
# need for a checkout of the Cabal repository.
# Static libraries per GHC's model: the Haskell libraries are built static
# only (GHC links them into the program) and none is shipped; the program
# links the system's zlib (zlib +pkg-config, not the bundled copy), gmp and
# libffi.
# Left out: the git-rev flag (needs githash and a git checkout; off upstream).
# Shipped: cabal, its manual page (`cabal man --raw`, as Alpine) and bash
# completion. cabal fetches from Hackage over HTTPS with curl (its own HTTP
# client has no TLS), hence curl in rundeps; and it is no use without GHC.
name = "cabal-install"
version = "3.18.2.0"
release = 1
summary = "The command-line interface for Cabal and Hackage"
license = "BSD-3-Clause"
homepage = "https://www.haskell.org/cabal/"
archs = ["x86_64"]
hostdeps = ["ghc", "pkgconf"]
builddeps = ["gmp-devel", "libffi-devel", "numactl-devel", "zlib-ng-compat-devel"]
rundeps = ["ghc", "curl"]
options = ["hackagedeps"]

source = [
    { url = "https://hackage.haskell.org/package/cabal-install-3.18.2.0/cabal-install-3.18.2.0.tar.gz", sha256 = "1d55fea99bf82b2f4a2ae51bd47313167048ba05aac6290a30752d91cd5f7cb8" },
]

environment = '''
export HOME=/tmp LANG=C.UTF-8
hs=/tmp/hsdeps
db=$hs/package.db
export PATH="$hs/inst/bin:$PATH"
# files/bootstrap-plan.txt in build order (each after what it needs); alex
# first, as Cabal-syntax's lexer needs it
hsdeps="alex-3.5.4.2 Cabal-syntax-3.18.2.0 process-1.6.30.0 Cabal-3.18.2.0
    splitmix-0.1.3.2 random-1.3.1 edit-distance-0.2.2.1 th-compat-0.1.7
    network-uri-2.6.4.2 cabal-install-solver-3.18.1.0 hashable-1.5.1.0
    unordered-containers-0.2.21 async-2.2.6 base16-bytestring-1.0.2.0
    cryptohash-sha256-0.11.102.1 echo-0.1.4 hooks-exe-3.18 network-3.2.8.0
    HTTP-4000.5.0 atomic-counter-0.1.2.4 directory-ospath-streaming-0.3
    tar-0.7.1.0 zlib-0.7.1.1 base64-bytestring-1.2.1.0 ed25519-0.0.5.0
    hackage-security-0.6.3.3 open-browser-0.5.1.0 regex-base-0.94.0.3
    regex-posix-0.96.0.2 safe-exceptions-0.1.7.4 semaphore-compat-2.0.1
    resolv-0.2.0.3"
# the flags upstream's plan builds each with
hsflags() {
    case $1 in
        Cabal|cabal-install) echo "-git-rev" ;;
        process|directory-ospath-streaming) echo "+os-string" ;;
        network) echo "-devel" ;;
        HTTP) echo "-conduit10 -warn-as-error -warp-tests" ;;
        hashable) echo "-arch-native -random-initial-seed" ;;
        async) echo "-bench -debug-auto-label" ;;
        atomic-counter) echo "-dev -no-cmm" ;;
        splitmix) echo "-optimised-mixer" ;;
        cryptohash-sha256) echo "-exe +use-cbits" ;;
        ed25519) echo "+no-donna" ;;
        zlib) echo "-bundled-c-zlib +non-blocking-ffi +pkg-config" ;;
        hackage-security) echo "+cabal-syntax" ;;
        regex-posix) echo "-_regex-posix-clib" ;;
        semaphore-compat) echo "-build-testing" ;;
    esac
}
# Cabal's Setup, configured against GHC's global database and ours only
hsconf="--package-db=clear --package-db=global --package-db=$db --disable-shared
    --disable-library-profiling --disable-tests --disable-benchmarks
    --disable-executable-stripping --ghc-options=-j$jobs"
'''
setup = '''
mkdir -p $hs/src $hs/setup-obj $hs/setup-conf-obj
ghc-pkg init $db
# two Setups: build-type Simple, and Configure (runs the package's ./configure)
printf 'import Distribution.Simple\nmain = defaultMain\n' > $hs/Setup.hs
printf 'import Distribution.Simple\nmain = defaultMainWithHooks autoconfUserHooks\n' > $hs/SetupConf.hs
ghc --make -package-env=- -O0 -outputdir $hs/setup-obj -o $hs/setup $hs/Setup.hs
ghc --make -package-env=- -O0 -outputdir $hs/setup-conf-obj -o $hs/setup-conf $hs/SetupConf.hs
'''
build = '''
for p in $hsdeps; do
    n=${p%-*}
    tar -xzf "$DKBUILD_HACKAGE/$p.tar.gz" -C $hs/src
    # the newest Hackage revision of its .cabal (hackage.lock), if any
    if [ -e "$DKBUILD_HACKAGE/$p.cabal" ]; then cp "$DKBUILD_HACKAGE/$p.cabal" $hs/src/$p/$n.cabal; fi
    s=$hs/setup
    if grep -qi '^build-type: *configure' $hs/src/$p/$n.cabal; then s=$hs/setup-conf; fi
    (cd $hs/src/$p && $s configure $hsconf --prefix=$hs/inst --flags="$(hsflags $n)" && \
        $s build -j$jobs && $s install)
done
$hs/setup configure $hsconf --prefix=/usr --flags="$(hsflags cabal-install)"
$hs/setup build -j$jobs
./dist/build/cabal/cabal man --raw > cabal.1
'''
check = '''
./dist/build/cabal/cabal --version
./dist/build/cabal/cabal --numeric-version | grep -qx "$version"
'''
install = '''
install -Dm755 dist/build/cabal/cabal "$pkgdir/usr/bin/cabal"
install -Dm644 cabal.1 "$pkgdir/usr/share/man/man1/cabal.1"
install -Dm644 bash-completion/cabal "$pkgdir/usr/share/bash-completion/completions/cabal"
install -Dm644 README.md "$pkgdir/usr/share/doc/cabal-install/README.md"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/cabal-install/LICENSE"
'''
