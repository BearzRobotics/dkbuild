name = "cni-plugins"
version = "1.9.1"
release = 5
summary = "Standard CNI plugins for containers"
license = "Apache-2.0"
homepage = "https://www.cni.dev"
hostdeps = ["bash", "go"]
builddeps = ["linux-headers"]
options = ["!check"]

source = [
    { url = "https://github.com/containernetworking/plugins/archive/refs/tags/v1.9.1.tar.gz", sha256 = "34bd82d47e981940751619c9cc44c095bb90bfcaf8d71865cbb822c37690a764" },
]

environment = '''
# Its Go dependencies are in the tarball's vendor/ (build_linux.sh: -mod=vendor).
export GOTOOLCHAIN=local GOPROXY=off GOCACHE=/tmp/go-cache GOPATH=/tmp/go CGO_ENABLED=1
'''
build = '''
bash build_linux.sh -ldflags "-X github.com/containernetworking/plugins/pkg/utils/buildversion.BuildVersion=v$version"
'''
install = '''
install -dm755 "$pkgdir/usr/lib/cni"
install -m755 bin/* "$pkgdir/usr/lib/cni/"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/cni-plugins/LICENSE"
'''
