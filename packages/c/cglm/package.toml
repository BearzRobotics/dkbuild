# cglm: optimized OpenGL math library for C (MIT), used by Taisei.
name = "cglm"
version = "0.9.7"
release = 1
summary = "Graphics math library for C"
license = "MIT"
homepage = "https://github.com/recp/cglm"
hostdeps = ["cmake", "ninja", "pkgconf"]
options = []

source = [
    { url = "https://github.com/recp/cglm/archive/refs/tags/v0.9.7.tar.gz", sha256 = "cc0862eee2885d2a2b4870eb29b97c6e9b9ebc7c66e8854e1fa8f3d18d9d8475" },
]

setup = '''
%cmake -DCGLM_SHARED=ON -DCGLM_STATIC=ON -DCGLM_USE_TEST=ON
'''
build = '''
%cmake_build
'''
check = '''
# --no-tests=error: a build that registers no test must not pass for tested
ctest --test-dir build --output-on-failure --no-tests=error
'''
install = '''
%cmake_install
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/cglm/LICENSE"
'''
