# Imported from Chimera Linux cports: work/cports/main/cryptsetup/template.py
# cports is BSD-2-Clause, Copyright (c) Chimera Linux contributors.
# Imported draft, untested: dependency names are Chimera's and resolve from the stage 0 image until they are recipes.
# r2: dependencies on this tree's packages, not Chimera's names (built against the image's copies before).
# r3: static libraries too (in cryptsetup-static), for fully static programs on musl.
name = "cryptsetup"
version = "2.8.9"
release = 1
summary = "Open source Linux disk encryption setup"
license = "GPL-2.0-or-later"
homepage = "https://gitlab.com/cryptsetup/cryptsetup"
hostdeps = ["automake", "bash", "gettext-devel", "libtool", "pkgconf"]
builddeps = ["json-c-devel", "libatomic-chimera-devel", "linux-headers", "lvm2-devel", "musl-devel", "openssl-devel", "popt-devel", "eudev-devel", "util-linux-devel"]
checkdeps = ["procps", "xz"]

# Tests are off (2026-11-18): they open dm-crypt devices, which needs the kernel's device-mapper
# (dm_mod) and dmsetup/blkid; an unprivileged sandbox build has neither ("Cannot initialize
# device-mapper"). Every failure in the log is of that kind.
options = ["!check"]

source = [
    { url = "https://www.kernel.org/pub/linux/utils/cryptsetup/v2.8/cryptsetup-2.8.9.tar.gz", sha256 = "c9b565f853e85e5915275cf33662160d599bd946592b551dab5100d0d5866bcf" },
]

setup = '''
autoreconf -if -W none
%configure \
    --with-crypto_backend=openssl \
    --sbindir=/usr/sbin \
    --disable-external-tokens \
    --disable-ssh-token \
    --disable-asciidoc
'''
build = '''
%make
'''
check = '''
%make check
'''
install = '''
%make_install
'''
