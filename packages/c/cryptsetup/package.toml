name = "cryptsetup"
version = "2.8.8"
release = 1
summary = "Open source Linux disk encryption setup"
license = "GPL-2.0-or-later"
homepage = "https://gitlab.com/cryptsetup/cryptsetup"
hostdeps = ["automake", "bash", "gettext-devel", "libtool", "pkgconf"]
builddeps = ["json-c-devel", "json-c-devel-static", "libatomic-chimera-devel", "libatomic-chimera-devel-static", "libunwind-devel", "libunwind-devel-static", "linux-headers", "lvm2-devel", "lvm2-devel-static", "musl-devel", "musl-devel-static", "openssl3-devel", "openssl3-devel-static", "popt-devel", "popt-devel-static", "udev-devel", "udev-devel-static", "util-linux-blkid-devel", "util-linux-blkid-devel-static", "util-linux-uuid-devel", "util-linux-uuid-devel-static"]
checkdeps = ["procps", "xz"]

source = [
    { url = "https://www.kernel.org/pub/linux/utils/cryptsetup/v2.8/cryptsetup-2.8.8.tar.gz", sha256 = "4cdc4f46a6d41b856a36392a38fa302bab2a1b530e32d9fc010eb3a704f3e984" },
]

setup = '''
autoreconf -if -W none
%configure \
    --with-crypto_backend=openssl \
    --sbindir=/usr/sbin \
    --disable-static \
    --disable-external-tokens \
    --disable-ssh-token \
    --disable-asciidoc
'''
build = '''
%make
'''
check = '''
%make check
'''
install = '''
%make_install
'''
