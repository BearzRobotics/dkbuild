# The LibreOffice core of Collabora Online (CODE) 25.04.9, Collabora's branch
# of LibreOffice, built headless for LibreOfficeKit: the document engine
# coolwsd runs. It is separate from the desktop libreoffice (26.8) and lives in
# /opt/collaboraoffice: Collabora Online and its core are released together,
# and LibreOfficeKit only holds between a matching pair (NixOS does the same).
# needed by: collabora-online.
#
# The configuration follows Collabora's distro-configs/CPLinux-LOKit.conf
# (no GUI, Java, D-Bus or GStreamer; merged libraries; Colibre icons), with
# the system's libraries where they fit. Orcus 0.19 and mdds 2.1 are built
# from the bundled copies: this core is older than the system's. Patches:
# Chimera's for the desktop LibreOffice that apply here (musl stack size, GNU
# install and cp); aarch64.patch does not apply to this tree and needs its own
# version for the arm64 build. The other sources are the archives
# download.lst names, except fonts and Java parts.
name = "collabora-core"
version = "25.04.9.4"
release = 1
summary = "LibreOffice core for Collabora Online (LibreOfficeKit, headless)"
license = "MPL-2.0"
homepage = "https://www.collaboraonline.com"
patches = ["add-external-patches.patch", "gnucp.patch", "install-gnuisms.patch", "ltoplugin.patch", "musl-stacksize.patch", "ppc64-asm.patch", "ppc64-except.patch"]
archs = ["x86_64", "aarch64"]
hostdeps = ["automake", "bash", "bison", "flex", "gettext", "gperf", "libtool", "libxml2", "libxslt", "perl", "pkgconf", "python", "python-lxml", "python-setuptools", "unzip", "xz", "zip"]
