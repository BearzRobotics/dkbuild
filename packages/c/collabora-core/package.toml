environment = '''
export CXXFLAGS="${CXXFLAGS} -DGLM_ENABLE_EXPERIMENTAL -DU_USING_ICU_NAMESPACE=1"
'''
setup = '''
# The bundled third-party archives are the other sources, copied to /build/sources.
NOCONFIGURE=1 perl autogen.sh
%configure \
    --prefix=/opt/collaboraoffice \
    "--with-vendor=FenrirOS" \
    --with-parallelism=$jobs \
    --with-lang=en-US \
    --with-external-tar=/build/sources \
    --disable-fetch-external \
    --disable-ccache \
    --disable-dependency-tracking \
    --enable-release-build \
    --enable-mergelibs \
    --enable-cairo-rgba \
    --enable-python=system \
    --enable-extension-integration \
    --disable-gui \
    --disable-dbus \
    --disable-gio \
    --disable-gtk3 \
    --disable-gtk4 \
    --disable-qt5 \
    --disable-qt6 \
    --disable-kf5 \
    --disable-kf6 \
    --disable-gstreamer-1-0 \
    --disable-evolution2 \
    --disable-randr \
    --disable-odk \
    --disable-online-update \
    --disable-dconf \
    --disable-epm \
    --disable-lpsolve \
    --disable-coinmp \
    --disable-poppler \
    --disable-firebird-sdbc \
    --disable-mariadb-sdbc \
    --disable-postgresql-sdbc \
    --disable-report-builder \
    --disable-ext-wiki-publisher \
    --disable-ext-nlpsolver \
    --disable-scripting-beanshell \
    --disable-scripting-javascript \
    --disable-sdremote \
    --disable-sdremote-bluetooth \
    --disable-lotuswordpro \
    --disable-librelogo \
    --with-theme="colibre colibre_svg" \
    --with-galleries=no \
    --without-templates \
    --without-help \
    --without-java \
    --without-fonts \
    --with-system-libs \
    --with-system-headers \
    --with-tls=nss \
    --with-myspell-dicts \
    --with-external-dict-dir=/usr/share/hunspell \
    --with-external-hyph-dir=/usr/share/hyphen \
    --with-external-thes-dir=/usr/share/mythes \
    --without-system-orcus \
    --without-system-mdds \
    --without-system-afdko \
    --without-system-box2d \
    --without-system-fast-float \
    --without-system-libcmis \
    --without-system-libeot \
    --without-system-libzmf \
    --without-system-libstaroffice \
    --without-system-dragonbox \
    --without-system-frozen \
    --without-system-zxcvbn
'''
build = '''
%make
'''
install = '''
make DESTDIR="$pkgdir" install
# the LibreOfficeKit headers coolwsd builds against (collabora-core-devel)
install -dm755 "$pkgdir/opt/collaboraoffice/include"
cp -r include/LibreOfficeKit "$pkgdir/opt/collaboraoffice/include/"
# no menu entries or launchers: this core is for coolwsd
rm -rf "$pkgdir/opt/collaboraoffice/share/applications" "$pkgdir/opt/collaboraoffice/bin"
'''

[subpackages.devel]
summary = "LibreOfficeKit headers"
paths   = ["/opt/collaboraoffice/include"]
