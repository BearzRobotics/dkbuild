name = "certbot"
version = "5.8.0"
release = 2
summary = "Tool to obtain certs from Let's Encrypt"
license = "Apache-2.0 AND MIT"
homepage = "https://github.com/certbot/certbot"
hostdeps = ["python", "python-setuptools"]
checkdeps = []
rundeps = ["python-acme", "python-configargparse", "python-configobj", "python-cryptography", "python-distro", "python-josepy", "python-parsedatetime"]
options = ["!check"]

source = [
    { url = "https://github.com/certbot/certbot/archive/refs/tags/v5.8.0.tar.gz", sha256 = "84eed9f149b6dd9f43174b4c2cfaf93105a74b58b0eadc82946b65edfde8045b" },
]

install = '''
for d in certbot certbot-apache certbot-nginx; do
    python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
        --root "$pkgdir" --prefix /usr ./$d
done
install -Dm644 certbot/LICENSE.txt "$pkgdir/usr/share/licenses/certbot/LICENSE.txt"
'''
