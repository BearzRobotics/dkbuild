name = "caddy"
version = "2.11.7"
release = 3
summary = "Extensible HTTP server with automatic HTTPS"
license = "Apache-2.0"
homepage = "https://caddyserver.com"
hostdeps = ["go"]
builddeps = []
rundeps = ["shared-mime-info"]
options = ["!check", "godeps"]

source = [
    { url = "https://github.com/caddyserver/caddy/archive/v2.11.7.tar.gz", sha256 = "86e39de5fa0bc433a9cd574a00e7751059903401f3389c61f8937fd0ad0180f5" },
]

environment = '''
export GOFLAGS="-mod=mod -trimpath -buildvcs=false" GOCACHE=/tmp/go-cache GOPATH=/tmp/go
'''
build = '''
go build -ldflags "-X github.com/caddyserver/caddy/v2.CustomVersion=v2.11.7" -o build/caddy ./cmd/caddy
for sh in bash fish zsh; do build/caddy completion $sh > caddy.$sh; done
'''
install = '''
install -Dm755 build/caddy "$pkgdir/usr/bin/caddy"
install -Dm644 $pkgfiles/caddy "$pkgdir/etc/dinit.d/caddy"
install -d "$pkgdir/etc/caddy"
install -Dm644 caddy.bash "$pkgdir/usr/share/bash-completion/completions/caddy"
install -Dm644 caddy.fish "$pkgdir/usr/share/fish/vendor_completions.d/caddy.fish"
install -Dm644 caddy.zsh "$pkgdir/usr/share/zsh/site-functions/_caddy"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/caddy/LICENSE"
'''
