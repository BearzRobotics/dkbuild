# compiler-rt's builtins for the Windows targets (x86_64, i686, aarch64), in
# clang's resource directory (lib/windows/libclang_rt.builtins-<arch>.a).
# Based on Chimera Linux cports (BSD-2-Clause): main/clang-rt-builtins-mingw-w64.
name = "clang-rt-builtins-mingw-w64"
version = "23.1.5"
release = 2
summary = "Clang runtime builtins for cross-compiling Windows programs"
license = "Apache-2.0 WITH LLVM-exception AND NCSA"
homepage = "https://llvm.org"
hostdeps = ["cmake", "ninja", "python", "llvm", "llvm-devel", "llvm-clang", "llvm-lld", "mingw-w64-headers"]
rundeps = ["llvm-clang"]
options = ["!check", "!strip", "!lto"]

source = [
    { url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.5/llvm-project-23.1.5.src.tar.xz", sha256 = "fb50b1eac93ddeb3aa8dab4cfe324dff74f4a9c2bdee6160c9e36188f8d06a6e" },
]

environment = '''
unset CC CXX CFLAGS CXXFLAGS CPPFLAGS LDFLAGS
targets="x86_64 i686 aarch64"
'''
setup = '''
for a in $targets; do
    t=$a-w64-mingw32
    cmake -S compiler-rt -B build-$a -G Ninja \
        -DCMAKE_BUILD_TYPE=Release -DCMAKE_SYSTEM_NAME=Windows \
        -DCMAKE_INSTALL_PREFIX=/usr/lib/clang/23 \
        -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
        -DCMAKE_C_COMPILER=clang -DCMAKE_AR=/usr/bin/llvm-ar -DCMAKE_NM=/usr/bin/llvm-nm -DCMAKE_RANLIB=/usr/bin/llvm-ranlib \
        -DCMAKE_SYSROOT=/usr/$t -DCMAKE_ASM_COMPILER_TARGET=$t -DCMAKE_C_COMPILER_TARGET=$t -DCMAKE_CXX_COMPILER_TARGET=$t \
        -DCOMPILER_RT_DEFAULT_TARGET_ONLY=ON -DCOMPILER_RT_BUILD_BUILTINS=ON \
        -DCOMPILER_RT_BUILD_LIBFUZZER=OFF -DCOMPILER_RT_BUILD_MEMPROF=OFF -DCOMPILER_RT_BUILD_PROFILE=OFF \
        -DCOMPILER_RT_BUILD_SANITIZERS=OFF -DCOMPILER_RT_BUILD_XRAY=OFF -DCOMPILER_RT_BUILD_ORC=OFF
done
'''
build = '''
for a in $targets; do cmake --build build-$a; done
'''
install = '''
for a in $targets; do DESTDIR="$pkgdir" cmake --install build-$a; done
ls "$pkgdir"/usr/lib/clang/23/lib/windows/libclang_rt.builtins-x86_64.a >/dev/null
install -Dm644 compiler-rt/LICENSE.TXT "$pkgdir/usr/share/licenses/clang-rt-builtins-mingw-w64/LICENSE.TXT"
'''
