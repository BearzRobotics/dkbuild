# Chromium 157, the browser on its own (Electron 42 is Chromium 148; Brave
# follows this one). Port of Chimera Linux's main/chromium (cports is
# BSD-2-Clause, Copyright (c) Chimera Linux contributors): its patches as they
# are, except
#   004-compiler.patch  clang's triple is ours (x86_64-fenriros-linux-musl)
#   rust-tgt.patch      Rust's is upstream's x86_64-unknown-linux-musl (our
#                       Rust is upstream's toolchain), not Chimera's own
# Each patch file says so in its header.
# Where Chimera downloads at build time, the build here is offline:
#   - crubit (the second source; Chromium's Rust<->C++ bindings tool,
#     cc_bindings_from_rs, which Chromium 157 needs) builds with its crates
#     vendored at fetch time (cargodeps, a further source's Cargo.lock). It
#     links rustc itself: rustc-dev. Chimera's patch already turns off
#     rs_bindings_from_cc, which would download Abseil and Protobuf.
#   - gnrt (tools/crates/gnrt, which writes the GN rules for Rust's standard
#     library) builds with its crates vendored: cargolock=tools/crates/gnrt,
#     files/Cargo.lock being the tarball's own (cargodeps would otherwise take
#     the first Cargo.lock it finds, of the many in third_party).
#   - TypeScript 7 for WebUI: our typescript-go (built from source), not
#     Microsoft's prebuilt package that Chimera and Chromium use.
# Not built yet.
name = "chromium"
version = "157.0.8103.38"
release = 1
summary = "Web browser"
license = "BSD-3-Clause"
homepage = "https://www.chromium.org"
archs = ["x86_64"]
patches = ["004-compiler.patch", "008-fstatat64.patch", "009-gdbinit.patch", "016-musl-sandbox.patch", "017-musl-tid-caching.patch", "019-musl-no-execinfo.patch", "020-musl-no-mallinfo.patch", "021-musl-no-res-ninit.patch", "022-no-sandbox-settls.patch", "023-aarch64-no-memtag.patch", "024-pvalloc.patch", "027-temp-failure-retry.patch", "028-yes-musl.patch", "032-dawn-platform-ppc64.patch", "033-perfetto-get-thread-name.patch", "035-breakpad-no-getcontext.patch", "038-misc-fixes.patch", "041-ffmpeg-opus.patch", "042-disable-mei-preload.patch", "999-ppc64le-support.patch", "chromium-141-cssstylesheet-iwyu.patch", "cr133-ffmpeg-no-noh264parse.patch", "cr140-musl-prctl.patch", "cr143-clang-string_view.patch", "cr143-libpng-testonly.patch", "cr143-libsync-__BEGIN_DECLS.patch", "cr145-iwyu-dev_t.patch", "cr145-musl-unfortify-SkDescriptor.patch", "cr146-sanitize-ignore-for-ubsan-feature.patch", "cr146-swiftshader-unfortify-memset-memcpy.patch", "cr146-unfortify-blink-display_item_list.patch", "cr147-simdutf-8.0-base-char.patch", "cr148-rust-1.95-bytemuck.patch", "cr149-rust-toolchain-var.patch", "cr152-unbundle-minizip-undo-unicode.patch", "cr152-unbundle-opus-devtools.patch", "cr153-typescript-break-definitions.patch", "cr153-unbundle-opus-iamf.patch", "cr155-no-python-vendoring.patch", "cr156-unbundle-icu-remoting.patch", "cr157-crubit-fix-rs_bindings_from_cc-breakages.patch", "cr157-ffmpeg-no-agtm.patch", "cr157-unbundle-brotli-pdfium.patch", "dawn-cipd-fuckoff.patch", "disable-dns_config_service.patch", "entry-forward-decl-incomplete-type.patch", "fort3.patch", "ignore-unknown-flags.patch", "libcxx-abi1.patch", "llvm21-client-cert-fix.patch", "llvm22-permission-request.patch", "musl-conditional-tkill.patch", "no-lifetime-dse.patch", "noclanglibs.patch", "node-version-check-fuckoff.patch", "qt6-6.7.patch", "rust-crubit-no-stdcpp.patch", "rust-tgt.patch", "sanitizer-no-death-callback.patch", "silence-noapikeys.patch", "skcolor-fromstring.patch", "system-ffmpeg-include.patch", "terminal-fdset.patch", "thirdparty-tests-fuckoff.patch", "v8-safe-libcxx.patch"]
hostdeps = ["bash", "bison", "bindgen", "esbuild", "findutils", "git", "gn", "go", "gperf", "hwdata", "ninja", "nodejs",
            "perl", "pkgconf", "python", "rust", "rust-src", "rustc-dev", "typescript-go"]
builddeps = ["alsa-lib-devel", "brotli-devel", "bzip2-devel", "cairo-devel", "cups-devel", "curl-devel", "dav1d-devel",
             "double-conversion-devel", "elfutils-devel", "eudev-devel", "ffmpeg-devel", "flac-devel", "fontconfig-devel",
             "freetype-devel", "glib-devel", "gtk4-devel", "harfbuzz-devel", "heimdal-devel", "highway-devel", "lcms2-devel",
             "libaom-devel", "libavif-devel", "libcap-devel", "libdrm-devel", "libevdev-devel", "libevent-devel",
             "libexif-devel", "libffi-devel", "libgcrypt-devel", "libjpeg-turbo-devel", "libmtp-devel", "libpng-devel",
             "libpulse-devel", "libsecret-devel", "libucontext-devel", "libusb-devel", "libva-devel", "libwebp-devel",
             "libxcomposite-devel", "libxcursor-devel", "libxdamage-devel", "libxi-devel", "libxml2-devel",
             "libxrandr-devel", "libxscrnsaver-devel", "libxshmfence-devel", "libxslt-devel", "linux-headers",
             "llvm-devel", "mesa-devel", "minizip-devel", "musl-bsd-headers", "nss-devel", "openssl-devel", "opus-devel",
             "pciutils-devel", "pipewire-devel", "qt6-qtbase-devel", "snappy-devel", "speex-devel", "sqlite-devel",
             "xcbproto", "zlib-ng-compat-devel", "zstd-devel"]
rundeps = ["hwdata", "xdg-utils"]
options = ["!check", "jobs:12", "cargodeps", "cargolock=tools/crates/gnrt"]

source = [
    { url = "https://github.com/chromium-linux-tarballs/chromium-tarballs/releases/download/157.0.8103.38/chromium-157.0.8103.38-linux.tar.xz", sha256 = "29904f34e47900e96b595e744a91ed23afc5f3060bf0e9f65817a043957ce7ad" },
    { url = "https://github.com/google/crubit/archive/40fbac34597084a0863256d633889eac2c23b91b/crubit-40fbac34597084a0863256d633889eac2c23b91b.tar.gz", sha256 = "07b57fedcffc8c1e8df4875fc314c2290c8cd50ab8d04340b12c945e9c331f5a" },
]

environment = '''
export RUSTC_BOOTSTRAP=1 CARGO_NET_OFFLINE=true
# Chimera's: no stack clash protection (hardening !scp), less warning noise;
# no debug information (symbol_level=0 below; Chimera keeps level 1)
export CFLAGS="${CFLAGS/-g/}"
export CFLAGS="${CFLAGS/-fstack-clash-protection} -Wno-unknown-warning-option -Wno-builtin-macro-redefined -Wno-deprecated-declarations -Wno-sign-compare -Wno-shorten-64-to-32"
export CXXFLAGS="${CXXFLAGS/-g/}"
export CXXFLAGS="${CXXFLAGS/-fstack-clash-protection} -Wno-unknown-warning-option -Wno-builtin-macro-redefined -Wno-deprecated-declarations -Wno-sign-compare -Wno-shorten-64-to-32"
'''

setup = '''
# System tools where the build expects its downloaded ones (Chimera's post_patch).
mkdir -p third_party/node/linux/node-linux-x64/bin third_party/gperf/cipd/bin \
         third_party/dawn/tools/golang/linux-unknown/bin buildtools/linux64-format
ln -sf /usr/bin/node third_party/node/linux/node-linux-x64/bin/node
ln -sf /usr/bin/gperf third_party/gperf/cipd/bin/gperf
ln -sf /usr/bin/go third_party/dawn/tools/golang/linux-unknown/bin/go
rm -f buildtools/linux64-format/clang-format
ln -s /usr/bin/clang-format buildtools/linux64-format/clang-format
rm -rf third_party/devtools-frontend/src/third_party/esbuild/esbuild third_party/devtools-frontend/src/node_modules/esbuild
ln -s /usr/bin/esbuild third_party/devtools-frontend/src/third_party/esbuild/esbuild
ln -s /usr/lib/node_modules/esbuild third_party/devtools-frontend/src/node_modules/esbuild

# TypeScript 7: our typescript-go in the place of Microsoft's package (tsc and
# the lib files beside it, copied: tsc reads the lib files next to its real
# path), with Chromium's patch to lib.dom.d.ts (its 3pp/patches).
ts=third_party/typescript/linux-amd64
rm -rf $ts/src
mkdir -p $ts/src/lib
cp -a /usr/lib/typescript-go/. $ts/src/lib/
for p in $ts/3pp/patches/*.patch; do patch -d $ts/src -p1 < "$p"; done

# Rust: the system toolchain where Chromium's own is expected.
mkdir -p third_party/rust-toolchain/bin third_party/rust-toolchain/lib
for t in cargo rustc rustfmt; do ln -sf /usr/bin/$t third_party/rust-toolchain/bin/$t; done
ln -sfn /usr/lib/rustlib third_party/rust-toolchain/lib/rustlib
rustc -V > third_party/rust-toolchain/VERSION
cp third_party/rust-toolchain/VERSION third_party/rust-toolchain/INSTALLED_VERSION
grep -qx x86_64-unknown-linux-musl build/rust/known-target-triples.txt ||
    echo x86_64-unknown-linux-musl >> build/rust/known-target-triples.txt

# crubit: the second source (/build/crubit-<rev>, its crates laid in as
# vendor/) where build_crubit.py expects its checkout. The script runs cargo
# from here with CARGO_HOME=<out-dir>/target/cargo_home, so crubit's own
# .cargo/config.toml (the vendored sources) is not found from here: a copy
# goes into that CARGO_HOME with the vendor directory as an absolute path.
mv ../crubit-40fbac34597084a0863256d633889eac2c23b91b crubit
mkdir -p third_party/rust-toolchain-intermediate out/crubit/target/cargo_home
ln -sfn ../../crubit third_party/rust-toolchain-intermediate/crubit
sed "s|^directory = \\"vendor\\"|directory = \\"$PWD/crubit/vendor\\"|" crubit/.cargo/config.toml \
    > out/crubit/target/cargo_home/config.toml
grep -q "$PWD/crubit/vendor" out/crubit/target/cargo_home/config.toml
# crubit's binaries link rustc's librustc_driver (rustc-dev): a dynamic
# link, so not musl's static default.
RUSTFLAGS="-Ctarget-feature=-crt-static" LD=clang \
    python3 tools/rust/build_crubit.py --skip-checkout --out-dir out/crubit
mkdir -p third_party/rust-toolchain/lib/third_party
[ -e third_party/rust-toolchain/lib/third_party/crubit ] ||
    ln -s ../../../../crubit third_party/rust-toolchain/lib/third_party/crubit

# gnrt, then the GN rules for the system Rust's standard library (rust-src)
(cd tools/crates/gnrt && cargo build --locked --offline --release)
./tools/crates/gnrt/target/release/gnrt gen --for-std third_party/rust-toolchain/lib/rustlib/src/rust

# System libraries (Chimera's list): their bundled copies removed, GN pointed
# at the system's.
cp $pkgfiles/unbundle.sh $pkgfiles/pp-data.sh .
unbundle="brotli dav1d double-conversion ffmpeg flac fontconfig freetype harfbuzz highway libjpeg libpng libsecret libusb libwebp libxml libxslt opus zlib zstd"
for l in $unbundle libjpeg_turbo; do sh ./unbundle.sh $l; done
python3 build/linux/unbundle/replace_gn_files.py --system-libraries $unbundle
python3 third_party/libaddressinput/chromium/tools/update-strings.py

gn gen out/Release --args='
    custom_toolchain="//build/toolchain/linux/unbundle:default"
    host_toolchain="//build/toolchain/linux/unbundle:default"
    blink_enable_generated_code_formatting=false chrome_pgo_phase=0
    clang_base_path="/usr" clang_use_chrome_plugins=false
    disable_fieldtrial_testing_config=true enable_hangout_services_extension=true
    enable_rust=true enable_stripping=false enable_vr=false fatal_linker_warnings=false
    ffmpeg_branding="Chrome" gtk_version=4 host_pkg_config="/usr/bin/pkg-config"
    icu_use_data_file=false is_clang=true is_component_ffmpeg=true is_debug=false
    is_official_build=true link_pulseaudio=true moc_qt6_path="/usr/lib/qt6/libexec"
    proprietary_codecs=true regenerate_x11_protos=true rtc_link_pipewire=true rtc_use_pipewire=true
    rust_bindgen_root="/usr" rustc_version="0" symbol_level=0 treat_warnings_as_errors=false
    safe_browsing_use_unrar=false v8_use_metagen=false use_clang_modules=false
    use_custom_libcxx=false use_dwarf5=true use_lld=true use_pulseaudio=true use_qt5=false use_qt6=true
    use_sysroot=false use_system_freetype=true use_system_harfbuzz=true use_system_lcms2=true
    use_system_libffi=true use_system_libjpeg=true use_system_zlib=true
    target_cpu="x64" use_vaapi=true is_cfi=false use_thin_lto=false
'
'''
build = '''
CCACHE_SLOPPINESS=include_file_mtime \
    ninja -C out/Release -j $jobs chrome chrome_sandbox chromedriver.unstripped chrome_crashpad_handler
'''
install = '''
s=out/Release d="$pkgdir/usr/lib/chromium"
install -Dm755 $s/chrome "$d/chromium"
install -m755 $s/chrome_crashpad_handler "$d/"
install -m755 $s/chromedriver.unstripped "$d/chromedriver"
install -m4755 $s/chrome_sandbox "$d/chrome-sandbox"
for f in libEGL.so libGLESv2.so libqt6_shim.so libvulkan.so.1 libvk_swiftshader.so; do install -m755 $s/$f "$d/"; done
install -m644 $s/vk_swiftshader_icd.json $s/*.bin $s/*.pak "$d/"
install -Dm644 -t "$d/locales" $s/locales/*.pak
for z in 24 48 64 128 256; do
    install -Dm644 chrome/app/theme/chromium/product_logo_$z.png "$pkgdir/usr/share/icons/hicolor/${z}x$z/apps/chromium.png"
done
for z in 16 32; do
    install -Dm644 chrome/app/theme/default_100_percent/chromium/product_logo_$z.png "$pkgdir/usr/share/icons/hicolor/${z}x$z/apps/chromium.png"
done
install -m755 $pkgfiles/chromium-launcher.sh "$d/"
install -Dm644 $pkgfiles/chromium.conf "$pkgdir/etc/chromium/chromium.conf"
mkdir -p "$pkgdir/usr/bin"
ln -s ../lib/chromium/chromium-launcher.sh "$pkgdir/usr/bin/chromium-browser"
ln -s ../lib/chromium/chromedriver "$pkgdir/usr/bin/chromedriver"
ln -s chromium-browser "$pkgdir/usr/bin/chromium"
# desktop file, appdata and man page from Chromium's templates
sh ./pp-data.sh
install -Dm644 chromium.desktop "$pkgdir/usr/share/applications/chromium.desktop"
install -Dm644 chromium.appdata.xml "$pkgdir/usr/share/metainfo/chromium.appdata.xml"
install -Dm644 chromium.1 "$pkgdir/usr/share/man/man1/chromium.1"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/chromium/LICENSE"
'''
