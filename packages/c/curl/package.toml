# Imported from Chimera Linux cports: work/cports/main/curl/template.py
# cports is BSD-2-Clause, Copyright (c) Chimera Linux contributors.
# Reviewed by hand; dependency names are Chimera's and resolve from stage 0 until they are recipes.
# r2: HTTP/2 (nghttp2), international hostnames (libidn2), the Public Suffix
# List (libpsl) and sftp/scp (libssh2). Not HTTP/3: ngtcp2/nghttp3 need a QUIC
# TLS stack, a separate decision.
# r3: static libraries too (in curl-static), for fully static programs on musl.
# 2026-11-11: HTTP/3 (ngtcp2, nghttp3), c-ares with HTTPS records, brotli,
# LDAP, as distributions build it (Chimera's options). No GSSAPI: curl dropped
# Heimdal (docs/HISTORY.md) and supports only MIT Kerberos and GNU GSS;
# FenrirOS's Kerberos is Heimdal (Chimera's curl has no GSSAPI either).
name = "curl"
version = "8.23.0"
release = 7
summary = "Command line tool for transferring data with URL syntax"
license = "curl"
homepage = "https://curl.se"
patches = ["optimize.patch"]
hostdeps = ["automake", "pkgconf", "perl", "mandoc", "libtool"]
builddeps = ["openssl-devel", "zlib-ng-compat-devel", "zstd-devel", "brotli-devel", "libpsl-devel", "libidn2-devel", "nghttp2-devel", "nghttp3-devel", "ngtcp2-devel", "c-ares-devel", "libssh2-devel", "openldap-devel"]
checkdeps = ["nghttp2-progs", "python"]
rundeps = ["ca-certificates"]

source = [
    { url = "https://curl.se/download/curl-8.23.0.tar.xz", sha256 = "8dadd7d2536a314f982ad05a651b713f426bf7d02cc2c76cffb9796f2218e6c5" },
]

setup = '''
%configure \
    --with-ssl \
    --with-zlib \
    --with-zstd \
    --with-libpsl \
    --with-libidn2 \
    --with-brotli \
    --with-nghttp2 \
    --with-nghttp3 \
    --with-ngtcp2 \
    --with-libssh2 \
    --without-gssapi \
    --with-ca-bundle=/etc/ssl/certs/ca-certificates.crt \
    --enable-ldap \
    --enable-ares \
    --enable-httpsrr \
    --enable-ipv6 \
    --enable-websockets \
    ac_cv_sizeof_off_t=8
'''
build = '''
%make
'''
check = '''
%make check
'''
install = '''
%make_install
install -Dm644 COPYING "$pkgdir/usr/share/licenses/curl/COPYING"
'''
