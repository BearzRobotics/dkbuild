# Snapshot of https://github.com/dan-savage/Coding-Books at commit 0c28347e, packaged to preserve the collection.
# No repository licence; the books are third-party works under their own terms (see NOTICE).
name = "coding-books"
version = "20220905"
release = 1
summary = "Collection of coding reference PDF books"
license = "custom:coding-books"
homepage = "https://github.com/dan-savage/Coding-Books"
options = ["!check"]

source = [
    { url = "https://github.com/dan-savage/Coding-Books/archive/0c28347e218cafdc2603db842662f5d3b5f5c6df.tar.gz", sha256 = "28b57dfb3c65356e868cb34616f4e6db99661ad8fdfe2b3146b03488757d96f0" },
]

# The whole tree is shipped as it is (nothing split or renamed; file names
# contain spaces).
install = '''
d="$pkgdir/usr/share/coding-books"
install -dm755 "$d"
cp -a . "$d/"
rm -rf "$d/.github"
cat > "$d/NOTICE" <<'EON'
Snapshot of https://github.com/dan-savage/Coding-Books.
The repository has no licence; each book remains under its authors' or
publisher's terms and is kept here for reference and preservation.
EON
install -Dm644 "$d/NOTICE" "$pkgdir/usr/share/licenses/coding-books/NOTICE"
'''
