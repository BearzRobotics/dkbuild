# Yasm: the modular assembler (x86 and AMD64, NASM and GAS syntaxes) that older
# multimedia code (libvpx, x264, ffmpeg's older asm, ...) still asks for.
# Upstream is finished (1.3.0 is from 2014), so it needs the small fixes below.
name = "yasm"
version = "1.3.0"
release = 1
summary = "Modular assembler with NASM and GAS syntax"
license = "BSD-2-Clause AND BSD-3-Clause AND Artistic-1.0"
homepage = "https://yasm.tortall.net"
hostdeps = ["automake"]
options = ["!check"]

source = [
    { url = "https://www.tortall.net/projects/yasm/releases/yasm-1.3.0.tar.gz", sha256 = "3dce6601b495f5b3d45b59f7d2492a340ee7e84b5beca17e48f862502bd5603f" },
]

setup = '''
# the 2014 config.sub/config.guess do not know the musl triple this system is
# built with: take automake's current copies
for f in config.sub config.guess; do
    cp -f /usr/share/automake-*/$f config/$f
done
# --disable-python: the Python bindings need Cython and nothing uses them;
# --disable-nls: the translations are not worth a gettext build dependency
%configure --disable-python --disable-nls
'''
build = '''
%make
'''
install = '''
%make_install
install -Dm644 COPYING "$pkgdir/usr/share/licenses/yasm/COPYING"
install -Dm644 BSD.txt "$pkgdir/usr/share/licenses/yasm/BSD.txt"
install -Dm644 Artistic.txt "$pkgdir/usr/share/licenses/yasm/Artistic.txt"
'''
