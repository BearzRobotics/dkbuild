# Ported to dkbuild: the rav1e encoder and its C library (cargo-c); crates vendored on the host. needed by: ffmpeg, libavif.
# Imported from Chimera Linux cports: /tmp/claude-1000/-stuff-git-dkbuild/d8b7a1e7-c48c-4fe9-b3a3-e71798cac65d/scratchpad/cports-full/main/rav1e/template.py
