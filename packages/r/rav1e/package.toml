name = "rav1e"
version = "0.8.1"
release = 2
summary = "AV1 encoder"
license = "BSD-2-Clause"
homepage = "https://github.com/xiph/rav1e"
hostdeps = ["rust", "cargo-c", "nasm", "pkgconf"]
builddeps = []
options = ["!check", "cargodeps"]

source = [
    { url = "https://github.com/xiph/rav1e/archive/refs/tags/v0.8.1.tar.gz", sha256 = "06d1523955fb6ed9cf9992eace772121067cca7e8926988a1ee16492febbe01e" },
]

environment = '''
export CARGO_HOME=/tmp/cargo-home CARGO_NET_OFFLINE=true
export RUSTFLAGS="-C target-feature=-crt-static"
'''
build = '''
F="--no-default-features --features=binaries,asm,threading,signal_support"
cargo build --release --frozen --offline -j $jobs $F
cargo cbuild --release --frozen --offline -j $jobs --prefix=/usr --libdir=/usr/lib $F
'''
install = '''
F="--no-default-features --features=binaries,asm,threading,signal_support"
cargo cinstall --release --frozen --offline --prefix=/usr --libdir=/usr/lib --destdir="$pkgdir" $F
install -Dm755 target/release/rav1e "$pkgdir/usr/bin/rav1e"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/rav1e/LICENSE"
'''
