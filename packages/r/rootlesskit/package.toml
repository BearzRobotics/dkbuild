# RootlessKit: a fake root (user namespaces, port forwarding) for rootless
# containers; rootless Docker (dockerd-rootless) runs under it. Go modules
# from the store (godeps). Based on Chimera Linux cports (BSD-2-Clause):
# user/rootlesskit.
name = "rootlesskit"
version = "3.3.0"
release = 1
summary = "Fake root for rootless containers"
license = "Apache-2.0"
homepage = "https://github.com/rootless-containers/rootlesskit"
hostdeps = ["go"]
rundeps = ["util-linux", "slirp4netns"]
options = ["!check", "godeps"]

source = [
    { url = "https://github.com/rootless-containers/rootlesskit/archive/refs/tags/v3.3.0.tar.gz", sha256 = "cd2045db33fe8900ac100eb85eaea3c24d3afcf950a82d76c3db7ab3f47dc441" },
]

build = '''
mkdir -p build
go build -trimpath -buildmode=pie -o build/ \
    -ldflags "-X github.com/rootless-containers/rootlesskit/v3/pkg/version.Version=$version" ./cmd/...
'''
install = '''
for b in build/*; do install -Dm755 "$b" "$pkgdir/usr/bin/$(basename "$b")"; done
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/rootlesskit/LICENSE"
'''
