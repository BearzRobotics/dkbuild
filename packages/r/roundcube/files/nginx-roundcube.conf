# Roundcube under nginx with php-fpm (/run/php-fpm.sock): only public_html/ is
# served (static.php hands out skins and plugin assets). Copy to
# /etc/nginx/http.d/roundcube.conf, set server_name and TLS, and add nginx's
# user to the _php group.
server {
    listen 80;
    server_name mail.example.org;
    root /usr/share/roundcube/public_html;
    index index.php;
    client_max_body_size 25m;
    location / { try_files $uri $uri/ /index.php$is_args$args; }
    location ~ \.php(/|$) {
        fastcgi_pass unix:/run/php-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}
