# The compiler's own crates (rustc_driver, rustc_middle, ...) as rlibs, for
# programs that link rustc itself (#![feature(rustc_private)]): Chromium's
# crubit (cc_bindings_from_rs), clippy-like tools. Upstream's rustc-dev
# component for the same release as `rust` (keep the versions equal: the rlibs
# must match that rustc's librustc_driver exactly). Its own package because it
# is 825 MB unpacked and only these few builds need it; no file overlaps
# rust's. Chimera ships it inside rust.
name = "rustc-dev"
version = "1.99.1"
release = 1
summary = "Rust compiler crates for tools that link rustc (rustc_private)"
license = "MIT OR Apache-2.0"
homepage = "https://www.rust-lang.org"
archs = ["x86_64"]
rundeps = ["rust"]
options = ["!check", "!strip"]

source = [
    { url = "https://static.rust-lang.org/dist/rustc-dev-1.99.1-x86_64-unknown-linux-musl.tar.xz", sha256 = "7a4210161823ab6821e53dc94d25baa0df8d31be7ce142d76dc26b67beea934b" },
]

install = '''
sh install.sh --prefix=/usr --destdir="$pkgdir" --disable-ldconfig
rm -f "$pkgdir/usr/lib/rustlib/uninstall.sh" "$pkgdir/usr/lib/rustlib/install.log" \
      "$pkgdir/usr/lib/rustlib/components" "$pkgdir/usr/lib/rustlib/rust-installer-version"
install -Dm644 LICENSE-MIT "$pkgdir/usr/share/licenses/rustc-dev/LICENSE-MIT"
install -Dm644 LICENSE-APACHE "$pkgdir/usr/share/licenses/rustc-dev/LICENSE-APACHE"
'''
