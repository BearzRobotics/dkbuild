# Rust's standard library for WebAssembly: wasm32-unknown-unknown (Brave
# compiles Rust to it; wasm-pack and wasm-bindgen projects), and the WASI
# targets wasip1, wasip1-threads and wasip2 (WASI's libc is inside their
# rust-std). Upstream's rust-std components for the same release as `rust`
# (keep the versions equal), as Chimera's rust-wasm subpackage. They link
# with rust-lld, which rust ships.
name = "rust-wasm"
version = "1.99.1"
release = 1
summary = "Rust standard library for WebAssembly targets"
license = "MIT OR Apache-2.0"
homepage = "https://www.rust-lang.org"
archs = ["x86_64"]
rundeps = ["rust"]
options = ["!check", "!strip"]

source = [
    { url = "https://static.rust-lang.org/dist/rust-std-1.99.1-wasm32-unknown-unknown.tar.xz", sha256 = "5f628f857dd00a8aa3fcac2e275665d2782066a5795274ed124c5b560f46423c" },
    { url = "https://static.rust-lang.org/dist/rust-std-1.99.1-wasm32-wasip1.tar.xz", sha256 = "d498fbff3fd032f2f5fabc299e5cbf7bc9d64abac6e389fc1a315b69821b48c4" },
    { url = "https://static.rust-lang.org/dist/rust-std-1.99.1-wasm32-wasip1-threads.tar.xz", sha256 = "5d44556bbae559fd029f207c8c2140b63ed70f0aa29f08be1bf42bed1bf7f716" },
    { url = "https://static.rust-lang.org/dist/rust-std-1.99.1-wasm32-wasip2.tar.xz", sha256 = "15d54cff9ce112ab273cf7e214600108754d51100ce7d6bd62a354f16c93b4f3" },
]

install = '''
for t in wasm32-unknown-unknown wasm32-wasip1 wasm32-wasip1-threads wasm32-wasip2; do
    sh /build/rust-std-$version-$t/install.sh --prefix=/usr --destdir="$pkgdir" --disable-ldconfig
done
# the installer's bookkeeping, which rust's own package has
rm -f "$pkgdir/usr/lib/rustlib/uninstall.sh" "$pkgdir/usr/lib/rustlib/install.log" \
      "$pkgdir/usr/lib/rustlib/components" "$pkgdir/usr/lib/rustlib/rust-installer-version"
install -Dm644 LICENSE-MIT "$pkgdir/usr/share/licenses/rust-wasm/LICENSE-MIT"
install -Dm644 LICENSE-APACHE "$pkgdir/usr/share/licenses/rust-wasm/LICENSE-APACHE"
'''
