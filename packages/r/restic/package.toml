# restic: fast, encrypted, deduplicating backup program (Go). Go modules from
# the shared module cache (godeps); CGO off, as upstream's build.go does for its
# releases. Built with the default tags (upstream's build.go adds none beyond
# the optional selfupdate, which is left out: the package manager updates it).
# The version string is set the way build.go does (main.version). Man pages and
# shell completions are generated by restic itself.
name = "restic"
version = "0.19.1"
release = 1
summary = "Fast, secure, efficient backup program"
license = "BSD-2-Clause"
homepage = "https://restic.net"
hostdeps = ["go"]
options = ["!check", "godeps"]

source = [
    { url = "https://github.com/restic/restic/archive/refs/tags/v0.19.1.tar.gz", sha256 = "bb9b1a19040744d26d8a79be029d4e6b189c45ccc9d8831d7fe367d3c33df725" },
]

environment = '''
export GOTOOLCHAIN=local GOFLAGS="-mod=mod -trimpath -buildvcs=false" GOCACHE=/tmp/go-cache GOPATH=/tmp/go CGO_ENABLED=0
'''
build = '''
go build -ldflags "-s -w -X main.version=$version" -o restic ./cmd/restic
mkdir -p gen/man
./restic generate --man gen/man --bash-completion gen/restic.bash --zsh-completion gen/_restic --fish-completion gen/restic.fish
'''
install = '''
install -Dm755 restic "$pkgdir/usr/bin/restic"
for m in gen/man/*.1; do install -Dm644 "$m" "$pkgdir/usr/share/man/man1/$(basename "$m")"; done
install -Dm644 gen/restic.bash "$pkgdir/usr/share/bash-completion/completions/restic"
install -Dm644 gen/_restic "$pkgdir/usr/share/zsh/site-functions/_restic"
install -Dm644 gen/restic.fish "$pkgdir/usr/share/fish/vendor_completions.d/restic.fish"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/restic/LICENSE"
'''
