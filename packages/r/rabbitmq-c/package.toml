# After Chimera Linux cports: main/rabbitmq-c. cports is BSD-2-Clause, Copyright (c) Chimera Linux contributors.
# RabbitMQ AMQP 0-9-1 client library, librabbitmq (FFmpeg --enable-librabbitmq).
# One build makes shared and static libraries (BUILD_STATIC_LIBS), with TLS
# from OpenSSL and the command line tools (they need popt). Not built: the
# tools' man pages (xmlto/DocBook) and the Doxygen API docs.
name = "rabbitmq-c"
version = "0.15.0"
release = 1
summary = "RabbitMQ C client"
license = "MIT"
homepage = "https://github.com/alanxz/rabbitmq-c"
hostdeps = ["cmake", "ninja", "pkgconf"]
builddeps = ["openssl-devel", "popt-devel"]

source = [
    { url = "https://github.com/alanxz/rabbitmq-c/archive/refs/tags/v0.15.0.tar.gz", sha256 = "7b652df52c0de4d19ca36c798ed81378cba7a03a0f0c5d498881ae2d79b241c2" },
]

setup = '''
%cmake \
    -DBUILD_SHARED_LIBS=ON \
    -DBUILD_STATIC_LIBS=ON \
    -DENABLE_SSL_SUPPORT=ON \
    -DBUILD_TOOLS=ON \
    -DBUILD_TESTING=ON
'''
build = '''
%cmake_build
'''
check = '''
ctest --test-dir build
'''
install = '''
%cmake_install
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/rabbitmq-c/LICENSE"
'''
