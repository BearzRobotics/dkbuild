# Active Directory data collector for BloodHound community edition (v5). (BlackArch list, requested 2026-11-16; docs/requests.md). Written from the template of bashrs; not built yet when written (wip/queue): expect first-build fixes.
# Rust crate (binaries: rusthound-ce), crates vendored on the host (cargodeps).
name = "rusthound-ce"
version = "2.5.51"
release = 1
summary = "Active Directory data collector for BloodHound community edition (v5)."
license = "MIT"
homepage = "https://github.com/g0h4n/RustHound-CE"
hostdeps = ["rust", "pkgconf", "cmake"]
options = ["!check", "cargodeps"]

source = [
    { url = "https://github.com/g0h4n/RustHound-CE/archive/refs/tags/v2.5.51.tar.gz", sha256 = "f3dffa9becf68255b9ed94b0896b686f197c853c05b67d82bfd718ef22eabbb2" },
]

environment = '''
export CARGO_HOME=/tmp/cargo-home CARGO_NET_OFFLINE=true
'''
build = '''
cargo build --release --frozen --offline --locked -j $jobs
'''
install = '''
install -Dm755 target/release/rusthound-ce "$pkgdir/usr/bin/rusthound-ce"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/rusthound-ce/LICENSE"
'''
