name = "readline"
version = "8.3"
release = 1
summary = "GNU Readline library"
license = "GPL-3.0-or-later"
homepage = "https://tiswww.cwru.edu/php/chet/readline/rltop.html"
patches = ["no-rpath-and-link.patch", "nullptr.patch", "shlib.patch"]
hostdeps = ["pkgconf"]
builddeps = ["ncurses-devel"]

source = [
    { url = "https://ftpmirror.gnu.org/gnu/readline/readline-8.3.tar.gz", sha256 = "fe5383204467828cd495ee8d1d3c037a7eba1389c22bc6a041f627976f9061cc" },
]

setup = '''
%configure \
    --disable-static \
    --enable-multibyte \
    --with-curses \
    bash_cv_termcap_lib=libncursesw
'''
build = '''
%make
'''
check = '''
%make check
'''
install = '''
%make_install
rm -rf "$pkgdir/usr/share/doc"
'''
