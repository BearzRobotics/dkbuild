name = "rpcbind"
version = "1.2.7"
release = 2
summary = "Universal addresses to RPC program number mapper"
license = "BSD-3-Clause"
homepage = "https://linux-nfs.org"
hostdeps = ["automake", "pkgconf"]
builddeps = ["libtirpc-devel"]
options = ["!check"]

source = [
    { url = "https://sourceforge.net/projects/rpcbind/files/rpcbind/1.2.7/rpcbind-1.2.7.tar.bz2", sha256 = "f6edf8cdf562aedd5d53b8bf93962d61623292bfc4d47eedd3f427d84d06f37e" },
]

setup = '''
autoreconf -if -W none
%configure \
    --enable-warmstarts \
    --with-rpcuser=_rpc \
    --with-statedir=/var/lib/rpcbind \
    --with-systemdsystemunitdir=no
'''
build = '''
%make
'''
install = '''
%make_install
install -Dm644 COPYING "$pkgdir/usr/share/licenses/rpcbind/COPYING"
install -Dm644 $pkgfiles/rpcbind "$pkgdir/etc/dinit.d/rpcbind"
'''
