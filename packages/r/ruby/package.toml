name = "ruby"
version = "3.4.12"
release = 1
summary = "Ruby scripting language"
license = "Ruby OR BSD-2-Clause"
homepage = "https://www.ruby-lang.org/en"
patches = ["align-builtin-binaries-ibf_header.patch", "fix-riscv64-build.patch", "musl-fix-get_main_stack.patch", "ppc-no-setjmp.patch", "rubygems-avoid-platform-specific-gems.patch", "test_insns-lower-recursion-depth.patch"]
hostdeps = ["automake", "bison", "flex", "mandoc", "pkgconf"]
builddeps = ["libedit-devel", "libffi-devel", "libyaml-devel", "openssl-devel", "zlib-ng-compat-devel"]
options = ["!cross", "!check"]

source = [
    { url = "https://cache.ruby-lang.org/pub/ruby/3.4/ruby-3.4.12.tar.xz", sha256 = "db6c147940d7ad0b706823d42c8e6713c36dec70a1f83f635f1d3a7f0599ec90" },
]

setup = '''
autoreconf -if -W none
%configure \
    --enable-shared \
    --disable-rpath \
    --disable-install-doc \
    ac_cv_func_isnan=yes \
    ac_cv_func_isinf=yes
'''
build = '''
%make \
    all \
    capi
'''
install = '''
%make_install
install -Dm644 COPYING "$pkgdir/usr/share/licenses/ruby/COPYING"
'''
