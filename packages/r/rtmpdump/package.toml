environment = '''
export CFLAGS="${CFLAGS} -D__LINUX_NETFILTER_H -DOPENSSL_API_COMPAT=0x10100000L -Wno-unused-const-variable -Wno-deprecated-declarations"
'''
build = '''
make CC="$CC" OPT="$CFLAGS" XLDFLAGS="$LDFLAGS $CFLAGS" CRYPTO=OPENSSL -j$jobs
'''
