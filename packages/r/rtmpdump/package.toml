name = "rtmpdump"
version = "2.4.20210219"
release = 4
summary = "Toolkit for RTMP streams"
license = "GPL-2.0-or-later"
homepage = "https://rtmpdump.mplayerhq.hu"
patches = ["fix-chunk-size.patch", "fix-version.patch", "librtmp-dh.h.patch", "librtmp-handshake.h.patch", "librtmp-hashswf.c.patch"]
hostdeps = ["pkgconf"]
builddeps = ["zlib-ng-compat-devel", "openssl-devel", "linux-headers"]
options = ["!check"]

