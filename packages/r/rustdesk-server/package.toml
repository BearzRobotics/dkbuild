# The self-hosted RustDesk server: hbbs (ID/rendezvous) and hbbr (relay),
# as services. The RustDesk desktop client is Flutter (glibc-only SDK); see
# wip/README.md.
name = "rustdesk-server"
version = "1.1.16"
release = 1
summary = "RustDesk ID and relay server (hbbs, hbbr)"
license = "AGPL-3.0-only"
homepage = "https://github.com/rustdesk/rustdesk-server"
hostdeps = ["rust"]
options = ["!check", "cargodeps"]

source = [
    { url = "https://github.com/rustdesk/rustdesk-server/archive/refs/tags/1.1.16.tar.gz", sha256 = "846379e1555396ba8c8f26edbfbfb7f36618ef3e5d658b6022ed24617cf7edfa" },
]

environment = '''
export CARGO_HOME=/tmp/cargo-home CARGO_NET_OFFLINE=true
'''
build = '''
cargo build --release --frozen --offline -j $jobs
'''
install = '''
install -Dm755 target/release/hbbs "$pkgdir/usr/bin/hbbs"
install -Dm755 target/release/hbbr "$pkgdir/usr/bin/hbbr"
for s in hbbs hbbr; do install -Dm644 $pkgfiles/$s "$pkgdir/etc/dinit.d/$s"; done
install -Dm644 $pkgfiles/sysusers.conf "$pkgdir/usr/lib/sysusers.d/rustdesk-server.conf"
install -Dm644 $pkgfiles/tmpfiles.conf "$pkgdir/usr/lib/tmpfiles.d/rustdesk-server.conf"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/rustdesk-server/LICENSE"
'''
