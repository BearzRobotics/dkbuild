# Disassemblers and decompilers (Ghidra, radare2, rizin, Cutter), a hex editor (ImHex), debuggers (gdb with pwndbg, lldb, x64dbg under Wine, valgrind, strace), binary analysis (binwalk, YARA, capstone, elfutils, patchelf, binutils, LLVM), assemblers (nasm, yasm), the Z3 solver, and exploit-development helpers (pwntools, ROPgadget). Wine runs Windows binaries and x64dbg.
# A meta package (2026-11-17, user: "a reverse engineer meta package and some for pen testing too"): it installs the tools, nothing more.
# Tools that are written but not built yet are added when they build; see wip/queue/BLACKARCH-NOTES.md for what is still to come.
name = "reverse-engineering"
version = "1"
release = 1
summary = "Reverse engineering toolset"
license = "MIT"
homepage = "https://github.com/BearzRobotics/dkbuild"
options = ["meta"]
rundeps = [
    "ghidra", "radare2", "rizin", "cutter", "imhex", "binwalk",
    "capstone", "python-unicorn", "gdb", "pwndbg", "lldb", "x64dbg",
    "wine", "valgrind", "strace", "yara", "elfutils", "patchelf",
    "binutils", "llvm", "nasm", "yasm", "z3", "python-capstone6pwndbg",
    "python-ropgadget", "python-pwntools", "file", "hashdeep",
]
