environment = '''
export JAVA_HOME=/usr/lib/jvm/java-25-openjdk
export PATH="$JAVA_HOME/bin:$PATH"
export LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC
export F77=gfortran-15 FC=gfortran-15
export CXXFLAGS="$CXXFLAGS -D__MUSL__"
export LDFLAGS="$LDFLAGS -Wl,-rpath,/usr/lib/gcc15/lib"
'''
setup = '''
# the recommended packages, linked as tools/rsync-recommended does
cp /build/sources/*.tar.gz src/library/Recommended/
(cd src/library/Recommended
for p in MASS lattice Matrix nlme survival boot cluster codetools foreign KernSmooth rpart class nnet spatial mgcv; do
    ln -sf ${p}_*.tar.gz $p.tgz
done)
./configure --prefix=/usr --sysconfdir=/etc/R --localstatedir=/var --mandir=/usr/share/man --libdir=/usr/lib \
    rdocdir=/usr/share/doc/R rincludedir=/usr/include/R rsharedir=/usr/share/R \
    --disable-nls --enable-R-shlib --enable-R-static-lib --enable-java \
    --with-blas="-lopenblas" --with-lapack --with-cairo --with-ICU --with-jpeglib --with-libpng \
    --with-libtiff --with-tcltk --with-x --with-readline
'''
build = '''
make -j$jobs
make -C src/nmath/standalone
'''
install = '''
make install DESTDIR="$pkgdir"
make -C src/nmath/standalone install DESTDIR="$pkgdir"
# the licence texts R installs are in /usr/lib/R/share/licenses
install -Dm644 COPYING "$pkgdir/usr/share/licenses/r-base/COPYING"
'''
