# Adapted from Alpine's community/R. R 4.6.1, the language and environment
# for statistical computing (R, Rscript, libR.so and libR.a, the standalone
# math library libRmath), with the 15 recommended packages (MASS, lattice,
# Matrix, nlme, survival, boot, cluster, codetools, foreign, KernSmooth,
# rpart, class, nnet, spatial, mgcv). The recommended packages are not in the
# R tarball (R's own tools/rsync-recommended fetches them from CRAN at
# build time): they are sources here, checked by sha256, and linked as
# src/library/Recommended/<name>.tgz as that script does, so the build is
# offline.
# Libraries: OpenBLAS for BLAS and LAPACK (OpenBLAS here is built without a
# Fortran compiler, so its LAPACK is the C translation, which R takes as a
# system LAPACK; untested whether it meets R's minimum LAPACK version), ICU,
# PCRE2, readline, curl, zlib, bzip2, xz (liblzma), libdeflate, cairo and pango
# (cairo graphics devices), libjpeg-turbo, libpng, libtiff, Tcl/Tk (tcltk
# package) and X11 (--with-x), Java (--enable-java, JDK from openjdk25) for the
# R Java configuration. libR is a shared library (--enable-R-shlib) and also
# installed static (--enable-R-static-lib).
# Fortran: R's base code needs a Fortran compiler. The tree's only one is GCC's
# gfortran-15 (gcc package, /usr/lib/gcc15); libgfortran and libquadmath are
# found at run time through an rpath to /usr/lib/gcc15/lib. Not enabled:
# --enable-lto (LTO is off in this tree), the PDF and info manuals (no LaTeX
# or makeinfo run; the HTML help and the text help are built), NLS
# (--disable-nls as Alpine, which says R's translations are rarely wanted on
# musl; a stated reason). OpenMP: not available (no libomp configured).
# -D__MUSL__ in CXXFLAGS (Alpine): needed by some packages such as Rcpp
# (https://github.com/RcppCore/Rcpp/issues/448).
name = "r-base"
version = "4.6.1"
release = 1
summary = "Language and environment for statistical computing"
license = "GPL-2.0-only OR GPL-3.0-only"
homepage = "https://www.r-project.org"
archs = ["x86_64", "aarch64"]
hostdeps = ["gcc", "openjdk25", "perl", "make", "pkgconf", "which"]
builddeps = ["bzip2-devel", "cairo-devel", "curl-devel", "icu-devel", "libdeflate-devel", "libjpeg-turbo-devel", "libpng-devel",
             "libtiff-devel", "libx11-devel", "libxmu-devel", "libxt-devel", "openblas-devel", "pango-devel", "pcre2-devel",
             "readline-devel", "tcl-devel", "tk-devel", "xz-devel", "zlib-ng-compat-devel", "linux-headers"]
rundeps = ["gcc", "tzdb", "openblas", "openjdk25", "make"]
options = ["!check", "!lto"]

