# cports is BSD-2-Clause, Copyright (c) Chimera Linux contributors.
name = "rapidjson"
version = "1.1.0"
release = 2
summary = "JSON parser/generator for C++"
license = "MIT"
homepage = "https://rapidjson.org"
patches = ["3b2441b87f99ab65f37b141a7b548ebadb607b96.patch", "862c39be371278a45a88d4d1d75164be57bb7e2d.patch", "char_traits-clang-19-errors.diff", "disable-bad-flags.patch", "no-vendor-gtest.patch"]
hostdeps = ["cmake", "ninja", "pkgconf"]
builddeps = ["gtest-devel"]

source = [
    { url = "https://github.com/Tencent/rapidjson/archive/refs/tags/v1.1.0.tar.gz", sha256 = "bf7ced29704a1e696fbccf2a2b4ea068e7774fa37f6d7dd4039d0787f8bed98e" },
]

environment = '''
export CXXFLAGS="${CXXFLAGS} -Wno-exceptions -Wno-c++98-compat -Wno-c++98-compat-pedantic -Wno-deprecated-declarations -Wno-extra-semi-stmt -Wno-suggest-override -Wno-suggest-destructor-override -Wno-unsafe-buffer-usage -Wno-zero-as-null-pointer-constant"
'''
setup = '''
%cmake \
    -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
    -DGTESTSRC_FOUND=ON \
    -DGTEST_SOURCE_DIR=. \
    -DRAPIDJSON_BUILD_DOC=OFF \
    -DRAPIDJSON_BUILD_EXAMPLES=OFF \
    -DRAPIDJSON_BUILD_CXX11=OFF
'''
build = '''
%cmake_build
'''
install = '''
%cmake_install
install -Dm644 license.txt "$pkgdir/usr/share/licenses/rapidjson/license.txt"
'''
