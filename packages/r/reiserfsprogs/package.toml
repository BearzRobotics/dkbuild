# Written for this tree (cports has no reiserfsprogs). Untested.
# Needed by dkde-parted: mkfs.reiserfs, reiserfsck, resize_reiserfs, reiserfstune.
# The tarball ships a generated configure, so no autoreconf.
# release 1 environment: -D_LARGEFILE64_SOURCE, because debugreiserfs/recover.c calls lseek64, which musl declares only with it
# (glibc declares it by default). Nothing else is changed.
name = "reiserfsprogs"
version = "3.6.27"
release = 7
summary = "ReiserFS (version 3) filesystem utilities"
patches = ["musl-printf.patch"]
license = "GPL-2.0-only"
homepage = "https://www.kernel.org/pub/linux/kernel/people/jeffm/reiserfsprogs/"
hostdeps = ["pkgconf"]
builddeps = ["linux-headers", "util-linux-devel", "musl-obstack-devel"]
options = ["!check"]

source = [
    { url = "https://www.kernel.org/pub/linux/kernel/people/jeffm/reiserfsprogs/v3.6.27/reiserfsprogs-3.6.27.tar.xz", sha256 = "0e95b67fa7746a3c2d59145e9b9c2feb4a6be52853e83b497b182eae508e62e3" },
]

environment = '''
export CFLAGS="${CFLAGS} -D_LARGEFILE64_SOURCE"
export LDFLAGS="${LDFLAGS} -lobstack"
# r7: <libgen.h> as well: musl declares basename() there (POSIX version), not in <string.h> (resize_reiserfs.c:200).
# r6: the compat header also declares what glibc's headers pull in by themselves: _GNU_SOURCE (basename() from <string.h>),
# <sys/mount.h> (mount(), fe.c), and LONG_LONG_MIN/MAX (resize_reiserfs.c; musl has LLONG_*).
# r5: links libobstack (musl-obstack): the library uses glibc's obstack ("undefined symbol: _obstack_begin"), as cronie and elfutils do here.
# r4: patches/musl-printf.patch. reiserfsprogs prints its structures (keys, item heads, block heads)
# through glibc's register_printf_specifier(): the format letters %K %k %H %b %y %M %U are registered
# and then handled inside vfprintf, and <printf.h> does not exist on musl ("'printf.h' file not
# found"). The patch (reiserfscore/prints.c only) removes the include and the registration and
# makes reiserfs_warning(), the one function every message goes through, walk the format itself:
# the seven conversions go to the same handler functions, every standard conversion (with flags,
# width, precision, length) is taken from the argument list by type and printed by fprintf with its
# own one-conversion spec. Syntax-checked with clang; the output is unchanged for glibc's users.
# r3: a third glibc-only name, __compar_fn_t (include/misc.h:248, "unknown type name"), the internal
# spelling of comparison_fn_t; the compat header declares it the same way.
# r2: the code uses two glibc-only types, loff_t (io.c, include/reiserfs_lib.h: "use of
# undeclared identifier 'loff_t'") and comparison_fn_t (misc.c: "unknown type name"; glibc's
# <stdlib.h> typedef for a qsort/bsearch comparison function). musl has neither on
# its default feature set. A compat header, force-included, declares them: loff_t is
# off_t (what glibc and musl's own sys/types.h under _GNU_SOURCE make of it), and
# comparison_fn_t the plain comparison function pointer type. Identical typedef
# redefinitions are legal C11, so nothing breaks if a header does define them.
mkdir -p /tmp/dkcompat
cat > /tmp/dkcompat/reiserfs-compat.h <<'EOF2'
#define _GNU_SOURCE 1
#include <sys/types.h>
#include <stdlib.h>
#include <string.h>
#include <libgen.h>
#include <limits.h>
#include <sys/mount.h>
#ifndef LONG_LONG_MAX
#define LONG_LONG_MAX LLONG_MAX
#define LONG_LONG_MIN LLONG_MIN
#endif
typedef off_t loff_t;
typedef int (*comparison_fn_t)(const void *, const void *);
typedef int (*__compar_fn_t)(const void *, const void *);
EOF2
export CFLAGS="${CFLAGS} -include /tmp/dkcompat/reiserfs-compat.h"
'''
setup = '''
%configure
'''
build = '''
%make
'''
install = '''
%make_install
'''
