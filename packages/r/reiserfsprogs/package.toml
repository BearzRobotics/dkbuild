# Written for this tree (cports has no reiserfsprogs). Untested.
# Needed by dkde-parted: mkfs.reiserfs, reiserfsck, resize_reiserfs, reiserfstune.
# The tarball ships a generated configure, so no autoreconf.
name = "reiserfsprogs"
version = "3.6.27"
release = 1
summary = "ReiserFS (version 3) filesystem utilities"
license = "GPL-2.0-only"
homepage = "https://www.kernel.org/pub/linux/kernel/people/jeffm/reiserfsprogs/"
hostdeps = ["pkgconf"]
builddeps = ["linux-headers", "util-linux-devel"]
options = ["!check"]

source = [
    { url = "https://www.kernel.org/pub/linux/kernel/people/jeffm/reiserfsprogs/v3.6.27/reiserfsprogs-3.6.27.tar.xz", sha256 = "0e95b67fa7746a3c2d59145e9b9c2feb4a6be52853e83b497b182eae508e62e3" },
]

setup = '''
%configure
'''
build = '''
%make
'''
install = '''
%make_install
'''
