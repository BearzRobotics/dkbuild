# RustScan: fast port discovery that hands the open ports to nmap.
name = "rustscan"
version = "2.4.1"
release = 1
summary = "Fast port scanner that pipes results into nmap"
license = "GPL-3.0-or-later"
homepage = "https://github.com/bee-san/RustScan"
hostdeps = ["rust"]
rundeps = ["nmap"]
options = ["!check", "cargodeps"]

source = [
    { url = "https://github.com/bee-san/RustScan/archive/refs/tags/2.4.1.tar.gz", sha256 = "fa99c18a12d4c0939ab69ddb84ef7b85a1ea01d8fc86df227449d89473531765" },
]

environment = '''
export CARGO_HOME=/tmp/cargo-home CARGO_NET_OFFLINE=true
'''
build = '''
cargo build --release --frozen --offline -j $jobs
'''
install = '''
install -Dm755 target/release/rustscan "$pkgdir/usr/bin/rustscan"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/rustscan/LICENSE"
'''
