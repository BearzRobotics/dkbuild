# Imported from Chimera Linux cports: work/cports/main/rsync/template.py
# cports is BSD-2-Clause, Copyright (c) Chimera Linux contributors.
# No ACL/xattr support: acl needs linux-headers, which needs rsync (a cycle).
# r2: xxhash checksums and international hostnames (libidn2).
# needed by: rescue-tools, linux-headers (its headers_install copies with rsync).
# Adding it no longer rebuilds everything: linux-headers comes out identical,
# so early cutoff stops there (SPEC.md 7.2). Dropped from Chimera's recipe:
# shell completions.
# r3: static libraries too (in rsync-static), for fully static programs on musl.
name = "rsync"
version = "3.5.1"
release = 3
summary = "Fast incremental file transfer tool"
license = "GPL-3.0-only"
homepage = "https://rsync.samba.org"
builddeps = ["lz4-devel", "openssl-devel", "popt-devel", "zlib-ng-compat-devel", "zstd-devel", "xxhash-devel", "libidn2-devel"]
options = ["!check"]

source = [
    { url = "https://www.samba.org/ftp/rsync/src/rsync-3.5.1.tar.gz", sha256 = "c55f9c9dc10fb8bec397b399a0fdded53cc9a2d8e30891bb0d63724d25c37bef" },
]

environment = '''
export CFLAGS="${CFLAGS} -DINET6"
'''
setup = '''
%configure \
    --with-rrsync \
    --with-included-popt=no \
    --with-included-zlib=no \
    --disable-md2man \
    --disable-acl-support \
    --disable-xattr-support
'''
build = '''
%make
'''
install = '''
%make_install
install -Dm644 $pkgfiles/rsyncd.conf "$pkgdir/etc/rsyncd.conf"
install -Dm755 $pkgfiles/rsyncd.sh "$pkgdir/usr/lib/rsyncd"
install -Dm755 support/nameconvert "$pkgdir/usr/bin/nameconvert"
install -Dm755 support/json-rsync-version "$pkgdir/usr/bin/json-rsync-version"
install -Dm755 support/rsyncstats "$pkgdir/usr/bin/rsyncstats"
'''
