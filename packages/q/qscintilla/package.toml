# needed by: openscad (its editor).
name = "qscintilla"
version = "2.14.1"
release = 1
summary = "Qt source code editing component (Qt 6)"
license = "GPL-3.0-only"
homepage = "https://www.riverbankcomputing.com/software/qscintilla/"
hostdeps = ["qt6-qtbase"]
builddeps = ["qt6-qtbase-devel"]
options = ["!check"]

source = [
    { url = "https://www.riverbankcomputing.com/static/Downloads/QScintilla/2.14.1/QScintilla_src-2.14.1.tar.gz", sha256 = "dfe13c6acc9d85dfcba76ccc8061e71a223957a6c02f3c343b30a9d43a4cdd4d" },
]

setup = '''
cd src && qmake6 qscintilla.pro
'''
build = '''
cd src && %make
'''
install = '''
cd src && make install INSTALL_ROOT="$pkgdir"
cd .. && install -Dm644 LICENSE "$pkgdir/usr/share/licenses/qscintilla/LICENSE"
'''
