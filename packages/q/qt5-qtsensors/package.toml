# Qt 5 sensors, from KDE's Qt 5.15 branch (qtsensors, invent.kde.org/qt/qt/qtsensors), the snapshot Alpine Linux
# makes of it (dev.alpinelinux.org/archive/qt, commit 50a61b3, 5.15.18_git20250330). After Alpine's
# community/qt5-qtsensors. Qt 5 installs beside Qt 6 (qt5-qtbase's header). qmake builds it against
# qt5-qtbase's mkspec, so the flags are the system's.
# Not built (queued, wip/queue): expect first-build fixes.
name = "qt5-qtsensors"
version = "5.15.18_git20250330"
release = 1
summary = "Qt 5 sensors"
license = "LGPL-2.1-only AND LGPL-3.0-only AND GPL-3.0-only WITH Qt-GPL-exception-1.0"
homepage = "https://www.qt.io"
builddeps = ["qt5-qtbase-devel", "qt5-qtdeclarative-devel"]
options = ["!check", "!cross", "!lto"]

source = [
    { url = "https://dev.alpinelinux.org/archive/qt/qtsensors-50a61b360877e7c1300df76b5aabf8d75554a398.tar.xz", sha256 = "4d228c635a8f18f840f407e600b929549152613199af96f884e70a745f348d86" },
]

setup = '''
qmake-qt5
'''
build = '''
make -j$jobs
'''
install = '''
make INSTALL_ROOT="$pkgdir" install
# the .prl files name the build directory
find "$pkgdir/usr/lib" -type f -name '*.prl' -exec sed -i -e '/^QMAKE_PRL_BUILD_DIR/d' {} +
'''
