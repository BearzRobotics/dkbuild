# r2: libc++ 23 no longer pulls <mutex> in through other headers: the GStreamer plugin uses std::once_flag and std::call_once (qgst_p.h:739, qgstreameraudiooutput.cpp,
# qgstreamermediaplayer.cpp: "no type named 'once_flag' in namespace 'std'"). Not a source edit: <mutex> and the other common standard headers are force-included.
environment = '''
export CXXFLAGS="$CXXFLAGS -include mutex -include algorithm -include memory -include functional -include cstdint -include vector -include string"
'''
setup = '''
%cmake \
    -DQT_BUILD_TESTS=OFF
'''
build = '''
%cmake_build
'''
install = '''
%cmake_install
# disabled above, so no uninstall
rm -rf "$pkgdir/usr/tests"
'''
