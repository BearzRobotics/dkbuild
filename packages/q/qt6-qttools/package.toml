setup = '''
%cmake \
    -DQT_BUILD_TESTS=OFF \
    -DINSTALL_PUBLICBINDIR=usr/bin \
    -DQT_BUILD_SHARED_LIBS=ON \
    -DQT_FEATURE_assistant=ON \
    -DQT_FEATURE_pixeltool=ON \
    -DQT_FEATURE_distancefieldgenerator=ON
'''
build = '''
%cmake_build
'''
install = '''
%cmake_install
# hardlink
rm -rf "$pkgdir/usr/lib/qt6/bin/qtdiag"
