# Qt 5 Quick Controls 2, from KDE's Qt 5.15 branch (qtquickcontrols2, invent.kde.org/qt/qt/qtquickcontrols2), the snapshot Alpine Linux
# makes of it (dev.alpinelinux.org/archive/qt, commit e464888, 5.15.18_git20251101). After Alpine's
# community/qt5-qtquickcontrols2. Qt 5 installs beside Qt 6 (qt5-qtbase's header). qmake builds it against
# qt5-qtbase's mkspec, so the flags are the system's.
# Not built (queued, wip/queue): expect first-build fixes.
name = "qt5-qtquickcontrols2"
version = "5.15.18_git20251101"
release = 1
summary = "Qt 5 Quick Controls 2"
license = "LGPL-2.1-only AND LGPL-3.0-only AND GPL-3.0-only WITH Qt-GPL-exception-1.0"
homepage = "https://www.qt.io"
builddeps = ["qt5-qtbase-devel", "qt5-qtdeclarative-devel"]
options = ["!check", "!cross", "!lto"]

source = [
    { url = "https://dev.alpinelinux.org/archive/qt/qtquickcontrols2-e464888c53a641ee44a34ff2350cfb156c8ed59f.tar.xz", sha256 = "6eaf6f0958e56610df5bde742f88e78aceb96960aed3af20326339962eb102de" },
]

setup = '''
qmake-qt5
'''
build = '''
make -j$jobs
'''
install = '''
make INSTALL_ROOT="$pkgdir" install
# the .prl files name the build directory
find "$pkgdir/usr/lib" -type f -name '*.prl' -exec sed -i -e '/^QMAKE_PRL_BUILD_DIR/d' {} +
'''
