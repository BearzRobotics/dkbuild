name = "qt6-qtquick3d"
version = "6.12.0"
release = 1
summary = "Qt6 Quick 3D component"
license = "LGPL-3.0-only OR GPL-2.0-only OR GPL-3.0-only"
homepage = "https://www.qt.io"
hostdeps = ["cmake", "ninja", "pkgconf"]
builddeps = ["qt6-qtbase-devel", "qt6-qtdeclarative-devel", "qt6-qtshadertools-devel"]
options = ["!check", "!cross"]

source = [
    { url = "https://download.qt.io/official_releases/qt/6.12/6.12.0/submodules/qtquick3d-everywhere-src-6.12.0.tar.xz", sha256 = "6ced6edbd25fb5a632fe770ae820b376bf50233e8d62002c79a69a505a2e429e" },
]

setup = '''
%cmake
'''
