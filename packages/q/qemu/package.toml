# cports is BSD-2-Clause, Copyright (c) Chimera Linux contributors.
# r2 (2026-11-17, user): split by architecture, like Alpine and Debian. `qemu` keeps what every emulator shares: qemu-img, qemu-nbd,
# qemu-ga, qemu-storage-daemon, the helpers, the block/ui/audio modules and the firmware that is not tied to one architecture
# (PCI option ROMs, keymaps). Each qemu-system-<arch> package has that architecture's emulator(s) and its own firmware:
#   qemu-system-x86 (i386, x86_64)   qemu-system-arm (arm)   qemu-system-aarch64   qemu-system-riscv (riscv32, riscv64)
#   qemu-system-ppc (ppc, ppc64)     qemu-system-mips (mips, mipsel, mips64, mips64el)   qemu-system-s390x   qemu-system-sparc
#   qemu-system-loongarch64          qemu-system-misc (alpha avr hppa m68k microblaze microblazeel or1k rx sh4 sh4eb tricore xtensa xtensaeb)
# `qemu-full` installs all of them. Every target the configure below enables is built (no --target-list: all system targets), none dropped.
# The firmware paths in the subpackages are by file name; a first build shows if any are off (files that match no pattern stay in `qemu`).
name = "qemu"
version = "11.0.1"
release = 2
summary = "Generic machine emulator and virtualizer"
license = "GPL-2.0-only AND LGPL-2.1-only"
homepage = "https://qemu.org"
patches = ["0006-linux-user-signal.c-define-__SIGRTMIN-MAX-for-non-GN.patch", "CVE-2021-20255.patch", "MAP_SYNC-fix.patch", "bridge-helper-group.patch", "fix-shutdown.patch", "fix-sockios-header.patch", "guest-agent-shutdown.patch", "int128-overflow.patch", "loongarch-disable-atomic128.patch", "musl-initialise-msghdr.patch", "no-check-for-binfmt-gen.patch", "no-indent.patch", "no-venv.patch", "notest.patch", "ppc-hwcap.patch", "riscv-default-cpu-rv64.patch", "tcg-overflow.patch", "xattr_size_max.patch"]
hostdeps = ["bash", "bison", "bzip2", "flex", "gettext", "ninja", "perl", "pkgconf", "python-sphinx", "python-sphinx-rtd-theme"]
builddeps = ["bzip2-devel", "capstone-devel", "curl-devel", "dtc-devel", "elfutils-devel", "fuse-devel", "glib-devel", "gnutls-devel", "gtk+3-devel", "keyutils-devel", "libaio-devel", "libbpf-devel", "libcacard-devel", "libcap-ng-devel", "libcbor-devel", "libdrm-devel", "libiscsi-devel", "libjpeg-turbo-devel", "libnfs-devel", "libpulse-devel", "libsasl-devel", "libseccomp-devel", "libslirp-devel", "libssh-devel", "liburing-devel", "libusb-devel", "linux-headers", "lzo-devel", "ncurses-devel", "nss-devel", "numactl-devel", "pcsc-lite-devel", "pipewire-devel", "pixman-devel", "sdl2-compat-devel", "sdl2-image-devel", "snappy-devel", "usbredir-devel", "virglrenderer-devel", "vte-devel", "zlib-ng-compat-devel", "zstd-devel"]
options = ["!cross", "!check"]

# groupadd and useradd (shadow) and the files they edit (base-files) must be there before pre-install runs
rundeps = ["base-files", "shadow"]

source = [
    { url = "https://download.qemu.org/qemu-11.0.1.tar.xz", sha256 = "0d235f5820278d914a3155ec27af8e4258d697ea892895570807d69c0cb8cd64" },
]

environment = '''
export CFLAGS="${CFLAGS} -I/usr/include/bpf/uapi"
export CXXFLAGS="${CXXFLAGS} -I/usr/include/bpf/uapi"
'''
setup = '''
# qemu links many big programs at once: at most four links at a time
%configure \
    -Dbackend_max_links=4 \
    --enable-bpf \
    --enable-cap-ng \
    --enable-capstone \
    --enable-curl \
    --enable-curses \
    --enable-dbus-display \
    --enable-docs \
    --enable-gtk \
    --enable-guest-agent \
    --enable-jack \
    --enable-kvm \
    --enable-libdw \
    --enable-libnfs \
    --enable-libssh \
    --enable-linux-aio \
    --enable-linux-io-uring \
    --enable-lzo \
    --enable-numa \
    --enable-pie \
    --enable-sdl \
    --enable-seccomp \
    --enable-snappy \
    --enable-system \
    --enable-tpm \
    --enable-usb-redir \
    --enable-vhost-net \
    --enable-virglrenderer \
    --enable-virtfs \
    --enable-vnc \
    --enable-vnc-jpeg \
    --enable-zstd \
    --disable-bsd-user \
    --disable-debug-info \
    --disable-glusterfs \
    --disable-linux-user \
    --disable-oss \
    --disable-werror \
    --disable-xen \
    --audio-drv-list=pa,pipewire,jack,sdl
'''
build = '''
%make
'''
install = '''
%make_install
install -Dm644 $pkgfiles/qemu-ga "$pkgdir/etc/dinit.d/qemu-ga"
# no elf files in /usr/share
mv "$pkgdir/usr/share/qemu" "$pkgdir/usr/lib/qemu"
mkdir -p "$pkgdir/usr/share"
ln -sf ../lib/qemu "$pkgdir/usr/share/qemu"
install -Dm644 $pkgfiles/80-kvm.rules "$pkgdir/usr/lib/udev/rules.d/80-kvm.rules"
install -Dm644 $pkgfiles/bridge.conf "$pkgdir/usr/lib/qemu/bridge.conf"
rm -rf "$pkgdir/usr/share/doc"
# (Chimera drops some firmware on 32-bit targets; FenrirOS targets are 64-bit)
#         self.uninstall("usr/lib/qemu/s390-ccw.img")
#         self.uninstall("usr/lib/qemu/openbios-sparc64")
'''

[subpackages.system-x86]
summary = "QEMU system emulator: x86 (i386, x86_64)"
paths   = ["/usr/bin/qemu-system-i386", "/usr/bin/qemu-system-x86_64", "/usr/lib/qemu/bios*.bin", "/usr/lib/qemu/vgabios*", "/usr/lib/qemu/linuxboot*", "/usr/lib/qemu/multiboot*", "/usr/lib/qemu/kvmvapic.bin", "/usr/lib/qemu/pvh.bin", "/usr/lib/qemu/qboot.rom", "/usr/lib/qemu/sgabios.bin", "/usr/lib/qemu/seabios*", "/usr/lib/qemu/edk2-x86_64*", "/usr/lib/qemu/edk2-i386*", "/usr/lib/qemu/firmware/*-x86_64*", "/usr/lib/qemu/firmware/*-i386*", "/usr/lib/qemu/firmware/*-ovmf*"]
depends = ["qemu"]

[subpackages.system-arm]
summary = "QEMU system emulator: 32-bit Arm"
paths   = ["/usr/bin/qemu-system-arm", "/usr/lib/qemu/edk2-arm*", "/usr/lib/qemu/firmware/*-arm-*"]
depends = ["qemu"]

[subpackages.system-aarch64]
summary = "QEMU system emulator: 64-bit Arm (arm64)"
paths   = ["/usr/bin/qemu-system-aarch64", "/usr/lib/qemu/edk2-aarch64*", "/usr/lib/qemu/firmware/*-aarch64*"]
depends = ["qemu"]

[subpackages.system-riscv]
summary = "QEMU system emulator: RISC-V (riscv32, riscv64)"
paths   = ["/usr/bin/qemu-system-riscv32", "/usr/bin/qemu-system-riscv64", "/usr/lib/qemu/opensbi-*", "/usr/lib/qemu/edk2-riscv*", "/usr/lib/qemu/firmware/*-riscv*"]
depends = ["qemu"]

[subpackages.system-ppc]
summary = "QEMU system emulator: PowerPC (ppc, ppc64)"
paths   = ["/usr/bin/qemu-system-ppc", "/usr/bin/qemu-system-ppc64", "/usr/lib/qemu/slof.bin", "/usr/lib/qemu/openbios-ppc", "/usr/lib/qemu/vof*", "/usr/lib/qemu/u-boot.e500", "/usr/lib/qemu/canyonlands.dtb", "/usr/lib/qemu/qemu_vga.ndrv", "/usr/lib/qemu/skiboot.lid", "/usr/lib/qemu/pnv-pnor.bin"]
depends = ["qemu"]

[subpackages.system-mips]
summary = "QEMU system emulator: MIPS (mips, mipsel, mips64, mips64el)"
paths   = ["/usr/bin/qemu-system-mips", "/usr/bin/qemu-system-mipsel", "/usr/bin/qemu-system-mips64", "/usr/bin/qemu-system-mips64el"]
depends = ["qemu"]

[subpackages.system-s390x]
summary = "QEMU system emulator: IBM Z (s390x)"
paths   = ["/usr/bin/qemu-system-s390x", "/usr/lib/qemu/s390-ccw.img", "/usr/lib/qemu/s390-netboot.img"]
depends = ["qemu"]

[subpackages.system-sparc]
summary = "QEMU system emulator: SPARC (sparc, sparc64)"
paths   = ["/usr/bin/qemu-system-sparc", "/usr/bin/qemu-system-sparc64", "/usr/lib/qemu/openbios-sparc*"]
depends = ["qemu"]

[subpackages.system-loongarch64]
summary = "QEMU system emulator: LoongArch (loongarch64)"
paths   = ["/usr/bin/qemu-system-loongarch64", "/usr/lib/qemu/edk2-loongarch64*", "/usr/lib/qemu/firmware/*-loongarch64*"]
depends = ["qemu"]

[subpackages.system-misc]
summary = "QEMU system emulator: the other architectures (alpha, avr, hppa, m68k, microblaze, microblazeel, or1k, rx, sh4, sh4eb, tricore, xtensa, xtensaeb)"
paths   = ["/usr/bin/qemu-system-alpha", "/usr/bin/qemu-system-avr", "/usr/bin/qemu-system-hppa", "/usr/bin/qemu-system-m68k", "/usr/bin/qemu-system-microblaze", "/usr/bin/qemu-system-microblazeel", "/usr/bin/qemu-system-or1k", "/usr/bin/qemu-system-rx", "/usr/bin/qemu-system-sh4", "/usr/bin/qemu-system-sh4eb", "/usr/bin/qemu-system-tricore", "/usr/bin/qemu-system-xtensa", "/usr/bin/qemu-system-xtensaeb", "/usr/lib/qemu/palcode-clipper", "/usr/lib/qemu/hppa-firmware*", "/usr/lib/qemu/npcm*", "/usr/lib/qemu/openbios-*"]
depends = ["qemu"]

[subpackages.full]
summary = "QEMU with every system emulator"
empty   = true
depends = ["qemu", "qemu-system-x86", "qemu-system-arm", "qemu-system-aarch64", "qemu-system-riscv", "qemu-system-ppc", "qemu-system-mips", "qemu-system-s390x", "qemu-system-sparc", "qemu-system-loongarch64", "qemu-system-misc"]
