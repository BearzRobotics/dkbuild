name = "unzip"
version = "6.0"
release = 1
summary = "List, test and extract compressed files in a ZIP archive"
license = "Info-ZIP"
homepage = "http://infozip.sf.net"
patches = ["0001-unzip-6.0-bzip2-configure.patch", "0002-unzip-6.0-exec-shield.patch", "0003-unzip-6.0-close.patch", "0004-unzip-6.0-attribs-overflow.patch", "0005-unzip-6.0-configure.patch", "0006-unzip-6.0-manpage-fix.patch", "0007-unzip-6.0-fix-recmatch.patch", "0008-unzip-6.0-symlink.patch", "0009-unzip-6.0-caseinsensitive.patch", "0010-unzip-6.0-format-secure.patch", "0011-unzip-6.0-valgrind.patch", "0012-unzip-6.0-x-option.patch", "0013-unzip-6.0-overflow.patch", "0014-unzip-6.0-cve-2014-8139.patch", "0015-unzip-6.0-cve-2014-8140.patch", "0016-unzip-6.0-cve-2014-8141.patch", "0017-unzip-6.0-overflow-long-fsize.patch", "0018-unzip-6.0-heap-overflow-infloop.patch", "0019-unzip-6.0-alt-iconv-utf8.patch", "0020-unzip-6.0-alt-iconv-utf8-print.patch", "0021-0001-Fix-CVE-2016-9844-rhbz-1404283.patch", "0022-unzip-6.0-timestamp.patch", "0023-unzip-6.0-cve-2018-1000035-heap-based-overflow.patch", "0024-unzip-6.0-cve-2018-18384.patch", "0025-unzip-6.0-COVSCAN-fix-unterminated-string.patch", "0026-unzip-zipbomb-part1.patch", "0027-unzip-zipbomb-part2.patch", "0028-unzip-zipbomb-part3.patch", "0029-unzip-zipbomb-manpage.patch"]
builddeps = ["bzip2-devel"]

source = [
    { url = "https://downloads.sourceforge.net/sourceforge/infozip/unzip60.tar.gz", sha256 = "036d96991646d0449ed0aa952e4fbe21b476ce994abc276e49d30e686708bd37" },
]

environment = '''
export CFLAGS="${CFLAGS} -DWILD_STOP_AT_DIR -DLARGE_FILE_SUPPORT -DUNICODE_SUPPORT -DUNICODE_WCHAR -DUTF8_MAYBE_NATIVE -DNO_LCHMOD -DDATE_FORMAT=DF_YMD -DUSE_BZIP2 -DNATIVE"
'''
build = '''
make -f unix/Makefile generic CC="$CC" LF2= D_USE_BZ2=-DUSE_BZIP2 L_BZ2=-lbz2
'''
check = '''
%make test -f unix/Makefile
'''
install = '''
make -f unix/Makefile prefix=$pkgdir/usr install
# hardlink
rm -rf "$pkgdir/usr/bin/zipinfo"
mkdir -p "$pkgdir/usr/bin"
ln -sf unzip "$pkgdir/usr/bin/zipinfo"
mkdir -p "$pkgdir/usr/share"; mv "$pkgdir/usr/man" "$pkgdir/usr/share/man"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/unzip/LICENSE"
'''
