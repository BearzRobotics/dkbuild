# Unix utilities in Zig, one binary per command plus a multicall binary. They are
# an alternative to GNU coreutils and friends, not a replacement yet (differential
# tests against GNU are in the project), so only the multicall `util-unix` goes to
# /usr/bin; the per-command binaries go to /usr/libexec/util-unix and do not
# shadow the GNU ones.
name = "util-unix"
version = "0.2.0"
release = 1
summary = "Unix utilities in Zig (multicall binary and per-command programs)"
license = "GPL-2.0-only"
homepage = "https://github.com/BearzRobotics/util-unix"
hostdeps = ["zig"]
options = ["!check"]

source = [
    { url = "https://github.com/BearzRobotics/util-unix/releases/download/v0.2.0/util-unix-0.2.0.tar.gz", sha256 = "2d7fee861ec7734b774189ca143ee0d3c30a3f512e9e68c6833f1fdac31f7230" },
]

install = '''
%zig_build
mkdir -p "$pkgdir/usr/libexec/util-unix"
for f in "$pkgdir"/usr/bin/*; do
    [ "$(basename "$f")" = util-unix ] && continue
    mv "$f" "$pkgdir/usr/libexec/util-unix/"
done
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/util-unix/LICENSE"
'''
