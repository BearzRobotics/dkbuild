# Written from the DKRescue base-system post (util-linux 2.41.3, autotools), not from
# Chimera's meson recipe, which disables much of what the ISO ships. No login/su/
# chfn: shadow provides those. The mount programs are installed setuid.
# r2: static libraries too (in util-linux-static), for fully static programs on musl.
name = "util-linux"
version = "2.41.3"
release = 2
summary = "Miscellaneous system utilities"
license = "GPL-2.0-or-later"
homepage = "https://github.com/util-linux/util-linux"
builddeps = ["ncurses-devel", "zlib-ng-compat-devel", "linux-headers"]
options = ["!check"]

source = [
    { url = "https://www.kernel.org/pub/linux/utils/util-linux/v2.41/util-linux-2.41.3.tar.xz", sha256 = "3330d873f0fceb5560b89a7dc14e4f3288bbd880e96903ed9b50ec2b5799e58b" },
]

setup = '''
%configure \
    --bindir=/usr/bin \
    --sbindir=/usr/sbin \
    --libdir=/usr/lib \
    --runstatedir=/run \
    --disable-chfn-chsh \
    --disable-login \
    --disable-nologin \
    --disable-su \
    --disable-setpriv \
    --disable-runuser \
    --disable-pylibmount \
    --disable-liblastlog2 \
    --disable-makeinstall-chown \
    --disable-makeinstall-setuid \
    --without-python \
    --without-systemd \
    --without-systemdsystemunitdir \
    ADJTIME_PATH=/var/lib/hwclock/adjtime
'''
build = '''
%make
'''
install = '''
%make_install
chmod 4755 "$pkgdir/usr/bin/mount" "$pkgdir/usr/bin/umount"
rm -rf "$pkgdir/run"
'''
