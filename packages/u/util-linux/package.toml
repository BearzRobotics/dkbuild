# Written from the DKRescue base-system post (util-linux 2.41.3, autotools), not from
# Chimera's meson recipe, which disables much of what the ISO ships. No login/su/
# chfn: shadow provides those. The mount programs are installed setuid.
# r2: static libraries too (in util-linux-static), for fully static programs on musl.
name = "util-linux"
version = "2.42.4"
release = 1
summary = "Miscellaneous system utilities"
license = "GPL-2.0-or-later"
homepage = "https://github.com/util-linux/util-linux"
builddeps = ["ncurses-devel", "zlib-ng-compat-devel", "linux-headers"]
options = ["!check"]

source = [
    { url = "https://www.kernel.org/pub/linux/utils/util-linux/v2.42/util-linux-2.42.4.tar.xz", sha256 = "fbd62a100ab7bb8746ba0661255c3c48185b1e9021507c624da01fbc696330ec" },
]

environment = '''
# setuid programs here (SPEC.md 5.4: the profile has no hardening flags yet): a stack protector, and relocations
# resolved and made read-only before main runs
export CFLAGS="${CFLAGS} -fstack-protector-strong" CXXFLAGS="${CXXFLAGS} -fstack-protector-strong"
export LDFLAGS="${LDFLAGS} -Wl,-z,relro,-z,now"
'''
setup = '''
%configure \
    --bindir=/usr/bin \
    --sbindir=/usr/sbin \
    --libdir=/usr/lib \
    --runstatedir=/run \
    --disable-chfn-chsh \
    --disable-login \
    --disable-nologin \
    --disable-su \
    --disable-setpriv \
    --disable-runuser \
    --disable-pylibmount \
    --disable-liblastlog2 \
    --disable-makeinstall-chown \
    --disable-makeinstall-setuid \
    --without-python \
    --without-systemd \
    --without-systemdsystemunitdir \
    ADJTIME_PATH=/var/lib/hwclock/adjtime
'''
build = '''
%make
'''
install = '''
%make_install
chmod 4755 "$pkgdir/usr/bin/mount" "$pkgdir/usr/bin/umount"
rm -rf "$pkgdir/run"
'''
