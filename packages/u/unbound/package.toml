# cports is BSD-2-Clause, Copyright (c) Chimera Linux contributors.
name = "unbound"
version = "1.26.2"
release = 1
summary = "Validating, recursive, and caching DNS resolver"
license = "BSD-3-Clause"
homepage = "https://nlnetlabs.nl/projects/unbound/about"
hostdeps = ["automake", "libtool", "pkgconf", "protobuf-c-devel"]
builddeps = ["hiredis-devel", "libevent-devel", "libexpat-devel", "libsodium-devel", "nghttp2-devel", "openssl-devel", "protobuf-c-devel"]
rundeps = ["dns-root-data"]

source = [
    { url = "https://nlnetlabs.nl/downloads/unbound/unbound-1.26.2.tar.gz", sha256 = "d8ee7aa6bbb3ff1be7d9e57637d0d0ec2f18273a8efff1a0afe2c665858b96f7" },
]

setup = '''
autoreconf -if -W none
%configure \
    --enable-cachedb \
    --enable-dnscrypt \
    --enable-dnstap \
    --enable-event-api \
    --enable-subnet \
    --enable-tfo-client \
    --enable-tfo-server \
    --with-username=_unbound \
    --with-rootkey-file=/usr/share/dns/root.key \
    --with-conf-file=/etc/unbound/unbound.conf \
    --with-pidfile=/run/unbound.pid
'''
build = '''
%make
'''
check = '''
%make check
'''
install = '''
%make_install
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/unbound/LICENSE"
install -Dm644 doc/example.conf "$pkgdir/usr/share/examples/unbound/example.conf"
rm -f "$pkgdir/etc/unbound/unbound.conf"
install -Dm644 $pkgfiles/unbound.conf "$pkgdir/etc/unbound/unbound.conf"
install -Dm644 $pkgfiles/unbound "$pkgdir/etc/dinit.d/unbound"
'''
