# utf8proc: Unicode normalization library (Julia). Optional dependency of
# irssi (wide-character handling). Its Makefile builds the shared and the
# static library, both installed.
name = "utf8proc"
version = "2.12.0"
release = 2
summary = "Library for processing UTF-8 Unicode data"
license = "MIT"
homepage = "https://juliastrings.github.io/utf8proc/"
hostdeps = ["pkgconf"]
options = ["!check"]

source = [
    { url = "https://github.com/JuliaStrings/utf8proc/archive/refs/tags/v2.12.0.tar.gz", sha256 = "f564011d38b2888d583d510b08e69ffa15aa117155db1b9b49ef1dfe1fa25111" },
]

build = '''
%make prefix=/usr libdir=/usr/lib
'''
install = '''
make DESTDIR="$pkgdir" prefix=/usr libdir=/usr/lib install
install -Dm644 LICENSE.md "$pkgdir/usr/share/licenses/utf8proc/LICENSE.md"
'''
