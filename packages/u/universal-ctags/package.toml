# Universal Ctags: a maintained fork of Exuberant Ctags (`ctags`, `readtags`), tags for 150+
# languages. dj64dev's configure wants it (`universal-ctags not installed`). Built from the
# release archive (its generated configure), with every optional library: libxml2 (xml
# output and parsers), jansson (JSON output), libyaml (the YAML parser), libseccomp (the
# --sandbox mode), pcre2 (regexes in --regex-<LANG>); the man pages are rebuilt with docutils.
name = "universal-ctags"
version = "6.2.1"
release = 1
summary = "Maintained ctags implementation (tags for 150+ languages)"
license = "GPL-2.0-or-later"
homepage = "https://ctags.io"
hostdeps = ["pkgconf", "make", "python-docutils"]
builddeps = ["libxml2-devel", "jansson-devel", "libyaml-devel", "libseccomp-devel", "pcre2-devel"]
options = ["!check"]

source = [
    { url = "https://github.com/universal-ctags/ctags/releases/download/v6.2.1/universal-ctags-6.2.1.tar.gz", sha256 = "2c63efe9e0e083dc50e6fdd8c5414781cc8873d8c8940cf553c01870ed962f8c" },
]

# tests off: the suite (`make check`) runs the ctags binary on its Units/ cases through its own shell
# harness with diff/cmp/timeout, and needs a full coreutils/diffutils; the sandbox base has busybox's
setup = '''
%configure --enable-etags
'''
build = '''
%make
'''
install = '''
%make_install
install -Dm644 COPYING "$pkgdir/usr/share/licenses/universal-ctags/COPYING"
'''
