# util-core: core utilities (ls, cat, cp, sort, date, find, sed, grep, ...) in Zig,
# by BearzRobotics, as an alternative to GNU coreutils: GNU stays the default.
# Installed since 0.1.0 (2026-11-20) in two places, so it can be tried live without touching the system:
#   /usr/bin/util-core                 the multicall binary (`util-core <command> ...`), the only thing in /usr
#   /opt/util-core/bin/<command>       one real executable per command (upstream's standalone build)
#   /opt/util-core/share/man/man1      the manual pages (Markdown, as dkman reads them; not in /usr: they would clash with GNU's page names)
#   util-core-default                  puts /opt/util-core/bin first on every login's PATH
#                                      (/usr/lib/profile.d); remove it to go back to GNU.
# Package builds never read profile.d, so recipes always use GNU.
# Licence: GPL-2.0-or-later (upstream's LICENSE).
# syntax-probe (a 1 MB developer tool upstream builds beside the commands) is not installed.
# Source: the v0.2.0 tag; its one Zig dependency (regex-zig 0.4.0) is fetched on the host (zigdeps).
name = "util-core"
version = "0.2.0"
release = 1
summary = "Core utilities in Zig (alternative to GNU coreutils)"
license = "GPL-2.0-or-later"
homepage = "https://github.com/BearzRobotics/util-core"
hostdeps = ["zig"]
options = ["zigdeps", "!check"]

source = [
    { url = "https://github.com/BearzRobotics/util-core/archive/refs/tags/v0.2.0.tar.gz", sha256 = "ec6e2a886691810c96869e846e1208e36a97bf55d705d0512ba9e1ed5362404d" },
]

build = '''
# %zig_build's command, into a staging directory (the multicall binary goes to /usr/bin and the rest to /opt below)
zig build --release=safe --prefix /tmp/stage -Dcpu=$zig_cpu --system zig-pkg -j$jobs
'''
install = '''
install -Dm755 /tmp/stage/bin/util-core "$pkgdir/usr/bin/util-core"
install -dm755 "$pkgdir/opt/util-core/bin"
for f in /tmp/stage/bin/*; do
    case "${f##*/}" in util-core|syntax-probe) ;; *) install -m755 "$f" "$pkgdir/opt/util-core/bin/" ;; esac
done
test -x "$pkgdir/opt/util-core/bin/ls"
if [ -d /tmp/stage/share/man ]; then
    mkdir -p "$pkgdir/opt/util-core/share"
    cp -a /tmp/stage/share/man "$pkgdir/opt/util-core/share/man"
fi
install -Dm644 $pkgfiles/util-core.sh "$pkgdir/usr/lib/profile.d/util-core.sh"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/util-core/LICENSE"
'''

[subpackages.default]
summary = "Use util-core's commands in place of GNU coreutils (PATH)"
depends = ["util-core"]
paths   = ["/usr/lib/profile.d/util-core.sh"]
