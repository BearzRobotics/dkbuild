# util-core: core utilities (ls, cat, cp, sort, date, find, sed, ...) in Zig,
# by BearzRobotics, as an alternative to GNU coreutils: GNU stays the default.
# Like Ubuntu's rust-coreutils switch, but without taking /usr/bin away:
#   util-core          the multicall binary /usr/bin/util-core (`util-core ls`)
#                      and a link per command in /usr/lib/util-core/bin
#   util-core-default  puts /usr/lib/util-core/bin first on every login's PATH
#                      (/usr/lib/profile.d); remove it to go back to GNU.
# Package builds never read profile.d, so recipes always use GNU.
# Upstream builds the multicall binary as `main`; installed as util-core.
# Licence: GPL-2.0-or-later (upstream's LICENSE, from commit 70ca8ee).
name = "util-core"
version = "0.0.0_git20261111"
release = 1
summary = "Core utilities in Zig (alternative to GNU coreutils)"
license = "GPL-2.0-or-later"
homepage = "https://github.com/BearzRobotics/util-core"
hostdeps = ["zig"]
options = ["zigdeps", "!check"]

source = [
    { url = "https://github.com/BearzRobotics/util-core/archive/70ca8ee135d4701f72e389bb178237c5cdf57445.tar.gz", sha256 = "251db8ce70195c2daab01dcb51b4407e30f41e2b38d4303abca7a3eb9fb85050" },
]

build = '''
# %zig_build's command, into a staging directory: only the multicall binary
# is packaged (the one-per-command executables would sit on GNU's names)
zig build --release=safe --prefix /tmp/stage -Dcpu=$zig_cpu --system zig-pkg -j$jobs
'''
install = '''
install -Dm755 /tmp/stage/bin/main "$pkgdir/usr/bin/util-core"
install -dm755 "$pkgdir/usr/lib/util-core/bin"
for c in $(/tmp/stage/bin/main --list); do
    ln -s ../../../bin/util-core "$pkgdir/usr/lib/util-core/bin/$c"
done
test -e "$pkgdir/usr/lib/util-core/bin/ls"
install -Dm644 $pkgfiles/util-core.sh "$pkgdir/usr/lib/profile.d/util-core.sh"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/util-core/LICENSE"
'''

[subpackages.default]
summary = "Use util-core's commands in place of GNU coreutils (PATH)"
depends = ["util-core"]
paths   = ["/usr/lib/profile.d/util-core.sh"]
