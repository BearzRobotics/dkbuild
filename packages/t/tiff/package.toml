# Follows the DKRescue post's build of tiff 4.7.2.
name = "tiff"
version = "4.7.2"
release = 1
summary = "TIFF library and tools"
license = "libtiff"
homepage = "https://libtiff.gitlab.io/libtiff"
builddeps = ["zlib-ng-compat-devel", "xz-devel", "zstd-devel", "libjpeg-turbo-devel"]
options = ["!check"]

source = [
    { url = "https://download.osgeo.org/libtiff/tiff-4.7.2.tar.gz", sha256 = "672bd7d10aee4606171afb864f3570b83340f6a33e2c186dc0512f7145ffdf6a" },
]

setup = '''
%cmake -Dtiff-docs=OFF -Dtiff-tests=OFF -Dtiff-contrib=OFF
'''
build = '''
%cmake_build
'''
install = '''
%cmake_install
'''
