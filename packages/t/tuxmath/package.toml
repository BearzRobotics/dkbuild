# From Debian's tuxmath 2.0.3-10: its sources and its patches (applied in setup).
# For FenrirOS's education set (2011-era Tux4Kids, kept building by Debian).
name = "tuxmath"
version = "2.0.3"
release = 1
summary = "Arithmetic game for children: Tux defends the city from comets"
license = "GPL-3.0-or-later"
homepage = "https://github.com/tux4kids/tuxmath"
hostdeps = ["pkgconf", "autoconf", "automake", "libtool", "gettext-devel"]
builddeps = ["t4k-common-devel", "sdl12-compat-devel", "sdl-image-devel", "sdl-mixer-devel", "sdl-ttf-devel", "sdl-net-devel", "sdl-pango-devel", "librsvg-devel", "libxml2-devel", "libpng-devel"]
options = ["!check"]

source = [
    { url = "https://deb.debian.org/debian/pool/main/t/tuxmath/tuxmath_2.0.3.orig.tar.gz", sha256 = "eec49c296d41df39a6474d94ba4e3334e4c16dc180d3ea4a6defc2debfc39887" },
    { url = "https://deb.debian.org/debian/pool/main/t/tuxmath/tuxmath_2.0.3-10.debian.tar.xz", sha256 = "922b18290de30fdba372723192988559aa573fa0fed50b556f1ade2c25341617" },
]

setup = '''
# Debian's patches (debian.tar.xz unpacks beside the source, in ../debian)
while read -r p opt || [ -n "$p" ]; do
    case "$p" in ''|'#'*) continue ;; esac
    patch ${opt:--p1} < ../debian/patches/$p
done < ../debian/patches/series
autoreconf -fi
%configure
'''
build = '''
%make
'''
install = '''
%make_install
install -Dm644 COPYING "$pkgdir/usr/share/licenses/tuxmath/COPYING"
'''
