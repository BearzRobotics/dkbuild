# After Chimera Linux cports: main/tesseract-data. cports is BSD-2-Clause, Copyright (c) Chimera Linux contributors.
# Tesseract's trained models (tessdata_fast: the fast integer models, which
# is what Tesseract recommends for use). One package per language and per
# script: tesseract-data-<code> (deu, fra, spa, ...; tesseract installs eng
# and osd). Installing tesseract-data itself brings every one of them.
name = "tesseract-data"
version = "4.1.0"
release = 1
summary = "OCR language data (all languages)"
license = "Apache-2.0"
homepage = "https://github.com/tesseract-ocr/tessdata_fast"

source = [
    { url = "https://github.com/tesseract-ocr/tessdata_fast/archive/refs/tags/4.1.0.tar.gz", sha256 = "d0e3bb6f3b4e75748680524a1d116f2bfb145618f8ceed55b279d15098a530f9" },
]

install = '''
install -d "$pkgdir/usr/share/tessdata/script"
install -m644 *.traineddata "$pkgdir/usr/share/tessdata/"
install -m644 script/*.traineddata "$pkgdir/usr/share/tessdata/script/"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/tesseract-data/LICENSE"
'''

