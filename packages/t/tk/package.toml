name = "tk"
version = "8.6.17"
release = 1
summary = "TK graphical user interface toolkit for TCL"
license = "TCL"
homepage = "http://www.tcl.tk"
hostdeps = ["automake", "pkgconf"]
builddeps = ["libxext-devel", "libxft-devel", "libxscrnsaver-devel", "tcl-devel", "zlib-ng-compat-devel"]
options = ["!check", "!cross", "!lto"]

source = [
    { url = "https://downloads.sourceforge.net/sourceforge/tcl/tk8.6.17-src.tar.gz", sha256 = "e4982df6f969c08bf9dd858a6891059b4a3f50dc6c87c10abadbbe2fc4838946" },
]

setup = '''
cd unix
autoreconf -if -W none
%configure \
    --enable-threads \
    --enable-man-symlinks \
    --disable-rpath \
    --without-tzdata \
    tk_cv_strtod_unbroken=ok \
    LIBS=-ltcl8.6
'''
build = '''
cd unix
%make
'''
install = '''
cd unix
make DESTDIR="$pkgdir" install install-private-headers
mkdir -p "$pkgdir/usr/bin"
ln -sf wish8.6 "$pkgdir/usr/bin/wish"
install -Dm644 ../license.terms "$pkgdir/usr/share/licenses/tk/license.terms"
ln -sf wish8.6 "$pkgdir/usr/bin/wish"
install -Dm644 ../license.terms "$pkgdir/usr/share/licenses/tk/license.terms"
'''
