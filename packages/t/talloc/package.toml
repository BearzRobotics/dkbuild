# cports is BSD-2-Clause, Copyright (c) Chimera Linux contributors.
name = "talloc"
version = "2.5.0"
release = 2
summary = "Hierarchical pool based memory allocator with destructors"
license = "LGPL-3.0-or-later"
homepage = "https://talloc.samba.org"
patches = ["python-so.patch"]
hostdeps = ["docbook-xsl-nons", "gettext", "libxslt", "pkgconf", "python"]
builddeps = ["gettext-devel", "python-devel"]
options = ["!cross"]

source = [
    { url = "https://download.samba.org/pub/talloc/talloc-2.5.0.tar.gz", sha256 = "912afa237510ae542a7733998eb18a12bcda35ab6729c8e2ddb43e8d0ebab007" },
]

environment = '''
# waf, not its wrapper makefile
export PYTHONHASHSEED=1 WAF_MAKE=1
'''
setup = '''
./configure --prefix=/usr --libdir=/usr/lib \
    --disable-rpath --disable-rpath-install \
    --builtin-libraries=replace --bundled-libraries=NONE
'''
build = '''
./buildtools/bin/waf build -j$jobs
'''
install = '''
./buildtools/bin/waf install --destdir="$pkgdir"
'''

[subpackages.python-libs]
summary = "Python utility library"
paths   = ["/usr/lib/libpytalloc-util.so.*"]

[subpackages.python]
summary = "Python bindings"
paths   = ["/usr/lib/python*"]
