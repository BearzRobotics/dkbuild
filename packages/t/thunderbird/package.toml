name = "thunderbird"
version = "159.0"
release = 1
summary = "Thunderbird mail client"
license = "GPL-3.0-only AND LGPL-2.1-only AND LGPL-3.0-only AND MPL-2.0"
homepage = "https://www.thunderbird.net"
patches = ["atoi.patch", "clang-ias.patch", "clang-memory-throw-gcc.patch", "depflags.patch", "enable-elfhack-relr.patch", "fix-fortify-system-wrappers.patch", "fix-rnp-getenv.patch", "fix-rust-target.patch", "fix-webrtc-pid_t.patch", "google-sucks.patch", "lfs64.patch", "libcxx18.patch", "loong0001-Enable-WebRTC-for-loongarch64.patch", "loong0003-Define-HWCAP_LOONGARCH_LSX_and_LASX.patch", "loong0004-Fix-ycbcr-chromium_types-warning.patch", "musl-libresolv.patch", "musl-prctl.patch", "no-ccache-stats.patch", "ppc64-webrtc.patch", "riscv64-no-llama-simd.patch", "riscv64-reduce-debug.patch", "sandbox-sched_setscheduler.patch", "sqlite-ppc.patch", "wasip1.patch", "wasm2c-various-archs.patch", "x11lol.patch", "xptcall-integrated-as.patch"]
hostdeps = ["automake", "rust", "cbindgen", "llvm-devel", "llvm-clang", "llvm-lld", "dbus", "gettext", "tar", "libtool", "nasm", "nodejs", "pkgconf", "python", "zip", "unzip"]
builddeps = ["alsa-lib-devel", "dbus-devel", "ffmpeg-devel", "freetype-devel", "glib-devel", "gtk+3-devel", "icu-devel", "libevent-devel", "libffi-devel", "libjpeg-turbo-devel", "libnotify-devel", "libogg-devel", "libpng-devel", "libpulse-devel", "libtheora-devel", "libvorbis-devel", "libvpx-devel", "libwebp-devel", "libxcomposite-devel", "libxscrnsaver-devel", "libxt-devel", "mesa-devel", "nspr-devel", "nss-devel", "pipewire-devel", "pixman-devel", "zlib-ng-compat-devel"]
options = ["!cross", "!check"]

source = [
    { url = "https://ftp.mozilla.org/pub/thunderbird/releases/159.0/source/thunderbird-159.0.source.tar.xz", sha256 = "b4cbc4e010deaa66a51a5c647586c8dc41579c136155fe8baa8253f7c8b3927e" },
]
environment = '''
export MOZBUILD_STATE_PATH="$PWD/.mozbuild" MOZ_MAKE_FLAGS="-j$jobs" AS="$CC"
export CARGO_HOME=/tmp/cargo-home CARGO_NET_OFFLINE=true
export RUST_TARGET=x86_64-unknown-linux-musl RUSTFLAGS="-C target-feature=-crt-static"
export MACH_BUILD_PYTHON_NATIVE_PACKAGE_SOURCE=system MOZ_NOSPAM=1
'''
setup = '''
cp $pkgfiles/stab.h toolkit/crashreporter/google-breakpad/src/
# As firefox: no WASI toolchain yet (no wasm-sandboxed libraries), no JACK.
./mach configure --enable-application=comm/mail --prefix=/usr --libdir=/usr/lib \
    --host=$target --target=$target \
    --disable-bootstrap \
    --disable-install-strip --disable-strip \
    --enable-linker=lld --enable-optimize --enable-release \
    --disable-hardening \
    --with-system-ffi --with-system-icu --with-system-jpeg --with-system-libevent \
    --with-system-libvpx --with-system-nspr --with-system-nss --with-system-pixman \
    --with-system-webp --with-system-zlib --without-system-png \
    --enable-audio-backends=pulseaudio --enable-pulseaudio --disable-alsa --disable-jack \
    --enable-dbus --enable-default-toolkit=cairo-gtk3-wayland --enable-necko-wifi \
    --disable-jemalloc --disable-profiling --disable-tests --disable-updater \
    --without-wasm-sandboxed-libraries \
    --allow-addon-sideload --enable-official-branding \
    --with-distribution-id=org.fenriros
'''
build = '''
./mach build --priority normal
'''
install = '''
DESTDIR="$pkgdir" ./mach install
install -Dm644 $pkgfiles/vendor.js "$pkgdir/usr/lib/thunderbird/defaults/preferences/vendor.js"
install -Dm644 $pkgfiles/distribution.ini "$pkgdir/usr/lib/thunderbird/distribution/distribution.ini"
install -Dm644 $pkgfiles/thunderbird.desktop "$pkgdir/usr/share/applications/thunderbird.desktop"
for sz in 16 22 24 32 48 128 256; do
    install -Dm644 comm/mail/branding/thunderbird/default$sz.png "$pkgdir/usr/share/icons/hicolor/${sz}x$sz/apps/thunderbird.png"
done
rm -f "$pkgdir/usr/lib/thunderbird/thunderbird-bin"
ln -s thunderbird "$pkgdir/usr/lib/thunderbird/thunderbird-bin"
'''
