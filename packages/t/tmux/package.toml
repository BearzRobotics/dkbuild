# Imported from Chimera Linux cports: main/tmux/template.py
# cports is BSD-2-Clause, Copyright (c) Chimera Linux contributors.
# --enable-sixel as Chimera's (sixel graphics pass through). utf8proc, systemd
# socket activation, jemalloc, and cgroup/utempter integration are off by
# default upstream and unneeded here; utf8proc is built in below because
# tmux's own width table is otherwise less accurate on new emoji.
name = "tmux"
version = "3.8"
release = 1
summary = "Terminal multiplexer"
license = "ISC"
homepage = "https://tmux.github.io"
hostdeps = ["pkgconf", "byacc", "automake"]
builddeps = ["libevent-devel", "ncurses-devel", "utf8proc-devel"]

source = [
    { url = "https://github.com/tmux/tmux/releases/download/3.8/tmux-3.8.tar.gz", sha256 = "e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e" },
]

setup = '''
%configure \
    --enable-sixel \
    --enable-utf8proc
'''
build = '''
%make
'''
install = '''
%make_install
install -Dm644 COPYING "$pkgdir/usr/share/licenses/tmux/COPYING"
'''
