# tpn/pdfs: a curated archive of technical PDFs (papers, specs, decks, manuals),
# packaged so the collection is preserved and available offline.
# Pinned to commit f6331e66 (2026-11-10). The source is GitHub's tarball of that
# commit (about 4.0 GB), so the sha256 holds as long as GitHub serves it unchanged.
# The repo states no licence: the PDFs are third-party works, each under its
# authors' terms, so the licence is "custom:tpn-pdfs" and a NOTICE says so.
name = "tpn-pdfs"
version = "20261110"
release = 1
summary = "Archive of technical PDFs: papers, specs, slide decks and manuals"
license = "custom:tpn-pdfs"
homepage = "https://github.com/tpn/pdfs"
options = ["!check"]

source = [
    { url = "https://github.com/tpn/pdfs/archive/f6331e66ad5d08a4a293745391da1a9ca54421ef.tar.gz", sha256 = "4c3f415f1dd55774bb3350f8d9067dec25c756fdbdc39ccddfc2b5f515791ed4" },
]

# Ships the PDFs, the browser-saved asset folder that belongs to one of them and
# the browse-site source; .github/ and .gitignore stay out.
install = '''
d="$pkgdir/usr/share/tpn-pdfs"
install -dm755 "$d"
find . -maxdepth 1 -type f -name '*.pdf' -exec install -m644 -t "$d" {} +
if [ -d "Inside IO Completion Ports_files" ]; then
    cp -a "Inside IO Completion Ports_files" "$d/"
fi
[ -d .site ] && cp -a .site "$d/site"
cat > "$d/NOTICE" <<'EON'
This is a snapshot of https://github.com/tpn/pdfs (commit f6331e66).
The repository carries no licence. Each PDF is the work of its own authors
or publisher and remains under their terms; it is collected here for
reference and preservation.
EON
install -Dm644 "$d/NOTICE" "$pkgdir/usr/share/licenses/tpn-pdfs/NOTICE"
'''
