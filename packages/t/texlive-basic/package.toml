install = '''
root="$pkgdir/usr/share"
mkdir -p "$root/texmf-dist" "$root/tlpkg"
for t in /build/sources/*.tar.xz; do
    case "$(basename "$t")" in
    R_*)
        # relocated: everything but tlpkg/ is relative to texmf-dist
        tar -xf "$t" -C "$root/texmf-dist" --exclude=tlpkg
        tar -xf "$t" -C "$root" tlpkg
        ;;
    N_*)
        # texmf-dist/ and tlpkg/ at the top; the licence, release notes and installer script are not installed there
        tar -xf "$t" -C "$root" --exclude='LICENSE.*' --exclude=release-texlive.txt --exclude='install-tl*'
        ;;
    esac
done
# The tree's texmf.cnf derives every path from the binary's directory (/usr): point it at
# this layout instead (the same edit as in texlive-bin's setup: TEXMFROOT=/usr/share,
# generated files in /var/lib/texmf, site configuration in /etc/texmf; TEXMFLOCAL is
# a lookup path only, nothing is installed there).
sed -i \
    -e 's|^TEXMFROOT = .*|TEXMFROOT = /usr/share|' \
    -e 's|^TEXMFLOCAL = .*|TEXMFLOCAL = /usr/local/share/texmf|' \
    -e 's|^TEXMFSYSVAR = .*|TEXMFSYSVAR = /var/lib/texmf|' \
    -e 's|^TEXMFSYSCONFIG = .*|TEXMFSYSCONFIG = /etc/texmf|' \
    "$root/texmf-dist/web2c/texmf.cnf"
grep -q '^TEXMFROOT = /usr/share$' "$root/texmf-dist/web2c/texmf.cnf"
perl "$pkgfiles/gen-config.pl" "$root"
test -s "$root/texmf-dist/web2c/fmtutil.cnf"
install -Dm644 "$pkgfiles/LICENSE.CTAN" "$pkgdir/usr/share/licenses/texlive-basic/LICENSE.CTAN"
install -Dm644 "$pkgfiles/LICENSE.TL" "$pkgdir/usr/share/licenses/texlive-basic/LICENSE.TL"
'''
