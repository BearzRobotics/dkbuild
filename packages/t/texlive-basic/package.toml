# TeX Live macro, font and configuration tree (texmf-dist) for the texlive-bin engines:
# the packages of TeX Live's scheme-basic (plain TeX, LaTeX base and required
# packages, Computer Modern, Latin Modern, hyphenation, hyperref, ...) plus
# collection-latexrecommended (graphicx/geometry/amsmath/babel/... recommended
# LaTeX packages) and collection-fontsrecommended (the standard PostScript font
# metrics, Times/Helvetica/Courier clones, ...). 218 CTAN/tlnet packages, ~110 MB.
#
# WHY THIS APPROACH. The full TeX Live tree cannot be fetched at build time, and
# TeX Live publishes no frozen tarball of it. Each tlnet package is a small
# archive (tlnet/archive/<name>.tar.xz) whose sha512 is in texlive.tlpdb; the 218
# below are pinned here by sha256 (checked against the tlpdb's sha512 when this
# recipe was made). Their relevant file names: R_<pkg> means a "relocated"
# container (paths relative to texmf-dist), N_<pkg> one with texmf-dist/ and
# tlpkg/ in it. Documentation and source containers are NOT taken (a package's
# <name>.doc.tar.xz and .source.tar.xz): the tree has the run-time files only.
# RISK: tlnet is rolling. CTAN replaces a package's archive when it is updated, so
# a fetch long after this recipe was made fails the checksum for those packages
# (the checksum is the guard: nothing wrong is ever installed); `dkbuild fetch`
# updates the cache, a refresh of this list is `tlpdb`-driven and mechanical.
# WHAT IT COVERS: everything TeX Live scheme-basic ships, plus the two collections
# above. It does NOT cover: LaTeX extra packages (collection-latexextra: tikz/
# pgf, beamer, fontspec for XeTeX/LuaTeX in collection-xetex/-luatex, biblatex,
# math/science, languages beyond English, and most fonts). Larger sets are the
# same recipe with more names; the full TeX Live is ~7 GB.
# WHAT HAPPENS AT BUILD: the packages are unpacked into /usr/share/texmf-dist and
# /usr/share/tlpkg, and files/gen-config.pl writes fmtutil.cnf, updmap.cfg and
# language.dat/.def/.lua from the packages' tlpobj `execute` lines, with TeX
# Live's own Perl module (TeXLive::TLUtils), as tlmgr would. AT INSTALL
# (scripts/post-install): mktexlsr, texlinks, updmap-sys and fmtutil-sys --all
# make ls-R, the latex/pdflatex/... links in /usr/bin and the formats in
# /var/lib/texmf. This takes a minute or two and is not fatal if it fails.
# Not shipped: tlmgr (it manages tlnet, which this tree is not).
name = "texlive-basic"
version = "20260301"
release = 1
summary = "TeX Live macro/font tree: scheme-basic, recommended LaTeX packages and fonts"
license = "LPPL-1.3c AND GPL-2.0-or-later AND LicenseRef-TeX-Live"
homepage = "https://tug.org/texlive"
hostdeps = ["perl"]
rundeps = ["texlive-bin", "perl"]
options = ["!check"]

