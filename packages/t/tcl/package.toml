name = "tcl"
version = "8.6.16"
release = 1
summary = "TCL scripting language"
license = "TCL"
homepage = "http://www.tcl.tk"
patches = ["uintptr.patch"]
hostdeps = ["automake", "pkgconf"]
builddeps = ["zlib-ng-compat-devel", "sqlite-devel"]
options = ["!check", "!lto"]

source = [
    { url = "https://downloads.sourceforge.net/sourceforge/tcl/tcl8.6.16-src.tar.gz", sha256 = "91cb8fa61771c63c262efb553059b7c7ad6757afa5857af6265e4b0bdc2a14a5" },
]

environment = '''
# llvm-ranlib refuses the shared libraries its makefiles hand it
export RANLIB=true
'''
setup = '''
cd unix
autoreconf -if -W none
%configure \
    --enable-threads \
    --enable-man-symlinks \
    --disable-rpath \
    --with-system-sqlite \
    --without-tzdata \
    tcl_cv_strstr_unbroken=ok \
    tcl_cv_strtoul_unbroken=ok
'''
build = '''
cd unix
%make
'''
install = '''
cd unix
make DESTDIR="$pkgdir" install install-private-headers
mkdir -p "$pkgdir/usr/bin"
ln -sf tclsh8.6 "$pkgdir/usr/bin/tclsh"
install -Dm644 ../license.terms "$pkgdir/usr/share/licenses/tcl/license.terms"
ln -sf tclsh8.6 "$pkgdir/usr/bin/tclsh"
install -Dm644 ../license.terms "$pkgdir/usr/share/licenses/tcl/license.terms"
'''
