# cports is BSD-2-Clause, Copyright (c) Chimera Linux contributors.
name = "tor"
version = "0.4.9.17"
release = 1
summary = "Anonymizing overlay network"
license = "BSD-3-Clause"
homepage = "https://gitlab.com/torproject/tor"
patches = ["no-practracker-test.patch"]
hostdeps = ["asciidoc", "automake", "pkgconf", "docbook-xsl", "libxslt"]
builddeps = ["libevent-devel", "linux-headers", "openssl-devel", "xz-devel", "zlib-ng-compat-devel", "zstd-devel"]
checkdeps = ["bash"]

# groupadd and useradd (shadow) and the files they edit (base-files) must be there before pre-install runs
rundeps = ["base-files", "shadow"]

source = [
    { url = "https://gitlab.com/torproject/tor/-/archive/tor-0.4.9.17/tor-tor-0.4.9.17.tar.gz", sha256 = "542b1b7735729dfd0cb253d07faeb4317feb53676a87fc4963d1efb7a632d52f" },
]

environment = '''
# the man pages' date: from git unless SOURCE_DATE_EPOCH is set (a GitLab
# archive has no .git); the ChangeLog's time in the archive
export SOURCE_DATE_EPOCH=$(stat -c %Y "$srcdir/ChangeLog")
'''
setup = '''
autoreconf -if -W none
%configure
'''
build = '''
%make
'''
check = '''
%make check
'''
install = '''
%make_install
# only contains a sample
rm -rf "$pkgdir/etc"
install -Dm644 src/config/torrc.sample.in "$pkgdir/usr/share/examples/tor/torrc.sample.in"
install -Dm644 $pkgfiles/tor "$pkgdir/etc/dinit.d/tor"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/tor/LICENSE"
'''
