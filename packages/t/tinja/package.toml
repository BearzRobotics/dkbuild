# CLI tool for testing web pages for template injection vulnerabilities. (BlackArch list, requested 2026-11-16; docs/requests.md). Written from the template of ffuf; not built yet when written (wip/queue): expect first-build fixes.
# Go module, dependencies fetched on the host (godeps). Main package: ..
name = "tinja"
version = "1.2.0"
release = 1
summary = "CLI tool for testing web pages for template injection vulnerabilities."
license = "Apache-2.0"
homepage = "https://github.com/Hackmanit/TInjA"
hostdeps = ["go"]
options = ["!check", "godeps"]

source = [
    { url = "https://github.com/Hackmanit/TInjA/archive/refs/tags/1.2.0.tar.gz", sha256 = "95a65d928842b7a949a31387ff812a3e284b1d4991aa597516a93f2242520a49" },
]

environment = '''
export GOFLAGS="-mod=mod -trimpath -buildvcs=false" GOTOOLCHAIN=local GOPROXY=off
export GOCACHE=/tmp/go-cache GOPATH=/tmp/go CGO_ENABLED=0
'''
build = '''
mkdir -p build
go build -o build/TInjA .
'''
install = '''
install -Dm755 build/TInjA "$pkgdir/usr/bin/TInjA"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/tinja/LICENSE"
'''
