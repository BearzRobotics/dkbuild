# texturecraft: part of the Craft App Suite (storytold), pure Rust on egui/wgpu. Paint PBR textures directly on 3D meshes
# Crates vendored on the host (cargodeps), git dependencies included (storytold/craft-libs, the
# storytold forks of egui and winit, winprint.rs which is Windows only but in Cargo.lock).
# Optional build input included: craft-fonts at the commit upstream's CI uses (CRAFT_FONTS_DIR,
# embedded in the binary). Both unpack as further sources in /build.
# Windowing (Wayland, X11, xkbcommon) and the GPU (Vulkan, EGL) are opened at run time, so they
# are run-time dependencies, as for alacritty.
# Generated from the wordcraft recipe's pattern; source edits: none. Not built yet when written.
name = "texturecraft"
version = "0.6.1"
release = 1
summary = "Paint PBR textures directly on 3D meshes"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/storytold/texturecraft"
hostdeps = ["rust", "pkgconf"]
builddeps = ["libxcb-devel", "libxkbcommon-devel", "wayland-devel"]
rundeps = ["libxkbcommon", "mesa", "vulkan-loader", "wayland", "libx11", "libxcb", "shared-mime-info", "hicolor-icon-theme"]
options = ["!check", "cargodeps"]

source = [
    { url = "https://github.com/storytold/texturecraft/archive/refs/tags/v0.6.1.tar.gz", sha256 = "b710a8b46d2f885ed20b2fe6a8154789dbba914a05f982cc7be28e3d1c33db34" },
    { url = "https://github.com/storytold/craft-fonts/archive/aced4137c022f1f587624d48e81ec77e1914a9cc.tar.gz", sha256 = "fd0a918e08537816453dc5e37962c14a1b2068d89b2c966b34f877901fd08f84" },
]

environment = '''
export CARGO_HOME=/tmp/cargo-home CARGO_NET_OFFLINE=true
export CRAFT_FONTS_DIR=/build/craft-fonts-aced4137c022f1f587624d48e81ec77e1914a9cc
'''
build = '''
test -d "$CRAFT_FONTS_DIR/fonts"
cargo build --release --frozen --offline --locked -j $jobs -p texturecraft -p texturecraft-cli
'''
install = '''
install -Dm755 target/release/texturecraft "$pkgdir/usr/bin/texturecraft"
install -Dm755 target/release/texturecraft-cli "$pkgdir/usr/bin/texturecraft-cli"
id=ai.storyteller.texturecraft
install -Dm644 packaging/linux/$id.desktop "$pkgdir/usr/share/applications/$id.desktop"
install -Dm644 packaging/linux/$id.mime.xml "$pkgdir/usr/share/mime/packages/$id.xml"
mkdir -p "$pkgdir/usr/share/metainfo"
sed -e "s/@VERSION@/$version/g" -e "s/@DATE@/2026-11-12/g" \
    packaging/linux/$id.metainfo.xml.in > "$pkgdir/usr/share/metainfo/$id.metainfo.xml"
mkdir -p "$pkgdir/usr/share/icons"
cp -R assets/app-icon/hicolor "$pkgdir/usr/share/icons/"
install -Dm644 LICENSE-MIT "$pkgdir/usr/share/licenses/texturecraft/LICENSE-MIT"
install -Dm644 LICENSE-APACHE "$pkgdir/usr/share/licenses/texturecraft/LICENSE-APACHE"
install -Dm644 NOTICE "$pkgdir/usr/share/licenses/texturecraft/NOTICE"
install -Dm644 ATTRIBUTION.md "$pkgdir/usr/share/doc/texturecraft/ATTRIBUTION.md"
'''
