name = "testdisk"
version = "7.2"
release = 1
summary = "Data recovery suite: testdisk and photorec"
license = "GPL-2.0-or-later"
homepage = "https://www.cgsecurity.org"
hostdeps = ["automake", "pkgconf"]
builddeps = ["e2fsprogs-devel", "libjpeg-turbo-devel", "ncurses-devel", "ntfs-3g-devel", "util-linux-devel", "zlib-ng-compat-devel"]
options = ["!check"]

source = [
    { url = "https://www.cgsecurity.org/testdisk-7.2.tar.bz2", sha256 = "f8343be20cb4001c5d91a2e3bcd918398f00ae6d8310894a5a9f2feb813c283f" },
]

environment = '''
# musl 1.2.5 dropped the GNU basename() from <string.h>; the POSIX one is in <libgen.h>.
export CFLAGS="${CFLAGS} -include libgen.h"
'''
setup = '''
%configure
'''
build = '''
%make
'''
install = '''
%make_install
'''
