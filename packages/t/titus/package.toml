# High-performance secrets scanner based on NoseyParker. (BlackArch list, requested 2026-11-16; docs/requests.md). Written from the template of ffuf; not built yet when written (wip/queue): expect first-build fixes.
# Go module, dependencies fetched on the host (godeps). Main package: cmd/titus.
name = "titus"
version = "1.3.0"
release = 1
summary = "High-performance secrets scanner based on NoseyParker."
license = "Apache-2.0"
homepage = "https://github.com/praetorian-inc/titus"
hostdeps = ["go"]
options = ["!check", "godeps"]

source = [
    { url = "https://github.com/praetorian-inc/titus/archive/refs/tags/v1.3.0.tar.gz", sha256 = "00b22bc9896f36351259153989ef1a5d1061598e56dfb009097e5a5115742fd5" },
]

environment = '''
export GOFLAGS="-mod=mod -trimpath -buildvcs=false" GOTOOLCHAIN=local GOPROXY=off
export GOCACHE=/tmp/go-cache GOPATH=/tmp/go CGO_ENABLED=0
'''
build = '''
mkdir -p build
go build -o build/titus ./cmd/titus
'''
install = '''
install -Dm755 build/titus "$pkgdir/usr/bin/titus"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/titus/LICENSE"
'''
