# A TCP stream replay tool to support real testing of Internet server applications. (BlackArch list, requested 2026-11-16; docs/requests.md). Generated from the sources' build files (autotools); the build dependencies are guessed from the #includes. Not built yet when written (wip/queue): expect first-build fixes.
name = "tcpcopy"
version = "1.2.0"
release = 1
summary = "A TCP stream replay tool to support real testing of Internet server applications."
license = "BSD-3-Clause"
homepage = "https://github.com/session-replay-tools/tcpcopy"
hostdeps = ["make", "pkgconf"]
builddeps = ["libpcap-devel", "openssl-devel", "linux-headers"]
options = ["!check"]

source = [
    { url = "https://github.com/session-replay-tools/tcpcopy/archive/refs/tags/v1.2.0.tar.gz", sha256 = "34c2657fbe435d703c1ad50d69a0a4ce345ca519e6231819568d5a50645467cd" },
]

setup = '''
# its own nginx-style configure: no --sysconfdir/--libdir/--host (%configure's options are "invalid option"),
# only --prefix (the binaries go to $prefix/sbin)
./configure --prefix=/usr
'''
build = '''
%make
'''
install = '''
%make_install
install -Dm644 COPYING "$pkgdir/usr/share/licenses/tcpcopy/COPYING"
'''
