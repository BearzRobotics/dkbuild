# Imported from Chimera Linux cports: work/cports/main/texinfo/template.py
# cports is BSD-2-Clause, Copyright (c) Chimera Linux contributors.
# Imported draft, untested: dependency names are Chimera's and resolve from the stage 0 image until they are recipes.
# r3: tests off (the info/ tests need a pty).
# r2: static libraries too (in texinfo-static), for fully static programs on musl.
name = "texinfo"
version = "7.2"
release = 3
summary = "GNU Documentation System"
license = "GPL-3.0-or-later"
homepage = "http://www.gnu.org/software/texinfo"
hostdeps = ["perl", "ncurses-devel"]
builddeps = ["ncurses-devel"]
rundeps = ["perl"]

# Tests are off (2026-11-18): the info/ tests (t/*.sh) drive the terminal UI through a
# "pseudotty" helper, and the sandbox has no pty, so each one waits forever
# (the helpers show as defunct; the check hung for hours at 0% CPU, twice).
# gawk's pty1 test fails for the same reason.
options = ["!check"]

source = [
    { url = "https://ftp.gnu.org/gnu/texinfo/texinfo-7.2.tar.xz", sha256 = "0329d7788fbef113fa82cb80889ca197a344ce0df7646fe000974c5d714363a6" },
]

setup = '''
%configure \
    --disable-perl-xs
'''
build = '''
%make
'''
install = '''
%make_install
'''
