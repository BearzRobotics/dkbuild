# cports is BSD-2-Clause, Copyright (c) Chimera Linux contributors.
name = "tdb"
version = "1.4.15"
release = 1
summary = "Simple database API similar to gdbm"
license = "LGPL-3.0-or-later"
homepage = "https://tdb.samba.org"
hostdeps = ["docbook-xsl-nons", "gettext", "libxslt", "pkgconf", "python"]
builddeps = ["python-devel", "gettext-devel"]
options = ["!cross"]

source = [
    { url = "https://download.samba.org/pub/tdb/tdb-1.4.15.tar.gz", sha256 = "fba09d8df1f1b9072aeae8e78b2bd43c5afef20b2f6deefa633aa14a377a8dd2" },
]

environment = '''
# waf, not its wrapper makefile
export PYTHONHASHSEED=1 WAF_MAKE=1
'''
setup = '''
./configure --prefix=/usr --libdir=/usr/lib \
    --disable-rpath --disable-rpath-install \
    --builtin-libraries=replace --bundled-libraries=NONE
'''
build = '''
./buildtools/bin/waf build -j$jobs
'''
install = '''
./buildtools/bin/waf install --destdir="$pkgdir"
'''

[subpackages.progs]
summary = "Programs"
paths   = ["/usr/bin"]

[subpackages.python]
summary = "Python bindings"
depends = ["python"]
paths   = ["/usr/lib/python*"]
