# Imported from Chimera Linux cports: user/tree-sitter-lua/template.py (cports is BSD-2-Clause, Copyright (c) Chimera Linux contributors).
# Parser sources are pre-generated in the release (src/parser.c), so the tree-sitter CLI is not needed.
# The links in /usr/lib/tree-sitter are the parser directory neovim reads
# (its runtime/parser is a link to it; see the neovim recipe).
name = "tree-sitter-lua"
version = "0.5.0"
release = 1
summary = "Lua grammar for tree-sitter"
license = "MIT"
homepage = "https://github.com/tree-sitter-grammars/tree-sitter-lua"
hostdeps = ["pkgconf"]
options = ["!check"]

source = [
    { url = "https://github.com/tree-sitter-grammars/tree-sitter-lua/archive/v0.5.0.tar.gz", sha256 = "cf01b93f4b61b96a6d27942cf28eeda4cbce7d503c3bef773a8930b3d778a2d9" },
]

build = '''
# keep make from running the tree-sitter CLI: the generated files must not look older than grammar.js
touch src/grammar.json src/parser.c 2>/dev/null || true
%make PREFIX=/usr LIBDIR=/usr/lib
'''
install = '''
%make_install PREFIX=/usr LIBDIR=/usr/lib
install -Dm644 LICENSE.md "$pkgdir/usr/share/licenses/tree-sitter-lua/LICENSE.md"
mkdir -p "$pkgdir/usr/lib/tree-sitter"
ln -s "../$(basename "$(find "$pkgdir/usr/lib" -maxdepth 1 -name 'libtree-sitter-lua.so.*' -type l | head -1)")" "$pkgdir/usr/lib/tree-sitter/lua.so"
'''
