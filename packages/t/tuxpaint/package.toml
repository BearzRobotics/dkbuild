# Tux Paint: a drawing program for children (ages 3 to 12), with stamps,
# magic tools and sounds; tuxpaint-stamps adds thousands of stamp pictures.
name = "tuxpaint"
version = "0.9.35"
release = 1
summary = "Drawing program for children"
license = "GPL-2.0-or-later"
homepage = "https://tuxpaint.org"
hostdeps = ["pkgconf", "gettext"]
builddeps = ["sdl2-compat-devel", "sdl2-image-devel", "sdl2-ttf-devel", "sdl2-mixer-devel", "sdl2-gfx-devel", "sdl2-pango-devel", "pango-devel", "librsvg-devel", "cairo-devel", "libpng-devel", "fribidi-devel", "libxml2-devel", "libimagequant-devel", "libpaper-devel", "zlib-ng-compat-devel", "gettext-devel", "fontconfig-devel"]
rundeps = ["tuxpaint-stamps"]
options = ["!check"]

source = [
    { url = "https://downloads.sourceforge.net/project/tuxpaint/tuxpaint/0.9.35/tuxpaint-0.9.35.tar.gz", sha256 = "c1c18af91be77e94fdaab2c928204c4c39ba39ac5da2f441aaf2ecab6d8bd0ad" },
]

build = '''
make PREFIX=/usr CC="$CC" -j$jobs
'''
install = '''
make PREFIX=/usr DESTDIR="$pkgdir" CC="$CC" install
install -Dm644 docs/COPYING.txt "$pkgdir/usr/share/licenses/tuxpaint/COPYING.txt"
'''
