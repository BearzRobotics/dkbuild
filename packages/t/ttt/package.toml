# TTT (Terminal Text Tool): a terminal editor with a GUI-like feel.
# Go modules vendored on the host (`godeps`); built offline like its Makefile.
name = "ttt"
version = "1.11.0"
release = 1
summary = "Terminal text editor that feels like a GUI"
license = "MIT"
homepage = "https://github.com/eugenioenko/ttt"
hostdeps = ["go"]
options = ["!check", "godeps"]

source = [
    { url = "https://github.com/eugenioenko/ttt/archive/refs/tags/v1.11.0.tar.gz", sha256 = "1999de35f255ef89fbf6af79326455716b1e0ef6a4c983053ad0b0415911ac57" },
]

environment = '''
export GOFLAGS="-mod=vendor -trimpath -buildvcs=false" GOTOOLCHAIN=local GOPROXY=off
export GOCACHE=/tmp/go-cache GOPATH=/tmp/go CGO_ENABLED=0
'''
build = '''
go build -ldflags "-X main.version=1.11.0" -o bin/ttt ./cmd/ttt
'''
install = '''
install -Dm755 bin/ttt "$pkgdir/usr/bin/ttt"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/ttt/LICENSE"
'''
