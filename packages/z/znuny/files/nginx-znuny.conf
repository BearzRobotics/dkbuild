# Znuny under nginx: /znuny/ to Starman (znuny-web, localhost:5000), the
# static files from /opt/znuny/var/httpd/htdocs. Copy to
# /etc/nginx/http.d/znuny.conf and set server_name and TLS.
server {
    listen 80;
    server_name servicedesk.example.org;
    client_max_body_size 64M;
    location = / { return 302 /znuny/index.pl; }
    location /znuny-web/ { alias /opt/znuny/var/httpd/htdocs/; expires 7d; }
    location /znuny/ {
        proxy_pass http://127.0.0.1:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }
}
