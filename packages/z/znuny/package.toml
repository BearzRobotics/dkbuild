# Znuny: service management and ticketing (the community continuation of
# OTRS): queues, escalations, SLAs, processes, a customer portal, ITSM.
# Perl; served by nginx proxying to its PSGI application under Starman, with
# Znuny's daemon beside it (two dinit services), on MariaDB or PostgreSQL.
# Its CPAN dependencies (the required modules, the MariaDB, PostgreSQL and
# ODBC drivers, LDAP, JSON::XS, Text::CSV_XS, XSLT, the Excel writers, JWT,
# bcrypt, X.509, Plack and Starman: 133 distributions, resolved through
# MetaCPAN with their own dependencies, less Perl's core and what the tree
# packages) are this recipe's sources, built in dependency order
# (files/cpan-order.txt) into /usr/lib/znuny/perl5. DBD::mysql is 4.052, the
# last that builds against MariaDB's client. JavaScript::Minifier::XS is not
# included (Znuny falls back to its pure-Perl minifier).
# Home: /opt/znuny, as upstream expects. Setup: /usr/share/doc/znuny/README.FenrirOS.
name = "znuny"
version = "7.3.8"
release = 1
summary = "Service management and ticketing system (OTRS community edition)"
license = "GPL-3.0-only"
homepage = "https://www.znuny.org"
archs = ["x86_64", "aarch64"]
hostdeps = ["perl", "make", "pkgconf"]
builddeps = ["perl", "libxml2-devel", "libxslt-devel", "mariadb", "mariadb-devel", "postgresql-devel", "unixodbc-devel",
             "openssl-devel", "zlib-ng-compat-devel", "libexpat-devel",
             "perl-moo", "perl-json", "perl-io-socket-ssl", "perl-net-ssleay", "perl-uri", "perl-template-toolkit",
             "perl-xml-parser", "perl-role-tiny", "perl-sub-quote", "perl-class-method-modifiers", "perl-path-tiny",
             "perl-parse-yapp", "perl-locale-gettext"]
rundeps = ["perl", "perl-moo", "perl-json", "perl-io-socket-ssl", "perl-net-ssleay", "perl-uri", "perl-template-toolkit",
           "perl-xml-parser", "perl-role-tiny", "perl-sub-quote", "perl-class-method-modifiers", "perl-path-tiny",
           "perl-parse-yapp", "perl-locale-gettext", "nginx", "cronie"]
options = ["!check"]

