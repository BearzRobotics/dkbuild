environment = '''
export PERL_MM_USE_DEFAULT=1 PERL_MM_NONINTERACTIVE=1 ALIEN_INSTALL_TYPE=system NO_NETWORK_TESTING=1
export PERL5LIB=/tmp/zperl/lib/perl5 PATH="/tmp/zperl/bin:$PATH"
'''
build = '''
mkdir -p /tmp/cpan /tmp/zperl
grep -v '^#' $pkgfiles/cpan-order.txt | while read -r t; do
    echo "==> $t"
    rm -rf /tmp/cpan/src && mkdir -p /tmp/cpan/src
    tar -xzf "/build/sources/$t" -C /tmp/cpan/src --no-same-owner
    cd /tmp/cpan/src/*/
    if [ -f Makefile.PL ]; then
        perl Makefile.PL INSTALL_BASE=/tmp/zperl && make -j$jobs && make install
    else
        perl Build.PL --install_base /tmp/zperl && ./Build && ./Build install
    fi
    cd /build
done
test -x /tmp/zperl/bin/starman
'''
install = '''
d="$pkgdir/opt/znuny"
mkdir -p "$d"
cp -a . "$d/"
mkdir -p "$pkgdir/usr/lib/znuny"
cp -a /tmp/zperl "$pkgdir/usr/lib/znuny/perl5"
find "$pkgdir/usr/lib/znuny/perl5" \( -name .packlist -o -name perllocal.pod \) -delete
install -Dm755 $pkgfiles/znuny-web.sh "$pkgdir/usr/lib/znuny/znuny-web"
install -Dm755 $pkgfiles/znuny-daemon.sh "$pkgdir/usr/lib/znuny/znuny-daemon"
install -Dm755 $pkgfiles/znuny.sh "$pkgdir/usr/bin/znuny"
install -Dm644 $pkgfiles/znuny-web "$pkgdir/etc/dinit.d/znuny-web"
install -Dm644 $pkgfiles/znuny-daemon "$pkgdir/etc/dinit.d/znuny-daemon"
install -Dm644 $pkgfiles/sysusers.conf "$pkgdir/usr/lib/sysusers.d/znuny.conf"
install -Dm644 /dev/stdin "$pkgdir/usr/lib/tmpfiles.d/znuny.conf" <<EOF2
Z /opt/znuny/var 0755 znuny znuny -
z /opt/znuny/Kernel 0755 znuny znuny -
EOF2
install -Dm644 $pkgfiles/nginx-znuny.conf "$pkgdir/usr/share/doc/znuny/nginx-znuny.conf"
install -Dm644 $pkgfiles/README.FenrirOS "$pkgdir/usr/share/doc/znuny/README.FenrirOS"
install -Dm644 COPYING "$pkgdir/usr/share/licenses/znuny/COPYING"
'''
