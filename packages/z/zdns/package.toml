# Fast CLI DNS Lookup Tool. (BlackArch list, requested 2026-11-16; docs/requests.md). Written from the template of ffuf; not built yet when written (wip/queue): expect first-build fixes.
# Go module, dependencies fetched on the host (godeps). Main package: ..
name = "zdns"
version = "2.1.1"
release = 1
summary = "Fast CLI DNS Lookup Tool."
license = "Apache-2.0"
homepage = "https://github.com/zmap/zdns"
hostdeps = ["go"]
options = ["!check", "godeps"]

source = [
    { url = "https://github.com/zmap/zdns/archive/refs/tags/v2.1.1.tar.gz", sha256 = "8c19de292894002b2fd189a49363aa3d73cd3938c4ff347f8d09b427ad8b0e4a" },
]

environment = '''
export GOFLAGS="-mod=mod -trimpath -buildvcs=false" GOTOOLCHAIN=local GOPROXY=off
export GOCACHE=/tmp/go-cache GOPATH=/tmp/go CGO_ENABLED=0
'''
build = '''
mkdir -p build
go build -o build/zdns .
'''
install = '''
install -Dm755 build/zdns "$pkgdir/usr/bin/zdns"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/zdns/LICENSE"
'''
