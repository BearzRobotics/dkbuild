name = "zlib-ng-compat"
version = "2.3.3"
release = 2
summary = "Implementation of zlib compression library"
license = "Zlib"
homepage = "https://github.com/zlib-ng/zlib-ng"
patches = ["armv7.patch", "no-weird-ver.patch"]
hostdeps = ["pkgconf"]
options = ["bootstrap"]

source = [
    { url = "https://github.com/zlib-ng/zlib-ng/archive/refs/tags/2.3.3.tar.gz", sha256 = "f9c65aa9c852eb8255b636fd9f07ce1c406f061ec19a2e7d508b318ca0c907d1" },
]

environment = '''
export CFLAGS="${CFLAGS} -fPIC"
'''
setup = '''
./configure \
    --prefix=/usr \
    --shared \
    --zlib-compat
'''
build = '''
%make
'''
check = '''
%make check
'''
install = '''
%make_install
'''
