# Zabbix frontend under nginx with php-fpm (/run/php-fpm.sock).
# Copy to /etc/nginx/http.d/zabbix.conf, set server_name and TLS.
server {
    listen 80;
    server_name zabbix.example.org;
    root /usr/share/zabbix/frontend;
    index index.php;
    location = /favicon.ico { log_not_found off; }
    location / { try_files $uri $uri/ =404; }
    location ~ /(api\/|conf[^\.]|include|locale|vendor) { deny all; return 404; }
    location ~ [^/]\.php(/|$) {
        fastcgi_pass unix:/run/php-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}
