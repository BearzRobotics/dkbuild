# ZAP from source (Gradle, dependencies from the store). Add-ons it downloads at
# run time land in ~/.ZAP.
# The add-ons of a main release (zap/src/main/main-add-ons.yml, 50 .zap files from
# zap-extensions' GitHub releases, each with the SHA-256 the file lists) are
# sources here and laid into zap/build/mainAddOns, where the downloadMainAddOns
# task finds them with the right hash and downloads nothing (offline).
