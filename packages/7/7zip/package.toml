name = "7zip"
version = "26.03"
release = 1
summary = "File archiver with a high compression ratio"
license = "LGPL-2.0-only AND BSD-3-Clause AND custom:unrar"
homepage = "https://7-zip.org"
patches = ["7-zip-flags.patch"]

source = [
    { url = "https://7-zip.org/a/7z2603-src.tar.xz", sha256 = "9cbde5099c6deb73691b0579063da5827522ccbbcba3f0020fd04e8c8c16c0d4" },
]

build = '''
# Alone2: the command-line 7zz with every format. Without the assembler
# (uasm, no recipe yet): C code only, somewhat slower on 7z.
cd CPP/7zip/Bundles/Alone2
%make -f ../../cmpl_clang.mak CC=clang CXX=clang++ \
    CFLAGS_WARN_WALL= CFLAGS_WARN=
'''
check = '''
cd CPP/7zip/Bundles/Alone2
b/c/7zz a -y /tmp/xxx.7z ../../../../C ../../../../Asm
b/c/7zz x -y -o/tmp/x /tmp/xxx.7z
'''
install = '''
install -Dm644 DOC/License.txt "$pkgdir/usr/share/licenses/7zip/License.txt"
install -Dm644 DOC/unRarLicense.txt "$pkgdir/usr/share/licenses/7zip/unRarLicense.txt"
install -Dm755 CPP/7zip/Bundles/Alone2/b/c/7zz "$pkgdir/usr/bin/7zz"
ln -sf 7zz "$pkgdir/usr/bin/7z"
'''
