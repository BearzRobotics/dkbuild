# dkbuild upstream: per-package overrides for the release check (src/scripts/upstream.py).
#   series = "8.6."     only versions starting with this (stay on a major series)
#   url = "..."         check this repository or page instead of the first source
#   regex = "..."       group 1 is the version, matched against tags or page text
#   ignore = "..."      versions matching this regex are never reported
#   skip = "reason"     not checked
#   prerelease = true   report pre-releases too. Without it none is ever reported: the tree ships releases, and a
#                       pre-release only where that was chosen on purpose.
# Adding an entry here never changes a recipe's build hash.

[linux-lts]
series = "6.18."    # the long-term series this package follows; later numbers are not long-term releases

[openssl]
series = "3.5."     # the long-term series (to 2030); moving to a 4.x long-term release is planned, not automatic

# Kept on pre-releases by the user's decision (2026-11-25), so newer ones are reported for these:
[libcaca]
prerelease = true   # 0.99 has only ever had betas

[simde]
prerelease = true

[winlab]
prerelease = true

[pcsx2]
ignore = "^2\\.9\\."     # 2.9.x are the nightly builds of the next release; nothing in the number says so

[msedit]
prerelease = true   # opted in: the editor is built from its git main branch on purpose

["gtk+2"]
series = "2.24."    # GTK 2's last series; 3.89-3.99 were GTK 4's development releases

[tcl]
series = "8.6."     # Tcl 9 is not source-compatible; the tree's users want 8.6

[tk]
series = "8.6."

["gtk+3"]
series = "3.24."    # GTK 3's last series; 3.9x was GTK 4's development series

[libmspack]
prerelease = true   # kept by the user's decision (2026-11-25)
regex = "libmspack-([0-9.]+)alpha"   # every release is named "<n>alpha"

[brush]
regex = "brush-shell-v([0-9.]+)"   # the repository also tags its library crates (brush-core-v0.5.0 is not a shell release)
