# enforza-cockpit: a Cockpit plugin (a menu entry "Firewall (enforza)") that edits a local
# nftables ruleset. Plain static files plus dist/enforza-nft.py, which Cockpit's bridge runs;
# "building" is copying dist/ to /usr/share/cockpit/enforza. No release tags: pinned to
# commit ba31dd08 (2026-07-08). In wip/queue until the cockpit package exists (rundeps).
name = "enforza-cockpit"
version = "20260708"
release = 1
summary = "Cockpit plugin: nftables firewall GUI"
license = "MIT"
homepage = "https://github.com/enforza/enforza-cockpit"
rundeps = ["cockpit", "nftables", "python"]
options = ["!check", "!strip"]

source = [
    { url = "https://github.com/enforza/enforza-cockpit/archive/ba31dd08e2f917466a0ba4ac915e30eee41824c4.tar.gz", sha256 = "71341e676adfedb0c0af6847abc05590e84af1ed93dc2dac6ffa83972639742a" },
]

install = '''
install -dm755 "$pkgdir/usr/share/cockpit/enforza"
cp -r dist/. "$pkgdir/usr/share/cockpit/enforza/"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/enforza-cockpit/LICENSE"
'''
