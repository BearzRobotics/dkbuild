# xclip: X11 clipboard command-line tool (for the XWayland clients the dotfiles' scripts feed).
name = "xclip"
version = "0.13"
release = 1
summary = "X11 clipboard command-line interface"
license = "GPL-2.0-or-later"
homepage = "https://github.com/astrand/xclip"
archs = ["x86_64", "aarch64"]
hostdeps = ["autoconf", "automake", "pkgconf"]
builddeps = ["libx11-devel", "libxmu-devel", "libxt-devel"]
options = ["!check"]

source = [
    { url = "https://github.com/astrand/xclip/archive/refs/tags/0.13.tar.gz", sha256 = "ca5b8804e3c910a66423a882d79bf3c9450b875ac8528791fb60ec9de667f758" },
]

setup = '''
autoreconf -fi
%configure
'''
build = '''
%make
'''
install = '''
%make_install
'''
