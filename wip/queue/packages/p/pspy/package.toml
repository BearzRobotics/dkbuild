# Monitor linux processes without root permissions. (BlackArch list, requested 2026-11-16; docs/requests.md). Written from the template of ffuf; not built yet when written (wip/queue): expect first-build fixes.
# Go module, dependencies fetched on the host (godeps). Main package: ..
name = "pspy"
version = "1.2.1"
release = 1
summary = "Monitor linux processes without root permissions."
license = "GPL-3.0"
homepage = "https://github.com/DominicBreuker/pspy"
hostdeps = ["go"]
options = ["!check", "godeps"]

source = [
    { url = "https://github.com/DominicBreuker/pspy/archive/refs/tags/v1.2.1.tar.gz", sha256 = "795ed15f313ee1ee165d87d8b3ce558790eb17c8bfde2d9e227f1be38f775409" },
]

environment = '''
export GOFLAGS="-mod=mod -trimpath -buildvcs=false" GOTOOLCHAIN=local GOPROXY=off
export GOCACHE=/tmp/go-cache GOPATH=/tmp/go CGO_ENABLED=0
'''
build = '''
mkdir -p build
go build -o build/pspy .
'''
install = '''
install -Dm755 build/pspy "$pkgdir/usr/bin/pspy"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/pspy/LICENSE"
'''
