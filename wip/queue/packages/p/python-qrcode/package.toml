# qrcode from PyPI, added for OnionShare (requested 2026-11-17). Not built yet (wip/queue).
name = "python-qrcode"
version = "8.2"
release = 1
summary = "QR Code image generator"
license = "BSD-3-Clause"
homepage = "https://github.com/lincolnloop/python-qrcode"
hostdeps = ["python", "python-setuptools", "python-wheel", "python-poetry-core"]
rundeps = ["python"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/8f/b2/7fc2931bfae0af02d5f53b174e9cf701adbb35f39d69c2af63d4a39f81a9/qrcode-8.2.tar.gz", sha256 = "35c3f2a4172b33136ab9f6b3ef1c00260dd2f66f858f24d88418a015f446506c" },
]

install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-qrcode/$(basename LICENSE)"
'''
