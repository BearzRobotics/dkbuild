# sniffio from PyPI, added for ahmia-site (requested 2026-11-17). Not built yet (wip/queue).
name = "python-sniffio"
version = "1.3.1"
release = 1
summary = "Sniff out which async library your code is running under"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/python-trio/sniffio"
hostdeps = ["python", "python-setuptools", "python-wheel"]
rundeps = ["python"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/a2/87/a6771e1546d97e7e041b6ae58d80074f81b7d5121207425c964ddf5cfdbd/sniffio-1.3.1.tar.gz", sha256 = "f4324edc670a0f49750a81b895f35c3adb843cca46f0530f79fc1babb23789dc" },
]

install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE.APACHE2 "$pkgdir/usr/share/licenses/python-sniffio/LICENSE.APACHE2"
install -Dm644 LICENSE.MIT "$pkgdir/usr/share/licenses/python-sniffio/LICENSE.MIT"
'''
