# sqlparse from PyPI, added for ahmia-site (requested 2026-11-17). Not built yet (wip/queue).
name = "python-sqlparse"
version = "0.6.1"
release = 1
summary = "A non-validating SQL parser"
license = "BSD-3-Clause"
homepage = "https://github.com/andialbrecht/sqlparse"
hostdeps = ["python", "python-setuptools", "python-wheel", "python-hatchling"]
rundeps = ["python"]
options = ["!check"]

source = [
    { url = "https://files.pythonhosted.org/packages/7e/e0/361c764ea58cc1a75f7b4b424a74b08449db8bfa5e9199c7275999fdd1b9/sqlparse-0.6.1.tar.gz", sha256 = "ca722573f848ff2d30e40ea30f53a104b7dea7635ea9285891263eb2c58fb6e7" },
]

install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
    --root "$pkgdir" --prefix /usr .
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/python-sqlparse/LICENSE"
'''
