# VirusTotal Command Line Interface. (BlackArch list, requested 2026-11-16; docs/requests.md). Written from the template of ffuf; not built yet when written (wip/queue): expect first-build fixes.
# Go module, dependencies fetched on the host (godeps). Main package: vt.
name = "vt-cli"
version = "1.3.1"
release = 1
summary = "VirusTotal Command Line Interface."
license = "Apache-2.0"
homepage = "https://github.com/VirusTotal/vt-cli"
hostdeps = ["go"]
options = ["!check", "godeps"]

source = [
    { url = "https://github.com/VirusTotal/vt-cli/archive/refs/tags/1.3.1.tar.gz", sha256 = "3d95ddab1da71ee769ec65e3ed087994fc837d2d234f9c2640c669c8ce8c7d7a" },
]

environment = '''
export GOFLAGS="-mod=mod -trimpath -buildvcs=false" GOTOOLCHAIN=local GOPROXY=off
export GOCACHE=/tmp/go-cache GOPATH=/tmp/go CGO_ENABLED=0
'''
build = '''
mkdir -p build
go build -o build/vt ./vt
'''
install = '''
install -Dm755 build/vt "$pkgdir/usr/bin/vt"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/vt-cli/LICENSE"
'''
