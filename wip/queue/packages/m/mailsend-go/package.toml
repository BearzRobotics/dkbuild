# A multi-platform command line tool to send mail via SMTP protocol. (BlackArch list, requested 2026-11-16; docs/requests.md). Written from the template of ffuf; not built yet when written (wip/queue): expect first-build fixes.
# Go module, dependencies fetched on the host (godeps). Main package: ..
name = "mailsend-go"
version = "1.0.14"
release = 1
summary = "A multi-platform command line tool to send mail via SMTP protocol."
license = "MIT"
homepage = "https://github.com/muquit/mailsend-go"
hostdeps = ["go"]
options = ["!check", "godeps"]

source = [
    { url = "https://github.com/muquit/mailsend-go/archive/refs/tags/v1.0.14.tar.gz", sha256 = "7c791c49da486c1d8cd084ff97720eb7133c9fbe24272fa9d9912389cffad864" },
]

environment = '''
export GOFLAGS="-mod=mod -trimpath -buildvcs=false" GOTOOLCHAIN=local GOPROXY=off
export GOCACHE=/tmp/go-cache GOPATH=/tmp/go CGO_ENABLED=0
'''
build = '''
mkdir -p build
go build -o build/mailsend-go .
'''
install = '''
install -Dm755 build/mailsend-go "$pkgdir/usr/bin/mailsend-go"
install -Dm644 LICENSE.txt "$pkgdir/usr/share/licenses/mailsend-go/LICENSE.txt"
'''
