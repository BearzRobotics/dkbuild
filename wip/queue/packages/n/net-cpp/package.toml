# C++ HTTP client library over libcurl (Lomiri): Ubuntu Touch / UBports (Lomiri) component, version 3.2.2. Recipe written after Alpine
# Linux's testing/net-cpp (MIT-licensed APKBUILD and patches; the software's licence is LGPL-3.0-only).
