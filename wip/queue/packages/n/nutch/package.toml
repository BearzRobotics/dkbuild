# Apache Nutch 1.x: a highly extensible, scalable web crawler (Java; runs on Hadoop, here in local mode with its plugin set: parse-tika, protocol-http,
# indexer-solr, indexer-elastic, urlfilters, scoring, ...). Built with Ant and Ivy from the release tag.
# Offline Ivy: build.xml and the plugins' build files resolve their libraries with Ivy over the network (ivy/ivysettings.xml, 79 ivy.xml files).
# The engine's mavendeps gives them a store: patches/maven-resolution-poms.patch adds dk-maven/, a Maven aggregator with one module per ivy.xml
# (generated by files/ivy2pom.py: the same coordinates, `->master` as a dependency without its transitive ones, excludes kept, ${properties} from the
# tree's .properties files, test configuration as test scope, plus org.apache.ivy:ivy, the jar Ant's Ivy tasks are loaded from), the `restore` step lets
# Maven fetch everything with the network once, and the build runs Ivy against that store as a file:// repository
# (-Drepo.maven.org=file:///dkdeps/maven/, a property ivysettings.xml reads) with the Ivy jar from it (-Divy.jar). Same versions as upstream's build.
# Installed inert (docs/requests.md): nothing runs by itself; the configuration is the upstream default (/etc/nutch), and http.agent.name is unset:
# Nutch will not fetch until the administrator sets it. /usr/bin/nutch is a wrapper that sets NUTCH_HOME, NUTCH_CONF_DIR and the log directory.
# Not built yet when written (wip/queue): expect first-build fixes.
name = "nutch"
version = "1.23"
release = 1
summary = "Extensible, scalable web crawler (Hadoop, Tika, Solr/Elasticsearch indexers)"
license = "Apache-2.0"
homepage = "https://nutch.apache.org"
archs = ["x86_64", "aarch64"]
hostdeps = ["openjdk21", "apache-ant", "git"]
rundeps = ["openjdk21", "bash"]
options = ["!check", "mavendeps", "!strip"]
patches = ["maven-resolution-poms.patch"]

source = [
    { url = "https://github.com/apache/nutch/archive/refs/tags/release-1.23.tar.gz", sha256 = "ad42e1af12e0ccd03f1b941531e7218da42fe010abfc8a898df6aec4888a22bb", name = "nutch-1.23.tar.gz" },
    { url = "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.11/apache-maven-3.9.11-bin.tar.gz", sha256 = "4b7195b6a4f5c81af4c0212677a32ee8143643401bc6e1e8412e6b06ea82beac", unpack = false },
]

environment = '''
export JAVA_HOME=/usr/lib/jvm/java-21-openjdk
'''
restore = '''
mvn -f dk-maven/pom.xml dependency:go-offline
'''
build = '''
ivyjar=/dkdeps/maven/org/apache/ivy/ivy/2.5.3/ivy-2.5.3.jar
test -f "$ivyjar"
ant -Divy.jar="$ivyjar" -Drepo.maven.org=file:///dkdeps/maven/ runtime
'''
install = '''
d="$pkgdir/usr/share/nutch"
mkdir -p "$d" "$pkgdir/etc"
cp -a runtime/local/. "$d/"
# the configuration lives in /etc/nutch
mv "$d/conf" "$pkgdir/etc/nutch"
ln -s /etc/nutch "$d/conf"
rm -rf "$d/logs"
install -Dm755 $pkgfiles/nutch "$pkgdir/usr/bin/nutch"
install -Dm644 LICENSE.txt "$pkgdir/usr/share/licenses/nutch/LICENSE.txt"
install -Dm644 NOTICE.txt "$pkgdir/usr/share/licenses/nutch/NOTICE.txt"
'''
