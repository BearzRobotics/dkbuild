# Amazon S3 bucket enumeration. (BlackArch list, requested 2026-11-16; docs/requests.md). Written from the template of ffuf; not built yet when written (wip/queue): expect first-build fixes.
# Go module, dependencies fetched on the host (godeps). Main package: ..
name = "s3enum"
version = "1.1.0"
release = 1
summary = "Amazon S3 bucket enumeration."
license = "ISC"
homepage = "https://github.com/koenrh/s3enum"
hostdeps = ["go"]
options = ["!check", "godeps"]

source = [
    { url = "https://github.com/koenrh/s3enum/archive/refs/tags/v1.1.0.tar.gz", sha256 = "aeb1a56d03bc267a72ba42c74889ee2dd2eb50155830383dd6c7f79abc8936f3" },
]

environment = '''
export GOFLAGS="-mod=mod -trimpath -buildvcs=false" GOTOOLCHAIN=local GOPROXY=off
export GOCACHE=/tmp/go-cache GOPATH=/tmp/go CGO_ENABLED=0
'''
build = '''
mkdir -p build
go build -o build/s3enum .
'''
install = '''
install -Dm755 build/s3enum "$pkgdir/usr/bin/s3enum"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/s3enum/LICENSE"
'''
