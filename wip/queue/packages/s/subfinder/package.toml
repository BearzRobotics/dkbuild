# Modular subdomain discovery tool that can discover massive amounts of valid subdomains... (BlackArch list, requested 2026-11-16; docs/requests.md). Written from the template of ffuf; not built yet when written (wip/queue): expect first-build fixes.
# Go module, dependencies fetched on the host (godeps). Main package: cmd/subfinder.
name = "subfinder"
version = "2.17.0"
release = 1
summary = "Modular subdomain discovery tool that can discover massive amounts of valid subdomains..."
license = "MIT"
homepage = "https://github.com/projectdiscovery/subfinder"
hostdeps = ["go"]
options = ["!check", "godeps"]

source = [
    { url = "https://github.com/projectdiscovery/subfinder/archive/refs/tags/v2.17.0.tar.gz", sha256 = "f9fffdfac6b9668eb8497e661a6ccd24cf83a0f459a41902ad0a782e63b39a2b" },
]

environment = '''
export GOFLAGS="-mod=mod -trimpath -buildvcs=false" GOTOOLCHAIN=local GOPROXY=off
export GOCACHE=/tmp/go-cache GOPATH=/tmp/go CGO_ENABLED=0
'''
build = '''
mkdir -p build
go build -o build/subfinder ./cmd/subfinder
'''
install = '''
install -Dm755 build/subfinder "$pkgdir/usr/bin/subfinder"
install -Dm644 LICENSE.md "$pkgdir/usr/share/licenses/subfinder/LICENSE.md"
'''
