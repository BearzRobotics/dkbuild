# SearXNG settings of this machine: everything not set here keeps SearXNG's defaults.
# The secret_key below MUST be replaced before the service is started (SearXNG refuses
# to start with the default one): `openssl rand -hex 32`.
use_default_settings: true
general:
  instance_name: "SearXNG"
search:
  formats:
    - html
    - json
server:
  bind_address: "127.0.0.1"
  port: 8888
  secret_key: "change-me-before-starting"
  limiter: false
  image_proxy: false
