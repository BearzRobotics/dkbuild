# sentry-native: Sentry's crash-reporting SDK for C/C++. Proton Bridge's GUI links it. Built
# with the in-process backend (SENTRY_BACKEND=inproc): the default, Crashpad, is a bundled
# third-party tree of submodules the tarball lacks, and breakpad's is the same. libcurl is the
# transport. Bridge only sends reports when a DSN is compiled in; the recipes leave it empty.
name = "sentry-native"
version = "0.17.6"
release = 1
summary = "Sentry crash-reporting SDK for C and C++"
license = "MIT"
homepage = "https://github.com/getsentry/sentry-native"
archs = ["x86_64", "aarch64"]
hostdeps = ["cmake", "ninja", "pkgconf"]
builddeps = ["curl-devel", "zlib-ng-compat-devel"]

source = [
    { url = "https://github.com/getsentry/sentry-native/archive/refs/tags/0.17.6.tar.gz", sha256 = "0c7a4d257453bd781ef88362ef786a07104bcdd99e3bb9bde6683fb98d0d2caa" },
]

setup = '''
%cmake \
    -DBUILD_SHARED_LIBS=ON \
    -DSENTRY_BACKEND=inproc \
    -DSENTRY_TRANSPORT=curl \
    -DSENTRY_BUILD_TESTS=OFF \
    -DSENTRY_BUILD_EXAMPLES=OFF
'''
build = '''
%cmake_build
'''
install = '''
%cmake_install
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/sentry-native/LICENSE"
'''
