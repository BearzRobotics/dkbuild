# SKELETON, not buildable yet. Zulip 13.3 (team chat with topic threading): Django + Tornado, PostgreSQL (with its own
# full-text search dictionary, hunspell/tsearch), Redis, RabbitMQ, memcached, nginx, supervisor, Puppet-managed
# configuration. Upstream supports only Debian/Ubuntu: its installer (scripts/lib/install, scripts/setup/*,
# puppet/zulip/*) and `tools/provision` assume apt packages, systemd/supervisor and /home/zulip/deployments/.
# Blockers, in order of cost:
#  1. The Python closure is ~250 pinned packages (requirements/prod.txt, from uv.lock) built into a venv by
#     scripts/lib/create-production-venv: a pydeps lock is possible (`dkbuild python-lock uv.lock`), but several
#     sdists need system C libraries (python-ldap/OpenLDAP, xmlsec/libxmlsec1, pyvips/libvips, psycopg2/libpq, cffi,
#     lxml) and zulip-specific forks/git dependencies (pyvips-binary, django-bitfield, python-zulip-api, ...) that are
#     git URLs in requirements: they need to be moved to sdists by hand.
#  2. The web app: node (pnpm-lock.yaml, ~2000 packages; webpack) through `./tools/webpack --prod` plus
#     `manage.py collectstatic`, `compilemessages`, emoji/pygments data generated by tools/setup/*; the tree can run
#     pnpm (vikunja pattern), the rest needs trial and error against the source release tarball.
#  3. Runtime: nothing here is inert-friendly as shipped (the installer runs Puppet to create users, supervisor
#     configs, nginx sites, postgres roles and a generated zulip-secrets.conf). A FenrirOS layout would have to
#     replace all of puppet/ with dinit services (uwsgi/Django, tornado, 8 queue workers, process_queue) and README steps.
#  4. Needs RabbitMQ (packages/r/rabbitmq-server is in a stash, unwritten), memcached (check), tsearch-extras gone
#     (zulip now uses the stock dictionary). Estimated: a day of work plus a few build iterations.
# Release tarball: https://download.zulip.com/server/zulip-server-13.3.tar.gz (contains the built webpack bundle? No:
# the server tarball ships sources and runs the build at install time: provision happens in the installer).
name = "zulip"
version = "13.3"
release = 1
summary = "Zulip team chat server (SKELETON)"
license = "Apache-2.0"
homepage = "https://zulip.com"
options = ["!check"]

install = '''
echo "zulip is a skeleton: see the header of this recipe" >&2
exit 1
'''
