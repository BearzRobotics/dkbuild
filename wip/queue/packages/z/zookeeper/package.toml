# Apache ZooKeeper: the coordination service (configuration, naming, leader election, locks) distributed systems are built on (Java). Built from the release
# tag with Maven 3.9.11 (a source of this recipe, the engine's mavendeps: the restore step builds once with the network into the shared Maven store,
# the build repeats the command offline). The server and the command-line tools (zkServer.sh, zkCli.sh) from the binary assembly.
# Needed by Marginalia Search (wip/queue/search-stack/NOTES.md) and a common dependency of Hadoop/Kafka/Solr clusters.
# Installed inert (docs/requests.md): dinit service shipped, not enabled; a standalone configuration on 127.0.0.1:2181 (no authentication: ZooKeeper's
# default; the admin web server is off); the _zookeeper user and empty data/log directories.
# Not built yet when written (wip/queue): expect first-build fixes.
name = "zookeeper"
version = "3.9.7"
release = 1
summary = "Coordination service for distributed systems"
license = "Apache-2.0"
homepage = "https://zookeeper.apache.org"
archs = ["x86_64", "aarch64"]
hostdeps = ["openjdk21", "git"]
rundeps = ["openjdk21", "bash"]
options = ["!check", "mavendeps", "!strip"]

source = [
    { url = "https://github.com/apache/zookeeper/archive/refs/tags/release-3.9.7.tar.gz", sha256 = "ee95377e1323032bebcf9ec418085af7ea850dfee7fffc7a2e1f224e25e53038", name = "zookeeper-3.9.7.tar.gz" },
    { url = "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.11/apache-maven-3.9.11-bin.tar.gz", sha256 = "4b7195b6a4f5c81af4c0212677a32ee8143643401bc6e1e8412e6b06ea82beac", unpack = false },
]

environment = '''
export JAVA_HOME=/usr/lib/jvm/java-21-openjdk
'''
restore = '''
mvn -DskipTests -Dmaven.javadoc.skip=true -Dcheckstyle.skip=true -Dspotbugs.skip=true -Drat.skip=true -Dowasp.skip=true package
'''
build = '''
mvn -DskipTests -Dmaven.javadoc.skip=true -Dcheckstyle.skip=true -Dspotbugs.skip=true -Drat.skip=true -Dowasp.skip=true package
'''
install = '''
t=$(ls zookeeper-assembly/target/apache-zookeeper-*-bin.tar.gz | head -n 1)
mkdir -p "$pkgdir/usr/share" /tmp/zk-x
tar -xzf "$t" -C /tmp/zk-x --no-same-owner
mv /tmp/zk-x/apache-zookeeper-* "$pkgdir/usr/share/zookeeper"
rm -f "$pkgdir"/usr/share/zookeeper/bin/*.cmd
install -Dm644 "$pkgdir/usr/share/zookeeper/conf/zoo_sample.cfg" "$pkgdir/usr/share/doc/zookeeper/zoo_sample.cfg"
rm -rf "$pkgdir/usr/share/zookeeper/conf"
install -Dm644 $pkgfiles/zoo.cfg "$pkgdir/etc/zookeeper/zoo.cfg"
install -Dm644 $pkgfiles/zookeeper.env "$pkgdir/etc/zookeeper/zookeeper.env"
ln -s /etc/zookeeper "$pkgdir/usr/share/zookeeper/conf"
mkdir -p "$pkgdir/usr/bin"
for t in zkCli zkServer; do ln -s ../share/zookeeper/bin/$t.sh "$pkgdir/usr/bin/$t"; done
install -Dm644 $pkgfiles/zookeeper "$pkgdir/etc/dinit.d/zookeeper"
install -Dm644 $pkgfiles/sysusers.conf "$pkgdir/usr/lib/sysusers.d/zookeeper.conf"
install -Dm644 $pkgfiles/tmpfiles.conf "$pkgdir/usr/lib/tmpfiles.d/zookeeper.conf"
install -Dm644 LICENSE.txt "$pkgdir/usr/share/licenses/zookeeper/LICENSE.txt"
install -Dm644 NOTICE.txt "$pkgdir/usr/share/licenses/zookeeper/NOTICE.txt"
'''
