# ZooKeeper, a single standalone server on this machine, loopback only.
# Every option: /usr/share/doc/zookeeper/zoo_sample.cfg and https://zookeeper.apache.org/doc/
tickTime=2000
dataDir=/var/lib/zookeeper
clientPort=2181
clientPortAddress=127.0.0.1
# the embedded admin web server (port 8080) is off
admin.enableServer=false
4lw.commands.whitelist=ruok,stat
