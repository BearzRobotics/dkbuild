# Fetch known URLs from AlienVault's Open Threat Exchange, the Wayback Machine, and... (BlackArch list, requested 2026-11-16; docs/requests.md). Written from the template of ffuf; not built yet when written (wip/queue): expect first-build fixes.
# Go module, dependencies fetched on the host (godeps). Main package: cmd/gau.
name = "gau"
version = "2.2.4"
release = 1
summary = "Fetch known URLs from AlienVault's Open Threat Exchange, the Wayback Machine, and..."
license = "MIT"
homepage = "https://github.com/lc/gau"
hostdeps = ["go"]
options = ["!check", "godeps"]

source = [
    { url = "https://github.com/lc/gau/archive/refs/tags/v2.2.4.tar.gz", sha256 = "537abafca9065a7ed5d93aa7722d85da0815abf6b08c2d1494483171558ce3f7" },
]

environment = '''
export GOFLAGS="-mod=mod -trimpath -buildvcs=false" GOTOOLCHAIN=local GOPROXY=off
export GOCACHE=/tmp/go-cache GOPATH=/tmp/go CGO_ENABLED=0
'''
build = '''
mkdir -p build
go build -o build/gau ./cmd/gau
'''
install = '''
install -Dm755 build/gau "$pkgdir/usr/bin/gau"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/gau/LICENSE"
'''
