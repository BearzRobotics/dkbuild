# SELinux policy library (libsepol): reads and writes binary policies: SELinux userspace 3.11. Needed by the Lomiri stack, version 3.11. Recipe written after Alpine
# Linux's testing/libsepol (MIT-licensed APKBUILD and patches; the software's licence is LGPL-2.0-or-later).
# Not built (queued, wip/queue): expect first-build fixes.
name = "libsepol"
version = "3.11"
release = 1
summary = "SELinux policy library (libsepol): reads and writes binary policies"
license = "LGPL-2.0-or-later"
homepage = "https://github.com/SELinuxProject/selinux"
hostdeps = ["make", "pkgconf", "flex"]
builddeps = ["musl-bsd-headers"]
options = ["!check"]

source = [
    { url = "https://github.com/SELinuxProject/selinux/releases/download/3.11/libsepol-3.11.tar.gz", sha256 = "79f3d2c88f44b7eb5cf54d9792e03232297e17f97a179163f2750099a00f164d" },
]

setup = '''
true
'''
build = '''
make -j$jobs SHLIBDIR=/usr/lib
'''
install = '''
make SHLIBDIR=/usr/lib DESTDIR="$pkgdir" install
'''
