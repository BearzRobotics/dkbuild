rundeps = ["dconf"]
options = ["!check"]

source = [
    { url = "https://gitlab.com/ubports/development/core/lomiri-thumbnailer/-/archive/3.1.3/lomiri-thumbnailer-3.1.3.tar.gz", sha256 = "a0760662106c97c8c788a3a2ee860f1d492eee8ddfbc70a1b3ce3eb06280a97b" },
]

setup = '''
