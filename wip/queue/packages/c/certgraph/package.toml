# Crawl the graph of certificate Alternate Names. (BlackArch list, requested 2026-11-16; docs/requests.md). Written from the template of ffuf; not built yet when written (wip/queue): expect first-build fixes.
# Go module, dependencies fetched on the host (godeps). Main package: ..
name = "certgraph"
version = "0.1.3"
release = 1
summary = "Crawl the graph of certificate Alternate Names."
license = "GPL-2.0"
homepage = "https://github.com/lanrat/certgraph"
hostdeps = ["go"]
options = ["!check", "godeps"]

source = [
    { url = "https://github.com/lanrat/certgraph/archive/refs/tags/v0.1.3.tar.gz", sha256 = "2f4cfc8bea214db05d958bc0faf468e97e646b0b2e6c9dba45f4ff122393cdc0" },
]

environment = '''
export GOFLAGS="-mod=mod -trimpath -buildvcs=false" GOTOOLCHAIN=local GOPROXY=off
export GOCACHE=/tmp/go-cache GOPATH=/tmp/go CGO_ENABLED=0
'''
build = '''
mkdir -p build
go build -o build/certgraph .
'''
install = '''
install -Dm755 build/certgraph "$pkgdir/usr/bin/certgraph"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/certgraph/LICENSE"
'''
