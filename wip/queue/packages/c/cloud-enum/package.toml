]

environment = '''
export SETUPTOOLS_SCM_PRETEND_VERSION=0.9 PDM_BUILD_SCM_VERSION=0.9
'''
install = '''
python3 -m pip install --no-deps --no-build-isolation --no-index --no-compile \
