# Multi-cloud OSINT tool. Enumerate public resources in AWS, Azure, and Google Cloud. (BlackArch list, requested 2026-11-16; docs/requests.md). Python application installed with pip from the source tarball, its dependencies are packages of the tree. Generated from pyproject/setup.py (setuptools.build_meta); not built yet when written (wip/queue): expect first-build fixes.
name = "cloud-enum"
