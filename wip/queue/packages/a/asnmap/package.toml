# Map organization network ranges using ASN information. (BlackArch list, requested 2026-11-16; docs/requests.md). Written from the template of ffuf; not built yet when written (wip/queue): expect first-build fixes.
# Go module, dependencies fetched on the host (godeps). Main package: cmd/asnmap.
name = "asnmap"
version = "1.2.0"
release = 1
summary = "Map organization network ranges using ASN information."
license = "MIT"
homepage = "https://github.com/projectdiscovery/asnmap"
hostdeps = ["go"]
options = ["!check", "godeps"]

source = [
    { url = "https://github.com/projectdiscovery/asnmap/archive/refs/tags/v1.2.0.tar.gz", sha256 = "f4c615392cf206930361588a03b3df8f46775faabf37b84a398068dbe7159008" },
]

environment = '''
export GOFLAGS="-mod=mod -trimpath -buildvcs=false" GOTOOLCHAIN=local GOPROXY=off
export GOCACHE=/tmp/go-cache GOPATH=/tmp/go CGO_ENABLED=0
'''
build = '''
mkdir -p build
go build -o build/asnmap ./cmd/asnmap
'''
install = '''
install -Dm755 build/asnmap "$pkgdir/usr/bin/asnmap"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/asnmap/LICENSE"
'''
