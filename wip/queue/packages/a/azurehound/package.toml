# Azure data exporter for BloodHound. (BlackArch list, requested 2026-11-16; docs/requests.md). Written from the template of ffuf; not built yet when written (wip/queue): expect first-build fixes.
# Go module, dependencies fetched on the host (godeps). Main package: ..
name = "azurehound"
version = "3.1.3"
release = 1
summary = "Azure data exporter for BloodHound."
license = "GPL-3.0"
homepage = "https://github.com/SpecterOps/AzureHound"
hostdeps = ["go"]
options = ["!check", "godeps"]

source = [
    { url = "https://github.com/SpecterOps/AzureHound/archive/refs/tags/v3.1.3.tar.gz", sha256 = "75337077b7f2fc7c61dc92c266c11a693db9e84d4d0299fa667114ab33c7dd11" },
]

environment = '''
export GOFLAGS="-mod=mod -trimpath -buildvcs=false" GOTOOLCHAIN=local GOPROXY=off
export GOCACHE=/tmp/go-cache GOPATH=/tmp/go CGO_ENABLED=0
'''
build = '''
mkdir -p build
go build -o build/AzureHound .
'''
install = '''
install -Dm755 build/AzureHound "$pkgdir/usr/bin/AzureHound"
install -Dm644 LICENSE.md "$pkgdir/usr/share/licenses/azurehound/LICENSE.md"
'''
