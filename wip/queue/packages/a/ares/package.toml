# Automated decoding of encrypted text without knowing the key or ciphers used. (BlackArch list, requested 2026-11-16; docs/requests.md). Written from the template of bashrs; not built yet when written (wip/queue): expect first-build fixes.
# Rust crate (binaries: ares), crates vendored on the host (cargodeps). OpenSSL is linked from the system.
name = "ares"
version = "0.11.0"
release = 1
summary = "Automated decoding of encrypted text without knowing the key or ciphers used."
license = "MIT"
homepage = "https://github.com/bee-san/Ares"
hostdeps = ["rust", "pkgconf", "cmake"]
builddeps = ["openssl-devel"]
options = ["!check", "cargodeps"]

source = [
    { url = "https://github.com/bee-san/Ares/archive/refs/tags/0.11.0.tar.gz", sha256 = "fd8751de6c46eb523d62d4ca52018b9127b9fa5fbd4a372b7f22e0f9957f030f" },
]

environment = '''
export CARGO_HOME=/tmp/cargo-home CARGO_NET_OFFLINE=true
'''
build = '''
cargo build --release --frozen --offline --locked -j $jobs
'''
install = '''
install -Dm755 target/release/ares "$pkgdir/usr/bin/ares"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/ares/LICENSE"
'''
