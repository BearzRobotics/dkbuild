# A portable volatile memory acquisition tool for Linux. (BlackArch list, requested 2026-11-16; docs/requests.md). Written from the template of bashrs; not built yet when written (wip/queue): expect first-build fixes.
# Rust crate (binaries: avml), crates vendored on the host (cargodeps). OpenSSL is linked from the system.
name = "avml"
version = "0.21.0"
release = 1
summary = "A portable volatile memory acquisition tool for Linux."
license = "MIT"
homepage = "https://github.com/microsoft/avml"
hostdeps = ["rust", "pkgconf"]
builddeps = ["openssl-devel"]
options = ["!check", "cargodeps"]

source = [
    { url = "https://github.com/microsoft/avml/archive/refs/tags/v0.21.0.tar.gz", sha256 = "7e4786a1b68349e281e200285c746729e36cce74f1eef8224b2934e9d2a8bcea" },
]

environment = '''
export CARGO_HOME=/tmp/cargo-home CARGO_NET_OFFLINE=true
'''
build = '''
cargo build --release --frozen --offline --locked -j $jobs
'''
install = '''
install -Dm755 target/release/avml "$pkgdir/usr/bin/avml"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/avml/LICENSE"
'''
