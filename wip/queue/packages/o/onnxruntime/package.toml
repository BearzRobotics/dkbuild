setup = '''
# the flatbuffers sources fetched for the build need a fix for musl's locale (Alpine's patch: the
# patch is applied to the flatbuffers tree here, before cmake uses it)
patch -p1 -d /build/flatbuffers-23.5.26 < "$pkgfiles/flatbuffers-locale.patch"
export CFLAGS="$CFLAGS -O2"
export CXXFLAGS="$CXXFLAGS -O2 -Wno-deprecated-declarations -Wno-error=template-id-cdtor -U_FORTIFY_SOURCE"
export LDFLAGS="$LDFLAGS -Wl,--copy-dt-needed-entries"
cmake -S cmake -B build -G Ninja \
    -DCMAKE_BUILD_TYPE=Release \
    -DCMAKE_INSTALL_PREFIX=/usr \
    -DCMAKE_INSTALL_LIBDIR=lib \
    -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
    -DFETCHCONTENT_FULLY_DISCONNECTED=ON \
    -DFETCHCONTENT_SOURCE_DIR_CXXOPTS=/build/cxxopts-3c73d91c0b04e2b59462f0a741be8c07024c1bc0 \
    -DFETCHCONTENT_SOURCE_DIR_DATE=/build/date-3.0.1 \
    -DFETCHCONTENT_SOURCE_DIR_DLPACK=/build/dlpack-5c210da409e7f1e51ddf445134a4376fdbd70d7d \
    -DFETCHCONTENT_SOURCE_DIR_EIGEN=/build/eigen-1d8b82b0740839c0de7f1242a3585e3390ff5f33 \
    -DFETCHCONTENT_SOURCE_DIR_FLATBUFFERS=/build/flatbuffers-23.5.26 \
    -DFETCHCONTENT_SOURCE_DIR_FP16=/build/FP16-0a92994d729ff76a58f692d3028ca1b64b145d91 \
    -DFETCHCONTENT_SOURCE_DIR_FXDIV=/build/FXdiv-63058eff77e11aa15bf531df5dd34395ec3017c8 \
    -DFETCHCONTENT_SOURCE_DIR_MICROSOFT_GSL=/build/GSL-4.2.1 \
    -DFETCHCONTENT_SOURCE_DIR_MP11=/build/mp11-boost-1.82.0 \
    -DFETCHCONTENT_SOURCE_DIR_ONNX=/build/onnx-1.22.0 \
    -DFETCHCONTENT_SOURCE_DIR_PSIMD=/build/psimd-072586a71b55b7f8c584153d223e95687148a900 \
    -DFETCHCONTENT_SOURCE_DIR_PTHREADPOOL=/build/pthreadpool-dcc9f28589066af0dbd4555579281230abbf74dd \
    -DFETCHCONTENT_SOURCE_DIR_PYTORCH_CPUINFO=/build/cpuinfo-66ee79c038d70dad9f08705b2c9b3e58f6d8f512 \
    -DFETCHCONTENT_SOURCE_DIR_SAFEINT=/build/SafeInt-3.0.28 \
    -DBUILD_ONNX_PYTHON=ON \
    -Donnxruntime_BUILD_SHARED_LIB=ON \
    -Donnxruntime_BUILD_UNIT_TESTS=OFF \
    -Donnxruntime_ENABLE_PYTHON=ON
'''
build = '''
cmake --build build
cd build
python3 ../setup.py build
'''
install = '''
DESTDIR="$pkgdir" cmake --install build
cd build
python3 ../setup.py install --skip-build --root="$pkgdir"
cd "$pkgdir"/usr/lib/python3*/site-packages/onnxruntime/capi
ln -sfv ../../../../libonnxruntime_providers_shared.so ../../../../libonnxruntime.so.* .
'''
