# ONNX Runtime 1.30: the inference engine for ONNX models (CPU), as the C/C++ library and its Python
# module (`import onnxruntime`), for fastembed and the other AI packages in the queue. After Alpine's
# community/onnxruntime (MIT-licensed APKBUILD and patches): system.patch makes it use this system's
# abseil, protobuf, re2 and nlohmann-json instead of fetching them, and its other patches fix the
# build on musl and drop a failing test.
# Offline: the project's cmake fetches about 14 more sources while it configures (cmake/deps.txt; Alpine's
# build uses the network, ours cannot). They are pinned here as further sources (GitHub archives of
# the same commits and tags as deps.txt, with our own sha256) and handed to FetchContent with
# FETCHCONTENT_SOURCE_DIR_<NAME>, FETCHCONTENT_FULLY_DISCONNECTED=ON. Not used (CPU build only): XNNPACK,
# onnxruntime-extensions, CUDA, DirectML, CoreML, mimalloc, the Windows and Android pieces.
# RISK: this tree's protobuf (35.1) and abseil (20260526) are newer than the ones this ONNX Runtime was
# written for (33.6, 20250814): the first build may need patches. The Python module is built with
# setup.py as Alpine does.
# Not built (queued, wip/queue): expect first-build fixes.
name = "onnxruntime"
version = "1.30.0"
release = 1
summary = "ONNX Runtime: cross-platform inference engine for machine learning models"
license = "MIT"
homepage = "https://onnxruntime.ai"
patches = ["system.patch", "0001-Remove-MATH_NO_EXCEPT-macro.patch", "upb-fix.patch", "skip-matmul_8bits_test-unavailable-kernel.patch"]
hostdeps = ["bash", "cmake", "ninja", "pkgconf", "python", "python-setuptools", "python-wheel", "python-pybind11"]
builddeps = ["abseil-cpp-devel", "icu-devel", "linux-headers", "nlohmann-json", "protobuf-devel", "python-devel", "python-numpy", "python-pybind11-devel", "python-protobuf", "re2-devel", "zlib-ng-compat-devel"]
rundeps = ["python", "python-numpy", "python-protobuf"]
options = ["!check", "!lto"]

