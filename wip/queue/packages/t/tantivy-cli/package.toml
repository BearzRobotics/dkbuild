# tantivy-cli: the command line of Tantivy, the Rust full-text search engine library (like Lucene):
# `tantivy new`, `index`, `search`, `serve` (a small HTTP search server), `merge`. Asked for as
# "tantivy" (the library is a crate, used by other Rust programs through cargo; this is the
# program). Crates from cargodeps. Not built (queued, wip/queue): expect first-build fixes.
name = "tantivy-cli"
version = "0.25.0"
release = 1
summary = "Command line tool of the Tantivy search engine library"
license = "MIT"
homepage = "https://github.com/quickwit-oss/tantivy-cli"
hostdeps = ["rust"]
options = ["!check", "cargodeps"]

source = [
    { url = "https://github.com/quickwit-oss/tantivy-cli/archive/refs/tags/0.25.0.tar.gz", sha256 = "1f398e80d214ff53b35db3e35b7de0d6a75c9366df7c5fdce66df2e6eb0c0964" },
]

environment = '''
export CARGO_HOME=/tmp/cargo-home CARGO_NET_OFFLINE=true
'''
build = '''
cargo build --release --frozen --offline -j $jobs
'''
install = '''
install -Dm755 target/release/tantivy "$pkgdir/usr/bin/tantivy"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/tantivy-cli/LICENSE"
'''
