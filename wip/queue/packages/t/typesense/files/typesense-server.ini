; Typesense server configuration (every option: https://typesense.org/docs/latest/api/server-configuration.html)
[server]
; the API key is NOT set: Typesense refuses to start without one. Generate one (`openssl rand -hex 32`) and put it here:
;api-key = 
data-dir = /var/lib/typesense
log-dir = /var/log/typesense
api-address = 127.0.0.1
api-port = 8108
