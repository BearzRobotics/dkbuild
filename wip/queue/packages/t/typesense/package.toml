    { url = "https://github.com/cruppstahl/libfor/archive/49611808d08d4e47116aa2a3ddcabeb418f405f7.tar.gz", sha256 = "fc22e65f6ad37c01973a24e9cda01e3affe1f68c7012af9a80e6b1b54d701018", unpack = false, name = "libfor-49611808d08d4e47116aa2a3ddcabeb418f405f7.tar.gz" },
    { url = "https://github.com/google/googletest/archive/release-1.8.0.tar.gz", sha256 = "58a6f4277ca2bc8565222b3bbd58a177609e9c488e8a72649359ba51450db7d8", unpack = false, name = "googletest-release-1.8.0.tar.gz" },
    { url = "https://github.com/h2o/h2o/archive/1491a703195790278091fd7aee547fbba78e89af.tar.gz", sha256 = "99d3f362a8df5cebbaffdc7ba455cb44d6d3073ba71ca9ac9d60441484e3ecff", unpack = false, name = "h2o-1491a703195790278091fd7aee547fbba78e89af.tar.gz" },
    { url = "https://github.com/typesense/hnswlib/archive/21de18ffabea1a9d1e8b16b49afc6045d7707e4c.tar.gz", sha256 = "c1c07c6d0c90119c1f1d41a67df144b3791966392115510dae51e15e598b19f5", unpack = false, name = "hnswlib-21de18ffabea1a9d1e8b16b49afc6045d7707e4c.tar.gz" },
    { url = "https://ftp.gnu.org/pub/gnu/libiconv/libiconv-1.15.tar.gz", sha256 = "ccf536620a45458d26ba83887a983b96827001e92a13847b45e4925cc8913178", unpack = false },
    { url = "https://github.com/jemalloc/jemalloc/releases/download/5.3.0/jemalloc-5.3.0.tar.bz2", sha256 = "2db82d1e7119df3e71b7640219b6dfe84789bc0537983c3b7ac4f7189aecfeaa", unpack = false },
    { url = "https://github.com/typesense/kakasi/archive/9e0825a02c7ea5605e968f6208f769f7c49d6860.tar.gz", sha256 = "4f283a0f1d1f6d2a003e4c65a06aa67698de6a2d30abe782fd214baa9da7f9d3", unpack = false, name = "kakasi-9e0825a02c7ea5605e968f6208f769f7c49d6860.tar.gz" },
