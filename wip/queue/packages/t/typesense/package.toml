    { url = "https://raw.githubusercontent.com/kishorenc/libart/bbbf588bca55bce095538ee8ca8b422904baebc5/tests/uuid.txt", sha256 = "f8cb59e1ed23fb77fa170eff0b75321d556be06b1fd09582809edc28632c5a4c", unpack = false },
    { url = "https://gist.githubusercontent.com/kishorenc/1d330714eb07019f210f16ccb3991217/raw/bd52e05375d305d5aaa7ac06219af999726933a4/token_offsets.log", sha256 = "55c1c510ca6335c049f5696f3b94ac7be61e84f3e27cd8169021929b3db99651", unpack = false },
