# Typesense: a fast, typo-tolerant, in-memory search engine (C++: H2O's HTTP server, RocksDB, s2geometry, an HNSW vector index, ONNX Runtime for embeddings).
# Upstream's CMake downloads and builds its third parties itself into external-Linux/ (cmake/*.cmake): each with `file(DOWNLOAD ...)` only if the tarball is
# not already there. They are sources of this recipe at the same pinned versions (libfor, googletest 1.8.0, H2O, hnswlib (Typesense's fork), libiconv 1.15,
# jemalloc 5.3.0, kakasi (Typesense's fork), lru-cache, RocksDB 6.20.3, s2geometry; the three test data files), copied into external-Linux/ under the names
# the cmake files expect, so those steps run unchanged and offline. They stay the pinned, bundled copies: Typesense builds against RocksDB 6.20 and a patched
# H2O/kakasi/hnswlib, not the system ones.
# ONNX Runtime: upstream builds ONNX Runtime 1.14 from git with `git submodule update --remote` (branch heads: not reproducible) and links nine static libraries
# plus the dependencies' libraries from its build tree. Here it links the tree's own onnxruntime (shared library, system headers): the `setup` edits (sed, each
# checked) drop cmake/onnxruntime.cmake and the imported static libraries, link `onnxruntime`, and include <onnxruntime_cxx_api.h> instead of
# <core/session/onnxruntime_cxx_api.h>. Typesense only uses the stable C++ API (Ort::Env, Session, Value, MemoryInfo, allocators).
# onnxruntime-extensions: the project compiles a few of its tokenizer sources into the server (operators/src_dir/*): the source is a pinned commit of the rel-0.6.0
# branch (36a9c99) extracted into external-Linux/onnxruntime_ext, with Typesense's own cmake/onnx_ext.patch applied (git apply, in a scratch repository),
# and cmake/onnxruntime_ext.cmake (a git clone) replaced by an empty file.
# Installed inert (docs/requests.md): dinit service shipped, not enabled; no api-key in the configuration (Typesense refuses to start without one).
# Not built yet when written (wip/queue): expect first-build fixes (RocksDB 6.20, H2O and s2geometry are old code under clang 23 and libc++ 23).
name = "typesense"
version = "30.2"
release = 1
summary = "Fast, typo-tolerant search engine for instant search (vector and semantic search)"
license = "GPL-3.0-only"
homepage = "https://typesense.org"
archs = ["x86_64"]
hostdeps = ["cmake", "ninja", "pkgconf", "make", "perl", "git", "patch", "autoconf", "automake", "libtool", "bzip2"]
builddeps = ["openssl-devel", "snappy-devel", "zlib-ng-compat-devel", "curl-devel", "icu-devel", "protobuf-devel", "leveldb-devel", "gflags-devel", "glog-devel", "elfutils-devel", "onnxruntime-devel", "linux-headers"]
rundeps = ["onnxruntime", "ca-certificates"]
options = ["!check", "jobs:8"]

source = [
