environment = '''
export TYPESENSE_VERSION=30.2
'''
setup = '''
# the pinned third parties where cmake/*.cmake look for their tarballs
dep=external-Linux
mkdir -p $dep
s=/build/sources
for f in libfor-49611808d08d4e47116aa2a3ddcabeb418f405f7.tar.gz googletest-release-1.8.0.tar.gz h2o-1491a703195790278091fd7aee547fbba78e89af.tar.gz \
         hnswlib-21de18ffabea1a9d1e8b16b49afc6045d7707e4c.tar.gz libiconv-1.15.tar.gz jemalloc-5.3.0.tar.bz2 kakasi-9e0825a02c7ea5605e968f6208f769f7c49d6860.tar.gz \
         lru-cache-13f30ad33a227a3e9682578c450777380ecddfcf.tar.gz rocksdb-6.20.3.tar.gz s2geometry-efb124d8eaf3433323d3e877dedd5e94a63339a3.tar.gz; do
    cp "$s/$f" "$dep/$f"
done
# the three test data files, where TestResources.cmake looks (CMAKE_SOURCE_DIR/external/)
mkdir -p external/libart/tests external/token_offsets/file
cp "$s/words.txt" "$s/uuid.txt" external/libart/tests/
cp "$s/token_offsets.log" external/token_offsets/file/token_offsets.txt

# onnxruntime-extensions: extracted, Typesense's patch applied (a scratch git repository: the patch has renames)
mkdir -p $dep/onnxruntime_ext
tar -xzf "$s/onnxruntime-extensions-36a9c99.tar.gz" -C $dep/onnxruntime_ext --strip-components=1
(cd $dep/onnxruntime_ext && git init -q . && git apply "$OLDPWD/cmake/onnx_ext.patch" && mkdir -p operators/src_dir/token && test -f operators/src_dir/ustring.cc)
printf '%s\n' '# FenrirOS: onnxruntime-extensions is extracted and patched by the recipe (it was a git clone)' > cmake/onnxruntime_ext.cmake
sed -i '/^include(cmake\/onnxruntime_ext.cmake)$/d; /^add_dependencies(.* onnxruntime_ext)$/d' CMakeLists.txt

# the system ONNX Runtime instead of the bundled 1.14 build (see the header). Source edits: sed.
sed -i '/^include(cmake\/onnxruntime.cmake)$/d; /^add_dependencies(.* onnxruntime)$/d' CMakeLists.txt
sed -i '/^link_directories(.*ONNX_NAME.*-build/d; /^include_directories(.*ONNX_NAME.*\/include\/onnxruntime)$/d' CMakeLists.txt
sed -i '/^add_library(\(ONNX[A-Z_]*\|ABSL[A-Z_]*\|NSYNC\|CPUI\|CLOG\) /d; /^set_target_properties(\(ONNX[A-Z_]*\|ABSL[A-Z_]*\|NSYNC\|CPUI\|CLOG\) PROPERTIES/d' CMakeLists.txt
sed -i 's/ ONNX_SESSION ONNX_OPT ONNX_PRO ONNX_UTL ONNX_FRM ONNX_GRP ONNX_MLS ONNX_CMN ONNX_FLT ONNX ONNX_PRT ONNX_PRTL ONNX_RE ABSL[A-Z_ ]* NSYNC CPUI CLOG/ onnxruntime/' CMakeLists.txt
sed -i 's|<core/session/onnxruntime_cxx_api.h>|<onnxruntime_cxx_api.h>|' $(grep -rl 'core/session/onnxruntime_cxx_api.h' src include)
sed -i 's|^include_directories(include)$|include_directories(include)\ninclude_directories(/usr/include/onnxruntime)|' CMakeLists.txt
! grep -n 'ONNX_SESSION\|ONNX_NAME}-build\|core/session' CMakeLists.txt src/*.cpp include/*.h | head -5
grep -q 'include_directories(/usr/include/onnxruntime)' CMakeLists.txt
cmake -S . -B build-Linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DTYPESENSE_VERSION=$TYPESENSE_VERSION
'''
build = '''
cmake --build build-Linux --target typesense-server
'''
install = '''
install -Dm755 build-Linux/typesense-server "$pkgdir/usr/bin/typesense-server"
install -Dm644 $pkgfiles/typesense-server.ini "$pkgdir/etc/typesense/typesense-server.ini"
install -Dm644 $pkgfiles/typesense "$pkgdir/etc/dinit.d/typesense"
install -Dm644 $pkgfiles/sysusers.conf "$pkgdir/usr/lib/sysusers.d/typesense.conf"
install -Dm644 $pkgfiles/tmpfiles.conf "$pkgdir/usr/lib/tmpfiles.d/typesense.conf"
install -Dm644 $pkgfiles/README.FenrirOS "$pkgdir/usr/share/doc/typesense/README.FenrirOS"
install -Dm644 LICENSE.txt "$pkgdir/usr/share/licenses/typesense/LICENSE.txt"
'''
