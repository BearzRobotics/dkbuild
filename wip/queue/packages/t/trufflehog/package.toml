# Searches through git repositories for high entropy strings, digging deep into commit... (BlackArch list, requested 2026-11-16; docs/requests.md). Written from the template of ffuf; not built yet when written (wip/queue): expect first-build fixes.
# Go module, dependencies fetched on the host (godeps). Main package: ..
name = "trufflehog"
version = "3.99.9"
release = 1
summary = "Searches through git repositories for high entropy strings, digging deep into commit..."
license = "AGPL-3.0"
homepage = "https://github.com/trufflesecurity/trufflehog"
hostdeps = ["go"]
options = ["!check", "godeps"]

source = [
    { url = "https://github.com/trufflesecurity/trufflehog/archive/refs/tags/v3.99.9.tar.gz", sha256 = "4709b07e25d7b637df3ba692cebb2b3a46e896cbebaa7b80bc4a81b77f2509cb" },
]

environment = '''
export GOFLAGS="-mod=mod -trimpath -buildvcs=false" GOTOOLCHAIN=local GOPROXY=off
export GOCACHE=/tmp/go-cache GOPATH=/tmp/go CGO_ENABLED=0
'''
build = '''
mkdir -p build
go build -o build/trufflehog .
'''
install = '''
install -Dm755 build/trufflehog "$pkgdir/usr/bin/trufflehog"
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/trufflehog/LICENSE"
'''
