name = "pipewire"
version = "1.6.10"
release = 1
summary = "Server and user space API to deal with multimedia pipelines"
license = "MIT"
homepage = "https://pipewire.org"
patches = ["lol.patch", "readiness.patch"]
hostdeps = ["bash", "doxygen", "gettext", "glib-devel", "graphviz", "meson", "pkgconf", "python-docutils"]
builddeps = ["alsa-lib-devel", "avahi-devel", "bluez-devel", "dinit-chimera", "dinit-dbus", "elogind-devel", "fdk-aac-devel", "fftw-devel", "gst-plugins-base-devel", "libcamera-devel", "libcanberra-devel", "libedit-readline-devel", "libfreeaptx-devel", "liblc3-devel", "libmysofa-devel", "libpulse-devel", "libsndfile-devel", "libusb-devel", "libva-devel", "lilv-devel", "ncurses-devel", "openssl3-devel", "sbc-devel", "spandsp-devel", "v4l-utils-devel"]
rundeps = ["dinit-dbus", "rtkit", "virtual:pipewire-session-manager!pipewire-session-manager-none"]

source = [
    { url = "https://gitlab.freedesktop.org/pipewire/pipewire/-/archive/1.6.10/pipewire-1.6.10.tar.gz", sha256 = "93b7c4f1e62fd9ec3a921846c6bfc64442872bb2366c2bbc3ea69a427b79a4f9" },
]

setup = '''
%meson \
    --auto-features=enabled \
    -Ddocs=enabled \
    -Dman=enabled \
    -Dlogind-provider=libelogind \
    -Dsdl2=disabled \
    -Dlibffado=disabled \
    -Droc=disabled \
    -Dselinux=disabled \
    -Dsnap=disabled \
    -Debur128=disabled \
    -Dbluez5-codec-lc3plus=disabled \
    -Dbluez5-codec-ldac-dec=disabled \
    -Donnxruntime=disabled \
    -Dsystemd-user-service=disabled \
    -Djack=disabled \
    -Djack-devel=true \
    -Dlibjack-path=/usr/lib \
    -Dlibv4l2-path=/usr/lib \
    -Dudevrulesdir=/usr/lib/udev/rules.d \
    "-Dsession-managers=[]" \
    -Drlimits-match=@_pipewire
'''
build = '''
%meson_build
'''
install = '''
%meson_install
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/pipewire/LICENSE"
# move to vendordir
install -dm755 "$pkgdir/usr/share/pam"
# TODO(cbuild): self.rename("etc/security", "usr/share/pam/security", relative=False)
'''
