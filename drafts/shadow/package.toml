name = "shadow"
version = "4.17.2"
release = 1
summary = "Shadow password file utilities"
license = "BSD-3-Clause"
homepage = "https://github.com/shadow-maint/shadow"
patches = ["defaults.patch", "login_defs.patch", "man.patch", "usermod-move-home-errmsg.patch", "xstrdup.patch"]
builddeps = ["acl-devel", "linux-pam-devel", "linux-headers"]
rundeps = ["linux-pam", "base-shells"]
options = ["!check"]

source = [
    { url = "https://github.com/shadow-maint/shadow/releases/download/4.17.2/shadow-4.17.2.tar.xz", sha256 = "a21cf0d34bffc4314cede01cff258689174fab30ca494ae8f45784d3d56c9849" },
]

setup = '''
%configure \
    --enable-shared \
    --enable-lastlog \
    --disable-static \
    --with-libpam \
    --with-acl \
    --with-attr \
    --without-libbsd \
    --without-selinux \
    --without-nscd \
    --disable-nls \
    --enable-subordinate-ids \
    --disable-account-tools-setuid
'''
build = '''
%make
'''
install = '''
# shadow force-installs into sbin regardless of configure
install -dm755 "$pkgdir/usr/bin"
mkdir -p "$pkgdir/usr"
ln -sf bin "$pkgdir/usr/sbin"
%make_install
rm -rf "$pkgdir/usr/sbin"
# install sulogin which is noinst
install -Dm755 src/sulogin "$pkgdir/usr/bin/sulogin"
install -Dm644 man/man8/sulogin.8 "$pkgdir/usr/share/man/man8/sulogin.8"
# do not install pam files supplied with shadow
rm -rf "$pkgdir/etc/pam.d"
# install our own pam files
# TODO(cbuild): for f in ["chage", "chfn", "chsh", "login", "su", "passwd"]:
