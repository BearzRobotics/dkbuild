name = "zip"
version = "3.0"
release = 3
summary = "Create/update ZIP files compatible with pkzip"
license = "Info-ZIP"
homepage = "https://infozip.sourceforge.net"
patches = ["exec-stack.patch", "fix_install.patch", "format-security.patch", "reproducible-build.patch", "zip-3.0-clang-15-configure-tests.patch", "zipnote.patch"]
rundeps = ["unzip"]
options = ["!check"]

source = [
    { url = "https://downloads.sourceforge.net/sourceforge/infozip/zip30.tar.gz", sha256 = "f0e8bb1f9b7eb0b01285495a2699df3a4b766784c1765a8f1aeedf63c0806369" },
]

environment = '''
export CFLAGS="${CFLAGS} -DLARGE_FILE_SUPPORT"
'''
build = '''
# TODO(cbuild): init_build() sets variables for this phase (cbuild line 24); port it by hand
%make \
    -f \
    unix/Makefile \
    prefix=/usr
'''
install = '''
%make_install \
    STRIP=true \
    PREFIX=/usr
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/zip/LICENSE"
'''
