name = "curl"
version = "8.23.0"
release = 1
summary = "Command line tool for transferring data with URL syntax"
license = "curl"
homepage = "https://curl.se"
patches = ["optimize.patch"]
hostdeps = ["automake", "pkgconf", "perl", "mandoc", "slibtool"]
builddeps = ["c-ares-devel", "gnutls-bootstrap", "libidn2-devel", "libpsl-devel", "libssh2-devel", "nghttp2-devel", "nghttp3-devel", "ngtcp2-devel", "openssl3-devel", "zlib-ng-compat-devel", "zstd-devel"]
checkdeps = ["nghttp2-progs", "python"]
rundeps = ["ca-certificates"]

source = [
    { url = "https://curl.se/download/curl-8.23.0.tar.xz", sha256 = "8dadd7d2536a314f982ad05a651b713f426bf7d02cc2c76cffb9796f2218e6c5" },
]

setup = '''
autoreconf -if -W none
%configure \
    --enable-ares \
    --enable-httpsrr \
    --enable-ipv6 \
    --enable-threaded-resolver \
    --enable-websockets \
    --with-ca-bundle=/etc/ssl/certs/ca-certificates.crt \
    --with-fish-functions-dir=/usr/share/fish/vendor_completions.d \
    --with-libidn2 \
    --with-libpsl \
    --with-libssh2 \
    --with-nghttp2 \
    --with-nghttp3 \
    --with-ngtcp2 \
    --with-ssl \
    --with-zlib \
    --with-zsh-functions-dir=/usr/share/zsh/site-functions/ \
    --with-zstd \
    ac_cv_path_NROFF=/usr/bin/mandoc \
    ac_cv_sizeof_off_t=8
'''
build = '''
%make
'''
check = '''
# TODO(cbuild): init_check() sets variables for this phase (cbuild line 78); port it by hand
%make check
'''
