name = "mdadm"
version = "4.3"
release = 4
summary = "Tool for handling Linux md arrays"
license = "GPL-2.0-or-later"
homepage = "https://raid.wiki.kernel.org/index.php/A_guide_to_mdadm"
patches = ["0001-fix-manpages.patch", "0003-host-name-in-default-mailfrom.patch", "0004-exit-gracefully-when-md-device-not-found.patch", "0005-sha1-includes.patch", "basename.patch", "falloc.patch", "fix-monitor-tv_sec.patch", "lfs64.patch", "limits.patch", "mdadm-include-sysmacros.patch"]
hostdeps = ["pkgconf"]
builddeps = ["dinit-chimera", "linux-headers", "udev-devel"]
checkdeps = ["bash", "e2fsprogs", "udev"]
options = ["!check"]

source = [
    { url = "https://www.kernel.org/pub/linux/utils/raid/mdadm/mdadm-4.3.tar.gz", sha256 = "61a1c22477555364dea1862df7c3b4e8b9a53ee733bad320a45fda27dd0ed44f" },
]

environment = '''
export CFLAGS="${CFLAGS} -DNO_COROSYNC -DNO_DLM -DSendmail="sendmail -t" -DCONFFILE="/etc/mdadm.conf" -DCONFFILE2="/etc/mdadm/mdadm.conf" -DMAP_DIR="/run/mdadm" -DMAP_FILE="map" -DMDMON_DIR="/run/mdadm" -DFAILED_SLOTS_DIR="/run/mdadm/failed-slots" -DUSE_PTHREADS"
'''
build = '''
%make \
    PREFIX=/usr \
    CWFLAGS= \
    BINDIR=/usr/bin
'''
install = '''
# do not pass STRIP
# TODO(cbuild): self.make.install()
install -Dm644 mdadm.conf-example "$pkgdir/etc/mdadm.conf"
install -Dm644 $pkgfiles/modprobe.conf "$pkgdir/usr/lib/modprobe.d/mdadm.conf"
'''
