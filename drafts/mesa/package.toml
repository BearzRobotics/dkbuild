    -Dgles1=enabled \
    -Dgles2=enabled \
    -Dglvnd=enabled \
    -Dglx=dri \
    -Dllvm=enabled \
    -Dlmsensors=enabled \
    -Dplatforms=x11,wayland \
    -Dvideo-codecs=all
'''
build = '''
%meson_build
'''
