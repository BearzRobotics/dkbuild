name = "dhcpcd"
version = "10.5.2"
release = 1
summary = "RFC2131 compliant DHCP client"
license = "BSD-2-Clause"
homepage = "https://roy.marples.name/projects/dhcpcd"
patches = ["enable-controlgroup.patch"]
hostdeps = ["pkgconf"]
builddeps = ["dinit-chimera", "udev-devel", "linux-headers"]
rundeps = ["resolvconf"]

source = [
    { url = "https://github.com/NetworkConfiguration/dhcpcd/releases/download/v10.5.2/dhcpcd-10.5.2.tar.xz", sha256 = "3e476657fdb6eeb38b277da3a48d0ac0113ecce5858ebdcddff2b629faed52b4" },
]

setup = '''
./configure \
    --prefix=/usr \
    --sbindir=/usr/bin \
    --libexecdir=/usr/lib \
    --sysconfdir=/etc \
    --rundir=/run/dhcpcd \
    --dbdir=/var/lib/dhcpcd \
    --privsepuser=_dhcpcd \
    --enable-privsep \
    --without-libpcap
'''
build = '''
%make
'''
check = '''
%make test
'''
install = '''
%make_install
install -Dm644 LICENSE "$pkgdir/usr/share/licenses/dhcpcd/LICENSE"
