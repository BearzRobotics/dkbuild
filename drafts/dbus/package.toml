name = "dbus"
version = "1.16.2"
release = 1
summary = "Message bus system"
license = "GPL-2.0-or-later"
homepage = "https://dbus.freedesktop.org"
patches = ["0001-add-flag-for-dinit-activated-launch.patch", "0002-add-dinit-environment-updating.patch", "launch-helper-grp.patch", "no-issetugid.patch"]
hostdeps = ["gperf", "meson", "pkgconf", "xmlto"]
