]

setup = '''
%meson \
    -Dasserts=false \
    -Ddbus_user=dbus \
    -Ddoxygen_docs=disabled \
    -Depoll=enabled \
    -Dinotify=enabled \
    -Dselinux=disabled \
    -Dsystem_pid_file=/run/dbus/pid \
    -Dsystem_socket=/run/dbus/system_bus_socket \
    -Dsystemd=disabled \
    -Duser_session=false \
    -Dtraditional_activation=true \
    -Dxml_docs=enabled
'''
build = '''
%meson_build
'''
