# FenrirOS Rescue, DKRescue's successor: a live ISO for repairing, imaging,
# recovering and wiping disks on any x86_64 PC (BIOS or UEFI, DVD, USB stick or
# an .iso on a Ventoy stick). Boots straight to the DKDE desktop as `rescue`
# (no password, sudo works); tty2-6 and the serial boot entry give a text login.
# Every firmware group is included.
name     = "rescue"
arch     = "x86_64"
hostname = "fenriros-rescue"
label    = "FENRIROS_RESCUE"
# desktop-dkde-core, not desktop-dkde: the desktop without printing (cups), OCR (ocrmypdf) and online
# accounts (gnome-online-accounts), which make no sense on a rescue disk. (`unwanted` cannot drop them: it
# is a conflict for apk, and desktop-dkde depends on them.)
packages = ["base", "base-net", "linux", "live-initramfs", "dkinstaller", "firmware-linux-meta", "rescue-tools", 
"desktop-dkde-core", "base-devel", "dos2unix", "vim", "claude-code", "xserver-xorg", "xserver-xorg-input-libinput", 
"xinit", "gcc", "gdb", "ntfs-3g"]
#exclude  = ["*-static"]
services = ["udevd", "udev-trigger", "udev-settle", "modules", "dhcpcd", "syslogd", "seatd", "dbus", "dkinstall-auto"]
issue    = """
FenrirOS Rescue \\r (\\l)

Log in as: rescue   (no password; sudo works)
"""
# console  = "dkconsole"   # experimental text console on tty1-5 (tty6 and serial keep agetty)
output   = ["iso"]
autologin = "rescue"
session   = "dkde-session"

[[users]]
name     = "rescue"
groups   = ["wheel", "video", "render", "audio", "input", "plugdev", "disk"]
password = "empty"
