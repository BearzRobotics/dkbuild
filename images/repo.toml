# The FenrirOS package repository on discs: every current package (recipes
# with `!repo-iso` left out), the signed index and the public key.
#
#   dkbuild discs images/repo.toml               DVDs (about 4.5 GB each)
#   dkbuild discs --media usb images/repo.toml   one image for a USB stick or Ventoy
#
# Each disc says how to copy the set into one directory (import.sh); the
# result is an apk repository, out/<name>/README.txt has the details.
name  = "fenriros-repo"
kind  = "repo"
arch  = "x86_64"
media = "dvd"
label = "FENRIROS_REPO"
