# FenrirOS with the DKDE desktop: a live ISO that boots straight to the
# graphical desktop through greetd (the DKDE greeter; dkde-session starts for
# the live user as greetd's initial_session, with no password typed). After a
# logout the greeter asks for a login, and the live user's empty password is
# accepted (the image's /etc/pam.d/greetd has nullok; the package's has none).
# greetd and NetworkManager come with desktop-dkde; NetworkManager does DHCP,
# so dhcpcd (base-net) is installed but its service is not enabled. greetd takes
# vt 7, the text consoles tty1-tty6 keep their gettys. Every firmware group is
# included.
name     = "dkde-devel"
arch     = "x86_64"
hostname = "fenriros"
# what the text consoles show above `login:`: what this is, how to log in and what to do next. dkinstaller replaces it with a plain
# greeting on a system installed from this image.
issue = """

FenrirOS \\r (\\l): desktop system. This is a text console.
The desktop is on console 7: Ctrl+Alt+F7. Text consoles: Ctrl+Alt+F1 to F6.

LOG IN
  Live disc:  user  live    password: none (press Enter)
              root is locked. Use  sudo <command>  (press Enter if asked).

AFTER LOGGING IN
  sudo dkinstall             install FenrirOS onto a disk (live disc only)
  nmtui                      set up the network (wired or Wi-Fi)
  dkde-session --x11         start the desktop by hand (X11)
  dkde-session               start the desktop by hand (Wayland)
  man NAME                   read the manual for a command
  sudo reboot                restart
  sudo poweroff              shut down

IF THE DESKTOP DID NOT START, look at
  ~/.local/state/dkde/session.log    /tmp/dkde-greeter-*.log
  sudo dinitctl status greetd

"""
label    = "FENRIROS_DKDE"
# not base-net: it depends on dhcpcd, and NetworkManager does the DHCP here (two DHCP clients
# fight); its other parts (OpenSSH, curl) are listed instead
# firewalld: the firewall of this image (nftables backend; its recipe is in the tree since 2026-11-15). Not
# firewalld-gui: dkde has its own front end for it.

# "claude-code" Is added for now So I can spin up an instance to help debug on the running system.
packages = ["base", "openssh", "openssh-server", "curl", "linux", "live-initramfs", "elogind", "dkinstaller", "firmware-linux-meta", 
"desktop-dkde", "firewalld", "claude-code", "base-devel", "xserver-xorg", "xserver-xorg-input-libinput", "xinit", "libselinux", 
"policycoreutils", "selinux-python", "selinux-policy-targeted", "firefox", "ncurses", "iputils", "net-tools", "iproute2", "iw", 
"traceroute", "vim", "gcc", "dos2unix", "rescue-tools",
# GRUB's BIOS and 64-bit EFI modules: dkinstaller offers GRUB on a BIOS machine only when /usr/lib/grub/i386-pc is on the live disc; the
# EFI modules are for GRUB on UEFI (grub itself comes with rescue-tools)
"grub", "grub-i386-pc", "grub-x86_64-efi",
# the manual pages and documentation of grub and of the tools in rescue-tools (about 3 MB; a new tool there needs its -doc here too).
# No -doc package: nvme-cli, btrfs-progs, chntpw.
"grub-doc", "ddrescue-doc", "testdisk-doc", "fsarchiver-doc", "nwipe-doc", "smartmontools-doc", "hdparm-doc",
"parted-doc", "gptfdisk-doc", "util-linux-doc", "e2fsprogs-doc", "xfsprogs-doc", "dosfstools-doc", "exfatprogs-doc",
"ntfs-3g-doc", "cryptsetup-doc", "lvm2-doc", "mdadm-doc", "efibootmgr-doc", "dklilo-doc", "dmidecode-doc",
"pciutils-doc", "usbutils-doc", "squashfs-tools-doc", "xorriso-doc", "openssh-doc", "curl-doc", "rsync-doc",
"f2fs-tools-doc", "jfsutils-doc", "reiserfsprogs-doc", "nilfs-utils-doc", "tmux-doc", "strace-doc", "partclone-doc",
"safecopy-doc", "foremost-doc", "gpart-doc", "sg3-utils-doc", "lsscsi-doc", "lshw-doc", "kpartx-doc", "memtester-doc",
"stress-ng-doc", "fio-doc", "pv-doc", "lsof-doc", "ncdu-doc", "mc-doc", "screen-doc", "dialog-doc", "lftp-doc",
"mbuffer-doc", "par2cmdline-doc"]
#exclude  = ["*-devel", "*-doc", "*-static"]
# never installed, even as a dependency (apk stops with a conflict if something needs it)
unwanted = ["dhcpcd"]
services = ["udevd", "udev-trigger", "udev-settle", "modules", "syslogd", "elogind", "dbus", "networkmanager", "firewalld", "greetd", "dkinstall-auto"]
output   = ["iso"]
login     = "greetd"
# elogind, not seatd: it registers the session, so Shut Down and Restart need no password (dkde 0.3.5).
seat      = "elogind"
autologin = "live"
session   = "dkde-session"

[[users]]
name     = "live"
groups   = ["wheel", "video", "render", "audio", "input", "plugdev"]
password = "empty"
