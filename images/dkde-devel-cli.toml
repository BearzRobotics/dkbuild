# The dkde-devel image that boots to the command line only: the same packages (the desktop is installed but nothing graphical
# starts), a text console with the live user logged in on tty1, no greetd. A system installed from it starts the same way.
# KEEP THE PACKAGE LIST IN STEP WITH dkde-devel.toml: image files cannot include one another.
name     = "dkde-devel-cli"
arch     = "x86_64"
hostname = "fenriros"
# what the consoles show before the login: what this is, how to log in and what to do next. dkinstaller KEEPS this text on a system
# installed from this image (it replaces it only for a graphical autologin), so it must be true there too.
# \e{...} are agetty's colour escapes (agetty(8), "issue files"); a backslash is written twice here.
issue = """

FenrirOS \\r (\\l): command-line system (no desktop at boot).

\\e{yellow}LOG IN\\e{reset}
  Live disc:         user  live    password: none (press Enter)
                     root is locked. Use  \\e{lightcyan}sudo <command>\\e{reset}  (Enter if asked).
  Installed system:  the user name and password you chose when installing.
                     There is no live user there.

\\e{yellow}AFTER LOGGING IN\\e{reset}
  \\e{lightcyan}sudo dkinstall\\e{reset}             install FenrirOS onto a disk (live disc only)
  \\e{lightcyan}nmtui\\e{reset}                      set up the network (wired or Wi-Fi)
  \\e{lightcyan}dkde-session --x11\\e{reset}         start the desktop (X11)
  \\e{lightcyan}dkde-session\\e{reset}               start the desktop (Wayland)
  \\e{lightcyan}man NAME\\e{reset}                   read the manual for a command
  \\e{lightcyan}sudo dinitctl list\\e{reset}         list the services and their state
  \\e{lightcyan}sudo reboot\\e{reset}                restart
  \\e{lightcyan}sudo poweroff\\e{reset}              shut down

More consoles: Alt+F1 to Alt+F6.

"""
label    = "FENRIROS_CLI"
# not base-net: it depends on dhcpcd, and NetworkManager does the DHCP here (two DHCP clients
# fight); its other parts (OpenSSH, curl) are listed instead
# firewalld: the firewall of this image (nftables backend; its recipe is in the tree since 2026-11-15). Not
# firewalld-gui: dkde has its own front end for it.

# "claude-code" Is added for now So I can spin up an instance to help debug on the running system.
packages = ["base", "openssh", "openssh-server", "curl", "linux", "live-initramfs", "elogind", "dkinstaller", "firmware-linux-meta", 
"desktop-dkde", "firewalld", "claude-code", "base-devel", "xserver-xorg", "xserver-xorg-input-libinput", "xinit", "libselinux", 
"policycoreutils", "selinux-python", "selinux-policy-targeted", "firefox", "ncurses", "iputils", "net-tools", "iproute2", "iw", 
"traceroute", "vim", "gcc", "dos2unix", "rescue-tools",
# GRUB's BIOS and 64-bit EFI modules: dkinstaller offers GRUB on a BIOS machine only when /usr/lib/grub/i386-pc is on the live disc; the
# EFI modules are for GRUB on UEFI (grub itself comes with rescue-tools)
"grub", "grub-i386-pc", "grub-x86_64-efi",
# the manual pages and documentation of grub and of the tools in rescue-tools (about 3 MB; a new tool there needs its -doc here too).
# No -doc package: nvme-cli, btrfs-progs, chntpw.
"grub-doc", "ddrescue-doc", "testdisk-doc", "fsarchiver-doc", "nwipe-doc", "smartmontools-doc", "hdparm-doc",
"parted-doc", "gptfdisk-doc", "util-linux-doc", "e2fsprogs-doc", "xfsprogs-doc", "dosfstools-doc", "exfatprogs-doc",
"ntfs-3g-doc", "cryptsetup-doc", "lvm2-doc", "mdadm-doc", "efibootmgr-doc", "dklilo-doc", "dmidecode-doc",
"pciutils-doc", "usbutils-doc", "squashfs-tools-doc", "xorriso-doc", "openssh-doc", "curl-doc", "rsync-doc",
"f2fs-tools-doc", "jfsutils-doc", "reiserfsprogs-doc", "nilfs-utils-doc", "tmux-doc", "strace-doc", "partclone-doc",
"safecopy-doc", "foremost-doc", "gpart-doc", "sg3-utils-doc", "lsscsi-doc", "lshw-doc", "kpartx-doc", "memtester-doc",
"stress-ng-doc", "fio-doc", "pv-doc", "lsof-doc", "ncdu-doc", "mc-doc", "screen-doc", "dialog-doc", "lftp-doc",
"mbuffer-doc", "par2cmdline-doc",
# THE MAIN PACKAGES OF LIBRARIES (2026-11-26): programs pull in only <name>-libs, but these main packages hold files the libraries need
# when they run (GTK and Qt modules and schemas, ALSA's configuration, GStreamer plugins, device databases ...): without gtk+3,
# Firefox's file dialog aborted ("Settings schema org.gtk.Settings.FileChooser is not installed"). A workaround in this list; the
# fix in the packages is for -libs to depend on its main package (icu does since r2). Services in them are not enabled.
"alsa-lib", "aspell", "attr", "audit", "cairo", "colord", "espeak-ng", "gcr", "gnutls", "gpgme", "gpm", "graphite2",
"gst-plugins-bad", "gst-plugins-base", "gstreamer", "gtk+3", "gtk4", "harfbuzz", "heimdal", "iptables", "json-glib",
"kconfig", "keyutils", "kguiaddons", "kiconthemes", "libadwaita", "libblockdev", "libbytesize", "libcamera",
"libcanberra", "libgpg-error", "libgphoto2", "libgusb", "libidn", "libinput", "libjxl", "libnice", "libnl",
"libpaper", "libsasl", "libsecret", "libwacom", "libxkbcommon", "libxslt", "lilv", "lksctp-tools", "lm-sensors",
"modemmanager", "mpg123", "ndctl", "newt", "opencolorio", "openldap", "p11-kit", "pango", "pcsc-lite", "qt6-qtbase",
"qt6-qtdeclarative", "rubberband", "samba", "sndio", "talloc-python", "tslib", "unbound", "v4l-utils", "wayland",
# five the list above missed (2026-11-27): scanner drivers, libheif's dav1d plugin, the mobile broadband proxies, OpenAL's data
"sane-backends", "libheif", "libmbim", "libqmi", "openal-soft",
# FOR NOW (2026-11-27), for images of the packages built before that day: every other main package whose -libs
# the image has. Remove with the lists above once an image of rebuilt packages works without them.
"acl", "brotli", "bzip2", "c-ares", "cdparanoia", "chromaprint", "dav1d", "davs2", "efivar", "fftw", "flac",
"flite", "fluidsynth", "fribidi", "giflib", "glslang", "gsm", "hunspell", "jbig2dec", "jbigkit", "kvazaar", "lame",
"lcms2", "libaom", "libarchive", "libatasmart", "libavc1394", "libavif", "libbluray", "libbs2b", "libcap",
"libcddb", "libcdio", "libcdio-paranoia", "libdatrie", "libdc1394", "libde265", "libdeflate", "libdisplay-info",
"libei", "libevdev", "libexpat", "libfreeaptx", "libgcrypt", "libgd", "libidn2", "libiec61883", "libilbc",
"libjpeg-turbo", "liblc3", "libndp", "libopenmpt", "libpcap", "libpng", "libpsl", "libraw1394", "librist",
"libseccomp", "libsepol", "libsndfile", "libtasn1", "libtiff", "libtracefs", "libvmaf", "libvpx", "libxcvt",
"libxml2", "llama-cpp", "lmdb", "lz4", "mbedtls", "mtdev", "net-snmp", "nettle", "nss", "numactl", "oapv",
"ocl-icd", "openexr", "openjpeg", "openjph", "pcre2", "protobuf", "protobuf-c", "qpdf", "qrencode", "rabbitmq-c",
"raptor", "rav1e", "roc-toolkit", "rtmpdump", "sbc", "sdl2-compat", "serd", "shaderc", "shine", "sord",
"soundtouch", "speex", "spirv-llvm-translator", "spirv-tools", "sqlite", "srt", "svt-av1", "svt-jpeg-xs", "tdb",
"twolame", "vamp-plugin-sdk", "vvenc", "x264", "x265", "xavs2", "xxhash", "zeromq", "zvbi",
# (four the first image made with that list still lacked)
"libimobiledevice", "libnfs", "libplist", "libusbmuxd",
# the tree command, with its manual
"tree", "tree-doc",
# FOR NOW too: what clang, C++, static links and rustc need from those packages. The rebuilt base-devel brings
# what is needed by itself.
"llvm-libcxx-devel", "musl-static", "llvm-static"]
#exclude  = ["*-devel", "*-doc", "*-static"]
# never installed, even as a dependency (apk stops with a conflict if something needs it)
unwanted = ["dhcpcd"]
services = ["udevd", "udev-trigger", "udev-settle", "modules", "syslogd", "elogind", "dbus", "networkmanager", "firewalld", "dkinstall-auto"]
output   = ["iso"]
# command line only: agetty logs the live user in on tty1 and nothing graphical is started
login     = "console"
# elogind, not seatd: it registers the session, so shutting down needs no password
seat      = "elogind"
autologin = "live"

[[users]]
name     = "live"
groups   = ["wheel", "video", "render", "audio", "input", "plugdev"]
password = "empty"
