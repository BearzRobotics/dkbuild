// dkbuild gradledeps, fetch side (SPEC.md 7.4): resolves every resolvable
// configuration of every project, and the build script classpaths, so that
// Gradle downloads everything the build will need into its user home. dkbuild
// then copies those files into the shared Maven-layout store.
//
//   gradle -I gradle-resolve.gradle dkbuildResolveAll
allprojects { p ->
    p.tasks.register("dkbuildResolveAll") {
        doLast {
            p.buildscript.configurations.each { c ->
                if (c.canBeResolved) { try { c.resolve() } catch (e) { logger.warn("dkbuild: ${p.path} buildscript ${c.name}: ${e.message}") } }
            }
            p.configurations.each { c ->
                if (c.canBeResolved) { try { c.resolve() } catch (e) { logger.warn("dkbuild: ${p.path} ${c.name}: ${e.message}") } }
            }
        }
    }
}
